a.html","kind":"normal","relation":""},{"type":"concept","label":"复发预防","tag":"使用情境 / 考法","detail":"处理慢性咳嗽、便秘、排尿困难和肥胖等腹压因素。 考法线索：患者进入术后观察期，交班记录提示“术后仍有慢性咳嗽、便秘和排尿困难”。下一班应重点复评什么，什么变化需要立即上报？","ref":"教材P356—366","chapter":"第24章｜腹外疝病人的护理｜外科护理学第7版","href":"surgical/ch24-abdominal-hernia.html","kind":"normal","relation":""},{"type":"cross","label":"破伤风抗毒素（TAT）","tag":"跨章节数值 · 外科感染病人的护理","detail":"破伤风抗毒素（TAT）：治疗破伤风常用50 000～200 000 IU；暴露后预防剂量与方案须按免疫史和创口类型决定。适用条件与安全边界：过敏反应和血清病；给药前按规范评估过敏风险并备好抢救药物；注射后严密观察","ref":"教材P121—122","chapter":"第8章｜外科感染病人的护理｜外科护理学第7版","href":"surgical/ch08-surgical-infection.html","kind":"cross"},{"type":"cross","label":"破伤风免疫球蛋白（TIG）","tag":"跨章节数值 · 外科感染病人的护理","detail":"破伤风免疫球蛋白（TIG）：治疗常用3 000～6 000 IU；高风险创口预防常用250～500 IU。适用条件与安全边界：注射部位疼痛，过敏反应少见；核对既往主动免疫史和创口类型；与类毒素分部位注射","ref":"教材P121—122","chapter":"第8章｜外科感染病人的护理｜外科护理学第7版","href":"surgical/ch08-surgical-infection.html","kind":"cross"},{"type":"cross","label":"理论联系实践","tag":"跨章节 · 第一章 · 绪论","detail":"知识、技能和临床判断需要在情境中整合。 考法线索：方案题先评估再干预；新情况出现后重新评价并调整。","ref":"教材P4","chapter":"第一章｜绪论｜外科护理学第7版","href":"surgical/ch01-introduction.html","kind":"cross","relation":"评估"},{"type":"cross","label":"肠内优先","tag":"跨章节 · 外科营养支持病人的护理","detail":"胃肠道有功能并可安全使用时，优先选择肠内营养。 考法线索：患者评估资料符合“胃肠道有功能、无严重梗阻，但近期摄入不足并明显消瘦”。当前处理应先解决什么问题，护士怎样配合并评价效果？","ref":"教材P44—56","chapter":"第4章｜外科营养支持病人的护理｜外科护理学第7版","href":"surgical/ch04-nutrition-support.html","kind":"cross","relation":"评估"},{"type":"cross","label":"肠外适应证","tag":"跨章节 · 外科营养支持病人的护理","detail":"胃肠道不能满足需要时才考虑肠外营养，并评估中心静脉通路。 考法线索：患者病历中记录“严重肠梗阻、持续呕吐，胃肠道暂时不能安全使用”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","ref":"教材P44—56","chapter":"第4章｜外科营养支持病人的护理｜外科护理学第7版","href":"surgical/ch04-nutrition-support.html","kind":"cross","relation":"评估"}]},{"id":"surgical/ch25-abdominal-trauma.html","label":"腹部损伤病人的护理","title":"以“腹部损伤病人的护理”为中心｜用途、数值与跨章联系","center":"腹部损伤病人的护理","chapter":"第25章｜腹部损伤病人的护理｜外科护理学第7版","href":"surgical/ch25-abdominal-trauma.html","items":[{"type":"concept","label":"初步评估","tag":"使用情境 / 考法","detail":"先按创伤ABCDE稳定生命，再评估腹部体征。 考法线索：患者病历中记录“腹部闭合伤患者面色苍白、心率快、血压下降”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","ref":"教材P367—380","chapter":"第25章｜腹部损伤病人的护理｜外科护理学第7版","href":"surgical/ch25-abdominal-trauma.html","kind":"normal","relation":""},{"type":"concept","label":"实质脏器","tag":"使用情境 / 考法","detail":"肝脾损伤以腹腔出血和失血性休克更突出。 考法线索：患者病历中记录“左上腹外伤后腹胀、移动性浊音并进行性失血”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","ref":"教材P367—380","chapter":"第25章｜腹部损伤病人的护理｜外科护理学第7版","href":"surgical/ch25-abdominal-trauma.html","kind":"normal","relation":""},{"type":"concept","label":"空腔脏器","tag":"使用情境 / 考法","detail":"胃肠破裂更易出现腹膜刺激征和感染。 考法线索：患者病历中记录“腹部伤后板状腹、反跳痛并出现发热”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","ref":"教材P367—380","chapter":"第25章｜腹部损伤病人的护理｜外科护理学第7版","href":"surgical/ch25-abdominal-trauma.html","kind":"normal","relation":""},{"type":"concept","label":"动态观察","tag":"使用情境 / 考法","detail":"反复评估生命体征、腹部体征、血红蛋白和尿量。 考法线索：患者的记录中出现“初次检查尚稳定，但数小时后腹痛加重、血红蛋白下降和尿量减少”。这个数值或时间条件是否达到干预标准？请给出判断和下一步护理。","ref":"教材P367—380","chapter":"第25章｜腹部损伤病人的护理｜外科护理学第7版","href":"surgical/ch25-abdominal-trauma.html","kind":"normal","relation":""},{"type":"concept","label":"急救禁忌","tag":"使用情境 / 考法","detail":"禁食禁饮，不回纳外露脏器，以湿润无菌敷料保护。 考法线索：护士发现患者正在接受一项与“开放性腹伤有脏器外露，现场人员试图将其回纳”相冲突的处理。应立即制止什么，并说明可能造成的风险。","ref":"教材P367—380","chapter":"第25章｜腹部损伤病人的护理｜外科护理学第7版","href":"surgical/ch25-abdominal-trauma.html","kind":"safe","relation":""},{"type":"cross","label":"破伤风抗毒素（TAT）","tag":"跨章节数值 · 外科感染病人的护理","detail":"破伤风抗毒素（TAT）：治疗破伤风常用50 000～200 000 IU；暴露后预防剂量与方案须按免疫史和创口类型决定。适用条件与安全边界：过敏反应和血清病；给药前按规范评估过敏风险并备好抢救药物；注射后严密观察","ref":"教材P121—122","chapter":"第8章｜外科感染病人的护理｜外科护理学第7版","href":"surgical/ch08-surgical-infection.html","kind":"cross"},{"type":"cross","label":"急、亚急、慢性感染","tag":"跨章节数值 · 外科感染病人的护理","detail":"急、亚急、慢性感染：3周以内为急性感染；超过2个月为慢性感染；两者之间为亚急性感染。适用条件与安全边界：分期不能替代对脓毒症和器官功能的即时评估；同时观察体温、意识、循环、呼吸、尿量和局部病灶变化","ref":"教材P111","chapter":"第8章｜外科感染病人的护理｜外科护理学第7版","href":"surgical/ch08-surgical-infection.html","kind":"cross"},{"type":"cross","label":"常见外科疾病范围","tag":"跨章节 · 第一章 · 绪论","detail":"损伤、感染、肿瘤、畸形、梗阻及功能障碍等。 考法线索：题干给病因或病理状态时，先把它归入类别，再调用对应护理逻辑。","ref":"教材P2","chapter":"第一章｜绪论｜外科护理学第7版","href":"surgical/ch01-introduction.html","kind":"cross","relation":"感染"},{"type":"cross","label":"四个关键突破","tag":"跨章节 · 第一章 · 绪论","detail":"麻醉、无菌与抗菌、止血、输血推动外科学发展。 考法线索：不要只背年代，要把突破与它解决的临床障碍配对。","ref":"教材P2","chapter":"第一章｜绪论｜外科护理学第7版","href":"surgical/ch01-introduction.html","kind":"cross","relation":"无菌"},{"type":"cross","label":"理论联系实践","tag":"跨章节 · 第一章 · 绪论","detail":"知识、技能和临床判断需要在情境中整合。 考法线索：方案题先评估再干预；新情况出现后重新评价并调整。","ref":"教材P4","chapter":"第一章｜绪论｜外科护理学第7版","href":"surgical/ch01-introduction.html","kind":"cross","relation":"评估"}]},{"id":"surgical/ch26-gastroduodenal-disease.html","label":"胃十二指肠疾病病人的护理","title":"以“胃十二指肠疾病病人的护理”为中心｜用途、数值与跨章联系","center":"胃十二指肠疾病病人的护理","chapter":"第26章｜胃十二指肠疾病病人的护理｜外科护理学第7版","href":"surgical/ch26-gastroduodenal-disease.html","items":[{"type":"concept","label":"溃疡穿孔","tag":"使用情境 / 考法","detail":"突发刀割样上腹痛和板状腹提示穿孔。 考法线索：患者病历中记录“突发刀割样上腹痛，随后全腹板样强直”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","ref":"教材P381—394","chapter":"第26章｜胃十二指肠疾病病人的护理｜外科护理学第7版","href":"surgical/ch26-gastroduodenal-disease.html","kind":"normal","relation":""},{"type":"concept","label":"上消化道出血","tag":"使用情境 / 考法","detail":"呕血、黑便伴循环变化时先稳定循环。 考法线索：患者病历中记录“呕血黑便伴心率加快、血压下降和头晕”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","ref":"教材P381—394","chapter":"第26章｜胃十二指肠疾病病人的护理｜外科护理学第7版","href":"surgical/ch26-gastroduodenal-disease.html","kind":"normal","relation":""},{"type":"concept","label":"幽门梗阻","tag":"使用情境 / 考法","detail":"反复呕吐宿食可致低氯低钾性代谢性碱中毒。 考法线索：患者病历中记录“反复呕吐宿食并出现低氯低钾和碱中毒”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","ref":"教材P381—394","chapter":"第26章｜胃十二指肠疾病病人的护理｜外科护理学第7版","href":"surgical/ch26-gastroduodenal-disease.html","kind":"normal","relation":""},{"type":"concept","label":"倾倒综合征","tag":"使用情境 / 考法","detail":"餐后心悸出汗和腹泻与高渗食糜快速入肠有关。 考法线索：患者病历中记录“胃切除后进食不久心悸、出汗、腹痛腹泻”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","ref":"教材P381—394","chapter":"第26章｜胃十二指肠疾病病人的护理｜外科护理学第7版","href":"surgical/ch26-gastroduodenal-disease.html","kind":"normal","relation":""},{"type":"concept","label":"吻合口瘘","tag":"使用情境 / 考法","detail":"术后发热、腹痛和引流异常时不可贸然进食。 考法线索：患者进入术后观察期，交班记录提示“术后发热、腹痛加重且腹腔引流液异常”。下一班应重点复评什么，什么变化需要立即上报？","ref":"教材P381—394","chapter":"第26章｜胃十二指肠疾病病人的护理｜外科护理学第7版","href":"surgical/ch26-gastroduodenal-disease.html","kind":"normal","relation":""},{"type":"cross","label":"破伤风病情观察","tag":"跨章节数值 · 外科感染病人的护理","detail":"破伤风病情观察：专人护理，至少每4小时测量体温、脉搏和呼吸，并按需监测血压。适用条件与安全边界：刺激可诱发痉挛，喉痉挛和呼吸肌痉挛可致窒息；暗室、减少声光刺激、集中操作；备气道和抢救物品并连续评估痉挛与呼吸","ref":"教材P122—123","chapter":"第8章｜外科感染病人的护理｜外科护理学第7版","href":"surgical/ch08-surgical-infection.html","kind":"cross"},{"type":"cross","label":"尼莫地平","tag":"跨章节数值 · 颅内和椎管内血管性疾病病人的护理","detail":"尼莫地平：蛛网膜下腔出血后常用40～60 mg、每日4～6次，连用21天。适用条件与安全边界：低血压、心动过速或心动过缓、头痛；连续监测血压和心率；按时给药；避免因低血压降低脑灌注","ref":"教材P219","chapter":"第14章｜颅内和椎管内血管性疾病病人的护理｜外科护理学第7版","href":"surgical/ch14-cerebrovascular-surgery.html","kind":"cross"},{"type":"cross","label":"水钠成比例丢失","tag":"跨章节 · 第二章 · 水、电解质代谢紊乱和酸碱平衡失调病人的护理","detail":"血钠常在正常范围；先用平衡盐溶液，警惕大量生理盐水致高氯性酸中毒。 考法线索：无明显口渴而乏力、直立性低血压、低钠，方向指向低渗。","ref":"教材P8—10","chapter":"第二章｜水、电解质代谢紊乱和酸碱平衡失调病人的护理｜外科护理学第7版","href":"surgical/ch02-fluids-electrolytes-acid-base.html","kind":"cross","relation":"血压"},{"type":"cross","label":"水过多且排出不足","tag":"跨章节 · 第二章 · 水、电解质代谢紊乱和酸碱平衡失调病人的护理","detail":"稀释性低钠与脑水肿可使神经精神症状较早出现。 考法线索：胃肠丢失、长期禁食和排钾利尿后出现乏力，先查钾。","ref":"教材P13—14","chapter":"第二章｜水、电解质代谢紊乱和酸碱平衡失调病人的护理｜外科护理学第7版","href":"surgical/ch02-fluids-electrolytes-acid-base.html","kind":"cross","relation":"钾"},{"type":"cross","label":"兴奋性与动力下降","tag":"跨章节 · 第二章 · 水、电解质代谢紊乱和酸碱平衡失调病人的护理","detail":"乏力、腹胀、腱反射减弱和心电图改变；补钾必须遵守安全界限。 考法线索：题目出现无尿、快速静推或高浓度补钾，均为危险信号。","ref":"教材P14—16","chapter":"第二章｜水、电解质代谢紊乱和酸碱平衡失调病人的护理｜外科护理学第7版","href":"surgical/ch02-fluids-electrolytes-acid-base.html","kind":"cross","relation":"钾"}]},{"id":"surgical/ch27-small-intestine.html","label":"小肠疾病病人的护理","title":"以“小肠疾病病人的护理”为中心｜用途、数值与跨章联系","center":"小肠疾病病人的护理","chapter":"第27章｜小肠疾病病人的护理｜外科护理学第7版","href":"surgical/ch27-small-intestine.html","items":[{"type":"concept","label":"肠梗阻四症","tag":"使用情境 / 考法","detail":"腹痛、呕吐、腹胀和停止排气排便。 考法线索：患者病历中记录“阵发腹痛、呕吐、腹胀并停止排气排便”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","ref":"教材P395—405","chapter":"第27章｜小肠疾病病人的护理｜外科护理学第7版","href":"surgical/ch27-small-intestine.html","kind":"normal","relation":""},{"type":"concept","label":"绞窄信号","tag":"使用情境 / 考法","detail":"持续剧痛、腹膜刺激征、休克或血性引流提示肠缺血。 考法线索：患者治疗过程中突然出现“腹痛由阵发转持续剧痛，出现反跳痛、血性引流和休克”。护士首先怀疑什么危险变化，第一项处置是什么？","ref":"教材P395—405","chapter":"第27章｜小肠疾病病人的护理｜外科护理学第7版","href":"surgical/ch27-small-intestine.html","kind":"safe","relation":""},{"type":"concept","label":"机械与麻痹","tag":"使用情境 / 考法","detail":"机械性可有高调肠鸣音，麻痹性肠鸣音减弱。 考法线索：患者病历中记录“腹胀明显，肠鸣音由高调亢进转为减弱消失”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","ref":"教材P395—405","chapter":"第27章｜小肠疾病病人的护理｜外科护理学第7版","href":"surgical/ch27-small-intestine.html","kind":"normal","relation":""},{"type":"concept","label":"基础处理","tag":"使用情境 / 考法","detail":"禁食、胃肠减压、补液并纠正电解质。 考法线索：患者评估资料符合“肠梗阻患者仍进食且胃肠减压管堵塞”。当前处理应先解决什么问题，护士怎样配合并评价效果？","ref":"教材P395—405","chapter":"第27章｜小肠疾病病人的护理｜外科护理学第7版","href":"surgical/ch27-small-intestine.html","kind":"normal","relation":""},{"type":"concept","label":"肠瘘护理","tag":"使用情境 / 考法","detail":"准确计量流量、补充丢失并保护瘘口周围皮肤。 考法线索：患者的记录中出现“高流量肠瘘伴大量液体丢失和瘘口周围皮肤糜烂”。这个数值或时间条件是否达到干预标准？请给出判断和下一步护理。","ref":"教材P395—405","chapter":"第27章｜小肠疾病病人的护理｜外科护理学第7版","href":"surgical/ch27-small-intestine.html","kind":"normal","relation":""},{"type":"cross","label":"破伤风抗毒素（TAT）","tag":"跨章节数值 · 外科感染病人的护理","detail":"破伤风抗毒素（TAT）：治疗破伤风常用50 000～200 000 IU；暴露后预防剂量与方案须按免疫史和创口类型决定。适用条件与安全边界：过敏反应和血清病；给药前按规范评估过敏风险并备好抢救药物；注射后严密观察","ref":"教材P121—122","chapter":"第8章｜外科感染病人的护理｜外科护理学第7版","href":"surgical/ch08-surgical-infection.html","kind":"cross"},{"type":"cross","label":"急、亚急、慢性感染","tag":"跨章节数值 · 外科感染病人的护理","detail":"急、亚急、慢性感染：3周以内为急性感染；超过2个月为慢性感染；两者之间为亚急性感染。适用条件与安全边界：分期不能替代对脓毒症和器官功能的即时评估；同时观察体温、意识、循环、呼吸、尿量和局部病灶变化","ref":"教材P111","chapter":"第8章｜外科感染病人的护理｜外科护理学第7版","href":"surgical/ch08-surgical-infection.html","kind":"cross"},{"type":"cross","label":"理论联系实践","tag":"跨章节 · 第一章 · 绪论","detail":"知识、技能和临床判断需要在情境中整合。 考法线索：方案题先评估再干预；新情况出现后重新评价并调整。","ref":"教材P4","chapter":"第一章｜绪论｜外科护理学第7版","href":"surgical/ch01-introduction.html","kind":"cross","relation":"评估"},{"type":"cross","label":"三步判断","tag":"跨章节 · 第二章 · 水、电解质代谢紊乱和酸碱平衡失调病人的护理","detail":"先容量、再电解质、后酸碱；同时守住循环、意识和心律。 考法线索：见呕吐、肠瘘等且血钠正常，优先考虑等渗；补液首选平衡盐。","ref":"教材P7—28","chapter":"第二章｜水、电解质代谢紊乱和酸碱平衡失调病人的护理｜外科护理学第7版","href":"surgical/ch02-fluids-electrolytes-acid-base.html","kind":"cross","relation":"电解质"},{"type":"cross","label":"按病因识别","tag":"跨章节 · 第三章 · 外科休克病人的护理","detail":"低血容量、感染、心源性、神经源性和过敏性休克处理重点不同。 考法线索：血压正常不排除早期休克，脉率与脉压差往往更早变化。","ref":"教材P30—32","chapter":"第三章｜外科休克病人的护理｜外科护理学第7版","href":"surgical/ch03-shock.html","kind":"cross","relation":"休克"}]},{"id":"surgical/ch28-appendicitis.html","label":"阑尾炎病人的护理","title":"以“阑尾炎病人的护理”为中心｜用途、数值与跨章联系","center":"阑尾炎病人的护理","chapter":"第28章｜阑尾炎病人的护理｜外科护理学第7版","href":"surgical/ch28-appendicitis.html","items":[{"type":"concept","label":"典型疼痛","tag":"使用情境 / 考法","detail":"腹痛由脐周转移至右下腹，麦氏点压痛有提示意义。 考法线索：患者的记录中出现“腹痛从脐周转移至右下腹并有麦氏点压痛”。这个数值或时间条件是否达到干预标准？请给出判断和下一步护理。","ref":"教材P406—414","chapter":"第28章｜阑尾炎病人的护理｜外科护理学第7版","href":"surgical/ch28-appendicitis.html","kind":"normal","relation":""},{"type":"concept","label":"特殊人群","tag":"使用情境 / 考法","detail":"老人、儿童和孕妇表现可不典型，体征轻不等于病情轻。 考法线索：患者主诉和查体出现“高龄患者腹痛体征轻，但精神差、发热和白细胞升高”。最需要考虑哪种病情或并发症？请列出决定判断的线索。","ref":"教材P406—414","chapter":"第28章｜阑尾炎病人的护理｜外科护理学第7版","href":"surgical/ch28-appendicitis.html","kind":"safe","relation":""},{"type":"concept","label":"穿孔警示","tag":"使用情境 / 考法","detail":"疼痛短暂缓解后弥漫加重和腹膜刺激征提示穿孔。 考法线索：患者主诉和查体出现“右下腹痛短暂缓解后转为全腹持续痛和腹膜刺激征”。最需要考虑哪种病情或并发症？请列出决定判断的线索。","ref":"教材P406—414","chapter":"第28章｜阑尾炎病人的护理｜外科护理学第7版","href":"surgical/ch28-appendicitis.html","kind":"safe","relation":""},{"type":"concept","label":"术前禁忌","tag":"使用情境 / 考法","detail":"禁食禁饮，避免灌肠和强泻。 考法线索：护士发现患者正在接受一项与“疑似阑尾炎患者准备接受灌肠和强泻”相冲突的处理。应立即制止什么，并说明可能造成的风险。","ref":"教材P406—414","chapter":"第28章｜阑尾炎病人的护理｜外科护理学第7版","href":"surgical/ch28-appendicitis.html","kind":"safe","relation":""},{"type":"concept","label":"术后观察","tag":"使用情境 / 考法","detail":"发热、切口红肿渗液和疼痛加重提示感染。 考法线索：患者进入术后观察期，交班记录提示“术后持续发热、切口红肿渗液且疼痛加重”。下一班应重点复评什么，什么变化需要立即上报？","ref":"教材P406—414","chapter":"第28章｜阑尾炎病人的护理｜外科护理学第7版","href":"surgical/ch28-appendicitis.html","kind":"normal","relation":""},{"type":"cross","label":"破伤风免疫球蛋白（TIG）","tag":"跨章节数值 · 外科感染病人的护理","detail":"破伤风免疫球蛋白（TIG）：治疗常用3 000～6 000 IU；高风险创口预防常用250～500 IU。适用条件与安全边界：注射部位疼痛，过敏反应少见；核对既往主动免疫史和创口类型；与类毒素分部位注射","ref":"教材P121—122","chapter":"第8章｜外科感染病人的护理｜外科护理学第7版","href":"surgical/ch08-surgical-infection.html","kind":"cross"},{"type":"cross","label":"破伤风类毒素","tag":"跨章节数值 · 外科感染病人的护理","detail":"破伤风类毒素：已有基础免疫者受伤后可用0.5 ml加强免疫。适用条件与安全边界：局部疼痛、红肿，少见全身过敏反应；核对免疫记录和加强时间；不能用类毒素替代已发病患者的毒素中和与支持治疗","ref":"教材P121—122","chapter":"第8章｜外科感染病人的护理｜外科护理学第7版","href":"surgical/ch08-surgical-infection.html","kind":"cross"},{"type":"cross","label":"常见外科疾病范围","tag":"跨章节 · 第一章 · 绪论","detail":"损伤、感染、肿瘤、畸形、梗阻及功能障碍等。 考法线索：题干给病因或病理状态时，先把它归入类别，再调用对应护理逻辑。","ref":"教材P2","chapter":"第一章｜绪论｜外科护理学第7版","href":"surgical/ch01-introduction.html","kind":"cross","relation":"感染"},{"type":"cross","label":"按病因识别","tag":"跨章节 · 第三章 · 外科休克病人的护理","detail":"低血容量、感染、心源性、神经源性和过敏性休克处理重点不同。 考法线索：血压正常不排除早期休克，脉率与脉压差往往更早变化。","ref":"教材P30—32","chapter":"第三章｜外科休克病人的护理｜外科护理学第7版","href":"surgical/ch03-shock.html","kind":"cross","relation":"感染"},{"type":"cross","label":"补液与纠因并行","tag":"跨章节 · 第三章 · 外科休克病人的护理","detail":"快速建立静脉通路，晶体液优先，按反应追加并控制出血/感染源。 考法线索：“补液”和“纠因”不是二选一，需并行推进。","ref":"教材P35—38","chapter":"第三章｜外科休克病人的护理｜外科护理学第7版","href":"surgical/ch03-shock.html","kind":"cross","relation":"感染"}]},{"id":"surgical/ch29-colorectal-anal.html","label":"大肠和肛管疾病病人的护理","title":"以“大肠和肛管疾病病人的护理”为中心｜用途、数值与跨章联系","center":"大肠和肛管疾病病人的护理","chapter":"第29章｜大肠和肛管疾病病人的护理｜外科护理学第7版","href":"surgical/ch29-colorectal-anal.html","items":[{"type":"concept","label":"右半结肠癌","tag":"使用情境 / 考法","detail":"贫血、乏力和腹部包块较突出，梗阻较晚。 考法线索：患者病历中记录“乏力贫血、右腹包块，但较晚才出现梗阻”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","ref":"教材P415—432","chapter":"第29章｜大肠和肛管疾病病人的护理｜外科护理学第7版","href":"surgical/ch29-colorectal-anal.html","kind":"normal","relation":""},{"type":"concept","label":"左半结肠癌","tag":"使用情境 / 考法","detail":"排便习惯改变、便血和梗阻更常见。 考法线索：患者病历中记录“排便习惯改变、便血并逐渐出现左侧结肠梗阻”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","ref":"教材P415—432","chapter":"第29章｜大肠和肛管疾病病人的护理｜外科护理学第7版","href":"surgical/ch29-colorectal-anal.html","kind":"normal","relation":""},{"type":"concept","label":"造口血供","tag":"使用情境 / 考法","detail":"正常造口红润湿润，苍白、发紫或发黑需急报。 考法线索：患者进入术后观察期，交班记录提示“造口由红润转为苍白、暗紫，触之凉”。下一班应重点复评什么，什么变化需要立即上报？","ref":"教材P415—432","chapter":"第29章｜大肠和肛管疾病病人的护理｜外科护理学第7版","href":"surgical/ch29-colorectal-anal.html","kind":"normal","relation":""},{"type":"concept","label":"造口皮肤","tag":"使用情境 / 考法","detail":"底盘应贴合造口，渗漏是刺激性皮炎的重要原因。 考法线索：患者的记录中出现“造口底盘开口过大并反复渗漏，周围皮肤糜烂”。这个数值或时间条件是否达到干预标准？请给出判断和下一步护理。","ref":"教材P415—432","chapter":"第29章｜大肠和肛管疾病病人的护理｜外科护理学第7版","href":"surgical/ch29-colorectal-anal.html","kind":"normal","relation":""},{"type":"concept","label":"肛周鉴别","tag":"使用情境 / 考法","detail":"肛裂多为排便剧痛，肛周脓肿多为持续跳痛并可发热。 考法线索：患者的记录中出现“排便时撕裂样剧痛与持续跳痛伴发热需要鉴别”。这个数值或时间条件是否达到干预标准？请给出判断和下一步护理。","ref":"教材P415—432","chapter":"第29章｜大肠和肛管疾病病人的护理｜外科护理学第7版","href":"surgical/ch29-colorectal-anal.html","kind":"normal","relation":""},{"type":"cross","label":"术后优先级","tag":"跨章节 · 手术前后病人的护理","detail":"回病房先评估气道、呼吸、循环和意识。 考法线索：患者进入术后观察期，交班记录提示“术后返回病房时嗜睡、鼾声、呼吸浅慢且血氧下降”。下一班应重点复评什么，什么变化需要立即上报？","ref":"教材P92—109","chapter":"第7章｜手术前后病人的护理｜外科护理学第7版","href":"surgical/ch07-perioperative-care.html","kind":"cross","relation":"术后"},{"type":"cross","label":"引流观察","tag":"跨章节 · 手术前后病人的护理","detail":"记录量、颜色、性质与通畅度，鲜红骤增或突然停止均需评估。 考法线索：患者进入术后观察期，交班记录提示“术后引流液突然鲜红增多，随后管路又无液体流出”。下一班应重点复评什么，什么变化需要立即上报？","ref":"教材P92—109","chapter":"第7章｜手术前后病人的护理｜外科护理学第7版","href":"surgical/ch07-perioperative-care.html","kind":"cross","relation":"术后"},{"type":"cross","label":"局部感染","tag":"跨章节 · 外科感染病人的护理","detail":"红肿热痛和功能障碍常见，形成脓肿后通常需要充分引流。 考法线索：患者进入术后观察期，交班记录提示“切口红肿热痛，中央出现波动感并伴发热”。下一班应重点复评什么，什么变化需要立即上报？","ref":"教材P110—126","chapter":"第8章｜外科感染病人的护理｜外科护理学第7版","href":"surgical/ch08-surgical-infection.html","kind":"cross","relation":"术后"}]},{"id":"surgical/ch30-liver-portal-hypertension.html","label":"肝脏疾病、门静脉高压症病人的护理","title":"以“肝脏疾病、门静脉高压症病人的护理”为中心｜用途、数值与跨章联系","center":"肝脏疾病、门静脉高压症病人的护理","chapter":"第30章｜肝脏疾病、门静脉高压症病人的护理｜外科护理学第7版","href":"surgical/ch30-liver-portal-hypertension.html","items":[{"type":"concept","label":"门脉高压","tag":"使用情境 / 考法","detail":"脾大脾亢、交通支扩张和腹水是主要表现。 考法线索：患者病历中记录“脾大、血细胞减少、腹水并见腹壁静脉曲张”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","ref":"教材P433—451","chapter":"第30章｜肝脏疾病、门静脉高压症病人的护理｜外科护理学第7版","href":"surgical/ch30-liver-portal-hypertension.html","kind":"normal","relation":""},{"type":"concept","label":"曲张静脉出血","tag":"使用情境 / 考法","detail":"呕血时禁食、建立静脉通路并稳定循环。 考法线索：患者病历中记录“突发大量呕血、黑便、心率快和血压下降”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","ref":"教材P433—451","chapter":"第30章｜肝脏疾病、门静脉高压症病人的护理｜外科护理学第7版","href":"surgical/ch30-liver-portal-hypertension.html","kind":"normal","relation":""},{"type":"concept","label":"分流断流","tag":"使用情境 / 考法","detail":"分流降低门脉压力但增加肝性脑病风险。 考法线索：患者进入术后观察期，交班记录提示“门体分流术后性格改变、扑翼样震颤和意识模糊”。下一班应重点复评什么，什么变化需要立即上报？","ref":"教材P433—451","chapter":"第30章｜肝脏疾病、门静脉高压症病人的护理｜外科护理学第7版","href":"surgical/ch30-liver-portal-hypertension.html","kind":"safe","relation":""},{"type":"concept","label":"肝切除后","tag":"使用情境 / 考法","detail":"观察出血、胆汁、肝功能和意识变化。 考法线索：患者进入术后观察期，交班记录提示“肝切除术后腹腔引流鲜红增多、胆汁异常并意识改变”。下一班应重点复评什么，什么变化需要立即上报？","ref":"教材P433—451","chapter":"第30章｜肝脏疾病、门静脉高压症病人的护理｜外科护理学第7版","href":"surgical/ch30-liver-portal-hypertension.html","kind":"normal","relation":""},{"type":"concept","label":"肝脓肿","tag":"使用情境 / 考法","detail":"高热寒战、肝区痛和肝大时需抗感染并按情况引流。 考法线索：患者病历中记录“寒战高热、肝区痛和肝大，影像见液性占位”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","ref":"教材P433—451","chapter":"第30章｜肝脏疾病、门静脉高压症病人的护理｜外科护理学第7版","href":"surgical/ch30-liver-portal-hypertension.html","kind":"normal","relation":""},{"type":"cross","label":"急、亚急、慢性感染","tag":"跨章节数值 · 外科感染病人的护理","detail":"急、亚急、慢性感染：3周以内为急性感染；超过2个月为慢性感染；两者之间为亚急性感染。适用条件与安全边界：分期不能替代对脓毒症和器官功能的即时评估；同时观察体温、意识、循环、呼吸、尿量和局部病灶变化","ref":"教材P111","chapter":"第8章｜外科感染病人的护理｜外科护理学第7版","href":"surgical/ch08-surgical-infection.html","kind":"cross"},{"type":"cross","label":"气性坏疽伤口","tag":"跨章节数值 · 外科感染病人的护理","detail":"气性坏疽伤口：敞开伤口可用3%过氧化氢溶液冲洗、湿敷。适用条件与安全边界：感染可迅速扩展并引起溶血、休克和多器官功能障碍；立即隔离并配合急诊清创；严密观察疼痛、肿胀、捻发感、分泌物和循环状态","ref":"教材P124—125","chapter":"第8章｜外科感染病人的护理｜外科护理学第7版","href":"surgical/ch08-surgical-infection.html","kind":"cross"},{"type":"cross","label":"常见外科疾病范围","tag":"跨章节 · 第一章 · 绪论","detail":"损伤、感染、肿瘤、畸形、梗阻及功能障碍等。 考法线索：题干给病因或病理状态时，先把它归入类别，再调用对应护理逻辑。","ref":"教材P2","chapter":"第一章｜绪论｜外科护理学第7版","href":"surgical/ch01-introduction.html","kind":"cross","relation":"感染"},{"type":"cross","label":"水钠成比例丢失","tag":"跨章节 · 第二章 · 水、电解质代谢紊乱和酸碱平衡失调病人的护理","detail":"血钠常在正常范围；先用平衡盐溶液，警惕大量生理盐水致高氯性酸中毒。 考法线索：无明显口渴而乏力、直立性低血压、低钠，方向指向低渗。","ref":"教材P8—10","chapter":"第二章｜水、电解质代谢紊乱和酸碱平衡失调病人的护理｜外科护理学第7版","href":"surgical/ch02-fluids-electrolytes-acid-base.html","kind":"cross","relation":"血压"},{"type":"cross","label":"心脏风险突出","tag":"跨章节 · 第二章 · 水、电解质代谢紊乱和酸碱平衡失调病人的护理","detail":"四肢无力、心率慢或心律失常；严重者可心搏骤停。 考法线索：肾功能不全、挤压伤或酸中毒伴心电异常时优先处理高钾。","ref":"教材P16—18","chapter":"第二章｜水、电解质代谢紊乱和酸碱平衡失调病人的护理｜外科护理学第7版","href":"surgical/ch02-fluids-electrolytes-acid-base.html","kind":"cross","relation":"心率"}]},{"id":"surgical/ch31-biliary-disease.html","label":"胆道疾病病人的护理","title":"以“胆道疾病病人的护理”为中心｜用途、数值与跨章联系","center":"胆道疾病病人的护理","chapter":"第31章｜胆道疾病病人的护理｜外科护理学第7版","href":"surgical/ch31-biliary-disease.html","items":[{"type":"concept","label":"胆囊炎","tag":"使用情境 / 考法","detail":"右上腹痛、发热和Murphy征阳性支持急性胆囊炎。 考法线索：患者病历中记录“右上腹痛、发热并有Murphy征阳性”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","ref":"教材P452—472","chapter":"第31章｜胆道疾病病人的护理｜外科护理学第7版","href":"surgical/ch31-biliary-disease.html","kind":"normal","relation":""},{"type":"concept","label":"Charcot三联征","tag":"使用情境 / 考法","detail":"腹痛、寒战高热和黄疸提示胆管感染梗阻。 考法线索：患者主诉和查体出现“右上腹痛、寒战高热和黄疸同时出现”。最需要考虑哪种病情或并发症？请列出决定判断的线索。","ref":"教材P452—472","chapter":"第31章｜胆道疾病病人的护理｜外科护理学第7版","h oss","relation":"血压"},{"type":"cross","label":"组织灌注不足","tag":"跨章节 · 第三章 · 外科休克病人的护理","detail":"有效循环血量锐减导致微循环障碍、细胞缺氧和代谢紊乱。 考法线索：定义题要落在“有效循环血量”和“组织灌注”，不能只写低血压。","ref":"教材P30","chapter":"第三章｜外科休克病人的护理｜外科护理学第7版","href":"surgical/ch03-shock.html","kind":"cross","relation":"血压"}]},{"id":"surgical/ch32-pancreatic-disease.html","label":"胰腺疾病病人的护理","title":"以“胰腺疾病病人的护理”为中心｜用途、数值与跨章联系","center":"胰腺疾病病人的护理","chapter":"第32章｜胰腺疾病病人的护理｜外科护理学第7版","href":"surgical/ch32-pancreatic-disease.html","items":[{"type":"concept","label":"典型腹痛","tag":"使用情境 / 考法","detail":"持续上腹痛向腰背放射，屈曲位可稍缓解。 考法线索：患者主诉和查体出现“持续上腹痛向腰背放射，屈曲位稍缓解”。最需要考虑哪种病情或并发症？请列出决定判断的线索。","ref":"教材P473—487","chapter":"第32章｜胰腺疾病病人的护理｜外科护理学第7版","href":"surgical/ch32-pancreatic-disease.html","kind":"safe","relation":""},{"type":"concept","label":"严重程度","tag":"使用情境 / 考法","detail":"淀粉酶或脂肪酶高低不能单独代表病情严重度。 考法线索：患者主诉和查体出现“淀粉酶显著升高但生命体征稳定、无器官衰竭”。最需要考虑哪种病情或并发症？请列出决定判断的线索。","ref":"教材P473—487","chapter":"第32章｜胰腺疾病病人的护理｜外科护理学第7版","href":"surgical/ch32-pancreatic-disease.html","kind":"safe","relation":""},{"type":"concept","label":"早期处理","tag":"使用情境 / 考法","detail":"镇痛、补液、监测和适当营养支持是基础。 考法线索：患者评估资料符合“入院后剧痛、脱水，需要镇痛补液和严密监测”。当前处理应先解决什么问题，护士怎样配合并评价效果？","ref":"教材P473—487","chapter":"第32章｜胰腺疾病病人的护理｜外科护理学第7版","href":"surgical/ch32-pancreatic-disease.html","kind":"safe","relation":""},{"type":"concept","label":"重症警示","tag":"使用情境 / 考法","detail":"持续低血压、低氧、少尿或器官衰竭提示重症。 考法线索：患者主诉和查体出现“持续低血压、低氧、少尿并出现器官功能障碍”。最需要考虑哪种病情或并发症？请列出决定判断的线索。","ref":"教材P473—487","chapter":"第32章｜胰腺疾病病人的护理｜外科护理学第7版","href":"surgical/ch32-pancreatic-disease.html","kind":"safe","relation":""},{"type":"concept","label":"胰头癌","tag":"使用情境 / 考法","detail":"进行性无痛性黄疸、体重下降和上腹不适具有提示性。 考法线索：患者病历中记录“进行性无痛性黄疸、体重下降和上腹不适”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","ref":"教材P473—487","chapter":"第32章｜胰腺疾病病人的护理｜外科护理学第7版","href":"surgical/ch32-pancreatic-disease.html","kind":"normal","relation":""},{"type":"cross","label":"破伤风抗毒素（TAT）","tag":"跨章节数值 · 外科感染病人的护理","detail":"破伤风抗毒素（TAT）：治疗破伤风常用50 000～200 000 IU；暴露后预防剂量与方案须按免疫史和创口类型决定。适用条件与安全边界：过敏反应和血清病；给药前按规范评估过敏风险并备好抢救药物；注射后严密观察","ref":"教材P121—122","chapter":"第8章｜外科感染病人的护理｜外科护理学第7版","href":"surgical/ch08-surgical-infection.html","kind":"cross"},{"type":"cross","label":"急、亚急、慢性感染","tag":"跨章节数值 · 外科感染病人的护理","detail":"急、亚急、慢性感染：3周以内为急性感染；超过2个月为慢性感染；两者之间为亚急性感染。适用条件与安全边界：分期不能替代对脓毒症和器官功能的即时评估；同时观察体温、意识、循环、呼吸、尿量和局部病灶变化","ref":"教材P111","chapter":"第8章｜外科感染病人的护理｜外科护理学第7版","href":"surgical/ch08-surgical-infection.html","kind":"cross"},{"type":"cross","label":"理论联系实践","tag":"跨章节 · 第一章 · 绪论","detail":"知识、技能和临床判断需要在情境中整合。 考法线索：方案题先评估再干预；新情况出现后重新评价并调整。","ref":"教材P4","chapter":"第一章｜绪论｜外科护理学第7版","href":"surgical/ch01-introduction.html","kind":"cross","relation":"评估"},{"type":"cross","label":"水钠成比例丢失","tag":"跨章节 · 第二章 · 水、电解质代谢紊乱和酸碱平衡失调病人的护理","detail":"血钠常在正常范围；先用平衡盐溶液，警惕大量生理盐水致高氯性酸中毒。 考法线索：无明显口渴而乏力、直立性低血压、低钠，方向指向低渗。","ref":"教材P8—10","chapter":"第二章｜水、电解质代谢紊乱和酸碱平衡失调病人的护理｜外科护理学第7版","href":"surgical/ch02-fluids-electrolytes-acid-base.html","kind":"cross","relation":"血压"},{"type":"cross","label":"组织灌注不足","tag":"跨章节 · 第三章 · 外科休克病人的护理","detail":"有效循环血量锐减导致微循环障碍、细胞缺氧和代谢紊乱。 考法线索：定义题要落在“有效循环血量”和“组织灌注”，不能只写低血压。","ref":"教材P30","chapter":"第三章｜外科休克病人的护理｜外科护理学第7版","href":"surgical/ch03-shock.html","kind":"cross","relation":"血压"}]},{"id":"surgical/ch33-peripheral-vascular.html","label":"周围血管疾病病人的护理","title":"以“周围血管疾病病人的护理”为中心｜用途、数值与跨章联系","center":"周围血管疾病病人的护理","chapter":"第33章｜周围血管疾病病人的护理｜外科护理学第7版","href":"surgical/ch33-peripheral-vascular.html","items":[{"type":"concept","label":"急性动脉缺血","tag":"使用情境 / 考法","detail":"疼痛、苍白、无脉、感觉运动异常和皮温下降是危急线索。 考法线索：患者病历中记录“下肢突发剧痛、苍白、无脉、麻木无力且皮温下降”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","ref":"教材P488—502","chapter":"第33章｜周围血管疾病病人的护理｜外科护理学第7版","href":"surgical/ch33-peripheral-vascular.html","kind":"normal","relation":""},{"type":"concept","label":"脉管炎","tag":"使用情境 / 考法","detail":"年轻吸烟男性出现间歇性跛行和足趾缺血时戒烟最关键。 考法线索：患者病历中记录“年轻吸烟男性反复间歇性跛行并有足趾缺血”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","ref":"教材P488—502","chapter":"第33章｜周围血管疾病病人的护理｜外科护理学第7版","href":"surgical/ch33-peripheral-vascular.html","kind":"normal","relation":""},{"type":"concept","label":"静脉曲张","tag":"使用情境 / 考法","detail":"弹力治疗前需排除严重动脉缺血。 考法线索：患者病历中记录“拟使用弹力袜，但足背动脉弱且踝肱指数明显下降”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","ref":"教材P488—502","chapter":"第33章｜周围血管疾病病人的护理｜外科护理学第7版","href":"surgical/ch33-peripheral-vascular.html","kind":"normal","relation":""},{"type":"concept","label":"深静脉血栓","tag":"使用情境 / 考法","detail":"急性期避免按摩，突发胸痛呼吸困难警惕肺栓塞。 考法线索：患者病历中记录“下肢肿痛患者被按摩后突发胸痛和呼吸困难”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","ref":"教材P488—502","chapter":"第33章｜周围血管疾病病人的护理｜外科护理学第7版","href":"surgical/ch33-peripheral-vascular.html","kind":"safe","relation":""},{"type":"concept","label":"抗凝护理","tag":"使用情境 / 考法","detail":"观察出血、血小板和凝血指标，避免自行加减药。 考法线索：患者病历中记录“抗凝期间牙龈出血、皮下瘀斑且血小板下降”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","ref":"教材P488—502","chapter":"第33章｜周围血管疾病病人的护理｜外科护理学第7版","href":"surgical/ch33-peripheral-vascular.html","kind":"safe","relation":""},{"type":"cross","label":"破伤风免疫球蛋白（TIG）","tag":"跨章节数值 · 外科感染病人的护理","detail":"破伤风免疫球蛋白（TIG）：治疗常用3 000～6 000 IU；高风险创口预防常用250～500 IU。适用条件与安全边界：注射部位疼痛，过敏反应少见；核对既往主动免疫史和创口类型；与类毒素分部位注射","ref":"教材P121—122","chapter":"第8章｜外科感染病人的护理｜外科护理学第7版","href":"surgical/ch08-surgical-infection.html","kind":"cross"},{"type":"cross","label":"破伤风类毒素","tag":"跨章节数值 · 外科感染病人的护理","detail":"破伤风类毒素：已有基础免疫者受伤后可用0.5 ml加强免疫。适用条件与安全边界：局部疼痛、红肿，少见全身过敏反应；核对免疫记录和加强时间；不能用类毒素替代已发病患者的毒素中和与支持治疗","ref":"教材P121—122","chapter":"第8章｜外科感染病人的护理｜外科护理学第7版","href":"surgical/ch08-surgical-infection.html","kind":"cross"},{"type":"cross","label":"HCO₃⁻原发下降","tag":"跨章节 · 第二章 · 水、电解质代谢紊乱和酸碱平衡失调病人的护理","detail":"深大呼吸、灌注不足、酸性产物积聚；纠因和改善循环是根本。 考法线索：先看pH，再看哪一项变化能解释方向，最后考虑代偿。","ref":"教材P22—24","chapter":"第二章｜水、电解质代谢紊乱和酸碱平衡失调病人的护理｜外科护理学第7版","href":"surgical/ch02-fluids-electrolytes-acid-base.html","kind":"cross","relation":"呼吸"},{"type":"cross","label":"失H⁺或HCO₃⁻增多","tag":"跨章节 · 第二章 · 水、电解质代谢紊乱和酸碱平衡失调病人的护理","detail":"呕吐、胃肠减压和低钾常见；补液、补氯和补钾需结合病因。 考法线索：先抓病因，再用呼吸深浅和化验确认。","ref":"教材P24—25","chapter":"第二章｜水、电解质代谢紊乱和酸碱平衡失调病人的护理｜外科护理学第7版","href":"surgical/ch02-fluids-electrolytes-acid-base.html","kind":"cross","relation":"呼吸"},{"type":"cross","label":"PaCO₂原发改变","tag":"跨章节 · 第二章 · 水、电解质代谢紊乱和酸碱平衡失调病人的护理","detail":"通气不足致呼酸；过度通气致呼碱，处理首先回到通气原因。 考法线索：呼吸系统问题先解决通气，不能只追着pH补药。","ref":"教材P25—28","chapter":"第二章｜水、电解质代谢紊乱和酸碱平衡失调病人的护理｜外科护理学第7版","href":"surgical/ch02-fluids-electrolytes-acid-base.html","kind":"cross","relation":"呼吸"}]},{"id":"surgical/ch34-urinary-trauma.html","label":"泌尿系统损伤病人的护理","title":"以“泌尿系统损伤病人的护理”为中心｜用途、数值与跨章联系","center":"泌尿系统损伤病人的护理","chapter":"第34章｜泌尿系统损伤病人的护理｜外科护理学第7版","href":"surgical/ch34-urinary-trauma.html","items":[{"type":"concept","label":"肾损伤","tag":"使用情境 / 考法","detail":"血尿多少不能单独判断严重程度，无血尿也不能完全排除。 考法线索：患者病历中记录“肾区外伤后血尿不明显，但血压下降和腰部肿胀加重”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","ref":"教材P503—514","chapter":"第34章｜泌尿系统损伤病人的护理｜外科护理学第7版","href":"surgical/ch34-urinary-trauma.html","kind":"safe","relation":""},{"type":"concept","label":"膀胱破裂","tag":"使用情境 / 考法","detail":"下腹痛、排尿困难和腹膜刺激征提示尿外渗。 考法线索：患者病历中记录“下腹痛、排尿困难并出现腹膜刺激征”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","ref":"教材P503—514","chapter":"第34章｜泌尿系统损伤病人的护理｜外科护理学第7版","href":"surgical/ch34-urinary-trauma.html","kind":"normal","relation":""},{"type":"concept","label":"尿道损伤","tag":"使用情境 / 考法","detail":"尿道口滴血、会阴血肿和排尿困难是重要线索。 考法线索：患者病历中记录“骨盆骨折后尿道口滴血、会阴血肿和排尿困难”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","ref":"教材P503—514","chapter":"第34章｜泌尿系统损伤病人的护理｜外科护理学第7版","href":"surgical/ch34-urinary-trauma.html","kind":"normal","relation":""},{"type":"concept","label":"导尿禁忌","tag":"使用情境 / 考法","detail":"怀疑尿道断裂时避免盲目插入尿管。 考法线索：护士发现患者正在接受一项与“怀疑尿道断裂时仍准备盲目插入导尿管”相冲突的处理。应立即制止什么，并说明可能造成的风险。","ref":"教材P503—514","chapter":"第34章｜泌尿系统损伤病人的护理｜外科护理学第7版","href":"surgical/ch34-urinary-trauma.html","kind":"safe","relation":""},{"type":"concept","label":"引流观察","tag":"使用情境 / 考法","detail":"突发无尿先排查管路扭曲、堵塞和血块。 考法线索：患者进入术后观察期，交班记录提示“导尿或造瘘引流突然停止，管路见扭曲和血块”。下一班应重点复评什么，什么变化需要立即上报？","ref":"教材P503—514","chapter":"第34章｜泌尿系统损伤病人的护理｜外科护理学第7版","href":"surgical/ch34-urinary-trauma.html","kind":"normal","relation":""},{"type":"cross","label":"破伤风病情观察","tag":"跨章节数值 · 外科感染病人的护理","detail":"破伤风病情观察：专人护理，至少每4小时测量体温、脉搏和呼吸，并按需监测血压。适用条件与安全边界：刺激可诱发痉挛，喉痉挛和呼吸肌痉挛可致窒息；暗室、减少声光刺激、集中操作；备气道和抢救物品并连续评估痉挛与呼吸","ref":"教材P122—123","chapter":"第8章｜外科感染病人的护理｜外科护理学第7版","href":"surgical/ch08-surgical-infection.html","kind":"cross"},{"type":"cross","label":"尼莫地平","tag":"跨章节数值 · 颅内和椎管内血管性疾病病人的护理","detail":"尼莫地平：蛛网膜下腔出血后常用40～60 mg、每日4～6次，连用21天。适用条件与安全边界：低血压、心动过速或心动过缓、头痛；连续监测血压和心率；按时给药；避免因低血压降低脑灌注","ref":"教材P219","chapter":"第14章｜颅内和椎管内血管性疾病病人的护理｜外科护理学第7版","href":"surgical/ch14-cerebrovascular-surgery.html","kind":"cross"},{"type":"cross","label":"水钠成比例丢失","tag":"跨章节 · 第二章 · 水、电解质代谢紊乱和酸碱平衡失调病人的护理","detail":"血钠常在正常范围；先用平衡盐溶液，警惕大量生理盐水致高氯性酸中毒。 考法线索：无明显口渴而乏力、直立性低血压、低钠，方向指向低渗。","ref":"教材P8—10","chapter":"第二章｜水、电解质代谢紊乱和酸碱平衡失调病人的护理｜外科护理学第7版","href":"surgical/ch02-fluids-electrolytes-acid-base.html","kind":"cross","relation":"血压"},{"type":"cross","label":"组织灌注不足","tag":"跨章节 · 第三章 · 外科休克病人的护理","detail":"有效循环血量锐减导致微循环障碍、细胞缺氧和代谢紊乱。 考法线索：定义题要落在“有效循环血量”和“组织灌注”，不能只写低血压。","ref":"教材P30","chapter":"第三章｜外科休克病人的护理｜外科护理学第7版","href":"surgical/ch03-shock.html","kind":"cross","relation":"血压"},{"type":"cross","label":"按病因识别","tag":"跨章节 · 第三章 · 外科休克病人的护理","detail":"低血容量、感染、心源性、神经源性和过敏性休克处理重点不同。 考法线索：血压正常不排除早期休克，脉率与脉压差往往更早变化。","ref":"教材P30—32","chapter":"第三章｜外科休克病人的护理｜外科护理学第7版","href":"surgical/ch03-shock.html","kind":"cross","relation":"血压"}]},{"id":"surgical/ch35-urinary-stones.html","label":"泌尿系统结石病人的护理","title":"以“泌尿系统结石病人的护理”为中心｜用途、数值与跨章联系","center":"泌尿系统结石病人的护理","chapter":"第35章｜泌尿系统结石病人的护理｜外科护理学第7版","href":"surgical/ch35-urinary-stones.html","items":[{"type":"concept","label":"肾绞痛","tag":"使用情境 / 考法","detail":"突发腰腹绞痛向腹股沟放射并伴血尿提示输尿管结石。 考法线索：患者病历中记录“突发腰腹绞痛向腹股沟放射并伴肉眼血尿”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","ref":"教材P515—524","chapter":"第35章｜泌尿系统结石病人的护理｜外科护理学第7版","href":"surgical/ch35-urinary-stones.html","kind":"normal","relation":""},{"type":"concept","label":"感染梗阻","tag":"使用情境 / 考法","detail":"结石伴高热寒战和尿路梗阻属于急症。 考法线索：患者病历中记录“结石梗阻同时出现高热寒战、低血压和尿量下降”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","ref":"教材P515—524","chapter":"第35章｜泌尿系统结石病人的护理｜外科护理学第7版","href":"surgical/ch35-urinary-stones.html","kind":"normal","relation":""},{"type":"concept","label":"结石留取","tag":"使用情境 / 考法","detail":"过滤尿液取得结石用于成分分析和个体化预防。 考法线索：患者病历中记录“排石期间未过滤尿液，无法取得结石标本”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","ref":"教材P515—524","chapter":"第35章｜泌尿系统结石病人的护理｜外科护理学第7版","href":"surgical/ch35-urinary-stones.html","kind":"normal","relation":""},{"type":"concept","label":"碎石术后","tag":"使用情境 / 考法","detail":"观察血尿、排石、疼痛和发热，持续高热需复诊。 考法线索：患者进入术后观察期，交班记录提示“碎石术后持续高热、疼痛加重且血尿不减”。下一班应重点复评什么，什么变化需要立即上报？","ref":"教材P515—524","chapter":"第35章｜泌尿系统结石病人的护理｜外科护理学第7版","href":"surgical/ch35-urinary-stones.html","kind":"normal","relation":""},{"type":"concept","label":"饮食预防","tag":"使用情境 / 考法","detail":"根据结石成分调整饮食，不能对所有患者一概禁钙。 考法线索：患者病历中记录“患者不清楚结石成分便长期完全禁钙”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","ref":"教材P515—524","chapter":"第35章｜泌尿系统结石病人的护理｜外科护理学第7版","href":"surgical/ch35-urinary-stones.html","kind":"safe","relation":""},{"type":"cross","label":"破伤风免疫球蛋白（TIG）","tag":"跨章节数值 · 外科感染病人的护理","detail":"破伤风免疫球蛋白（TIG）：治疗常用3 000～6 000 IU；高风险创口预防常用250～500 IU。适用条件与安全边界：注射部位疼痛，过敏反应少见；核对既往主动免疫史和创口类型；与类毒素分部位注射","ref":"教材P121—122","chapter":"第8章｜外科感染病人的护理｜外科护理学第7版","href":"surgical/ch08-surgical-infection.html","kind":"cross"},{"type":"cross","label":"破伤风类毒素","tag":"跨章节数值 · 外科感染病人的护理","detail":"破伤风类毒素：已有基础免疫者受伤后可用0.5 ml加强免疫。适用条件与安全边界：局部疼痛、红肿，少见全身过敏反应；核对免疫记录和加强时间；不能用类毒素替代已发病患者的毒素中和与支持治疗","ref":"教材P121—122","chapter":"第8章｜外科感染病人的护理｜外科护理学第7版","href":"surgical/ch08-surgical-infection.html","kind":"cross"},{"type":"cross","label":"常见外科疾病范围","tag":"跨章节 · 第一章 · 绪论","detail":"损伤、感染、肿瘤、畸形、梗阻及功能障碍等。 考法线索：题干给病因或病理状态时，先把它归入类别，再调用对应护理逻辑。","ref":"教材P2","chapter":"第一章｜绪论｜外科护理学第7版","href":"surgical/ch01-introduction.html","kind":"cross","relation":"感染"},{"type":"cross","label":"水钠成比例丢失","tag":"跨章节 · 第二章 · 水、电解质代谢紊乱和酸碱平衡失调病人的护理","detail":"血钠常在正常范围；先用平衡盐溶液，警惕大量生理盐水致高氯性酸中毒。 考法线索：无明显口渴而乏力、直立性低血压、低钠，方向指向低渗。","ref":"教材P8—10","chapter":"第二章｜水、电解质代谢紊乱和酸碱平衡失调病人的护理｜外科护理学第7版","href":"surgical/ch02-fluids-electrolytes-acid-base.html","kind":"cross","relation":"血压"},{"type":"cross","label":"组织灌注不足","tag":"跨章节 · 第三章 · 外科休克病人的护理","detail":"有效循环血量锐减导致微循环障碍、细胞缺氧和代谢紊乱。 考法线索：定义题要落在“有效循环血量”和“组织灌注”，不能只写低血压。","ref":"教材P30","chapter":"第三章｜外科休克病人的护理｜外科护理学第7版","href":"surgical/ch03-shock.html","kind":"cross","relation":"血压"}]},{"id":"surgical/ch36-urologic-tumors-bph.html","label":"泌尿、男性生殖系统增生和肿瘤病人的护理","title":"以“泌尿、男性生殖系统增生和肿瘤病人的护理”为中心｜用途、数值与跨章联系","center":"泌尿、男性生殖系统增生和肿瘤病人的护理","chapter":"第36章｜泌尿、男性生殖系统增生和肿瘤病人的护理｜外科护理学第7版","href":"surgical/ch36-urologic-tumors-bph.html","items":[{"type":"concept","label":"前列腺增生","tag":"使用情境 / 考法","detail":"尿频、夜尿、尿线细和排尿困难可逐渐进展为尿潴留。 考法线索：患者病历中记录“夜尿增多、尿线变细和排尿困难，随后完全尿潴留”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","ref":"教材P525—540","chapter":"第36章｜泌尿、男性生殖系统增生和肿瘤病人的护理｜外科护理学第7版","href":"surgical/ch36-urologic-tumors-bph.html","kind":"normal","relation":""},{"type":"concept","label":"TURP综合征","tag":"使用情境 / 考法","detail":"冲洗液吸收可导致低钠、循环负荷和神经症状。 考法线索：患者病历中记录“TURP持续冲洗期间头痛、恶心、意识改变并低钠”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","ref":"教材P525—540","chapter":"第36章｜泌尿、男性生殖系统增生和肿瘤病人的护理｜外科护理学第7版","href":"surgical/ch36-urologic-tumors-bph.html","kind":"normal","relation":""},{"type":"concept","label":"膀胱癌","tag":"使用情境 / 考法","detail":"无痛性肉眼血尿是经典警示，间歇出现也不能忽视。 考法线索：患者病历中记录“间歇性无痛肉眼血尿反复出现”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","ref":"教材P525—540","chapter":"第36章｜泌尿、男性生殖系统增生和肿瘤病人的护理｜外科护理学第7版","href":"surgical/ch36-urologic-tumors-bph.html","kind":"safe","relation":""},{"type":"concept","label":"肾癌","tag":"使用情境 / 考法","detail":"血尿、腰痛、肿块三联征出现齐全时常已较晚。 考法线索：患者病历中记录“血尿、腰痛和肾区肿块同时出现”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","ref":"教材P525—540","chapter":"第36章｜泌尿、男性生殖系统增生和肿瘤病人的护理｜外科护理学第7版","href":"surgical/ch36-urologic-tumors-bph.html","kind":"normal","relation":""},{"type":"concept","label":"前列腺癌","tag":"使用情境 / 考法","detail":"骨痛需排查骨转移，确诊依赖病理。 考法线索：患者病历中记录“前列腺癌患者新发持续骨痛和活动受限”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","ref":"教材P525—540","chapter":"第36章｜泌尿、男性生殖系统增生和肿瘤病人的护理｜外科护理学第7版","href":"surgical/ch36-urologic-tumors-bph.html","kind":"normal","relation":""},{"type":"cross","label":"常见外科疾病范围","tag":"跨章节 · 第一章 · 绪论","detail":"损伤、感染、肿瘤、畸形、梗阻及功能障碍等。 考法线索：题干给病因或病理状态时，先把它归入类别，再调用对应护理逻辑。","ref":"教材P2","chapter":"第一章｜绪论｜外科护理学第7版","href":"surgical/ch01-introduction.html","kind":"cross","relation":"肿瘤"},{"type":"cross","label":"三步判断","tag":"跨章节 · 第二章 · 水、电解质代谢紊乱和酸碱平衡失调病人的护理","detail":"先容量、再电解质、后酸碱；同时守住循环、意识和心律。 考法线索：见呕吐、肠瘘等且血钠正常，优先考虑等渗；补液首选平衡盐。","ref":"教材P7—28","chapter":"第二章｜水、电解质代谢紊乱和酸碱平衡失调病人的护理｜外科护理学第7版","href":"surgical/ch02-fluids-electrolytes-acid-base.html","kind":"cross","relation":"钠"},{"type":"cross","label":"水钠成比例丢失","tag":"跨章节 · 第二章 · 水、电解质代谢紊乱和酸碱平衡失调病人的护理","detail":"血钠常在正常范围；先用平衡盐溶液，警惕大量生理盐水致高氯性酸中毒。 考法线索：无明显口渴而乏力、直立性低血压、低钠，方向指向低渗。","ref":"教材P8—10","chapter":"第二章｜水、电解质代谢紊乱和酸碱平衡失调病人的护理｜外科护理学第7版","href":"surgical/ch02-fluids-electrolytes-acid-base.html","kind":"cross","relation":"钠"}]},{"id":"surgical/ch37-genitourinary-tuberculosis.html","label":"泌尿、男性生殖系统结核病人的护理","title":"以“泌尿、男性生殖系统结核病人的护理”为中心｜用途、数值与跨章联系","center":"泌尿、男性生殖系统结核病人的护理","chapter":"第37章｜泌尿、男性生殖系统结核病人的护理｜外科护理学第7版","href":"surgical/ch37-genitourinary-tuberculosis.html","items":[{"type":"concept","label":"肾结核线索","tag":"使用情境 / 考法","detail":"顽固尿频尿急尿痛、血尿和无菌性脓尿具有提示性。 考法线索：患者病历中记录“长期尿频尿急尿痛、血尿，尿培养阴性但有脓尿”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","ref":"教材P541—548","chapter":"第37章｜泌尿、男性生殖系统结核病人的护理｜外科护理学第7版","href":"surgical/ch37-genitourinary-tuberculosis.html","kind":"normal","relation":""},{"type":"concept","label":"传播特点","tag":"使用情境 / 考法","detail":"结核多由血行播散先到肾，再向输尿管和膀胱扩展。 考法线索：患者病历中记录“肾结核后逐渐出现输尿管狭窄和膀胱刺激征”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","ref":"教材P541—548","chapter":"第37章｜泌尿、男性生殖系统结核病人的护理｜外科护理学第7版","href":"surgical/ch37-genitourinary-tuberculosis.html","kind":"normal","relation":""},{"type":"concept","label":"药物治疗","tag":"使用情境 / 考法","detail":"多药联合、规律和全程是基础，症状缓解不能自行停药。 考法线索：患者主诉和查体出现“症状缓解后患者自行停止联合抗结核治疗”。最需要考虑哪种病情或并发症？请列出决定判断的线索。","ref":"教材P541—548","chapter":"第37章｜泌尿、男性生殖系统结核病人的护理｜外科护理学第7版","href":"surgical/ch37-genitourinary-tuberculosis.html","kind":"safe","relation":""},{"type":"concept","label":"附睾结核","tag":"使用情境 / 考法","detail":"无痛性硬结和输精管串珠样改变具有提示性。 考法线索：患者病历中记录“附睾无痛硬结并触及输精管串珠样改变”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","ref":"教材P541—548","chapter":"第37章｜泌尿、男性生殖系统结核病人的护理｜外科护理学第7版","href":"surgical/ch37-genitourinary-tuberculosis.html","kind":"normal","relation":""},{"type":"concept","label":"长期随访","tag":"使用情境 / 考法","detail":"复查尿液、影像和肾功能，关注对侧肾和尿路狭窄。 考法线索：患者病历中记录“随访发现对侧肾功能下降和尿路狭窄”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","ref":"教材P541—548","chapter":"第37章｜泌尿、男性生殖系统结核病人的护理｜外科护理学第7版","href":"surgical/ch37-genitourinary-tuberculosis.html","kind":"normal","relation":""},{"type":"cross","label":"破伤风抗毒素（TAT）","tag":"跨章节数值 · 外科感染病人的护理","detail":"破伤风抗毒素（TAT）：治疗破伤风常用50 000～200 000 IU；暴露后预防剂量与方案须按免疫史和创口类型决定。适用条件与安全边界：过敏反应和血清病；给药前按规范评估过敏风险并备好抢救药物；注射后严密观察","ref":"教材P121—122","chapter":"第8章｜外科感染病人的护理｜外科护理学第7版","href":"surgical/ch08-surgical-infection.html","kind":"cross"},{"type":"cross","label":"四个关键突破","tag":"跨章节 · 第一章 · 绪论","detail":"麻醉、无菌与抗菌、止血、输血推动外科学发展。 考法线索：不要只背年代，要把突破与它解决的临床障碍配对。","ref":"教材P2","chapter":"第一章｜绪论｜外科护理学第7版","href":"surgical/ch01-introduction.html","kind":"cross","relation":"无菌"},{"type":"cross","label":"灭菌选择","tag":"跨章节 · 手术室管理和工作","detail":"进入无菌组织的器械必须灭菌，耐热耐湿器械优先压力蒸汽灭菌。 考法线索：患者病历中记录“无菌包外层潮湿，器械包化学指示未达到要求”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","ref":"教材P57—73","chapter":"第5章｜手术室管理和工作｜外科护理学第7版","href":"surgical/ch05-operating-room.html","kind":"cross","relation":"无菌"},{"type":"cross","label":"无菌台原则","tag":"跨章节 · 手术室管理和工作","detail":"无菌台须干燥、完整并始终处于视线范围内。 考法线索：患者病历中记录“截石位手术时间较长，腓总神经受压部位保护不足”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","ref":"教材P57—73","chapter":"第5章｜手术室管理和工作｜外科护理学第7版","href":"surgical/ch05-operating-room.html","kind":"cross","relation":"无菌"}]},{"id":"surgical/ch38-adrenal-disease.html","label":"肾上腺疾病病人的护理","title":"以“肾上腺疾病病人的护理”为中心｜用途、数值与跨章联系","center":"肾上腺疾病病人的护理","chapter":"第38章｜肾上腺疾病病人的护理｜外科护理学第7版","href":"surgical/ch38-adrenal-disease.html","items":[{"type":"concept","label":"皮质醇增多","tag":"使用情境 / 考法","detail":"向心性肥胖、满月脸、紫纹、高血压和高血糖具有提示性。 考法线索：患者病历中记录“向心性肥胖、满月脸、紫纹并伴高血压高血糖”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","ref":"教材P549—557","chapter":"第38章｜肾上腺疾病病人的护理｜外科护理学第7版","href":"surgical/ch38-adrenal-disease.html","kind":"normal","relation":""},{"type":"concept","label":"原醛症","tag":"使用情境 / 考法","detail":"高血压合并低钾、肌无力和多尿需警惕。 考法线索：患者病历中记录“顽固高血压伴低钾、肌无力和多尿”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","ref":"教材P549—557","chapter":"第38章｜肾上腺疾病病人的护理｜外科护理学第7版","href":"surgical/ch38-adrenal-disease.html","kind":"safe","relation":""},{"type":"concept","label":"嗜铬细胞瘤","tag":"使用情境 / 考法","detail":"高血压伴头痛、心悸和多汗是经典组合。 考法线索：患者病历中记录“阵发高血压同时出现头痛、心悸和大汗”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","ref":"教材P549—557","chapter":"第38章｜肾上腺疾病病人的护理｜外科护理学第7版","href":"surgical/ch38-adrenal-disease.html","kind":"normal","relation":""},{"type":"concept","label":"术前阻滞","tag":"使用情境 / 考法","detail":"嗜铬细胞瘤应先充分使用α受体阻滞并扩充容量。 考法线索：患者病历中记录“嗜铬细胞瘤患者未充分α阻滞便拟直接加用β阻滞”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","ref":"教材P549—557","chapter":"第38章｜肾上腺疾病病人的护理｜外科护理学第7版","href":"surgical/ch38-adrenal-disease.html","kind":"normal","relation":""},{"type":"concept","label":"术后危象","tag":"使用情境 / 考法","detail":"切除后可出现低血压，双侧手术还需防肾上腺危象。 考法线索：患者治疗过程中突然出现“肾上腺切除后血压骤降，双侧手术者出现乏力呕吐”。护士首先怀疑什么危险变化，第一项处置是什么？","ref":"教材P549—557","chapter":"第38章｜肾上腺疾病病人的护理｜外科护理学第7版","href":"surgical/ch38-adrenal-disease.html","kind":"safe","relation":""},{"type":"cross","label":"破伤风病情观察","tag":"跨章节数值 · 外科感染病人的护理","detail":"破伤风病情观察：专人护理，至少每4小时测量体温、脉搏和呼吸，并按需监测血压。适用条件与安全边界：刺激可诱发痉挛，喉痉挛和呼吸肌痉挛可致窒息；暗室、减少声光刺激、集中操作；备气道和抢救物品并连续评估痉挛与呼吸","ref":"教材P122—123","chapter":"第8章｜外科感染病人的护理｜外科护理学第7版","href":"surgical/ch08-surgical-infection.html","kind":"cross"},{"type":"cross","label":"尼莫地平","tag":"跨章节数值 · 颅内和椎管内血管性疾病病人的护理","detail":"尼莫地平：蛛网膜下腔出血后常用40～60 mg、每日4～6次，连用21天。适用条件与安全边界：低血压、心动过速或心动过缓、头痛；连续监测血压和心率；按时给药；避免因低血压降低脑灌注","ref":"教材P219","chapter":"第14章｜颅内和椎管内血管性疾病病人的护理｜外科护理学第7版","href":"surgical/ch14-cerebrovascular-surgery.html","kind":"cross"},{"type":"cross","label":"水钠成比例丢失","tag":"跨章节 · 第二章 · 水、电解质代谢紊乱和酸碱平衡失调病人的护理","detail":"血钠常在正常范围；先用平衡盐溶液，警惕大量生理盐水致高氯性酸中毒。 考法线索：无明显口渴而乏力、直立性低血压、低钠，方向指向低渗。","ref":"教材P8—10","chapter":"第二章｜水、电解质代谢紊乱和酸碱平衡失调病人的护理｜外科护理学第7版","href":"surgical/ch02-fluids-electrolytes-acid-base.html","kind":"cross","relation":"血压"},{"type":"cross","label":"水过多且排出不足","tag":"跨章节 · 第二章 · 水、电解质代谢紊乱和酸碱平衡失调病人的护理","detail":"稀释性低钠与脑水肿可使神经精神症状较早出现。 考法线索：胃肠丢失、长期禁食和排钾利尿后出现乏力，先查钾。","ref":"教材P13—14","chapter":"第二章｜水、电解质代谢紊乱和酸碱平衡失调病人的护理｜外科护理学第7版","href":"surgical/ch02-fluids-electrolytes-acid-base.html","kind":"cross","relation":"钾"},{"type":"cross","label":"兴奋性与动力下降","tag":"跨章节 · 第二章 · 水、电解质代谢紊乱和酸碱平衡失调病人的护理","detail":"乏力、腹胀、腱反射减弱和心电图改变；补钾必须遵守安全界限。 考法线索：题目出现无尿、快速静推或高浓度补钾，均为危险信号。","ref":"教材P14—16","chapter":"第二章｜水、电解质代谢紊乱和酸碱平衡失调病人的护理｜外科护理学第7版","href":"surgical/ch02-fluids-electrolytes-acid-base.html","kind":"cross","relation":"钾"}]},{"id":"surgical/ch39-fracture.html","label":"骨折病人的护理","title":"以“骨折病人的护理”为中心｜用途、数值与跨章联系","center":"骨折病人的护理","chapter":"第39章｜骨折病人的护理｜外科护理学第7版","href":"surgical/ch39-fracture.html","items":[{"type":"concept","label":"专有体征","tag":"使用情境 / 考法","detail":"畸形、反常活动和骨擦音具有特异性，但不应故意诱发。 考法线索：患者主诉和查体出现“受伤肢体畸形、反常活动和骨擦感，但检查者仍反复诱发骨擦音”。最需要考虑哪种病情或并发症？请列出决定判断的线索。","ref":"教材P558—590","chapter":"第39章｜骨折病人的护理｜外科护理学第7版","href":"surgical/ch39-fracture.html","kind":"safe","relation":""},{"type":"concept","label":"急救固定","tag":"使用情境 / 考法","detail":"开放伤先覆盖止血，固定上下关节并比较远端血运。 考法线索：患者病历中记录“开放性骨折出血，未固定便准备转运”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","ref":"教材P558—590","chapter":"第39章｜骨折病人的护理｜外科护理学第7版","href":"surgical/ch39-fracture.html","kind":"normal","relation":""},{"type":"concept","label":"筋膜室综合征","tag":"使用情境 / 考法","detail":"进行性剧痛、被动牵拉痛和感觉异常是早期警报。 考法线索：患者病历中记录“骨折后疼痛进行性加重，被动牵拉痛明显并有感觉异常”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","ref":"教材P558—590","chapter":"第39章｜骨折病人的护理｜外科护理学第7版","href":"surgical/ch39-fracture.html","kind":"normal","relation":""},{"type":"concept","label":"脂肪栓塞","tag":"使用情境 / 考法","detail":"长骨骨折后呼吸困难、神经改变和皮肤瘀点需警惕。 考法线索：患者病历中记录“长骨骨折后突发呼吸困难、意识变化和胸前瘀点”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","ref":"教材P558—590","chapter":"第39章｜骨折病人的护理｜外科护理学第7版","href":"surgical/ch39-fracture.html","kind":"safe","relation":""},{"type":"concept","label":"石膏护理","tag":"使用情境 / 考法","detail":"持续疼痛、麻木或肢端血运异常提示压迫。 考法线索：患者病历中记录“石膏固定后持续疼痛、麻木、肢端苍白发凉”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","ref":"教材P558—590","chapter":"第39章｜骨折病人的护理｜外科护理学第7版","href":"surgical/ch39-fracture.html","kind":"normal","relation":""},{"type":"cross","label":"破伤风免疫球蛋白（TIG）","tag":"跨章节数值 · 外科感染病人的护理","detail":"破伤风免疫球蛋白（TIG）：治疗常用3 000～6 000 IU；高风险创口预防常用250～500 IU。适用条件与安全边界：注射部位疼痛，过敏反应少见；核对既往主动免疫史和创口类型；与类毒素分部位注射","ref":"教材P121—122","chapter":"第8章｜外科感染病人的护理｜外科护理学第7版","href":"surgical/ch08-surgical-infection.html","kind":"cross"},{"type":"cross","label":"破伤风类毒素","tag":"跨章节数值 · 外科感染病人的护理","detail":"破伤风类毒素：已有基础免疫者受伤后可用0.5 ml加强免疫。适用条件与安全边界：局部疼痛、红肿，少见全身过敏反应；核对免疫记录和加强时间；不能用类毒素替代已发病患者的毒素中和与支持治疗","ref":"教材P121—122","chapter":"第8章｜外科感染病人的护理｜外科护理学第7版","href":"surgical/ch08-surgical-infection.html","kind":"cross"},{"type":"cross","label":"HCO₃⁻原发下降","tag":"跨章节 · 第二章 · 水、电解质代谢紊乱和酸碱平衡失调病人的护理","detail":"深大呼吸、灌注不足、酸性产物积聚；纠因和改善循环是根本。 考法线索：先看pH，再看哪一项变化能解释方向，最后考虑代偿。","ref":"教材P22—24","chapter":"第二章｜水、电解质代谢紊乱和酸碱平衡失调病人的护理｜外科护理学第7版","href":"surgical/ch02-fluids-electrolytes-acid-base.html","kind":"cross","relation":"呼吸"},{"type":"cross","label":"失H⁺或HCO₃⁻增多","tag":"跨章节 · 第二章 · 水、电解质代谢紊乱和酸碱平衡失调病人的护理","detail":"呕吐、胃肠减压和低钾常见；补液、补氯和补钾需结合病因。 考法线索：先抓病因，再用呼吸深浅和化验确认。","ref":"教材P24—25","chapter":"第二章｜水、电解质代谢紊乱和酸碱平衡失调病人的护理｜外科护理学第7版","href":"surgical/ch02-fluids-electrolytes-acid-base.html","kind":"cross","relation":"呼吸"},{"type":"cross","label":"PaCO₂原发改变","tag":"跨章节 · 第二章 · 水、电解质代谢紊乱和酸碱平衡失调病人的护理","detail":"通气不足致呼酸；过度通气致呼碱，处理首先回到通气原因。 考法线索：呼吸系统问题先解决通气，不能只追着pH补药。","ref":"教材P25—28","chapter":"第二章｜水、电解质代谢紊乱和酸碱平衡失调病人的护理｜外科护理学第7版","href":"surgical/ch02-fluids-electrolytes-acid-base.html","kind":"cross","relation":"呼吸"}]},{"id":"surgical/ch40-joint-dislocation.html","label":"关节脱位病人的护理","title":"以“关节脱位病人的护理”为中心｜用途、数值与跨章联系","center":"关节脱位病人的护理","chapter":"第40章｜关节脱位病人的护理｜外科护理学第7版","href":"surgical/ch40-joint-dislocation.html","items":[{"type":"concept","label":"典型表现","tag":"使用情境 / 考法","detail":"关节畸形、弹性固定和功能障碍提示脱位。 考法线索：患者主诉和查体出现“受伤关节畸形、弹性固定并完全失去正常活动”。最需要考虑哪种病情或并发症？请列出决定判断的线索。","ref":"教材P591—600","chapter":"第40章｜关节脱位病人的护理｜外科护理学第7版","href":"surgical/ch40-joint-dislocation.html","kind":"safe","relation":""},{"type":"concept","label":"肩关节脱位","tag":"使用情境 / 考法","detail":"方肩畸形和Dugas征阳性具有提示性。 考法线索：患者病历中记录“肩部外伤后方肩畸形且Dugas征阳性”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","ref":"教材P591—600","chapter":"第40章｜关节脱位病人的护理｜外科护理学第7版","href":"surgical/ch40-joint-dislocation.html","kind":"normal","relation":""},{"type":"concept","label":"髋关节后脱位","tag":"使用情境 / 考法","detail":"患肢屈曲、内收、内旋和短缩是经典体位。 考法线索：患者进入术后观察期，交班记录提示“髋部外伤后患肢屈曲、内收、内旋并短缩”。下一班应重点复评什么，什么变化需要立即上报？","ref":"教材P591—600","chapter":"第40章｜关节脱位病人的护理｜外科护理学第7版","href":"surgical/ch40-joint-dislocation.html","kind":"normal","relation":""},{"type":"concept","label":"复位前后","tag":"使用情境 / 考法","detail":"必须比较远端神经和血管状态。 考法线索：患者病历中记录“复位前未记录远端脉搏和感觉，复位后患者诉麻木”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","ref":"教材P591—600","chapter":"第40章｜关节脱位病人的护理｜外科护理学第7版","href":"surgical/ch40-joint-dislocation.html","kind":"normal","relation":""},{"type":"concept","label":"功能训练","tag":"使用情境 / 考法","detail":"固定期练等长收缩，解除后逐步恢复活动。 考法线索：患者治疗过程中突然出现“固定期完全不做肌肉收缩，解除固定后立即强力活动”。护士首先怀疑什么危险变化，第一项处置是什么？","ref":"教材P591—600","chapter":"第40章｜关节脱位病人的护理｜外科护理学第7版","href":"surgical/ch40-joint-dislocation.html","kind":"safe","relation":""},{"type":"cross","label":"破伤风病情观察","tag":"跨章节数值 · 外科感染病人的护理","detail":"破伤风病情观察：专人护理，至少每4小时测量体温、脉搏和呼吸，并按需监测血压。适用条件与安全边界：刺激可诱发痉挛，喉痉挛和呼吸肌痉挛可致窒息；暗室、减少声光刺激、集中操作；备气道和抢救物品并连续评估痉挛与呼吸","ref":"教材P122—123","chapter":"第8章｜外科感染病人的护理｜外科护理学第7版","href":"surgical/ch08-surgical-infection.html","kind":"cross"},{"type":"cross","label":"趋势胜过单点","tag":"跨章节 · 第三章 · 外科休克病人的护理","detail":"意识、皮温色泽、脉搏、血压、脉压、尿量需连续观察。 考法线索：心率110、收缩压90，指数约1.22，不可被“还有血压”误导。","ref":"教材P33—36","chapter":"第三章｜外科休克病人的护理｜外科护理学第7版","href":"surgical/ch03-shock.html","kind":"cross","relation":"脉搏"},{"type":"cross","label":"中凹卧位","tag":"跨章节 · 第三章 · 外科休克病人的护理","detail":"头胸抬高20°—30°，下肢抬高15°—20°，兼顾呼吸和回心血量。 考法线索：体位角度和氧疗参数是常见数字考点。","ref":"教材P37","chapter":"第三章｜外科休克病人的护理｜外科护理学第7版","href":"surgical/ch03-shock.html","kind":"cross","relation":"体位"},{"type":"cross","label":"手术体位","tag":"跨章节 · 手术室管理和工作","detail":"既要暴露术野，也要保护神经、骨隆突、呼吸和循环。 考法线索：患者病历中记录“关腹前纱布清点数目与术前记录不一致”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","ref":"教材P57—73","chapter":"第5章｜手术室管理和工作｜外科护理学第7版","href":"surgical/ch05-operating-room.html","kind":"cross","relation":"体位"}]},{"id":"surgical/ch41-hand-injury-replantation.html","label":"手外伤及断肢/指再植病人的护理","title":"以“手外伤及断肢/指再植病人的护理”为中心｜用途、数值与跨章联系","center":"手外伤及断肢/指再植病人的护理","chapter":"第41章｜手外伤及断肢/指再植病人的护理｜外科护理学第7版","href":"surgical/ch41-hand-injury-replantation.html","items":[{"type":"concept","label":"手功能评估","tag":"使用情境 / 考法","detail":"分别检查血供、感觉、主动运动和肌腱连续性。 考法线索：患者病历中记录“手外伤后指端苍白、感觉减退且不能主动屈指”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","ref":"教材P601—610","chapter":"第41章｜手外伤及断肢/指再植病人的护理｜外科护理学第7版","href":"surgical/ch41-hand-injury-replantation.html","kind":"safe","relation":""},{"type":"concept","label":"断肢保存","tag":"使用情境 / 考法","detail":"敷料包裹后置密闭袋，再低温保存，避免直接接触冰水。 考法线索：患者病历中记录“离断手指直接浸泡在冰水中送院”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","ref":"教材P601—610","chapter":"第41章｜手外伤及断肢/指再植病人的护理｜外科护理学第7版","href":"surgical/ch41-hand-injury-replantation.html","kind":"safe","relation":""},{"type":"concept","label":"止血原则","tag":"使用情境 / 考法","detail":"以加压包扎为主，止血带必须记录时间。 考法线索：患者病历中记录“伤口加压后仍渗血，止血带使用时间未记录”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","ref":"教材P601—610","chapter":"第41章｜手外伤及断肢/指再植病人的护理｜外科护理学第7版","href":"surgical/ch41-hand-injury-replantation.html","kind":"normal","relation":""},{"type":"concept","label":"再植循环","tag":"使用情境 / 考法","detail":"苍白偏冷提示动脉危象，暗紫肿胀提示静脉危象。 考法线索：患者病历中记录“再植指体由红润转苍白发凉，随后又暗紫肿胀”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","ref":"教材P601—610","chapter":"第41章｜手外伤及断肢/指再植病人的护理｜外科护理学第7版","href":"surgical/ch41-hand-injury-replantation.html","kind":"normal","relation":""},{"type":"concept","label":"康复训练","tag":"使用情境 / 考法","detail":"修复组织允许后分期活动，预防粘连和僵硬。 考法线索：患者病历中记录“肌腱修复后长期不活动，出现明显粘连和关节僵硬”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","ref":"教材P601—610","chapter":"第41章｜手外伤及断肢/指再植病人的护理｜外科护理学第7版","href":"surgical/ch41-hand-injury-replantation.html","kind":"normal","relation":""},{"type":"cross","label":"破伤风抗毒素（TAT）","tag":"跨章节数值 · 外科感染病人的护理","detail":"破伤风抗毒素（TAT）：治疗破伤风常用50 000～200 000 IU；暴露后预防剂量与方案须按免疫史和创口类型决定。适用条件与安全边界：过敏反应和血清病；给药前按规范评估过敏风险并备好抢救药物；注射后严密观察","ref":"教材P121—122","chapter":"第8章｜外科感染病人的护理｜外科护理学第7版","href":"surgical/ch08-surgical-infection.html","kind":"cross"},{"type":"cross","label":"急、亚急、慢性感染","tag":"跨章节数值 · 外科感染病人的护理","detail":"急、亚急、慢性感染：3周以内为急性感染；超过2个月为慢性感染；两者之间为亚急性感染。适用条件与安全边界：分期不能替代对脓毒症和器官功能的即时评估；同时观察体温、意识、循环、呼吸、尿量和局部病灶变化","ref":"教材P111","chapter":"第8章｜外科感染病人的护理｜外科护理学第7版","href":"surgical/ch08-surgical-infection.html","kind":"cross"},{"type":"cross","label":"理论联系实践","tag":"跨章节 · 第一章 · 绪论","detail":"知识、技能和临床判断需要在情境中整合。 考法线索：方案题先评估再干预；新情况出现后重新评价并调整。","ref":"教材P4","chapter":"第一章｜绪论｜外科护理学第7版","href":"surgical/ch01-introduction.html","kind":"cross","relation":"评估"},{"type":"cross","label":"肠内优先","tag":"跨章节 · 外科营养支持病人的护理","detail":"胃肠道有功能并可安全使用时，优先选择肠内营养。 考法线索：患者评估资料符合“胃肠道有功能、无严重梗阻，但近期摄入不足并明显消瘦”。当前处理应先解决什么问题，护士怎样配合并评价效果？","ref":"教材P44—56","chapter":"第4章｜外科营养支持病人的护理｜外科护理学第7版","href":"surgical/ch04-nutrition-support.html","kind":"cross","relation":"评估"},{"type":"cross","label":"肠外适应证","tag":"跨章节 · 外科营养支持病人的护理","detail":"胃肠道不能满足需要时才考虑肠外营养，并评估中心静脉通路。 考法线索：患者病历中记录“严重肠梗阻、持续呕吐，胃肠道暂时不能安全使用”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","ref":"教材P44—56","chapter":"第4章｜外科营养支持病人的护理｜外科护理学第7版","href":"surgical/ch04-nutrition-support.html","kind":"cross","relation":"评估"}]},{"id":"surgical/ch42-disc-herniation.html","label":"椎间盘突出症病人的护理","title":"以“椎间盘突出症病人的护理”为中心｜用途、数值与跨章联系","center":"椎间盘突出症病人的护理","chapter":"第42章｜椎间盘突出症病人的护理｜外科护理学第7版","href":"surgical/ch42-disc-herniation.html","items":[{"type":"concept","label":"腰椎间盘突出","tag":"使用情境 / 考法","detail":"腰痛向下肢放射和直腿抬高试验阳性提示神经根受压。 考法线索：患者病历中记录“腰痛向一侧下肢放射且直腿抬高试验阳性”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","ref":"教材P611—623","chapter":"第42章｜椎间盘突出症病人的护理｜外科护理学第7版","href":"surgical/ch42-disc-herniation.html","kind":"normal","relation":""},{"type":"concept","label":"马尾综合征","tag":"使用情境 / 考法","detail":"会阴麻木、大小便障碍和双下肢无力属于急症。 考法线索：患者病历中记录“会阴麻木、大小便障碍并双下肢无力”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","ref":"教材P611—623","chapter":"第42章｜椎间盘突出症病人的护理｜外科护理学第7版","href":"surgical/ch42-disc-herniation.html","kind":"normal","relation":""},{"type":"concept","label":"颈椎受压","tag":"使用情境 / 考法","detail":"上肢根性痛提示神经根型，步态不稳提示脊髓受压。 考法线索：患者病历中记录“颈肩痛伴上肢放射痛，后来出现步态不稳”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","ref":"教材P611—623","chapter":"第42章｜椎间盘突出症病人的护理｜外科护理学第7版","href":"surgical/ch42-disc-herniation.html","kind":"normal","relation":""},{"type":"concept","label":"保守护理","tag":"使用情境 / 考法","detail":"急性期减负荷，缓解后进行核心肌与姿势训练。 考法线索：患者病历中记录“急性疼痛缓解后仍长期卧床、不做核心肌训练”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","ref":"教材P611—623","chapter":"第42章｜椎间盘突出症病人的护理｜外科护理学第7版","href":"surgical/ch42-disc-herniation.html","kind":"normal","relation":""},{"type":"concept","label":"术后观察","tag":"使用情境 / 考法","detail":"新发无力、剧痛、脑脊液漏或排尿异常需急查。 考法线索：患者进入术后观察期，交班记录提示“术后新发肢体无力、剧痛、切口流清液和排尿异常”。下一班应重点复评什么，什么变化需要立即上报？","ref":"教材P611—623","chapter":"第42章｜椎间盘突出症病人的护理｜外科护理学第7版","href":"surgical/ch42-disc-herniation.html","kind":"normal","relation":""},{"type":"cross","label":"破伤风免疫球蛋白（TIG）","tag":"跨章节数值 · 外科感染病人的护理","detail":"破伤风免疫球蛋白（TIG）：治疗常用3 000～6 000 IU；高风险创口预防常用250～500 IU。适用条件与安全边界：注射部位疼痛，过敏反应少见；核对既往主动免疫史和创口类型；与类毒素分部位注射","ref":"教材P121—122","chapter":"第8章｜外科感染病人的护理｜外科护理学第7版","href":"surgical/ch08-surgical-infection.html","kind":"cross"},{"type":"cross","label":"破伤风类毒素","tag":"跨章节数值 · 外科感染病人的护理","detail":"破伤风类毒素：已有基础免疫者受伤后可用0.5 ml加强免疫。适用条件与安全边界：局部疼痛、红肿，少见全身过敏反应；核对免疫记录和加强时间；不能用类毒素替代已发病患者的毒素中和与支持治疗","ref":"教材P121—122","chapter":"第8章｜外科感染病人的护理｜外科护理学第7版","href":"surgical/ch08-surgical-infection.html","kind":"cross"},{"type":"cross","label":"清点制度","tag":"跨章节 · 手术室管理和工作","detail":"器械、敷料和缝针在关键节点共同清点，数目不符不得贸然关切口。 考法线索：患者病历中记录“感染手术结束后器械、污物与普通手术物品混放”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","ref":"教材P57—73","chapter":"第5章｜手术室管理和工作｜外科护理学第7版","href":"surgical/ch05-operating-room.html","kind":"cross","relation":"切口"},{"type":"cross","label":"全麻苏醒","tag":"跨章节 · 麻醉病人的护理","detail":"先保证气道通畅，再评估呼吸、循环、意识、疼痛和恶心呕吐。 考法线索：患者病历中记录“全麻苏醒期鼾声加重、舌后坠并出现血氧下降”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","ref":"教材P74—91","chapter":"第6章｜麻醉病人的护理｜外科护理学第7版","href":"surgical/ch06-anesthesia.html","kind":"cross","relation":"疼痛"},{"type":"cross","label":"术后优先级","tag":"跨章节 · 手术前后病人的护理","detail":"回病房先评估气道、呼吸、循环和意识。 考法线索：患者进入术后观察期，交班记录提示“术后返回病房时嗜睡、鼾声、呼吸浅慢且血氧下降”。下一班应重点复评什么，什么变化需要立即上报？","ref":"教材P92—109","chapter":"第7章｜手术前后病人的护理｜外科护理学第7版","href":"surgical/ch07-perioperative-care.html","kind":"cross","relation":"术后"}]},{"id":"surgical/ch43-bone-joint-infection.html","label":"骨与关节感染病人的护理","title":"以“骨与关节感染病人的护理”为中心｜用途、数值与跨章联系","center":"骨与关节感染病人的护理","chapter":"第43章｜骨与关节感染病人的护理｜外科护理学第7版","href":"surgical/ch43-bone-joint-infection.html","items":[{"type":"concept","label":"急性骨髓炎","tag":"使用情境 / 考法","detail":"儿童长骨干骺端剧痛、高热和局部压痛具有提示性。 考法线索：患者病历中记录“儿童长骨干骺端剧痛、高热和局部压痛”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","ref":"教材P624—642","chapter":"第43章｜骨与关节感染病人的护理｜外科护理学第7版","href":"surgical/ch43-bone-joint-infection.html","kind":"normal","relation":""},{"type":"concept","label":"慢性骨髓炎","tag":"使用情境 / 考法","detail":"窦道、死骨和反复流脓是典型线索。 考法线索：患者病历中记录“骨部窦道反复流脓，影像见死骨”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","ref":"教材P624—642","chapter":"第43章｜骨与关节感染病人的护理｜外科护理学第7版","href":"surgical/ch43-bone-joint-infection.html","kind":"normal","relation":""},{"type":"concept","label":"化脓性关节炎","tag":"使用情境 / 考法","detail":"高热、关节剧痛和活动受限需紧急引流抗感染。 考法线索：患者病历中记录“高热、单个关节剧痛肿胀且活动严重受限”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","ref":"教材P624—642","chapter":"第43章｜骨与关节感染病人的护理｜外科护理学第7版","href":"surgical/ch43-bone-joint-infection.html","kind":"normal","relation":""},{"type":"concept","label":"骨关节结核","tag":"使用情境 / 考法","detail":"低热盗汗、慢性疼痛和寒性脓肿常较隐匿。 考法线索：患者出现“低热盗汗、慢性关节痛并形成寒性脓肿”。请用病理变化解释这一表现，并指出护理观察的
