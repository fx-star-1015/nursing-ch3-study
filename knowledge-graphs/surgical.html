:root{--ink:#30283b;--muted:#7c7187;--purple:#7352b5;--line:#e2d6f1;--bg:#f7f3fb;--teal:#dff3ee;--gold:#fff2cf}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "Microsoft YaHei","PingFang SC",system-ui,sans-serif}.wrap{max-width:1200px;margin:auto;padding:16px}.hero{padding:23px 27px;border-radius:22px;color:white;background:linear-gradient(120deg,#553b8c,#8866bd)}.hero small{letter-spacing:.1em}.hero h1{margin:5px 0;font-size:clamp(26px,4vw,38px)}.hero p{margin:0;opacity:.92}.course-nav{display:flex;gap:8px;overflow:auto;padding:10px 0}.course-nav a{white-space:nowrap;text-decoration:none;background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 12px;color:var(--purple);font-weight:700;font-size:13px}.course-nav a.on{color:white;background:var(--purple)}.tabs{display:flex;gap:8px;margin:3px 0 10px;flex-wrap:wrap}.tabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 14px;color:var(--purple);font-weight:700;cursor:pointer}.tabs button.active{background:var(--purple);color:white}.map-select{margin:0 0 12px;display:flex;gap:8px}.map-select input,.map-select select{min-width:0;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:white;color:var(--ink);font:inherit}.map-select input{flex:1}.map-select select{flex:1.2}.layout{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(285px,.8fr);gap:14px}.panel{min-width:0;background:white;border:1px solid var(--line);border-radius:19px;padding:16px;box-shadow:0 10px 28px #4931660c}.panel h2{font-size:18px;margin:0 0 4px}.sub{color:var(--muted);font-size:13px;margin:0 0 5px}.map{width:100%;height:auto;display:block}.edge{stroke:#c9b8df;stroke-width:2.5}.edge.active{stroke:#7752b7;stroke-width:4}.node{cursor:pointer}.node rect{fill:#fff;stroke:#d9caec;stroke-width:1.5;rx:14}.node.center rect{fill:#7150ae;stroke:#7150ae}.node.center text{fill:#fff;font-weight:800}.node text{fill:#352b42;font:700 14px "Micros </style></head><body><main class="wrap"><header class="hero"><small>ICE冰冰·高分学姐团｜全书关系图</small><h1>外科护理学知识点关系图</h1><p>从疾病或围手术期概念出发，连接专科数据、护理情境和风险边界。</p></header><nav class="course-nav"><a href="fundamentals.html" class="">基础护理</a><a href="introduction.html" class="">护理导论</a><a href="medical.html" class="">内科护理</a><a href="surgical.html" class="on">外科护理</a></nav><div class="tabs" id="quick"></div><div class="map-select"><input id="searchMap" placeholder="搜中心概念、章节或参数"><select id="mapPick" aria-label="选择知识图谱"></select></div><section class="layout"><div class="panel"><h2 id="mapTitle"></h2><p class="sub">点选分支查看数值、用途、条件、安全边界和教材依据。</p><svg class="map" id="graph" viewBox="0 0 720 468" role="img" aria-label="外科护理学中心概念关系图"></svg><div class="pager"><button id="prev">‹ 上一组</button><span id="pageText"></span><button id="next">下一组 ›</button></div><div class="legend"><span><i class="dot"></i>中心概念</span><span><i class="dot2"></i>关键参数 / 关联考点</span><span><i class="dot3"></i>安全边界</span><span><i class="dot4"></i>跨章节联系</span></div></div><aside class="panel detail" id="detail"></aside></section><p class="footer">数值节点保留页面整理中的原值、条件和教材页码；不凭空补数。跨章节联系按共同主题词推荐，复习时可打开来源章节核对。</p></main><script>
const MAPS=[{"id":"surgical/ch01-introduction.html","label":"第一章 · 绪论","title":"以“第一章 · 绪论”为中心｜用途、数值与跨章联系","center":"第一章 · 绪论","chapter":"第一章｜绪论｜外科护理学第7版","href":"surgical/ch01-introduction.html","items":[{"type":"concept","label":"外科护理学研究什么","tag":"使用情境 / 考法","detail":"研究外科病人的整体护理，贯穿疾病预防、治疗、康复及健康促进。 考法线索：遇到定义题要同时抓住对象、整体性和临床护理学科三个要素。","ref":"教材P2","chapter":"第一章｜绪论｜外科护理学第7版","href":"surgical/ch01-introduction.html","kind":"normal","relation":""},{"type":"concept","label":"常见外科疾病范围","tag":"使用情境 / 考法","detail":"损伤、感染、肿瘤、畸形、梗阻及功能障碍等。 考法线索：题干给病因或病理状态时，先把它归入类别，再调用对应护理逻辑。","ref":"教材P2","chapter":"第一章｜绪论｜外科护理学第7版","href":"surgical/ch01-introduction.html","kind":"normal","relation":""},{"type":"concept","label":"四个关键突破","tag":"使用情境 / 考法","detail":"麻醉、无菌与抗菌、止血、输血推动外科学发展。 考法线索：不要只背年代，要把突破与它解决的临床障碍配对。","ref":"教材P2","chapter":"第一章｜绪论｜外科护理学第7版","href":"surgical/ch01-introduction.html","kind":"safe","relation":""},{"type":"concept","label":"南丁格尔的贡献","tag":"使用情境 / 考法","detail":"克里米亚战争中通过环境与护理改革显著降低伤员病死率。 考法线索：数字题要连同措施和意义一起记，避免只认人名。","ref":"教材P2","chapter":"第一章｜绪论｜外科护理学第7版","href":"surgical/ch01-introduction.html","kind":"safe","relation":""},{"type":"concept","label":"现代护理观","tag":"使用情境 / 考法","detail":"以人为中心，用护理程序提供个体化整体护理。 考法线索：出现出院随访、康复指导或家庭支持时，判断为连续护理的延伸。","ref":"教材P3—4","chapter":"第一章｜绪论｜外科护理学第7版","href":"surgical/ch01-introduction.html","kind":"normal","relation":""},{"type":"concept","label":"连续与协同","tag":"使用情境 / 考法","detail":"从医院延伸至社区和家庭，强调多学科协作。 考法线索：最佳护理通常不是只处理生理指标，而是兼顾安全、参与和尊严。","ref":"教材P3","chapter":"第一章｜绪论｜外科护理学第7版","href":"surgical/ch01-introduction.html","kind":"normal","relation":""},{"type":"concept","label":"理论联系实践","tag":"使用情境 / 考法","detail":"知识、技能和临床判断需要在情境中整合。 考法线索：方案题先评估再干预；新情况出现后重新评价并调整。","ref":"教材P4","chapter":"第一章｜绪论｜外科护理学第7版","href":"surgical/ch01-introduction.html","kind":"normal","relation":""},{"type":"concept","label":"专业胜任力","tag":"使用情境 / 考法","detail":"观察、操作、沟通、应急、决策与持续学习相互支撑。 考法线索：题干出现个体差异时，不选机械套用常规的选项。","ref":"教材P4—5","chapter":"第一章｜绪论｜外科护理学第7版","href":"surgical/ch01-introduction.html","kind":"normal","relation":""},{"type":"concept","label":"慎独与责任","tag":"使用情境 / 考法","detail":"维护生命尊严、权益与安全，诚实负责。 考法线索：辨析题注意“专业素质”不是单纯操作熟练。","ref":"教材P5","chapter":"第一章｜绪论｜外科护理学第7版","href":"surgical/ch01-introduction.html","kind":"safe","relation":""},{"type":"concept","label":"身心与人文素养","tag":"使用情境 / 考法","detail":"稳定体能、情绪调节和人文关怀是专业表现的一部分。 考法线索：优先题先处理威胁生命的问题，同时明确护士独立与协作职责。","ref":"教材P5—6","chapter":"第一章｜绪论｜外科护理学第7版","href":"surgical/ch01-introduction.html","kind":"normal","relation":""},{"type":"cross","label":"破伤风抗毒素（TAT）","tag":"跨章节数值 · 外科感染病人的护理","detail":"破伤风抗毒素（TAT）：治疗破伤风常用50 000～200 000 IU；暴露后预防剂量与方案须按免疫史和创口类型决定。适用条件与安全边界：过敏反应和血清病；给药前按规范评估过敏风险并备好抢救药物；注射后严密观察","ref":"教材P121—122","chapter":"第8章｜外科感染病人的护理｜外科护理学第7版","href":"surgical/ch08-surgical-infection.html","kind":"cross"},{"type":"cross","label":"急、亚急、慢性感染","tag":"跨章节数值 · 外科感染病人的护理","detail":"急、亚急、慢性感染：3周以内为急性感染；超过2个月为慢性感染；两者之间为亚急性感染。适用条件与安全边界：分期不能替代对脓毒症和器官功能的即时评估；同时观察体温、意识、循环、呼吸、尿量和局部病灶变化","ref":"教材P111","chapter":"第8章｜外科感染病人的护理｜外科护理学第7版","href":"surgical/ch08-surgical-infection.html","kind":"cross"},{"type":"cross","label":"兴奋性与动力下降","tag":"跨章节 · 第二章 · 水、电解质代谢紊乱和酸碱平衡失调病人的护理","detail":"乏力、腹胀、腱反射减弱和心电图改变；补钾必须遵守安全界限。 考法线索：题目出现无尿、快速静推或高浓度补钾，均为危险信号。","ref":"教材P14—16","chapter":"第二章｜水、电解质代谢紊乱和酸碱平衡失调病人的护理｜外科护理学第7版","href":"surgical/ch02-fluids-electrolytes-acid-base.html","kind":"cross","relation":"安全"},{"type":"cross","label":"按病因识别","tag":"跨章节 · 第三章 · 外科休克病人的护理","detail":"低血容量、感染、心源性、神经源性和过敏性休克处理重点不同。 考法线索：血压正常不排除早期休克，脉率与脉压差往往更早变化。","ref":"教材P30—32","chapter":"第三章｜外科休克病人的护理｜外科护理学第7版","href":"surgical/ch03-shock.html","kind":"cross","relation":"感染"},{"type":"cross","label":"补液与纠因并行","tag":"跨章节 · 第三章 · 外科休克病人的护理","detail":"快速建立静脉通路，晶体液优先，按反应追加并控制出血/感染源。 考法线索：“补液”和“纠因”不是二选一，需并行推进。","ref":"教材P35—38","chapter":"第三章｜外科休克病人的护理｜外科护理学第7版","href":"surgical/ch03-shock.html","kind":"cross","relation":"感染"}]},{"id":"surgical/ch02-fluids-electrolytes-acid-base.html","label":"第二章 · 水、电解质代谢紊乱和酸碱平衡失调病人的护理","title":"以“第二章 · 水、电解质代谢紊乱和酸碱平衡失调病人的护理”为中心｜用途、数值与跨章联系","center":"第二章 · 水、电解质代谢紊乱和酸碱平衡失调病人的护理","chapter":"第二章｜水、电解质代谢紊乱和酸碱平衡失调病人的护理｜外科护理学第7版","href":"surgical/ch02-fluids-electrolytes-acid-base.html","items":[{"type":"concept","label":"三步判断","tag":"使用情境 / 考法","detail":"先容量、再电解质、后酸碱；同时守住循环、意识和心律。 考法线索：见呕吐、肠瘘等且血钠正常，优先考虑等渗；补液首选平衡盐。","ref":"教材P7—28","chapter":"第二章｜水、电解质代谢紊乱和酸碱平衡失调病人的护理｜外科护理学第7版","href":"surgical/ch02-fluids-electrolytes-acid-base.html","kind":"normal","relation":""},{"type":"concept","label":"水钠成比例丢失","tag":"使用情境 / 考法","detail":"血钠常在正常范围；先用平衡盐溶液，警惕大量生理盐水致高氯性酸中毒。 考法线索：无明显口渴而乏力、直立性低血压、低钠，方向指向低渗。","ref":"教材P8—10","chapter":"第二章｜水、电解质代谢紊乱和酸碱平衡失调病人的护理｜外科护理学第7版","href":"surgical/ch02-fluids-electrolytes-acid-base.html","kind":"safe","relation":""},{"type":"concept","label":"失钠多于失水","tag":"使用情境 / 考法","detail":"血钠<135 mmol/L，常无明显口渴；严重时循环和神经症状突出。 考法线索：明显口渴、高钠和细胞脱水表现相互印证；补水不可过快。","ref":"教材P10—11","chapter":"第二章｜水、电解质代谢紊乱和酸碱平衡失调病人的护理｜外科护理学第7版","href":"surgical/ch02-fluids-electrolytes-acid-base.html","kind":"normal","relation":""},{"type":"concept","label":"失水多于失钠","tag":"使用情境 / 考法","detail":"血钠>150 mmol/L，口渴明显；先补水分，分次纠正。 考法线索：大量低渗液输入后出现头痛、躁动、意识改变，先考虑急性水中毒。","ref":"教材P12—13","chapter":"第二章｜水、电解质代谢紊乱和酸碱平衡失调病人的护理｜外科护理学第7版","href":"surgical/ch02-fluids-electrolytes-acid-base.html","kind":"normal","relation":""},{"type":"concept","label":"水过多且排出不足","tag":"使用情境 / 考法","detail":"稀释性低钠与脑水肿可使神经精神症状较早出现。 考法线索：胃肠丢失、长期禁食和排钾利尿后出现乏力，先查钾。","ref":"教材P13—14","chapter":"第二章｜水、电解质代谢紊乱和酸碱平衡失调病人的护理｜外科护理学第7版","href":"surgical/ch02-fluids-electrolytes-acid-base.html","kind":"normal","relation":""},{"type":"concept","label":"兴奋性与动力下降","tag":"使用情境 / 考法","detail":"乏力、腹胀、腱反射减弱和心电图改变；补钾必须遵守安全界限。 考法线索：题目出现无尿、快速静推或高浓度补钾，均为危险信号。","ref":"教材P14—16","chapter":"第二章｜水、电解质代谢紊乱和酸碱平衡失调病人的护理｜外科护理学第7版","href":"surgical/ch02-fluids-electrolytes-acid-base.html","kind":"safe","relation":""},{"type":"concept","label":"心脏风险突出","tag":"使用情境 / 考法","detail":"四肢无力、心率慢或心律失常；严重者可心搏骤停。 考法线索：肾功能不全、挤压伤或酸中毒伴心电异常时优先处理高钾。","ref":"教材P16—18","chapter":"第二章｜水、电解质代谢紊乱和酸碱平衡失调病人的护理｜外科护理学第7版","href":"surgical/ch02-fluids-electrolytes-acid-base.html","kind":"normal","relation":""},{"type":"concept","label":"HCO₃⁻原发下降","tag":"使用情境 / 考法","detail":"深大呼吸、灌注不足、酸性产物积聚；纠因和改善循环是根本。 考法线索：先看pH，再看哪一项变化能解释方向，最后考虑代偿。","ref":"教材P22—24","chapter":"第二章｜水、电解质代谢紊乱和酸碱平衡失调病人的护理｜外科护理学第7版","href":"surgical/ch02-fluids-electrolytes-acid-base.html","kind":"normal","relation":""},{"type":"concept","label":"失H⁺或HCO₃⁻增多","tag":"使用情境 / 考法","detail":"呕吐、胃肠减压和低钾常见；补液、补氯和补钾需结合病因。 考法线索：先抓病因，再用呼吸深浅和化验确认。","ref":"教材P24—25","chapter":"第二章｜水、电解质代谢紊乱和酸碱平衡失调病人的护理｜外科护理学第7版","href":"surgical/ch02-fluids-electrolytes-acid-base.html","kind":"normal","relation":""},{"type":"concept","label":"PaCO₂原发改变","tag":"使用情境 / 考法","detail":"通气不足致呼酸；过度通气致呼碱，处理首先回到通气原因。 考法线索：呼吸系统问题先解决通气，不能只追着pH补药。","ref":"教材P25—28","chapter":"第二章｜水、电解质代谢紊乱和酸碱平衡失调病人的护理｜外科护理学第7版","href":"surgical/ch02-fluids-electrolytes-acid-base.html","kind":"safe","relation":""},{"type":"cross","label":"急、亚急、慢性感染","tag":"跨章节数值 · 外科感染病人的护理","detail":"急、亚急、慢性感染：3周以内为急性感染；超过2个月为慢性感染；两者之间为亚急性感染。适用条件与安全边界：分期不能替代对脓毒症和器官功能的即时评估；同时观察体温、意识、循环、呼吸、尿量和局部病灶变化","ref":"教材P111","chapter":"第8章｜外科感染病人的护理｜外科护理学第7版","href":"surgical/ch08-surgical-infection.html","kind":"cross"},{"type":"cross","label":"破伤风病情观察","tag":"跨章节数值 · 外科感染病人的护理","detail":"破伤风病情观察：专人护理，至少每4小时测量体温、脉搏和呼吸，并按需监测血压。适用条件与安全边界：刺激可诱发痉挛，喉痉挛和呼吸肌痉挛可致窒息；暗室、减少声光刺激、集中操作；备气道和抢救物品并连续评估痉挛与呼吸","ref":"教材P122—123","chapter":"第8章｜外科感染病人的护理｜外科护理学第7版","href":"surgical/ch08-surgical-infection.html","kind":"cross"},{"type":"cross","label":"连续与协同","tag":"跨章节 · 第一章 · 绪论","detail":"从医院延伸至社区和家庭，强调多学科协作。 考法线索：最佳护理通常不是只处理生理指标，而是兼顾安全、参与和尊严。","ref":"教材P3","chapter":"第一章｜绪论｜外科护理学第7版","href":"surgical/ch01-introduction.html","kind":"cross","relation":"安全"},{"type":"cross","label":"慎独与责任","tag":"跨章节 · 第一章 · 绪论","detail":"维护生命尊严、权益与安全，诚实负责。 考法线索：辨析题注意“专业素质”不是单纯操作熟练。","ref":"教材P5","chapter":"第一章｜绪论｜外科护理学第7版","href":"surgical/ch01-introduction.html","kind":"cross","relation":"安全"},{"type":"cross","label":"组织灌注不足","tag":"跨章节 · 第三章 · 外科休克病人的护理","detail":"有效循环血量锐减导致微循环障碍、细胞缺氧和代谢紊乱。 考法线索：定义题要落在“有效循环血量”和“组织灌注”，不能只写低血压。","ref":"教材P30","chapter":"第三章｜外科休克病人的护理｜外科护理学第7版","href":"surgical/ch03-shock.html","kind":"cross","relation":"血压"}]},{"id":"surgical/ch03-shock.html","label":"第三章 · 外科休克病人的护理","title":"以“第三章 · 外科休克病人的护理”为中心｜用途、数值与跨章联系","center":"第三章 · 外科休克病人的护理","chapter":"第三章｜外科休克病人的护理｜外科护理学第7版","href":"surgical/ch03-shock.html","items":[{"type":"concept","label":"组织灌注不足","tag":"使用情境 / 考法","detail":"有效循环血量锐减导致微循环障碍、细胞缺氧和代谢紊乱。 考法线索：定义题要落在“有效循环血量”和“组织灌注”，不能只写低血压。","ref":"教材P30","chapter":"第三章｜外科休克病人的护理｜外科护理学第7版","href":"surgical/ch03-shock.html","kind":"safe","relation":""},{"type":"concept","label":"按病因识别","tag":"使用情境 / 考法","detail":"低血容量、感染、心源性、神经源性和过敏性休克处理重点不同。 考法线索：血压正常不排除早期休克，脉率与脉压差往往更早变化。","ref":"教材P30—32","chapter":"第三章｜外科休克病人的护理｜外科护理学第7版","href":"surgical/ch03-shock.html","kind":"normal","relation":""},{"type":"concept","label":"代偿到失代偿","tag":"使用情境 / 考法","detail":"早期脉快、脉压差小、皮肤凉；进展后血压下降、少尿与意识障碍加重。 考法线索：多器官低灌注证据越多，严重程度越高。","ref":"教材P32—34","chapter":"第三章｜外科休克病人的护理｜外科护理学第7版","href":"surgical/ch03-shock.html","kind":"normal","relation":""},{"type":"concept","label":"趋势胜过单点","tag":"使用情境 / 考法","detail":"意识、皮温色泽、脉搏、血压、脉压、尿量需连续观察。 考法线索：心率110、收缩压90，指数约1.22，不可被“还有血压”误导。","ref":"教材P33—36","chapter":"第三章｜外科休克病人的护理｜外科护理学第7版","href":"surgical/ch03-shock.html","kind":"normal","relation":""},{"type":"concept","label":"休克指数","tag":"使用情境 / 考法","detail":"心率/收缩压；≥1提示休克，>2提示严重。 考法线索：复苏后血压回升但尿量仍低，不能轻率判断纠正。","ref":"教材P36","chapter":"第三章｜外科休克病人的护理｜外科护理学第7版","href":"surgical/ch03-shock.html","kind":"safe","relation":""},{"type":"concept","label":"肾灌注窗口","tag":"使用情境 / 考法","detail":"30 ml/h常提示复苏改善。 考法线索：必须把CVP与血压、临床反应联读。","ref":"教材P36","chapter":"第三章｜外科休克病人的护理｜外科护理学第7版","href":"surgical/ch03-shock.html","kind":"normal","relation":""},{"type":"concept","label":"容量与心功能线索","tag":"使用情境 / 考法","detail":"正常5—12 cmH₂O；低值支持容量不足，高值需警惕心功能或肺循环阻力。 考法线索：血压升而CVP不明显升支持容量不足；CVP明显升而血压不升警惕心衰。","ref":"教材P34","chapter":"第三章｜外科休克病人的护理｜外科护理学第7版","href":"surgical/ch03-shock.html","kind":"safe","relation":""},{"type":"concept","label":"补液与纠因并行","tag":"使用情境 / 考法","detail":"快速建立静脉通路，晶体液优先，按反应追加并控制出血/感染源。 考法线索：“补液”和“纠因”不是二选一，需并行推进。","ref":"教材P35—38","chapter":"第三章｜外科休克病人的护理｜外科护理学第7版","href":"surgical/ch03-shock.html","kind":"normal","relation":""},{"type":"concept","label":"中凹卧位","tag":"使用情境 / 考法","detail":"头胸抬高20°—30°，下肢抬高15°—20°，兼顾呼吸和回心血量。 考法线索：体位角度和氧疗参数是常见数字考点。","ref":"教材P37","chapter":"第三章｜外科休克病人的护理｜外科护理学第7版","href":"surgical/ch03-shock.html","kind":"normal","relation":""},{"type":"concept","label":"冷暖休克辨析","tag":"使用情境 / 考法","detail":"暖休克可见皮肤较温暖、脉压较大；冷休克表现为外周收缩和低灌注。 考法线索：不能因皮肤温暖就排除休克，仍要看灌注与器官功能。","ref":"教材P41—42","chapter":"第三章｜外科休克病人的护理｜外科护理学第7版","href":"surgical/ch03-shock.html","kind":"safe","relation":""},{"type":"cross","label":"急、亚急、慢性感染","tag":"跨章节数值 · 外科感染病人的护理","detail":"急、亚急、慢性感染：3周以内为急性感染；超过2个月为慢性感染；两者之间为亚急性感染。适用条件与安全边界：分期不能替代对脓毒症和器官功能的即时评估；同时观察体温、意识、循环、呼吸、尿量和局部病灶变化","ref":"教材P111","chapter":"第8章｜外科感染病人的护理｜外科护理学第7版","href":"surgical/ch08-surgical-infection.html","kind":"cross"},{"type":"cross","label":"气性坏疽伤口","tag":"跨章节数值 · 外科感染病人的护理","detail":"气性坏疽伤口：敞开伤口可用3%过氧化氢溶液冲洗、湿敷。适用条件与安全边界：感染可迅速扩展并引起溶血、休克和多器官功能障碍；立即隔离并配合急诊清创；严密观察疼痛、肿胀、捻发感、分泌物和循环状态","ref":"教材P124—125","chapter":"第8章｜外科感染病人的护理｜外科护理学第7版","href":"surgical/ch08-surgical-infection.html","kind":"cross"},{"type":"cross","label":"常见外科疾病范围","tag":"跨章节 · 第一章 · 绪论","detail":"损伤、感染、肿瘤、畸形、梗阻及功能障碍等。 考法线索：题干给病因或病理状态时，先把它归入类别，再调用对应护理逻辑。","ref":"教材P2","chapter":"第一章｜绪论｜外科护理学第7版","href":"surgical/ch01-introduction.html","kind":"cross","relation":"感染"},{"type":"cross","label":"水钠成比例丢失","tag":"跨章节 · 第二章 · 水、电解质代谢紊乱和酸碱平衡失调病人的护理","detail":"血钠常在正常范围；先用平衡盐溶液，警惕大量生理盐水致高氯性酸中毒。 考法线索：无明显口渴而乏力、直立性低血压、低钠，方向指向低渗。","ref":"教材P8—10","chapter":"第二章｜水、电解质代谢紊乱和酸碱平衡失调病人的护理｜外科护理学第7版","href":"surgical/ch02-fluids-electrolytes-acid-base.html","kind":"cross","relation":"血压"},{"type":"cross","label":"心脏风险突出","tag":"跨章节 · 第二章 · 水、电解质代谢紊乱和酸碱平衡失调病人的护理","detail":"四肢无力、心率慢或心律失常；严重者可心搏骤停。 考法线索：肾功能不全、挤压伤或酸中毒伴心电异常时优先处理高钾。","ref":"教材P16—18","chapter":"第二章｜水、电解质代谢紊乱和酸碱平衡失调病人的护理｜外科护理学第7版","href":"surgical/ch02-fluids-electrolytes-acid-base.html","kind":"cross","relation":"心率"}]},{"id":"surgical/ch04-nutrition-support.html","label":"外科营养支持病人的护理","title":"以“外科营养支持病人的护理”为中心｜用途、数值与跨章联系","center":"外科营养支持病人的护理","chapter":"第4章｜外科营养支持病人的护理｜外科护理学第7版","href":"surgical/ch04-nutrition-support.html","items":[{"type":"concept","label":"肠内优先","tag":"使用情境 / 考法","detail":"胃肠道有功能并可安全使用时，优先选择肠内营养。 考法线索：患者评估资料符合“胃肠道有功能、无严重梗阻，但近期摄入不足并明显消瘦”。当前处理应先解决什么问题，护士怎样配合并评价效果？","ref":"教材P44—56","chapter":"第4章｜外科营养支持病人的护理｜外科护理学第7版","href":"surgical/ch04-nutrition-support.html","kind":"normal","relation":""},{"type":"concept","label":"肠外适应证","tag":"使用情境 / 考法","detail":"胃肠道不能满足需要时才考虑肠外营养，并评估中心静脉通路。 考法线索：患者病历中记录“严重肠梗阻、持续呕吐，胃肠道暂时不能安全使用”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","ref":"教材P44—56","chapter":"第4章｜外科营养支持病人的护理｜外科护理学第7版","href":"surgical/ch04-nutrition-support.html","kind":"safe","relation":""},{"type":"concept","label":"管饲安全","tag":"使用情境 / 考法","detail":"抬高床头并观察腹胀、反流、腹泻和误吸征象。 考法线索：患者病历中记录“管饲过程中平卧，随后出现反流、呛咳和血氧下降”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","ref":"教材P44—56","chapter":"第4章｜外科营养支持病人的护理｜外科护理学第7版","href":"surgical/ch04-nutrition-support.html","kind":"normal","relation":""},{"type":"concept","label":"肠外并发症","tag":"使用情境 / 考法","detail":"重点监测导管感染、气胸、血糖和电解质异常。 考法线索：患者病历中记录“中心静脉营养期间寒战发热，导管口红肿且血糖升高”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","ref":"教材P44—56","chapter":"第4章｜外科营养支持病人的护理｜外科护理学第7版","href":"surgical/ch04-nutrition-support.html","kind":"safe","relation":""},{"type":"concept","label":"再喂养风险","tag":"使用情境 / 考法","detail":"长期营养不足后快速补充可导致磷、钾、镁下降和心肺并发症。 考法线索：患者病历中记录“长期营养不良后快速增加热量，出现乏力、气促及低磷低钾”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","ref":"教材P44—56","chapter":"第4章｜外科营养支持病人的护理｜外科护理学第7版","href":"surgical/ch04-nutrition-support.html","kind":"safe","relation":""},{"type":"cross","label":"破伤风抗毒素（TAT）","tag":"跨章节数值 · 外科感染病人的护理","detail":"破伤风抗毒素（TAT）：治疗破伤风常用50 000～200 000 IU；暴露后预防剂量与方案须按免疫史和创口类型决定。适用条件与安全边界：过敏反应和血清病；给药前按规范评估过敏风险并备好抢救药物；注射后严密观察","ref":"教材P121—122","chapter":"第8章｜外科感染病人的护理｜外科护理学第7版","href":"surgical/ch08-surgical-infection.html","kind":"cross"},{"type":"cross","label":"急、亚急、慢性感染","tag":"跨章节数值 · 外科感染病人的护理","detail":"急、亚急、慢性感染：3周以内为急性感染；超过2个月为慢性感染；两者之间为亚急性感染。适用条件与安全边界：分期不能替代对脓毒症和器官功能的即时评估；同时观察体温、意识、循环、呼吸、尿量和局部病灶变化","ref":"教材P111","chapter":"第8章｜外科感染病人的护理｜外科护理学第7版","href":"surgical/ch08-surgical-infection.html","kind":"cross"},{"type":"cross","label":"常见外科疾病范围","tag":"跨章节 · 第一章 · 绪论","detail":"损伤、感染、肿瘤、畸形、梗阻及功能障碍等。 考法线索：题干给病因或病理状态时，先把它归入类别，再调用对应护理逻辑。","ref":"教材P2","chapter":"第一章｜绪论｜外科护理学第7版","href":"surgical/ch01-introduction.html","kind":"cross","relation":"感染"},{"type":"cross","label":"连续与协同","tag":"跨章节 · 第一章 · 绪论","detail":"从医院延伸至社区和家庭，强调多学科协作。 考法线索：最佳护理通常不是只处理生理指标，而是兼顾安全、参与和尊严。","ref":"教材P3","chapter":"第一章｜绪论｜外科护理学第7版","href":"surgical/ch01-introduction.html","kind":"cross","relation":"安全"},{"type":"cross","label":"理论联系实践","tag":"跨章节 · 第一章 · 绪论","detail":"知识、技能和临床判断需要在情境中整合。 考法线索：方案题先评估再干预；新情况出现后重新评价并调整。","ref":"教材P4","chapter":"第一章｜绪论｜外科护理学第7版","href":"surgical/ch01-introduction.html","kind":"cross","relation":"评估"}]},{"id":"surgical/ch05-operating-room.html","label":"手术室管理和工作","title":"以“手术室管理和工作”为中心｜用途、数值与跨章联系","center":"手术室管理和工作","chapter":"第5章｜手术室管理和工作｜外科护理学第7版","href":"surgical/ch05-operating-room.html","items":[{"type":"concept","label":"分区管理","tag":"使用情境 / 考法","detail":"限制区、半限制区和非限制区按洁污流线管理。 考法线索：患者病历中记录“患者即将进入手术间，身份腕带、手术部位标记和同意书尚未完成一致核对”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","ref":"教材P57—73","chapter":"第5章｜手术室管理和工作｜外科护理学第7版","href":"surgical/ch05-operating-room.html","kind":"normal","relation":""},{"type":"concept","label":"灭菌选择","tag":"使用情境 / 考法","detail":"进入无菌组织的器械必须灭菌，耐热耐湿器械优先压力蒸汽灭菌。 考法线索：患者病历中记录“无菌包外层潮湿，器械包化学指示未达到要求”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","ref":"教材P57—73","chapter":"第5章｜手术室管理和工作｜外科护理学第7版","href":"surgical/ch05-operating-room.html","kind":"normal","relation":""},{"type":"concept","label":"无菌台原则","tag":"使用情境 / 考法","detail":"无菌台须干燥、完整并始终处于视线范围内。 考法线索：患者病历中记录“截石位手术时间较长，腓总神经受压部位保护不足”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","ref":"教材P57—73","chapter":"第5章｜手术室管理和工作｜外科护理学第7版","href":"surgical/ch05-operating-room.html","kind":"normal","relation":""},{"type":"concept","label":"手术体位","tag":"使用情境 / 考法","detail":"既要暴露术野，也要保护神经、骨隆突、呼吸和循环。 考法线索：患者病历中记录“关腹前纱布清点数目与术前记录不一致”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","ref":"教材P57—73","chapter":"第5章｜手术室管理和工作｜外科护理学第7版","href":"surgical/ch05-operating-room.html","kind":"normal","relation":""},{"type":"concept","label":"清点制度","tag":"使用情境 / 考法","detail":"器械、敷料和缝针在关键节点共同清点，数目不符不得贸然关切口。 考法线索：患者病历中记录“感染手术结束后器械、污物与普通手术物品混放”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","ref":"教材P57—73","chapter":"第5章｜手术室管理和工作｜外科护理学第7版","href":"surgical/ch05-operating-room.html","kind":"safe","relation":""},{"type":"cross","label":"急、亚急、慢性感染","tag":"跨章节数值 · 外科感染病人的护理","detail":"急、亚急、慢性感染：3周以内为急性感染；超过2个月为慢性感染；两者之间为亚急性感染。适用条件与安全边界：分期不能替代对脓毒症和器官功能的即时评估；同时观察体温、意识、循环、呼吸、尿量和局部病灶变化","ref":"教材P111","chapter":"第8章｜外科感染病人的护理｜外科护理学第7版","href":"surgical/ch08-surgical-infection.html","kind":"cross"},{"type":"cross","label":"气性坏疽伤口","tag":"跨章节数值 · 外科感染病人的护理","detail":"气性坏疽伤口：敞开伤口可用3%过氧化氢溶液冲洗、湿敷。适用条件与安全边界：感染可迅速扩展并引起溶血、休克和多器官功能障碍；立即隔离并配合急诊清创；严密观察疼痛、肿胀、捻发感、分泌物和循环状态","ref":"教材P124—125","chapter":"第8章｜外科感染病人的护理｜外科护理学第7版","href":"surgical/ch08-surgical-infection.html","kind":"cross"},{"type":"cross","label":"常见外科疾病范围","tag":"跨章节 · 第一章 · 绪论","detail":"损伤、感染、肿瘤、畸形、梗阻及功能障碍等。 考法线索：题干给病因或病理状态时，先把它归入类别，再调用对应护理逻辑。","ref":"教材P2","chapter":"第一章｜绪论｜外科护理学第7版","href":"surgical/ch01-introduction.html","kind":"cross","relation":"感染"},{"type":"cross","label":"四个关键突破","tag":"跨章节 · 第一章 · 绪论","detail":"麻醉、无菌与抗菌、止血、输血推动外科学发展。 考法线索：不要只背年代，要把突破与它解决的临床障碍配对。","ref":"教材P2","chapter":"第一章｜绪论｜外科护理学第7版","href":"surgical/ch01-introduction.html","kind":"cross","relation":"无菌"},{"type":"cross","label":"HCO₃⁻原发下降","tag":"跨章节 · 第二章 · 水、电解质代谢紊乱和酸碱平衡失调病人的护理","detail":"深大呼吸、灌注不足、酸性产物积聚；纠因和改善循环是根本。 考法线索：先看pH，再看哪一项变化能解释方向，最后考虑代偿。","ref":"教材P22—24","chapter":"第二章｜水、电解质代谢紊乱和酸碱平衡失调病人的护理｜外科护理学第7版","href":"surgical/ch02-fluids-electrolytes-acid-base.html","kind":"cross","relation":"呼吸"}]},{"id":"surgical/ch06-anesthesia.html","label":"麻醉病人的护理","title":"以“麻醉病人的护理”为中心｜用途、数值与跨章联系","center":"麻醉病人的护理","chapter":"第6章｜麻醉病人的护理｜外科护理学第7版","href":"surgical/ch06-anesthesia.html","items":[{"type":"concept","label":"麻醉前评估","tag":"使用情境 / 考法","detail":"重点核查气道、心肺功能、过敏史、用药和禁食情况。 考法线索：患者病历中记录“麻醉前评估发现张口受限、既往困难气道并服用抗凝药”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","ref":"教材P74—91","chapter":"第6章｜麻醉病人的护理｜外科护理学第7版","href":"surgical/ch06-anesthesia.html","kind":"normal","relation":""},{"type":"concept","label":"局麻毒性","tag":"使用情境 / 考法","detail":"口周麻木、耳鸣、躁动、抽搐或心律失常提示局麻药全身毒性。 考法线索：患者的记录中出现“局麻药注射后出现口周麻木、耳鸣、躁动并逐渐抽搐”。这个数值或时间条件是否达到干预标准？请给出判断和下一步护理。","ref":"教材P74—91","chapter":"第6章｜麻醉病人的护理｜外科护理学第7版","href":"surgical/ch06-anesthesia.html","kind":"normal","relation":""},{"type":"concept","label":"椎管内麻醉","tag":"使用情境 / 考法","detail":"交感阻滞可致低血压，阻滞平面过高可影响呼吸。 考法线索：患者病历中记录“椎管内麻醉后血压下降、心率减慢，麻醉平面继续上升”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","ref":"教材P74—91","chapter":"第6章｜麻醉病人的护理｜外科护理学第7版","href":"surgical/ch06-anesthesia.html","kind":"normal","relation":""},{"type":"concept","label":"全麻苏醒","tag":"使用情境 / 考法","detail":"先保证气道通畅，再评估呼吸、循环、意识、疼痛和恶心呕吐。 考法线索：患者病历中记录“全麻苏醒期鼾声加重、舌后坠并出现血氧下降”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","ref":"教材P74—91","chapter":"第6章｜麻醉病人的护理｜外科护理学第7版","href":"surgical/ch06-anesthesia.html","kind":"normal","relation":""},{"type":"concept","label":"恶性高热","tag":"使用情境 / 考法","detail":"高热伴肌强直、心动过速和二氧化碳升高时应停触发药并紧急处理。 考法线索：患者病历中记录“麻醉中呼气末二氧化碳迅速升高、肌强直和体温上升”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","ref":"教材P74—91","chapter":"第6章｜麻醉病人的护理｜外科护理学第7版","href":"surgical/ch06-anesthesia.html","kind":"normal","relation":""},{"type":"cross","label":"破伤风抗毒素（TAT）","tag":"跨章节数值 · 外科感染病人的护理","detail":"破伤风抗毒素（TAT）：治疗破伤风常用50 000～200 000 IU；暴露后预防剂量与方案须按免疫史和创口类型决定。适用条件与安全边界：过敏反应和血清病；给药前按规范评估过敏风险并备好抢救药物；注射后严密观察","ref":"教材P121—122","chapter":"第8章｜外科感染病人的护理｜外科护理学第7版","href":"surgical/ch08-surgical-infection.html","kind":"cross"},{"type":"cross","label":"破伤风免疫球蛋白（TIG）","tag":"跨章节数值 · 外科感染病人的护理","detail":"破伤风免疫球蛋白（TIG）：治疗常用3 000～6 000 IU；高风险创口预防常用250～500 IU。适用条件与安全边界：注射部位疼痛，过敏反应少见；核对既往主动免疫史和创口类型；与类毒素分部位注射","ref":"教材P121—122","chapter":"第8章｜外科感染病人的护理｜外科护理学第7版","href":"surgical/ch08-surgical-infection.html","kind":"cross"},{"type":"cross","label":"四个关键突破","tag":"跨章节 · 第一章 · 绪论","detail":"麻醉、无菌与抗菌、止血、输血推动外科学发展。 考法线索：不要只背年代，要把突破与它解决的临床障碍配对。","ref":"教材P2","chapter":"第一章｜绪论｜外科护理学第7版","href":"surgical/ch01-introduction.html","kind":"cross","relation":"麻醉"},{"type":"cross","label":"理论联系实践","tag":"跨章节 · 第一章 · 绪论","detail":"知识、技能和临床判断需要在情境中整合。 考法线索：方案题先评估再干预；新情况出现后重新评价并调整。","ref":"教材P4","chapter":"第一章｜绪论｜外科护理学第7版","href":"surgical/ch01-introduction.html","kind":"cross","relation":"评估"},{"type":"cross","label":"水钠成比例丢失","tag":"跨章节 · 第二章 · 水、电解质代谢紊乱和酸碱平衡失调病人的护理","detail":"血钠常在正常范围；先用平衡盐溶液，警惕大量生理盐水致高氯性酸中毒。 考法线索：无明显口渴而乏力、直立性低血压、低钠，方向指向低渗。","ref":"教材P8—10","chapter":"第二章｜水、电解质代谢紊乱和酸碱平衡失调病人的护理｜外科护理学第7版","href":"surgical/ch02-fluids-electrolytes-acid-base.html","kind":"cross","relation":"血压"}]},{"id":"surgical/ch07-perioperative-care.html","label":"手术前后病人的护理","title":"以“手术前后病人的护理”为中心｜用途、数值与跨章联系","center":"手术前后病人的护理","chapter":"第7章｜手术前后病人的护理｜外科护理学第7版","href":"surgical/ch07-perioperative-care.html","items":[{"type":"concept","label":"术前核查","tag":"使用情境 / 考法","detail":"确认身份、部位、手术、同意书、过敏史和关键检验结果。 考法线索：患者病历中记录“手术前核对时发现患者口述的手术侧与标记侧不一致”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","ref":"教材P92—109","chapter":"第7章｜手术前后病人的护理｜外科护理学第7版","href":"surgical/ch07-perioperative-care.html","kind":"normal","relation":""},{"type":"concept","label":"禁食禁饮","tag":"使用情境 / 考法","detail":"目的是降低麻醉期反流误吸，具体时间按麻醉方案和规范执行。 考法线索：护士发现患者正在接受一项与“患者未达到禁食要求即准备接受全身麻醉”相冲突的处理。应立即制止什么，并说明可能造成的风险。","ref":"教材P92—109","chapter":"第7章｜手术前后病人的护理｜外科护理学第7版","href":"surgical/ch07-perioperative-care.html","kind":"safe","relation":""},{"type":"concept","label":"术后优先级","tag":"使用情境 / 考法","detail":"回病房先评估气道、呼吸、循环和意识。 考法线索：患者进入术后观察期，交班记录提示“术后返回病房时嗜睡、鼾声、呼吸浅慢且血氧下降”。下一班应重点复评什么，什么变化需要立即上报？","ref":"教材P92—109","chapter":"第7章｜手术前后病人的护理｜外科护理学第7版","href":"surgical/ch07-perioperative-care.html","kind":"normal","relation":""},{"type":"concept","label":"早期活动","tag":"使用情境 / 考法","detail":"病情允许时循序活动可减少肺部并发症和静脉血栓。 考法线索：患者病历中记录“病情稳定却因惧痛长期卧床，双下肢活动明显减少”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","ref":"教材P92—109","chapter":"第7章｜手术前后病人的护理｜外科护理学第7版","href":"surgical/ch07-perioperative-care.html","kind":"safe","relation":""},{"type":"concept","label":"引流观察","tag":"使用情境 / 考法","detail":"记录量、颜色、性质与通畅度，鲜红骤增或突然停止均需评估。 考法线索：患者进入术后观察期，交班记录提示“术后引流液突然鲜红增多，随后管路又无液体流出”。下一班应重点复评什么，什么变化需要立即上报？","ref":"教材P92—109","chapter":"第7章｜手术前后病人的护理｜外科护理学第7版","href":"surgical/ch07-perioperative-care.html","kind":"normal","relation":""},{"type":"cross","label":"破伤风抗毒素（TAT）","tag":"跨章节数值 · 外科感染病人的护理","detail":"破伤风抗毒素（TAT）：治疗破伤风常用50 000～200 000 IU；暴露后预防剂量与方案须按免疫史和创口类型决定。适用条件与安全边界：过敏反应和血清病；给药前按规范评估过敏风险并备好抢救药物；注射后严密观察","ref":"教材P121—122","chapter":"第8章｜外科感染病人的护理｜外科护理学第7版","href":"surgical/ch08-surgical-infection.html","kind":"cross"},{"type":"cross","label":"急、亚急、慢性感染","tag":"跨章节数值 · 外科感染病人的护理","detail":"急、亚急、慢性感染：3周以内为急性感染；超过2个月为慢性感染；两者之间为亚急性感染。适用条件与安全边界：分期不能替代对脓毒症和器官功能的即时评估；同时观察体温、意识、循环、呼吸、尿量和局部病灶变化","ref":"教材P111","chapter":"第8章｜外科感染病人的护理｜外科护理学第7版","href":"surgical/ch08-surgical-infection.html","kind":"cross"},{"type":"cross","label":"四个关键突破","tag":"跨章节 · 第一章 · 绪论","detail":"麻醉、无菌与抗菌、止血、输血推动外科学发展。 考法线索：不要只背年代，要把突破与它解决的临床障碍配对。","ref":"教材P2","chapter":"第一章｜绪论｜外科护理学第7版","href":"surgical/ch01-introduction.html","kind":"cross","relation":"麻醉"},{"type":"cross","label":"理论联系实践","tag":"跨章节 · 第一章 · 绪论","detail":"知识、技能和临床判断需要在情境中整合。 考法线索：方案题先评估再干预；新情况出现后重新评价并调整。","ref":"教材P4","chapter":"第一章｜绪论｜外科护理学第7版","href":"surgical/ch01-introduction.html","kind":"cross","relation":"评估"},{"type":"cross","label":"HCO₃⁻原发下降","tag":"跨章节 · 第二章 · 水、电解质代谢紊乱和酸碱平衡失调病人的护理","detail":"深大呼吸、灌注不足、酸性产物积聚；纠因和改善循环是根本。 考法线索：先看pH，再看哪一项变化能解释方向，最后考虑代偿。","ref":"教材P22—24","chapter":"第二章｜水、电解质代谢紊乱和酸碱平衡失调病人的护理｜外科护理学第7版","href":"surgical/ch02-fluids-electrolytes-acid-base.html","kind":"cross","relation":"呼吸"}]},{"id":"surgical/ch08-surgical-infection.html","label":"外科感染病人的护理","title":"以“外科感染病人的护理”为中心｜用途、数值与跨章联系","center":"外科感染病人的护理","chapter":"第8章｜外科感染病人的护理｜外科护理学第7版","href":"surgical/ch08-surgical-infection.html","items":[{"type":"number","label":"破伤风抗毒素（TAT）","tag":"治疗破伤风常用50 000～200 000 IU；暴露后预防剂量与方案须按免疫史和创口类型决定","detail":"破伤风抗毒素（TAT）：治疗破伤风常用50 000～200 000 IU；暴露后预防剂量与方案须按免疫史和创口类型决定。适用条件与安全边界：过敏反应和血清病；给药前按规范评估过敏风险并备好抢救药物；注射后严密观察","ref":"教材P121—122","chapter":"第8章｜外科感染病人的护理｜外科护理学第7版","href":"surgical/ch08-surgical-infection.html","kind":"safe"},{"type":"number","label":"破伤风免疫球蛋白（TIG）","tag":"治疗常用3 000～6 000 IU；高风险创口预防常用250～500 IU","detail":"破伤风免疫球蛋白（TIG）：治疗常用3 000～6 000 IU；高风险创口预防常用250～500 IU。适用条件与安全边界：注射部位疼痛，过敏反应少见；核对既往主动免疫史和创口类型；与类毒素分部位注射","ref":"教材P121—122","chapter":"第8章｜外科感染病人的护理｜外科护理学第7版","href":"surgical/ch08-surgical-infection.html","kind":"normal"},{"type":"number","label":"破伤风类毒素","tag":"已有基础免疫者受伤后可用0.5 ml加强免疫","detail":"破伤风类毒素：已有基础免疫者受伤后可用0.5 ml加强免疫。适用条件与安全边界：局部疼痛、红肿，少见全身过敏反应；核对免疫记录和加强时间；不能用类毒素替代已发病患者的毒素中和与支持治疗","ref":"教材P121—122","chapter":"第8章｜外科感染病人的护理｜外科护理学第7版","href":"surgical/ch08-surgical-infection.html","kind":"safe"},{"type":"number","label":"急、亚急、慢性感染","tag":"3周以内为急性感染；超过2个月为慢性感染；两者之间为亚急性感染","detail":"急、亚急、慢性感染：3周以内为急性感染；超过2个月为慢性感染；两者之间为亚急性感染。适用条件与安全边界：分期不能替代对脓毒症和器官功能的即时评估；同时观察体温、意识、循环、呼吸、尿量和局部病灶变化","ref":"教材P111","chapter":"第8章｜外科感染病人的护理｜外科护理学第7版","href":"surgical/ch08-surgical-infection.html","kind":"safe"},{"type":"number","label":"气性坏疽伤口","tag":"敞开伤口可用3%过氧化氢溶液冲洗、湿敷","detail":"气性坏疽伤口：敞开伤口可用3%过氧化氢溶液冲洗、湿敷。适用条件与安全边界：感染可迅速扩展并引起溶血、休克和多器官功能障碍；立即隔离并配合急诊清创；严密观察疼痛、肿胀、捻发感、分泌物和循环状态","ref":"教材P124—125","chapter":"第8章｜外科感染病人的护理｜外科护理学第7版","href":"surgical/ch08-surgical-infection.html","kind":"normal"},{"type":"number","label":"破伤风病情观察","tag":"专人护理，至少每4小时测量体温、脉搏和呼吸，并按需监测血压","detail":"破伤风病情观察：专人护理，至少每4小时测量体温、脉搏和呼吸，并按需监测血压。适用条件与安全边界：刺激可诱发痉挛，喉痉挛和呼吸肌痉挛可致窒息；暗室、减少声光刺激、集中操作；备气道和抢救物品并连续评估痉挛与呼吸","ref":"教材P122—123","chapter":"第8章｜外科感染病人的护理｜外科护理学第7版","href":"surgical/ch08-surgical-infection.html","kind":"normal"},{"type":"concept","label":"局部感染","tag":"使用情境 / 考法","detail":"红肿热痛和功能障碍常见，形成脓肿后通常需要充分引流。 考法线索：患者进入术后观察期，交班记录提示“切口红肿热痛，中央出现波动感并伴发热”。下一班应重点复评什么，什么变化需要立即上报？","ref":"教材P110—126","chapter":"第8章｜外科感染病人的护理｜外科护理学第7版","href":"surgical/ch08-surgical-infection.html","kind":"normal","relation":""},{"type":"concept","label":"手部感染","tag":"使用情境 / 考法","detail":"腱鞘和深间隙感染可迅速损害手功能，应早期制动、抬高和引流。 考法线索：患者病历中记录“手指屈肌腱鞘区剧痛、肿胀，伸指时疼痛明显加重”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","ref":"教材P110—126","chapter":"第8章｜外科感染病人的护理｜外科护理学第7版","href":"surgical/ch08-surgical-infection.html","kind":"normal","relation":""},{"type":"concept","label":"脓毒症","tag":"使用情境 / 考法","detail":"感染伴意识、循环、呼吸或尿量异常提示器官功能受损。 考法线索：患者病历中记录“感染患者意识转差、血压下降、呼吸急促且尿量减少”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","ref":"教材P110—126","chapter":"第8章｜外科感染病人的护理｜外科护理学第7版","href":"surgical/ch08-surgical-infection.html","kind":"normal","relation":""},{"type":"concept","label":"破伤风","tag":"使用情境 / 考法","detail":"减少声光刺激、集中护理、保持气道并控制痉挛。 考法线索：患者病历中记录“轻微外伤后出现张口困难和阵发性肌痉挛，声光刺激可诱发”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","ref":"教材P110—126","chapter":"第8章｜外科感染病人的护理｜外科护理学第7版","href":"surgical/ch08-surgical-infection.html","kind":"normal","relation":""},{"type":"concept","label":"气性坏疽","tag":"使用情境 / 考法","detail":"伤口剧痛、肿胀、捻发感和恶臭分泌物提示紧急坏死性感染。 考法线索：患者病历中记录“污染伤口疼痛迅速加重、肿胀、捻发感并有恶臭分泌物”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","ref":"教材P110—126","chapter":"第8章｜外科感染病人的护理｜外科护理学第7版","href":"surgical/ch08-surgical-infection.html","kind":"normal","relation":""},{"type":"cross","label":"尼莫地平","tag":"跨章节数值 · 颅内和椎管内血管性疾病病人的护理","detail":"尼莫地平：蛛网膜下腔出血后常用40～60 mg、每日4～6次，连用21天。适用条件与安全边界：低血压、心动过速或心动过缓、头痛；连续监测血压和心率；按时给药；避免因低血压降低脑灌注","ref":"教材P219","chapter":"第14章｜颅内和椎管内血管性疾病病人的护理｜外科护理学第7版","href":"surgical/ch14-cerebrovascular-surgery.html","kind":"cross"},{"type":"cross","label":"常见外科疾病范围","tag":"跨章节 · 第一章 · 绪论","detail":"损伤、感染、肿瘤、畸形、梗阻及功能障碍等。 考法线索：题干给病因或病理状态时，先把它归入类别，再调用对应护理逻辑。","ref":"教材P2","chapter":"第一章｜绪论｜外科护理学第7版","href":"surgical/ch01-introduction.html","kind":"cross","relation":"感染"},{"type":"cross","label":"水钠成比例丢失","tag":"跨章节 · 第二章 · 水、电解质代谢紊乱和酸碱平衡失调病人的护理","detail":"血钠常在正常范围；先用平衡盐溶液，警惕大量生理盐水致高氯性酸中毒。 考法线索：无明显口渴而乏力、直立性低血压、低钠，方向指向低渗。","ref":"教材P8—10","chapter":"第二章｜水、电解质代谢紊乱和酸碱平衡失调病人的护理｜外科护理学第7版","href":"surgical/ch02-fluids-electrolytes-acid-base.html","kind":"cross","relation":"血压"},{"type":"cross","label":"HCO₃⁻原发下降","tag":"跨章节 · 第二章 · 水、电解质代谢紊乱和酸碱平衡失调病人的护理","detail":"深大呼吸、灌注不足、酸性产物积聚；纠因和改善循环是根本。 考法线索：先看pH，再看哪一项变化能解释方向，最后考虑代偿。","ref":"教材P22—24","chapter":"第二章｜水、电解质代谢紊乱和酸碱平衡失调病人的护理｜外科护理学第7版","href":"surgical/ch02-fluids-electrolytes-acid-base.html","kind":"cross","relation":"呼吸"}]},{"id":"surgical/ch09-injury-burn.html","label":"损伤病人的护理","title":"以“损伤病人的护理”为中心｜用途、数值与跨章联系","center":"损伤病人的护理","chapter":"第9章｜损伤病人的护理｜外科护理学第7版","href":"surgical/ch09-injury-burn.html","items":[{"type":"concept","label":"创伤初评","tag":"使用情境 / 考法","detail":"按ABCDE先处理威胁生命的问题，再处理局部伤口。 考法线索：患者病历中记录“多发伤患者意识模糊、气道有血液，胸廓起伏不对称且血压下降”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","ref":"教材P127—146","chapter":"第9章｜损伤病人的护理｜外科护理学第7版","href":"surgical/ch09-injury-burn.html","kind":"normal","relation":""},{"type":"concept","label":"止血固定","tag":"使用情境 / 考法","detail":"活动性出血先压迫止血，疑似骨折固定后再转运。 考法线索：患者病历中记录“开放性小腿伤口持续出血，肢体畸形并诉剧痛”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","ref":"教材P127—146","chapter":"第9章｜损伤病人的护理｜外科护理学第7版","href":"surgical/ch09-injury-burn.html","kind":"normal","relation":""},{"type":"concept","label":"烧伤面积","tag":"使用情境 / 考法","detail":"成人常用九分法，手掌法适合小面积或散在烧伤。 考法线索：患者病历中记录“成人躯干和一侧上肢烧伤，需要估算烧伤面积”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","ref":"教材P127—146","chapter":"第9章｜损伤病人的护理｜外科护理学第7版","href":"surgical/ch09-injury-burn.html","kind":"normal","relation":""},{"type":"concept","label":"烧伤深度","tag":"使用情境 / 考法","detail":"水疱与明显疼痛多见浅度，焦痂和痛觉减退提示更深损伤。 考法线索：患者病历中记录“烧伤创面有水疱且疼痛明显，另一区域呈焦痂并痛觉减退”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","ref":"教材P127—146","chapter":"第9章｜损伤病人的护理｜外科护理学第7版","href":"surgical/ch09-injury-burn.html","kind":"normal","relation":""},{"type":"concept","label":"吸入性损伤","tag":"使用情境 / 考法","detail":"声音嘶哑、口鼻炭末或封闭空间烧伤提示气道水肿风险。 考法线索：患者病历中记录“封闭空间烧伤后声音嘶哑、口鼻有炭末并进行性呼吸困难”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","ref":"教材P127—146","chapter":"第9章｜损伤病人的护理｜外科护理学第7版","href":"surgical/ch09-injury-burn.html","kind":"safe","relation":""},{"type":"cross","label":"破伤风免疫球蛋白（TIG）","tag":"跨章节数值 · 外科感染病人的护理","detail":"破伤风免疫球蛋白（TIG）：治疗常用3 000～6 000 IU；高风险创口预防常用250～500 IU。适用条件与安全边界：注射部位疼痛，过敏反应少见；核对既往主动免疫史和创口类型；与类毒素分部位注射","ref":"教材P121—122","chapter":"第8章｜外科感染病人的护理｜外科护理学第7版","href":"surgical/ch08-surgical-infection.html","kind":"cross"},{"type":"cross","label":"破伤风类毒素","tag":"跨章节数值 · 外科感染病人的护理","detail":"破伤风类毒素：已有基础免疫者受伤后可用0.5 ml加强免疫。适用条件与安全边界：局部疼痛、红肿，少见全身过敏反应；核对免疫记录和加强时间；不能用类毒素替代已发病患者的毒素中和与支持治疗","ref":"教材P121—122","chapter":"第8章｜外科感染病人的护理｜外科护理学第7版","href":"surgical/ch08-surgical-infection.html","kind":"cross"},{"type":"cross","label":"水钠成比例丢失","tag":"跨章节 · 第二章 · 水、电解质代谢紊乱和酸碱平衡失调病人的护理","detail":"血钠常在正常范围；先用平衡盐溶液，警惕大量生理盐水致高氯性酸中毒。 考法线索：无明显口渴而乏力、直立性低血压、低钠，方向指向低渗。","ref":"教材P8—10","chapter":"第二章｜水、电解质代谢紊乱和酸碱平衡失调病人的护理｜外科护理学第7版","href":"surgical/ch02-fluids-electrolytes-acid-base.html","kind":"cross","relation":"血压"},{"type":"cross","label":"HCO₃⁻原发下降","tag":"跨章节 · 第二章 · 水、电解质代谢紊乱和酸碱平衡失调病人的护理","detail":"深大呼吸、灌注不足、酸性产物积聚；纠因和改善循环是根本。 考法线索：先看pH，再看哪一项变化能解释方向，最后考虑代偿。","ref":"教材P22—24","chapter":"第二章｜水、电解质代谢紊乱和酸碱平衡失调病人的护理｜外科护理学第7版","href":"surgical/ch02-fluids-electrolytes-acid-base.html","kind":"cross","relation":"呼吸"},{"type":"cross","label":"失H⁺或HCO₃⁻增多","tag":"跨章节 · 第二章 · 水、电解质代谢紊乱和酸碱平衡失调病人的护理","detail":"呕吐、胃肠减压和低钾常见；补液、补氯和补钾需结合病因。 考法线索：先抓病因，再用呼吸深浅和化验确认。","ref":"教材P24—25","chapter":"第二章｜水、电解质代谢紊乱和酸碱平衡失调病人的护理｜外科护理学第7版","href":"surgical/ch02-fluids-electrolytes-acid-base.html","kind":"cross","relation":"呼吸"}]},{"id":"surgical/ch10-tumor-care.html","label":"肿瘤病人的护理","title":"以“肿瘤病人的护理”为中心｜用途、数值与跨章联系","center":"肿瘤病人的护理","chapter":"第10章｜肿瘤病人的护理｜外科护理学第7版","href":"surgical/ch10-tumor-care.html","items":[{"type":"concept","label":"确诊依据","tag":"使用情境 / 考法","detail":"病理学检查用于定性，影像和标志物不能单独替代病理。 考法线索：患者病历中记录“影像发现肿块且肿瘤标志物升高，但尚未取得组织病理”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","ref":"教材P147—161","chapter":"第10章｜肿瘤病人的护理｜外科护理学第7版","href":"surgical/ch10-tumor-care.html","kind":"safe","relation":""},{"type":"concept","label":"TNM分期","tag":"使用情境 / 考法","detail":"T、N、M分别反映原发肿瘤、区域淋巴结和远处转移。 考法线索：患者主诉和查体出现“病理提示恶性肿瘤，同时发现区域淋巴结和远处病灶”。最需要考虑哪种病情或并发症？请列出决定判断的线索。","ref":"教材P147—161","chapter":"第10章｜肿瘤病人的护理｜外科护理学第7版","href":"surgical/ch10-tumor-care.html","kind":"safe","relation":""},{"type":"concept","label":"骨髓抑制","tag":"使用情境 / 考法","detail":"白细胞、血小板和血红蛋白下降分别增加感染、出血和乏力风险。 考法线索：患者病历中记录“化疗后白细胞、血小板和血红蛋白均下降”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","ref":"教材P147—161","chapter":"第10章｜肿瘤病人的护理｜外科护理学第7版","href":"surgical/ch10-tumor-care.html","kind":"safe","relation":""},{"type":"concept","label":"化疗外渗","tag":"使用情境 / 考法","detail":"立即停止输注，保留通路回抽并按药物性质处理。 考法线索：患者病历中记录“静脉输注化疗药时穿刺处疼痛、肿胀且滴速减慢”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","ref":"教材P147—161","chapter":"第10章｜肿瘤病人的护理｜外科护理学第7版","href":"surgical/ch10-tumor-care.html","kind":"normal","relation":""},{"type":"concept","label":"癌痛管理","tag":"使用情境 / 考法","detail":"定时、按阶梯、个体化给药，同时预防便秘和恶心。 考法线索：患者病历中记录“持续癌痛患者仍按疼痛发作时临时用药，并出现便秘恶心”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","ref":"教材P147—161","chapter":"第10章｜肿瘤病人的护理｜外科护理学第7版","href":"surgical/ch10-tumor-care.html","kind":"normal","relation":""},{"type":"cross","label":"破伤风抗毒素（TAT）","tag":"跨章节数值 · 外科感染病人的护理","detail":"破伤风抗毒素（TAT）：治疗破伤风常用50 000～200 000 IU；暴露后预防剂量与方案须按免疫史和创口类型决定。适用条件与安全边界：过敏反应和血清病；给药前按规范评估过敏风险并备好抢救药物；注射后严密观察","ref":"教材P121—122","chapter":"第8章｜外科感染病人的护理｜外科护理学第7版","href":"surgical/ch08-surgical-infection.html","kind":"cross"},{"type":"cross","label":"破伤风免疫球蛋白（TIG）","tag":"跨章节数值 · 外科感染病人的护理","detail":"破伤风免疫球蛋白（TIG）：治疗常用3 000～6 000 IU；高风险创口预防常用250～500 IU。适用条件与安全边界：注射部位疼痛，过敏反应少见；核对既往主动免疫史和创口类型；与类毒素分部位注射","ref":"教材P121—122","chapter":"第8章｜外科感染病人的护理｜外科护理学第7版","href":"surgical/ch08-surgical-infection.html","kind":"cross"},{"type":"cross","label":"常见外科疾病范围","tag":"跨章节 · 第一章 · 绪论","detail":"损伤、感染、肿瘤、畸形、梗阻及功能障碍等。 考法线索：题干给病因或病理状态时，先把它归入类别，再调用对应护理逻辑。","ref":"教材P2","chapter":"第一章｜绪论｜外科护理学第7版","href":"surgical/ch01-introduction.html","kind":"cross","relation":"感染 / 肿瘤"},{"type":"cross","label":"按病因识别","tag":"跨章节 · 第三章 · 外科休克病人的护理","detail":"低血容量、感染、心源性、神经源性和过敏性休克处理重点不同。 考法线索：血压正常不排除早期休克，脉率与脉压差往往更早变化。","ref":"教材P30—32","chapter":"第三章｜外科休克病人的护理｜外科护理学第7版","href":"surgical/ch03-shock.html","kind":"cross","relation":"感染"},{"type":"cross","label":"补液与纠因并行","tag":"跨章节 · 第三章 · 外科休克病人的护理","detail":"快速建立静脉通路，晶体液优先，按反应追加并控制出血/感染源。 考法线索：“补液”和“纠因”不是二选一，需并行推进。","ref":"教材P35—38","chapter":"第三章｜外科休克病人的护理｜外科护理学第7版","href":"surgical/ch03-shock.html","kind":"cross","relation":"感染 / 出血"}]},{"id":"surgical/ch11-transplantation.html","label":"移植病人的护理","title":"以“移植病人的护理”为中心｜用途、数值与跨章联系","center":"移植病人的护理","chapter":"第11章｜移植病人的护理｜外科护理学第7版","href":"surgical/ch11-transplantation.html","items":[{"type":"concept","label":"排斥类型","tag":"使用情境 / 考法","detail":"超急性、急性和慢性排斥的时间、机制和处理不同。 考法线索：患者的记录中出现“器官移植后数分钟移植物迅速失去功能并出现严重循环异常”。这个数值或时间条件是否达到干预标准？请给出判断和下一步护理。","ref":"教材P162—180","chapter":"第11章｜移植病人的护理｜外科护理学第7版","href":"surgical/ch11-transplantation.html","kind":"normal","relation":""},{"type":"concept","label":"感染风险","tag":"使用情境 / 考法","detail":"免疫抑制后典型炎症表现可减弱，低热或轻微不适也需重视。 考法线索：患者评估资料符合“长期免疫抑制治疗者仅有低热和乏力，但感染指标持续升高”。当前处理应先解决什么问题，护士怎样配合并评价效果？","ref":"教材P162—180","chapter":"第11章｜移植病人的护理｜外科护理学第7版","href":"surgical/ch11-transplantation.html","kind":"normal","relation":""},{"type":"concept","label":"用药依从","tag":"使用情境 / 考法","detail":"免疫抑制剂应按时服用并监测血药浓度及肝肾功能。 考法线索：患者病历中记录“患者漏服免疫抑制剂且自行减量，血药浓度低”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","ref":"教材P162—180","chapter":"第11章｜移植病人的护理｜外科护理学第7版","href":"surgical/ch11-transplantation.html","kind":"safe","relation":""},{"type":"concept","label":"肾移植观察","tag":"使用情境 / 考法","detail":"尿量骤减需排查血管、尿路、排斥和容量因素。 考法线索：患者进入术后观察期，交班记录提示“肾移植术后尿量突然减少，移植肾区不适”。下一班应重点复评什么，什么变化需要立即上报？","ref":"教材P162—180","chapter":"第11章｜移植病人的护理｜外科护理学第7版","href":"surgical/ch11-transplantation.html","kind":"normal","relation":""},{"type":"concept","label":"肝移植观察","tag":"使用情境 / 考法","detail":"关注意识、凝血、胆汁、肝酶和血流动力学。 考法线索：患者进入术后观察期，交班记录提示“肝移植术后意识改变、凝血异常、胆汁量骤减且肝酶升高”。下一班应重点复评什么，什么变化需要立即上报？","ref":"教材P162—180","chapter":"第11章｜移植病人的护理｜外科护理学第7版","href":"surgical/ch11-transplantation.html","kind":"safe","relation":""},{"type":"cross","label":"破伤风抗毒素（TAT）","tag":"跨章节数值 · 外科感染病人的护理","detail":"破伤风抗毒素（TAT）：治疗破伤风常用50 000～200 000 IU；暴露后预防剂量与方案须按免疫史和创口类型决定。适用条件与安全边界：过敏反应和血清病；给药前按规范评估过敏风险并备好抢救药物；注射后严密观察","ref":"教材P121—122","chapter":"第8章｜外科感染病人的护理｜外科护理学第7版","href":"surgical/ch08-surgical-infection.html","kind":"cross"},{"type":"cross","label":"急、亚急、慢性感染","tag":"跨章节数值 · 外科感染病人的护理","detail":"急、亚急、慢性感染：3周以内为急性感染；超过2个月为慢性感染；两者之间为亚急性感染。适用条件与安全边界：分期不能替代对脓毒症和器官功能的即时评估；同时观察体温、意识、循环、呼吸、尿量和局部病灶变化","ref":"教材P111","chapter":"第8章｜外科感染病人的护理｜外科护理学第7版","href":"surgical/ch08-surgical-infection.html","kind":"cross"},{"type":"cross","label":"常见外科疾病范围","tag":"跨章节 · 第一章 · 绪论","detail":"损伤、感染、肿瘤、畸形、梗阻及功能障碍等。 考法线索：题干给病因或病理状态时，先把它归入类别，再调用对应护理逻辑。","ref":"教材P2","chapter":"第一章｜绪论｜外科护理学第7版","href":"surgical/ch01-introduction.html","kind":"cross","relation":"感染"},{"type":"cross","label":"理论联系实践","tag":"跨章节 · 第一章 · 绪论","detail":"知识、技能和临床判断需要在情境中整合。 考法线索：方案题先评估再干预；新情况出现后重新评价并调整。","ref":"教材P4","chapter":"第一章｜绪论｜外科护理学第7版","href":"surgical/ch01-introduction.html","kind":"cross","relation":"评估"},{"type":"cross","label":"按病因识别","tag":"跨章节 · 第三章 · 外科休克病人的护理","detail":"低血容量、感染、心源性、神经源性和过敏性休克处理重点不同。 考法线索：血压正常不排除早期休克，脉率与脉压差往往更早变化。","ref":"教材P30—32","chapter":"第三章｜外科休克病人的护理｜外科护理学第7版","href":"surgical/ch03-shock.html","kind":"cross","relation":"感染"}]},{"id":"surgical/ch12-intracranial-pressure.html","label":"颅内压增高及脑疝病人的护理","title":"以“颅内压增高及脑疝病人的护理”为中心｜用途、数值与跨章联系","center":"颅内压增高及脑疝病人的护理","chapter":"第12章｜颅内压增高及脑疝病人的护理｜外科护理学第7版","href":"surgical/ch12-intracranial-pressure.html","items":[{"type":"concept","label":"颅压三主征","tag":"使用情境 / 考法","detail":"头痛、呕吐和视乳头水肿是典型组合，但表现可不完整。 考法线索：患者病历中记录“头痛、喷射性呕吐并发现视乳头水肿”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","ref":"教材P181—193","chapter":"第12章｜颅内压增高及脑疝病人的护理｜外科护理学第7版","href":"surgical/ch12-intracranial-pressure.html","kind":"normal","relation":""},{"type":"concept","label":"库欣反应","tag":"使用情境 / 考法","detail":"血压升高、脉搏减慢和呼吸不规则提示颅内压危象。 考法线索：患者病历中记录“血压逐渐升高、脉搏减慢、呼吸节律不规则”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","ref":"教材P181—193","chapter":"第12章｜颅内压增高及脑疝病人的护理｜外科护理学第7版","href":"surgical/ch12-intracranial-pressure.html","kind":"normal","relation":""},{"type":"concept","label":"幕切迹疝","tag":"使用情境 / 考法","detail":"单侧瞳孔散大伴意识恶化时应立即降颅压并准备手术。 考法线索：患者病历中记录“意识突然恶化并出现一侧瞳孔散大”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","ref":"教材P181—193","chapter":"第12章｜颅内压增高及脑疝病人的护理｜外科护理学第7版","href":"surgical/ch12-intracranial-pressure.html","kind":"normal","relation":""},{"type":"concept","label":"护理体位","tag":"使用情境 / 考法","detail":"抬高头部并保持颈部中立，避免阻碍静脉回流。 考法线索：患者病历中记录“卧位不当造成颈部屈曲，躁动咳嗽后头痛加重”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","ref":"教材P181—193","chapter":"第12章｜颅内压增高及脑疝病人的护理｜外科护理学第7版","href":"surgical/ch12-intracranial-pressure.html","kind":"safe","relation":""},{"type":"concept","label":"腰穿禁忌","tag":"使用情境 / 考法","detail":"明显颅压增高时腰椎穿刺可能诱发脑疝。 考法线索：护士发现患者正在接受一项与“明显颅内压增高患者被安排腰椎穿刺”相冲突的处理。应立即制止什么，并说明可能造成的风险。","ref":"教材P181—193","chapter":"第12章｜颅内压增高及脑疝病人的护理｜外科护理学第7版","href":"surgical/ch12-intracranial-pressure.html","kind":"safe","relation":""},{"type":"cross","label":"急、亚急、慢性感染","tag":"跨章节数值 · 外科感染病人的护理","detail":"急、亚急、慢性感染：3周以内为急性感染；超过2个月为慢性感染；两者之间为亚急性感染。适用条件与安全边界：分期不能替代对脓毒症和器官功能的即时评估；同时观察体温、意识、循环、呼吸、尿量和局部病灶变化","ref":"教材P111","chapter":"第8章｜外科感染病人的护理｜外科护理学第7版","href":"surgical/ch08-surgical-infection.html","kind":"cross"},{"type":"cross","label":"破伤风病情观察","tag":"跨章节数值 · 外科感染病人的护理","detail":"破伤风病情观察：专人护理，至少每4小时测量体温、脉搏和呼吸，并按需监测血压。适用条件与安全边界：刺激可诱发痉挛，喉痉挛和呼吸肌痉挛可致窒息；暗室、减少声光刺激、集中操作；备气道和抢救物品并连续评估痉挛与呼吸","ref":"教材P122—123","chapter":"第8章｜外科感染病人的护理｜外科护理学第7版","href":"surgical/ch08-surgical-infection.html","kind":"cross"},{"type":"cross","label":"水钠成比例丢失","tag":"跨章节 · 第二章 · 水、电解质代谢紊乱和酸碱平衡失调病人的护理","detail":"血钠常在正常范围；先用平衡盐溶液，警惕大量生理盐水致高氯性酸中毒。 考法线索：无明显口渴而乏力、直立性低血压、低钠，方向指向低渗。","ref":"教材P8—10","chapter":"第二章｜水、电解质代谢紊乱和酸碱平衡失调病人的护理｜外科护理学第7版","href":"surgical/ch02-fluids-electrolytes-acid-base.html","kind":"cross","relation":"血压"},{"type":"cross","label":"HCO₃⁻原发下降","tag":"跨章节 · 第二章 · 水、电解质代谢紊乱和酸碱平衡失调病人的护理","detail":"深大呼吸、灌注不足、酸性产物积聚；纠因和改善循环是根本。 考法线索：先看pH，再看哪一项变化能解释方向，最后考虑代偿。","ref":"教材P22—24","chapter":"第二章｜水、电解质代谢紊乱和酸碱平衡失调病人的护理｜外科护理学第7版","href":"surgical/ch02-fluids-electrolytes-acid-base.html","kind":"cross","relation":"呼吸"},{"type":"cross","label":"失H⁺或HCO₃⁻增多","tag":"跨章节 · 第二章 · 水、电解质代谢紊乱和酸碱平衡失调病人的护理","detail":"呕吐、胃肠减压和低钾常见；补液、补氯和补钾需结合病因。 考法线索：先抓病因，再用呼吸深浅和化验确认。","ref":"教材P24—25","chapter":"第二章｜水、电解质代谢紊乱和酸碱平衡失调病人的护理｜外科护理学第7版","href":"surgical/ch02-fluids-electrolytes-acid-base.html","kind":"cross","relation":"呼吸"}]},{"id":"surgical/ch13-craniocerebral-injury.html","label":"颅脑损伤病人的护理","title":"以“颅脑损伤病人的护理”为中心｜用途、数值与跨章联系","center":"颅脑损伤病人的护理","chapter":"第13章｜颅脑损伤病人的护理｜外科护理学第7版","href":"surgical/ch13-craniocerebral-injury.html","items":[{"type":"concept","label":"脑脊液漏","tag":"使用情境 / 考法","detail":"颅底骨折鼻漏或耳漏时避免堵塞、冲洗、擤鼻和腰椎穿刺。 考法线索：患者病历中记录“颅底骨折后鼻腔流出清亮液体，患者反复擤鼻”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","ref":"教材P194—211","chapter":"第13章｜颅脑损伤病人的护理｜外科护理学第7版","href":"surgical/ch13-craniocerebral-injury.html","kind":"safe","relation":""},{"type":"concept","label":"脑震荡","tag":"使用情境 / 考法","detail":"短暂意识障碍和逆行性遗忘常见，仍需观察迟发恶化。 考法线索：患者病历中记录“受伤后短暂昏迷并有逆行性遗忘，随后自觉好转”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","ref":"教材P194—211","chapter":"第13章｜颅脑损伤病人的护理｜外科护理学第7版","href":"surgical/ch13-craniocerebral-injury.html","kind":"normal","relation":""},{"type":"concept","label":"硬膜外血肿","tag":"使用情境 / 考法","detail":"短暂昏迷后清醒再恶化的中间清醒期具有提示意义。 考法线索：患者病历中记录“头部外伤后先昏迷、短暂清醒，之后再次意识恶化”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","ref":"教材P194—211","chapter":"第13章｜颅脑损伤病人的护理｜外科护理学第7版","href":"surgical/ch13-craniocerebral-injury.html","kind":"normal","relation":""},{"type":"concept","label":"硬膜下血肿","tag":"使用情境 / 考法","detail":"常伴脑挫裂伤，意识障碍可持续或进行性加重。 考法线索：患者主诉和查体出现“重型颅脑损伤后意识障碍持续加重并伴局灶体征”。最需要考虑哪种病情或并发症？请列出决定判断的线索。","ref":"教材P194—211","chapter":"第13章｜颅脑损伤病人的护理｜外科护理学第7版","href":"surgical/ch13-craniocerebral-injury.html","kind":"safe","relation":""},{"type":"concept","label":"动态观察","tag":"使用情境 / 考法","detail":"连续评估GCS、瞳孔、肢体活动和生命体征。 考法线索：患者病历中记录“观察期间GCS下降、双侧瞳孔不等大且一侧肢体无力”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","ref":"教材P194—211","chapter":"第13章｜颅脑损伤病人的护理｜外科护理学第7版","href":"surgical/ch13-craniocerebral-injury.html","kind":"normal","relation":""},{"type":"cross","label":"破伤风抗毒素（TAT）","tag":"跨章节数值 · 外科感染病人的护理","detail":"破伤风抗毒素（TAT）：治疗破伤风常用50 000～200 000 IU；暴露后预防剂量与方案须按免疫史和创口类型决定。适用条件与安全边界：过敏反应和血清病；给药前按规范评估过敏风险并备好抢救药物；注射后严密观察","ref":"教材P121—122","chapter":"第8章｜外科感染病人的护理｜外科护理学第7版","href":"surgical/ch08-surgical-infection.html","kind":"cross"},{"type":"cross","label":"急、亚急、慢性感染","tag":"跨章节数值 · 外科感染病人的护理","detail":"急、亚急、慢性感染：3周以内为急性感染；超过2个月为慢性感染；两者之间为亚急性感染。适用条件与安全边界：分期不能替代对脓毒症和器官功能的即时评估；同时观察体温、意识、循环、呼吸、尿量和局部病灶变化","ref":"教材P111","chapter":"第8章｜外科感染病人的护理｜外科护理学第7版","href":"surgical/ch08-surgical-infection.html","kind":"cross"},{"type":"cross","label":"理论联系实践","tag":"跨章节 · 第一章 · 绪论","detail":"知识、技能和临床判断需要在情境中整合。 考法线索：方案题先评估再干预；新情况出现后重新评价并调整。","ref":"教材P4","chapter":"第一章｜绪论｜外科护理学第7版","href":"surgical/ch01-introduction.html","kind":"cross","relation":"评估"},{"type":"cross","label":"肠内优先","tag":"跨章节 · 外科营养支持病人的护理","detail":"胃肠道有功能并可安全使用时，优先选择肠内营养。 考法线索：患者评估资料符合“胃肠道有功能、无严重梗阻，但近期摄入不足并明显消瘦”。当前处理应先解决什么问题，护士怎样配合并评价效果？","ref":"教材P44—56","chapter":"第4章｜外科营养支持病人的护理｜外科护理学第7版","href":"surgical/ch04-nutrition-support.html","kind":"cross","relation":"评估"},{"type":"cross","label":"肠外适应证","tag":"跨章节 · 外科营养支持病人的护理","detail":"胃肠道不能满足需要时才考虑肠外营养，并评估中心静脉通路。 考法线索：患者病历中记录“严重肠梗阻、持续呕吐，胃肠道暂时不能安全使用”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","ref":"教材P44—56","chapter":"第4章｜外科营养支持病人的护理｜外科护理学第7版","href":"surgical/ch04-nutrition-support.html","kind":"cross","relation":"评估"}]},{"id":"surgical/ch14-cerebrovascular-surgery.html","label":"颅内和椎管内血管性疾病病人的护理","title":"以“颅内和椎管内血管性疾病病人的护理”为中心｜用途、数值与跨章联系","center":"颅内和椎管内血管性疾病病人的护理","chapter":"第14章｜颅内和椎管内血管性疾病病人的护理｜外科护理学第7版","href":"surgical/ch14-cerebrovascular-surgery.html","items":[{"type":"number","label":"尼莫地平","tag":"蛛网膜下腔出血后常用40～60 mg、每日4～6次，连用21天","detail":"尼莫地平：蛛网膜下腔出血后常用40～60 mg、每日4～6次，连用21天。适用条件与安全边界：低血压、心动过速或心动过缓、头痛；连续监测血压和心率；按时给药；避免因低血压降低脑灌注","ref":"教材P219","chapter":"第14章｜颅内和椎管内血管性疾病病人的护理｜外科护理学第7版","href":"surgical/ch14-cerebrovascular-surgery.html","kind":"safe"},{"type":"concept","label":"卒中识别","tag":"使用情境 / 考法","detail":"突发面口歪斜、肢体无力或言语障碍需记录最后正常时间。 考法线索：患者病历中记录“突发一侧面口歪斜、肢体无力和言语含糊，发病时间不清”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","ref":"教材P212—222","chapter":"第14章｜颅内和椎管内血管性疾病病人的护理｜外科护理学第7版","href":"surgical/ch14-cerebrovascular-surgery.html","kind":"normal","relation":""},{"type":"concept","label":"蛛网膜下腔出血","tag":"使用情境 / 考法","detail":"雷击样剧烈头痛伴颈强直需高度警惕。 考法线索：患者病历中记录“突然出现一生中最剧烈头痛并伴颈项强直”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","ref":"教材P212—222","chapter":"第14章｜颅内和椎管内血管性疾病病人的护理｜外科护理学第7版","href":"surgical/ch14-cerebrovascular-surgery.html","kind":"safe","relation":""},{"type":"concept","label":"动脉瘤术后","tag":"使用情境 / 考法","detail":"新发意识、瞳孔或局灶体征变化需排查再出血和缺血。 考法线索：患者进入术后观察期，交班记录提示“动脉瘤术后新发意识下降、瞳孔变化和偏瘫”。下一班应重点复评什么，什么变化需要立即上报？","ref":"教材P212—222","chapter":"第14章｜颅内和椎管内血管性疾病病人的护理｜外科护理学第7版","href":"surgical/ch14-cerebrovascular-surgery.html","kind":"normal","relation":""},{"type":"concept","label":"血管痉挛","tag":"使用情境 / 考法","detail":"蛛网膜下腔出血后迟发神经功能恶化应考虑脑血管痉挛。 考法线索：患者病历中记录“蛛网膜下腔出血数日后出现迟发偏瘫和失语”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","ref":"教材P212—222","chapter":"第14章｜颅内和椎管内血管性疾病病人的护理｜外科护理学第7版","href":"surgical/ch14-cerebrovascular-surgery.html","kind":"normal","relation":""},{"type":"concept","label":"康复安全","tag":"使用情境 / 考法","detail":"吞咽评估完成前不应贸然经口进食。 考法线索：患者病历中记录“卒中患者饮水呛咳，尚未完成吞咽评估”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","ref":"教材P212—222","chapter":"第14章｜颅内和椎管内血管性疾病病人的护理｜外科护理学第7版","href":"surgical/ch14-cerebrovascular-surgery.html","kind":"normal","relation":""},{"type":"cross","label":"破伤风抗毒素（TAT）","tag":"跨章节数值 · 外科感染病人的护理","detail":"破伤风抗毒素（TAT）：治疗破伤风常用50 000～200 000 IU；暴露后预防剂量与方案须按免疫史和创口类型决定。适用条件与安全边界：过敏反应和血清病；给药前按规范评估过敏风险并备好抢救药物；注射后严密观察","ref":"教材P121—122","chapter":"第8章｜外科感染病人的护理｜外科护理学第7版","href":"surgical/ch08-surgical-infection.html","kind":"cross"},{"type":"cross","label":"急、亚急、慢性感染","tag":"跨章节数值 · 外科感染病人的护理","detail":"急、亚急、慢性感染：3周以内为急性感染；超过2个月为慢性感染；两者之间为亚急性感染。适用条件与安全边界：分期不能替代对脓毒症和器官功能的即时评估；同时观察体温、意识、循环、呼吸、尿量和局部病灶变化","ref":"教材P111","chapter":"第8章｜外科感染病人的护理｜外科护理学第7版","href":"surgical/ch08-surgical-infection.html","kind":"cross"},{"type":"cross","label":"连续与协同","tag":"跨章节 · 第一章 · 绪论","detail":"从医院延伸至社区和家庭，强调多学科协作。 考法线索：最佳护理通常不是只处理生理指标，而是兼顾安全、参与和尊严。","ref":"教材P3","chapter":"第一章｜绪论｜外科护理学第7版","href":"surgical/ch01-introduction.html","kind":"cross","relation":"安全"},{"type":"cross","label":"理论联系实践","tag":"跨章节 · 第一章 · 绪论","detail":"知识、技能和临床判断需要在情境中整合。 考法线索：方案题先评估再干预；新情况出现后重新评价并调整。","ref":"教材P4","chapter":"第一章｜绪论｜外科护理学第7版","href":"surgical/ch01-introduction.html","kind":"cross","relation":"评估"},{"type":"cross","label":"慎独与责任","tag":"跨章节 · 第一章 · 绪论","detail":"维护生命尊严、权益与安全，诚实负责。 考法线索：辨析题注意“专业素质”不是单纯操作熟练。","ref":"教材P5","chapter":"第一章｜绪论｜外科护理学第7版","href":"surgical/ch01-introduction.html","kind":"cross","relation":"安全"}]},{"id":"surgical/ch15-cns-tumor.html","label":"颅内和椎管内肿瘤病人的护理","title":"以“颅内和椎管内肿瘤病人的护理”为中心｜用途、数值与跨章联系","center":"颅内和椎管内肿瘤病人的护理","chapter":"第15章｜颅内和椎管内肿瘤病人的护理｜外科护理学第7版","href":"surgical/ch15-cns-tumor.html","items":[{"type":"concept","label":"定位判断","tag":"使用情境 / 考法","detail":"症状取决于占位部位和颅内压，两条线索应同时分析。 考法线索：患者主诉和查体出现“头痛呕吐同时伴有与病灶部位相符的局灶神经症状”。最需要考虑哪种病情或并发症？请列出决定判断的线索。","ref":"教材P223—230","chapter":"第15章｜颅内和椎管内肿瘤病人的护理｜外科护理学第7版","href":"surgical/ch15-cns-tumor.html","kind":"safe","relation":""},{"type":"concept","label":"癫痫安全","tag":"使用情境 / 考法","detail":"发作时保护头部和气道，不强行约束或向口中塞物。 考法线索：患者病历中记录“住院中突发全身抽搐，家属试图按压肢体并往口中塞物”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","ref":"教材P223—230","chapter":"第15章｜颅内和椎管内肿瘤病人的护理｜外科护理学第7版","href":"surgical/ch15-cns-tumor.html","kind":"normal","relation":""},{"type":"concept","label":"术后观察","tag":"使用情境 / 考法","detail":"重点看意识、瞳孔、肢体、引流和内分泌变化。 考法线索：患者进入术后观察期，交班记录提示“颅内肿瘤术后意识下降、瞳孔不等大并出现新发肢体无力”。下一班应重点复评什么，什么变化需要立即上报？","ref":"教材P223—230","chapter":"第15章｜颅内和椎管内肿瘤病人的护理｜外科护理学第7版","href":"surgical/ch15-cns-tumor.html","kind":"normal","relation":""},{"type":"concept","label":"垂体术后","tag":"使用情境 / 考法","detail":"避免擤鼻和低头，观察脑脊液鼻漏与大量稀尿。 考法线索：患者进入术后观察期，交班记录提示“经蝶垂体手术后鼻腔流清液且尿量显著增多”。下一班应重点复评什么，什么变化需要立即上报？","ref":"教材P223—230","chapter":"第15章｜颅内和椎管内肿瘤病人的护理｜外科护理学第7版","href":"surgical/ch15-cns-tumor.html","kind":"safe","relation":""},{"type":"concept","label":"椎管内肿瘤","tag":"使用情境 / 考法","detail":"根性痛、感觉平面、运动及大小便异常提示脊髓受压。 考法线索：患者病历中记录“进行性根性痛、感觉平面上移并出现大小便功能障碍”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","ref":"教材P223—230","chapter":"第15章｜颅内和椎管内肿瘤病人的护理｜外科护理学第7版","href":"surgical/ch15-cns-tumor.html","kind":"normal","relation":""},{"type":"cross","label":"急、亚急、慢性感染","tag":"跨章节数值 · 外科感染病人的护理","detail":"急、亚急、慢性感染：3周以内为急性感染；超过2个月为慢性感染；两者之间为亚急性感染。适用条件与安全边界：分期不能替代对脓毒症和器官功能的即时评估；同时观察体温、意识、循环、呼吸、尿量和局部病灶变化","ref":"教材P111","chapter":"第8章｜外科感染病人的护理｜外科护理学第7版","href":"surgical/ch08-surgical-infection.html","kind":"cross"},{"type":"cross","label":"破伤风病情观察","tag":"跨章节数值 · 外科感染病人的护理","detail":"破伤风病情观察：专人护理，至少每4小时测量体温、脉搏和呼吸，并按需监测血压。适用条件与安全边界：刺激可诱发痉挛，喉痉挛和呼吸肌痉挛可致窒息；暗室、减少声光刺激、集中操作；备气道和抢救物品并连续评估痉挛与呼吸","ref":"教材P122—123","chapter":"第8章｜外科感染病人的护理｜外科护理学第7版","href":"surgical/ch08-surgical-infection.html","kind":"cross"},{"type":"cross","label":"常见外科疾病范围","tag":"跨章节 · 第一章 · 绪论","detail":"损伤、感染、肿瘤、畸形、梗阻及功能障碍等。 考法线索：题干给病因或病理状态时，先把它归入类别，再调用对应护理逻辑。","ref":"教材P2","chapter":"第一章｜绪论｜外科护理学第7版","href":"surgical/ch01-introduction.html","kind":"cross","relation":"肿瘤"},{"type":"cross","label":"连续与协同","tag":"跨章节 · 第一章 · 绪论","detail":"从医院延伸至社区和家庭，强调多学科协作。 考法线索：最佳护理通常不是只处理生理指标，而是兼顾安全、参与和尊严。","ref":"教材P3","chapter":"第一章｜绪论｜外科护理学第7版","href":"surgical/ch01-introduction.html","kind":"cross","relation":"安全"},{"type":"cross","label":"慎独与责任","tag":"跨章节 · 第一章 · 绪论","detail":"维护生命尊严、权益与安全，诚实负责。 考法线索：辨析题注意“专业素质”不是单纯操作熟练。","ref":"教材P5","chapter":"第一章｜绪论｜外科护理学第7版","href":"surgical/ch01-introduction.html","kind":"cross","relation":"安全"}]},{"id":"surgical/ch16-neck-thyroid.html","label":"颈部疾病病人的护理","title":"以“颈部疾病病人的护理”为中心｜用途、数值与跨章联系","center":"颈部疾病病人的护理","chapter":"第16章｜颈部疾病病人的护理｜外科护理学第7版","href":"surgical/ch16-neck-thyroid.html","items":[{"type":"concept","label":"甲亢术前","tag":"使用情境 / 考法","detail":"应使代谢和循环状态接近稳定，再进入手术。 考法线索：患者病历中记录“甲亢患者静息心率仍快、体重下降且情绪激动，计划次日手术”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","ref":"教材P231—245","chapter":"第16章｜颈部疾病病人的护理｜外科护理学第7版","href":"surgical/ch16-neck-thyroid.html","kind":"normal","relation":""},{"type":"concept","label":"甲状腺危象","tag":"使用情境 / 考法","detail":"术后高热、心动过速、烦躁和呕吐提示危象。 考法线索：患者治疗过程中突然出现“甲状腺术后高热、心动过速、烦躁并频繁呕吐”。护士首先怀疑什么危险变化，第一项处置是什么？","ref":"教材P231—245","chapter":"第16章｜颈部疾病病人的护理｜外科护理学第7版","href":"surgical/ch16-neck-thyroid.html","kind":"safe","relation":""},{"type":"concept","label":"出血窒息","tag":"使用情境 / 考法","detail":"颈部肿胀、呼吸困难、频繁吞咽或鲜红引流增多提示术后出血。 考法线索：患者治疗过程中突然出现“术后颈部迅速肿胀、呼吸困难并频繁吞咽”。护士首先怀疑什么危险变化，第一项处置是什么？","ref":"教材P231—245","chapter":"第16章｜颈部疾病病人的护理｜外科护理学第7版","href":"surgical/ch16-neck-thyroid.html","kind":"safe","relation":""},{"type":"concept","label":"喉返神经损伤","tag":"使用情境 / 考法","detail":"单侧损伤可声音嘶哑，双侧损伤可严重呼吸困难。 考法线索：患者进入术后观察期，交班记录提示“术后声音嘶哑，随后出现吸气性呼吸困难”。下一班应重点复评什么，什么变化需要立即上报？","ref":"教材P231—245","chapter":"第16章｜颈部疾病病人的护理｜外科护理学第7版","href":"surgical/ch16-neck-thyroid.html","kind":"normal","relation":""},{"type":"concept","label":"低钙表现","tag":"使用情境 / 考法","detail":"口周麻木和手足抽搐提示甲状旁腺受损或低钙。 考法线索：患者的记录中出现“术后口周麻木、手足抽搐，血钙下降”。这个数值或时间条件是否达到干预标准？请给出判断和下一步护理。","ref":"教材P231—245","chapter":"第16章｜颈部疾病病人的护理｜外科护理学第7版","href":"surgical/ch16-neck-thyroid.html","kind":"normal","relation":""},{"type":"cross","label":"急、亚急、慢性感染","tag":"跨章节数值 · 外科感染病人的护理","detail":"急、亚急、慢性感染：3周以内为急性感染；超过2个月为慢性感染；两者之间为亚急性感染。适用条件与安全边界：分期不能替代对脓毒症和器官功能的即时评估；同时观察体温、意识、循环、呼吸、尿量和局部病灶变化","ref":"教材P111","chapter":"第8章｜外科感染病人的护理｜外科护理学第7版","href":"surgical/ch08-surgical-infection.html","kind":"cross"},{"type":"cross","label":"破伤风病情观察","tag":"跨章节数值 · 外科感染病人的护理","detail":"破伤风病情观察：专人护理，至少每4小时测量体温、脉搏和呼吸，并按需监测血压。适用条件与安全边界：刺激可诱发痉挛，喉痉挛和呼吸肌痉挛可致窒息；暗室、减少声光刺激、集中操作；备气道和抢救物品并连续评估痉挛与呼吸","ref":"教材P122—123","chapter":"第8章｜外科感染病人的护理｜外科护理学第7版","href":"surgical/ch08-surgical-infection.html","kind":"cross"},{"type":"cross","label":"心脏风险突出","tag":"跨章节 · 第二章 · 水、电解质代谢紊乱和酸碱平衡失调病人的护理","detail":"四肢无力、心率慢或心律失常；严重者可心搏骤停。 考法线索：肾功能不全、挤压伤或酸中毒伴心电异常时优先处理高钾。","ref":"教材P16—18","chapter":"第二章｜水、电解质代谢紊乱和酸碱平衡失调病人的护理｜外科护理学第7版","href":"surgical/ch02-fluids-electrolytes-acid-base.html","kind":"cross","relation":"心率"},{"type":"cross","label":"HCO₃⁻原发下降","tag":"跨章节 · 第二章 · 水、电解质代谢紊乱和酸碱平衡失调病人的护理","detail":"深大呼吸、灌注不足、酸性产物积聚；纠因和改善循环是根本。 考法线索：先看pH，再看哪一项变化能解释方向，最后考虑代偿。","ref":"教材P22—24","chapter":"第二章｜水、电解质代谢紊乱和酸碱平衡失调病人的护理｜外科护理学第7版","href":"surgical/ch02-fluids-electrolytes-acid-base.html","kind":"cross","relation":"呼吸"},{"type":"cross","label":"失H⁺或HCO₃⁻增多","tag":"跨章节 · 第二章 · 水、电解质代谢紊乱和酸碱平衡失调病人的护理","detail":"呕吐、胃肠减压和低钾常见；补液、补氯和补钾需结合病因。 考法线索：先抓病因，再用呼吸深浅和化验确认。","ref":"教材P24—25","chapter":"第二章｜水、电解质代谢紊乱和酸碱平衡失调病人的护理｜外科护理学第7版","href":"surgical/ch02-fluids-electrolytes-acid-base.html","kind":"cross","relation":"呼吸"}]},{"id":"surgical/ch17-breast-disease.html","label":"乳房疾病病人的护理","title":"以“乳房疾病病人的护理”为中心｜用途、数值与跨章联系","center":"乳房疾病病人的护理","chapter":"第17章｜乳房疾病病人的护理｜外科护理学第7版","href":"surgical/ch17-breast-disease.html","items":[{"type":"concept","label":"炎症还是脓肿","tag":"使用情境 / 考法","detail":"哺乳期红、肿、热、痛并伴发热，首先想到急性乳腺炎。未形成脓肿时，处理核心是抗感染和持续排空乳汁；出现波动感、液性暗区或抽出脓液，说明已形成脓肿，需要穿刺或切开引流。 考法线索：常把“未形成脓肿”和“已经形成脓肿”放在同一病例的前后变化中，问处理措施何时必须升级；还会考患侧暂停直接哺乳不等于停止排乳。","ref":"教材P246—260","chapter":"第17章｜乳房疾病病人的护理｜外科护理学第7版","href":"surgical/ch17-breast-disease.html","kind":"normal","relation":""},{"type":"concept","label":"先看周期，再看边界和活动度","tag":"使用情境 / 考法","detail":"月经前双乳胀痛、多个结节且经后减轻，更支持乳房囊性增生病；年轻女性的单发、光滑、边界清楚、活动度好且不随月经变化的肿块，更支持乳房纤维腺瘤。 考法线索：病例鉴别题会同时给年龄、单发或多发、疼痛是否随月经变化、边界与活动度；不能只凭“摸到肿块”判断。","ref":"教材P246—260","chapter":"第17章｜乳房疾病病人的护理｜外科护理学第7版","href":"surgical/ch17-breast-disease.html","kind":"safe","relation":""},{"type":"concept","label":"肿块、酒窝征和橘皮征要分开解释","tag":"使用情境 / 考法","detail":"无痛、质硬、边界不清、活动度差的单发肿块提示乳腺癌。酒窝征来自Cooper韧带受累缩短；橘皮征来自癌细胞堵塞皮下淋巴管；同侧腋窝淋巴结是常见且较早的淋巴转移部位。 考法线索：常见设问是首发症状、酒窝征与橘皮征的形成机制、最早常见转移淋巴结，以及根据一组体征写出诊断依据。","ref":"教材P246—260","chapter":"第17章｜乳房疾病病人的护理｜外科护理学第7版","href":"surgical/ch17-breast-disease.html","kind":"normal","relation":""},{"type":"concept","label":"鲜红骤增与拔管条件是两类题","tag":"使用情境 / 考法","detail":"负压引流用于排出积血积液、消灭残腔并使皮瓣贴合。鲜红引流突然增多或胸壁隆起要警惕活动性出血；引流转淡黄色、连续3天每日少于10—15 ml且皮瓣贴合、无积液时，才进入拔管评估。 考法线索：一类题给术后突变，问首先判断和优先处理；另一类题给连续引流量、颜色及皮瓣情况，问能否拔管。只看某一天的数字会失分。","ref":"教材P246—260","chapter":"第17章｜乳房疾病病人的护理｜外科护理学第7版","href":"surgical/ch17-breast-disease.html","kind":"safe","relation":""},{"type":"concept","label":"保护、锻炼和异常识别同时考","tag":"使用情境 / 考法","detail":"避免患侧测血压、抽血、注射、输液、负重和皮肤损伤；患肢可抬高，并按伤口和引流情况从手指、腕肘活动逐步过渡到肩关节训练。出现肿胀需同时评估感染、淋巴回流及血运。 考法线索：会按术后第1天、第4—7天、第1—2周考锻炼顺序，也会问预防淋巴水肿的错误措施；若伴发绀、皮温下降或脉搏异常，优先排查血运障碍。","ref":"教材P246—260","chapter":"第17章｜乳房疾病病人的护理｜外科护理学第7版","href":"surgical/ch17-breast-disease.html","kind":"safe","relation":""},{"type":"cross","label":"破伤风抗毒素（TAT）","tag":"跨章节数值 · 外科感染病人的护理","detail":"破伤风抗毒素（TAT）：治疗破伤风常用50 000～200 000 IU；暴露后预防剂量与方案须按免疫史和创口类型决定。适用条件与安全边界：过敏反应和血清病；给药前按规范评估过敏风险并备好抢救药物；注射后严密观察","ref":"教材P121—122","chapter":"第8章｜外科感染病人的护理｜外科护理学第7版","href":"surgical/ch08-surgical-infection.html","kind":"cross"},{"type":"cross","label":"破伤风免疫球蛋白（TIG）","tag":"跨章节数值 · 外科感染病人的护理","detail":"破伤风免疫球蛋白（TIG）：治疗常用3 000～6 000 IU；高风险创口预防常用250～500 IU。适用条件与安全边界：注射部位疼痛，过敏反应少见；核对既往主动免疫史和创口类型；与类毒素分部位注射","ref":"教材P121—122","chapter":"第8章｜外科感染病人的护理｜外科护理学第7版","href":"surgical/ch08-surgical-infection.html","kind":"cross"},{"type":"cross","label":"常见外科疾病范围","tag":"跨章节 · 第一章 · 绪论","detail":"损伤、感染、肿瘤、畸形、梗阻及功能障碍等。 考法线索：题干给病因或病理状态时，先把它归入类别，再调用对应护理逻辑。","ref":"教材P2","chapter":"第一章｜绪论｜外科护理学第7版","href":"surgical/ch01-introduction.html","kind":"cross","relation":"感染"},{"type":"cross","label":"理论联系实践","tag":"跨章节 · 第一章 · 绪论","detail":"知识、技能和临床判断需要在情境中整合。 考法线索：方案题先评估再干预；新情况出现后重新评价并调整。","ref":"教材P4","chapter":"第一章｜绪论｜外科护理学第7版","href":"surgical/ch01-introduction.html","kind":"cross","relation":"评估"},{"type":"cross","label":"水钠成比例丢失","tag":"跨章节 · 第二章 · 水、电解质代谢紊乱和酸碱平衡失调病人的护理","detail":"血钠常在正常范围；先用平衡盐溶液，警惕大量生理盐水致高氯性酸中毒。 考法线索：无明显口渴而乏力、直立性低血压、低钠，方向指向低渗。","ref":"教材P8—10","chapter":"第二章｜水、电解质代谢紊乱和酸碱平衡失调病人的护理｜外科护理学第7版","href":"surgical/ch02-fluids-electrolytes-acid-base.html","kind":"cross","relation":"血压"}]},{"id":"surgical/ch18-chest-trauma.html","label":"胸部损伤病人的护理","title":"以“胸部损伤病人的护理”为中心｜用途、数值与跨章联系","center":"胸部损伤病人的护理","chapter":"第18章｜胸部损伤病人的护理｜外科护理学第7版","href":"surgical/ch18-chest-trauma.html","items":[{"type":"concept","label":"连枷胸","tag":"使用情境 / 考法","detail":"反常呼吸运动提示胸壁失去稳定，需镇痛和呼吸支持。 考法线索：患者病历中记录“多发肋骨骨折后胸壁出现反常呼吸运动”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","ref":"教材P261—277","chapter":"第18章｜胸部损伤病人的护理｜外科护理学第7版","href":"surgical/ch18-chest-trauma.html","kind":"normal","relation":""},{"type":"concept","label":"开放性气胸","tag":"使用情境 / 考法","detail":"胸壁伤口有气流声时应立即封闭伤口并紧急处理。 考法线索：患者病历中记录“胸壁开放伤口随呼吸发出吸吮声并有气体进出”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","ref":"教材P261—277","chapter":"第18章｜胸部损伤病人的护理｜外科护理学第7版","href":"surgical/ch18-chest-trauma.html","kind":"normal","relation":""},{"type":"concept","label":"张力性气胸","tag":"使用情境 / 考法","detail":"进行性呼吸困难、低血压、颈静脉怒张和气管移位提示危象。 考法线索：患者治疗过程中突然出现“呼吸困难迅速加重、低血压、颈静脉怒张和气管偏移”。护士首先怀疑什么危险变化，第一项处置是什么？","ref":"教材P261—277","chapter":"第18章｜胸部损伤病人的护理｜外科护理学第7版","href":"surgical/ch18-chest-trauma.html","kind":"safe","relation":""},{"type":"concept","label":"胸腔引流","tag":"使用情境 / 考法","detail":"水封瓶低于胸腔，保持密闭通畅并观察水柱和气泡。 考法线索：患者进入术后观察期，交班记录提示“胸腔闭式引流瓶高于胸壁且水封管内水柱不波动”。下一班应重点复评什么，什么变化需要立即上报？","ref":"教材P261—277","chapter":"第18章｜胸部损伤病人的护理｜外科护理学第7版","href":"surgical/ch18-chest-trauma.html","kind":"normal","relation":""},{"type":"concept","label":"心包压塞","tag":"使用情境 / 考法","detail":"低血压、心音低钝和颈静脉怒张提示心包压塞。 考法线索：患者病历中记录“胸部损伤后低血压、心音低钝和颈静脉怒张”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","ref":"教材P261—277","chapter":"第18章｜胸部损伤病人的护理｜外科护理学第7版","href":"surgical/ch18-chest-trauma.html","kind":"normal","relation":""},{"type":"cross","label":"急、亚急、慢性感染","tag":"跨章节数值 · 外科感染病人的护理","detail":"急、亚急、慢性感染：3周以内为急性感染；超过2个月为慢性感染；两者之间为亚急性感染。适用条件与安全边界：分期不能替代对脓毒症和器官功能的即时评估；同时观察体温、意识、循环、呼吸、尿量和局部病灶变化","ref":"教材P111","chapter":"第8章｜外科感染病人的护理｜外科护理学第7版","href":"surgical/ch08-surgical-infection.html","kind":"cross"},{"type":"cross","label":"破伤风病情观察","tag":"跨章节数值 · 外科感染病人的护理","detail":"破伤风病情观察：专人护理，至少每4小时测量体温、脉搏和呼吸，并按需监测血压。适用条件与安全边界：刺激可诱发痉挛，喉痉挛和呼吸肌痉挛可致窒息；暗室、减少声光刺激、集中操作；备气道和抢救物品并连续评估痉挛与呼吸","ref":"教材P122—123","chapter":"第8章｜外科感染病人的护理｜外科护理学第7版","href":"surgical/ch08-surgical-infection.html","kind":"cross"},{"type":"cross","label":"水钠成比例丢失","tag":"跨章节 · 第二章 · 水、电解质代谢紊乱和酸碱平衡失调病人的护理","detail":"血钠常在正常范围；先用平衡盐溶液，警惕大量生理盐水致高氯性酸中毒。 考法线索：无明显口渴而乏力、直立性低血压、低钠，方向指向低渗。","ref":"教材P8—10","chapter":"第二章｜水、电解质代谢紊乱和酸碱平衡失调病人的护理｜外科护理学第7版","href":"surgical/ch02-fluids-electrolytes-acid-base.html","kind":"cross","relation":"血压"},{"type":"cross","label":"HCO₃⁻原发下降","tag":"跨章节 · 第二章 · 水、电解质代谢紊乱和酸碱平衡失调病人的护理","detail":"深大呼吸、灌注不足、酸性产物积聚；纠因和改善循环是根本。 考法线索：先看pH，再看哪一项变化能解释方向，最后考虑代偿。","ref":"教材P22—24","chapter":"第二章｜水、电解质代谢紊乱和酸碱平衡失调病人的护理｜外科护理学第7版","href":"surgical/ch02-fluids-electrolytes-acid-base.html","kind":"cross","relation":"呼吸"},{"type":"cross","label":"失H⁺或HCO₃⁻增多","tag":"跨章节 · 第二章 · 水、电解质代谢紊乱和酸碱平衡失调病人的护理","detail":"呕吐、胃肠减压和低钾常见；补液、补氯和补钾需结合病因。 考法线索：先抓病因，再用呼吸深浅和化验确认。","ref":"教材P24—25","chapter":"第二章｜水、电解质代谢紊乱和酸碱平衡失调病人的护理｜外科护理学第7版","href":"surgical/ch02-fluids-electrolytes-acid-base.html","kind":"cross","relation":"呼吸"}]},{"id":"surgical/ch19-chest-wall-pleura.html","label":"胸壁、胸膜疾病病人的护理","title":"以“胸壁、胸膜疾病病人的护理”为中心｜用途、数值与跨章联系","center":"胸壁、胸膜疾病病人的护理","chapter":"第19章｜胸壁、胸膜疾病病人的护理｜外科护理学第7版","href":"surgical/ch19-chest-wall-pleura.html","items":[{"type":"concept","label":"漏斗胸评估","tag":"使用情境 / 考法","detail":"同时关注心肺受压、活动耐量和身体形象。 考法线索：患者病历中记录“漏斗胸患者活动后气促并因胸廓外观回避社交”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","ref":"教材P278—287","chapter":"第19章｜胸壁、胸膜疾病病人的护理｜外科护理学第7版","href":"surgical/ch19-chest-wall-pleura.html","kind":"normal","relation":""},{"type":"concept","label":"脓胸治疗","tag":"使用情境 / 考法","detail":"抗感染与充分引流同等重要。 考法线索：患者进入术后观察期，交班记录提示“脓胸患者持续高热，胸腔积液引流量少且呼吸困难加重”。下一班应重点复评什么，什么变化需要立即上报？","ref":"教材P278—287","chapter":"第19章｜胸壁、胸膜疾病病人的护理｜外科护理学第7版","href":"surgical/ch19-chest-wall-pleura.html","kind":"normal","relation":""},{"type":"concept","label":"引流不畅","tag":"使用情境 / 考法","detail":"呼吸症状加重时先排查体位、扭曲和堵塞。 考法线索：患者进入术后观察期，交班记录提示“胸腔引流管受压弯折，患者胸闷和呼吸急促”。下一班应重点复评什么，什么变化需要立即上报？","ref":"教材P278—287","chapter":"第19章｜胸壁、胸膜疾病病人的护理｜外科护理学第7版","href":"surgical/ch19-chest-wall-pleura.html","kind":"normal","relation":""},{"type":"concept","label":"慢性脓胸","tag":"使用情境 / 考法","detail":"可出现胸廓塌陷、营养不良和肺功能下降。 考法线索：患者病历中记录“慢性脓胸患者胸廓塌陷、消瘦且活动耐量下降”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","ref":"教材P278—287","chapter":"第19章｜胸壁、胸膜疾病病人的护理｜外科护理学第7版","href":"surgical/ch19-chest-wall-pleura.html","kind":"normal","relation":""},{"type":"concept","label":"术后康复","tag":"使用情境 / 考法","detail":"有效镇痛、咳嗽排痰和早期活动可减少肺不张。 考法线索：患者进入术后观察期，交班记录提示“胸部术后因疼痛拒绝咳嗽排痰，肺底呼吸音减弱”。下一班应重点复评什么，什么变化需要立即上报？","ref":"教材P278—287","chapter":"第19章｜胸壁、胸膜疾病病人的护理｜外科护理学第7版","href":"surgical/ch19-chest-wall-pleura.html","kind":"normal","relation":""},{"type":"cross","label":"破伤风抗毒素（TAT）","tag":"跨章节数值 · 外科感染病人的护理","detail":"破伤风抗毒素（TAT）：治疗破伤风常用50 000～200 000 IU；暴露后预防剂量与方案须按免疫史和创口类型决定。适用条件与安全边界：过敏反应和血清病；给药前按规范评估过敏风险并备好抢救药物；注射后严密观察","ref":"教材P121—122","chapter":"第8章｜外科感染病人的护理｜外科护理学第7版","href":"surgical/ch08-surgical-infection.html","kind":"cross"},{"type":"cross","label":"破伤风免疫球蛋白（TIG）","tag":"跨章节数值 · 外科感染病人的护理","detail":"破伤风免疫球蛋白（TIG）：治疗常用3 000～6 000 IU；高风险创口预防常用250～500 IU。适用条件与安全边界：注射部位疼痛，过敏反应少见；核对既往主动免疫史和创口类型；与类毒素分部位注射","ref":"教材P121—122","chapter":"第8章｜外科感染病人的护理｜外科护理学第7版","href":"surgical/ch08-surgical-infection.html","kind":"cross"},{"type":"cross","label":"常见外科疾病范围","tag":"跨章节 · 第一章 · 绪论","detail":"损伤、感染、肿瘤、畸形、梗阻及功能障碍等。 考法线索：题干给病因或病理状态时，先把它归入类别，再调用对应护理逻辑。","ref":"教材P2","chapter":"第一章｜绪论｜外科护理学第7版","href":"surgical/ch01-introduction.html","kind":"cross","relation":"感染"},{"type":"cross","label":"理论联系实践","tag":"跨章节 · 第一章 · 绪论","detail":"知识、技能和临床判断需要在情境中整合。 考法线索：方案题先评估再干预；新情况出现后重新评价并调整。","ref":"教材P4","chapter":"第一章｜绪论｜外科护理学第7版","href":"surgical/ch01-introduction.html","kind":"cross","relation":"评估"},{"type":"cross","label":"HCO₃⁻原发下降","tag":"跨章节 · 第二章 · 水、电解质代谢紊乱和酸碱平衡失调病人的护理","detail":"深大呼吸、灌注不足、酸性产物积聚；纠因和改善循环是根本。 考法线索：先看pH，再看哪一项变化能解释方向，最后考虑代偿。","ref":"教材P22—24","chapter":"第二章｜水、电解质代谢紊乱和酸碱平衡失调病人的护理｜外科护理学第7版","href":"surgical/ch02-fluids-electrolytes-acid-base.html","kind":"cross","relation":"呼吸"}]},{"id":"surgical/ch20-lung-disease.html","label":"肺部疾病病人的护理","title":"以“肺部疾病病人的护理”为中心｜用途、数值与跨章联系","center":"肺部疾病病人的护理","chapter":"第20章｜肺部疾病病人的护理｜外科护理学第7版","href":"surgical/ch20-lung-disease.html","items":[{"type":"concept","label":"肺癌警示","tag":"使用情境 / 考法","detail":"持续咳嗽、咯血、胸痛或反复肺炎需进一步检查。 考法线索：患者主诉和查体出现“长期吸烟者持续刺激性咳嗽、痰中带血并反复肺炎”。最需要考虑哪种病情或并发症？请列出决定判断的线索。","ref":"教材P288—303","chapter":"第20章｜肺部疾病病人的护理｜外科护理学第7版","href":"surgical/ch20-lung-disease.html","kind":"safe","relation":""},{"type":"concept","label":"肺切除体位","tag":"使用情境 / 考法","detail":"体位取决于切除范围和病情，必须先核对术式。 考法线索：患者进入术后观察期，交班记录提示“全肺切除术后体位安排未核对术式和纵隔情况”。下一班应重点复评什么，什么变化需要立即上报？","ref":"教材P288—303","chapter":"第20章｜肺部疾病病人的护理｜外科护理学第7版","href":"surgical/ch20-lung-disease.html","kind":"normal","relation":""},{"type":"concept","label":"气道管理","tag":"使用情境 / 考法","detail":"镇痛、深呼吸、有效咳嗽和雾化有助于预防肺不张。 考法线索：患者进入术后观察期，交班记录提示“肺叶切除术后疼痛明显、咳痰无力并出现肺底湿啰音”。下一班应重点复评什么，什么变化需要立即上报？","ref":"教材P288—303","chapter":"第20章｜肺部疾病病人的护理｜外科护理学第7版","href":"surgical/ch20-lung-disease.html","kind":"normal","relation":""},{"type":"concept","label":"胸管观察","tag":"使用情境 / 考法","detail":"持续大量鲜血或呼吸恶化需紧急评估。 考法线索：患者进入术后观察期，交班记录提示“胸管持续大量鲜红引流并伴心率加快和血压下降”。下一班应重点复评什么，什么变化需要立即上报？","ref":"教材P288—303","chapter":"第20章｜肺部疾病病人的护理｜外科护理学第7版","href":"surgical/ch20-lung-disease.html","kind":"normal","relation":""},{"type":"concept","label":"大咯血","tag":"使用情境 / 考法","detail":"优先保持气道并防止血液进入健侧肺。 考法线索：患者病历中记录“大量咯血时患者平卧，血液向健侧气道流入”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","ref":"教材P288—303","chapter":"第20章｜肺部疾病病人的护理｜外科护理学第7版","href":"surgical/ch20-lung-disease.html","kind":"normal","relation":""},{"type":"cross","label":"破伤风抗毒素（TAT）","tag":"跨章节数值 · 外科感染病人的护理","detail":"破伤风抗毒素（TAT）：治疗破伤风常用50 000～200 000 IU；暴露后预防剂量与方案须按免疫史和创口类型决定。适用条件与安全边界：过敏反应和血清病；给药前按规范评估过敏风险并备好抢救药物；注射后严密观察","ref":"教材P121—122","chapter":"第8章｜外科感染病人的护理｜外科护理学第7版","href":"surgical/ch08-surgical-infection.html","kind":"cross"},{"type":"cross","label":"破伤风免疫球蛋白（TIG）","tag":"跨章节数值 · 外科感染病人的护理","detail":"破伤风免疫球蛋白（TIG）：治疗常用3 000～6 000 IU；高风险创口预防常用250～500 IU。适用条件与安全边界：注射部位疼痛，过敏反应少见；核对既往主动免疫史和创口类型；与类毒素分部位注射","ref":"教材P121—122","chapter":"第8章｜外科感染病人的护理｜外科护理学第7版","href":"surgical/ch08-surgical-infection.html","kind":"cross"},{"type":"cross","label":"理论联系实践","tag":"跨章节 · 第一章 · 绪论","detail":"知识、技能和临床判断需要在情境中整合。 考法线索：方案题先评估再干预；新情况出现后重新评价并调整。","ref":"教材P4","chapter":"第一章｜绪论｜外科护理学第7版","href":"surgical/ch01-introduction.html","kind":"cross","relation":"评估"},{"type":"cross","label":"水钠成比例丢失","tag":"跨章节 · 第二章 · 水、电解质代谢紊乱和酸碱平衡失调病人的护理","detail":"血钠常在正常范围；先用平衡盐溶液，警惕大量生理盐水致高氯性酸中毒。 考法线索：无明显口渴而乏力、直立性低血压、低钠，方向指向低渗。","ref":"教材P8—10","chapter":"第二章｜水、电解质代谢紊乱和酸碱平衡失调病人的护理｜外科护理学第7版","href":"surgical/ch02-fluids-electrolytes-acid-base.html","kind":"cross","relation":"血压"},{"type":"cross","label":"心脏风险突出","tag":"跨章节 · 第二章 · 水、电解质代谢紊乱和酸碱平衡失调病人的护理","detail":"四肢无力、心率慢或心律失常；严重者可心搏骤停。 考法线索：肾功能不全、挤压伤或酸中毒伴心电异常时优先处理高钾。","ref":"教材P16—18","chapter":"第二章｜水、电解质代谢紊乱和酸碱平衡失调病人的护理｜外科护理学第7版","href":"surgical/ch02-fluids-electrolytes-acid-base.html","kind":"cross","relation":"心率"}]},{"id":"surgical/ch21-esophageal-disease.html","label":"食管疾病病人的护理","title":"以“食管疾病病人的护理”为中心｜用途、数值与跨章联系","center":"食管疾病病人的护理","chapter":"第21章｜食管疾病病人的护理｜外科护理学第7版","href":"surgical/ch21-esophageal-disease.html","items":[{"type":"concept","label":"进行性吞咽困难","tag":"使用情境 / 考法","detail":"由固体到半流质再到流质受阻是典型进展线索。 考法线索：患者病历中记录“吞咽困难由固体食物逐渐发展到半流质和流质”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","ref":"教材P304—314","chapter":"第21章｜食管疾病病人的护理｜外科护理学第7版","href":"surgical/ch21-esophageal-disease.html","kind":"normal","relation":""},{"type":"concept","label":"营养准备","tag":"使用情境 / 考法","detail":"术前纠正脱水和营养不足，必要时实施管饲或静脉营养。 考法线索：患者病历中记录“食管癌患者明显消瘦脱水，白蛋白下降，拟接受手术”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","ref":"教材P304—314","chapter":"第21章｜食管疾病病人的护理｜外科护理学第7版","href":"surgical/ch21-esophageal-disease.html","kind":"normal","relation":""},{"type":"concept","label":"吻合口瘘","tag":"使用情境 / 考法","detail":"术后发热、胸痛、呼吸困难或引流异常需警惕。 考法线索：患者进入术后观察期，交班记录提示“食管术后发热、胸痛、呼吸困难且引流液性状异常”。下一班应重点复评什么，什么变化需要立即上报？","ref":"教材P304—314","chapter":"第21章｜食管疾病病人的护理｜外科护理学第7版","href":"surgical/ch21-esophageal-disease.html","kind":"safe","relation":""},{"type":"concept","label":"恢复进食","tag":"使用情境 / 考法","detail":"确认吻合口和胃肠功能后循序进食，出现胸痛应暂停。 考法线索：患者进入术后观察期，交班记录提示“术后刚恢复进食即出现胸痛和发热”。下一班应重点复评什么，什么变化需要立即上报？","ref":"教材P304—314","chapter":"第21章｜食管疾病病人的护理｜外科护理学第7版","href":"surgical/ch21-esophageal-disease.html","kind":"normal","relation":""},{"type":"concept","label":"反流预防","tag":"使用情境 / 考法","detail":"抬高床头、少量多餐并避免餐后平卧。 考法线索：患者治疗过程中突然出现“进食后立即平卧，夜间反流呛咳明显”。护士首先怀疑什么危险变化，第一项处置是什么？","ref":"教材P304—314","chapter":"第21章｜食管疾病病人的护理｜外科护理学第7版","href":"surgical/ch21-esophageal-disease.html","kind":"safe","relation":""},{"type":"cross","label":"急、亚急、慢性感染","tag":"跨章节数值 · 外科感染病人的护理","detail":"急、亚急、慢性感染：3周以内为急性感染；超过2个月为慢性感染；两者之间为亚急性感染。适用条件与安全边界：分期不能替代对脓毒症和器官功能的即时评估；同时观察体温、意识、循环、呼吸、尿量和局部病灶变化","ref":"教材P111","chapter":"第8章｜外科感染病人的护理｜外科护理学第7版","href":"surgical/ch08-surgical-infection.html","kind":"cross"},{"type":"cross","label":"破伤风病情观察","tag":"跨章节数值 · 外科感染病人的护理","detail":"破伤风病情观察：专人护理，至少每4小时测量体温、脉搏和呼吸，并按需监测血压。适用条件与安全边界：刺激可诱发痉挛，喉痉挛和呼吸肌痉挛可致窒息；暗室、减少声光刺激、集中操作；备气道和抢救物品并连续评估痉挛与呼吸","ref":"教材P122—123","chapter":"第8章｜外科感染病人的护理｜外科护理学第7版","href":"surgical/ch08-surgical-infection.html","kind":"cross"},{"type":"cross","label":"HCO₃⁻原发下降","tag":"跨章节 · 第二章 · 水、电解质代谢紊乱和酸碱平衡失调病人的护理","detail":"深大呼吸、灌注不足、酸性产物积聚；纠因和改善循环是根本。 考法线索：先看pH，再看哪一项变化能解释方向，最后考虑代偿。","ref":"教材P22—24","chapter":"第二章｜水、电解质代谢紊乱和酸碱平衡失调病人的护理｜外科护理学第7版","href":"surgical/ch02-fluids-electrolytes-acid-base.html","kind":"cross","relation":"呼吸"},{"type":"cross","label":"失H⁺或HCO₃⁻增多","tag":"跨章节 · 第二章 · 水、电解质代谢紊乱和酸碱平衡失调病人的护理","detail":"呕吐、胃肠减压和低钾常见；补液、补氯和补钾需结合病因。 考法线索：先抓病因，再用呼吸深浅和化验确认。","ref":"教材P24—25","chapter":"第二章｜水、电解质代谢紊乱和酸碱平衡失调病人的护理｜外科护理学第7版","href":"surgical/ch02-fluids-electrolytes-acid-base.html","kind":"cross","relation":"呼吸"},{"type":"cross","label":"PaCO₂原发改变","tag":"跨章节 · 第二章 · 水、电解质代谢紊乱和酸碱平衡失调病人的护理","detail":"通气不足致呼酸；过度通气致呼碱，处理首先回到通气原因。 考法线索：呼吸系统问题先解决通气，不能只追着pH补药。","ref":"教材P25—28","chapter":"第二章｜水、电解质代谢紊乱和酸碱平衡失调病人的护理｜外科护理学第7版","href":"surgical/ch02-fluids-electrolytes-acid-base.html","kind":"cross","relation":"呼吸"}]},{"id":"surgical/ch22-cardiac-great-vessels.html","label":"心脏大血管疾病病人的护理","title":"以“心脏大血管疾病病人的护理”为中心｜用途、数值与跨章联系","center":"心脏大血管疾病病人的护理","chapter":"第22章｜心脏大血管疾病病人的护理｜外科护理学第7版","href":"surgical/ch22-cardiac-great-vessels.html","items":[{"type":"concept","label":"体外循环后","tag":"使用情境 / 考法","detail":"关注出血、低心排、心律失常、体温和肾功能。 考法线索：患者进入术后观察期，交班记录提示“体外循环术后出血增多、尿量下降并出现心律失常”。下一班应重点复评什么，什么变化需要立即上报？","ref":"教材P315—344","chapter":"第22章｜心脏大血管疾病病人的护理｜外科护理学第7版","href":"surgical/ch22-cardiac-great-vessels.html","kind":"normal","relation":""},{"type":"concept","label":"先心分流","tag":"使用情境 / 考法","detail":"法洛四联症以右向左分流和发绀为主。 考法线索：患者主诉和查体出现“患儿发绀、蹲踞，检查提示右向左分流”。最需要考虑哪种病情或并发症？请列出决定判断的线索。","ref":"教材P315—344","chapter":"第22章｜心脏大血管疾病病人的护理｜外科护理学第7版","href":"surgical/ch22-cardiac-great-vessels.html","kind":"safe","relation":""},{"type":"concept","label":"瓣膜抗凝","tag":"使用情境 / 考法","detail":"机械瓣通常需长期抗凝并监测出血和栓塞风险。 考法线索：患者病历中记录“机械瓣置换后自行停用抗凝药，随后出现肢体无力”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","ref":"教材P315—344","chapter":"第22章｜心脏大血管疾病病人的护理｜外科护理学第7版","href":"surgical/ch22-cardiac-great-vessels.html","kind":"safe","relation":""},{"type":"concept","label":"主动脉夹层","tag":"使用情境 / 考法","detail":"突发撕裂样胸背痛和双侧血压差是高危线索。 考法线索：患者病历中记录“突发撕裂样胸背痛并出现双侧上肢血压差”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","ref":"教材P315—344","chapter":"第22章｜心脏大血管疾病病人的护理｜外科护理学第7版","href":"surgical/ch22-cardiac-great-vessels.html","kind":"normal","relation":""},{"type":"concept","label":"低心排综合征","tag":"使用情境 / 考法","detail":"低血压、少尿、皮肤湿冷和意识改变提示心排出量不足。 考法线索：患者进入术后观察期，交班记录提示“心脏术后低血压、少尿、皮肤湿冷并意识淡漠”。下一班应重点复评什么，什么变化需要立即上报？","ref":"教材P315—344","chapter":"第22章｜心脏大血管疾病病人的护理｜外科护理学第7版","href":"surgical/ch22-cardiac-great-vessels.html","kind":"normal","relation":""},{"type":"cross","label":"急、亚急、慢性感染","tag":"跨章节数值 · 外科感染病人的护理","detail":"急、亚急、慢性感染：3周以内为急性感染；超过2个月为慢性感染；两者之间为亚急性感染。适用条件与安全边界：分期不能替代对脓毒症和器官功能的即时评估；同时观察体温、意识、循环、呼吸、尿量和局部病灶变化","ref":"教材P111","chapter":"第8章｜外科感染病人的护理｜外科护理学第7版","href":"surgical/ch08-surgical-infection.html","kind":"cross"},{"type":"cross","label":"破伤风病情观察","tag":"跨章节数值 · 外科感染病人的护理","detail":"破伤风病情观察：专人护理，至少每4小时测量体温、脉搏和呼吸，并按需监测血压。适用条件与安全边界：刺激可诱发痉挛，喉痉挛和呼吸肌痉挛可致窒息；暗室、减少声光刺激、集中操作；备气道和抢救物品并连续评估痉挛与呼吸","ref":"教材P122—123","chapter":"第8章｜外科感染病人的护理｜外科护理学第7版","href":"surgical/ch08-surgical-infection.html","kind":"cross"},{"type":"cross","label":"水钠成比例丢失","tag":"跨章节 · 第二章 · 水、电解质代谢紊乱和酸碱平衡失调病人的护理","detail":"血钠常在正常范围；先用平衡盐溶液，警惕大量生理盐水致高氯性酸中毒。 考法线索：无明显口渴而乏力、直立性低血压、低钠，方向指向低渗。","ref":"教材P8—10","chapter":"第二章｜水、电解质代谢紊乱和酸碱平衡失调病人的护理｜外科护理学第7版","href":"surgical/ch02-fluids-electrolytes-acid-base.html","kind":"cross","relation":"血压"},{"type":"cross","label":"组织灌注不足","tag":"跨章节 · 第三章 · 外科休克病人的护理","detail":"有效循环血量锐减导致微循环障碍、细胞缺氧和代谢紊乱。 考法线索：定义题要落在“有效循环血量”和“组织灌注”，不能只写低血压。","ref":"教材P30","chapter":"第三章｜外科休克病人的护理｜外科护理学第7版","href":"surgical/ch03-shock.html","kind":"cross","relation":"血压"},{"type":"cross","label":"按病因识别","tag":"跨章节 · 第三章 · 外科休克病人的护理","detail":"低血容量、感染、心源性、神经源性和过敏性休克处理重点不同。 考法线索：血压正常不排除早期休克，脉率与脉压差往往更早变化。","ref":"教材P30—32","chapter":"第三章｜外科休克病人的护理｜外科护理学第7版","href":"surgical/ch03-shock.html","kind":"cross","relation":"血压"}]},{"id":"surgical/ch23-peritonitis.html","label":"急性化脓性腹膜炎病人的护理","title":"以“急性化脓性腹膜炎病人的护理”为中心｜用途、数值与跨章联系","center":"急性化脓性腹膜炎病人的护理","chapter":"第23章｜急性化脓性腹膜炎病人的护理｜外科护理学第7版","href":"surgical/ch23-peritonitis.html","items":[{"type":"concept","label":"腹膜刺激征","tag":"使用情境 / 考法","detail":"压痛、反跳痛和肌紧张是重要体征。 考法线索：患者病历中记录“持续腹痛伴压痛、反跳痛和腹肌紧张”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","ref":"教材P345—355","chapter":"第23章｜急性化脓性腹膜炎病人的护理｜外科护理学第7版","href":"surgical/ch23-peritonitis.html","kind":"normal","relation":""},{"type":"concept","label":"全身反应","tag":"使用情境 / 考法","detail":"发热、脉快、脱水和休克提示感染扩散。 考法线索：患者病历中记录“腹腔感染患者高热、脉快、口渴少尿并血压下降”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","ref":"教材P345—355","chapter":"第23章｜急性化脓性腹膜炎病人的护理｜外科护理学第7版","href":"surgical/ch23-peritonitis.html","kind":"normal","relation":""},{"type":"concept","label":"基础处理","tag":"使用情境 / 考法","detail":"禁食、胃肠减压、补液和抗感染，并准备手术。 考法线索：患者进入术后观察期，交班记录提示“腹膜炎患者仍进食且胃肠减压管引流不畅”。下一班应重点复评什么，什么变化需要立即上报？","ref":"教材P345—355","chapter":"第23章｜急性化脓性腹膜炎病人的护理｜外科护理学第7版","href":"surgical/ch23-peritonitis.html","kind":"normal","relation":""},{"type":"concept","label":"半坐卧位","tag":"使用情境 / 考法","detail":"循环稳定时可改善呼吸并使渗液聚集于盆腔。 考法线索：患者病历中记录“循环稳定后仍完全平卧，呼吸浅快且腹腔渗液较多”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","ref":"教材P345—355","chapter":"第23章｜急性化脓性腹膜炎病人的护理｜外科护理学第7版","href":"surgical/ch23-peritonitis.html","kind":"normal","relation":""},{"type":"concept","label":"腹腔脓肿","tag":"使用情境 / 考法","detail":"膈下脓肿可有肩部牵涉痛，盆腔脓肿可有里急后重。 考法线索：患者评估资料符合“治疗后持续发热并出现肩部牵涉痛或里急后重”。当前处理应先解决什么问题，护士怎样配合并评价效果？","ref":"教材P345—355","chapter":"第23章｜急性化脓性腹膜炎病人的护理｜外科护理学第7版","href":"surgical/ch23-peritonitis.html","kind":"normal","relation":""},{"type":"cross","label":"破伤风抗毒素（TAT）","tag":"跨章节数值 · 外科感染病人的护理","detail":"破伤风抗毒素（TAT）：治疗破伤风常用50 000～200 000 IU；暴露后预防剂量与方案须按免疫史和创口类型决定。适用条件与安全边界：过敏反应和血清病；给药前按规范评估过敏风险并备好抢救药物；注射后严密观察","ref":"教材P121—122","chapter":"第8章｜外科感染病人的护理｜外科护理学第7版","href":"surgical/ch08-surgical-infection.html","kind":"cross"},{"type":"cross","label":"急、亚急、慢性感染","tag":"跨章节数值 · 外科感染病人的护理","detail":"急、亚急、慢性感染：3周以内为急性感染；超过2个月为慢性感染；两者之间为亚急性感染。适用条件与安全边界：分期不能替代对脓毒症和器官功能的即时评估；同时观察体温、意识、循环、呼吸、尿量和局部病灶变化","ref":"教材P111","chapter":"第8章｜外科感染病人的护理｜外科护理学第7版","href":"surgical/ch08-surgical-infection.html","kind":"cross"},{"type":"cross","label":"常见外科疾病范围","tag":"跨章节 · 第一章 · 绪论","detail":"损伤、感染、肿瘤、畸形、梗阻及功能障碍等。 考法线索：题干给病因或病理状态时，先把它归入类别，再调用对应护理逻辑。","ref":"教材P2","chapter":"第一章｜绪论｜外科护理学第7版","href":"surgical/ch01-introduction.html","kind":"cross","relation":"感染"},{"type":"cross","label":"理论联系实践","tag":"跨章节 · 第一章 · 绪论","detail":"知识、技能和临床判断需要在情境中整合。 考法线索：方案题先评估再干预；新情况出现后重新评价并调整。","ref":"教材P4","chapter":"第一章｜绪论｜外科护理学第7版","href":"surgical/ch01-introduction.html","kind":"cross","relation":"评估"},{"type":"cross","label":"水钠成比例丢失","tag":"跨章节 · 第二章 · 水、电解质代谢紊乱和酸碱平衡失调病人的护理","detail":"血钠常在正常范围；先用平衡盐溶液，警惕大量生理盐水致高氯性酸中毒。 考法线索：无明显口渴而乏力、直立性低血压、低钠，方向指向低渗。","ref":"教材P8—10","chapter":"第二章｜水、电解质代谢紊乱和酸碱平衡失调病人的护理｜外科护理学第7版","href":"surgical/ch02-fluids-electrolytes-acid-base.html","kind":"cross","relation":"血压"}]},{"id":"surgical/ch24-abdominal-hernia.html","label":"腹外疝病人的护理","title":"以“腹外疝病人的护理”为中心｜用途、数值与跨章联系","center":"腹外疝病人的护理","chapter":"第24章｜腹外疝病人的护理｜外科护理学第7版","href":"surgical/ch24-abdominal-hernia.html","items":[{"type":"concept","label":"可复与嵌顿","tag":"使用情境 / 考法","detail":"不能回纳且疼痛提示嵌顿，伴腹膜刺激征警惕绞窄。 考法线索：患者病历中记录“腹股沟肿块原可回纳，现突然疼痛且不能回纳”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","ref":"教材P356—366","chapter":"第24章｜腹外疝病人的护理｜外科护理学第7版","href":"surgical/ch24-abdominal-hernia.html","kind":"safe","relation":""},{"type":"concept","label":"斜疝直疝","tag":"使用情境 / 考法","detail":"斜疝可进入阴囊，直疝多由直疝三角突出。 考法线索：患者病历中记录“腹股沟包块下降至阴囊，平卧后可部分回纳”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","ref":"教材P356—366","chapter":"第24章｜腹外疝病人的护理｜外科护理学第7版","href":"surgical/ch24-abdominal-hernia.html","kind":"normal","relation":""},{"type":"concept","label":"股疝风险","tag":"使用情境 / 考法","detail":"疝环狭小，嵌顿和绞窄风险较高。 考法线索：患者病历中记录“老年女性股部肿块不大但疼痛剧烈并伴肠梗阻”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","ref":"教材P356—366","chapter":"第24章｜腹外疝病人的护理｜外科护理学第7版","href":"surgical/ch24-abdominal-hernia.html","kind":"safe","relation":""},{"type":"concept","label":"急诊处理","tag":"使用情境 / 考法","detail":"嵌顿疝不可盲目反复手法复位。 考法线索：患者评估资料符合“嵌顿疝患者被反复用力手法推压复位”。当前处理应先解决什么问题，护士怎样配合并评价效果？","ref":"教材P356—366","chapter":"第24章｜腹外疝病人的护理｜外科护理学第7版","href":"surgical/ch24-abdominal-herni
