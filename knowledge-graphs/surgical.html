</style></head><body><main class="wrap"><header class="hero"><small>ICE冰冰·高分学姐团｜跨章节主题图谱</small><h1>外科护理学知识点关系图</h1><p>本页新增外科数值题眼全图：把真题问法、教材数值、适用条件与易错边界串在一起。</p></header><nav class="course-nav"><a href="fundamentals.html" class="">基础护理</a><a href="introduction.html" class="">护理导论</a><a href="medical.html" class="">内科护理</a><a href="surgical.html" class="on">外科护理</a></nav><div class="tabs" id="tabs"></div><section class="layout"><div class="panel"><h2 id="mapTitle"></h2><p class="sub">选一个中心考点，沿分支查看关键参数、使用情境、易混点和教材来源。</p><svg class="map" id="graph" viewBox="0 0 720 468" role="img" aria-label="外科护理学跨章节知识关系图"></svg><div class="pager"><button id="prev">‹ 上一组</button><span id="pageText"></span><button id="next">下一组 ›</button></div><div class="legend"><span><i class="dot"></i>中心概念</span><span><i class="dot2"></i>用途 / 数值 / 跨章关联</span><span><i class="dot3"></i>易错与安全边界</span></div></div><aside class="panel detail" id="detail"></aside></section><p class="footer">数值图谱共9组、68个关联节点。依据《外科护理学》第7版教材页码与现有院校真题/回忆题；考题落点反映当前收集材料，不外推全国考频。遇到不同年份口径，按题干指定教材核对。</p></main><script>
const MAPS=[{"id":"shock","label":"休克：代偿、失代偿与复苏监测","center":"休克 × 组织灌注","logic":"有效循环血量下降后，早期代偿可让血压暂时维持；继续低灌注会反映在脉压、意识、皮肤、尿量和器官功能。判断靠趋势和组合指标，补液同时处理病因。","items":[{"type":"concept","label":"组织灌注不足","tag":"机制/指标/复苏","detail":"有效循环血量锐减导致微循环障碍、细胞缺氧和代谢紊乱。 易考线索：定义题要落在“有效循环血量”和“组织灌注”，不能只写低血压。","ref":"教材P30","chapter":"第三章｜外科休克病人的护理｜外科护理学第7版","href":"surgical/ch03-shock.html","kind":"safe"},{"type":"concept","label":"休克指数","tag":"≥1 · >2","detail":"心率/收缩压；≥1提示休克，>2提示严重。 易考线索：复苏后血压回升但尿量仍低，不能轻率判断纠正。","ref":"教材P36","chapter":"第三章｜外科休克病人的护理｜外科护理学第7版","href":"surgical/ch03-shock.html","kind":"safe"},{"type":"concept","label":"肾灌注窗口","tag":"30 ml/h","detail":"30 ml/h常提示复苏改善。 易考线索：必须把CVP与血压、临床反应联读。","ref":"教材P36","chapter":"第三章｜外科休克病人的护理｜外科护理学第7版","href":"surgical/ch03-shock.html","kind":"normal"},{"type":"concept","label":"补液与纠因并行","tag":"机制/指标/复苏","detail":"快速建立静脉通路，晶体液优先，按反应追加并控制出血/感染源。 易考线索：“补液”和“纠因”不是二选一，需并行推进。","ref":"教材P35—38","chapter":"第三章｜外科休克病人的护理｜外科护理学第7版","href":"surgical/ch03-shock.html","kind":"normal"},{"type":"concept","label":"冷暖休克辨析","tag":"机制/指标/复苏","detail":"暖休克可见皮肤较温暖、脉压较大；冷休克表现为外周收缩和低灌注。 易考线索：不能因皮肤温暖就排除休克，仍要看灌注与器官功能。","ref":"教材P41—42","chapter":"第三章｜外科休克病人的护理｜外科护理学第7版","href":"surgical/ch03-shock.html","kind":"safe"},{"type":"concept","label":"水钠成比例丢失","tag":"机制/指标/复苏","detail":"血钠常在正常范围；先用平衡盐溶液，警惕大量生理盐水致高氯性酸中毒。 易考线索：无明显口渴而乏力、直立性低血压、低钠，方向指向低渗。","ref":"教材P8—10","chapter":"第二章｜水、电解质代谢紊乱和酸碱平衡失调病人的护理｜外科护理学第7版","href":"surgical/ch02-fluids-electrolytes-acid-base.html","kind":"safe"},{"type":"concept","label":"失钠多于失水","tag":"<135 mmol/L","detail":"血钠<135 mmol/L，常无明显口渴；严重时循环和神经症状突出。 易考线索：明显口渴、高钠和细胞脱水表现相互印证；补水不可过快。","ref":"教材P10—11","chapter":"第二章｜水、电解质代谢紊乱和酸碱平衡失调病人的护理｜外科护理学第7版","href":"surgical/ch02-fluids-electrolytes-acid-base.html","kind":"normal"},{"type":"concept","label":"失水多于失钠","tag":">150 mmol/L","detail":"血钠>150 mmol/L，口渴明显；先补水分，分次纠正。 易考线索：大量低渗液输入后出现头痛、躁动、意识改变，先考虑急性水中毒。","ref":"教材P12—13","chapter":"第二章｜水、电解质代谢紊乱和酸碱平衡失调病人的护理｜外科护理学第7版","href":"surgical/ch02-fluids-electrolytes-acid-base.html","kind":"normal"},{"type":"confusion","label":"血压正常 ≠ 排除早期休克","tag":"看脉压、脉率、尿量和意识趋势","detail":"休克指数按心率/收缩压理解；脉压缩小、尿量下降和意识变化可早于明显低血压。单一指标不能替代整体灌注判断。","ref":"教材P30、P35—42","chapter":"外科第2—3章｜水电解质、休克","href":"surgical/ch03-shock.html","kind":"safe"}]},{"id":"tetanus","label":"破伤风：治疗与暴露后预防不能混","center":"破伤风 × 创口免疫","logic":"先判患者是已发病治疗还是创口暴露后预防，再查免疫史和创口风险；被动免疫与主动免疫的制剂、用途和剂量不同，给药后还需关注过敏和痉挛风险。","items":[{"type":"number","label":"破伤风抗毒素（TAT）","tag":"治疗破伤风常用50 000～200 000 IU；暴露后预防剂量与方案须按免疫史和创口类型决定","detail":"破伤风抗毒素（TAT）：治疗破伤风常用50 000～200 000 IU；暴露后预防剂量与方案须按免疫史和创口类型决定。适用条件：过敏反应和血清病；给药前按规范评估过敏风险并备好抢救药物；注射后严密观察","ref":"教材P121—122","chapter":"第8章｜外科感染病人的护理｜外科护理学第7版","href":"surgical/ch08-surgical-infection.html","kind":"safe"},{"type":"number","label":"破伤风免疫球蛋白（TIG）","tag":"治疗常用3 000～6 000 IU；高风险创口预防常用250～500 IU","detail":"破伤风免疫球蛋白（TIG）：治疗常用3 000～6 000 IU；高风险创口预防常用250～500 IU。适用条件：注射部位疼痛，过敏反应少见；核对既往主动免疫史和创口类型；与类毒素分部位注射","ref":"教材P121—122","chapter":"第8章｜外科感染病人的护理｜外科护理学第7版","href":"surgical/ch08-surgical-infection.html","kind":"normal"},{"type":"number","label":"破伤风类毒素","tag":"已有基础免疫者受伤后可用0.5 ml加强免疫","detail":"破伤风类毒素：已有基础免疫者受伤后可用0.5 ml加强免疫。适用条件：局部疼痛、红肿，少见全身过敏反应；核对免疫记录和加强时间；不能用类毒素替代已发病患者的毒素中和与支持治疗","ref":"教材P121—122","chapter":"第8章｜外科感染病人的护理｜外科护理学第7版","href":"surgical/ch08-surgical-infection.html","kind":"safe"},{"type":"number","label":"急、亚急、慢性感染","tag":"3周以内为急性感染；超过2个月为慢性感染；两者之间为亚急性感染","detail":"急、亚急、慢性感染：3周以内为急性感染；超过2个月为慢性感染；两者之间为亚急性感染。适用条件：分期不能替代对脓毒症和器官功能的即时评估；同时观察体温、意识、循环、呼吸、尿量和局部病灶变化","ref":"教材P111","chapter":"第8章｜外科感染病人的护理｜外科护理学第7版","href":"surgical/ch08-surgical-infection.html","kind":"safe"},{"type":"number","label":"气性坏疽伤口","tag":"敞开伤口可用3%过氧化氢溶液冲洗、湿敷","detail":"气性坏疽伤口：敞开伤口可用3%过氧化氢溶液冲洗、湿敷。适用条件：感染可迅速扩展并引起溶血、休克和多器官功能障碍；立即隔离并配合急诊清创；严密观察疼痛、肿胀、捻发感、分泌物和循环状态","ref":"教材P124—125","chapter":"第8章｜外科感染病人的护理｜外科护理学第7版","href":"surgical/ch08-surgical-infection.html","kind":"normal"},{"type":"number","label":"破伤风病情观察","tag":"专人护理，至少每4小时测量体温、脉搏和呼吸，并按需监测血压","detail":"破伤风病情观察：专人护理，至少每4小时测量体温、脉搏和呼吸，并按需监测血压。适用条件：刺激可诱发痉挛，喉痉挛和呼吸肌痉挛可致窒息；暗室、减少声光刺激、集中操作；备气道和抢救物品并连续评估痉挛与呼吸","ref":"教材P122—123","chapter":"第8章｜外科感染病人的护理｜外科护理学第7版","href":"surgical/ch08-surgical-infection.html","kind":"normal"},{"type":"concept","label":"破伤风","tag":"创口与临床表现","detail":"减少声光刺激、集中护理、保持气道并控制痉挛。 易考线索：患者病历中记录“轻微外伤后出现张口困难和阵发性肌痉挛，声光刺激可诱发”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","ref":"教材P110—126","chapter":"第8章｜外科感染病人的护理｜外科护理学第7版","href":"surgical/ch08-surgical-infection.html","kind":"normal"},{"type":"concept","label":"局部感染","tag":"创口与临床表现","detail":"红肿热痛和功能障碍常见，形成脓肿后通常需要充分引流。 易考线索：患者进入术后观察期，交班记录提示“切口红肿热痛，中央出现波动感并伴发热”。下一班应重点复评什么，什么变化需要立即上报？","ref":"教材P110—126","chapter":"第8章｜外科感染病人的护理｜外科护理学第7版","href":"surgical/ch08-surgical-infection.html","kind":"normal"},{"type":"concept","label":"手部感染","tag":"创口与临床表现","detail":"腱鞘和深间隙感染可迅速损害手功能，应早期制动、抬高和引流。 易考线索：患者病历中记录“手指屈肌腱鞘区剧痛、肿胀，伸指时疼痛明显加重”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","ref":"教材P110—126","chapter":"第8章｜外科感染病人的护理｜外科护理学第7版","href":"surgical/ch08-surgical-infection.html","kind":"normal"},{"type":"confusion","label":"TAT / TIG / 类毒素不互换","tag":"被动免疫 ≠ 主动免疫","detail":"TAT/TIG提供被动免疫；类毒素用于主动免疫。已发病治疗剂量和暴露后预防方案不同，须连免疫史、创口类型和用途一起判断。","ref":"教材P111、P121—123","chapter":"外科第8章｜外科感染病人的护理","href":"surgical/ch08-surgical-infection.html","kind":"safe"}]},{"id":"fluid","label":"外科补液：看丢失水还是丢失钠","center":"失液性质 × 电解质方向","logic":"先比较水和钠的丢失比例，结合血钠、口渴、循环和神经表现判等渗、低渗或高渗；再选择补液方向并控制纠正速度，持续复评灌注和尿量。","items":[{"type":"concept","label":"水钠成比例丢失","tag":"失液类型与治疗方向","detail":"血钠常在正常范围；先用平衡盐溶液，警惕大量生理盐水致高氯性酸中毒。 易考线索：无明显口渴而乏力、直立性低血压、低钠，方向指向低渗。","ref":"教材P8—10","chapter":"第二章｜水、电解质代谢紊乱和酸碱平衡失调病人的护理｜外科护理学第7版","href":"surgical/ch02-fluids-electrolytes-acid-base.html","kind":"safe"},{"type":"concept","label":"失钠多于失水","tag":"<135 mmol/L","detail":"血钠<135 mmol/L，常无明显口渴；严重时循环和神经症状突出。 易考线索：明显口渴、高钠和细胞脱水表现相互印证；补水不可过快。","ref":"教材P10—11","chapter":"第二章｜水、电解质代谢紊乱和酸碱平衡失调病人的护理｜外科护理学第7版","href":"surgical/ch02-fluids-electrolytes-acid-base.html","kind":"normal"},{"type":"concept","label":"失水多于失钠","tag":">150 mmol/L","detail":"血钠>150 mmol/L，口渴明显；先补水分，分次纠正。 易考线索：大量低渗液输入后出现头痛、躁动、意识改变，先考虑急性水中毒。","ref":"教材P12—13","chapter":"第二章｜水、电解质代谢紊乱和酸碱平衡失调病人的护理｜外科护理学第7版","href":"surgical/ch02-fluids-electrolytes-acid-base.html","kind":"normal"},{"type":"concept","label":"补液与纠因并行","tag":"失液类型与治疗方向","detail":"快速建立静脉通路，晶体液优先，按反应追加并控制出血/感染源。 易考线索：“补液”和“纠因”不是二选一，需并行推进。","ref":"教材P35—38","chapter":"第三章｜外科休克病人的护理｜外科护理学第7版","href":"surgical/ch03-shock.html","kind":"normal"},{"type":"concept","label":"组织灌注不足","tag":"失液类型与治疗方向","detail":"有效循环血量锐减导致微循环障碍、细胞缺氧和代谢紊乱。 易考线索：定义题要落在“有效循环血量”和“组织灌注”，不能只写低血压。","ref":"教材P30","chapter":"第三章｜外科休克病人的护理｜外科护理学第7版","href":"surgical/ch03-shock.html","kind":"safe"},{"type":"confusion","label":"低钠、高钠不只看数字","tag":"血钠＋口渴＋容量状态一起推","detail":"低渗性缺水常有血钠＜135 mmol/L；高渗性缺水常见血钠＞150 mmol/L、口渴明显。纠正过快也有风险，不能只背阈值。","ref":"教材P8—13、P35—38","chapter":"外科第2—3章｜水电解质、休克","href":"surgical/ch02-fluids-electrolytes-acid-base.html","kind":"safe"}]},{"id":"perioperative","label":"术前、术中、术后：风险如何接力","center":"手术风险 × 全程防线","logic":"术前评估找出气道、心肺、药物和禁食风险；术中通过核查、体位保护和无菌操作防错；术后先守气道与循环，再观察出血、疼痛、切口和引流，形成连续交接。","items":[{"type":"concept","label":"手术体位","tag":"阶段与风险","detail":"既要暴露术野，也要保护神经、骨隆突、呼吸和循环。 易考线索：患者病历中记录“关腹前纱布清点数目与术前记录不一致”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","ref":"教材P57—73","chapter":"第5章｜手术室管理和工作｜外科护理学第7版","href":"surgical/ch05-operating-room.html","kind":"normal"},{"type":"concept","label":"麻醉前评估","tag":"阶段与风险","detail":"重点核查气道、心肺功能、过敏史、用药和禁食情况。 易考线索：患者病历中记录“麻醉前评估发现张口受限、既往困难气道并服用抗凝药”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","ref":"教材P74—91","chapter":"第6章｜麻醉病人的护理｜外科护理学第7版","href":"surgical/ch06-anesthesia.html","kind":"normal"},{"type":"concept","label":"椎管内麻醉","tag":"阶段与风险","detail":"交感阻滞可致低血压，阻滞平面过高可影响呼吸。 易考线索：患者病历中记录“椎管内麻醉后血压下降、心率减慢，麻醉平面继续上升”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","ref":"教材P74—91","chapter":"第6章｜麻醉病人的护理｜外科护理学第7版","href":"surgical/ch06-anesthesia.html","kind":"normal"},{"type":"concept","label":"引流观察","tag":"阶段与风险","detail":"记录量、颜色、性质与通畅度，鲜红骤增或突然停止均需评估。 易考线索：患者进入术后观察期，交班记录提示“术后引流液突然鲜红增多，随后管路又无液体流出”。下一班应重点复评什么，什么变化需要立即上报？","ref":"教材P92—109","chapter":"第7章｜手术前后病人的护理｜外科护理学第7版","href":"surgical/ch07-perioperative-care.html","kind":"normal"},{"type":"concept","label":"局部感染","tag":"阶段与风险","detail":"红肿热痛和功能障碍常见，形成脓肿后通常需要充分引流。 易考线索：患者进入术后观察期，交班记录提示“切口红肿热痛，中央出现波动感并伴发热”。下一班应重点复评什么，什么变化需要立即上报？","ref":"教材P110—126","chapter":"第8章｜外科感染病人的护理｜外科护理学第7版","href":"surgical/ch08-surgical-infection.html","kind":"normal"},{"type":"concept","label":"胸腔引流","tag":"阶段与风险","detail":"水封瓶低于胸腔，保持密闭通畅并观察水柱和气泡。 易考线索：患者进入术后观察期，交班记录提示“胸腔闭式引流瓶高于胸壁且水封管内水柱不波动”。下一班应重点复评什么，什么变化需要立即上报？","ref":"教材P261—277","chapter":"第18章｜胸部损伤病人的护理｜外科护理学第7版","href":"surgical/ch18-chest-trauma.html","kind":"normal"},{"type":"concept","label":"引流不畅","tag":"阶段与风险","detail":"呼吸症状加重时先排查体位、扭曲和堵塞。 易考线索：患者进入术后观察期，交班记录提示“胸腔引流管受压弯折，患者胸闷和呼吸急促”。下一班应重点复评什么，什么变化需要立即上报？","ref":"教材P278—287","chapter":"第19章｜胸壁、胸膜疾病病人的护理｜外科护理学第7版","href":"surgical/ch19-chest-wall-pleura.html","kind":"normal"},{"type":"confusion","label":"术后引流骤停 ≠ 好转","tag":"同时排查出血、堵管和位置","detail":"引流液突然鲜红增多提示出血风险；突然停止也可能堵管、扭曲或血块。结合患者状态、引流性质和装置通畅度复评。","ref":"教材P92—109、P261—287","chapter":"外科第7、18—19章","href":"surgical/ch07-perioperative-care.html","kind":"safe"}]},{"id":"pain","label":"疼痛：评估—干预—再评价","center":"疼痛 × 镇痛与功能恢复","logic":"先评疼痛性质、强度和功能影响，再结合病因、手术阶段和患者风险制定镇痛；处理后复评效果、呼吸循环和活动能力，必要时调整方案。","items":[{"type":"concept","label":"典型疼痛","tag":"评估/干预/风险","detail":"腹痛由脐周转移至右下腹，麦氏点压痛有提示意义。 易考线索：患者的记录中出现“腹痛从脐周转移至右下腹并有麦氏点压痛”。这个数值或时间条件是否达到干预标准？请给出判断和下一步护理。","ref":"教材P406—414","chapter":"第28章｜阑尾炎病人的护理｜外科护理学第7版","href":"surgical/ch28-appendicitis.html","kind":"normal"},{"type":"concept","label":"局麻毒性","tag":"评估/干预/风险","detail":"口周麻木、耳鸣、躁动、抽搐或心律失常提示局麻药全身毒性。 易考线索：患者的记录中出现“局麻药注射后出现口周麻木、耳鸣、躁动并逐渐抽搐”。这个数值或时间条件是否达到干预标准？请给出判断和下一步护理。","ref":"教材P74—91","chapter":"第6章｜麻醉病人的护理｜外科护理学第7版","href":"surgical/ch06-anesthesia.html","kind":"normal"},{"type":"concept","label":"椎管内麻醉","tag":"评估/干预/风险","detail":"交感阻滞可致低血压，阻滞平面过高可影响呼吸。 易考线索：患者病历中记录“椎管内麻醉后血压下降、心率减慢，麻醉平面继续上升”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","ref":"教材P74—91","chapter":"第6章｜麻醉病人的护理｜外科护理学第7版","href":"surgical/ch06-anesthesia.html","kind":"normal"},{"type":"concept","label":"手术体位","tag":"评估/干预/风险","detail":"既要暴露术野，也要保护神经、骨隆突、呼吸和循环。 易考线索：患者病历中记录“关腹前纱布清点数目与术前记录不一致”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","ref":"教材P57—73","chapter":"第5章｜手术室管理和工作｜外科护理学第7版","href":"surgical/ch05-operating-room.html","kind":"normal"},{"type":"concept","label":"引流观察","tag":"评估/干预/风险","detail":"记录量、颜色、性质与通畅度，鲜红骤增或突然停止均需评估。 易考线索：患者进入术后观察期，交班记录提示“术后引流液突然鲜红增多，随后管路又无液体流出”。下一班应重点复评什么，什么变化需要立即上报？","ref":"教材P92—109","chapter":"第7章｜手术前后病人的护理｜外科护理学第7版","href":"surgical/ch07-perioperative-care.html","kind":"normal"},{"type":"confusion","label":"疼痛不能只看表情","tag":"患者自述＋功能＋不良反应","detail":"术后镇痛要兼顾活动恢复与呼吸循环安全；麻醉方式和病因会改变观察重点。","ref":"教材相关麻醉与围手术期章节","chapter":"外科第6—7章","href":"surgical/ch06-anesthesia.html","kind":"safe"}]}];const NUMERIC_MAPS=[{"id":"n_fluid","label":"① 体液与电解质｜阈值、补法、安全量","center":"血清值 × 临床表现 × 补液边界","logic":"先判断指标处于哪一档，再把症状与丢失机制对应起来；最后核对补液对象、速度、浓度和尿量条件。题干只给一个数值时，先找它所处的章节情境。","items":[{"type":"number","kind":"safe","label":"每日生理需要量","tag":"成人按体重：100 / 50 / 20","detail":"估算公式：体重前10 kg按100 ml/(kg·d)，第2个10 kg按50 ml/(kg·d)，其余体重按20 ml/(kg·d)。高龄或心脏病患者实际补液量应少于计算量。题干常给体重，问基础需要量；别把“生理需要量”当成总补液量。","ref":"教材P10","chapter":"第2章｜水、电解质代谢紊乱和酸碱平衡失调","href":"surgical/ch02-fluids-electrolytes-acid-base.html","exam":"真题落点：补液计算题先区分生理需要量、已损失量和继续丢失量。"},{"type":"number","kind":"safe","label":"低钠界值","tag":"Na⁺ <135 mmol/L；重度 <120","detail":"低钠血症界值为血清Na⁺<135 mmol/L；重度缺钠可低于120 mmol/L并出现意识、循环改变。题干问定性/程度时，把血钠与口渴、尿量、循环表现一起看，不能只凭疲乏判重度。","ref":"教材P11—12","chapter":"第2章｜水、电解质代谢紊乱和酸碱平衡失调","href":"surgical/ch02-fluids-electrolytes-acid-base.html","exam":"常见问法：给Na⁺及体征，判断缺钠类型或严重程度。"},{"type":"number","kind":"safe","label":"高钠界值","tag":"Na⁺ >150 mmol/L","detail":"高渗性缺水常见血清Na⁺>150 mmol/L；轻度脱水约占体重2%—4%，中度4%—6%，重度>6%。题干常用明显口渴、皮肤干燥和高钠作组合线索；纠正速度需看教材和医嘱，不要按数字自行推算临床输液。","ref":"教材P12—13","chapter":"第2章｜水、电解质代谢紊乱和酸碱平衡失调","href":"surgical/ch02-fluids-electrolytes-acid-base.html","exam":"常见问法：由血钠、口渴与失水比例反推高渗性缺水。"},{"type":"number","kind":"safe","label":"血钾范围","tag":"3.5—5.5 mmol/L","detail":"教材给出的正常血清钾为3.5—5.5 mmol/L；低于3.5为低钾，高于5.5为高钾。题干常把心电图、肌无力、肠蠕动和补钾医嘱组合起来，问判断或优先护理。","ref":"教材P14—17","chapter":"第2章｜水、电解质代谢紊乱和酸碱平衡失调","href":"surgical/ch02-fluids-electrolytes-acid-base.html","exam":"真题反复落点：低钾表现、高钾心电图与补钾安全。"},{"type":"number","kind":"safe","label":"静脉补钾三条件","tag":"尿量 >40 ml/h；浓度≤0.3%；≤60滴/min","detail":"先确认有尿（教材写尿量>40 ml/h或>500 ml/d）；静脉液中氯化钾浓度通常不超过0.3%，成人滴速一般不超过60滴/min。题干问“错误护理”时，直接静推、尿少未评估、浓度/速度过高都是危险选项。","ref":"教材P15—16","chapter":"第2章｜水、电解质代谢紊乱和酸碱平衡失调","href":"surgical/ch02-fluids-electrolytes-acid-base.html","exam":"典型考法：补钾前提、浓度、速度三个安全边界。"},{"type":"number","kind":"safe","label":"钙、镁正常范围","tag":"Ca²⁺ 2.25—2.75；Mg²⁺ 0.75—1.25 mmol/L","detail":"血清钙正常2.25—2.75 mmol/L；血清镁正常0.75—1.25 mmol/L。题干给口周麻木/手足抽搐时联想低钙；低镁可伴低钾、低钙，不能只补单个离子后停止判断。","ref":"教材P17—21","chapter":"第2章｜水、电解质代谢紊乱和酸碱平衡失调","href":"surgical/ch02-fluids-electrolytes-acid-base.html","exam":"常见问法：实验室数值辨析与神经肌肉表现配对。"},{"type":"number","kind":"safe","label":"酸中毒分层","tag":"HCO₃⁻ 16—18轻；<15 mmol/L重","detail":"教材把血浆HCO₃⁻ 16—18 mmol/L列为轻症代谢性酸中毒，<15 mmol/L列为重症。题干常给pH、HCO₃⁻、PaCO₂，问酸碱失衡；先定原发方向，再看代偿，不能只看一个pH。","ref":"教材P23—25","chapter":"第2章｜水、电解质代谢紊乱和酸碱平衡失调","href":"surgical/ch02-fluids-electrolytes-acid-base.html","exam":"真题落点：血气分析判断类型，并识别重症阈值。"},{"type":"number","kind":"safe","label":"缺水补充节奏","tag":"第1个24 h：先补约1/2损失量","detail":"教材按缺水量估算时，通常第1个24 h补充约1/2已损失量，余量结合病情在第2日补；体温每升高1℃可按3—5 ml/kg补充额外丢失。题干问“如何安排”时，答案必须包含复评与动态调整，不是只报总数。","ref":"教材P10、P13","chapter":"第2章｜水、电解质代谢紊乱和酸碱平衡失调","href":"surgical/ch02-fluids-electrolytes-acid-base.html","exam":"常见问法：补液量组成、先后节奏与病情复评。"}]},{"id":"n_shock","label":"② 休克｜灌注指标与复苏判断","center":"有效循环血量 × 组织灌注","logic":"休克数值要读成趋势：血压可能暂时维持，脉压、尿量、意识、皮肤温度与CVP共同反映灌注。先辨容量不足还是泵功能问题，再判断补液反应。","items":[{"type":"number","kind":"safe","label":"脉压与休克","tag":"脉压 <30 mmHg；收缩压 <90提示休克","detail":"教材指出脉压缩小（<30 mmHg）可见于早期休克；收缩压<90 mmHg、脉压<20 mmHg提示休克存在。题干若血压尚未明显下降但脉压变小、心率快、尿量降，不能排除早期休克。","ref":"教材P33、P36","chapter":"第3章｜外科休克病人的护理","href":"surgical/ch03-shock.html","exam":"真题常给BP、脉率和意识，问休克分期或是否休克。"},{"type":"number","kind":"safe","label":"尿量看灌注","tag":"<25 ml/h警惕；>30 ml/h提示改善","detail":"教材描述休克尿量<25 ml/h提示肾血管收缩或血容量不足；复苏后尿量>30 ml/h是血容量改善的重要线索。题干会问“复苏有效指标”，要与意识、脉压和末梢循环一起选。","ref":"教材P36—37、P42","chapter":"第3章｜外科休克病人的护理","href":"surgical/ch03-shock.html","exam":"真题落点：尿量阈值与复苏效果判断。"},{"type":"number","kind":"safe","label":"中心静脉压","tag":"<5 cmH₂O低；>15提示心功能/肺阻力问题","detail":"教材列CVP<5 cmH₂O提示血容量不足；>15 cmH₂O考虑心功能不全或肺循环阻力增高，>20 cmH₂O提示更明显异常。题干要联合血压看：低CVP+低BP倾向补液；高CVP+低BP不应盲目加速补液。","ref":"教材P34、P37—38","chapter":"第3章｜外科休克病人的护理","href":"surgical/ch03-shock.html","exam":"四川大学2011真题：CVP 4 cmH₂O、BP 80/60 mmHg，考补液决策。"},{"type":"number","kind":"safe","label":"补液试验","tag":"等渗盐水250 ml / 5—10 min","detail":"教材补液试验：等渗盐水250 ml在5—10 min内输入。BP升高、CVP不变支持血容量不足；BP不变而CVP上升3—5 cmH₂O，提示心功能不全。题眼是“两个指标的反应组合”，不是单看输液后血压。","ref":"教材P37","chapter":"第3章｜外科休克病人的护理","href":"surgical/ch03-shock.html","exam":"高频问法：快速补液后血压/CVP变化，判断下一步方向。"},{"type":"number","kind":"safe","label":"血压监测频率","tag":"每5—10 min；平稳后每15—30 min","detail":"使用血管活性药物时，教材要求心电监护并每5—10 min测血压；平稳后每15—30 min测一次，按血压调整药物浓度与速度。题干考药物输注护理时，别把稳定后间隔套到不稳定阶段。","ref":"教材P38","chapter":"第3章｜外科休克病人的护理","href":"surgical/ch03-shock.html","exam":"常见考法：休克用药期间监测频率与滴速调整。"},{"type":"number","kind":"safe","label":"SIRS数值组合","tag":"T >38/<36℃；HR>90；RR>20；WBC>12/<4","detail":"教材列SIRS线索：体温>38℃或<36℃；心率>90次/min；呼吸>20次/min或PaCO₂<32 mmHg；白细胞>12×10⁹/L或<4×10⁹/L，或未成熟白细胞>10%。题干问标准时是满足组合项，不是单一发热。","ref":"教材P41","chapter":"第3章｜外科休克病人的护理","href":"surgical/ch03-shock.html","exam":"病例题常给多项生命体征与血象，要求识别全身炎症反应。"},{"type":"number","kind":"safe","label":"失血性休克线索","tag":"失血 >总血量20%可发生休克","detail":"教材指出失血量超过总血量20%即可发生休克；出血量、脉搏、脉压、尿量和末梢循环需一起判断。题干常以创伤/腹腔出血病例给血压与CVP，问急救优先级。","ref":"教材P39—40","chapter":"第3章｜外科休克病人的护理","href":"surgical/ch03-shock.html","exam":"真题落点：创伤出血量与低血容量性休克判断。"},{"type":"number","kind":"safe","label":"氧合目标与危重提示","tag":"SpO₂ ≥95%；PaO₂<60 mmHg警惕","detail":"教材休克护理要求维持血氧饱和度≥95%；PaO₂<60 mmHg且吸氧无改善提示呼吸衰竭/ARDS风险。题干问氧疗观察时，需区分目标值和病情恶化阈值。","ref":"教材P38、P42","chapter":"第3章｜外科休克病人的护理","href":"surgical/ch03-shock.html","exam":"常见问法：复苏期间氧合监测与呼吸衰竭识别。"}]},{"id":"n_burn","label":"③ 烧伤｜面积、深度与补液计算","center":"烧伤面积 × 体重 × 伤后时间","logic":"先算Ⅱ、Ⅲ度面积，再分成人/儿童/婴儿套公式；把每日生理需要量另加；最后按伤后经过时间分配。烧伤公式题的错选多来自把Ⅰ度面积计入或忘记时间窗。","items":[{"type":"number","kind":"safe","label":"成人新九分法","tag":"头颈9%；上肢18%；躯干27%；下肢46%（含臀）","detail":"中国新九分法成人：头颈9%，双上肢18%，躯干（包括会阴）27%，双下肢（包括臀部）46%（表内以5×9%+1%表示）。题干常给身体部位，问面积或严重程度；女性双臀、双足比例按教材表格特殊标注。","ref":"教材P134—135","chapter":"第9章｜损伤病人的护理","href":"surgical/ch09-injury-burn.html","exam":"扬州大学2023真题：给体重与Ⅱ、Ⅲ度面积，问首个24 h补液量。"},{"type":"number","kind":"safe","label":"儿童面积估算","tag":"头颈=[9+(12−年龄)]%；双下肢=[46−(12−年龄)]%","detail":"儿童头大、下肢相对短：头颈面积=[9+(12−年龄)]%，双下肢=[46−(12−年龄)]%。题干问儿童烧伤面积时不能直接套成人头颈9%、下肢46%。","ref":"教材P135","chapter":"第9章｜损伤病人的护理","href":"surgical/ch09-injury-burn.html","exam":"常见问法：儿童不同年龄烧伤面积估算。"},{"type":"number","kind":"safe","label":"手掌法","tag":"患者五指并拢一掌面约1%","detail":"手掌法适用于小面积或散在烧伤估算，患者手掌（含五指）面积约占体表面积1%。题干给散在小片烧伤时用手掌法；大面积、分布规则时优先新九分法。","ref":"教材P134","chapter":"第9章｜损伤病人的护理","href":"surgical/ch09-injury-burn.html","exam":"常见问法：选择面积估算方法，或将“几掌”换算为百分比。"},{"type":"number","kind":"safe","label":"补液公式适用面积","tag":"只计Ⅱ、Ⅲ度烧伤面积","detail":"成人伤后第1个24 h公式：体重(kg)×Ⅱ、Ⅲ度烧伤面积(%)×1.5 ml + 2000 ml。儿童系数1.8 ml，婴儿2 ml；后项为每日生理需要量。不要把Ⅰ度面积代入，也不要漏掉2000 ml。","ref":"教材P137","chapter":"第9章｜损伤病人的护理","href":"surgical/ch09-injury-burn.html","exam":"扬州大学2023：65 kg，Ⅱ度15%、Ⅲ度5%，问第一个24 h补液量。"},{"type":"number","kind":"safe","label":"首日输入时序","tag":"首个24 h总量的一半在伤后8 h内输入","detail":"伤后第1个24 h算出的补液总量，一半应在伤后8 h内输入，另一半在随后16 h内输入；起算点是受伤时刻，不是入院时刻。题干给“伤后已过几小时”，先扣除已过去时间再排剩余速度。","ref":"教材P137","chapter":"第9章｜损伤病人的护理","href":"surgical/ch09-injury-burn.html","exam":"高频计算陷阱：8小时从伤后开始计时，不从接诊开始。"},{"type":"number","kind":"safe","label":"补液种类比例","tag":"胶体液 : 电解质液 = 1 : 2","detail":"教材通常胶体液与电解质液比例为1:2；大面积深度烧伤和小儿可调整为1:1。第2个24 h电解质液和胶体液为第1个24 h的一半，另加每日生理需要量2000 ml。","ref":"教材P137","chapter":"第9章｜损伤病人的护理","href":"surgical/ch09-injury-burn.html","exam":"常见问法：烧伤补液种类比例和第2日补液安排。"},{"type":"number","kind":"safe","label":"严重程度分层","tag":"轻：Ⅱ度<10%；中：Ⅱ度11—30%或Ⅲ度<10%","detail":"第7版烧伤严重度：轻度为Ⅱ度总面积<10%；中度为Ⅱ度11%—30%或Ⅲ度<10%；重度为总面积31%—50%或Ⅲ度11%—20%，未达面积标准但有休克、吸入性损伤或较重合并伤也属重度；特重为总面积>50%或Ⅲ度>20%，或较重吸入伤/复合伤。通常总面积不计Ⅰ度。","ref":"教材P136","chapter":"第9章｜损伤病人的护理","href":"surgical/ch09-injury-burn.html","exam":"常见问法：根据面积、深度和全身表现判断烧伤严重程度。"}]},{"id":"n_periop","label":"④ 围术期与营养｜时间、量、体位","center":"手术阶段 × 禁食/喂养安全","logic":"同一个数值要先问它属于哪一阶段、哪种途径。术前禁食、肠内喂养、麻醉后卧位和术后预防用药不能互相套用；题库旧选项与教材更新也要辨认。","items":[{"type":"number","kind":"safe","label":"术前禁食禁饮","tag":"教材：禁食6 h；清饮禁至术前2 h","detail":"第7版教材提倡：除胃排空延迟、胃肠蠕动异常及急诊等特殊情况外，清饮可延后至术前2 h，禁食延后至术前6 h。早年真题常出现“禁食8—12 h、禁饮4 h”等选项；做题须按题目指定教材/考试口径辨析，不能把旧选项当本书现行表述。","ref":"教材P96","chapter":"第7章｜手术前后病人的护理","href":"surgical/ch07-perioperative-care.html","exam":"中南大学2018、浙江中医药大学2020旧题都出现8—12/12 h禁食、4 h禁饮选项；对照本版教材P96。"},{"type":"number","kind":"safe","label":"鼻胃管分次喂养","tag":"每次约200 ml；10—20 min；间隔2—3 h","detail":"胃内分次给予时每次约200 ml，在10—20 min内完成，每次间隔2—3 h，每日6—8次。题干问鼻饲单次量或输注方式，须同时辨认“胃内、耐受良好、分次”；不能把空肠持续泵入照搬为分次量。","ref":"教材P50","chapter":"第4章｜外科营养支持病人的护理","href":"surgical/ch04-nutrition-support.html","exam":"哈尔滨医科大学2013真题考鼻饲每次量；本书给出具体输注方式和节奏。"},{"type":"number","kind":"safe","label":"重力间歇喂养","tag":"每次250—500 ml；2—3 h完成","detail":"间歇重力滴注每次250—500 ml，在2—3 h内完成，两次间隔2—3 h，每日4—6次。题干若出现胃肠功能差或空肠管，通常要考虑持续泵入而非机械套用此方案。","ref":"教材P50","chapter":"第4章｜外科营养支持病人的护理","href":"surgical/ch04-nutrition-support.html","exam":"常见考法：比较分次、间歇重力和持续泵入的量与适用情境。"},{"type":"number","kind":"safe","label":"持续泵入","tag":"12—24 h连续输注","detail":"持续经泵输注可持续12—24 h，适用于危重、胃肠功能/耐受较差或经十二指肠、空肠管喂养者。题干给空肠管或耐受差，是识别途径与输注方式的题眼。","ref":"教材P50","chapter":"第4章｜外科营养支持病人的护理","href":"surgical/ch04-nutrition-support.html","exam":"题库常考肠内营养途径、方式与并发症；数值题会用输注节奏作选项。"},{"type":"number","kind":"safe","label":"肠外营养液时限","tag":"配制后24 h内用完","detail":"全胃肠外营养液需无菌配制并在24 h内输完；暂不输注时按教材规定冷藏保存。题干问“错误的护理措施”常以常温久放、擅自加入药物作为干扰。","ref":"教材P52—53","chapter":"第4章｜外科营养支持病人的护理","href":"surgical/ch04-nutrition-support.html","exam":"四川大学2013真题：TPN护理错误项涉及营养液24 h用完。"},{"type":"number","kind":"safe","label":"椎管内麻醉后","tag":"去枕平卧6—8 h","detail":"教材针对腰麻后头痛预防写术后去枕平卧6—8 h；不要与硬膜外麻醉、全麻恢复期体位混为一谈。题干若明确腰麻及体位目的，常考预防脑脊液漏后头痛。","ref":"教材P82","chapter":"第6章｜麻醉病人的护理","href":"surgical/ch06-anesthesia.html","exam":"哈尔滨医科大学2013题考硬膜外后平卧4—6 h；本书还须区分腰麻后6—8 h的口径。"},{"type":"number","kind":"safe","label":"术前呼吸训练","tag":"术前2周戒烟；深呼吸坚持3—5 s","detail":"教材指导吸烟者术前2周戒烟；腹式深呼吸吸气后坚持3—5 s再缩唇呼气。题干问术前呼吸道准备或患者教育时，需说清训练方法和开始时点。","ref":"教材P96","chapter":"第7章｜手术前后病人的护理","href":"surgical/ch07-perioperative-care.html","exam":"围术期常考术前准备与目的，题目可能把戒烟时长作为选项。"},{"type":"number","kind":"safe","label":"预防性抗生素","tag":"切皮前0.5—2 h；手术>3 h或失血>1500 ml可追加","detail":"教材写首次给药在术前0.5—2 h内或麻醉开始时；手术超过3 h或失血量>1500 ml，术中可给第二剂。总预防用药一般≤24 h，个别情况可延长至48 h。题干要区分预防用药与治疗感染，不能把单次追加条件当常规重复给药。","ref":"教材P96","chapter":"第7章｜手术前后病人的护理","href":"surgical/ch07-perioperative-care.html","exam":"真题常把首次给药时点、追加条件与疗程时限拆成干扰选项。"}]},{"id":"n_infection","label":"⑤ 感染与破伤风｜病程、剂量、处理时限","center":"感染阶段 × 免疫用途 × 伤口时序","logic":"先分清一般感染、特异性感染与破伤风；再分清已发病治疗还是伤口暴露后预防。剂量、病程和处理时间都依赖用途，不能跨场景套数值。","items":[{"type":"number","kind":"safe","label":"感染病程分类","tag":"急性≤3周；慢性>2个月","detail":"教材按病程：3周以内为急性感染，超过2个月为慢性感染，两者之间为亚急性感染。题干问分类时按“病程”归类，不等同于病原体潜伏期或伤口愈合时间。","ref":"教材P111","chapter":"第8章｜外科感染病人的护理","href":"surgical/ch08-surgical-infection.html","exam":"感染分类数值题：给持续时间，判断急性/亚急性/慢性。"},{"type":"number","kind":"safe","label":"破伤风TIG治疗剂量","tag":"3 000—6 000 IU（已发病治疗）","detail":"已发生破伤风时，教材列TIG 3 000—6 000 IU肌内注射，用于中和游离毒素。此为治疗情境，不要拿来当暴露后预防剂量；预防需另看伤口类别和免疫史。","ref":"教材P122","chapter":"第8章｜外科感染病人的护理","href":"surgical/ch08-surgical-infection.html","exam":"真题常把破伤风抗毒素目的与免疫制剂用途作辨析。"},{"type":"number","kind":"safe","label":"破伤风TAT治疗剂量","tag":"50 000—200 000 IU（已发病治疗）","detail":"教材列TAT 50 000—200 000 IU用于破伤风治疗，可肌注或稀释后缓慢静滴。此范围不是创伤后常规预防剂量；题目先辨认“患者已发病”还是“污染伤口预防”。","ref":"教材P122","chapter":"第8章｜外科感染病人的护理","href":"surgical/ch08-surgical-infection.html","exam":"易错点：治疗剂量与预防剂量、TAT与TIG相互替换。"},{"type":"number","kind":"safe","label":"破伤风可疑伤口","tag":"3%过氧化氢冲洗/湿敷","detail":"教材对可疑伤口建议彻底清除异物、坏死组织和积血，并用3%过氧化氢溶液冲洗、湿敷以破坏缺氧环境。题干常问创口处理原则；不等于用它替代免疫预防或抗毒素治疗。","ref":"教材P122","chapter":"第8章｜外科感染病人的护理","href":"surgical/ch08-surgical-infection.html","exam":"真题落点：破伤风预防、创口处理与已发病治疗区分。"},{"type":"number","kind":"safe","label":"手外伤清创窗口","tag":"争取伤后6—8 h内","detail":"手部开放伤一般争取伤后6—8 h内彻底清创并尽可能一期修复；污染严重、损伤广泛或超过12 h等情境，教材提到可仅清创后延期或二期修复。题干问处理时机，需同时看污染程度与组织损伤。","ref":"教材P602—603","chapter":"第41章｜手外伤及断肢/指再植","href":"surgical/ch41-hand-injury-replantation.html","exam":"创伤急救常问清创时机及超过时限后的处理。"},{"type":"number","kind":"safe","label":"断肢保存温度","tag":"4 ℃冷藏；不可冷冻","detail":"断肢/指经无菌包裹后置4 ℃冷藏，切忌放冷冻室；转运争取尽早，教材写力争6 h内进行再植。题干问现场保存，避免直接浸泡或冷冻导致组织损伤。","ref":"教材P607","chapter":"第41章｜手外伤及断肢/指再植","href":"surgical/ch41-hand-injury-replantation.html","exam":"典型真题问法：离断肢体保存、转运时限和现场禁忌。"},{"type":"number","kind":"safe","label":"再植血管危象","tag":"术后48 h内易发生","detail":"再植术后48 h内易发生血管危象；患肢颜色、皮温、毛细血管回流和切开出血性状需动态观察。教材要求术后每1—2 h观察一次。题干问观察重点时，紫暗高张力提示静脉回流障碍。","ref":"教材P609","chapter":"第41章｜手外伤及断肢/指再植","href":"surgical/ch41-hand-injury-replantation.html","exam":"真题/病例常考血管危象时间窗与动静脉危象表现。"}]},{"id":"n_neuro","label":"⑥ 颅脑｜压力值与时间窗","center":"颅内压 × 病变演变 × 时间窗","logic":"颅脑数值分别对应正常范围、危象阈值或治疗时间窗。先辨认题目问诊断阈值、风险高峰还是治疗窗口，不能把不同病种的时间点互换。","items":[{"type":"number","kind":"safe","label":"成人正常颅内压","tag":"70—200 mmH₂O（卧位）","detail":"成人卧位正常颅内压为70—200 mmH₂O；持续高于200 mmH₂O称颅内压增高。题干给测压值时要确认单位和测量体位，不能把mmH₂O误读成mmHg。","ref":"教材P182","chapter":"第12章｜颅内压增高及脑疝","href":"surgical/ch12-intracranial-pressure.html","exam":"常见考法：正常范围、增高阈值与脑疝体征辨析。"},{"type":"number","kind":"safe","label":"儿童正常颅内压","tag":"50—100 mmH₂O","detail":"教材儿童正常颅内压为50—100 mmH₂O。题干有年龄时不能套成人70—200 mmH₂O；年龄与单位是两个关键题眼。","ref":"教材P182","chapter":"第12章｜颅内压增高及脑疝","href":"surgical/ch12-intracranial-pressure.html","exam":"常见问法：成人与儿童正常颅内压范围对照。"},{"type":"number","kind":"safe","label":"颅腔代偿极限","tag":"颅内容积↑约5%；容量缩减8%—10%","detail":"教材提到颅内容积增加临界值约5%，颅腔容量缩减临界范围8%—10%，超过范围颅内压开始增高。用于理解代偿失效，不是病人床旁测量阈值。","ref":"教材P182","chapter":"第12章｜颅内压增高及脑疝","href":"surgical/ch12-intracranial-pressure.html","exam":"理解题：为什么占位初期可代偿，随后颅压突然升高。"},{"type":"number","kind":"safe","label":"脑水肿观察高峰","tag":"伤后2—4 d常见高峰","detail":"颅脑损伤真题常考脑挫裂伤后脑水肿高峰时间；应把伤后意识、瞳孔、呕吐和生命体征变化持续观察，不能因早期短暂清醒就停止监测。具体高峰依题目教材口径核对。","ref":"教材P200—205；真题汇编题眼","chapter":"第13章｜颅脑损伤","href":"surgical/ch13-craniocerebral-injury.html","exam":"浙江大学2011真题问脑挫裂伤后脑水肿高峰期。"},{"type":"number","kind":"safe","label":"缺血性卒中溶栓窗口","tag":"静脉溶栓：发病3—4.5 h内","detail":"第7版教材写急性缺血性脑卒中静脉溶栓窗口为发病3—4.5 h；另提发病6 h内可评估桥接血管内治疗。题干必须确定“最后正常时间”，不可把发病时间与到院时间混淆。","ref":"教材P214—215","chapter":"第14章｜颅内和椎管内血管性疾病","href":"surgical/ch14-cerebrovascular-surgery.html","exam":"真题常考治疗时间窗及“最后一次正常时间”的定义。"},{"type":"number","kind":"safe","label":"GCS损伤分级","tag":"轻13—15；中9—12；重3—8分","detail":"教材按GCS分级：轻型13—15分（伤后昏迷<20 min）；中型9—12分（昏迷20 min—6 h）；重型3—8分（昏迷>6 h，或24 h内意识障碍加深并昏迷>6 h）。题干给分数时还要结合昏迷时长。","ref":"教材P201","chapter":"第13章｜颅脑损伤病人的护理","href":"surgical/ch13-craniocerebral-injury.html","exam":"真题常考颅脑损伤分级与昏迷时间组合。"},{"type":"number","kind":"safe","label":"脑震荡意识障碍","tag":"通常数分钟至十余分钟；一般≤30 min","detail":"教材描述脑震荡可有伤后短暂意识丧失，持续数分钟至十余分钟，一般不超过30 min，伴逆行性遗忘。题干出现持续昏迷或进行性意识恶化，要转向更重脑损伤及颅内血肿鉴别。","ref":"教材P202","chapter":"第13章｜颅脑损伤病人的护理","href":"surgical/ch13-craniocerebral-injury.html","exam":"真题落点：短暂意识障碍/逆行性遗忘与脑挫裂伤、中间清醒期对照。"},{"type":"number","kind":"safe","label":"脑挫裂伤水肿高峰","tag":"伤后2—4 d","detail":"真题直接考过脑挫裂伤后脑水肿高峰时间。病人即使初期症状不重，也需结合意识、瞳孔、呕吐和生命体征变化连续观察。","ref":"教材P204—205；真题题眼","chapter":"第13章｜颅脑损伤病人的护理","href":"surgical/ch13-craniocerebral-injury.html","exam":"浙江大学2011真题问脑挫裂伤后脑水肿高峰期。"}]},{"id":"n_thoracoabd","label":"⑦ 胸腹部外科｜引流量、管路与时序","center":"引流数值 × 出血/梗阻风险","logic":"引流量先看单位时间，再看颜色、患者循环状态和影像；术后管路的夹闭、放气、造影与拔除有各自时点。数字必须连着“趋势”和“患者反应”解读。","items":[{"type":"number","kind":"safe","label":"进行性血胸","tag":">200 ml/h，持续3 h以上","detail":"胸腔引流每小时>200 ml并持续3 h以上，伴脉搏加快、血压下降或补容量后仍不稳、血红蛋白继续下降，提示进行性血胸可能。题干若只有单次引流量，不应脱离持续时间和循环变化下结论。","ref":"教材P274","chapter":"第18章｜胸部损伤病人的护理","href":"surgical/ch18-chest-trauma.html","exam":"病例题常考胸管引流量、颜色与是否需急诊处理。"},{"type":"number","kind":"safe","label":"血胸量分级","tag":"少量<500；中量500—1000；大量>1000 ml","detail":"教材按血胸量分少量<500 ml、中量500—1000 ml、大量>1000 ml。题干可能给胸腔穿刺/引流总量，问分级或是否伴休克；要区别“总量分级”和“每小时持续出血阈值”。","ref":"教材P273","chapter":"第18章｜胸部损伤病人的护理","href":"surgical/ch18-chest-trauma.html","exam":"常见问法：胸腔出血分级与进行性血胸识别。"},{"type":"number","kind":"safe","label":"气胸引流位置","tag":"锁骨中线第2肋间","detail":"气胸积气上聚，一般于前胸壁锁骨中线第2肋间引流；血胸通常于腋中线与腋后线之间第6或第7肋间。题干问置管位置时先区分胸腔内是气还是血。","ref":"教材P269","chapter":"第18章｜胸部损伤病人的护理","href":"surgical/ch18-chest-trauma.html","exam":"高频解剖定位题：气胸与血胸置管位置对照。"},{"type":"number","kind":"safe","label":"T管造影","tag":"术后约2周；造影后开放引流≥24 h","detail":"教材写T管造影一般于术后2周进行；造影完毕后T管接引流袋开放24 h以上，以排出造影剂。题干问拔管/造影准备时，要先确认胆道通畅与有无残余结石，不是到2周就自动拔管。","ref":"教材P455","chapter":"第31章｜胆道疾病病人的护理","href":"surgical/ch31-biliary-disease.html","exam":"真题常考T管拔除指征；术后周数不能替代造影通畅等条件。"},{"type":"number","kind":"safe","label":"三腔二囊管","tag":"胃囊150—200 ml；食管囊100—150 ml","detail":"教材描述胃囊充气150—200 ml压迫胃底，食管囊充气100—150 ml压迫食管下段；牵引重量0.25—0.5 kg，按病情每8—24 h放气一次并观察。题干问护理时把气囊用途、压力点和放气时点对应起来。","ref":"教材P436—437","chapter":"第30章｜肝脏疾病、门静脉高压症","href":"surgical/ch30-liver-portal-hypertension.html","exam":"门脉高压/食管胃底静脉曲张出血常考三腔二囊管护理。"},{"type":"number","kind":"safe","label":"肝切除后引流","tag":"引流量突增或性状改变立即复评","detail":"肝切除后不以一个固定毫升数判断出血；要结合引流颜色、每小时变化、血压脉搏、腹膜刺激征与切口渗液。题目给数值时考的是变化趋势和病因推理，勿把其他术式的阈值套用。","ref":"教材P434—445","chapter":"第30章｜肝脏疾病、门静脉高压症","href":"surgical/ch30-liver-portal-hypertension.html","exam":"病例题常给术后引流量、寒战腹痛、循环变化判断并发症。"},{"type":"number","kind":"safe","label":"腹腔镜术后活动","tag":"术后时点依术式和医嘱","detail":"腹部术后禁食、拔管、下床活动时点因术式与恢复不同；不能用固定“第几天”代替排气、肠鸣音、恶心呕吐、引流与生命体征评估。此节点用于提醒：无来源支持的单一数字不要背成通用规则。","ref":"教材P92—109及相关腹部章节","chapter":"第7章及第23—32章｜围术期、腹部外科","href":"surgical/ch07-perioperative-care.html","exam":"易错题：把某一种手术的术后天数误当所有腹部手术标准。"}]},{"id":"n_transplant_uro","label":"⑧ 移植与泌尿｜尿量、容量、预防","center":"尿量变化 × 补液/结石/移植判断","logic":"尿量既是肾灌注指标，也是移植术后补液计算输入项；结石预防则看全天饮水与尿量目标。先判断病种与阶段，再决定所需数字。","items":[{"type":"number","kind":"safe","label":"肾移植术后补液","tag":"按前1 h尿量分档补液","detail":"教材按前1 h尿量确定后1 h补液：尿量<200 ml/h时补液量约等于尿量；200—500 ml/h补4/5；500—1000 ml/h补2/3；>1000 ml/h补1/2。题干若给500—800 ml/h，应按所在档算，不能固定“等量补”。","ref":"教材P172","chapter":"第11章｜移植病人的护理","href":"surgical/ch11-transplantation.html","exam":"四川大学2009真题：肾移植术后尿量500—800 ml/h，考补液量比例。"},{"type":"number","kind":"safe","label":"移植出入量差额","tag":"24 h差额一般不超过1500—2000 ml","detail":"教材要求记录24 h出入量；差额一般不能超过1500—2000 ml，容量不足时仍需加速扩容。题目问尿量骤增的补液不能只套公式，还要持续监测CVP、血压、电解质和容量状态。","ref":"教材P172","chapter":"第11章｜移植病人的护理","href":"surgical/ch11-transplantation.html","exam":"移植术后病例常考尿量、出入量与补液调整。"},{"type":"number","kind":"safe","label":"尿量>300 ml/h","tag":"加强盐补充；盐:糖约2:1","detail":"肾移植术后尿量>300 ml/h时，教材提示加强盐补充，盐与糖比例约2:1。题干需处于移植术后高尿量补液情境；不是所有多尿患者统一采用此比例。","ref":"教材P172","chapter":"第11章｜移植病人的护理","href":"surgical/ch11-transplantation.html","exam":"易错点：忽略尿量分档，固定按等量补液。"},{"type":"number","kind":"safe","label":"肾移植排斥时间","tag":"急性排斥：常在术后数周内","detail":"真题常用术后天数与发热、尿少、移植区肿痛、肌酐升高组合判断排斥类型。题干明确“第9天/第1周”时，要将时间与器官功能变化一起判断；不可只凭天数定型。","ref":"教材P168—172；题库真题","chapter":"第11章｜移植病人的护理","href":"surgical/ch11-transplantation.html","exam":"复旦大学2017、暨南大学2023等回忆题考肾移植后发热、尿量与排异。"},{"type":"number","kind":"safe","label":"结石预防饮水量","tag":"饮水>3000 ml/d；尿量>2000 ml/d","detail":"教材结石预防建议增加饮水，保持每日尿量在2000 ml以上；文本对应饮水量超过3000 ml。题干若问最有效预防，核心是增加尿量冲洗尿路，并结合结石成分调整饮食。","ref":"教材P518","chapter":"第35章｜泌尿系统结石病人的护理","href":"surgical/ch35-urinary-stones.html","exam":"河南科技大学2020真题考大量饮水、尿量目标。"},{"type":"number","kind":"safe","label":"高尿钙饮食","tag":"每日钙摄入量<1000 mg","detail":"教材对高尿钙结石者提出限盐，同时保证每日钙摄入量<1000 mg，并减少富含草酸食物。注意这不是所有结石类型统一限钙；必须先识别结石成分和题干限定。","ref":"教材P518","chapter":"第35章｜泌尿系统结石病人的护理","href":"surgical/ch35-urinary-stones.html","exam":"题目常考结石饮食指导，最容易将“限盐”与“盲目低钙”混为一谈。"},{"type":"number","kind":"safe","label":"结石治疗阈值","tag":"直径>6 mm或疼痛不能缓解考虑外科治疗","detail":"教材写肾绞痛不能被药物缓解或结石直径>6 mm时应考虑外科治疗。题干问治疗选择时还需结合部位、梗阻、感染和肾功能；此值不能单独替代临床决策。","ref":"教材P518","chapter":"第35章｜泌尿系统结石病人的护理","href":"surgical/ch35-urinary-stones.html","exam":"数值题眼：结石直径与治疗方式选择。"}]},{"id":"n_ortho","label":"⑨ 骨科｜损伤时间窗、愈合与角度","center":"受伤时间 × 肢体风险 × 功能恢复","logic":"骨科数字多用于判断并发症时间窗、固定/功能锻炼节奏和体位限制。先识别骨折类型、术式与固定方式，不能把一种骨折或再植术的时限泛化。","items":[{"type":"number","kind":"safe","label":"脂肪栓塞","tag":"骨折后48 h内常见","detail":"教材指出脂肪栓塞通常发生在骨折后48 h内，成人多见于粗大骨干骨折。进行性呼吸困难、发绀、低氧、烦躁或嗜睡是警讯；题干常考时间窗与症状组合。","ref":"教材P563","chapter":"第39章｜骨折病人的护理","href":"surgical/ch39-fracture.html","exam":"常见病例题：长骨骨折后呼吸恶化，判断脂肪栓塞。"},{"type":"number","kind":"safe","label":"骨折早期血肿","tag":"伤后6—8 h血肿凝结","detail":"骨折后6—8 h骨折断端及周围血肿凝结；约2周形成纤维连接。数字用来理解愈合阶段，不代表临床允许延迟复位或固定。","ref":"教材P561","chapter":"第39章｜骨折病人的护理","href":"surgical/ch39-fracture.html","exam":"理解题：按时间顺序识别骨折愈合阶段。"},{"type":"number","kind":"safe","label":"骨折愈合示例","tag":"新生儿股骨约2周；成人约3个月","detail":"教材以新生儿股骨骨折约2周达到坚固愈合、成人约3个月作年龄差异示例。不是所有骨折固定拆除的通用期限；题干要结合部位、类型与影像愈合。","ref":"教材P562","chapter":"第39章｜骨折病人的护理","href":"surgical/ch39-fracture.html","exam":"易混：骨折生物学愈合时间≠固定时间或开始功能锻炼时间。"},{"type":"number","kind":"safe","label":"新鲜/陈旧脱位","tag":"未超过2周 / 超过2周","detail":"教材按脱位时间分类：未超过2周为新鲜脱位，超过2周为陈旧性脱位。题干的“受伤多久”会影响复位难度与处理，注意不要和骨折新鲜/陈旧分类随意混用。","ref":"教材P592","chapter":"第40章｜关节脱位病人的护理","href":"surgical/ch40-joint-dislocation.html","exam":"常见单选：给受伤时间，判断新鲜或陈旧脱位。"},{"type":"number","kind":"safe","label":"髋关节置换后","tag":"避免屈髋>90°、内收、内旋","detail":"教材人工髋关节置换后保持患肢外展中立，避免患侧髋关节内收、内旋和屈髋超过90°，以降低脱位风险。题干问体位/活动禁忌时，应把三个方向一起记。","ref":"教材P640","chapter":"第43章｜骨与关节感染及关节置换护理","href":"surgical/ch43-bone-joint-infection.html","exam":"考法：术后体位和动作禁忌，90°是关键角度。"},{"type":"number","kind":"safe","label":"断肢/指再植","tag":"温缺血通常争取6—8 h；冷藏后尽早","detail":"教材原则是再植越早越好，通常以伤后6—8 h为限；现场妥善冷藏后仍应迅速转运。不能把冷藏理解为可以无限延长时限。","ref":"教材P606—607","chapter":"第41章｜手外伤及断肢/指再植","href":"surgical/ch41-hand-injury-replantation.html","exam":"真题常考断肢保存温度、转运时限和血管危象。"},{"type":"number","kind":"safe","label":"骨折术后功能锻炼","tag":"依固定与愈合阶段循序渐进","detail":"功能锻炼不是统一第几天开始；按复位固定稳定性、骨折类型和医嘱分期。早期可练未固定关节与肌肉等长收缩，题干考错误措施时，过早负重/牵拉是常见陷阱。","ref":"教材P567—569","chapter":"第39章｜骨折病人的护理","href":"surgical/ch39-fracture.html","exam":"真题常考骨折功能锻炼阶段与固定期间护理。"},{"type":"number","kind":"safe","label":"肩关节脱位固定","tag":"外展45°、前屈20°、外旋25°","detail":"教材肩关节脱位复位后可用外展支架固定，使肩关节外展45°、前屈20°、外旋25°；固定与锻炼安排依病情执行。题干考体位数字时三个角度成组记忆。","ref":"教材P597","chapter":"第40章｜关节脱位病人的护理","href":"surgical/ch40-joint-dislocation.html","exam":"易错问法：肩关节外展支架固定角度。"}]}];MAPS.unshift(...NUMERIC_MAPS);let mi=0,offset=0,selected=-1;const $=s=>document.querySelector(s),svg=$("#graph");
function esc(s){return String(s??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#39;")}
function wrap(s,n){const a=Array.from(String(s??"")),out=[];while(a.length)out.push(a.splice(0,n).join(""));return out.slice(0,3)}
function choose(i){mi=i;offset=0;selected=-1;render();document.querySelectorAll("#tabs button").forEach((b,j)=>b.classList.toggle("active",j===i))}
function render(){const m=MAPS[mi],list=m.items||[],shown=list.slice(offset,offset+6),cx=360,cy=235,slots=[[360,56],[555,142],[555,328],[360,412],[165,328],[165,142]];$("#mapTitle").textContent='以“'+m.center+'”为中心｜跨章节用途与辨析';
const edges=shown.map((n,j)=>{const [x,y]=slots[j];return '<line class="edge '+(selected===offset+j?'active':'')+'" x1="'+cx+'" y1="'+cy+'" x2="'+x+'" y2="'+y+'"/>'}).join("");
const cl=wrap(m.center,12).slice(0,2),center='<g class="node center" data-center="1"><rect x="'+(cx-96)+'" y="'+(cy-34)+'" width="192" height="68" rx="15"/><text x="'+cx+'" y="'+(cy-cl.length*6)+'" text-anchor="middle">'+cl.map((z,i)=>'<tspan x="'+cx+'" dy="'+(i?15:0)+'">'+esc(z)+'</tspan>').join("")+'<tspan class="tag" x="'+cx+'" dy="20">中心概念</tspan></text></g>';
const nodes=shown.map((n,j)=>{const [x,y]=slots[j],clz="node "+(n.kind==="safe"||n.type==="confusion"?"safe":"")+(selected===offset+j?" active":""),ll=wrap(n.label,13),tt=wrap(n.tag,22);return '<g class="'+clz+'" data-item="'+(offset+j)+'"><rect x="'+(x-92)+'" y="'+(y-39)+'" width="184" height="78" rx="14"/><text x="'+x+'" y="'+(y-12-(ll.length>1?7:0))+'" text-anchor="middle">'+ll.map((z,i)=>'<tspan x="'+x+'" dy="'+(i?15:0)+'">'+esc(z)+'</tspan>').join("")+'</text><text class="tag" x="'+x+'" y="'+(y+18+(ll.length>1?2:0))+'" text-anchor="middle">'+tt.map((z,i)=>'<tspan x="'+x+'" dy="'+(i?12:0)+'">'+esc(z)+'</tspan>').join("")+'</text></g>'}).join("");
svg.innerHTML=edges+center+nodes;svg.querySelectorAll("[data-item]").forEach(g=>g.onclick=()=>{selected=Number(g.dataset.item);detailFor(m.items[selected]);highlight()});svg.querySelector("[data-center]").onclick=()=>detailCenter(m);
$("#pageText").textContent=list.length?String(offset+1)+"–"+String(Math.min(offset+6,list.length))+" / "+String(list.length)+" 个关联节点":"暂无可呈现的关联点";$("#prev").disabled=offset===0;$("#next").disabled=offset+6>=list.length;
if(selected<0&&shown.length){selected=offset;detailFor(list[offset])}highlight()}
function highlight(){svg.querySelectorAll("[data-item]").forEach(g=>g.classList.toggle("active",Number(g.dataset.item)===selected))}
function detailFor(n){const kind=n.type==="number"?"关键参数":n.type==="confusion"||n.kind==="safe"?"易混易错":"跨章节考点";$("#detail").innerHTML='<span class="pill">'+kind+'</span><h3>'+esc(n.label)+'</h3>'+(n.type==="number"?'<div class="value">'+esc(n.tag)+'</div>':'<p class="small">'+esc(n.tag)+'</p>')+'<p>'+esc(n.detail)+'</p>'+(n.exam?'<div class="ref" style="margin-top:10px"><b>真题落点</b><br>'+esc(n.exam)+'</div>':'')+'<div class="reason"><b>怎么推演</b>'+esc(MAPS[mi].logic)+'</div><div class="ref" style="margin-top:10px">'+esc(n.ref||n.chapter)+'<br>'+esc(n.chapter)+'</div><p class="small">中心考点：'+esc(MAPS[mi].center)+'</p><a href="../'+esc(n.href||MAPS[mi].items[0]?.href||"")+'">打开对应章节继续核对与做题 →</a>'}
function detailCenter(m){$("#detail").innerHTML='<span class="pill">中心概念</span><h3>'+esc(m.center)+'</h3><p>'+esc(m.logic)+'</p><div class="reason"><b>这张图的整理方式</b>中心概念 → 关键参数 → 使用情境 → 安全边界 → 易错辨析 → 跨章节关联</div><div class="ref" style="margin-top:10px">本图整理 '+m.items.length+' 个分支节点</div>'}
$("#tabs").innerHTML=MAPS.map((m,i)=>'<button data-i="'+i+'">'+esc(m.label)+'</button>').join("");document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>choose(Number(b.dataset.i)));$("#prev").onclick=()=>{offset=Math.max(0,offset-6);selected=-1;render()};$("#next").onclick=()=>{if(offset+6<MAPS[mi].items.length){offset+=6;selected=-1;render()}};choose(0);
</script></body></html>
