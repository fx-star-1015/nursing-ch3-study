</style></head><body><main class="wrap"><header class="hero"><small>ICE冰冰·高分学姐团｜跨章节主题图谱</small><h1>外科护理学知识点关系图</h1><p>从组织灌注、感染或围手术期风险出发，串起跨章节数据、处理路径和易错边界。</p></header><nav class="course-nav"><a href="fundamentals.html" class="">基础护理</a><a href="introduction.html" class="">护理导论</a><a href="medical.html" class="">内科护理</a><a href="surgical.html" class="on">外科护理</a></nav><div class="tabs" id="tabs"></div><section class="layout"><div class="panel"><h2 id="mapTitle"></h2><p class="sub">选一个中心考点，沿分支查看关键参数、使用情境、易混点和教材来源。</p><svg class="map" id="graph" viewBox="0 0 720 468" role="img" aria-label="外科护理学跨章节知识关系图"></svg><div class="pager"><button id="prev">‹ 上一组</button><span id="pageText"></span><button id="next">下一组 ›</button></div><div class="legend"><span><i class="dot"></i>中心概念</span><span><i class="dot2"></i>用途 / 数值 / 跨章关联</span><span><i class="dot3"></i>易错与安全边界</span></div></div><aside class="panel detail" id="detail"></aside></section><p class="footer">中心主题由跨章节考点组织。每个分支保留来源章节与页码；易错节点说明常见混淆，关键数值连同适用条件一起呈现。</p></main><script>
const MAPS=[{"id":"shock","label":"休克：代偿、失代偿与复苏监测","center":"休克 × 组织灌注","logic":"有效循环血量下降后，早期代偿可让血压暂时维持；继续低灌注会反映在脉压、意识、皮肤、尿量和器官功能。判断靠趋势和组合指标，补液同时处理病因。","items":[{"type":"concept","label":"组织灌注不足","tag":"机制/指标/复苏","detail":"有效循环血量锐减导致微循环障碍、细胞缺氧和代谢紊乱。 易考线索：定义题要落在“有效循环血量”和“组织灌注”，不能只写低血压。","ref":"教材P30","chapter":"第三章｜外科休克病人的护理｜外科护理学第7版","href":"surgical/ch03-shock.html","kind":"safe"},{"type":"concept","label":"休克指数","tag":"≥1 · >2","detail":"心率/收缩压；≥1提示休克，>2提示严重。 易考线索：复苏后血压回升但尿量仍低，不能轻率判断纠正。","ref":"教材P36","chapter":"第三章｜外科休克病人的护理｜外科护理学第7版","href":"surgical/ch03-shock.html","kind":"safe"},{"type":"concept","label":"肾灌注窗口","tag":"30 ml/h","detail":"30 ml/h常提示复苏改善。 易考线索：必须把CVP与血压、临床反应联读。","ref":"教材P36","chapter":"第三章｜外科休克病人的护理｜外科护理学第7版","href":"surgical/ch03-shock.html","kind":"normal"},{"type":"concept","label":"补液与纠因并行","tag":"机制/指标/复苏","detail":"快速建立静脉通路，晶体液优先，按反应追加并控制出血/感染源。 易考线索：“补液”和“纠因”不是二选一，需并行推进。","ref":"教材P35—38","chapter":"第三章｜外科休克病人的护理｜外科护理学第7版","href":"surgical/ch03-shock.html","kind":"normal"},{"type":"concept","label":"冷暖休克辨析","tag":"机制/指标/复苏","detail":"暖休克可见皮肤较温暖、脉压较大；冷休克表现为外周收缩和低灌注。 易考线索：不能因皮肤温暖就排除休克，仍要看灌注与器官功能。","ref":"教材P41—42","chapter":"第三章｜外科休克病人的护理｜外科护理学第7版","href":"surgical/ch03-shock.html","kind":"safe"},{"type":"concept","label":"水钠成比例丢失","tag":"机制/指标/复苏","detail":"血钠常在正常范围；先用平衡盐溶液，警惕大量生理盐水致高氯性酸中毒。 易考线索：无明显口渴而乏力、直立性低血压、低钠，方向指向低渗。","ref":"教材P8—10","chapter":"第二章｜水、电解质代谢紊乱和酸碱平衡失调病人的护理｜外科护理学第7版","href":"surgical/ch02-fluids-electrolytes-acid-base.html","kind":"safe"},{"type":"concept","label":"失钠多于失水","tag":"<135 mmol/L","detail":"血钠<135 mmol/L，常无明显口渴；严重时循环和神经症状突出。 易考线索：明显口渴、高钠和细胞脱水表现相互印证；补水不可过快。","ref":"教材P10—11","chapter":"第二章｜水、电解质代谢紊乱和酸碱平衡失调病人的护理｜外科护理学第7版","href":"surgical/ch02-fluids-electrolytes-acid-base.html","kind":"normal"},{"type":"concept","label":"失水多于失钠","tag":">150 mmol/L","detail":"血钠>150 mmol/L，口渴明显；先补水分，分次纠正。 易考线索：大量低渗液输入后出现头痛、躁动、意识改变，先考虑急性水中毒。","ref":"教材P12—13","chapter":"第二章｜水、电解质代谢紊乱和酸碱平衡失调病人的护理｜外科护理学第7版","href":"surgical/ch02-fluids-electrolytes-acid-base.html","kind":"normal"},{"type":"confusion","label":"血压正常 ≠ 排除早期休克","tag":"看脉压、脉率、尿量和意识趋势","detail":"休克指数按心率/收缩压理解；脉压缩小、尿量下降和意识变化可早于明显低血压。单一指标不能替代整体灌注判断。","ref":"教材P30、P35—42","chapter":"外科第2—3章｜水电解质、休克","href":"surgical/ch03-shock.html","kind":"safe"}]},{"id":"tetanus","label":"破伤风：治疗与暴露后预防不能混","center":"破伤风 × 创口免疫","logic":"先判患者是已发病治疗还是创口暴露后预防，再查免疫史和创口风险；被动免疫与主动免疫的制剂、用途和剂量不同，给药后还需关注过敏和痉挛风险。","items":[{"type":"number","label":"破伤风抗毒素（TAT）","tag":"治疗破伤风常用50 000～200 000 IU；暴露后预防剂量与方案须按免疫史和创口类型决定","detail":"破伤风抗毒素（TAT）：治疗破伤风常用50 000～200 000 IU；暴露后预防剂量与方案须按免疫史和创口类型决定。适用条件：过敏反应和血清病；给药前按规范评估过敏风险并备好抢救药物；注射后严密观察","ref":"教材P121—122","chapter":"第8章｜外科感染病人的护理｜外科护理学第7版","href":"surgical/ch08-surgical-infection.html","kind":"safe"},{"type":"number","label":"破伤风免疫球蛋白（TIG）","tag":"治疗常用3 000～6 000 IU；高风险创口预防常用250～500 IU","detail":"破伤风免疫球蛋白（TIG）：治疗常用3 000～6 000 IU；高风险创口预防常用250～500 IU。适用条件：注射部位疼痛，过敏反应少见；核对既往主动免疫史和创口类型；与类毒素分部位注射","ref":"教材P121—122","chapter":"第8章｜外科感染病人的护理｜外科护理学第7版","href":"surgical/ch08-surgical-infection.html","kind":"normal"},{"type":"number","label":"破伤风类毒素","tag":"已有基础免疫者受伤后可用0.5 ml加强免疫","detail":"破伤风类毒素：已有基础免疫者受伤后可用0.5 ml加强免疫。适用条件：局部疼痛、红肿，少见全身过敏反应；核对免疫记录和加强时间；不能用类毒素替代已发病患者的毒素中和与支持治疗","ref":"教材P121—122","chapter":"第8章｜外科感染病人的护理｜外科护理学第7版","href":"surgical/ch08-surgical-infection.html","kind":"safe"},{"type":"number","label":"急、亚急、慢性感染","tag":"3周以内为急性感染；超过2个月为慢性感染；两者之间为亚急性感染","detail":"急、亚急、慢性感染：3周以内为急性感染；超过2个月为慢性感染；两者之间为亚急性感染。适用条件：分期不能替代对脓毒症和器官功能的即时评估；同时观察体温、意识、循环、呼吸、尿量和局部病灶变化","ref":"教材P111","chapter":"第8章｜外科感染病人的护理｜外科护理学第7版","href":"surgical/ch08-surgical-infection.html","kind":"safe"},{"type":"number","label":"气性坏疽伤口","tag":"敞开伤口可用3%过氧化氢溶液冲洗、湿敷","detail":"气性坏疽伤口：敞开伤口可用3%过氧化氢溶液冲洗、湿敷。适用条件：感染可迅速扩展并引起溶血、休克和多器官功能障碍；立即隔离并配合急诊清创；严密观察疼痛、肿胀、捻发感、分泌物和循环状态","ref":"教材P124—125","chapter":"第8章｜外科感染病人的护理｜外科护理学第7版","href":"surgical/ch08-surgical-infection.html","kind":"normal"},{"type":"number","label":"破伤风病情观察","tag":"专人护理，至少每4小时测量体温、脉搏和呼吸，并按需监测血压","detail":"破伤风病情观察：专人护理，至少每4小时测量体温、脉搏和呼吸，并按需监测血压。适用条件：刺激可诱发痉挛，喉痉挛和呼吸肌痉挛可致窒息；暗室、减少声光刺激、集中操作；备气道和抢救物品并连续评估痉挛与呼吸","ref":"教材P122—123","chapter":"第8章｜外科感染病人的护理｜外科护理学第7版","href":"surgical/ch08-surgical-infection.html","kind":"normal"},{"type":"concept","label":"破伤风","tag":"创口与临床表现","detail":"减少声光刺激、集中护理、保持气道并控制痉挛。 易考线索：患者病历中记录“轻微外伤后出现张口困难和阵发性肌痉挛，声光刺激可诱发”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","ref":"教材P110—126","chapter":"第8章｜外科感染病人的护理｜外科护理学第7版","href":"surgical/ch08-surgical-infection.html","kind":"normal"},{"type":"concept","label":"局部感染","tag":"创口与临床表现","detail":"红肿热痛和功能障碍常见，形成脓肿后通常需要充分引流。 易考线索：患者进入术后观察期，交班记录提示“切口红肿热痛，中央出现波动感并伴发热”。下一班应重点复评什么，什么变化需要立即上报？","ref":"教材P110—126","chapter":"第8章｜外科感染病人的护理｜外科护理学第7版","href":"surgical/ch08-surgical-infection.html","kind":"normal"},{"type":"concept","label":"手部感染","tag":"创口与临床表现","detail":"腱鞘和深间隙感染可迅速损害手功能，应早期制动、抬高和引流。 易考线索：患者病历中记录“手指屈肌腱鞘区剧痛、肿胀，伸指时疼痛明显加重”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","ref":"教材P110—126","chapter":"第8章｜外科感染病人的护理｜外科护理学第7版","href":"surgical/ch08-surgical-infection.html","kind":"normal"},{"type":"confusion","label":"TAT / TIG / 类毒素不互换","tag":"被动免疫 ≠ 主动免疫","detail":"TAT/TIG提供被动免疫；类毒素用于主动免疫。已发病治疗剂量和暴露后预防方案不同，须连免疫史、创口类型和用途一起判断。","ref":"教材P111、P121—123","chapter":"外科第8章｜外科感染病人的护理","href":"surgical/ch08-surgical-infection.html","kind":"safe"}]},{"id":"fluid","label":"外科补液：看丢失水还是丢失钠","center":"失液性质 × 电解质方向","logic":"先比较水和钠的丢失比例，结合血钠、口渴、循环和神经表现判等渗、低渗或高渗；再选择补液方向并控制纠正速度，持续复评灌注和尿量。","items":[{"type":"concept","label":"水钠成比例丢失","tag":"失液类型与治疗方向","detail":"血钠常在正常范围；先用平衡盐溶液，警惕大量生理盐水致高氯性酸中毒。 易考线索：无明显口渴而乏力、直立性低血压、低钠，方向指向低渗。","ref":"教材P8—10","chapter":"第二章｜水、电解质代谢紊乱和酸碱平衡失调病人的护理｜外科护理学第7版","href":"surgical/ch02-fluids-electrolytes-acid-base.html","kind":"safe"},{"type":"concept","label":"失钠多于失水","tag":"<135 mmol/L","detail":"血钠<135 mmol/L，常无明显口渴；严重时循环和神经症状突出。 易考线索：明显口渴、高钠和细胞脱水表现相互印证；补水不可过快。","ref":"教材P10—11","chapter":"第二章｜水、电解质代谢紊乱和酸碱平衡失调病人的护理｜外科护理学第7版","href":"surgical/ch02-fluids-electrolytes-acid-base.html","kind":"normal"},{"type":"concept","label":"失水多于失钠","tag":">150 mmol/L","detail":"血钠>150 mmol/L，口渴明显；先补水分，分次纠正。 易考线索：大量低渗液输入后出现头痛、躁动、意识改变，先考虑急性水中毒。","ref":"教材P12—13","chapter":"第二章｜水、电解质代谢紊乱和酸碱平衡失调病人的护理｜外科护理学第7版","href":"surgical/ch02-fluids-electrolytes-acid-base.html","kind":"normal"},{"type":"concept","label":"补液与纠因并行","tag":"失液类型与治疗方向","detail":"快速建立静脉通路，晶体液优先，按反应追加并控制出血/感染源。 易考线索：“补液”和“纠因”不是二选一，需并行推进。","ref":"教材P35—38","chapter":"第三章｜外科休克病人的护理｜外科护理学第7版","href":"surgical/ch03-shock.html","kind":"normal"},{"type":"concept","label":"组织灌注不足","tag":"失液类型与治疗方向","detail":"有效循环血量锐减导致微循环障碍、细胞缺氧和代谢紊乱。 易考线索：定义题要落在“有效循环血量”和“组织灌注”，不能只写低血压。","ref":"教材P30","chapter":"第三章｜外科休克病人的护理｜外科护理学第7版","href":"surgical/ch03-shock.html","kind":"safe"},{"type":"confusion","label":"低钠、高钠不只看数字","tag":"血钠＋口渴＋容量状态一起推","detail":"低渗性缺水常有血钠＜135 mmol/L；高渗性缺水常见血钠＞150 mmol/L、口渴明显。纠正过快也有风险，不能只背阈值。","ref":"教材P8—13、P35—38","chapter":"外科第2—3章｜水电解质、休克","href":"surgical/ch02-fluids-electrolytes-acid-base.html","kind":"safe"}]},{"id":"perioperative","label":"术前、术中、术后：风险如何接力","center":"手术风险 × 全程防线","logic":"术前评估找出气道、心肺、药物和禁食风险；术中通过核查、体位保护和无菌操作防错；术后先守气道与循环，再观察出血、疼痛、切口和引流，形成连续交接。","items":[{"type":"concept","label":"手术体位","tag":"阶段与风险","detail":"既要暴露术野，也要保护神经、骨隆突、呼吸和循环。 易考线索：患者病历中记录“关腹前纱布清点数目与术前记录不一致”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","ref":"教材P57—73","chapter":"第5章｜手术室管理和工作｜外科护理学第7版","href":"surgical/ch05-operating-room.html","kind":"normal"},{"type":"concept","label":"麻醉前评估","tag":"阶段与风险","detail":"重点核查气道、心肺功能、过敏史、用药和禁食情况。 易考线索：患者病历中记录“麻醉前评估发现张口受限、既往困难气道并服用抗凝药”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","ref":"教材P74—91","chapter":"第6章｜麻醉病人的护理｜外科护理学第7版","href":"surgical/ch06-anesthesia.html","kind":"normal"},{"type":"concept","label":"椎管内麻醉","tag":"阶段与风险","detail":"交感阻滞可致低血压，阻滞平面过高可影响呼吸。 易考线索：患者病历中记录“椎管内麻醉后血压下降、心率减慢，麻醉平面继续上升”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","ref":"教材P74—91","chapter":"第6章｜麻醉病人的护理｜外科护理学第7版","href":"surgical/ch06-anesthesia.html","kind":"normal"},{"type":"concept","label":"引流观察","tag":"阶段与风险","detail":"记录量、颜色、性质与通畅度，鲜红骤增或突然停止均需评估。 易考线索：患者进入术后观察期，交班记录提示“术后引流液突然鲜红增多，随后管路又无液体流出”。下一班应重点复评什么，什么变化需要立即上报？","ref":"教材P92—109","chapter":"第7章｜手术前后病人的护理｜外科护理学第7版","href":"surgical/ch07-perioperative-care.html","kind":"normal"},{"type":"concept","label":"局部感染","tag":"阶段与风险","detail":"红肿热痛和功能障碍常见，形成脓肿后通常需要充分引流。 易考线索：患者进入术后观察期，交班记录提示“切口红肿热痛，中央出现波动感并伴发热”。下一班应重点复评什么，什么变化需要立即上报？","ref":"教材P110—126","chapter":"第8章｜外科感染病人的护理｜外科护理学第7版","href":"surgical/ch08-surgical-infection.html","kind":"normal"},{"type":"concept","label":"胸腔引流","tag":"阶段与风险","detail":"水封瓶低于胸腔，保持密闭通畅并观察水柱和气泡。 易考线索：患者进入术后观察期，交班记录提示“胸腔闭式引流瓶高于胸壁且水封管内水柱不波动”。下一班应重点复评什么，什么变化需要立即上报？","ref":"教材P261—277","chapter":"第18章｜胸部损伤病人的护理｜外科护理学第7版","href":"surgical/ch18-chest-trauma.html","kind":"normal"},{"type":"concept","label":"引流不畅","tag":"阶段与风险","detail":"呼吸症状加重时先排查体位、扭曲和堵塞。 易考线索：患者进入术后观察期，交班记录提示“胸腔引流管受压弯折，患者胸闷和呼吸急促”。下一班应重点复评什么，什么变化需要立即上报？","ref":"教材P278—287","chapter":"第19章｜胸壁、胸膜疾病病人的护理｜外科护理学第7版","href":"surgical/ch19-chest-wall-pleura.html","kind":"normal"},{"type":"confusion","label":"术后引流骤停 ≠ 好转","tag":"同时排查出血、堵管和位置","detail":"引流液突然鲜红增多提示出血风险；突然停止也可能堵管、扭曲或血块。结合患者状态、引流性质和装置通畅度复评。","ref":"教材P92—109、P261—287","chapter":"外科第7、18—19章","href":"surgical/ch07-perioperative-care.html","kind":"safe"}]},{"id":"pain","label":"疼痛：评估—干预—再评价","center":"疼痛 × 镇痛与功能恢复","logic":"先评疼痛性质、强度和功能影响，再结合病因、手术阶段和患者风险制定镇痛；处理后复评效果、呼吸循环和活动能力，必要时调整方案。","items":[{"type":"concept","label":"典型疼痛","tag":"评估/干预/风险","detail":"腹痛由脐周转移至右下腹，麦氏点压痛有提示意义。 易考线索：患者的记录中出现“腹痛从脐周转移至右下腹并有麦氏点压痛”。这个数值或时间条件是否达到干预标准？请给出判断和下一步护理。","ref":"教材P406—414","chapter":"第28章｜阑尾炎病人的护理｜外科护理学第7版","href":"surgical/ch28-appendicitis.html","kind":"normal"},{"type":"concept","label":"局麻毒性","tag":"评估/干预/风险","detail":"口周麻木、耳鸣、躁动、抽搐或心律失常提示局麻药全身毒性。 易考线索：患者的记录中出现“局麻药注射后出现口周麻木、耳鸣、躁动并逐渐抽搐”。这个数值或时间条件是否达到干预标准？请给出判断和下一步护理。","ref":"教材P74—91","chapter":"第6章｜麻醉病人的护理｜外科护理学第7版","href":"surgical/ch06-anesthesia.html","kind":"normal"},{"type":"concept","label":"椎管内麻醉","tag":"评估/干预/风险","detail":"交感阻滞可致低血压，阻滞平面过高可影响呼吸。 易考线索：患者病历中记录“椎管内麻醉后血压下降、 const nodes=shown.map((n,j)=>{const [x,y]=slots[j],clz="node "+(n.kind==="safe"||n.type==="confusion"?"safe":"")+(selected===offset+j?" active":""),ll=wrap(n.label,13),tt=wrap(n.tag,22);return '<g class="'+clz+'" data-item="'+(offset+j)+'"><rect x="'+(x-92)+'" y="'+(y-39)+'" width="184" height="78" rx="14"/><text x="'+x+'" y="'+(y-12-(ll.length>1?7:0))+'" text-anchor="middle">'+ll.map((z,i)=>'<tspan x="'+x+'" dy="'+(i?15:0)+'">'+esc(z)+'</tspan>').join("")+'</text><text class="tag" x="'+x+'" y="'+(y+18+(ll.length>1?2:0))+'" text-anchor="middle">'+tt.map((z,i)=>'<tspan x="'+x+'" dy="'+(i?12:0)+'">'+esc(z)+'</tspan>').join("")+'</text></g>'}).join("");
svg.innerHTML=edges+center+nodes;svg.querySelectorAll("[data-item]").forEach(g=>g.onclick=()=>{selected=Number(g.dataset.item);detailFor(m.items[selected]);highlight()});svg.querySelector("[data-center]").onclick=()=>detailCenter(m);
$("#pageText").textContent=list.length?String(offset+1)+"–"+String(Math.min(offset+6,list.length))+" / "+String(list.length)+" 个关联节点":"暂无可呈现的关联点";$("#prev").disabled=offset===0;$("#next").disabled=offset+6>=list.length;
if(selected<0&&shown.length){selected=offset;detailFor(list[offset])}highlight()}
function highlight(){svg.querySelectorAll("[data-item]").forEach(g=>g.classList.toggle("active",Number(g.dataset.item)===selected))}
function detailFor(n){const kind=n.type==="number"?"关键参数":n.type==="confusion"||n.kind==="safe"?"易混易错":"跨章节考点";$("#detail").innerHTML='<span class="pill">'+kind+'</span><h3>'+esc(n.label)+'</h3>'+(n.type==="number"?'<div class="value">'+esc(n.tag)+'</div>':'<p class="small">'+esc(n.tag)+'</p>')+'<p>'+esc(n.detail)+'</p><div class="reason"><b>怎么推演</b>'+esc(MAPS[mi].logic)+'</div><div class="ref" style="margin-top:10px">'+esc(n.ref||n.chapter)+'<br>'+esc(n.chapter)+'</div><p class="small">中心考点：'+esc(MAPS[mi].center)+'</p><a href="../'+esc(n.href||MAPS[mi].items[0]?.href||"")+'">打开对应章节继续核对与做题 →</a>'}
function detailCenter(m){$("#detail").innerHTML='<span class="pill">中心概念</span><h3>'+esc(m.center)+'</h3><p>'+esc(m.logic)+'</p><div class="reason"><b>这张图的整理方式</b>中心概念 → 关键参数 → 使用情境 → 安全边界 → 易错辨析 → 跨章节关联</div><div class="ref" style="margin-top:10px">本图整理 '+m.items.length+' 个分支节点</div>'}
$("#tabs").innerHTML=MAPS.map((m,i)=>'<button data-i="'+i+'">'+esc(m.label)+'</button>').join("");document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>choose(Number(b.dataset.i)));$("#prev").onclick=()=>{offset=Math.max(0,offset-6);selected=-1;render()};$("#next").onclick=()=>{if(offset+6<MAPS[mi].items.length){offset+=6;selected=-1;render()}};choose(0);
</script></body></html>
