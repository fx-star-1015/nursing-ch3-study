const N=[{"book":"外科护理学","title":"外科护理学研究什么","summary":"研究外科病人的整体护理，贯穿疾病预防、治疗、康复及健康促进。","exam":"遇到定义题要同时抓住对象、整体性和临床护理学科三个要素。","page":"教材P2","chapter":"第一章｜绪论｜外科护理学第7版","href":"surgical/ch01-introduction.html"},{"book":"外科护理学","title":"常见外科疾病范围","summary":"损伤、感染、肿瘤、畸形、梗阻及功能障碍等。","exam":"题干给病因或病理状态时，先把它归入类别，再调用对应护理逻辑。","page":"教材P2","chapter":"第一章｜绪论｜外科护理学第7版","href":"surgical/ch01-introduction.html"},{"book":"外科护理学","title":"四个关键突破","summary":"麻醉、无菌与抗菌、止血、输血推动外科学发展。","exam":"不要只背年代，要把突破与它解决的临床障碍配对。","page":"教材P2","chapter":"第一章｜绪论｜外科护理学第7版","href":"surgical/ch01-introduction.html"},{"book":"外科护理学","title":"南丁格尔的贡献","summary":"克里米亚战争中通过环境与护理改革显著降低伤员病死率。","exam":"数字题要连同措施和意义一起记，避免只认人名。","page":"教材P2","chapter":"第一章｜绪论｜外科护理学第7版","href":"surgical/ch01-introduction.html"},{"book":"外科护理学","title":"现代护理观","summary":"以人为中心，用护理程序提供个体化整体护理。","exam":"出现出院随访、康复指导或家庭支持时，判断为连续护理的延伸。","page":"教材P3—4","chapter":"第一章｜绪论｜外科护理学第7版","href":"surgical/ch01-introduction.html"},{"book":"外科护理学","title":"连续与协同","summary":"从医院延伸至社区和家庭，强调多学科协作。","exam":"最佳护理通常不是只处理生理指标，而是兼顾安全、参与和尊严。","page":"教材P3","chapter":"第一章｜绪论｜外科护理学第7版","href":"surgical/ch01-introduction.html"},{"book":"外科护理学","title":"理论联系实践","summary":"知识、技能和临床判断需要在情境中整合。","exam":"方案题先评估再干预；新情况出现后重新评价并调整。","page":"教材P4","chapter":"第一章｜绪论｜外科护理学第7版","href":"surgical/ch01-introduction.html"},{"book":"外科护理学","title":"专业胜任力","summary":"观察、操作、沟通、应急、决策与持续学习相互支撑。","exam":"题干出现个体差异时，不选机械套用常规的选项。","page":"教材P4—5","chapter":"第一章｜绪论｜外科护理学第7版","href":"surgical/ch01-introduction.html"},{"book":"外科护理学","title":"慎独与责任","summary":"维护生命尊严、权益与安全，诚实负责。","exam":"辨析题注意“专业素质”不是单纯操作熟练。","page":"教材P5","chapter":"第一章｜绪论｜外科护理学第7版","href":"surgical/ch01-introduction.html"},{"book":"外科护理学","title":"身心与人文素养","summary":"稳定体能、情绪调节和人文关怀是专业表现的一部分。","exam":"优先题先处理威胁生命的问题，同时明确护士独立与协作职责。","page":"教材P5—6","chapter":"第一章｜绪论｜外科护理学第7版","href":"surgical/ch01-introduction.html"},{"book":"外科护理学","title":"三步判断","summary":"先容量、再电解质、后酸碱；同时守住循环、意识和心律。","exam":"见呕吐、肠瘘等且血钠正常，优先考虑等渗；补液首选平衡盐。","page":"教材P7—28","chapter":"第二章｜水、电解质代谢紊乱和酸碱平衡失调病人的护理｜外科护理学第7版","href":"surgical/ch02-fluids-electrolytes-acid-base.html"},{"book":"外科护理学","title":"水钠成比例丢失","summary":"血钠常在正常范围；先用平衡盐溶液，警惕大量生理盐水致高氯性酸中毒。","exam":"无明显口渴而乏力、直立性低血压、低钠，方向指向低渗。","page":"教材P8—10","chapter":"第二章｜水、电解质代谢紊乱和酸碱平衡失调病人的护理｜外科护理学第7版","href":"surgical/ch02-fluids-electrolytes-acid-base.html"},{"book":"外科护理学","title":"失钠多于失水","summary":"血钠<135 mmol/L，常无明显口渴；严重时循环和神经症状突出。","exam":"明显口渴、高钠和细胞脱水表现相互印证；补水不可过快。","page":"教材P10—11","chapter":"第二章｜水、电解质代谢紊乱和酸碱平衡失调病人的护理｜外科护理学第7版","href":"surgical/ch02-fluids-electrolytes-acid-base.html"},{"book":"外科护理学","title":"失水多于失钠","summary":"血钠>150 mmol/L，口渴明显；先补水分，分次纠正。","exam":"大量低渗液输入后出现头痛、躁动、意识改变，先考虑急性水中毒。","page":"教材P12—13","chapter":"第二章｜水、电解质代谢紊乱和酸碱平衡失调病人的护理｜外科护理学第7版","href":"surgical/ch02-fluids-electrolytes-acid-base.html"},{"book":"外科护理学","title":"水过多且排出不足","summary":"稀释性低钠与脑水肿可使神经精神症状较早出现。","exam":"胃肠丢失、长期禁食和排钾利尿后出现乏力，先查钾。","page":"教材P13—14","chapter":"第二章｜水、电解质代谢紊乱和酸碱平衡失调病人的护理｜外科护理学第7版","href":"surgical/ch02-fluids-electrolytes-acid-base.html"},{"book":"外科护理学","title":"兴奋性与动力下降","summary":"乏力、腹胀、腱反射减弱和心电图改变；补钾必须遵守安全界限。","exam":"题目出现无尿、快速静推或高浓度补钾，均为危险信号。","page":"教材P14—16","chapter":"第二章｜水、电解质代谢紊乱和酸碱平衡失调病人的护理｜外科护理学第7版","href":"surgical/ch02-fluids-electrolytes-acid-base.html"},{"book":"外科护理学","title":"心脏风险突出","summary":"四肢无力、心率慢或心律失常；严重者可心搏骤停。","exam":"肾功能不全、挤压伤或酸中毒伴心电异常时优先处理高钾。","page":"教材P16—18","chapter":"第二章｜水、电解质代谢紊乱和酸碱平衡失调病人的护理｜外科护理学第7版","href":"surgical/ch02-fluids-electrolytes-acid-base.html"},{"book":"外科护理学","title":"HCO₃⁻原发下降","summary":"深大呼吸、灌注不足、酸性产物积聚；纠因和改善循环是根本。","exam":"先看pH，再看哪一项变化能解释方向，最后考虑代偿。","page":"教材P22—24","chapter":"第二章｜水、电解质代谢紊乱和酸碱平衡失调病人的护理｜外科护理学第7版","href":"surgical/ch02-fluids-electrolytes-acid-base.html"},{"book":"外科护理学","title":"失H⁺或HCO₃⁻增多","summary":"呕吐、胃肠减压和低钾常见；补液、补氯和补钾需结合病因。","exam":"先抓病因，再用呼吸深浅和化验确认。","page":"教材P24—25","chapter":"第二章｜水、电解质代谢紊乱和酸碱平衡失调病人的护理｜外科护理学第7版","href":"surgical/ch02-fluids-electrolytes-acid-base.html"},{"book":"外科护理学","title":"PaCO₂原发改变","summary":"通气不足致呼酸；过度通气致呼碱，处理首先回到通气原因。","exam":"呼吸系统问题先解决通气，不能只追着pH补药。","page":"教材P25—28","chapter":"第二章｜水、电解质代谢紊乱和酸碱平衡失调病人的护理｜外科护理学第7版","href":"surgical/ch02-fluids-electrolytes-acid-base.html"},{"book":"外科护理学","title":"组织灌注不足","summary":"有效循环血量锐减导致微循环障碍、细胞缺氧和代谢紊乱。","exam":"定义题要落在“有效循环血量”和“组织灌注”，不能只写低血压。","page":"教材P30","chapter":"第三章｜外科休克病人的护理｜外科护理学第7版","href":"surgical/ch03-shock.html"},{"book":"外科护理学","title":"按病因识别","summary":"低血容量、感染、心源性、神经源性和过敏性休克处理重点不同。","exam":"血压正常不排除早期休克，脉率与脉压差往往更早变化。","page":"教材P30—32","chapter":"第三章｜外科休克病人的护理｜外科护理学第7版","href":"surgical/ch03-shock.html"},{"book":"外科护理学","title":"代偿到失代偿","summary":"早期脉快、脉压差小、皮肤凉；进展后血压下降、少尿与意识障碍加重。","exam":"多器官低灌注证据越多，严重程度越高。","page":"教材P32—34","chapter":"第三章｜外科休克病人的护理｜外科护理学第7版","href":"surgical/ch03-shock.html"},{"book":"外科护理学","title":"趋势胜过单点","summary":"意识、皮温色泽、脉搏、血压、脉压、尿量需连续观察。","exam":"心率110、收缩压90，指数约1.22，不可被“还有血压”误导。","page":"教材P33—36","chapter":"第三章｜外科休克病人的护理｜外科护理学第7版","href":"surgical/ch03-shock.html"},{"book":"外科护理学","title":"休克指数","summary":"心率/收缩压；≥1提示休克，>2提示严重。","exam":"复苏后血压回升但尿量仍低，不能轻率判断纠正。","page":"教材P36","chapter":"第三章｜外科休克病人的护理｜外科护理学第7版","href":"surgical/ch03-shock.html"},{"book":"外科护理学","title":"肾灌注窗口","summary":"30 ml/h常提示复苏改善。","exam":"必须把CVP与血压、临床反应联读。","page":"教材P36","chapter":"第三章｜外科休克病人的护理｜外科护理学第7版","href":"surgical/ch03-shock.html"},{"book":"外科护理学","title":"容量与心功能线索","summary":"正常5—12 cmH₂O；低值支持容量不足，高值需警惕心功能或肺循环阻力。","exam":"血压升而CVP不明显升支持容量不足；CVP明显升而血压不升警惕心衰。","page":"教材P34","chapter":"第三章｜外科休克病人的护理｜外科护理学第7版","href":"surgical/ch03-shock.html"},{"book":"外科护理学","title":"补液与纠因并行","summary":"快速建立静脉通路，晶体液优先，按反应追加并控制出血/感染源。","exam":"“补液”和“纠因”不是二选一，需并行推进。","page":"教材P35—38","chapter":"第三章｜外科休克病人的护理｜外科护理学第7版","href":"surgical/ch03-shock.html"},{"book":"外科护理学","title":"中凹卧位","summary":"头胸抬高20°—30°，下肢抬高15°—20°，兼顾呼吸和回心血量。","exam":"体位角度和氧疗参数是常见数字考点。","page":"教材P37","chapter":"第三章｜外科休克病人的护理｜外科护理学第7版","href":"surgical/ch03-shock.html"},{"book":"外科护理学","title":"冷暖休克辨析","summary":"暖休克可见皮肤较温暖、脉压较大；冷休克表现为外周收缩和低灌注。","exam":"不能因皮肤温暖就排除休克，仍要看灌注与器官功能。","page":"教材P41—42","chapter":"第三章｜外科休克病人的护理｜外科护理学第7版","href":"surgical/ch03-shock.html"},{"book":"外科护理学","title":"肠内优先","summary":"胃肠道有功能并可安全使用时，优先选择肠内营养。","exam":"患者评估资料符合“胃肠道有功能、无严重梗阻，但近期摄入不足并明显消瘦”。当前处理应先解决什么问题，护士怎样配合并评价效果？","page":"教材P44—56","chapter":"第4章｜外科营养支持病人的护理｜外科护理学第7版","href":"surgical/ch04-nutrition-support.html"},{"book":"外科护理学","title":"肠外适应证","summary":"胃肠道不能满足需要时才考虑肠外营养，并评估中心静脉通路。","exam":"患者病历中记录“严重肠梗阻、持续呕吐，胃肠道暂时不能安全使用”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","page":"教材P44—56","chapter":"第4章｜外科营养支持病人的护理｜外科护理学第7版","href":"surgical/ch04-nutrition-support.html"},{"book":"外科护理学","title":"管饲安全","summary":"抬高床头并观察腹胀、反流、腹泻和误吸征象。","exam":"患者病历中记录“管饲过程中平卧，随后出现反流、呛咳和血氧下降”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","page":"教材P44—56","chapter":"第4章｜外科营养支持病人的护理｜外科护理学第7版","href":"surgical/ch04-nutrition-support.html"},{"book":"外科护理学","title":"肠外并发症","summary":"重点监测导管感染、气胸、血糖和电解质异常。","exam":"患者病历中记录“中心静脉营养期间寒战发热，导管口红肿且血糖升高”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","page":"教材P44—56","chapter":"第4章｜外科营养支持病人的护理｜外科护理学第7版","href":"surgical/ch04-nutrition-support.html"},{"book":"外科护理学","title":"再喂养风险","summary":"长期营养不足后快速补充可导致磷、钾、镁下降和心肺并发症。","exam":"患者病历中记录“长期营养不良后快速增加热量，出现乏力、气促及低磷低钾”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","page":"教材P44—56","chapter":"第4章｜外科营养支持病人的护理｜外科护理学第7版","href":"surgical/ch04-nutrition-support.html"},{"book":"外科护理学","title":"分区管理","summary":"限制区、半限制区和非限制区按洁污流线管理。","exam":"患者病历中记录“患者即将进入手术间，身份腕带、手术部位标记和同意书尚未完成一致核对”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","page":"教材P57—73","chapter":"第5章｜手术室管理和工作｜外科护理学第7版","href":"surgical/ch05-operating-room.html"},{"book":"外科护理学","title":"灭菌选择","summary":"进入无菌组织的器械必须灭菌，耐热耐湿器械优先压力蒸汽灭菌。","exam":"患者病历中记录“无菌包外层潮湿，器械包化学指示未达到要求”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","page":"教材P57—73","chapter":"第5章｜手术室管理和工作｜外科护理学第7版","href":"surgical/ch05-operating-room.html"},{"book":"外科护理学","title":"无菌台原则","summary":"无菌台须干燥、完整并始终处于视线范围内。","exam":"患者病历中记录“截石位手术时间较长，腓总神经受压部位保护不足”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","page":"教材P57—73","chapter":"第5章｜手术室管理和工作｜外科护理学第7版","href":"surgical/ch05-operating-room.html"},{"book":"外科护理学","title":"手术体位","summary":"既要暴露术野，也要保护神经、骨隆突、呼吸和循环。","exam":"患者病历中记录“关腹前纱布清点数目与术前记录不一致”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","page":"教材P57—73","chapter":"第5章｜手术室管理和工作｜外科护理学第7版","href":"surgical/ch05-operating-room.html"},{"book":"外科护理学","title":"清点制度","summary":"器械、敷料和缝针在关键节点共同清点，数目不符不得贸然关切口。","exam":"患者病历中记录“感染手术结束后器械、污物与普通手术物品混放”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","page":"教材P57—73","chapter":"第5章｜手术室管理和工作｜外科护理学第7版","href":"surgical/ch05-operating-room.html"},{"book":"外科护理学","title":"麻醉前评估","summary":"重点核查气道、心肺功能、过敏史、用药和禁食情况。","exam":"患者病历中记录“麻醉前评估发现张口受限、既往困难气道并服用抗凝药”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","page":"教材P74—91","chapter":"第6章｜麻醉病人的护理｜外科护理学第7版","href":"surgical/ch06-anesthesia.html"},{"book":"外科护理学","title":"局麻毒性","summary":"口周麻木、耳鸣、躁动、抽搐或心律失常提示局麻药全身毒性。","exam":"患者的记录中出现“局麻药注射后出现口周麻木、耳鸣、躁动并逐渐抽搐”。这个数值或时间条件是否达到干预标准？请给出判断和下一步护理。","page":"教材P74—91","chapter":"第6章｜麻醉病人的护理｜外科护理学第7版","href":"surgical/ch06-anesthesia.html"},{"book":"外科护理学","title":"椎管内麻醉","summary":"交感阻滞可致低血压，阻滞平面过高可影响呼吸。","exam":"患者病历中记录“椎管内麻醉后血压下降、心率减慢，麻醉平面继续上升”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","page":"教材P74—91","chapter":"第6章｜麻醉病人的护理｜外科护理学第7版","href":"surgical/ch06-anesthesia.html"},{"book":"外科护理学","title":"全麻苏醒","summary":"先保证气道通畅，再评估呼吸、循环、意识、疼痛和恶心呕吐。","exam":"患者病历中记录“全麻苏醒期鼾声加重、舌后坠并出现血氧下降”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","page":"教材P74—91","chapter":"第6章｜麻醉病人的护理｜外科护理学第7版","href":"surgical/ch06-anesthesia.html"},{"book":"外科护理学","title":"恶性高热","summary":"高热伴肌强直、心动过速和二氧化碳升高时应停触发药并紧急处理。","exam":"患者病历中记录“麻醉中呼气末二氧化碳迅速升高、肌强直和体温上升”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","page":"教材P74—91","chapter":"第6章｜麻醉病人的护理｜外科护理学第7版","href":"surgical/ch06-anesthesia.html"},{"book":"外科护理学","title":"术前核查","summary":"确认身份、部位、手术、同意书、过敏史和关键检验结果。","exam":"患者病历中记录“手术前核对时发现患者口述的手术侧与标记侧不一致”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","page":"教材P92—109","chapter":"第7章｜手术前后病人的护理｜外科护理学第7版","href":"surgical/ch07-perioperative-care.html"},{"book":"外科护理学","title":"禁食禁饮","summary":"目的是降低麻醉期反流误吸，具体时间按麻醉方案和规范执行。","exam":"护士发现患者正在接受一项与“患者未达到禁食要求即准备接受全身麻醉”相冲突的处理。应立即制止什么，并说明可能造成的风险。","page":"教材P92—109","chapter":"第7章｜手术前后病人的护理｜外科护理学第7版","href":"surgical/ch07-perioperative-care.html"},{"book":"外科护理学","title":"术后优先级","summary":"回病房先评估气道、呼吸、循环和意识。","exam":"患者进入术后观察期，交班记录提示“术后返回病房时嗜睡、鼾声、呼吸浅慢且血氧下降”。下一班应重点复评什么，什么变化需要立即上报？","page":"教材P92—109","chapter":"第7章｜手术前后病人的护理｜外科护理学第7版","href":"surgical/ch07-perioperative-care.html"},{"book":"外科护理学","title":"早期活动","summary":"病情允许时循序活动可减少肺部并发症和静脉血栓。","exam":"患者病历中记录“病情稳定却因惧痛长期卧床，双下肢活动明显减少”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","page":"教材P92—109","chapter":"第7章｜手术前后病人的护理｜外科护理学第7版","href":"surgical/ch07-perioperative-care.html"},{"book":"外科护理学","title":"引流观察","summary":"记录量、颜色、性质与通畅度，鲜红骤增或突然停止均需评估。","exam":"患者进入术后观察期，交班记录提示“术后引流液突然鲜红增多，随后管路又无液体流出”。下一班应重点复评什么，什么变化需要立即上报？","page":"教材P92—109","chapter":"第7章｜手术前后病人的护理｜外科护理学第7版","href":"surgical/ch07-perioperative-care.html"},{"book":"外科护理学","title":"局部感染","summary":"红肿热痛和功能障碍常见，形成脓肿后通常需要充分引流。","exam":"患者进入术后观察期，交班记录提示“切口红肿热痛，中央出现波动感并伴发热”。下一班应重点复评什么，什么变化需要立即上报？","page":"教材P110—126","chapter":"第8章｜外科感染病人的护理｜外科护理学第7版","href":"surgical/ch08-surgical-infection.html"},{"book":"外科护理学","title":"手部感染","summary":"腱鞘和深间隙感染可迅速损害手功能，应早期制动、抬高和引流。","exam":"患者病历中记录“手指屈肌腱鞘区剧痛、肿胀，伸指时疼痛明显加重”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","page":"教材P110—126","chapter":"第8章｜外科感染病人的护理｜外科护理学第7版","href":"surgical/ch08-surgical-infection.html"},{"book":"外科护理学","title":"脓毒症","summary":"感染伴意识、循环、呼吸或尿量异常提示器官功能受损。","exam":"患者病历中记录“感染患者意识转差、血压下降、呼吸急促且尿量减少”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","page":"教材P110—126","chapter":"第8章｜外科感染病人的护理｜外科护理学第7版","href":"surgical/ch08-surgical-infection.html"},{"book":"外科护理学","title":"破伤风","summary":"减少声光刺激、集中护理、保持气道并控制痉挛。","exam":"患者病历中记录“轻微外伤后出现张口困难和阵发性肌痉挛，声光刺激可诱发”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","page":"教材P110—126","chapter":"第8章｜外科感染病人的护理｜外科护理学第7版","href":"surgical/ch08-surgical-infection.html"},{"book":"外科护理学","title":"气性坏疽","summary":"伤口剧痛、肿胀、捻发感和恶臭分泌物提示紧急坏死性感染。","exam":"患者病历中记录“污染伤口疼痛迅速加重、肿胀、捻发感并有恶臭分泌物”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","page":"教材P110—126","chapter":"第8章｜外科感染病人的护理｜外科护理学第7版","href":"surgical/ch08-surgical-infection.html"},{"book":"外科护理学","title":"创伤初评","summary":"按ABCDE先处理威胁生命的问题，再处理局部伤口。","exam":"患者病历中记录“多发伤患者意识模糊、气道有血液，胸廓起伏不对称且血压下降”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","page":"教材P127—146","chapter":"第9章｜损伤病人的护理｜外科护理学第7版","href":"surgical/ch09-injury-burn.html"},{"book":"外科护理学","title":"止血固定","summary":"活动性出血先压迫止血，疑似骨折固定后再转运。","exam":"患者病历中记录“开放性小腿伤口持续出血，肢体畸形并诉剧痛”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","page":"教材P127—146","chapter":"第9章｜损伤病人的护理｜外科护理学第7版","href":"surgical/ch09-injury-burn.html"},{"book":"外科护理学","title":"烧伤面积","summary":"成人常用九分法，手掌法适合小面积或散在烧伤。","exam":"患者病历中记录“成人躯干和一侧上肢烧伤，需要估算烧伤面积”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","page":"教材P127—146","chapter":"第9章｜损伤病人的护理｜外科护理学第7版","href":"surgical/ch09-injury-burn.html"},{"book":"外科护理学","title":"烧伤深度","summary":"水疱与明显疼痛多见浅度，焦痂和痛觉减退提示更深损伤。","exam":"患者病历中记录“烧伤创面有水疱且疼痛明显，另一区域呈焦痂并痛觉减退”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","page":"教材P127—146","chapter":"第9章｜损伤病人的护理｜外科护理学第7版","href":"surgical/ch09-injury-burn.html"},{"book":"外科护理学","title":"吸入性损伤","summary":"声音嘶哑、口鼻炭末或封闭空间烧伤提示气道水肿风险。","exam":"患者病历中记录“封闭空间烧伤后声音嘶哑、口鼻有炭末并进行性呼吸困难”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","page":"教材P127—146","chapter":"第9章｜损伤病人的护理｜外科护理学第7版","href":"surgical/ch09-injury-burn.html"},{"book":"外科护理学","title":"确诊依据","summary":"病理学检查用于定性，影像和标志物不能单独替代病理。","exam":"患者病历中记录“影像发现肿块且肿瘤标志物升高，但尚未取得组织病理”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","page":"教材P147—161","chapter":"第10章｜肿瘤病人的护理｜外科护理学第7版","href":"surgical/ch10-tumor-care.html"},{"book":"外科护理学","title":"TNM分期","summary":"T、N、M分别反映原发肿瘤、区域淋巴结和远处转移。","exam":"患者主诉和查体出现“病理提示恶性肿瘤，同时发现区域淋巴结和远处病灶”。最需要考虑哪种病情或并发症？请列出决定判断的线索。","page":"教材P147—161","chapter":"第10章｜肿瘤病人的护理｜外科护理学第7版","href":"surgical/ch10-tumor-care.html"},{"book":"外科护理学","title":"骨髓抑制","summary":"白细胞、血小板和血红蛋白下降分别增加感染、出血和乏力风险。","exam":"患者病历中记录“化疗后白细胞、血小板和血红蛋白均下降”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","page":"教材P147—161","chapter":"第10章｜肿瘤病人的护理｜外科护理学第7版","href":"surgical/ch10-tumor-care.html"},{"book":"外科护理学","title":"化疗外渗","summary":"立即停止输注，保留通路回抽并按药物性质处理。","exam":"患者病历中记录“静脉输注化疗药时穿刺处疼痛、肿胀且滴速减慢”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","page":"教材P147—161","chapter":"第10章｜肿瘤病人的护理｜外科护理学第7版","href":"surgical/ch10-tumor-care.html"},{"book":"外科护理学","title":"癌痛管理","summary":"定时、按阶梯、个体化给药，同时预防便秘和恶心。","exam":"患者病历中记录“持续癌痛患者仍按疼痛发作时临时用药，并出现便秘恶心”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","page":"教材P147—161","chapter":"第10章｜肿瘤病人的护理｜外科护理学第7版","href":"surgical/ch10-tumor-care.html"},{"book":"外科护理学","title":"排斥类型","summary":"超急性、急性和慢性排斥的时间、机制和处理不同。","exam":"患者的记录中出现“器官移植后数分钟移植物迅速失去功能并出现严重循环异常”。这个数值或时间条件是否达到干预标准？请给出判断和下一步护理。","page":"教材P162—180","chapter":"第11章｜移植病人的护理｜外科护理学第7版","href":"surgical/ch11-transplantation.html"},{"book":"外科护理学","title":"感染风险","summary":"免疫抑制后典型炎症表现可减弱，低热或轻微不适也需重视。","exam":"患者评估资料符合“长期免疫抑制治疗者仅有低热和乏力，但感染指标持续升高”。当前处理应先解决什么问题，护士怎样配合并评价效果？","page":"教材P162—180","chapter":"第11章｜移植病人的护理｜外科护理学第7版","href":"surgical/ch11-transplantation.html"},{"book":"外科护理学","title":"用药依从","summary":"免疫抑制剂应按时服用并监测血药浓度及肝肾功能。","exam":"患者病历中记录“患者漏服免疫抑制剂且自行减量，血药浓度低”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","page":"教材P162—180","chapter":"第11章｜移植病人的护理｜外科护理学第7版","href":"surgical/ch11-transplantation.html"},{"book":"外科护理学","title":"肾移植观察","summary":"尿量骤减需排查血管、尿路、排斥和容量因素。","exam":"患者进入术后观察期，交班记录提示“肾移植术后尿量突然减少，移植肾区不适”。下一班应重点复评什么，什么变化需要立即上报？","page":"教材P162—180","chapter":"第11章｜移植病人的护理｜外科护理学第7版","href":"surgical/ch11-transplantation.html"},{"book":"外科护理学","title":"肝移植观察","summary":"关注意识、凝血、胆汁、肝酶和血流动力学。","exam":"患者进入术后观察期，交班记录提示“肝移植术后意识改变、凝血异常、胆汁量骤减且肝酶升高”。下一班应重点复评什么，什么变化需要立即上报？","page":"教材P162—180","chapter":"第11章｜移植病人的护理｜外科护理学第7版","href":"surgical/ch11-transplantation.html"},{"book":"外科护理学","title":"颅压三主征","summary":"头痛、呕吐和视乳头水肿是典型组合，但表现可不完整。","exam":"患者病历中记录“头痛、喷射性呕吐并发现视乳头水肿”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","page":"教材P181—193","chapter":"第12章｜颅内压增高及脑疝病人的护理｜外科护理学第7版","href":"surgical/ch12-intracranial-pressure.html"},{"book":"外科护理学","title":"库欣反应","summary":"血压升高、脉搏减慢和呼吸不规则提示颅内压危象。","exam":"患者病历中记录“血压逐渐升高、脉搏减慢、呼吸节律不规则”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","page":"教材P181—193","chapter":"第12章｜颅内压增高及脑疝病人的护理｜外科护理学第7版","href":"surgical/ch12-intracranial-pressure.html"},{"book":"外科护理学","title":"幕切迹疝","summary":"单侧瞳孔散大伴意识恶化时应立即降颅压并准备手术。","exam":"患者病历中记录“意识突然恶化并出现一侧瞳孔散大”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","page":"教材P181—193","chapter":"第12章｜颅内压增高及脑疝病人的护理｜外科护理学第7版","href":"surgical/ch12-intracranial-pressure.html"},{"book":"外科护理学","title":"护理体位","summary":"抬高头部并保持颈部中立，避免阻碍静脉回流。","exam":"患者病历中记录“卧位不当造成颈部屈曲，躁动咳嗽后头痛加重”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","page":"教材P181—193","chapter":"第12章｜颅内压增高及脑疝病人的护理｜外科护理学第7版","href":"surgical/ch12-intracranial-pressure.html"},{"book":"外科护理学","title":"腰穿禁忌","summary":"明显颅压增高时腰椎穿刺可能诱发脑疝。","exam":"护士发现患者正在接受一项与“明显颅内压增高患者被安排腰椎穿刺”相冲突的处理。应立即制止什么，并说明可能造成的风险。","page":"教材P181—193","chapter":"第12章｜颅内压增高及脑疝病人的护理｜外科护理学第7版","href":"surgical/ch12-intracranial-pressure.html"},{"book":"外科护理学","title":"脑脊液漏","summary":"颅底骨折鼻漏或耳漏时避免堵塞、冲洗、擤鼻和腰椎穿刺。","exam":"患者病历中记录“颅底骨折后鼻腔流出清亮液体，患者反复擤鼻”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","page":"教材P194—211","chapter":"第13章｜颅脑损伤病人的护理｜外科护理学第7版","href":"surgical/ch13-craniocerebral-injury.html"},{"book":"外科护理学","title":"脑震荡","summary":"短暂意识障碍和逆行性遗忘常见，仍需观察迟发恶化。","exam":"患者病历中记录“受伤后短暂昏迷并有逆行性遗忘，随后自觉好转”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","page":"教材P194—211","chapter":"第13章｜颅脑损伤病人的护理｜外科护理学第7版","href":"surgical/ch13-craniocerebral-injury.html"},{"book":"外科护理学","title":"硬膜外血肿","summary":"短暂昏迷后清醒再恶化的中间清醒期具有提示意义。","exam":"患者病历中记录“头部外伤后先昏迷、短暂清醒，之后再次意识恶化”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","page":"教材P194—211","chapter":"第13章｜颅脑损伤病人的护理｜外科护理学第7版","href":"surgical/ch13-craniocerebral-injury.html"},{"book":"外科护理学","title":"硬膜下血肿","summary":"常伴脑挫裂伤，意识障碍可持续或进行性加重。","exam":"患者主诉和查体出现“重型颅脑损伤后意识障碍持续加重并伴局灶体征”。最需要考虑哪种病情或并发症？请列出决定判断的线索。","page":"教材P194—211","chapter":"第13章｜颅脑损伤病人的护理｜外科护理学第7版","href":"surgical/ch13-craniocerebral-injury.html"},{"book":"外科护理学","title":"动态观察","summary":"连续评估GCS、瞳孔、肢体活动和生命体征。","exam":"患者病历中记录“观察期间GCS下降、双侧瞳孔不等大且一侧肢体无力”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","page":"教材P194—211","chapter":"第13章｜颅脑损伤病人的护理｜外科护理学第7版","href":"surgical/ch13-craniocerebral-injury.html"},{"book":"外科护理学","title":"卒中识别","summary":"突发面口歪斜、肢体无力或言语障碍需记录最后正常时间。","exam":"患者病历中记录“突发一侧面口歪斜、肢体无力和言语含糊，发病时间不清”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","page":"教材P212—222","chapter":"第14章｜颅内和椎管内血管性疾病病人的护理｜外科护理学第7版","href":"surgical/ch14-cerebrovascular-surgery.html"},{"book":"外科护理学","title":"蛛网膜下腔出血","summary":"雷击样剧烈头痛伴颈强直需高度警惕。","exam":"患者病历中记录“突然出现一生中最剧烈头痛并伴颈项强直”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","page":"教材P212—222","chapter":"第14章｜颅内和椎管内血管性疾病病人的护理｜外科护理学第7版","href":"surgical/ch14-cerebrovascular-surgery.html"},{"book":"外科护理学","title":"动脉瘤术后","summary":"新发意识、瞳孔或局灶体征变化需排查再出血和缺血。","exam":"患者进入术后观察期，交班记录提示“动脉瘤术后新发意识下降、瞳孔变化和偏瘫”。下一班应重点复评什么，什么变化需要立即上报？","page":"教材P212—222","chapter":"第14章｜颅内和椎管内血管性疾病病人的护理｜外科护理学第7版","href":"surgical/ch14-cerebrovascular-surgery.html"},{"book":"外科护理学","title":"血管痉挛","summary":"蛛网膜下腔出血后迟发神经功能恶化应考虑脑血管痉挛。","exam":"患者病历中记录“蛛网膜下腔出血数日后出现迟发偏瘫和失语”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","page":"教材P212—222","chapter":"第14章｜颅内和椎管内血管性疾病病人的护理｜外科护理学第7版","href":"surgical/ch14-cerebrovascular-surgery.html"},{"book":"外科护理学","title":"康复安全","summary":"吞咽评估完成前不应贸然经口进食。","exam":"患者病历中记录“卒中患者饮水呛咳，尚未完成吞咽评估”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","page":"教材P212—222","chapter":"第14章｜颅内和椎管内血管性疾病病人的护理｜外科护理学第7版","href":"surgical/ch14-cerebrovascular-surgery.html"},{"book":"外科护理学","title":"定位判断","summary":"症状取决于占位部位和颅内压，两条线索应同时分析。","exam":"患者主诉和查体出现“头痛呕吐同时伴有与病灶部位相符的局灶神经症状”。最需要考虑哪种病情或并发症？请列出决定判断的线索。","page":"教材P223—230","chapter":"第15章｜颅内和椎管内肿瘤病人的护理｜外科护理学第7版","href":"surgical/ch15-cns-tumor.html"},{"book":"外科护理学","title":"癫痫安全","summary":"发作时保护头部和气道，不强行约束或向口中塞物。","exam":"患者病历中记录“住院中突发全身抽搐，家属试图按压肢体并往口中塞物”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","page":"教材P223—230","chapter":"第15章｜颅内和椎管内肿瘤病人的护理｜外科护理学第7版","href":"surgical/ch15-cns-tumor.html"},{"book":"外科护理学","title":"术后观察","summary":"重点看意识、瞳孔、肢体、引流和内分泌变化。","exam":"患者进入术后观察期，交班记录提示“颅内肿瘤术后意识下降、瞳孔不等大并出现新发肢体无力”。下一班应重点复评什么，什么变化需要立即上报？","page":"教材P223—230","chapter":"第15章｜颅内和椎管内肿瘤病人的护理｜外科护理学第7版","href":"surgical/ch15-cns-tumor.html"},{"book":"外科护理学","title":"垂体术后","summary":"避免擤鼻和低头，观察脑脊液鼻漏与大量稀尿。","exam":"患者进入术后观察期，交班记录提示“经蝶垂体手术后鼻腔流清液且尿量显著增多”。下一班应重点复评什么，什么变化需要立即上报？","page":"教材P223—230","chapter":"第15章｜颅内和椎管内肿瘤病人的护理｜外科护理学第7版","href":"surgical/ch15-cns-tumor.html"},{"book":"外科护理学","title":"椎管内肿瘤","summary":"根性痛、感觉平面、运动及大小便异常提示脊髓受压。","exam":"患者病历中记录“进行性根性痛、感觉平面上移并出现大小便功能障碍”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","page":"教材P223—230","chapter":"第15章｜颅内和椎管内肿瘤病人的护理｜外科护理学第7版","href":"surgical/ch15-cns-tumor.html"},{"book":"外科护理学","title":"甲亢术前","summary":"应使代谢和循环状态接近稳定，再进入手术。","exam":"患者病历中记录“甲亢患者静息心率仍快、体重下降且情绪激动，计划次日手术”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","page":"教材P231—245","chapter":"第16章｜颈部疾病病人的护理｜外科护理学第7版","href":"surgical/ch16-neck-thyroid.html"},{"book":"外科护理学","title":"甲状腺危象","summary":"术后高热、心动过速、烦躁和呕吐提示危象。","exam":"患者治疗过程中突然出现“甲状腺术后高热、心动过速、烦躁并频繁呕吐”。护士首先怀疑什么危险变化，第一项处置是什么？","page":"教材P231—245","chapter":"第16章｜颈部疾病病人的护理｜外科护理学第7版","href":"surgical/ch16-neck-thyroid.html"},{"book":"外科护理学","title":"出血窒息","summary":"颈部肿胀、呼吸困难、频繁吞咽或鲜红引流增多提示术后出血。","exam":"患者治疗过程中突然出现“术后颈部迅速肿胀、呼吸困难并频繁吞咽”。护士首先怀疑什么危险变化，第一项处置是什么？","page":"教材P231—245","chapter":"第16章｜颈部疾病病人的护理｜外科护理学第7版","href":"surgical/ch16-neck-thyroid.html"},{"book":"外科护理学","title":"喉返神经损伤","summary":"单侧损伤可声音嘶哑，双侧损伤可严重呼吸困难。","exam":"患者进入术后观察期，交班记录提示“术后声音嘶哑，随后出现吸气性呼吸困难”。下一班应重点复评什么，什么变化需要立即上报？","page":"教材P231—245","chapter":"第16章｜颈部疾病病人的护理｜外科护理学第7版","href":"surgical/ch16-neck-thyroid.html"},{"book":"外科护理学","title":"低钙表现","summary":"口周麻木和手足抽搐提示甲状旁腺受损或低钙。","exam":"患者的记录中出现“术后口周麻木、手足抽搐，血钙下降”。这个数值或时间条件是否达到干预标准？请给出判断和下一步护理。","page":"教材P231—245","chapter":"第16章｜颈部疾病病人的护理｜外科护理学第7版","href":"surgical/ch16-neck-thyroid.html"},{"book":"外科护理学","title":"炎症还是脓肿","summary":"哺乳期红、肿、热、痛并伴发热，首先想到急性乳腺炎。未形成脓肿时，处理核心是抗感染和持续排空乳汁；出现波动感、液性暗区或抽出脓液，说明已形成脓肿，需要穿刺或切开引流。","exam":"常把“未形成脓肿”和“已经形成脓肿”放在同一病例的前后变化中，问处理措施何时必须升级；还会考患侧暂停直接哺乳不等于停止排乳。","page":"教材P246—260","chapter":"第17章｜乳房疾病病人的护理｜外科护理学第7版","href":"surgical/ch17-breast-disease.html"},{"book":"外科护理学","title":"先看周期，再看边界和活动度","summary":"月经前双乳胀痛、多个结节且经后减轻，更支持乳房囊性增生病；年轻女性的单发、光滑、边界清楚、活动度好且不随月经变化的肿块，更支持乳房纤维腺瘤。","exam":"病例鉴别题会同时给年龄、单发或多发、疼痛是否随月经变化、边界与活动度；不能只凭“摸到肿块”判断。","page":"教材P246—260","chapter":"第17章｜乳房疾病病人的护理｜外科护理学第7版","href":"surgical/ch17-breast-disease.html"},{"book":"外科护理学","title":"肿块、酒窝征和橘皮征要分开解释","summary":"无痛、质硬、边界不清、活动度差的单发肿块提示乳腺癌。酒窝征来自Cooper韧带受累缩短；橘皮征来自癌细胞堵塞皮下淋巴管；同侧腋窝淋巴结是常见且较早的淋巴转移部位。","exam":"常见设问是首发症状、酒窝征与橘皮征的形成机制、最早常见转移淋巴结，以及根据一组体征写出诊断依据。","page":"教材P246—260","chapter":"第17章｜乳房疾病病人的护理｜外科护理学第7版","href":"surgical/ch17-breast-disease.html"},{"book":"外科护理学","title":"鲜红骤增与拔管条件是两类题","summary":"负压引流用于排出积血积液、消灭残腔并使皮瓣贴合。鲜红引流突然增多或胸壁隆起要警惕活动性出血；引流转淡黄色、连续3天每日少于10—15 ml且皮瓣贴合、无积液时，才进入拔管评估。","exam":"一类题给术后突变，问首先判断和优先处理；另一类题给连续引流量、颜色及皮瓣情况，问能否拔管。只看某一天的数字会失分。","page":"教材P246—260","chapter":"第17章｜乳房疾病病人的护理｜外科护理学第7版","href":"surgical/ch17-breast-disease.html"},{"book":"外科护理学","title":"保护、锻炼和异常识别同时考","summary":"避免患侧测血压、抽血、注射、输液、负重和皮肤损伤；患肢可抬高，并按伤口和引流情况从手指、腕肘活动逐步过渡到肩关节训练。出现肿胀需同时评估感染、淋巴回流及血运。","exam":"会按术后第1天、第4—7天、第1—2周考锻炼顺序，也会问预防淋巴水肿的错误措施；若伴发绀、皮温下降或脉搏异常，优先排查血运障碍。","page":"教材P246—260","chapter":"第17章｜乳房疾病病人的护理｜外科护理学第7版","href":"surgical/ch17-breast-disease.html"},{"book":"外科护理学","title":"连枷胸","summary":"反常呼吸运动提示胸壁失去稳定，需镇痛和呼吸支持。","exam":"患者病历中记录“多发肋骨骨折后胸壁出现反常呼吸运动”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","page":"教材P261—277","chapter":"第18章｜胸部损伤病人的护理｜外科护理学第7版","href":"surgical/ch18-chest-trauma.html"},{"book":"外科护理学","title":"开放性气胸","summary":"胸壁伤口有气流声时应立即封闭伤口并紧急处理。","exam":"患者病历中记录“胸壁开放伤口随呼吸发出吸吮声并有气体进出”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","page":"教材P261—277","chapter":"第18章｜胸部损伤病人的护理｜外科护理学第7版","href":"surgical/ch18-chest-trauma.html"},{"book":"外科护理学","title":"张力性气胸","summary":"进行性呼吸困难、低血压、颈静脉怒张和气管移位提示危象。","exam":"患者治疗过程中突然出现“呼吸困难迅速加重、低血压、颈静脉怒张和气管偏移”。护士首先怀疑什么危险变化，第一项处置是什么？","page":"教材P261—277","chapter":"第18章｜胸部损伤病人的护理｜外科护理学第7版","href":"surgical/ch18-chest-trauma.html"},{"book":"外科护理学","title":"胸腔引流","summary":"水封瓶低于胸腔，保持密闭通畅并观察水柱和气泡。","exam":"患者进入术后观察期，交班记录提示“胸腔闭式引流瓶高于胸壁且水封管内水柱不波动”。下一班应重点复评什么，什么变化需要立即上报？","page":"教材P261—277","chapter":"第18章｜胸部损伤病人的护理｜外科护理学第7版","href":"surgical/ch18-chest-trauma.html"},{"book":"外科护理学","title":"心包压塞","summary":"低血压、心音低钝和颈静脉怒张提示心包压塞。","exam":"患者病历中记录“胸部损伤后低血压、心音低钝和颈静脉怒张”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","page":"教材P261—277","chapter":"第18章｜胸部损伤病人的护理｜外科护理学第7版","href":"surgical/ch18-chest-trauma.html"},{"book":"外科护理学","title":"漏斗胸评估","summary":"同时关注心肺受压、活动耐量和身体形象。","exam":"患者病历中记录“漏斗胸患者活动后气促并因胸廓外观回避社交”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","page":"教材P278—287","chapter":"第19章｜胸壁、胸膜疾病病人的护理｜外科护理学第7版","href":"surgical/ch19-chest-wall-pleura.html"},{"book":"外科护理学","title":"脓胸治疗","summary":"抗感染与充分引流同等重要。","exam":"患者进入术后观察期，交班记录提示“脓胸患者持续高热，胸腔积液引流量少且呼吸困难加重”。下一班应重点复评什么，什么变化需要立即上报？","page":"教材P278—287","chapter":"第19章｜胸壁、胸膜疾病病人的护理｜外科护理学第7版","href":"surgical/ch19-chest-wall-pleura.html"},{"book":"外科护理学","title":"引流不畅","summary":"呼吸症状加重时先排查体位、扭曲和堵塞。","exam":"患者进入术后观察期，交班记录提示“胸腔引流管受压弯折，患者胸闷和呼吸急促”。下一班应重点复评什么，什么变化需要立即上报？","page":"教材P278—287","chapter":"第19章｜胸壁、胸膜疾病病人的护理｜外科护理学第7版","href":"surgical/ch19-chest-wall-pleura.html"},{"book":"外科护理学","title":"慢性脓胸","summary":"可出现胸廓塌陷、营养不良和肺功能下降。","exam":"患者病历中记录“慢性脓胸患者胸廓塌陷、消瘦且活动耐量下降”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","page":"教材P278—287","chapter":"第19章｜胸壁、胸膜疾病病人的护理｜外科护理学第7版","href":"surgical/ch19-chest-wall-pleura.html"},{"book":"外科护理学","title":"术后康复","summary":"有效镇痛、咳嗽排痰和早期活动可减少肺不张。","exam":"患者进入术后观察期，交班记录提示“胸部术后因疼痛拒绝咳嗽排痰，肺底呼吸音减弱”。下一班应重点复评什么，什么变化需要立即上报？","page":"教材P278—287","chapter":"第19章｜胸壁、胸膜疾病病人的护理｜外科护理学第7版","href":"surgical/ch19-chest-wall-pleura.html"},{"book":"外科护理学","title":"肺癌警示","summary":"持续咳嗽、咯血、胸痛或反复肺炎需进一步检查。","exam":"患者主诉和查体出现“长期吸烟者持续刺激性咳嗽、痰中带血并反复肺炎”。最需要考虑哪种病情或并发症？请列出决定判断的线索。","page":"教材P288—303","chapter":"第20章｜肺部疾病病人的护理｜外科护理学第7版","href":"surgical/ch20-lung-disease.html"},{"book":"外科护理学","title":"肺切除体位","summary":"体位取决于切除范围和病情，必须先核对术式。","exam":"患者进入术后观察期，交班记录提示“全肺切除术后体位安排未核对术式和纵隔情况”。下一班应重点复评什么，什么变化需要立即上报？","page":"教材P288—303","chapter":"第20章｜肺部疾病病人的护理｜外科护理学第7版","href":"surgical/ch20-lung-disease.html"},{"book":"外科护理学","title":"气道管理","summary":"镇痛、深呼吸、有效咳嗽和雾化有助于预防肺不张。","exam":"患者进入术后观察期，交班记录提示“肺叶切除术后疼痛明显、咳痰无力并出现肺底湿啰音”。下一班应重点复评什么，什么变化需要立即上报？","page":"教材P288—303","chapter":"第20章｜肺部疾病病人的护理｜外科护理学第7版","href":"surgical/ch20-lung-disease.html"},{"book":"外科护理学","title":"胸管观察","summary":"持续大量鲜血或呼吸恶化需紧急评估。","exam":"患者进入术后观察期，交班记录提示“胸管持续大量鲜红引流并伴心率加快和血压下降”。下一班应重点复评什么，什么变化需要立即上报？","page":"教材P288—303","chapter":"第20章｜肺部疾病病人的护理｜外科护理学第7版","href":"surgical/ch20-lung-disease.html"},{"book":"外科护理学","title":"大咯血","summary":"优先保持气道并防止血液进入健侧肺。","exam":"患者病历中记录“大量咯血时患者平卧，血液向健侧气道流入”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","page":"教材P288—303","chapter":"第20章｜肺部疾病病人的护理｜外科护理学第7版","href":"surgical/ch20-lung-disease.html"},{"book":"外科护理学","title":"进行性吞咽困难","summary":"由固体到半流质再到流质受阻是典型进展线索。","exam":"患者病历中记录“吞咽困难由固体食物逐渐发展到半流质和流质”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","page":"教材P304—314","chapter":"第21章｜食管疾病病人的护理｜外科护理学第7版","href":"surgical/ch21-esophageal-disease.html"},{"book":"外科护理学","title":"营养准备","summary":"术前纠正脱水和营养不足，必要时实施管饲或静脉营养。","exam":"患者病历中记录“食管癌患者明显消瘦脱水，白蛋白下降，拟接受手术”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","page":"教材P304—314","chapter":"第21章｜食管疾病病人的护理｜外科护理学第7版","href":"surgical/ch21-esophageal-disease.html"},{"book":"外科护理学","title":"吻合口瘘","summary":"术后发热、胸痛、呼吸困难或引流异常需警惕。","exam":"患者进入术后观察期，交班记录提示“食管术后发热、胸痛、呼吸困难且引流液性状异常”。下一班应重点复评什么，什么变化需要立即上报？","page":"教材P304—314","chapter":"第21章｜食管疾病病人的护理｜外科护理学第7版","href":"surgical/ch21-esophageal-disease.html"},{"book":"外科护理学","title":"恢复进食","summary":"确认吻合口和胃肠功能后循序进食，出现胸痛应暂停。","exam":"患者进入术后观察期，交班记录提示“术后刚恢复进食即出现胸痛和发热”。下一班应重点复评什么，什么变化需要立即上报？","page":"教材P304—314","chapter":"第21章｜食管疾病病人的护理｜外科护理学第7版","href":"surgical/ch21-esophageal-disease.html"},{"book":"外科护理学","title":"反流预防","summary":"抬高床头、少量多餐并避免餐后平卧。","exam":"患者治疗过程中突然出现“进食后立即平卧，夜间反流呛咳明显”。护士首先怀疑什么危险变化，第一项处置是什么？","page":"教材P304—314","chapter":"第21章｜食管疾病病人的护理｜外科护理学第7版","href":"su ,"chapter":"第28章｜阑尾炎病人的护理｜外科护理学第7版","href":"surgical/ch28-appendicitis.html"},{"book":"外科护理学","title":"术后观察","summary":"发热、切口红肿渗液和疼痛加重提示感染。","exam":"患者进入术后观察期，交班记录提示“术后持续发热、切口红肿渗液且疼痛加重”。下一班应重点复评什么，什么变化需要立即上报？","page":"教材P406—414","chapter":"第28章｜阑尾炎病人的护理｜外科护理学第7版","href":"surgical/ch28-appendicitis.html"},{"book":"外科护理学","title":"右半结肠癌","summary":"贫血、乏力和腹部包块较突出，梗阻较晚。","exam":"患者病历中记录“乏力贫血、右腹包块，但较晚才出现梗阻”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","page":"教材P415—432","chapter":"第29章｜大肠和肛管疾病病人的护理｜外科护理学第7版","href":"surgical/ch29-colorectal-anal.html"},{"book":"外科护理学","title":"左半结肠癌","summary":"排便习惯改变、便血和梗阻更常见。","exam":"患者病历中记录“排便习惯改变、便血并逐渐出现左侧结肠梗阻”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","page":"教材P415—432","chapter":"第29章｜大肠和肛管疾病病人的护理｜外科护理学第7版","href":"surgical/ch29-colorectal-anal.html"},{"book":"外科护理学","title":"造口血供","summary":"正常造口红润湿润，苍白、发紫或发黑需急报。","exam":"患者进入术后观察期，交班记录提示“造口由红润转为苍白、暗紫，触之凉”。下一班应重点复评什么，什么变化需要立即上报？","page":"教材P415—432","chapter":"第29章｜大肠和肛管疾病病人的护理｜外科护理学第7版","href":"surgical/ch29-colorectal-anal.html"},{"book":"外科护理学","title":"造口皮肤","summary":"底盘应贴合造口，渗漏是刺激性皮炎的重要原因。","exam":"患者的记录中出现“造口底盘开口过大并反复渗漏，周围皮肤糜烂”。这个数值或时间条件是否达到干预标准？请给出判断和下一步护理。","page":"教材P415—432","chapter":"第29章｜大肠和肛管疾病病人的护理｜外科护理学第7版","href":"surgical/ch29-colorectal-anal.html"},{"book":"外科护理学","title":"肛周鉴别","summary":"肛裂多为排便剧痛，肛周脓肿多为持续跳痛并可发热。","exam":"患者的记录中出现“排便时撕裂样剧痛与持续跳痛伴发热需要鉴别”。这个数值或时间条件是否达到干预标准？请给出判断和下一步护理。","page":"教材P415—432","chapter":"第29章｜大肠和肛管疾病病人的护理｜外科护理学第7版","href":"surgical/ch29-colorectal-anal.html"},{"book":"外科护理学","title":"门脉高压","summary":"脾大脾亢、交通支扩张和腹水是主要表现。","exam":"患者病历中记录“脾大、血细胞减少、腹水并见腹壁静脉曲张”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","page":"教材P433—451","chapter":"第30章｜肝脏疾病、门静脉高压症病人的护理｜外科护理学第7版","href":"surgical/ch30-liver-portal-hypertension.html"},{"book":"外科护理学","title":"曲张静脉出血","summary":"呕血时禁食、建立静脉通路并稳定循环。","exam":"患者病历中记录“突发大量呕血、黑便、心率快和血压下降”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","page":"教材P433—451","chapter":"第30章｜肝脏疾病、门静脉高压症病人的护理｜外科护理学第7版","href":"surgical/ch30-liver-portal-hypertension.html"},{"book":"外科护理学","title":"分流断流","summary":"分流降低门脉压力但增加肝性脑病风险。","exam":"患者进入术后观察期，交班记录提示“门体分流术后性格改变、扑翼样震颤和意识模糊”。下一班应重点复评什么，什么变化需要立即上报？","page":"教材P433—451","chapter":"第30章｜肝脏疾病、门静脉高压症病人的护理｜外科护理学第7版","href":"surgical/ch30-liver-portal-hypertension.html"},{"book":"外科护理学","title":"肝切除后","summary":"观察出血、胆汁、肝功能和意识变化。","exam":"患者进入术后观察期，交班记录提示“肝切除术后腹腔引流鲜红增多、胆汁异常并意识改变”。下一班应重点复评什么，什么变化需要立即上报？","page":"教材P433—451","chapter":"第30章｜肝脏疾病、门静脉高压症病人的护理｜外科护理学第7版","href":"surgical/ch30-liver-portal-hypertension.html"},{"book":"外科护理学","title":"肝脓肿","summary":"高热寒战、肝区痛和肝大时需抗感染并按情况引流。","exam":"患者病历中记录“寒战高热、肝区痛和肝大，影像见液性占位”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","page":"教材P433—451","chapter":"第30章｜肝脏疾病、门静脉高压症病人的护理｜外科护理学第7版","href":"surgical/ch30-liver-portal-hypertension.html"},{"book":"外科护理学","title":"胆囊炎","summary":"右上腹痛、发热和Murphy征阳性支持急性胆囊炎。","exam":"患者病历中记录“右上腹痛、发热并有Murphy征阳性”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","page":"教材P452—472","chapter":"第31章｜胆道疾病病人的护理｜外科护理学第7版","href":"surgical/ch31-biliary-disease.html"},{"book":"外科护理学","title":"Charcot三联征","summary":"腹痛、寒战高热和黄疸提示胆管感染梗阻。","exam":"患者主诉和查体出现“右上腹痛、寒战高热和黄疸同时出现”。最需要考虑哪种病情或并发症？请列出决定判断的线索。","page":"教材P452—472","chapter":"第31章｜胆道疾病病人的护理｜外科护理学第7版","href":"surgical/ch31-biliary-disease.html"},{"book":"外科护理学","title":"Reynolds五联征","summary":"三联征加休克和神经症状提示重症胆管炎。","exam":"患者主诉和查体出现“三联征基础上又出现低血压和意识改变”。最需要考虑哪种病情或并发症？请列出决定判断的线索。","page":"教材P452—472","chapter":"第31章｜胆道疾病病人的护理｜外科护理学第7版","href":"surgical/ch31-biliary-disease.html"},{"book":"外科护理学","title":"T管护理","summary":"保持低位通畅，记录胆汁量色性状并防止牵拉。","exam":"患者病历中记录“T管受牵拉后胆汁突然停止流出并出现腹痛”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","page":"教材P452—472","chapter":"第31章｜胆道疾病病人的护理｜外科护理学第7版","href":"surgical/ch31-biliary-disease.html"},{"book":"外科护理学","title":"胆道减压","summary":"急性梗阻性化脓性胆管炎需复苏、抗感染和紧急减压。","exam":"患者治疗过程中突然出现“重症胆管炎经补液抗感染后仍休克，胆道梗阻未解除”。护士首先怀疑什么危险变化，第一项处置是什么？","page":"教材P452—472","chapter":"第31章｜胆道疾病病人的护理｜外科护理学第7版","href":"surgical/ch31-biliary-disease.html"},{"book":"外科护理学","title":"典型腹痛","summary":"持续上腹痛向腰背放射，屈曲位可稍缓解。","exam":"患者主诉和查体出现“持续上腹痛向腰背放射，屈曲位稍缓解”。最需要考虑哪种病情或并发症？请列出决定判断的线索。","page":"教材P473—487","chapter":"第32章｜胰腺疾病病人的护理｜外科护理学第7版","href":"surgical/ch32-pancreatic-disease.html"},{"book":"外科护理学","title":"严重程度","summary":"淀粉酶或脂肪酶高低不能单独代表病情严重度。","exam":"患者主诉和查体出现“淀粉酶显著升高但生命体征稳定、无器官衰竭”。最需要考虑哪种病情或并发症？请列出决定判断的线索。","page":"教材P473—487","chapter":"第32章｜胰腺疾病病人的护理｜外科护理学第7版","href":"surgical/ch32-pancreatic-disease.html"},{"book":"外科护理学","title":"早期处理","summary":"镇痛、补液、监测和适当营养支持是基础。","exam":"患者评估资料符合“入院后剧痛、脱水，需要镇痛补液和严密监测”。当前处理应先解决什么问题，护士怎样配合并评价效果？","page":"教材P473—487","chapter":"第32章｜胰腺疾病病人的护理｜外科护理学第7版","href":"surgical/ch32-pancreatic-disease.html"},{"book":"外科护理学","title":"重症警示","summary":"持续低血压、低氧、少尿或器官衰竭提示重症。","exam":"患者主诉和查体出现“持续低血压、低氧、少尿并出现器官功能障碍”。最需要考虑哪种病情或并发症？请列出决定判断的线索。","page":"教材P473—487","chapter":"第32章｜胰腺疾病病人的护理｜外科护理学第7版","href":"surgical/ch32-pancreatic-disease.html"},{"book":"外科护理学","title":"胰头癌","summary":"进行性无痛性黄疸、体重下降和上腹不适具有提示性。","exam":"患者病历中记录“进行性无痛性黄疸、体重下降和上腹不适”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","page":"教材P473—487","chapter":"第32章｜胰腺疾病病人的护理｜外科护理学第7版","href":"surgical/ch32-pancreatic-disease.html"},{"book":"外科护理学","title":"急性动脉缺血","summary":"疼痛、苍白、无脉、感觉运动异常和皮温下降是危急线索。","exam":"患者病历中记录“下肢突发剧痛、苍白、无脉、麻木无力且皮温下降”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","page":"教材P488—502","chapter":"第33章｜周围血管疾病病人的护理｜外科护理学第7版","href":"surgical/ch33-peripheral-vascular.html"},{"book":"外科护理学","title":"脉管炎","summary":"年轻吸烟男性出现间歇性跛行和足趾缺血时戒烟最关键。","exam":"患者病历中记录“年轻吸烟男性反复间歇性跛行并有足趾缺血”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","page":"教材P488—502","chapter":"第33章｜周围血管疾病病人的护理｜外科护理学第7版","href":"surgical/ch33-peripheral-vascular.html"},{"book":"外科护理学","title":"静脉曲张","summary":"弹力治疗前需排除严重动脉缺血。","exam":"患者病历中记录“拟使用弹力袜，但足背动脉弱且踝肱指数明显下降”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","page":"教材P488—502","chapter":"第33章｜周围血管疾病病人的护理｜外科护理学第7版","href":"surgical/ch33-peripheral-vascular.html"},{"book":"外科护理学","title":"深静脉血栓","summary":"急性期避免按摩，突发胸痛呼吸困难警惕肺栓塞。","exam":"患者病历中记录“下肢肿痛患者被按摩后突发胸痛和呼吸困难”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","page":"教材P488—502","chapter":"第33章｜周围血管疾病病人的护理｜外科护理学第7版","href":"surgical/ch33-peripheral-vascular.html"},{"book":"外科护理学","title":"抗凝护理","summary":"观察出血、血小板和凝血指标，避免自行加减药。","exam":"患者病历中记录“抗凝期间牙龈出血、皮下瘀斑且血小板下降”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","page":"教材P488—502","chapter":"第33章｜周围血管疾病病人的护理｜外科护理学第7版","href":"surgical/ch33-peripheral-vascular.html"},{"book":"外科护理学","title":"肾损伤","summary":"血尿多少不能单独判断严重程度，无血尿也不能完全排除。","exam":"患者病历中记录“肾区外伤后血尿不明显，但血压下降和腰部肿胀加重”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","page":"教材P503—514","chapter":"第34章｜泌尿系统损伤病人的护理｜外科护理学第7版","href":"surgical/ch34-urinary-trauma.html"},{"book":"外科护理学","title":"膀胱破裂","summary":"下腹痛、排尿困难和腹膜刺激征提示尿外渗。","exam":"患者病历中记录“下腹痛、排尿困难并出现腹膜刺激征”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","page":"教材P503—514","chapter":"第34章｜泌尿系统损伤病人的护理｜外科护理学第7版","href":"surgical/ch34-urinary-trauma.html"},{"book":"外科护理学","title":"尿道损伤","summary":"尿道口滴血、会阴血肿和排尿困难是重要线索。","exam":"患者病历中记录“骨盆骨折后尿道口滴血、会阴血肿和排尿困难”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","page":"教材P503—514","chapter":"第34章｜泌尿系统损伤病人的护理｜外科护理学第7版","href":"surgical/ch34-urinary-trauma.html"},{"book":"外科护理学","title":"导尿禁忌","summary":"怀疑尿道断裂时避免盲目插入尿管。","exam":"护士发现患者正在接受一项与“怀疑尿道断裂时仍准备盲目插入导尿管”相冲突的处理。应立即制止什么，并说明可能造成的风险。","page":"教材P503—514","chapter":"第34章｜泌尿系统损伤病人的护理｜外科护理学第7版","href":"surgical/ch34-urinary-trauma.html"},{"book":"外科护理学","title":"引流观察","summary":"突发无尿先排查管路扭曲、堵塞和血块。","exam":"患者进入术后观察期，交班记录提示“导尿或造瘘引流突然停止，管路见扭曲和血块”。下一班应重点复评什么，什么变化需要立即上报？","page":"教材P503—514","chapter":"第34章｜泌尿系统损伤病人的护理｜外科护理学第7版","href":"surgical/ch34-urinary-trauma.html"},{"book":"外科护理学","title":"肾绞痛","summary":"突发腰腹绞痛向腹股沟放射并伴血尿提示输尿管结石。","exam":"患者病历中记录“突发腰腹绞痛向腹股沟放射并伴肉眼血尿”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","page":"教材P515—524","chapter":"第35章｜泌尿系统结石病人的护理｜外科护理学第7版","href":"surgical/ch35-urinary-stones.html"},{"book":"外科护理学","title":"感染梗阻","summary":"结石伴高热寒战和尿路梗阻属于急症。","exam":"患者病历中记录“结石梗阻同时出现高热寒战、低血压和尿量下降”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","page":"教材P515—524","chapter":"第35章｜泌尿系统结石病人的护理｜外科护理学第7版","href":"surgical/ch35-urinary-stones.html"},{"book":"外科护理学","title": 者病历中记录“长期尿频尿急尿痛、血尿，尿培养阴性但有脓尿”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","page":"教材P541—548","chapter":"第37章｜泌尿、男性生殖系统结核病人的护理｜外科护理学第7版","href":"surgical/ch37-genitourinary-tuberculosis.html"},{"book":"外科护理学","title":"传播特点","summary":"结核多由血行播散先到肾，再向输尿管和膀胱扩展。","exam":"患者病历中记录“肾结核后逐渐出现输尿管狭窄和膀胱刺激征”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","page":"教材P541—548","chapter":"第37章｜泌尿、男性生殖系统结核病人的护理｜外科护理学第7版","href":"surgical/ch37-genitourinary-tuberculosis.html"},{"book":"外科护理学","title":"药物治疗","summary":"多药联合、规律和全程是基础，症状缓解不能自行停药。","exam":"患者主诉和查体出现“症状缓解后患者自行停止联合抗结核治疗”。最需要考虑哪种病情或并发症？请列出决定判断的线索。","page":"教材P541—548","chapter":"第37章｜泌尿、男性生殖系统结核病人的护理｜外科护理学第7版","href":"surgical/ch37-genitourinary-tuberculosis.html"},{"book":"外科护理学","title":"附睾结核","summary":"无痛性硬结和输精管串珠样改变具有提示性。","exam":"患者病历中记录“附睾无痛硬结并触及输精管串珠样改变”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","page":"教材P541—548","chapter":"第37章｜泌尿、男性生殖系统结核病人的护理｜外科护理学第7版","href":"surgical/ch37-genitourinary-tuberculosis.html"},{"book":"外科护理学","title":"长期随访","summary":"复查尿液、影像和肾功能，关注对侧肾和尿路狭窄。","exam":"患者病历中记录“随访发现对侧肾功能下降和尿路狭窄”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","page":"教材P541—548","chapter":"第37章｜泌尿、男性生殖系统结核病人的护理｜外科护理学第7版","href":"surgical/ch37-genitourinary-tuberculosis.html"},{"book":"外科护理学","title":"皮质醇增多","summary":"向心性肥胖、满月脸、紫纹、高血压和高血糖具有提示性。","exam":"患者病历中记录“向心性肥胖、满月脸、紫纹并伴高血压高血糖”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","page":"教材P549—557","chapter":"第38章｜肾上腺疾病病人的护理｜外科护理学第7版","href":"surgical/ch38-adrenal-disease.html"},{"book":"外科护理学","title":"原醛症","summary":"高血压合并低钾、肌无力和多尿需警惕。","exam":"患者病历中记录“顽固高血压伴低钾、肌无力和多尿”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","page":"教材P549—557","chapter":"第38章｜肾上腺疾病病人的护理｜外科护理学第7版","href":"surgical/ch38-adrenal-disease.html"},{"book":"外科护理学","title":"嗜铬细胞瘤","summary":"高血压伴头痛、心悸和多汗是经典组合。","exam":"患者病历中记录“阵发高血压同时出现头痛、心悸和大汗”。请判断它指向的临床问题，并写出需要继续核对的证据和护理重点。","page":"教材P549—557","chapter":"第38章｜肾上腺疾病病人的护理｜外科护理学第7版","href":"surgical/ch38-adrenal-disease.html"},{"book":"外科护理学","title":"术前阻滞","summary":"嗜铬细胞瘤应先充分使用α受体阻滞并扩充容量。","exam":"患者病历中记录“嗜铬细胞瘤患者未充分α阻滞便拟直接加用β阻滞”。 let selected=-1;const esc=s=>String(s??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#39;");
function text(n){return [n.title,n.summary,n.exam,n.page,n.chapter].join(" ")}
function hits(n){const s=text(n).toLowerCase();return TERMS.filter(t=>s.includes(t.toLowerCase()))}
function render(){const q=document.getElementById("q").value.trim().toLowerCase(), ch=document.getElementById("chapter").value, box=document.getElementById("nodes"), ids=[];box.innerHTML="";
N.forEach((n,i)=>{if((!ch||n.chapter===ch)&&(!q||text(n).toLowerCase().includes(q)))ids.push(i)});

for(const i of ids){const n=N[i],b=document.createElement("button");b.className="node"+(i===selected?" active":"");b.innerHTML="<b>"+esc(n.title)+"</b><small>"+esc(n.summary)+"</small><span class='src'>"+esc(n.chapter)+" · "+esc(n.page)+"</span>";b.onclick=()=>show(i);box.appendChild(b)}
if(selected<0&&ids.length)show(ids[0]);if(selected>=0&&!ids.includes(selected)&&ids.length)show(ids[0]);}
function show(i){selected=i;const n=N[i], terms=hits(n), nums=[...text(n).matchAll(/\b\d+(?:\.\d+)?\s*(?:%|℃|°C|mmHg|次\/分|次\/min|ml|mL|L\/min|L|g\/d|kg|mg|μg|mmol\/L|小时|分钟|h|天|周|cm|mm|kPa)\b/gi)].map(m=>m[0].trim());
const candidates=N.map((x,j)=>({x,j,common:terms.filter(t=>text(x).toLowerCase().includes(t.toLowerCase()))})).filter(v=>v.j!==i&&v.common.length).sort((a,b)=>(a.x.chapter===n.chapter)-(b.x.chapter===n.chapter)||b.common.length-a.common.length).slice(0,7);
const related=candidates.length?candidates.map(v=>"<button data-j='"+v.j+"'>"+esc(v.x.title)+" <span class='muted'>· "+esc(v.common.slice(0,2).join(" / "))+"</span></button>").join(""):"<span class='muted'>暂未匹配到跨章节主题词，可用搜索继续找关联内容。</span>";

renderListOnly();}
