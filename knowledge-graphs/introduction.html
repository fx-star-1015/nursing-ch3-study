<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>护理学导论｜跨章节知识图谱</title><style>
:root{--ink:#30283b;--muted:#786e83;--purple:#7150ae;--line:#e2d6f1;--bg:#f7f3fb;--safe:#e9f6f2;--warn:#fff4dc}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 "Microsoft YaHei",sans-serif}.wrap{max-width:1120px;margin:auto;padding:20px}.hero{color:#fff;padding:25px 28px;border-radius:24px;background:linear-gradient(120deg,#553b8c,#8866bd)}.hero small{letter-spacing:.1em}.hero h1{margin:5px 0;font-size:clamp(26px,4vw,38px)}.hero p{margin:0;opacity:.93}.crumb{display:block;margin-top:10px;color:#f4edff}.layout{display:grid;grid-template-columns:1.3fr .8fr;gap:15px;margin-top:16px}.panel{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 10px 28px #4931660c}.panel h2{font-size:19px;margin:0}.muted{color:var(--muted);font-size:13px;margin:4px 0 12px}.map{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:stretch}.center{grid-column:1/-1;text-align:center;color:#fff;background:var(--purple);padding:12px;border-radius:15px;font-weight:800}.center small{display:block;color:#eee5ff;font-weight:400}.node{border:1px solid var(--line);border-radius:15px;padding:12px;background:#fff;cursor:pointer;text-align:left;color:var(--ink);font:inherit;min-height:92px}.node:hover,.node:focus{border-color:#8d6bc4;background:#f8f4fc;outline:2px solid #eee5fa}.node.safe{background:var(--safe);border-color:#c5e7dc}.node.warn{background:var(--warn);border-color:#ead9aa}.node b{display:block;font-size:15px}.node small{display:block;color:var(--muted);margin-top:3px}.badge{font-size:11px;color:#67439c;font-weight:800}.detail{position:sticky;top:14px}.pill{display:inline-block;padding:3px 9px;background:#f0e9fb;color:#67439c;border-radius:99px;font-size:12px;font-weight:800}.source{background:#f6f2fa;border-radius:11px;padding:11px;font-size:13px;color:#6f647c}.foot{font-size:12px;color:#83788e;margin-top:14px}@media(max-width:760px){.wrap{padding:11px}.hero{padding:21px}.layout{grid-template-columns:1fr}.detail{position:static}.map{gap:8px}.node{padding:10px;font-size:14px}}
</style></head><body><main class="wrap"><header class="hero"><small>ICE冰冰·高分学姐团｜跨章节主题卡</small><h1>护理学导论知识图谱</h1><p>把护理程序的阶段、阶段间反馈和易混概念串联起来。</p><a class="crumb" href="../">← 返回护理考研学习中心</a></header><div class="layout"><section class="panel"><h2>以“护理程序”为中心</h2><p class="muted">点击节点，查看它在不同章节中的位置、正误辨析和记忆线索。</p><div class="map"><div class="center">护理程序<small>中心概念 · 跨章串联</small></div><button class="node " data-i="0"><b>评估</b><small>收集并核实资料</small><span class="badge">知识分支</span></button><button class="node " data-i="1"><b>护理诊断</b><small>由资料形成护理判断</small><span class="badge">知识分支</span></button><button class="node " data-i="2"><b>计划</b><small>目标与措施</small><span class="badge">知识分支</span></button><button class="node " data-i="3"><b>实施</b><small>执行并记录</small><span class="badge">知识分支</span></button><button class="node " data-i="4"><b>评价与反馈</b><small>目标是否达到？</small><span class="badge">知识分支</span></button><button class="node warn" data-i="5"><b>误区：护理程序是直线步骤？</b><small>阶段相连且可反馈调整</small><span class="badge">⚠ 易错辨析</span></button></div><p class="foot">图卡原则：正确用途与错误说法分开标识；教材版本或题源未确认时明确提示复核。</p></section><aside class="panel detail" id="detail"><span class="pill">知识分支</span><h2>评估</h2><p>护理程序从系统收集患者健康资料开始。资料要持续补充，病情变化时重新评估，为后续判断提供依据。</p><div class="source">护理学导论｜护理程序相关章节；页码按教材版本补录</div></aside></div></main><script>const nodes=[{"title":"评估","short":"收集并核实资料","body":"护理程序从系统收集患者健康资料开始。资料要持续补充，病情变化时重新评估，为后续判断提供依据。","source":"护理学导论｜护理程序相关章节；页码按教材版本补录"},{"title":"护理诊断","short":"由资料形成护理判断","body":"护理诊断描述对个体、家庭或社区健康问题/生命过程反应的判断。它与医学诊断对象和表述层级不同，不能简单互换。","source":"护理学导论｜护理诊断相关章节；页码按教材版本补录"},{"title":"计划","short":"目标与措施","body":"根据优先问题制定可评价目标与护理措施。目标要能对应问题，措施需可执行并贴合患者条件。","source":"护理学导论｜护理程序相关章节；页码按教材版本补录"},{"title":"实施","short":"执行并记录","body":"落实计划中的护理措施，同时观察患者反应并记录。执行中出现新情况时，信息反馈到评估和计划。","source":"护理学导论｜护理程序相关章节；页码按教材版本补录"},{"title":"评价与反馈","short":"目标是否达到？","body":"评价患者对护理措施的反应及目标达成情况。未达标时需回看评估、诊断、计划与实施，而不是机械重复原方案。","source":"护理学导论｜护理程序相关章节；页码按教材版本补录"},{"title":"误区：护理程序是直线步骤？","short":"阶段相连且可反馈调整","body":"护理程序有基本顺序，但不是完成一步就永不回头的直线流程；新资料与效果评价会推动重新评估和修订计划。","source":"概念关系整理；请对照指定教材与真题","kind":"warn"}];document.querySelectorAll('.node').forEach(b=>b.onclick=()=>{const n=nodes[+b.dataset.i];document.querySelector('#detail').innerHTML='<span class="pill">'+(n.kind==='warn'?'易错辨析':n.kind==='safe'?'安全边界':'知识分支')+'</span><h2>'+n.title+'</h2><p>'+n.body+'</p><div class="source">'+n.source+'</div>'});</script></body></html>
