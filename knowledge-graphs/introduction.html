const N=[{"book":"护理学导论","title":"护理学的发展及基本概念","summary":"从护理发展阶段进入人、环境、健康、护理四个基本概念，并理解整体护理与护士角色。","exam":"先定位概念，再核对对象、阶段和适用条件。","page":"教材P1—24","chapter":"护理学的发展及基本概念｜护理学导论第4版","href":"introduction/ch01.html"},{"book":"护理学导论","title":"护理学的四个基本概念","summary":"人、环境、健康与护理彼此影响；护理判断不能只盯住疾病。","exam":"病例中除了疾病，还给出了哪些人与环境的信息？ 从患者、环境、健康状态和护理行动四栏重述病例。","page":"教材P11—14","chapter":"护理学的发展及基本概念｜护理学导论第4版","href":"introduction/ch01.html"},{"book":"护理学导论","title":"整体护理","summary":"同时关注生理、心理、社会、文化与精神反应，并把照护贯穿全过程。","exam":"患者最迫切的生理问题和最在意的生活问题分别是什么？ 在安全措施后补写一条心理或社会支持措施。","page":"教材P8—10","chapter":"护理学的发展及基本概念｜护理学导论第4版","href":"introduction/ch01.html"},{"book":"护理学导论","title":"护士的专业角色","summary":"护士既是护理者，也是协作者、教育者、代言者、管理者和研究者。","exam":"此刻护士主要承担哪一种角色，为什么？ 把一项护理行动改写成‘角色＋对象＋目标’。","page":"教材P18—19","chapter":"护理学的发展及基本概念｜护理学导论第4版","href":"introduction/ch01.html"},{"book":"护理学导论","title":"护理发展阶段","summary":"护理从以疾病为中心、以患者为中心发展到以人的健康为中心，服务对象和护理范围逐步扩展。","exam":"题干给出时代特征时，判断护理关注的是疾病、患者还是人的整体健康。","page":"教材P1—24","chapter":"护理学的发展及基本概念｜护理学导论第4版","href":"introduction/ch01.html"},{"book":"护理学导论","title":"专业与职业","summary":"护理专业以系统知识、专业教育、服务伦理、自律和社会责任为基础。","exam":"有一项技能不等于形成专业，要同时看知识体系和责任边界。","page":"教材P1—24","chapter":"护理学的发展及基本概念｜护理学导论第4版","href":"introduction/ch01.html"},{"book":"护理学导论","title":"健康与疾病","summary":"健康与疾病处在连续动态过程，患者角色和三级预防决定不同阶段的护理重点。","exam":"先定位概念，再核对对象、阶段和适用条件。","page":"教材P25—40","chapter":"健康与疾病｜护理学导论第4版","href":"introduction/ch02.html"},{"book":"护理学导论","title":"健康促进与疾病预防","summary":"护理不仅处理疾病，还通过一级、二级、三级预防减少发生、早期发现和降低残障。","exam":"本章措施分别属于哪一级预防？ 为危险人群、早期患者和康复患者各写一项行动。","page":"教材P35—36","chapter":"健康与疾病｜护理学导论第4版","href":"introduction/ch02.html"},{"book":"护理学导论","title":"健康—疾病连续体","summary":"健康和疾病不是互斥静止状态，个体会随环境、行为和支持在连续体上移动。","exam":"同一诊断者的功能和体验可能不同，护理目标需个体化。","page":"教材P25—40","chapter":"健康与疾病｜护理学导论第4版","href":"introduction/ch02.html"},{"book":"护理学导论","title":"三级预防","summary":"一级防发生，二级早发现早处理，三级减少残障并促进康复。","exam":"先判断措施发生在发病前、症状出现后还是稳定康复期。","page":"教材P25—40","chapter":"健康与疾病｜护理学导论第4版","href":"introduction/ch02.html"},{"book":"护理学导论","title":"人的基本需要","summary":"需要具有层次、相互影响并随病情变化；护理优先级先守生命与安全，再回应更高层次需要。","exam":"先定位概念，再核对对象、阶段和适用条件。","page":"教材P41—56","chapter":"人的基本需要｜护理学导论第4版","href":"introduction/ch03.html"},{"book":"护理学导论","title":"五个需要层次","summary":"由低到高依次为生理、安全、爱与归属、尊重和自我实现；层次描述需要类型，不是固定不变的护理顺序。","exam":"题干给出饥渴、呼吸、疼痛、保护、陪伴、被认可或发挥潜能时，要准确归入相应层次。","page":"教材P41—56","chapter":"人的基本需要｜护理学导论第4版","href":"introduction/ch03.html"},{"book":"护理学导论","title":"层次之间的关系","summary":"各层次相互联系、可以重叠；较低层次通常优先且是较高层次发展的基础，但高层需要也会影响低层需要的表达。","exam":"判断‘一定、只能、完全满足后才出现’等绝对化表述时要谨慎。","page":"教材P41—56","chapter":"人的基本需要｜护理学导论第4版","href":"introduction/ch03.html"},{"book":"护理学导论","title":"护理优先顺序","summary":"先处理直接威胁生命和安全的问题，再结合患者最迫切的主诉、意愿、可处理性和病情变化动态排序。","exam":"马斯洛提供排序框架，但不能替代ABC、风险程度和个体评估。","page":"教材P41—56","chapter":"人的基本需要｜护理学导论第4版","href":"introduction/ch03.html"},{"book":"护理学导论","title":"需要的个体差异","summary":"同一种行为可能满足不同需要，同一种需要也可用不同方式满足；年龄、文化、疾病和支持资源都会改变表现。","exam":"不能只凭行为贴标签，要追问患者赋予该行为的意义。","page":"教材P41—56","chapter":"人的基本需要｜护理学导论第4版","href":"introduction/ch03.html"},{"book":"护理学导论","title":"未满足需要的识别","summary":"从主诉、行为、情绪、生理指标、家庭关系和生活目标中寻找未满足需要，并区分患者已经表达与尚未表达的需要。","exam":"案例题要逐层写出证据，不能只抄五个层次名称。","page":"教材P41—56","chapter":"人的基本需要｜护理学导论第4版","href":"introduction/ch03.html"},{"book":"护理学导论","title":"满足需要中的护士作用","summary":"护士通过评估、预测、协调资源、创造安全环境、支持选择和评价效果，帮助患者以可接受的方式满足需要。","exam":"答案要写出具体行动及评价指标，不能只写‘给予关心与支持’。","page":"教材P41—56","chapter":"人的基本需要｜护理学导论第4版","href":"introduction/ch03.html"},{"book":"护理学导论","title":"文化与护理","summary":"文化影响健康信念、就医方式和家庭决策；评估差异后才能提供安全且可接受的照护。","exam":"先定位概念，再核对对象、阶段和适用条件。","page":"教材P57—78","chapter":"文化与护理｜护理学导论第4版","href":"introduction/ch04.html"},{"book":"护理学导论","title":"文化与照护","summary":"健康信念、家庭结构、语言和习俗会影响患者对疾病与治疗的理解。","exam":"患者的选择是否受到文化或家庭决策方式影响？ 先询问意义和偏好，再共同寻找安全可行的方案。","page":"教材P65—72","chapter":"文化与护理｜护理学导论第4版","href":"introduction/ch04.html"},{"book":"护理学导论","title":"文化评估","summary":"询问语言、信仰、饮食、家庭决策和治疗禁忌，避免用群体印象替代个人评估。","exam":"先问清意义和偏好，再共同选择安全方案。","page":"教材P57—78","chapter":"文化与护理｜护理学导论第4版","href":"introduction/ch04.html"},{"book":"护理学导论","title":"文化照护策略","summary":"可采用文化保留、协商调整或在有害时帮助重新建构。","exam":"尊重文化不等于接受会造成明确伤害的做法。","page":"教材P57—78","chapter":"文化与护理｜护理学导论第4版","href":"introduction/ch04.html"},{"book":"护理学导论","title":"护患关系与人际交流","summary":"专业护患关系有目标、有阶段、有边界；治疗性沟通用于获得真实资料并促进患者参与。","exam":"先定位概念，再核对对象、阶段和适用条件。","page":"教材P79—95","chapter":"护患关系与人际交流｜护理学导论第4版","href":"introduction/ch05.html"},{"book":"护理学导论","title":"护患关系","summary":"专业关系以患者需要为中心，依靠信任、目标、边界和合作维持。","exam":"怎样既表达关心，又保持清晰的专业边界？ 把命令式表达改成说明目的并邀请参与的表达。","page":"教材P82—84","chapter":"护患关系与人际交流｜护理学导论第4版","href":"introduction/ch05.html"},{"book":"护理学导论","title":"治疗性沟通","summary":"倾听、开放式提问、澄清、复述和沉默帮助患者表达；否定与空泛保证会关闭沟通。","exam":"患者话语背后真正担心的是什么？ 先复述感受，再问一个具体开放问题。","page":"教材P90—93","chapter":"护患关系与人际交流｜护理学导论第4版","href":"introduction/ch05.html"},{"book":"护理学导论","title":"佩普劳人际关系理论","summary":"护患关系经历认识、确认、开拓和解决阶段，关系本身具有治疗作用。","exam":"目前护患关系处在哪一阶段，护士的任务是什么？ 写一句既确认感受又推进问题解决的话。","page":"教材P163—164","chapter":"护患关系与人际交流｜护理学导论第4版","href":"introduction/ch05.html"},{"book":"护理学导论","title":"关系阶段","summary":"认识期建立信任，工作期共同解决问题，结束期评价目标并妥善终止。","exam":"根据阶段选择任务；结束关系不等于突然中断。","page":"教材P79—95","chapter":"护患关系与人际交流｜护理学导论第4版","href":"introduction/ch05.html"},{"book":"护理学导论","title":"专业边界","summary":"关系以患者需要为中心，护士不借关系满足个人需要或形成依赖。","exam":"礼物、私人联系和秘密等题目要判断是否越界。","page":"教材P79—95","chapter":"护患关系与人际交流｜护理学导论第4版","href":"introduction/ch05.html"},{"book":"护理学导论","title":"生命历程中的身心发展","summary":"成长与发展贯穿生命全程；年龄、发展任务和疾病造成的中断共同影响护理需要。","exam":"先定位概念，再核对对象、阶段和适用条件。","page":"教材P96—112","chapter":"生命历程中的身心发展｜护理学导论第4版","href":"introduction/ch06.html"},{"book":"护理学导论","title":"成长与发展","summary":"不同生命阶段有不同的发展任务；疾病会打断角色、独立性与未来计划。","exam":"这一健康问题打断了患者哪个阶段的发展任务？ 把年龄、家庭角色和学习或工作任务加入护理评估。","page":"教材P96—111","chapter":"生命历程中的身心发展｜护理学导论第4版","href":"introduction/ch06.html"},{"book":"护理学导论","title":"发展规律","summary":"发展有顺序、连续又有个体差异，各领域速度不完全同步。","exam":"年龄只是线索，还要评估实际能力。","page":"教材P96—112","chapter":"生命历程中的身心发展｜护理学导论第4版","href":"introduction/ch06.html"},{"book":"护理学导论","title":"发展任务","summary":"疾病可能打断独立、亲密关系、养育、工作或老年整合等任务。","exam":"护理要帮助恢复或重建角色。","page":"教材P96—112","chapter":"生命历程中的身心发展｜护理学导论第4版","href":"introduction/ch06.html"},{"book":"护理学导论","title":"应激学说及其在护理中的应用","summary":"从压力源、反应、应对资源和适应结果判断患者需要的支持，识别无效应对和危机。","exam":"先定位概念，再核对对象、阶段和适用条件。","page":"教材P113—132","chapter":"应激学说及其在护理中的应用｜护理学导论第4版","href":"introduction/ch07.html"},{"book":"护理学导论","title":"压力与适应","summary":"压力反应受事件、个人资源和支持系统影响；护理帮助患者形成有效适应。","exam":"患者面对的压力源是什么，现有应对有效吗？ 区分问题应对、情绪应对和需要转介的信号。","page":"教材P113—123","chapter":"应激学说及其在护理中的应用｜护理学导论第4版","href":"introduction/ch07.html"},{"book":"护理学导论","title":"压力反应","summary":"压力可表现于生理、情绪、认知与行为，长期持续会消耗适应资源。","exam":"失眠、心悸、回避和注意力下降要综合判断。","page":"教材P113—132","chapter":"应激学说及其在护理中的应用｜护理学导论第4版","href":"introduction/ch07.html"},{"book":"护理学导论","title":"应对与资源","summary":"问题指向型应对处理压力源，情绪指向型应对调节感受；社会支持会改变结果。","exam":"先判断应对是否有效，再决定教育、支持或转介。","page":"教材P113—132","chapter":"应激学说及其在护理中的应用｜护理学导论第4版","href":"introduction/ch07.html"},{"book":"护理学导论","title":"护理程序","summary":"评估、护理诊断、计划、实施与评价构成动态循环；新资料出现时必须重新判断。","exam":"先定位概念，再核对对象、阶段和适用条件。","page":"教材P133—160","chapter":"护理程序｜护理学导论第4版","href":"introduction/ch08.html"},{"book":"护理学导论","title":"护理诊断","summary":"护理诊断描述患者对健康问题的反应并由评估资料支持；医疗诊断命名疾病。","exam":"区分病名、症状、护理诊断和合作性问题。","page":"教材P133—160","chapter":"护理程序｜护理学导论第4版","href":"introduction/ch08.html"},{"book":"护理学导论","title":"计划与评价","summary":"目标应以患者为中心、具体可测且有时限；评价后决定终止、继续或修订。","exam":"评价必须对照既定指标。","page":"教材P133—160","chapter":"护理程序｜护理学导论第4版","href":"introduction/ch08.html"},{"book":"护理学导论","title":"护理理论","summary":"理论不是口号，要从题干线索判断自理缺陷、适应层面、压力源或护患关系阶段。","exam":"先定位概念，再核对对象、阶段和适用条件。","page":"教材P161—181","chapter":"护理理论｜护理学导论第4版","href":"introduction/ch09.html"},{"book":"护理学导论","title":"一般系统理论","summary":"人体、家庭和医疗环境都是开放系统；一个环节变化会影响其他环节。","exam":"一个症状或治疗变化会怎样传导到全身和家庭？ 画出输入、过程、输出与反馈，并标出护理可干预处。","page":"教材P161—162","chapter":"护理理论｜护理学导论第4版","href":"introduction/ch09.html"},{"book":"护理学导论","title":"奥瑞姆自理理论","summary":"当自理能力不足以满足自理需要时产生自理缺陷，护理系统应随能力变化而调整。","exam":"患者能自己做什么、需要部分帮助什么、必须完全代偿什么？ 用完全代偿、部分代偿、支持教育三栏安排措施。","page":"教材P164—168","chapter":"护理理论｜护理学导论第4版","href":"introduction/ch09.html"},{"book":"护理学导论","title":"罗伊适应模式","summary":"人通过生理功能、自我概念、角色功能和相互依赖四个方面适应刺激。","exam":"疾病在哪些适应层面造成问题？ 为四个适应层面各写一项观察或支持。","page":"教材P168—172","chapter":"护理理论｜护理学导论第4版","href":"introduction/ch09.html"},{"book":"护理学导论","title":"纽曼系统模式","summary":"压力源可来自个体内、人际间和个体外，护理通过三级预防保护系统稳定。","exam":"主要压力源来自哪里，当前属于哪一级预防？ 分别写出发病前、症状出现后和康复期干预。","page":"教材P173—176","chapter":"护理理论｜护理学导论第4版","href":"introduction/ch09.html"},{"book":"护理学导论","title":"佩普劳人际关系理论","summary":"护患关系经历认识、确认、开拓和解决阶段，关系本身具有治疗作用。","exam":"目前护患关系处在哪一阶段，护士的任务是什么？ 写一句既确认感受又推进问题解决的话。","page":"教材P163—164","chapter":"护理理论｜护理学导论第4版","href":"introduction/ch09.html"},{"book":"护理学导论","title":"理论选择","summary":"先识别题干关心的是自理能力、适应层面、压力源还是关系阶段，再调用相应理论。","exam":"不要把所有理论都写一遍。","page":"教材P161—181","chapter":"护理理论｜护理学导论第4版","href":"introduction/ch09.html"},{"book":"护理学导论","title":"循证护理与临床护理决策","summary":"把最佳证据、临床经验、患者价值与具体情境整合，形成可评价、可修正的护理决策。","exam":"先定位概念，再核对对象、阶段和适用条件。","page":"教材P182—197","chapter":"循证护理与临床护理决策｜护理学导论第4版","href":"introduction/ch10.html"},{"book":"护理学导论","title":"评判性思维与临床决策","summary":"从线索中识别模式，验证假设，比较风险，并根据反馈修正判断。","exam":"哪条线索最能改变优先级，哪些信息仍需验证？ 写出首选判断、支持证据和一个替代解释。","page":"教材P182—190","chapter":"循证护理与临床护理决策｜护理学导论第4版","href":"introduction/ch10.html"},{"book":"护理学导论","title":"循证护理","summary":"最佳证据、临床经验与患者价值共同形成护理决策，并在实施后评价效果。","exam":"这项措施的证据、适用对象和患者偏好分别是什么？ 用问题、证据、应用、评价四步复盘一项措施。","page":"教材P191—195","chapter":"循证护理与临床护理决策｜护理学导论第4版","href":"introduction/ch10.html"},{"book":"护理学导论","title":"PICO问题","summary":"明确患者或问题、干预、对照和结局，才能检索与判断证据。","exam":"宽泛问题先拆成可回答的临床问题。","page":"教材P182—197","chapter":"循证护理与临床护理决策｜护理学导论第4版","href":"introduction/ch10.html"},{"book":"护理学导论","title":"证据应用","summary":"证据需结合对象、资源、风险和患者偏好，并在实施后评价。","exam":"不能把指南结论脱离适用条件照搬。","page":"教材P182—197","chapter":"循证护理与临床护理决策｜护理学导论第4版","href":"introduction/ch10.html"},{"book":"护理学导论","title":"健康教育","summary":"从学习需要和能力评估开始，选择方法并用复述或演示验证患者是否真正会做。","exam":"先定位概念，再核对对象、阶段和适用条件。","page":"教材P198—217","chapter":"健康教育｜护理学导论第4版","href":"introduction/ch11.html"},{"book":"护理学导论","title":"健康促进与疾病预防","summary":"护理不仅处理疾病，还通过一级、二级、三级预防减少发生、早期发现和降低残障。","exam":"本章措施分别属于哪一级预防？ 为危险人群、早期患者和康复患者各写一项行动。","page":"教材P35—36","chapter":"健康教育｜护理学导论第4版","href":"introduction/ch11.html"},{"book":"护理学导论","title":"团队合作与连续照护","summary":"跨专业合作和不同场所之间的信息衔接，能减少重复、遗漏与照护中断。","exam":"谁还需要参与，患者离开当前场所后由谁接续？ 写出转介对象、交接重点、复诊节点和危险信号。","page":"教材P198—202","chapter":"健康教育｜护理学导论第4版","href":"introduction/ch11.html"},{"book":"护理学导论","title":"学习目标","summary":"目标描述患者学后能说出、演示或完成的行为，不写护士‘已宣教’。","exam":"认知、情感和动作技能选择不同方法。","page":"教材P198—217","chapter":"健康教育｜护理学导论第4版","href":"introduction/ch11.html"},{"book":"护理学导论","title":"回示法","summary":"请患者用自己的话复述或演示，以检验教育效果并发现遗漏。","exam":"点头不代表已经学会。","page":"教材P198—217","chapter":"健康教育｜护理学导论第4版","href":"introduction/ch11.html"},{"book":"护理学导论","title":"临终关怀","summary":"控制症状、尊重选择、维护尊严并支持家属；悲伤与丧失不能被催促或机械分期。","exam":"先定位概念，再核对对象、阶段和适用条件。","page":"教材P218—240","chapter":"临终关怀｜护理学导论第4版","href":"introduction/ch12.html"},{"book":"护理学导论","title":"丧失与悲伤","summary":"丧失可能涉及功能、角色、身体形象、关系和未来计划；悲伤反应没有唯一顺序。","exam":"患者正在失去什么，他如何表达这种丧失？ 允许表达，评估支持系统，避免催促患者‘想开点’。","page":"教材P223—230","chapter":"临终关怀｜护理学导论第4版","href":"introduction/ch12.html"},{"book":"护理学导论","title":"临终关怀与生命质量","summary":"当治愈不再是唯一目标，护理仍可通过症状控制、沟通、尊严和家庭支持改善生命质量。","exam":"患者当前最重视的目标是什么？ 围绕舒适、知情选择、家属支持和尊严列出计划。","page":"教材P226—227","chapter":"临终关怀｜护理学导论第4版","href":"introduction/ch12.html"},{"book":"护理学导论","title":"身体意象与自我概念","summary":"疾病、手术和功能改变会影响患者对身体、性别角色、能力与自我价值的认识；护理需尊重这种真实的丧失体验。","exam":"患者担心的只是外观变化，还是亲密关系、角色与未来生活也受到影响？ 先允许患者表达，再评估其信息需要、支持系统和可接受的康复目标，避免用‘想开点’代替支持。","page":"教材P169—171","chapter":"临终关怀｜护理学导论第4版","href":"introduction/ch12.html"},{"book":"护理学导论","title":"临终照护目标","summary":"当治愈受限时，护理仍能通过症状控制、沟通、选择和陪伴改善生命质量。","exam":"先问患者最重视什么。","page":"教材P218—240","chapter":"临终关怀｜护理学导论第4版","href":"introduction/ch12.html"},{"book":"护理学导论","title":"悲伤支持","summary":"允许个体按自己的方式表达，不强迫固定顺序，也不用空泛安慰关闭沟通。","exam":"识别严重功能受损和自伤等转介信号。","page":"教材P218—240","chapter":"临终关怀｜护理学导论第4版","href":"introduction/ch12.html"},{"book":"护理学导论","title":"护理伦理","summary":"以自主、有利、不伤害、公正、诚实和忠诚分析冲突，不能只背原则名称。","exam":"先定位概念，再核对对象、阶段和适用条件。","page":"教材P241—252","chapter":"护理伦理｜护理学导论第4版","href":"introduction/ch13.html"},{"book":"护理学导论","title":"伦理分析步骤","summary":"先澄清事实和决策能力，再列相关者、冲突原则、方案与后果。","exam":"不能看到拒绝就只写尊重自主。","page":"教材P241—252","chapter":"护理伦理｜护理学导论第4版","href":"introduction/ch13.html"},{"book":"护理学导论","title":"知情与保密","summary":"尊重隐私和自主，在法律规定或明确严重危险时按程序处理例外。","exam":"家属索取信息时先确认患者授权。","page":"教材P241—252","chapter":"护理伦理｜护理学导论第4版","href":"introduction/ch13.html"},{"book":"护理学导论","title":"护理专业中的法律问题","summary":"依法执业、知情同意、隐私、客观记录和事件报告共同保护患者与护士。","exam":"先定位概念，再核对对象、阶段和适用条件。","page":"教材P253—330","chapter":"护理专业中的法律问题｜护理学导论第4版","href":"introduction/ch14.html"},{"book":"护理学导论","title":"法律、知情与患者安全","summary":"依法执业、知情同意、隐私保护、规范记录和风险报告共同维护患者与护士安全。","exam":"哪些信息必须核对、记录、报告或取得同意？ 用事实、时间、行动和反馈四要素书写记录。","page":"教材P253—261","chapter":"护理专业中的法律问题｜护理学导论第4版","href":"introduction/ch14.html"},{"book":"护理学导论","title":"护理记录","summary":"记录事实、时间、行动和患者反应，及时、客观、可追溯，不涂改、不代签、不补造。","exam":"异常要同时处理、报告并记录反馈。","page":"教材P253—330","chapter":"护理专业中的法律问题｜护理学导论第4版","href":"introduction/ch14.html"},{"book":"护理学导论","title":"侵权与过失","summary":"是否违反注意义务、是否造成损害及其因果关系，是判断过失的重要线索。","exam":"先保障患者安全，再保留事实。","page":"教材P253—330","chapter":"护理专业中的法律问题｜护理学导论第4版","href":"introduction/ch14.html"},{"book":"护理学导论","title":"护理职业生涯规划","summary":"理解护士角色、能力阶段和职业规划，把目标落实为学习、实践、反思和持续改进。","exam":"先定位概念，再核对对象、阶段和适用条件。","page":"教材P331—377","chapter":"护理职业生涯规划｜护理学导论第4版","href":"introduction/ch15.html"},{"book":"护理学导论","title":"护士的专业角色","summary":"护士既是护理者，也是协作者、教育者、代言者、管理者和研究者。","exam":"此刻护士主要承担哪一种角色，为什么？ 把一项护理行动改写成‘角色＋对象＋目标’。","page":"教材P18—19","chapter":"护理职业生涯规划｜护理学导论第4版","href":"introduction/ch15.html"},{"book":"护理学导论","title":"团队合作与连续照护","summary":"跨专业合作和不同场所之间的信息衔接，能减少重复、遗漏与照护中断。","exam":"谁还需要参与，患者离开当前场所后由谁接续？ 写出转介对象、交接重点、复诊节点和危险信号。","page":"教材P198—202","chapter":"护理职业生涯规划｜护理学导论第4版","href":"introduction/ch15.html"},{"book":"护理学导论","title":"能力发展","summary":"护士由新手向熟练发展，需要情境经验、反思反馈和持续学习。","exam":"只会照搬规则而不能个体化，提示基础阶段。","page":"教材P331—377","chapter":"护理职业生涯规划｜护理学导论第4版","href":"introduction/ch15.html"},{"book":"护理学导论","title":"职业规划","summary":"用自我评估、环境分析、目标、行动计划和定期评价形成闭环。","exam":"目标要拆成时间节点和可验证成果。","page":"教材P331—377","chapter":"护理职业生涯规划｜护理学导论第4版","href":"introduction/ch15.html"}], TERMS=["乙醇","酒精","温度","热疗","冷疗","氧疗","氧气","吸氧","呼吸","通气","哮喘","肺炎","肺心病","心衰","心力衰竭","心脏","循环","血压","心率","脉搏","休克","输液","静脉","注射","药物","用药","输血","血糖","胰岛素","血钾","血钠","电解质","酸碱","水肿","肾功能","尿量","导尿","排尿","感染","消毒","灭菌","无菌","隔离","手卫生","疼痛","体位","卧位","跌倒","压疮","营养","饮食","吞咽","手术","麻醉","术前","术后","切口","引流","出血","创伤","骨折","颅压","意识","评估","护理程序","沟通","伦理","隐私","知情同意","分级护理","护理诊断","护理目标","健康教育","生命体征","体温","发热","咳嗽","痰","氧饱和度","SpO₂","钠","钾","血气","胸痛","心电图","心律失常","抗凝","肿瘤","肝硬化","腹水","胰腺炎","消化道出血","便秘","腹泻","皮肤","口腔","清洁","安全"], CHAPTERS=["护理学的发展及基本概念｜护理学导论第4版","健康与疾病｜护理学导论第4版","人的基本需要｜护理学导论第4版","文化与护理｜护理学导论第4版","护患关系与人际交流｜护理学导论第4版","生命历程中的身心发展｜护理学导论第4版","应激学说及其在护理中的应用｜护理学导论第4版","护理程序｜护理学导论第4版","护理理论｜护理学导论第4版","循证护理与临床护理决策｜护理学导论第4版","健康教育｜护理学导论第4版","临终关怀｜护理学导论第4版","护理伦理｜护理学导论第4版","护理专业中的法律问题｜护理学导论第4版","护理职业生涯规划｜护理学导论第4版"];

N.forEach((n,i)=>{if((!ch||n.chapter===ch)&&(!q||text(n).toLowerCase().includes(q)))ids.push(i)});
document.getElementById("count").textContent=ids.length+" / "+N.length+" 个知识点";
for(const i of ids){const n=N[i],b=document.createElement("button");b.className="node"+(i===selected?" active":"");b.innerHTML="<b>"+esc(n.title)+"</b><small>"+esc(n.summary)+"</small><span class='src'>"+esc(n.chapter)+" · "+esc(n.page)+"</span>";b.onclick=()=>show(i);box.appendChild(b)}
if(selected<0&&ids.length)show(ids[0]);if(selected>=0&&!ids.includes(selected)&&ids.length)show(ids[0]);}
function show(i){selected=i;const n=N[i], terms=hits(n), nums=[...text(n).matchAll(/\b\d+(?:\.\d+)?\s*(?:%|℃|°C|mmHg|次\/分|次\/min|ml|mL|L\/min|L|g\/d|kg|mg|μg|mmol\/L|小时|分钟|h|天|周|cm|mm|kPa)\b/gi)].map(m=>m[0].trim());
const candidates=N.map((x,j)=>({x,j,common:terms.filter(t=>text(x).toLowerCase().includes(t.toLowerCase()))})).filter(v=>v.j!==i&&v.common.length).sort((a,b)=>(a.x.chapter===n.chapter)-(b.x.chapter===n.chapter)||b.common.length-a.common.length).slice(0,7);
const related=candidates.length?candidates.map(v=>"<button data-j='"+v.j+"'>"+esc(v.x.title)+" <span class='muted'>· "+esc(v.common.slice(0,2).join(" / "))+"</span></button>").join(""):"<span class='muted'>暂未匹配到跨章节主题词，可用搜索继续找关联内容。</span>";
document.getElementById("detail").innerHTML="<span class='pill'>"+esc(n.book)+" · "+esc(n.chapter)+"</span><h2>"+esc(n.title)+"</h2><p class='summary'>"+esc(n.summary)+"</p>"+(n.exam?"<div class='exam'><b>考法线索：</b>"+esc(n.exam)+"</div>":"")+
"<div class='meta'><div><b>关键参数 / 条件</b><span>"+(nums.length?esc([...new Set(nums)].join("、")):"见归纳中的对象、条件与单位")+"</span></div><div><b>使用情境与安全边界</b><span>"+esc(n.exam||n.summary)+"</span></div></div><p class='source'>教材依据： "+esc(n.page)+"</p><b>跨章节关联</b><div class='related' style='margin-top:7px'>"+related+"</div><div class='tags' style='margin-top:9px'>"+terms.slice(0,8).map(t=>"<span class='tag'>"+esc(t)+"</span>").join("")+"</div><a class='chapter-link' href='../"+esc(n.href)+"'>回原章节继续学习与刷题 →</a>";
document.querySelectorAll(".related button[data-j]").forEach(b=>b.onclick=()=>{show(Number(b.dataset.j));document.getElementById("q").value="";document.getElementById("chapter").value="";render()});
renderListOnly();}
function renderListOnly(){document.querySelectorAll(".node").forEach(b=>b.classList.remove("active"));const cards=[...document.querySelectorAll(".node")];const n=N[selected];const active=cards.find(b=>b.querySelector("b")?.textContent===n?.title);if(active)active.classList.add("active");}
document.getElementById("q").oninput=render;document.getElementById("chapter").onchange=render;render();
</script></body></html>
