</style></head><body><main class="wrap"><header class="hero"><small>ICE冰冰·高分学姐团｜全书关系图</small><h1>护理学导论知识点关系图</h1><p>以核心理论和概念为中心，连接职业角色、护理实践、伦理与健康情境。</p></header><nav class="course-nav"><a href="fundamentals.html" class="">基础护理</a><a href="introduction.html" class="on">护理导论</a><a href="medical.html" class="">内科护理</a><a href="surgical.html" class="">外科护理</a></nav><div class="tabs" id="quick"></div><div class="map-select"><input id="searchMap" placeholder="搜中心概念、章节或参数"><select id="mapPick" aria-label="选择知识图谱"></select></div><section class="layout"><div class="panel"><h2 id="mapTitle"></h2><p class="sub">点选分支查看数值、用途、条件、安全边界和教材依据。</p><svg class="map" id="graph" viewBox="0 0 720 468" role="img" aria-label="护理学导论中心概念关系图"></svg><div class="pager"><button id="prev">‹ 上一组</button><span id="pageText"></span><button id="next">下一组 ›</button></div><div class="legend"><span><i class="dot"></i>中心概念</span><span><i class="dot2"></i>关键参数 / 关联考点</span><span><i class="dot3"></i>安全边界</span><span><i class="dot4"></i>跨章节联系</span></div></div><aside class="panel detail" id="detail"></aside></section><p class="footer">数值节点保留页面整理中的原值、条件和教材页码；不凭空补数。跨章节联系按共同主题词推荐，复习时可打开来源章节核对。</p></main><script>
const MAPS=[{"id":"introduction/ch01.html","label":"护理学的发展及基本概念","title":"以“护理学的发展及基本概念”为中心｜用途、数值与跨章联系","center":"护理学的发展及基本概念","chapter":"护理学的发展及基本概念｜护理学导论第4版","href":"introduction/ch01.html","items":[{"type":"concept","label":"护理学的发展及基本概念","tag":"使用情境 / 考法","detail":"从护理发展阶段进入人、环境、健康、护理四个基本概念，并理解整体护理与护士角色。 考法线索：先定位概念，再核对对象、阶段和适用条件。","ref":"教材P1—24","chapter":"护理学的发展及基本概念｜护理学导论第4版","href":"introduction/ch01.html","kind":"normal","relation":""},{"type":"concept","label":"护理学的四个基本概念","tag":"使用情境 / 考法","detail":"人、环境、健康与护理彼此影响；护理判断不能只盯住疾病。 考法线索：病例中除了疾病，还给出了哪些人与环境的信息？ 从患者、环境、健康状态和护理行动四栏重述病例。","ref":"教材P11—14","chapter":"护理学的发展及基本概念｜护理学导论第4版","href":"introduction/ch01.html","kind":"safe","relation":""},{"type":"concept","label":"整体护理","tag":"使用情境 / 考法","detail":"同时关注生理、心理、社会、文化与精神反应，并把照护贯穿全过程。 考法线索：患者最迫切的生理问题和最在意的生活问题分别是什么？ 在安全措施后补写一条心理或社会支持措施。","ref":"教材P8—10","chapter":"护理学的发展及基本概念｜护理学导论第4版","href":"introduction/ch01.html","kind":"normal","relation":""},{"type":"concept","label":"护士的专业角色","tag":"使用情境 / 考法","detail":"护士既是护理者，也是协作者、教育者、代言者、管理者和研究者。 考法线索：此刻护士主要承担哪一种角色，为什么？ 把一项护理行动改写成‘角色＋对象＋目标’。","ref":"教材P18—19","chapter":"护理学的发展及基本概念｜护理学导论第4版","href":"introduction/ch01.html","kind":"normal","relation":""},{"type":"concept","label":"护理发展阶段","tag":"使用情境 / 考法","detail":"护理从以疾病为中心、以患者为中心发展到以人的健康为中心，服务对象和护理范围逐步扩展。 考法线索：题干给出时代特征时，判断护理关注的是疾病、患者还是人的整体健康。","ref":"教材P1—24","chapter":"护理学的发展及基本概念｜护理学导论第4版","href":"introduction/ch01.html","kind":"normal","relation":""},{"type":"concept","label":"专业与职业","tag":"使用情境 / 考法","detail":"护理专业以系统知识、专业教育、服务伦理、自律和社会责任为基础。 考法线索：有一项技能不等于形成专业，要同时看知识体系和责任边界。","ref":"教材P1—24","chapter":"护理学的发展及基本概念｜护理学导论第4版","href":"introduction/ch01.html","kind":"normal","relation":""},{"type":"cross","label":"人的基本需要","tag":"跨章节 · 人的基本需要","detail":"需要具有层次、相互影响并随病情变化；护理优先级先守生命与安全，再回应更高层次需要。 考法线索：先定位概念，再核对对象、阶段和适用条件。","ref":"教材P41—56","chapter":"人的基本需要｜护理学导论第4版","href":"introduction/ch03.html","kind":"cross","relation":"安全"},{"type":"cross","label":"五个需要层次","tag":"跨章节 · 人的基本需要","detail":"由低到高依次为生理、安全、爱与归属、尊重和自我实现；层次描述需要类型，不是固定不变的护理顺序。 考法线索：题干给出饥渴、呼吸、疼痛、保护、陪伴、被认可或发挥潜能时，要准确归入相应层次。","ref":"教材P41—56","chapter":"人的基本需要｜护理学导论第4版","href":"introduction/ch03.html","kind":"cross","relation":"安全"},{"type":"cross","label":"护理优先顺序","tag":"跨章节 · 人的基本需要","detail":"先处理直接威胁生命和安全的问题，再结合患者最迫切的主诉、意愿、可处理性和病情变化动态排序。 考法线索：马斯洛提供排序框架，但不能替代ABC、风险程度和个体评估。","ref":"教材P41—56","chapter":"人的基本需要｜护理学导论第4版","href":"introduction/ch03.html","kind":"cross","relation":"安全"}]},{"id":"introduction/ch02.html","label":"健康与疾病","title":"以“健康与疾病”为中心｜用途、数值与跨章联系","center":"健康与疾病","chapter":"健康与疾病｜护理学导论第4版","href":"introduction/ch02.html","items":[{"type":"concept","label":"健康与疾病","tag":"使用情境 / 考法","detail":"健康与疾病处在连续动态过程，患者角色和三级预防决定不同阶段的护理重点。 考法线索：先定位概念，再核对对象、阶段和适用条件。","ref":"教材P25—40","chapter":"健康与疾病｜护理学导论第4版","href":"introduction/ch02.html","kind":"normal","relation":""},{"type":"concept","label":"健康促进与疾病预防","tag":"使用情境 / 考法","detail":"护理不仅处理疾病，还通过一级、二级、三级预防减少发生、早期发现和降低残障。 考法线索：本章措施分别属于哪一级预防？ 为危险人群、早期患者和康复患者各写一项行动。","ref":"教材P35—36","chapter":"健康与疾病｜护理学导论第4版","href":"introduction/ch02.html","kind":"safe","relation":""},{"type":"concept","label":"健康—疾病连续体","tag":"使用情境 / 考法","detail":"健康和疾病不是互斥静止状态，个体会随环境、行为和支持在连续体上移动。 考法线索：同一诊断者的功能和体验可能不同，护理目标需个体化。","ref":"教材P25—40","chapter":"健康与疾病｜护理学导论第4版","href":"introduction/ch02.html","kind":"normal","relation":""},{"type":"concept","label":"三级预防","tag":"使用情境 / 考法","detail":"一级防发生，二级早发现早处理，三级减少残障并促进康复。 考法线索：先判断措施发生在发病前、症状出现后还是稳定康复期。","ref":"教材P25—40","chapter":"健康与疾病｜护理学导论第4版","href":"introduction/ch02.html","kind":"normal","relation":""}]},{"id":"introduction/ch03.html","label":"人的基本需要","title":"以“人的基本需要”为中心｜用途、数值与跨章联系","center":"人的基本需要","chapter":"人的基本需要｜护理学导论第4版","href":"introduction/ch03.html","items":[{"type":"concept","label":"人的基本需要","tag":"使用情境 / 考法","detail":"需要具有层次、相互影响并随病情变化；护理优先级先守生命与安全，再回应更高层次需要。 考法线索：先定位概念，再核对对象、阶段和适用条件。","ref":"教材P41—56","chapter":"人的基本需要｜护理学导论第4版","href":"introduction/ch03.html","kind":"normal","relation":""},{"type":"concept","label":"五个需要层次","tag":"使用情境 / 考法","detail":"由低到高依次为生理、安全、爱与归属、尊重和自我实现；层次描述需要类型，不是固定不变的护理顺序。 考法线索：题干给出饥渴、呼吸、疼痛、保护、陪伴、被认可或发挥潜能时，要准确归入相应层次。","ref":"教材P41—56","chapter":"人的基本需要｜护理学导论第4版","href":"introduction/ch03.html","kind":"normal","relation":""},{"type":"concept","label":"层次之间的关系","tag":"使用情境 / 考法","detail":"各层次相互联系、可以重叠；较低层次通常优先且是较高层次发展的基础，但高层需要也会影响低层需要的表达。 考法线索：判断‘一定、只能、完全满足后才出现’等绝对化表述时要谨慎。","ref":"教材P41—56","chapter":"人的基本需要｜护理学导论第4版","href":"introduction/ch03.html","kind":"normal","relation":""},{"type":"concept","label":"护理优先顺序","tag":"使用情境 / 考法","detail":"先处理直接威胁生命和安全的问题，再结合患者最迫切的主诉、意愿、可处理性和病情变化动态排序。 考法线索：马斯洛提供排序框架，但不能替代ABC、风险程度和个体评估。","ref":"教材P41—56","chapter":"人的基本需要｜护理学导论第4版","href":"introduction/ch03.html","kind":"safe","relation":""},{"type":"concept","label":"需要的个体差异","tag":"使用情境 / 考法","detail":"同一种行为可能满足不同需要，同一种需要也可用不同方式满足；年龄、文化、疾病和支持资源都会改变表现。 考法线索：不能只凭行为贴标签，要追问患者赋予该行为的意义。","ref":"教材P41—56","chapter":"人的基本需要｜护理学导论第4版","href":"introduction/ch03.html","kind":"safe","relation":""},{"type":"concept","label":"未满足需要的识别","tag":"使用情境 / 考法","detail":"从主诉、行为、情绪、生理指标、家庭关系和生活目标中寻找未满足需要，并区分患者已经表达与尚未表达的需要。 考法线索：案例题要逐层写出证据，不能只抄五个层次名称。","ref":"教材P41—56","chapter":"人的基本需要｜护理学导论第4版","href":"introduction/ch03.html","kind":"safe","relation":""},{"type":"concept","label":"满足需要中的护士作用","tag":"使用情境 / 考法","detail":"护士通过评估、预测、协调资源、创造安全环境、支持选择和评价效果，帮助患者以可接受的方式满足需要。 考法线索：答案要写出具体行动及评价指标，不能只写‘给予关心与支持’。","ref":"教材P41—56","chapter":"人的基本需要｜护理学导论第4版","href":"introduction/ch03.html","kind":"safe","relation":""},{"type":"cross","label":"整体护理","tag":"跨章节 · 护理学的发展及基本概念","detail":"同时关注生理、心理、社会、文化与精神反应，并把照护贯穿全过程。 考法线索：患者最迫切的生理问题和最在意的生活问题分别是什么？ 在安全措施后补写一条心理或社会支持措施。","ref":"教材P8—10","chapter":"护理学的发展及基本概念｜护理学导论第4版","href":"introduction/ch01.html","kind":"cross","relation":"安全"},{"type":"cross","label":"文化与护理","tag":"跨章节 · 文化与护理","detail":"文化影响健康信念、就医方式和家庭决策；评估差异后才能提供安全且可接受的照护。 考法线索：先定位概念，再核对对象、阶段和适用条件。","ref":"教材P57—78","chapter":"文化与护理｜护理学导论第4版","href":"introduction/ch04.html","kind":"cross","relation":"评估 / 安全"},{"type":"cross","label":"文化与照护","tag":"跨章节 · 文化与护理","detail":"健康信念、家庭结构、语言和习俗会影响患者对疾病与治疗的理解。 考法线索：患者的选择是否受到文化或家庭决策方式影响？ 先询问意义和偏好，再共同寻找安全可行的方案。","ref":"教材P65—72","chapter":"文化与护理｜护理学导论第4版","href":"introduction/ch04.html","kind":"cross","relation":"安全"}]},{"id":"introduction/ch04.html","label":"文化与护理","title":"以“文化与护理”为中心｜用途、数值与跨章联系","center":"文化与护理","chapter":"文化与护理｜护理学导论第4版","href":"introduction/ch04.html","items":[{"type":"concept","label":"文化与护理","tag":"使用情境 / 考法","detail":"文化影响健康信念、就医方式和家庭决策；评估差异后才能提供安全且可接受的照护。 考法线索：先定位概念，再核对对象、阶段和适用条件。","ref":"教材P57—78","chapter":"文化与护理｜护理学导论第4版","href":"introduction/ch04.html","kind":"normal","relation":""},{"type":"concept","label":"文化与照护","tag":"使用情境 / 考法","detail":"健康信念、家庭结构、语言和习俗会影响患者对疾病与治疗的理解。 考法线索：患者的选择是否受到文化或家庭决策方式影响？ 先询问意义和偏好，再共同寻找安全可行的方案。","ref":"教材P65—72","chapter":"文化与护理｜护理学导论第4版","href":"introduction/ch04.html","kind":"normal","relation":""},{"type":"concept","label":"文化评估","tag":"使用情境 / 考法","detail":"询问语言、信仰、饮食、家庭决策和治疗禁忌，避免用群体印象替代个人评估。 考法线索：先问清意义和偏好，再共同选择安全方案。","ref":"教材P57—78","chapter":"文化与护理｜护理学导论第4版","href":"introduction/ch04.html","kind":"safe","relation":""},{"type":"concept","label":"文化照护策略","tag":"使用情境 / 考法","detail":"可采用文化保留、协商调整或在有害时帮助重新建构。 考法线索：尊重文化不等于接受会造成明确伤害的做法。","ref":"教材P57—78","chapter":"文化与护理｜护理学导论第4版","href":"introduction/ch04.html","kind":"normal","relation":""},{"type":"cross","label":"整体护理","tag":"跨章节 · 护理学的发展及基本概念","detail":"同时关注生理、心理、社会、文化与精神反应，并把照护贯穿全过程。 考法线索：患者最迫切的生理问题和最在意的生活问题分别是什么？ 在安全措施后补写一条心理或社会支持措施。","ref":"教材P8—10","chapter":"护理学的发展及基本概念｜护理学导论第4版","href":"introduction/ch01.html","kind":"cross","relation":"安全"},{"type":"cross","label":"人的基本需要","tag":"跨章节 · 人的基本需要","detail":"需要具有层次、相互影响并随病情变化；护理优先级先守生命与安全，再回应更高层次需要。 考法线索：先定位概念，再核对对象、阶段和适用条件。","ref":"教材P41—56","chapter":"人的基本需要｜护理学导论第4版","href":"introduction/ch03.html","kind":"cross","relation":"安全"},{"type":"cross","label":"五个需要层次","tag":"跨章节 · 人的基本需要","detail":"由低到高依次为生理、安全、爱与归属、尊重和自我实现；层次描述需要类型，不是固定不变的护理顺序。 考法线索：题干给出饥渴、呼吸、疼痛、保护、陪伴、被认可或发挥潜能时，要准确归入相应层次。","ref":"教材P41—56","chapter":"人的基本需要｜护理学导论第4版","href":"introduction/ch03.html","kind":"cross","relation":"安全"}]},{"id":"introduction/ch05.html","label":"护患关系与人际交流","title":"以“护患关系与人际交流”为中心｜用途、数值与跨章联系","center":"护患关系与人际交流","chapter":"护患关系与人际交流｜护理学导论第4版","href":"introduction/ch05.html","items":[{"type":"concept","label":"护患关系与人际交流","tag":"使用情境 / 考法","detail":"专业护患关系有目标、有阶段、有边界；治疗性沟通用于获得真实资料并促进患者参与。 考法线索：先定位概念，再核对对象、阶段和适用条件。","ref":"教材P79—95","chapter":"护患关系与人际交流｜护理学导论第4版","href":"introduction/ch05.html","kind":"normal","relation":""},{"type":"concept","label":"护患关系","tag":"使用情境 / 考法","detail":"专业关系以患者需要为中心，依靠信任、目标、边界和合作维持。 考法线索：怎样既表达关心，又保持清晰的专业边界？ 把命令式表达改成说明目的并邀请参与的表达。","ref":"教材P82—84","chapter":"护患关系与人际交流｜护理学导论第4版","href":"introduction/ch05.html","kind":"normal","relation":""},{"type":"concept","label":"治疗性沟通","tag":"使用情境 / 考法","detail":"倾听、开放式提问、澄清、复述和沉默帮助患者表达；否定与空泛保证会关闭沟通。 考法线索：患者话语背后真正担心的是什么？ 先复述感受，再问一个具体开放问题。","ref":"教材P90—93","chapter":"护患关系与人际交流｜护理学导论第4版","href":"introduction/ch05.html","kind":"normal","relation":""},{"type":"concept","label":"佩普劳人际关系理论","tag":"使用情境 / 考法","detail":"护患关系经历认识、确认、开拓和解决阶段，关系本身具有治疗作用。 考法线索：目前护患关系处在哪一阶段，护士的任务是什么？ 写一句既确认感受又推进问题解决的话。","ref":"教材P163—164","chapter":"护患关系与人际交流｜护理学导论第4版","href":"introduction/ch05.html","kind":"normal","relation":""},{"type":"concept","label":"关系阶段","tag":"使用情境 / 考法","detail":"认识期建立信任，工作期共同解决问题，结束期评价目标并妥善终止。 考法线索：根据阶段选择任务；结束关系不等于突然中断。","ref":"教材P79—95","chapter":"护患关系与人际交流｜护理学导论第4版","href":"introduction/ch05.html","kind":"normal","relation":""},{"type":"concept","label":"专业边界","tag":"使用情境 / 考法","detail":"关系以患者需要为中心，护士不借关系满足个人需要或形成依赖。 考法线索：礼物、私人联系和秘密等题目要判断是否越界。","ref":"教材P79—95","chapter":"护患关系与人际交流｜护理学导论第4版","href":"introduction/ch05.html","kind":"normal","relation":""},{"type":"cross","label":"临终关怀与生命质量","tag":"跨章节 · 临终关怀","detail":"当治愈不再是唯一目标，护理仍可通过症状控制、沟通、尊严和家庭支持改善生命质量。 考法线索：患者当前最重视的目标是什么？ 围绕舒适、知情选择、家属支持和尊严列出计划。","ref":"教材P226—227","chapter":"临终关怀｜护理学导论第4版","href":"introduction/ch12.html","kind":"cross","relation":"沟通"},{"type":"cross","label":"临终照护目标","tag":"跨章节 · 临终关怀","detail":"当治愈受限时，护理仍能通过症状控制、沟通、选择和陪伴改善生命质量。 考法线索：先问患者最重视什么。","ref":"教材P218—240","chapter":"临终关怀｜护理学导论第4版","href":"introduction/ch12.html","kind":"cross","relation":"沟通"},{"type":"cross","label":"悲伤支持","tag":"跨章节 · 临终关怀","detail":"允许个体按自己的方式表达，不强迫固定顺序，也不用空泛安慰关闭沟通。 考法线索：识别严重功能受损和自伤等转介信号。","ref":"教材P218—240","chapter":"临终关怀｜护理学导论第4版","href":"introduction/ch12.html","kind":"cross","relation":"沟通"}]},{"id":"introduction/ch06.html","label":"生命历程中的身心发展","title":"以“生命历程中的身心发展”为中心｜用途、数值与跨章联系","center":"生命历程中的身心发展","chapter":"生命历程中的身心发展｜护理学导论第4版","href":"introduction/ch06.html","items":[{"type":"concept","label":"生命历程中的身心发展","tag":"使用情境 / 考法","detail":"成长与发展贯穿生命全程；年龄、发展任务和疾病造成的中断共同影响护理需要。 考法线索：先定位概念，再核对对象、阶段和适用条件。","ref":"教材P96—112","chapter":"生命历程中的身心发展｜护理学导论第4版","href":"introduction/ch06.html","kind":"normal","relation":""},{"type":"concept","label":"成长与发展","tag":"使用情境 / 考法","detail":"不同生命阶段有不同的发展任务；疾病会打断角色、独立性与未来计划。 考法线索：这一健康问题打断了患者哪个阶段的发展任务？ 把年龄、家庭角色和学习或工作任务加入护理评估。","ref":"教材P96—111","chapter":"生命历程中的身心发展｜护理学导论第4版","href":"introduction/ch06.html","kind":"normal","relation":""},{"type":"concept","label":"发展规律","tag":"使用情境 / 考法","detail":"发展有顺序、连续又有个体差异，各领域速度不完全同步。 考法线索：年龄只是线索，还要评估实际能力。","ref":"教材P96—112","chapter":"生命历程中的身心发展｜护理学导论第4版","href":"introduction/ch06.html","kind":"normal","relation":""},{"type":"concept","label":"发展任务","tag":"使用情境 / 考法","detail":"疾病可能打断独立、亲密关系、养育、工作或老年整合等任务。 考法线索：护理要帮助恢复或重建角色。","ref":"教材P96—112","chapter":"生命历程中的身心发展｜护理学导论第4版","href":"introduction/ch06.html","kind":"normal","relation":""},{"type":"cross","label":"护理优先顺序","tag":"跨章节 · 人的基本需要","detail":"先处理直接威胁生命和安全的问题，再结合患者最迫切的主诉、意愿、可处理性和病情变化动态排序。 考法线索：马斯洛提供排序框架，但不能替代ABC、风险程度和个体评估。","ref":"教材P41—56","chapter":"人的基本需要｜护理学导论第4版","href":"introduction/ch03.html","kind":"cross","relation":"评估"},{"type":"cross","label":"满足需要中的护士作用","tag":"跨章节 · 人的基本需要","detail":"护士通过评估、预测、协调资源、创造安全环境、支持选择和评价效果，帮助患者以可接受的方式满足需要。 考法线索：答案要写出具体行动及评价指标，不能只写‘给予关心与支持’。","ref":"教材P41—56","chapter":"人的基本需要｜护理学导论第4版","href":"introduction/ch03.html","kind":"cross","relation":"评估"},{"type":"cross","label":"文化与护理","tag":"跨章节 · 文化与护理","detail":"文化影响健康信念、就医方式和家庭决策；评估差异后才能提供安全且可接受的照护。 考法线索：先定位概念，再核对对象、阶段和适用条件。","ref":"教材P57—78","chapter":"文化与护理｜护理学导论第4版","href":"introduction/ch04.html","kind":"cross","relation":"评估"}]},{"id":"introduction/ch07.html","label":"应激学说及其在护理中的应用","title":"以“应激学说及其在护理中的应用”为中心｜用途、数值与跨章联系","center":"应激学说及其在护理中的应用","chapter":"应激学说及其在护理中的应用｜护理学导论第4版","href":"introduction/ch07.html","items":[{"type":"concept","label":"应激学说及其在护理中的应用","tag":"使用情境 / 考法","detail":"从压力源、反应、应对资源和适应结果判断患者需要的支持，识别无效应对和危机。 考法线索：先定位概念，再核对对象、阶段和适用条件。","ref":"教材P113—132","chapter":"应激学说及其在护理中的应用｜护理学导论第4版","href":"introduction/ch07.html","kind":"normal","relation":""},{"type":"concept","label":"压力与适应","tag":"使用情境 / 考法","detail":"压力反应受事件、个人资源和支持系统影响；护理帮助患者形成有效适应。 考法线索：患者面对的压力源是什么，现有应对有效吗？ 区分问题应对、情绪应对和需要转介的信号。","ref":"教材P113—123","chapter":"应激学说及其在护理中的应用｜护理学导论第4版","href":"introduction/ch07.html","kind":"normal","relation":""},{"type":"concept","label":"压力反应","tag":"使用情境 / 考法","detail":"压力可表现于生理、情绪、认知与行为，长期持续会消耗适应资源。 考法线索：失眠、心悸、回避和注意力下降要综合判断。","ref":"教材P113—132","chapter":"应激学说及其在护理中的应用｜护理学导论第4版","href":"introduction/ch07.html","kind":"safe","relation":""},{"type":"concept","label":"应对与资源","tag":"使用情境 / 考法","detail":"问题指向型应对处理压力源，情绪指向型应对调节感受；社会支持会改变结果。 考法线索：先判断应对是否有效，再决定教育、支持或转介。","ref":"教材P113—132","chapter":"应激学说及其在护理中的应用｜护理学导论第4版","href":"introduction/ch07.html","kind":"normal","relation":""}]},{"id":"introduction/ch08.html","label":"护理程序","title":"以“护理程序”为中心｜用途、数值与跨章联系","center":"护理程序","chapter":"护理程序｜护理学导论第4版","href":"introduction/ch08.html","items":[{"type":"concept","label":"护理程序","tag":"使用情境 / 考法","detail":"评估、护理诊断、计划、实施与评价构成动态循环；新资料出现时必须重新判断。 考法线索：先定位概念，再核对对象、阶段和适用条件。","ref":"教材P133—160","chapter":"护理程序｜护理学导论第4版","href":"introduction/ch08.html","kind":"normal","relation":""},{"type":"concept","label":"护理诊断","tag":"使用情境 / 考法","detail":"护理诊断描述患者对健康问题的反应并由评估资料支持；医疗诊断命名疾病。 考法线索：区分病名、症状、护理诊断和合作性问题。","ref":"教材P133—160","chapter":"护理程序｜护理学导论第4版","href":"introduction/ch08.html","kind":"normal","relation":""},{"type":"concept","label":"计划与评价","tag":"使用情境 / 考法","detail":"目标应以患者为中心、具体可测且有时限；评价后决定终止、继续或修订。 考法线索：评价必须对照既定指标。","ref":"教材P133—160","chapter":"护理程序｜护理学导论第4版","href":"introduction/ch08.html","kind":"normal","relation":""},{"type":"cross","label":"护理优先顺序","tag":"跨章节 · 人的基本需要","detail":"先处理直接威胁生命和安全的问题，再结合患者最迫切的主诉、意愿、可处理性和病情变化动态排序。 考法线索：马斯洛提供排序框架，但不能替代ABC、风险程度和个体评估。","ref":"教材P41—56","chapter":"人的基本需要｜护理学导论第4版","href":"introduction/ch03.html","kind":"cross","relation":"评估"},{"type":"cross","label":"满足需要中的护士作用","tag":"跨章节 · 人的基本需要","detail":"护士通过评估、预测、协调资源、创造安全环境、支持选择和评价效果，帮助患者以可接受的方式满足需要。 考法线索：答案要写出具体行动及评价指标，不能只写‘给予关心与支持’。","ref":"教材P41—56","chapter":"人的基本需要｜护理学导论第4版","href":"introduction/ch03.html","kind":"cross","relation":"评估"},{"type":"cross","label":"文化与护理","tag":"跨章节 · 文化与护理","detail":"文化影响健康信念、就医方式和家庭决策；评估差异后才能提供安全且可接受的照护。 考法线索：先定位概念，再核对对象、阶段和适用条件。","ref":"教材P57—78","chapter":"文化与护理｜护理学导论第4版","href":"introduction/ch04.html","kind":"cross","relation":"评估"}]},{"id":"introduction/ch09.html","label":"护理理论","title":"以“护理理论”为中心｜用途、数值与跨章联系","center":"护理理论","chapter":"护理理论｜护理学导论第4版","href":"introduction/ch09.html","items":[{"type":"concept","label":"护理理论","tag":"使用情境 / 考法","detail":"理论不是口号，要从题干线索判断自理缺陷、适应层面、压力源或护患关系阶段。 考法线索：先定位概念，再核对对象、阶段和适用条件。","ref":"教材P161—181","chapter":"护理理论｜护理学导论第4版","href":"introduction/ch09.html","kind":"normal","relation":""},{"type":"concept","label":"一般系统理论","tag":"使用情境 / 考法","detail":"人体、家庭和医疗环境都是开放系统；一个环节变化会影响其他环节。 考法线索：一个症状或治疗变化会怎样传导到全身和家庭？ 画出输入、过程、输出与反馈，并标出护理可干预处。","ref":"教材P161—162","chapter":"护理理论｜护理学导论第4版","href":"introduction/ch09.html","kind":"normal","relation":""},{"type":"concept","label":"奥瑞姆自理理论","tag":"使用情境 / 考法","detail":"当自理能力不足以满足自理需要时产生自理缺陷，护理系统应随能力变化而调整。 考法线索：患者能自己做什么、需要部分帮助什么、必须完全代偿什么？ 用完全代偿、部分代偿、支持教育三栏安排措施。","ref":"教材P164—168","chapter":"护理理论｜护理学导论第4版","href":"introduction/ch09.html","kind":"normal","relation":""},{"type":"concept","label":"罗伊适应模式","tag":"使用情境 / 考法","detail":"人通过生理功能、自我概念、角色功能和相互依赖四个方面适应刺激。 考法线索：疾病在哪些适应层面造成问题？ 为四个适应层面各写一项观察或支持。","ref":"教材P168—172","chapter":"护理理论｜护理学导论第4版","href":"introduction/ch09.html","kind":"normal","relation":""},{"type":"concept","label":"纽曼系统模式","tag":"使用情境 / 考法","detail":"压力源可来自个体内、人际间和个体外，护理通过三级预防保护系统稳定。 考法线索：主要压力源来自哪里，当前属于哪一级预防？ 分别写出发病前、症状出现后和康复期干预。","ref":"教材P173—176","chapter":"护理理论｜护理学导论第4版","href":"introduction/ch09.html","kind":"normal","relation":""},{"type":"concept","label":"佩普劳人际关系理论","tag":"使用情境 / 考法","detail":"护患关系经历认识、确认、开拓和解决阶段，关系本身具有治疗作用。 考法线索：目前护患关系处在哪一阶段，护士的任务是什么？ 写一句既确认感受又推进问题解决的话。","ref":"教材P163—164","chapter":"护理理论｜护理学导论第4版","href":"introduction/ch09.html","kind":"normal","relation":""},{"type":"concept","label":"理论选择","tag":"使用情境 / 考法","detail":"先识别题干关心的是自理能力、适应层面、压力源还是关系阶段，再调用相应理论。 考法线索：不要把所有理论都写一遍。","ref":"教材P161—181","chapter":"护理理论｜护理学导论第4版","href":"introduction/ch09.html","kind":"safe","relation":""}]},{"id":"introduction/ch10.html","label":"循证护理与临床护理决策","title":"以“循证护理与临床护理决策”为中心｜用途、数值与跨章联系","center":"循证护理与临床护理决策","chapter":"循证护理与临床护理决策｜护理学导论第4版","href":"introduction/ch10.html","items":[{"type":"concept","label":"循证护理与临床护理决策","tag":"使用情境 / 考法","detail":"把最佳证据、临床经验、患者价值与具体情境整合，形成可评价、可修正的护理决策。 考法线索：先定位概念，再核对对象、阶段和适用条件。","ref":"教材P182—197","chapter":"循证护理与临床护理决策｜护理学导论第4版","href":"introduction/ch10.html","kind":"normal","relation":""},{"type":"concept","label":"评判性思维与临床决策","tag":"使用情境 / 考法","detail":"从线索中识别模式，验证假设，比较风险，并根据反馈修正判断。 考法线索：哪条线索最能改变优先级，哪些信息仍需验证？ 写出首选判断、支持证据和一个替代解释。","ref":"教材P182—190","chapter":"循证护理与临床护理决策｜护理学导论第4版","href":"introduction/ch10.html","kind":"safe","relation":""},{"type":"concept","label":"循证护理","tag":"使用情境 / 考法","detail":"最佳证据、临床经验与患者价值共同形成护理决策，并在实施后评价效果。 考法线索：这项措施的证据、适用对象和患者偏好分别是什么？ 用问题、证据、应用、评价四步复盘一项措施。","ref":"教材P191—195","chapter":"循证护理与临床护理决策｜护理学导论第4版","href":"introduction/ch10.html","kind":"normal","relation":""},{"type":"concept","label":"PICO问题","tag":"使用情境 / 考法","detail":"明确患者或问题、干预、对照和结局，才能检索与判断证据。 考法线索：宽泛问题先拆成可回答的临床问题。","ref":"教材P182—197","chapter":"循证护理与临床护理决策｜护理学导论第4版","href":"introduction/ch10.html","kind":"normal","relation":""},{"type":"concept","label":"证据应用","tag":"使用情境 / 考法","detail":"证据需结合对象、资源、风险和患者偏好，并在实施后评价。 考法线索：不能把指南结论脱离适用条件照搬。","ref":"教材P182—197","chapter":"循证护理与临床护理决策｜护理学导论第4版","href":"introduction/ch10.html","kind":"safe","relation":""}]},{"id":"introduction/ch11.html","label":"健康教育","title":"以“健康教育”为中心｜用途、数值与跨章联系","center":"健康教育","chapter":"健康教育｜护理学导论第4版","href":"introduction/ch11.html","items":[{"type":"concept","label":"健康教育","tag":"使用情境 / 考法","detail":"从学习需要和能力评估开始，选择方法并用复述或演示验证患者是否真正会做。 考法线索：先定位概念，再核对对象、阶段和适用条件。","ref":"教材P198—217","chapter":"健康教育｜护理学导论第4版","href":"introduction/ch11.html","kind":"normal","relation":""},{"type":"concept","label":"健康促进与疾病预防","tag":"使用情境 / 考法","detail":"护理不仅处理疾病，还通过一级、二级、三级预防减少发生、早期发现和降低残障。 考法线索：本章措施分别属于哪一级预防？ 为危险人群、早期患者和康复患者各写一项行动。","ref":"教材P35—36","chapter":"健康教育｜护理学导论第4版","href":"introduction/ch11.html","kind":"safe","relation":""},{"type":"concept","label":"团队合作与连续照护","tag":"使用情境 / 考法","detail":"跨专业合作和不同场所之间的信息衔接，能减少重复、遗漏与照护中断。 考法线索：谁还需要参与，患者离开当前场所后由谁接续？ 写出转介对象、交接重点、复诊节点和危险信号。","ref":"教材P198—202","chapter":"健康教育｜护理学导论第4版","href":"introduction/ch11.html","kind":"safe","relation":""},{"type":"concept","label":"学习目标","tag":"使用情境 / 考法","detail":"目标描述患者学后能说出、演示或完成的行为，不写护士‘已宣教’。 考法线索：认知、情感和动作技能选择不同方法。","ref":"教材P198—217","chapter":"健康教育｜护理学导论第4版","href":"introduction/ch11.html","kind":"normal","relation":""},{"type":"concept","label":"回示法","tag":"使用情境 / 考法","detail":"请患者用自己的话复述或演示，以检验教育效果并发现遗漏。 考法线索：点头不代表已经学会。","ref":"教材P198—217","chapter":"健康教育｜护理学导论第4版","href":"introduction/ch11.html","kind":"normal","relation":""},{"type":"cross","label":"护理优先顺序","tag":"跨章节 · 人的基本需要","detail":"先处理直接威胁生命和安全的问题，再结合患者最迫切的主诉、意愿、可处理性和病情变化动态排序。 考法线索：马斯洛提供排序框架，但不能替代ABC、
