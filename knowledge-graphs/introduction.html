ill:#eff9f6;stroke:#c1e5da}.legend{display:flex;gap:13px;color:var(--muted);font-size:12px;margin:2px 0 0;flex-wrap:wrap}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#7150ae;margin-right:5px}.dot2{background:#fff;border:1px solid #c9b8df}.dot3{background:#dff3ee}.detail{position:sticky;top:12px;align-self:start;min-height:100%}.pill{display:inline-block;background:#f0e9fb;color:#67439c;border-radius:99px;padding:4px 10px;font-size:12px;font-weight:800}.detail h3{margin:10px 0 5px;font-size:22px}.detail p{color:#50465b}.detail .value{font-size:19px;color:#68449f;font-weight:800;margin:8px 0}.ref{padding:11px;background:#f6f2fa;border-radius:11px;color:#6c6079;font-size:13px}.reason{background:#f7f3fb;border-left:3px solid var(--purple);padding:10px 12px;border-radius:9px;font-size:13px;margin-top:11px}.reason b{display:block;color:#634492;margin-bottom:3px}.small{color:var(--muted);font-size:12px}.detail a{color:#6645a0;font-weight:700}.pager{display:flex;justify-content:center;align-items:center;gap:9px;margin:5px 0}.pager button{border:1px solid var(--line);background:white;color:var(--purple);border-radius:9px;padding:6px 11px;cursor:pointer}.pager span{font-size:12px;color:var(--muted)}.footer{color:#8b8095;font-size:11px;margin:10px 2px}

</style></head><body><main class="wrap"><header class="hero"><small>ICE冰冰·高分学姐团｜跨章节主题图谱</small><h1>护理学导论知识点关系图</h1><p>用核心概念把理论、护理情境、伦理边界和容易混淆的判断连接起来。</p></header><nav class="course-nav"><a href="fundamentals.html" class="">基础护理</a><a href="introduction.html" class="on">护理导论</a><a href="medical.html" class="">内科护理</a><a href="surgical.html" class="">外科护理</a></nav><div class="tabs" id="tabs"></div><section class="layout"><div class="panel"><h2 id="mapTitle"></h2><p class="sub">选一个中心考点，沿分支查看关键参数、使用情境、易混点和教材来源。</p><svg class="map" id="graph" viewBox="0 0 720 468" role="img" aria-label="护理学导论跨章节知识关系图"></svg><div class="pager"><button id="prev">‹ 上一组</button><span id="pageText"></span><button id="next">下一组 ›</button></div><div class="legend"><span><i class="dot"></i>中心概念</span><span><i class="dot2"></i>用途 / 数值 / 跨章关联</span><span><i class="dot3"></i>易错与安全边界</span></div></div><aside class="panel detail" id="detail"></aside></section><p class="footer">中心主题由跨章节考点组织。每个分支保留来源章节与页码；易错节点说明常见混淆，关键数值连同适用条件一起呈现。</p></main><script>
const MAPS=[{"id":"metaparadigm","label":"四个基本概念如何互相作用","center":"人 × 环境 × 健康 × 护理","logic":"从患者是谁开始：人的状态受内外环境影响，健康是动态结果，护理则根据评估采取行动。四个概念共同解释“谁遇到什么健康问题、受什么影响、护理如何回应”。","items":[{"type":"concept","label":"护理学的四个基本概念","tag":"概念关系","detail":"人、环境、健康与护理彼此影响；护理判断不能只盯住疾病。 易考线索：病例中除了疾病，还给出了哪些人与环境的信息？ 从患者、环境、健康状态和护理行动四栏重述病例。","ref":"教材P11—14","chapter":"护理学的发展及基本概念｜护理学导论第4版","href":"introduction/ch01.html","kind":"safe"},{"type":"concept","label":"整体护理","tag":"概念关系","detail":"同时关注生理、心理、社会、文化与精神反应，并把照护贯穿全过程。 易考线索：患者最迫切的生理问题和最在意的生活问题分别是什么？ 在安全措施后补写一条心理或社会支持措施。","ref":"教材P8—10","chapter":"护理学的发展及基本概念｜护理学导论第4版","href":"introduction/ch01.html","kind":"normal"},{"type":"concept","label":"健康与疾病","tag":"概念关系","detail":"健康与疾病处在连续动态过程，患者角色和三级预防决定不同阶段的护理重点。 易考线索：先定位概念，再核对对象、阶段和适用条件。","ref":"教材P25—40","chapter":"健康与疾病｜护理学导论第4版","href":"introduction/ch02.html","kind":"normal"},{"type":"concept","label":"文化与护理","tag":"概念关系","detail":"文化影响健康信念、就医方式和家庭决策；评估差异后才能提供安全且可接受的照护。 易考线索：先定位概念，再核对对象、阶段和适用条件。","ref":"教材P57—78","chapter":"文化与护理｜护理学导论第4版","href":"introduction/ch04.html","kind":"normal"},{"type":"concept","label":"护理程序","tag":"概念关系","detail":"评估、护理诊断、计划、实施与评价构成动态循环；新资料出现时必须重新判断。 易考线索：先定位概念，再核对对象、阶段和适用条件。","ref":"教材P133—160","chapter":"护理程序｜护理学导论第4版","href":"introduction/ch08.html","kind":"normal"},{"type":"concept","label":"护士的专业角色","tag":"概念关系","detail":"护士既是护理者，也是协作者、教育者、代言者、管理者和研究者。 易考线索：此刻护士主要承担哪一种角色，为什么？ 把一项护理行动改写成‘角色＋对象＋目标’。","ref":"教材P18—19","chapter":"护理学的发展及基本概念｜护理学导论第4版","href":"introduction/ch01.html","kind":"normal"},{"type":"concept","label":"健康教育","tag":"概念关系","detail":"从学习需要和能力评估开始，选择方法并用复述或演示验证患者是否真正会做。 易考线索：先定位概念，再核对对象、阶段和适用条件。","ref":"教材P198—217","chapter":"健康教育｜护理学导论第4版","href":"introduction/ch11.html","kind":"normal"},{"type":"confusion","label":"概念常被拆开背","tag":"定义要回到情境","detail":"健康不等于没有疾病；环境不只指物理条件；护理不等于单项操作。病例题把生理、心理、社会文化线索一起放回四概念框架。","ref":"教材P8—24","chapter":"护理学导论｜第1章","href":"introduction/ch01.html","kind":"safe"}]},{"id":"needs","label":"需要理论怎样推到护理措施","center":"需要 × 优先顺序","logic":"先从患者证据识别未满足需要，再判断紧迫性和风险，优先保障生命与安全；随后结合个体差异、文化和资源制定支持方式，并评价需要是否真正满足。","items":[{"type":"concept","label":"人的基本需要","tag":"需要/情境","detail":"需要具有层次、相互影响并随病情变化；护理优先级先守生命与安全，再回应更高层次需要。 易考线索：先定位概念，再核对对象、阶段和适用条件。","ref":"教材P41—56","chapter":"人的基本需要｜护理学导论第4版","href":"introduction/ch03.html","kind":"normal"},{"type":"concept","label":"五个需要层次","tag":"需要/情境","detail":"由低到高依次为生理、安全、爱与归属、尊重和自我实现；层次描述需要类型，不是固定不变的护理顺序。 易考线索：题干给出饥渴、呼吸、疼痛、保护、陪伴、被认可或发挥潜能时，要准确归入相应层次。","ref":"教材P41—56","chapter":"人的基本需要｜护理学导论第4版","href":"introduction/ch03.html","kind":"normal"},{"type":"concept","label":"层次之间的关系","tag":"需要/情境","detail":"各层次相互联系、可以重叠；较低层次通常优先且是较高层次发展的基础，但高层需要也会影响低层需要的表达。 易考线索：判断‘一定、只能、完全满足后才出现’等绝对化表述时要谨慎。","ref":"教材P41—56","chapter":"人的基本需要｜护理学导论第4版","href":"introduction/ch03.html","kind":"normal"},{"type":"concept","label":"护理优先顺序","tag":"需要/情境","detail":"先处理直接威胁生命和安全的问题，再结合患者最迫切的主诉、意愿、可处理性和病情变化动态排序。 易考线索：马斯洛提供排序框架，但不能替代ABC、风险程度和个体评估。","ref":"教材P41—56","chapter":"人的基本需要｜护理学导论第4版","href":"introduction/ch03.html","kind":"safe"},{"type":"concept","label":"需要的个体差异","tag":"需要/情境","detail":"同一种行为可能满足不同需要，同一种需要也可用不同方式满足；年龄、文化、疾病和支持资源都会改变表现。 易考线索：不能只凭行为贴标签，要追问患者赋予该行为的意义。","ref":"教材P41—56","chapter":"人的基本需要｜护理学导论第4版","href":"introduction/ch03.html","kind":"safe"},{"type":"concept","label":"未满足需要的识别","tag":"需要/情境","detail":"从主诉、行为、情绪、生理指标、家庭关系和生活目标中寻找未满足需要，并区分患者已经表达与尚未表达的需要。 易考线索：案例题要逐层写出证据，不能只抄五个层次名称。","ref":"教材P41—56","chapter":"人的基本需要｜护理学导论第4版","href":"introduction/ch03.html","kind":"safe"},{"type":"concept","label":"满足需要中的护士作用","tag":"需要/情境","detail":"护士通过评估、预测、协调资源、创造安全环境、支持选择和评价效果，帮助患者以可接受的方式满足需要。 易考线索：答案要写出具体行动及评价指标，不能只写‘给予关心与支持’。","ref":"教材P41—56","chapter":"人的基本需要｜护理学导论第4版","href":"introduction/ch03.html","kind":"safe"},{"type":"concept","label":"文化评估","tag":"需要/情境","detail":"询问语言、信仰、饮食、家庭决策和治疗禁忌，避免用群体印象替代个人评估。 易考线索：先问清意义和偏好，再共同选择安全方案。","ref":"教材P57—78","chapter":"文化与护理｜护理学导论第4版","href":"introduction/ch04.html","kind":"safe"},{"type":"concept","label":"回示法","tag":"需要/情境","detail":"请患者用自己的话复述或演示，以检验教育效果并发现遗漏。 易考线索：点头不代表已经学会。","ref":"教材P198—217","chapter":"健康教育｜护理学导论第4版","href":"introduction/ch11.html","kind":"normal"},{"type":"confusion","label":"层次不是死板流程","tag":"先保命与安全，再做个体化判断","detail":"马斯洛层次用于理解需要，不能替代ABC和风险评估；患者需求可重叠，急性生命威胁优先。","ref":"教材P41—56","chapter":"护理学导论｜第3章","href":"introduction/ch03.html","kind":"safe"}]},{"id":"health","label":"健康、疾病与三级预防如何串联","center":"健康 × 疾病连续体","logic":"状态会随疾病、行为和环境改变；护理可在发病前促进健康、发病早期发现处理，也可在疾病后降低残障并支持康复。先判断阶段，再定位预防层级和护理目标。","items":[{"type":"concept","label":"健康与疾病","tag":"阶段/目标","detail":"健康与疾病处在连续动态过程，患者角色和三级预防决定不同阶段的护理重点。 易考线索：先定位概念，再核对对象、阶段和适用条件。","ref":"教材P25—40","chapter":"健康与疾病｜护理学导论第4版","href":"introduction/ch02.html","kind":"normal"},{"type":"concept","label":"健康—疾病连续体","tag":"阶段/目标","detail":"健康和疾病不是互斥静止状态，个体会随环境、行为和支持在连续体上移动。 易考线索：同一诊断者的功能和体验可能不同，护理目标需个体化。","ref":"教材P25—40","chapter":"健康与疾病｜护理学导论第4版","href":"introduction/ch02.html","kind":"normal"},{"type":"concept","label":"健康促进与疾病预防","tag":"阶段/目标","detail":"护理不仅处理疾病，还通过一级、二级、三级预防减少发生、早期发现和降低残障。 易考线索：本章措施分别属于哪一级预防？ 为危险人群、早期患者和康复患者各写一项行动。","ref":"教材P35—36","chapter":"健康与疾病｜护理学导论第4版","href":"introduction/ch02.html","kind":"normal"},{"type":"concept","label":"三级预防","tag":"阶段/目标","detail":"一级防发生，二级早发现早处理，三级减少残障并促进康复。 易考线索：先判断措施发生在发病前、症状出现后还是稳定康复期。","ref":"教材P25—40","chapter":"健康与疾病｜护理学导论第4版","href":"introduction/ch02.html","kind":"normal"},{"type":"concept","label":"健康教育","tag":"阶段/目标","detail":"从学习需要和能力评估开始，选择方法并用复述或演示验证患者是否真正会做。 易考线索：先定位概念，再核对对象、阶段和适用条件。","ref":"教材P198—217","chapter":"健康教育｜护理学导论第4版","href":"introduction/ch11.html","kind":"normal"},{"type":"concept","label":"临终关怀与生命质量","tag":"阶段/目标","detail":"当治愈不再是唯一目标，护理仍可通过症状控制、沟通、尊严和家庭支持改善生命质量。 易考线索：患者当前最重视的目标是什么？ 围绕舒适、知情选择、家属支持和尊严列出计划。","ref":"教材P226—227","chapter":"临终关怀｜护理学导论第4版","href":"introduction/ch12.html","kind":"normal"},{"type":"confusion","label":"三级预防容易错分","tag":"先定位措施发生在哪个阶段","detail":"一级预防是减少发生，二级预防强调早发现早处理，三级预防减少残障并促进康复；按措施目标而不是场所判断。","ref":"教材P25—40","chapter":"护理学导论｜第2章","href":"introduction/ch02.html","kind":"safe"}]},{"id":"process","label":"护理程序与临床决策闭环","center":"评估 → 判断 → 行动 → 评价","logic":"资料先评估和验证，再形成护理诊断与目标，实施措施后根据结果评价；证据、患者偏好和临床判断共同影响方案，新信息出现时回到评估。","items":[{"type":"concept","label":"护理程序","tag":"决策节点","detail":"评估、护理诊断、计划、实施与评价构成动态循环；新资料出现时必须重新判断。 易考线索：先定位概念，再核对对象、阶段和适用条件。","ref":"教材P133—160","chapter":"护理程序｜护理学导论第4版","href":"introduction/ch08.html","kind":"normal"},{"type":"concept","label":"护理诊断","tag":"决策节点","detail":"护理诊断描述患者对健康问题的反应并由评估资料支持；医疗诊断命名疾病。 易考线索：区分病名、症状、护理诊断和合作性问题。","ref":"教材P133—160","chapter":"护理程序｜护理学导论第4版","href":"introduction/ch08.html","kind":"normal"},{"type":"concept","label":"计划与评价","tag":"决策节点","detail":"目标应以患者为中心、具体可测且有时限；评价后决定终止、继续或修订。 易考线索：评价必须对照既定指标。","ref":"教材P133—160","chapter":"护理程序｜护理学导论第4版","href":"introduction/ch08.html","kind":"normal"},{"type":"concept","label":"评判性思维与临床决策","tag":"决策节点","detail":"从线索中识别模式，验证假设，比较风险，并根据反馈修正判断。 易考线索：哪条线索最能改变优先级，哪些信息仍需验证？ 写出首选判断、支持证据和一个替代解释。","ref":"教材P182—190","chapter":"循证护理与临床护理决策｜护理学导论第4版","href":"introduction/ch10.html","kind":"safe"},{"type":"concept","label":"循证护理","tag":"决策节点","detail":"最佳证据、临床经验与患者价值共同形成护理决策，并在实施后评价效果。 易考线索：这项措施的证据、适用对象和患者偏好分别是什么？ 用问题、证据、应用、评价四步复盘一项措施。","ref":"教材P191—195","chapter":"循证护理与临床护理决策｜护理学导论第4版","href":"introduction/ch10.html","kind":"normal"},{"type":"concept","label":"PICO问题","tag":"决策节点","detail":"明确患者或问题、干预、对照和结局，才能检索与判断证据。 易考线索：宽泛问题先拆成可回答的临床问题。","ref":"教材P182—197","chapter":"循证护理与临床护理决策｜护理学导论第4版","href":"introduction/ch10.html","kind":"normal"},{"type":"concept","label":"证据应用","tag":"决策节点","detail":"证据需结合对象、资源、风险和患者偏好，并在实施后评价。 易考线索：不能把指南结论脱离适用条件照搬。","ref":"教材P182—197","chapter":"循证护理与临床护理决策｜护理学导论第4版","href":"introduction/ch10.html","kind":"safe"},{"type":"confusion","label":"护理诊断 ≠ 医学诊断","tag":"评价不是流程的终点","detail":"护理诊断描述患者对健康问题的反应；评价结果决定继续、调整或终止措施，不是做完后补写记录。","ref":"教材P133—197","chapter":"护理学导论｜第8、10章","href":"introduction/ch08.html","kind":"safe"}]},{"id":"ethics","label":"自主、知情、保密与安全","center":"权利 × 伦理判断","logic":"遇到伦理冲突先澄清事实和决策能力，再识别患者权利、风险及相关责任；充分告知并尊重自主，同时履行保密、保护和依法执业义务。","items":[{"type":"concept","label":"护理伦理","tag":"原则/边界","detail":"以自主、有利、不伤害、公正、诚实和忠诚分析冲突，不能只背原则名称。 易考线索：先定位概念，再核对对象、阶段和适用条件。","ref":"教材P241—252","chapter":"护理伦理｜护理学导论第4版","href":"introduction/ch13.html","kind":"safe"},{"type":"concept","label":"伦理分析步骤","tag":"原则/边界","detail":"先澄清事实和决策能力，再列相关者、冲突原则、方案与后果。 易考线索：不能看到拒绝就只写尊重自主。","ref":"教材P241—252","chapter":"护理伦理｜护理学导论第4版","href":"introduction/ch13.html","kind":"safe"},{"type":"concept","label":"知情与保密","tag":"原则/边界","detail":"尊重隐私和自主，在法律规定或明确严重危险时按程序处理例外。 易考线索：家属索取信息时先确认患者授权。","ref":"教材P241—252","chapter":"护理伦理｜护理学导论第4版","href":"introduction/ch13.html","kind":"normal"},{"type":"concept","label":"法律、知情与患者安全","tag":"原则/边界","detail":"依法执业、知情同意、隐私保护、规范记录和风险报告共同维护患者与护士安全。 易考线索：哪些信息必须核对、记录、报告或取得同意？ 用事实、时间、行动和反馈四要素书写记录。","ref":"教材P253—261","chapter":"护理专业中的法律问题｜护理学导论第4版","href":"introduction/ch14.html","kind":"safe"},{"type":"concept","label":"侵权与过失","tag":"原则/边界","detail":"是否违反注意义务、是否造成损害及其因果关系，是判断过失的重要线索。 易考线索：先保障患者安全，再保留事实。","ref":"教材P253—330","chapter":"护理专业中的法律问题｜护理学导论第4版","href":"introduction/ch14.html","kind":"normal"},{"type":"concept","label":"专业边界","tag":"原则/边界","detail":"关系以患者需要为中心，护士不借关系满足个人需要或形成依赖。 易考线索：礼物、私人联系和秘密等题目要判断是否越界。","ref":"教材P79—95","chapter":"护患关系与人际交流｜护理学导论第4版","href":"introduction/ch05.html","kind":"normal"},{"type":"confusion","label":"尊重自主 ≠ 什么都不做","tag":"告知、理解、自愿、能力","detail":"知情同意要有充分信息和自愿决策；保护患者不等于护士替患者决定。注意法定例外与专业边界。","ref":"教材P241—261","chapter":"护理学导论｜第13、14章","href":"introduction/ch13.html","kind":"safe"}]},{"id":"communication","label":"护患关系如何建立并结束","center":"关系 × 沟通 × 专业边界","logic":"先建立信任和共同目标，再在工作阶段用倾听、澄清和反馈推进护理；结束阶段回顾目标并妥善终止关系，全程保持专业边界。","items":[{"type":"concept","label":"护患关系","tag":"关系/行动","detail":"专业关系以患者需要为中心，依靠信任、目标、边界和合作维持。 易考线索：怎样既表达关心，又保持清晰的专业边界？ 把命令式表达改成说明目的并邀请参与的表达。","ref":"教材P82—84","chapter":"护患关系与人际交流｜护理学导论第4版","href":"introduction/ch05.html","kind":"normal"},{"type":"concept","label":"治疗性沟通","tag":"关系/行动","detail":"倾听、开放式提问、澄清、复述和沉默帮助患者表达；否定与空泛保证会关闭沟通。 易考线索：患者话语背后真正担心的是什么？ 先复述感受，再问一个具体开放问题。","ref":"教材P90—93","chapter":"护患关系与人际交流｜护理学导论第4版","href":"introduction/ch05.html","kind":"normal"},{"type":"concept","label":"关系阶段","tag":"关系/行动","detail":"认识期建立信任，工作期共同解决问题，结束期评价目标并妥善终止。 易考线索：根据阶段选择任务；结束关系不等于突然中断。","ref":"教材P79—95","chapter":"护患关系与人际交流｜护理学导论第4版","href":"introduction/ch05.html","kind":"safe"},{"type":"concept","label":"专业边界","tag":"关系/行动","detail":"关系以患者需要为中心，护士不借关系满足个人需要或形成依赖。 易考线索：礼物、私人联系和秘密等题目要判断是否越界。","ref":"教材P79—95","chapter":"护患关系与人际交流｜护理学导论第4版","href":"introduction/ch05.html","kind":"normal"},{"type":"concept","label":"佩普劳人际关系理论","tag":"关系/行动","detail":"护患关系经历认识、确认、开拓和解决阶段，关系本身具有治疗作用。 易考线索：目前护患关系处在哪一阶段，护士的任务是什么？ 写一句既确认感受又推进问题解决的话。","ref":"教材P163—164","chapter":"护患关系与人际交流｜护理学导论第4版","href":"introduction/ch05.html","kind":"normal"},{"type":"concept","label":"护士的专业角色","tag":"关系/行动","detail":"护士既是护理者，也是协作者、教育者、代言者、管理者和研究者。 易考线索：此刻护士主要承担哪一种角色，为什么？ 把一项护理行动改写成‘角色＋对象＋目标’。","ref":"教材P18—19","chapter":"护理学的发展及基本概念｜护理学导论第4版","href":"introduction/ch01.html","kind":"normal"},{"type":"concept","label":"文化与照护","tag":"关系/行动","detail":"健康信念、家庭结构、语言和习俗会影响患者对疾病与治疗的理解。 易考线索：患者的选择是否受到文化或家庭决策方式影响？ 先询问意义和偏好，再共同寻找安全可行的方案。","ref":"教材P65—72","chapter":"文化与护理｜护理学导论第4版","href":"introduction/ch04.html","kind":"normal"},{"type":"confusion","label":"关心患者 ≠ 越过边界","tag":"依据患者利益保持专业关系","detail":"私人依赖、未经授权的信息披露或只给空泛保证，都可能偏离治疗性沟通和专业关系目标。","ref":"教材P79—95；P163—164","chapter":"护理学导论｜第5、9章","href":"introduction/ch05.html","kind":"safe"}]}];let mi=0,offset=0,selected=-1;const $=s=>document.querySelector(s),svg=$("#graph");

const edges=shown.map((n,j)=>{const [x,y]=slots[j];return '<line class="edge '+(selected===offset+j?'active':'')+'" x1="'+cx+'" y1="'+cy+'" x2="'+x+'" y2="'+y+'"/>'}).join("");
const cl=wrap(m.center,12).slice(0,2),center='<g class="node center" data-center="1"><rect x="'+(cx-96)+'" y="'+(cy-34)+'" width="192" height="68" rx="15"/><text x="'+cx+'" y="'+(cy-cl.length*6)+'" text-anchor="middle">'+cl.map((z,i)=>'<tspan x="'+cx+'" dy="'+(i?15:0)+'">'+esc(z)+'</tspan>').join("")+'<tspan class="tag" x="'+cx+'" dy="20">中心概念</tspan></text></g>';
const nodes=shown.map((n,j)=>{const [x,y]=slots[j],clz="node "+(n.kind==="safe"||n.type==="confusion"?"safe":"")+(selected===offset+j?" active":""),ll=wrap(n.label,13),tt=wrap(n.tag,22);return '<g class="'+clz+'" data-item="'+(offset+j)+'"><rect x="'+(x-92)+'" y="'+(y-39)+'" width="184" height="78" rx="14"/><text x="'+x+'" y="'+(y-12-(ll.length>1?7:0))+'" text-anchor="middle">'+ll.map((z,i)=>'<tspan x="'+x+'" dy="'+(i?15:0)+'">'+esc(z)+'</tspan>').join("")+'</text><text class="tag" x="'+x+'" y="'+(y+18+(ll.length>1?2:0))+'" text-anchor="middle">'+tt.map((z,i)=>'<tspan x="'+x+'" dy="'+(i?12:0)+'">'+esc(z)+'</tspan>').join("")+'</text></g>'}).join("");
svg.innerHTML=edges+center+nodes;svg.querySelectorAll("[data-item]").forEach(g=>g.onclick=()=>{selected=Number(g.dataset.item);detailFor(m.items[selected]);highlight()});svg.querySelector("[data-center]").onclick=()=>detailCenter(m);
$("#pageText").textContent=list.length?String(offset+1)+"–"+String(Math.min(offset+6,list.length))+" / "+String(list.length)+" 个关联节点":"暂无可呈现的关联点";$("#prev").disabled=offset===0;$("#next").disabled=offset+6>=list.length;
if(selected<0&&shown.length){selected=offset;detailFor(list[offset])}highlight()}
function highlight(){svg.querySelectorAll("[data-item]").forEach(g=>g.classList.toggle("active",Number(g.dataset.item)===selected))}
function detailFor(n){const kind=n.type==="number"?"关键参数":n.type==="confusion"||n.kind==="safe"?"易混易错":"跨章节考点";$("#detail").innerHTML='<span class="pill">'+kind+'</span><h3>'+esc(n.label)+'</h3>'+(n.type==="number"?'<div class="value">'+esc(n.tag)+'</div>':'<p class="small">'+esc(n.tag)+'</p>')+'<p>'+esc(n.detail)+'</p><div class="reason"><b>怎么推演</b>'+esc(MAPS[mi].logic)+'</div><div class="ref" style="margin-top:10px">'+esc(n.ref||n.chapter)+'<br>'+esc(n.chapter)+'</div><p class="small">中心考点：'+esc(MAPS[mi].center)+'</p><a href="../'+esc(n.href||MAPS[mi].items[0]?.href||"")+'">打开对应章节继续核对与做题 →</a>'}
function detailCenter(m){$("#detail").innerHTML='<span class="pill">中心概念</span><h3>'+esc(m.center)+'</h3><p>'+esc(m.logic)+'</p><div class="reason"><b>这张图的整理方式</b>中心概念 → 关键参数 → 使用情境 → 安全边界 → 易错辨析 → 跨章节关联</div><div class="ref" style="margin-top:10px">本图整理 '+m.items.length+' 个分支节点</div>'}
$("#tabs").innerHTML=MAPS.map((m,i)=>'<button data-i="'+i+'">'+esc(m.label)+'</button>').join("");document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>choose(Number(b.dataset.i)));$("#prev").onclick=()=>{offset=Math.max(0,offset-6);selected=-1;render()};$("#next").onclick=()=>{if(offset+6<MAPS[mi].items.length){offset+=6;selected=-1;render()}};choose(0);
</script></body></html>
