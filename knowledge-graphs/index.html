*{box-sizing:border-box}body{margin:0;background:#f7f3fb;color:#30283b;font:15px/1.65 "Microsoft YaHei","PingFang SC",system-ui,sans-serif}.wrap{max-width:1000px;margin:auto;padding:18px}.hero{background:linear-gradient(120deg,#553b8c,#8866bd);color:white;padding:27px;border-radius:23px}.eyebrow{font-size:12px;letter-spacing:.1em;font-weight:800}.hero h1{font-size:clamp(27px,5vw,42px);margin:5px 0}.hero p{margin:0}.share{display:inline-flex;margin-top:15px;padding:9px 14px;border:0;border-radius:99px;background:#fff;color:#644394;font-weight:800;cursor:pointer}.chain{display:flex;gap:8px;flex-wrap:wrap;padding:11px 13px;margin:14px 0;background:#eee7f6;border-radius:13px;color:#61488d;font-weight:800}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{background:white;border:1px solid #e2d6f1;border-radius:17px;padding:18px}.card h2{margin:4px 0}.card p{color:#786e83;margin:0 0 11px}.card small{color:#7150ae;font-weight:800}.actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.open{display:inline-block;background:#7150ae;color:white;text-decoration:none;font-weight:800;border-radius:10px;padding:8px 12px}.check{border:1px solid #d9c9ed;color:#68499e;background:#fff;border-radius:10px;padding:8px 11px;font:700 13px inherit;cursor:pointer}.check.done{background:#eaf6f2;color:#277b66;border-color:#bde3d7}.info{font-size:12px;color:#786e83;margin:12px 2px}.toast{min-height:20px;color:#277b66;font-size:12px;margin:9px 2px}

</style></head><body><main class="wrap"><header class="hero"><div class="eyebrow">ICE冰冰·高分学姐团</div><h1>四科总知识卡</h1><p>从一个考点出发，串起关键数值、使用情境、安全边界和跨章节联系。</p><button class="share" id="share">复制分享链接</button></header><div class="chain"><span>中心概念</span>→<span>关键参数</span>→<span>使用情境</span>→<span>安全边界</span>→<span>跨章节关联</span></div><div id="toast" class="toast" aria-live="polite"></div><section class="grid">

</section><p class="info">打卡记录仅保存在当前浏览器设备，不会上传或汇总他人记录。把本页地址转发给同学即可打开四科入口。</p></main><script>
const key="ice-four-course-graph-checkins-v1";const date=new Date().toLocaleDateString("sv-SE");let logs=[];try{logs=JSON.parse(localStorage.getItem(key)||"[]")}catch{}
function render(){document.querySelectorAll("[data-check]").forEach(b=>{const done=logs.some(x=>x.date===date&&x.subject===b.dataset.check);b.classList.toggle("done",done);b.textContent=done?"今日已打卡 ✓":"今日复习打卡"})}
document.querySelectorAll("[data-check]").forEach(b=>b.onclick=()=>{if(!logs.some(x=>x.date===date&&x.subject===b.dataset.check)){logs.push({date,subject:b.dataset.check});localStorage.setItem(key,JSON.stringify(logs));document.getElementById("toast").textContent="已记录本科学习打卡。"}render()});
document.getElementById("share").onclick=async()=>{const url=location.origin+location.pathname;try{await navigator.clipboard.writeText(url);document.getElementById("toast").textContent="四科总知识卡链接已复制，可以转发。"}catch{document.getElementById("toast").textContent="请复制浏览器地址栏中的链接进行分享。"}};
render();
</script></body></html>
