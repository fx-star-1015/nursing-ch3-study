<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>基护知识点关系图 Demo</title><style>
:root{--ink:#30283b;--muted:#7c7187;--purple:#7352b5;--line:#e2d6f1;--bg:#f7f3fb;--teal:#dff3ee;--gold:#fff2cf}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Microsoft YaHei",sans-serif}.wrap{max-width:1150px;margin:auto;padding:22px}.hero{padding:26px 30px;border-radius:24px;color:white;background:linear-gradient(120deg,#553b8c,#8866bd)}.hero small{letter-spacing:.12em}.hero h1{margin:6px 0;font-size:clamp(26px,4vw,40px)}.hero p{margin:0;opacity:.9}.tabs{display:flex;gap:9px;margin:16px 0;flex-wrap:wrap}.tabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 16px;color:var(--purple);font-weight:700;cursor:pointer}.tabs button.active{background:var(--purple);color:white}.layout{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(280px,.8fr);gap:16px}.panel{background:white;border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 10px 28px #4931660c}.panel h2{font-size:18px;margin:0 0 4px}.sub{color:var(--muted);font-size:13px;margin:0 0 8px}.map{width:100%;height:auto;min-height:430px}.edge{stroke:#c9b8df;stroke-width:2.5}.edge.active{stroke:#7752b7;stroke-width:4}.node{cursor:pointer}.node rect{fill:#fff;stroke:#d9caec;stroke-width:1.5;rx:15}.node.center rect{fill:#7150ae;stroke:#7150ae}.node.center text{fill:#fff;font-weight:800}.node text{fill:#352b42;font:700 15px "Microsoft YaHei",sans-serif;pointer-events:none}.node.active rect{fill:#f0e9fb;stroke:#8e6bc7;stroke-width:3}.node.center.active rect{fill:#543586}.node .tag{font-size:11px;font-weight:500;fill:#756b80}.node.center .tag{fill:#eee5ff}.detail{position:sticky;top:15px}.pill{display:inline-block;background:#f0e9fb;color:#67439c;border-radius:99px;padding:4px 10px;font-size:12px;font-weight:800}.detail h3{margin:12px 0 4px;font-size:23px}.detail p{color:#50465b}.detail .ref{padding:12px;background:#f6f2fa;border-radius:12px;color:#6c6079;font-size:13px}.footer{color:#8b8095;font-size:12px;margin-top:12px}.legend{display:flex;gap:14px;color:var(--muted);font-size:12px;margin:4px 0 0}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#7150ae;margin-right:5px}.dot2{background:#fff;border:1px solid #c9b8df}.dot3{background:#dff3ee}@media(max-width:760px){.wrap{padding:12px}.hero{padding:22px 20px}.layout{grid-template-columns:1fr}.map{min-height:0}.detail{position:static}}
.actions{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin:12px 0}.actions span{margin-right:auto;color:var(--muted);font-size:12px}.actions button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 13px;color:var(--purple);font:700 13px inherit;cursor:pointer}.actions button.primary{background:var(--purple);color:#fff}.actions button:active{transform:translateY(1px)}@media(max-width:760px){.actions{justify-content:stretch}.actions span{width:100%}.actions button{flex:1}}\n</style></head><body><main class="wrap"><header class="hero"><small>ICE冰冰·高分学姐团｜DEMO</small><h1>基护知识点关系图</h1><p>把分散在不同章节的“同一件事”连起来：从中心概念出发，查看用途、适用情境、温度浓度与安全边界。</p></header><div class="actions"><span id="checkinStatus">每日复习可在此打卡，记录保存在当前设备。</span><button class="primary" id="checkinBtn">今日完成打卡</button><button id="shareBtn">分享打卡链接</button></div><nav class="tabs"><button class="active" data-map="alcohol">乙醇 / 酒精擦浴</button><button data-map="temperature">冷、热疗的温度与用途</button></nav><section class="layout"><div class="panel"><h2 id="mapTitle">以“乙醇擦浴”为中心</h2><p class="sub">点击任一节点，右侧查看学习卡；关系图可继续扩展到其他章节。</p><svg class="map" id="graph" viewBox="0 0 720 460" role="img" aria-label="基护知识点关系图"></svg><div class="legend"><span><i class="dot"></i>中心概念</span><span><i class="dot2"></i>关联知识点</span><span><i class="dot3"></i>安全提示</span></div></div><aside class="panel detail" id="detail"></aside></section><p class="footer">Demo说明：浓度、温度与页码按当前基护网页整理，使用前请以你手头教材版本复核；示例不是临床操作指引。</p></main><script>
const data={alcohol:{title:'以“乙醇 / 酒精”为中心｜跨章节用途与辨析',center:'乙醇 / 酒精',nodes:[{id:'rub',label:'乙醇擦浴',tag:'25%–35% · 200–300 ml',x:360,y:58,kind:'normal',text:'用途：高热物理降温。教材整理值为25%～35%，约200～300 ml；禁擦胸前区、腹部、后颈和足底等部位。把浓度、用量、用途和禁擦部位作为一组记忆。',ref:'基础护理学第10章｜教材第248页'},{id:'lice',label:'百部含酸乙醇浸剂',tag:'30% · 灭虱',x:570,y:145,kind:'normal',text:'用途：灭虱。教材列出“30%百部含酸乙醇浸剂”；它是含百部、含酸的制剂，需与一般乙醇擦浴区分。',ref:'基础护理学第6章｜教材第164—165页'},{id:'fix',label:'痰细胞学固定',tag:'95%乙醇可选固定液',x:570,y:320,kind:'normal',text:'用途：痰细胞学标本固定。教材表中列出10%甲醛或95%乙醇；关键条件是细胞学标本留取后立即固定。',ref:'基础护理学第15章｜教材第411页'},{id:'false95',label:'精密器械消毒灭菌？',tag:'易错：不是正确用途',x:360,y:405,kind:'safe',text:'题目曾将95%乙醇作为精密医疗器械消毒与灭菌的干扰选项；该题正确答案为戊二醛。不要泛化为精密器械灭菌剂。',ref:'第3章题目｜教材第42—43页附近；本题答案戊二醛'},{id:'falseburn',label:'烫伤后涂90%乙醇？',tag:'易错：错误处理选项',x:150,y:320,kind:'safe',text:'热水袋烫伤情境中，“局部涂90%乙醇”是错误选项；本题正确项为立即停用并局部涂凡士林。',ref:'基础护理学第10章题目｜教材第250页'},{id:'falsecatheter',label:'导尿口常规酒精消毒？',tag:'题干干扰项待核教材',x:150,y:145,kind:'safe',text:'导尿题中出现“留置期间用酒精棉球消毒尿道口及外阴”的选项，但现有网页题目答案并非该项。这里标为辨析线索，不当作推荐做法；具体规范需按教材复核。',ref:'基础护理学第12章题目'}]},temperature:{title:'以“冷、热疗温度”为中心',center:'温度 × 治疗目的',nodes:[{id:'coldwet',label:'冷湿敷',tag:'18–20℃',x:185,y:115,kind:'normal',text:'冷湿敷：18～20℃，每3～5分钟更换，总计15～20分钟。适合串联局部冷疗的操作参数与观察。',ref:'基础护理学第10章｜教材第246页'},{id:'warm',label:'温水擦浴',tag:'32–34℃',x:535,y:115,kind:'normal',text:'温水擦浴：32～34℃，用于高热物理降温。记数值时同时记对象和用途。',ref:'基础护理学第10章｜教材第248页'},{id:'hotbag',label:'热水袋',tag:'一般60–70℃',x:185,y:350,kind:'normal',text:'热水袋：一般60～70℃；老年、婴幼儿、昏迷等患者约50℃。题目常考特殊人群与烫伤风险。',ref:'基础护理学第10章｜教材第250页'},{id:'hotwet',label:'热湿敷',tag:'50–60℃',x:535,y:350,kind:'normal',text:'热湿敷：50～60℃，每3～5分钟更换；总时间需结合患者耐受情况。',ref:'基础护理学第10章｜教材第252页'},{id:'duration',label:'冷热疗持续时间',tag:'20–30 min · 间隔约1 h',x:360,y:230,kind:'safe',text:'冷热疗一般持续20～30分钟，间隔约1小时；与具体方法的温度参数分开记，再通过“方法—参数—观察”串联。',ref:'基础护理学第10章｜教材第242页'}]}};
let current='alcohol',selected='rub';const svg=document.getElementById('graph');const detail=document.getElementById('detail');function render(){const d=data[current];document.getElementById('mapTitle').textContent=d.title;let cx=360,cy=230;let edges=d.nodes.map(n=>`<line class="edge ${selected===n.id?'active':''}" x1="${cx}" y1="${cy}" x2="${n.x}" y2="${n.y}"/>`).join('');let center=`<g class="node center" data-id="center"><rect x="${cx-88}" y="${cy-32}" width="176" height="64"/><text x="${cx}" y="${cy-2}" text-anchor="middle">${d.center}</text><text class="tag" x="${cx}" y="${cy+19}" text-anchor="middle">中心概念</text></g>`;let nodes=d.nodes.map(n=>`<g class="node ${selected===n.id?'active':''}" data-id="${n.id}"><rect x="${n.x-90}" y="${n.y-34}" width="180" height="68" style="${n.kind==='safe'?'fill:#eff9f6;stroke:#c5e7dc':''}"/><text x="${n.x}" y="${n.y-4}" text-anchor="middle">${n.label}</text><text class="tag" x="${n.x}" y="${n.y+18}" text-anchor="middle">${n.tag}</text></g>`).join('');svg.innerHTML=edges+center+nodes;svg.querySelectorAll('.node').forEach(el=>el.onclick=()=>{selected=el.dataset.id==='center'?(d.nodes[0].id):el.dataset.id;render()});const n=d.nodes.find(x=>x.id===selected)||d.nodes[0];detail.innerHTML=`<span class="pill">${n.kind==='safe'?'安全边界':'关联知识点'}</span><h3>${n.label}</h3><p>${n.text}</p><div class="ref">${n.ref}</div><p class="footer">图谱思路：中心概念 → 关键参数 → 使用情境 → 安全边界 → 跨章节关联</p>`}document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{current=b.dataset.map;selected=data[current].nodes[0].id;document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('active',x===b));render()});render();
const checkinKey='ice-knowledge-graph-checkins-v1';
const today=new Date().toLocaleDateString('sv-SE');
function updateCheckin(){let logs=[];try{logs=JSON.parse(localStorage.getItem(checkinKey)||'[]')}catch{}const done=logs.some(x=>x.date===today);document.getElementById('checkinStatus').textContent=done?'今日已完成打卡 · 记录保存在当前设备。':'每日复习可在此打卡，记录保存在当前设备。';document.getElementById('checkinBtn').textContent=done?'今日已打卡 ✓':'今日完成打卡'}
document.getElementById('checkinBtn').onclick=()=>{let logs=[];try{logs=JSON.parse(localStorage.getItem(checkinKey)||'[]')}catch{}if(!logs.some(x=>x.date===today)){logs.push({date:today,map:current,concept:data[current].nodes.find(x=>x.id===selected)?.label||data[current].center});localStorage.setItem(checkinKey,JSON.stringify(logs))}updateCheckin()};
document.getElementById('shareBtn').onclick=async()=>{const url=location.origin+location.pathname;try{if(navigator.share)await navigator.share({title:'基护知识点关系图｜学习打卡',text:'一起用关系图串联基护考点',url});else{await navigator.clipboard.writeText(url);document.getElementById('checkinStatus').textContent='链接已复制，可以转发给同学。'}}catch(e){}};
updateCheckin();
</script></body></html>
