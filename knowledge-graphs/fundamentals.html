ill:#eff9f6;stroke:#c1e5da}.legend{display:flex;gap:13px;color:var(--muted);font-size:12px;margin:2px 0 0;flex-wrap:wrap}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#7150ae;margin-right:5px}.dot2{background:#fff;border:1px solid #c9b8df}.dot3{background:#dff3ee}.detail{position:sticky;top:12px;align-self:start;min-height:100%}.pill{display:inline-block;background:#f0e9fb;color:#67439c;border-radius:99px;padding:4px 10px;font-size:12px;font-weight:800}.detail h3{margin:10px 0 5px;font-size:22px}.detail p{color:#50465b}.detail .value{font-size:19px;color:#68449f;font-weight:800;margin:8px 0}.ref{padding:11px;background:#f6f2fa;border-radius:11px;color:#6c6079;font-size:13px}.reason{background:#f7f3fb;border-left:3px solid var(--purple);padding:10px 12px;border-radius:9px;font-size:13px;margin-top:11px}.reason b{display:block;color:#634492;margin-bottom:3px}.small{color:var(--muted);font-size:12px}.detail a{color:#6645a0;font-weight:700}.pager{display:flex;justify-content:center;align-items:center;gap:9px;margin:5px 0}.pager button{border:1px solid var(--line);background:white;color:var(--purple);border-radius:9px;padding:6px 11px;cursor:pointer}.pager span{font-size:12px;color:var(--muted)}.footer{color:#8b8095;font-size:11px;margin:10px 2px}

</style></head><body><main class="wrap"><header class="hero"><small>ICE冰冰·高分学姐团｜跨章节主题图谱</small><h1>基础护理学知识点关系图</h1><p>把一个中心考点放在中间，串起散落在不同章节的用途、数值、题目情境和易错边界。</p></header><nav class="course-nav"><a href="fundamentals.html" class="on">基础护理</a><a href="introduction.html" class="">护理导论</a><a href="medical.html" class="">内科护理</a><a href="surgical.html" class="">外科护理</a></nav><div class="tabs" id="tabs"></div><section class="layout"><div class="panel"><h2 id="mapTitle"></h2><p class="sub">选一个中心考点，沿分支查看关键参数、使用情境、易混点和教材来源。</p><svg class="map" id="graph" viewBox="0 0 720 468" role="img" aria-label="基础护理学跨章节知识关系图"></svg><div class="pager"><button id="prev">‹ 上一组</button><span id="pageText"></span><button id="next">下一组 ›</button></div><div class="legend"><span><i class="dot"></i>中心概念</span><span><i class="dot2"></i>用途 / 数值 / 跨章关联</span><span><i class="dot3"></i>易错与安全边界</span></div></div><aside class="panel detail" id="detail"></aside></section><p class="footer">中心主题由跨章节考点组织。每个分支保留来源章节与页码；易错节点说明常见混淆，关键数值连同适用条件一起呈现。</p></main><script>
const MAPS=[{"id":"ethanol","label":"乙醇 / 酒精擦浴","center":"乙醇 / 酒精","logic":"同一化学成分出现在不同章节，不能只记“酒精有消毒作用”。先看制剂和目的，再把浓度、对象、部位配成一组：擦浴用于高热物理降温；百部含酸乙醇浸剂用于灭虱；95%乙醇可用于痰细胞学固定。","items":[{"type":"number","label":"乙醇擦浴","tag":"25%～35%，约200～300 ml","detail":"乙醇擦浴：25%～35%，约200～300 ml。适用条件：禁擦胸前区、腹部、后颈和足底等","ref":"教材第248页","chapter":"基础护理学第10章｜冷、热疗法","href":"fundamentals/ch10-heat-cold.html","kind":"normal"},{"type":"number","label":"百部灭虱","tag":"30%百部含酸乙醇浸剂","detail":"百部灭虱：30%百部含酸乙醇浸剂。适用条件：按操作要求包裹并彻底清洁","ref":"教材第164—165页","chapter":"基础护理学第6章｜患者的清洁卫生","href":"fundamentals/ch06-hygiene.html","kind":"normal"},{"type":"number","label":"痰细胞学固定","tag":"10%甲醛或95%乙醇","detail":"痰细胞学固定：10%甲醛或95%乙醇。适用条件：留取后立即固定","ref":"教材第411页","chapter":"基础护理学第15章｜标本采集","href":"fundamentals/ch15-specimen-collection.html","kind":"normal"},{"type":"confusion","label":"擦浴 ≠ 灭虱","tag":"25%～35% ≠ 30%","detail":"擦浴和灭虱制剂虽然都含乙醇，但一个是物理降温，一个是百部含酸制剂灭虱；浓度不能脱离配方和目的互换。","ref":"教材第164—165页；第248页","chapter":"基础护理学第6章 / 第10章","href":"fundamentals/ch10-heat-cold.html","kind":"safe"},{"type":"confusion","label":"高浓度 ≠ 万能消毒剂","tag":"95%乙醇不是器械灭菌答案","detail":"精密医疗器械的处理要先按物品风险与接触部位选消毒/灭菌方法，不能用“浓度更高”推导“效果更合适”。","ref":"教材第42—43页","chapter":"基础护理学第3章｜预防与控制医院感染","href":"fundamentals/ch03-infection-control.html","kind":"safe"},{"type":"confusion","label":"烫伤后涂90%乙醇？","tag":"错误处理选项","detail":"热水袋烫伤情境中，局部涂90%乙醇是错误选项；要先停用热源，再按教材处理局部损伤。","ref":"教材第250页","chapter":"基础护理学第10章｜冷、热疗法","href":"fundamentals/ch10-heat-cold.html","kind":"safe"}]},{"id":"temperature","label":"冷、热疗：温度怎么和用途配","center":"温度 × 治疗目的","logic":"先从治疗目的推方法：冷疗用于局部降温、减轻出血/肿胀等；热疗用于促进局部循环、缓解肌痉挛等。确定方法后再记对应温度、时间和特殊人群边界，不能把温度单独背。","items":[{"type":"number","label":"冷热疗持续时间","tag":"一般20～30 min，间隔约1 h","detail":"冷热疗持续时间：一般20～30 min，间隔约1 h。适用条件：防止继发效应和组织损伤","ref":"教材第242页","chapter":"基础护理学第10章｜冷、热疗法","href":"fundamentals/ch10-heat-cold.html","kind":"normal"},{"type":"number","label":"冰袋装量","tag":"约1/2～2/3满","detail":"冰袋装量：约1/2～2/3满。适用条件：排气并检查漏水","ref":"教材第245页","chapter":"基础护理学第10章｜冷、热疗法","href":"fundamentals/ch10-heat-cold.html","kind":"normal"},{"type":"number","label":"冰袋降温停用线","tag":"体温降至39℃以下","detail":"冰袋降温停用线：体温降至39℃以下。适用条件：停用后30 min复测","ref":"教材第245页","chapter":"基础护理学第10章｜冷、热疗法","href":"fundamentals/ch10-heat-cold.html","kind":"safe"},{"type":"number","label":"冷湿敷","tag":"18～20℃，每3～5 min更换，共15～20 min","detail":"冷湿敷：18～20℃，每3～5 min更换，共15～20 min。适用条件：保持敷布低温","ref":"教材第246页","chapter":"基础护理学第10章｜冷、热疗法","href":"fundamentals/ch10-heat-cold.html","kind":"normal"},{"type":"number","label":"温水擦浴","tag":"32～34℃","detail":"温水擦浴：32～34℃。适用条件：高热物理降温","ref":"教材第248页","chapter":"基础护理学第10章｜冷、热疗法","href":"fundamentals/ch10-heat-cold.html","kind":"normal"},{"type":"number","label":"热水袋","tag":"一般60～70℃；老年、婴幼儿、昏迷等约50℃","detail":"热水袋：一般60～70℃；老年、婴幼儿、昏迷等约50℃。适用条件：装1/2～2/3满并加布套","ref":"教材第250页","chapter":"基础护理学第10章｜冷、热疗法","href":"fundamentals/ch10-heat-cold.html","kind":"normal"},{"type":"number","label":"热湿敷","tag":"50～60℃，每3～5 min更换","detail":"热湿敷：50～60℃，每3～5 min更换。适用条件：总时间依耐受控制","ref":"教材第252页","chapter":"基础护理学第10章｜冷、热疗法","href":"fundamentals/ch10-heat-cold.html","kind":"normal"},{"type":"number","label":"红外线灯","tag":"距患处30～50 cm，照射20～30 min","detail":"红外线灯：距患处30～50 cm，照射20～30 min。适用条件：以温热舒适、皮肤粉红为宜","ref":"教材第253页","chapter":"基础护理学第10章｜冷、热疗法","href":"fundamentals/ch10-heat-cold.html","kind":"normal"},{"type":"number","label":"低温烫伤","tag":"可发生于43～60℃持续接触","detail":"低温烫伤：可发生于43～60℃持续接触。适用条件：感觉障碍和昏迷患者风险高","ref":"教材第256页","chapter":"基础护理学第10章｜冷、热疗法","href":"fundamentals/ch10-heat-cold.html","kind":"safe"},{"type":"concept","label":"冷疗禁忌","tag":"适用情境","detail":"血液循环障碍、组织损伤、对冷过敏及枕后耳廓阴囊心前区腹部足底等慎禁。 易考线索：题干常给部位让选是否可用冰袋。","ref":"教材第243—249页","chapter":"基础护理学第10章｜冷、热疗法","href":"fundamentals/ch10-heat-cold.html","kind":"normal"},{"type":"concept","label":"冷热疗共同边界","tag":"适用情境","detail":"使用前评估皮肤感觉、循环、意识和治疗部位；过程中观察颜色、疼痛和全身反应。 易考线索：昏迷、感觉障碍和末梢循环差者最易发生损伤。","ref":"教材第241—244页","chapter":"基础护理学第10章｜冷、热疗法","href":"fundamentals/ch10-heat-cold.html","kind":"normal"},{"type":"confusion","label":"最易错：方法和温度串线","tag":"18～20℃ / 32～34℃ / 50～70℃","detail":"冷湿敷18～20℃；温水擦浴32～34℃；热湿敷50～60℃；热水袋一般60～70℃，老年、婴幼儿、昏迷者约50℃。每个值都要连回具体方法。","ref":"教材第246—253页","chapter":"基础护理学第10章｜冷、热疗法","href":"fundamentals/ch10-heat-cold.html","kind":"safe"}]},{"id":"infection","label":"消毒与灭菌：先定风险再选方法","center":"消毒剂 × 物品风险","logic":"顺序是“物品用途/接触部位 → 需要的处理水平 → 方法与参数 → 效果监测”。进入无菌组织或血管系统的物品需灭菌；接触完整黏膜的物品需匹配高水平消毒；再核浓度、时间和监测。","items":[{"type":"number","label":"下排气式压力蒸汽灭菌","tag":"121℃、102.8～122.9 kPa；器械20 min、敷料30 min","detail":"下排气式压力蒸汽灭菌：121℃、102.8～122.9 kPa；器械20 min、敷料30 min。适用条件：压力达到后计算时间","ref":"教材第32页","chapter":"基础护理学第3章｜预防与控制医院感染","href":"fundamentals/ch03-infection-control.html","kind":"normal"},{"type":"number","label":"预真空压力蒸汽灭菌","tag":"132℃或134℃，维持4 min","detail":"预真空压力蒸汽灭菌：132℃或134℃，维持4 min。适用条件：按设备压力范围和装载要求执行","ref":"教材第32页","chapter":"基础护理学第3章｜预防与控制医院感染","href":"fundamentals/ch03-infection-control.html","kind":"normal"},{"type":"number","label":"煮沸消毒","tag":"100℃，一般5～10 min；灭菌需≥15 min","detail":"煮沸消毒：100℃，一般5～10 min；灭菌需≥15 min。适用条件：海拔每升高300 m延长2 min","ref":"教材第33页","chapter":"基础护理学第3章｜预防与控制医院感染","href":"fundamentals/ch03-infection-control.html","kind":"normal"},{"type":"number","label":"紫外线空气消毒","tag":"30 W灯距地面约2 m，照射≥30 min；≥1.5 W/m³","detail":"紫外线空气消毒：30 W灯距地面约2 m，照射≥30 min；≥1.5 W/m³。适用条件：照射5～7 min后开始计时","ref":"教材第33页","chapter":"基础护理学第3章｜预防与控制医院感染","href":"fundamentals/ch03-infection-control.html","kind":"normal"},{"type":"number","label":"紫外线表面消毒","tag":"距物品25～60 cm，照射20～30 min","detail":"紫外线表面消毒：距物品25～60 cm，照射20～30 min。适用条件：物品摊开或悬挂扩大照射面","ref":"教材第33页","chapter":"基础护理学第3章｜预防与控制医院感染","href":"fundamentals/ch03-infection-control.html","kind":"normal"},{"type":"number","label":"含氯消毒剂","tag":"400～700 mg/L作用30 min","detail":"含氯消毒剂：400～700 mg/L作用30 min。适用条件：常用环境物表消毒范围，现配现用","ref":"教材第42—43页","chapter":"基础护理学第3章｜预防与控制医院感染","href":"fundamentals/ch03-infection-control.html","kind":"normal"},{"type":"number","label":"卫生手消毒效果","tag":"≤10 CFU/cm²","detail":"卫生手消毒效果：≤10 CFU/cm²。适用条件：卫生手消毒监测","ref":"教材第46页","chapter":"基础护理学第3章｜预防与控制医院感染","href":"fundamentals/ch03-infection-control.html","kind":"normal"},{"type":"number","label":"外科手消毒效果","tag":"≤5 CFU/cm²","detail":"外科手消毒效果：≤5 CFU/cm²。适用条件：外科手消毒监测","ref":"教材第46页","chapter":"基础护理学第3章｜预防与控制医院感染","href":"fundamentals/ch03-infection-control.html","kind":"normal"},{"type":"number","label":"灭菌包限重","tag":"器械包≤7 kg；敷料包≤5 kg","detail":"灭菌包限重：器械包≤7 kg；敷料包≤5 kg。适用条件：保证蒸汽穿透","ref":"教材第32页","chapter":"基础护理学第3章｜预防与控制医院感染","href":"fundamentals/ch03-infection-control.html","kind":"normal"},{"type":"number","label":"高压灭菌冷却","tag":"一般＞30 min","detail":"高压灭菌冷却：一般＞30 min。适用条件：干燥冷却后再卸载","ref":"教材第32页","chapter":"基础护理学第3章｜预防与控制医院感染","href":"fundamentals/ch03-infection-control.html","kind":"normal"},{"type":"concept","label":"清洁消毒灭菌","tag":"用途/边界","detail":"先看目标层级和物品用途，再选择方法、参数与监测。 易考线索：高风险物品需要灭菌，方法正确还要过程合格。","ref":"教材第30—44页","chapter":"基础护理学第3章｜预防与控制医院感染","href":"fundamentals/ch03-infection-control.html","kind":"safe"},{"type":"concept","label":"无菌技术","tag":"用途/边界","detail":"检查包装、日期和状态，划清无菌区，防止跨越、回流和接触污染。 易考线索：同一数字必须对应具体对象与起算时间。","ref":"教材第51—60页","chapter":"基础护理学第3章｜预防与控制医院感染","href":"fundamentals/ch03-infection-control.html","kind":"normal"},{"type":"concept","label":"无菌边界","tag":"用途/边界","detail":"跨越无菌区、手臂低于腰部、无菌物品受潮或接触非无菌面均视为污染。 易考线索：情境题要说出哪一步破坏了无菌边界。","ref":"教材第51—60页","chapter":"基础护理学第3章｜预防与控制医院感染","href":"fundamentals/ch03-infection-control.html","kind":"normal"},{"type":"concept","label":"手卫生","tag":"用途/边界","detail":"依据时机、可见污染和操作风险选择洗手或手消毒，手套不能替代。 易考线索：常考五时刻、方法选择和效果监测。","ref":"教材第45—51页","chapter":"基础护理学第3章｜预防与控制医院感染","href":"fundamentals/ch03-infection-control.html","kind":"safe"},{"type":"concept","label":"隔离技术","tag":"用途/边界","detail":"标准预防用于所有患者，再按接触、飞沫或空气传播增加措施。 易考线索：先判断保护谁和传播途径，再选安置与防护。","ref":"教材第60—74页","chapter":"基础护理学第3章｜预防与控制医院感染","href":"fundamentals/ch03-infection-control.html","kind":"normal"},{"type":"confusion","label":"消毒 ≠ 灭菌","tag":"先看物品风险分级","detail":"高水平消毒不自动等于灭菌。题目给物品用途时，先判断是否 als/ch09-vital-signs.html","kind":"safe"},{"type":"number","label":"高流量鼻导管","tag":"约8～80 L/min，FiO₂ 21%～100%","detail":"高流量鼻导管：约8～80 L/min，FiO₂ 21%～100%。适用条件：需加温加湿","ref":"教材第236页","chapter":"基础护理学第9章｜生命体征的评估与护理","href":"fundamentals/ch09-vital-signs.html","kind":"normal"},{"type":"number","label":"Ⅱ型呼衰氧疗","tag":"常用1～2 L/min持续低流量","detail":"Ⅱ型呼衰氧疗：常用1～2 L/min持续低流量。适用条件：同时观察意识、呼吸和血气","ref":"教材第236页","chapter":"基础护理学第9章｜生命体征的评估与护理","href":"fundamentals/ch09-vital-signs.html","kind":"normal"},{"type":"number","label":"端坐位","tag":"床头70°～80°","detail":"端坐位：床头70°～80°。适用条件：严重呼吸困难、急性肺水肿","ref":"教材第91页","chapter":"基础护理学第4章｜患者入院和出院的护理","href":"fundamentals/ch04-admission-discharge.html","kind":"normal"},{"type":"concept","label":"氧疗","tag":"情境/安全边界","detail":"先判断低氧和病因，选择装置、流量与湿化，持续评价效果和不良反应。 易考线索：慢性Ⅱ型呼衰常考低流量、低浓度持续给氧。","ref":"教材第230—239页","chapter":"基础护理学第9章｜生命体征的评估与护理","href":"fundamentals/ch09-vital-signs.html","kind":"normal"},{"type":"concept","label":"给氧安全","tag":"情境/安全边界","detail":"氧疗是用药，需核对装置、流量和目标，防火防油防震，观察疗效和二氧化碳潴留。 易考线索：Ⅱ型呼衰不能因低氧擅自调成高流量。","ref":"教材第231—237页","chapter":"基础护理学第9章｜生命体征的评估与护理","href":"fundamentals/ch09-vital-signs.html","kind":"safe"},{"type":"concept","label":"呼吸","tag":"情境/安全边界","detail":"患者不知情时连续观察频率、节律、深浅、声音和困难程度。 易考线索：异常呼吸要同时联系病因和护理。","ref":"教材第226—230页","chapter":"基础护理学第9章｜生命体征的评估与护理","href":"fundamentals/ch09-vital-signs.html","kind":"normal"},{"type":"concept","label":"人工呼吸器","tag":"情境/安全边界","detail":"监测通气、氧合、同步性、报警、湿化和管路安全，预防相关并发症。 易考线索：报警先看患者，再查机器和管路。","ref":"教材第461—464页","chapter":"基础护理学第17章｜病情观察及危重患者的管理","href":"fundamentals/ch17-critical-care.html","kind":"normal"},{"type":"confusion","label":"流量 ≠ 氧浓度","tag":"FiO₂≈21＋4×氧流量","detail":"鼻导管低流量估算不能直接套用到高流量系统；Ⅱ型呼吸衰竭给氧还要按目标和病情持续观察血气、意识与呼吸。","ref":"教材第230—239页","chapter":"基础护理学第9章｜生命体征的评估与护理","href":"fundamentals/ch09-vital-signs.html","kind":"safe"},{"type":"concept","label":"卧位从目的和病情反推","tag":"跨章节关联","detail":"先看意识、呼吸、循环和治疗目的，再核对禁忌、管路与安全条件。","ref":"教材第89—94页","chapter":"基础护理学第4章｜患者入院和出院的护理","hre const nodes=shown.map((n,j)=>{const [x,y]=slots[j],clz="node "+(n.kind==="safe"||n.type==="confusion"?"safe":"")+(selected===offset+j?" active":""),ll=wrap(n.label,13),tt=wrap(n.tag,22);return '<g class="'+clz+'" data-item="'+(offset+j)+'"><rect x="'+(x-92)+'" y="'+(y-39)+'" width="184" height="78" rx="14"/><text x="'+x+'" y="'+(y-12-(ll.length>1?7:0))+'" text-anchor="middle">'+ll.map((z,i)=>'<tspan x="'+x+'" dy="'+(i?15:0)+'">'+esc(z)+'</tspan>').join("")+'</text><text class="tag" x="'+x+'" y="'+(y+18+(ll.length>1?2:0))+'" text-anchor="middle">'+tt.map((z,i)=>'<tspan x="'+x+'" dy="'+(i?12:0)+'">'+esc(z)+'</tspan>').join("")+'</text></g>'}).join("");
svg.innerHTML=edges+center+nodes;svg.querySelectorAll("[data-item]").forEach(g=>g.onclick=()=>{selected=Number(g.dataset.item);detailFor(m.items[selected]);highlight()});svg.querySelector("[data-center]").onclick=()=>detailCenter(m);
$("#pageText").textContent=list.length?String(offset+1)+"–"+String(Math.min(offset+6,list.length))+" / "+String(list.length)+" 个关联节点":"暂无可呈现的关联点";$("#prev").disabled=offset===0;$("#next").disabled=offset+6>=list.length;
if(selected<0&&shown.length){selected=offset;detailFor(list[offset])}highlight()}
function highlight(){svg.querySelectorAll("[data-item]").forEach(g=>g.classList.toggle("active",Number(g.dataset.item)===selected))}
function detailFor(n){const kind=n.type==="number"?"关键参数":n.type==="confusion"||n.kind==="safe"?"易混易错":"跨章节考点";$("#detail").innerHTML='<span class="pill">'+kind+'</span><h3>'+esc(n.label)+'</h3>'+(n.type==="number"?'<div class="value">'+esc(n.tag)+'</div>':'<p class="small">'+esc(n.tag)+'</p>')+'<p>'+esc(n.detail)+'</p><div class="reason"><b>怎么推演</b>'+esc(MAPS[mi].logic)+'</div><div class="ref" style="margin-top:10px">'+esc(n.ref||n.chapter)+'<br>'+esc(n.chapter)+'</div><p class="small">中心考点：'+esc(MAPS[mi].center)+'</p><a href="../'+esc(n.href||MAPS[mi].items[0]?.href||"")+'">打开对应章节继续核对与做题 →</a>'}
function detailCenter(m){$("#detail").innerHTML='<span class="pill">中心概念</span><h3>'+esc(m.center)+'</h3><p>'+esc(m.logic)+'</p><div class="reason"><b>这张图的整理方式</b>中心概念 → 关键参数 → 使用情境 → 安全边界 → 易错辨析 → 跨章节关联</div><div class="ref" style="margin-top:10px">本图整理 '+m.items.length+' 个分支节点</div>'}
$("#tabs").innerHTML=MAPS.map((m,i)=>'<button data-i="'+i+'">'+esc(m.label)+'</button>').join("");document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>choose(Number(b.dataset.i)));$("#prev").onclick=()=>{offset=Math.max(0,offset-6);selected=-1;render()};$("#next").onclick=()=>{if(offset+6<MAPS[mi].items.length){offset+=6;selected=-1;render()}};choose(0);
</script></body></html>
