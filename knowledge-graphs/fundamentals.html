<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>基础护理学｜跨章节知识图谱</title><style>
:root{--ink:#30283b;--muted:#786e83;--purple:#7150ae;--line:#e2d6f1;--bg:#f7f3fb;--safe:#e9f6f2;--warn:#fff4dc}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 "Microsoft YaHei",sans-serif}.wrap{max-width:1120px;margin:auto;padding:20px}.hero{color:#fff;padding:25px 28px;border-radius:24px;background:linear-gradient(120deg,#553b8c,#8866bd)}.hero small{letter-spacing:.1em}.hero h1{margin:5px 0;font-size:clamp(26px,4vw,38px)}.hero p{margin:0;opacity:.93}.crumb{display:block;margin-top:10px;color:#f4edff}.layout{display:grid;grid-template-columns:1.3fr .8fr;gap:15px;margin-top:16px}.panel{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 10px 28px #4931660c}.panel h2{font-size:19px;margin:0}.muted{color:var(--muted);font-size:13px;margin:4px 0 12px}.map{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:stretch}.center{grid-column:1/-1;text-align:center;color:#fff;background:var(--purple);padding:12px;border-radius:15px;font-weight:800}.center small{display:block;color:#eee5ff;font-weight:400}.node{border:1px solid var(--line);border-radius:15px;padding:12px;background:#fff;cursor:pointer;text-align:left;color:var(--ink);font:inherit;min-height:92px}.node:hover,.node:focus{border-color:#8d6bc4;background:#f8f4fc;outline:2px solid #eee5fa}.node.safe{background:var(--safe);border-color:#c5e7dc}.node.warn{background:var(--warn);border-color:#ead9aa}.node b{display:block;font-size:15px}.node small{display:block;color:var(--muted);margin-top:3px}.badge{font-size:11px;color:#67439c;font-weight:800}.detail{position:sticky;top:14px}.pill{display:inline-block;padding:3px 9px;background:#f0e9fb;color:#67439c;border-radius:99px;font-size:12px;font-weight:800}.source{background:#f6f2fa;border-radius:11px;padding:11px;font-size:13px;color:#6f647c}.foot{font-size:12px;color:#83788e;margin-top:14px}@media(max-width:760px){.wrap{padding:11px}.hero{padding:21px}.layout{grid-template-columns:1fr}.detail{position:static}.map{gap:8px}.node{padding:10px;font-size:14px}}
 .logic{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:13px 0 0;padding:10px 12px;background:#f4effa;border-radius:12px;font-size:13px;color:#61488d}.logic b{font-weight:800}.logic i{font-style:normal;color:#ad98c9}@media(max-width:600px){.logic{font-size:12px}}\n</style></head><body><main class="wrap"><header class="hero"><small>ICE冰冰·高分学姐团｜跨章节主题卡</small><h1>基础护理学知识图谱</h1><p>从一个常见物质出发，串联不同章节的真实用途、浓度条件和题目陷阱。</p><a class="crumb" href="../">← 返回护理考研学习中心</a></header><div class="logic"><b>中心概念</b><i>→</i><b>关键参数</b><i>→</i><b>使用情境</b><i>→</i><b>安全边界</b><i>→</i><b>跨章节关联</b></div><div class="layout"><section class="panel"><h2>以“乙醇 / 酒精”为中心</h2><p class="muted">点击节点，查看它在不同章节中的位置、正误辨析和记忆线索。</p><div class="map"><div class="center">乙醇 / 酒精<small>中心概念 · 跨章串联</small></div><button class="node " data-i="0"><b>乙醇擦浴</b><small>25%–35% · 约200–300 ml</small><span class="badge">知识分支</span></button><button class="node " data-i="1"><b>百部含酸乙醇浸剂</b><small>30% · 灭虱</small><span class="badge">知识分支</span></button><button class="node " data-i="2"><b>痰细胞学标本固定</b><small>95%乙醇可选固定液</small><span class="badge">知识分支</span></button><button class="node warn" data-i="3"><b>95%乙醇用于精密器械？</b><small>错误选项；该题答案为戊二醛</small><span class="badge">⚠ 易错辨析</span></button><button class="node warn" data-i="4"><b>烫伤后涂90%乙醇？</b><small>错误处理选项</small><span class="badge">⚠ 易错辨析</span></button><button class="node warn" data-i="5"><b>导尿口用酒精棉球常规消毒？</b><small>题目混淆项，需按版本复核</small><span class="badge">⚠ 易错辨析</span></button></div><p class="foot">图卡原则：正确用途与错误说法分开标识；教材版本或题源未确认时明确提示复核。</p></section><aside class="panel detail" id="detail"><span class="pill">知识分支</span><h2>乙醇擦浴</h2><p>用于高热物理降温。禁擦胸前区、腹部、后颈和足底等部位。把用途、浓度、用量与禁擦部位作为一组记忆。</p><div class="source">基护第10章｜教材P248</div></aside></div></main><script>const nodes=[{"title":"乙醇擦浴","short":"25%–35% · 约200–300 ml","body":"用于高热物理降温。禁擦胸前区、腹部、后颈和足底等部位。把用途、浓度、用量与禁擦部位作为一组记忆。","source":"基护第10章｜教材P248"},{"title":"百部含酸乙醇浸剂","short":"30% · 灭虱","body":"教材列出30%百部含酸乙醇浸剂用于灭虱。它是含百部、含酸的制剂，不等同于一般乙醇擦浴。","source":"基护第6章｜教材P164–165"},{"title":"痰细胞学标本固定","short":"95%乙醇可选固定液","body":"痰细胞学标本可用10%甲醛或95%乙醇固定，留取后需及时固定。不要把标本固定用途与器械消毒混为一谈。","source":"基护第15章｜教材P411"},{"title":"95%乙醇用于精密器械？","short":"错误选项；该题答案为戊二醛","body":"历年题把95%乙醇放进精密医疗器械消毒灭菌题作为干扰项，正确答案为戊二醛。这是“题干出现”而非“正确用途”。","source":"基护第3章真题整理｜教材P42–43","kind":"warn"},{"title":"烫伤后涂90%乙醇？","short":"错误处理选项","body":"热水袋烫伤题中，涂90%乙醇为错误选项；题目正确项是立即停用并局部涂凡士林。","source":"基护第10章题目｜教材P250","kind":"warn"},{"title":"导尿口用酒精棉球常规消毒？","short":"题目混淆项，需按版本复核","body":"这一说法出现在留置导尿题的干扰选项里。网页该题答案并非此项，因此图中只列为辨析线索，不作为正确护理做法；规范以所用教材为准。","source":"基护第12章题目｜具体护理规范待教材复核","kind":"warn"}];document.querySelectorAll('.node').forEach(b=>b.onclick=()=>{const n=nodes[+b.dataset.i];document.querySelector('#detail').innerHTML='<span class="pill">'+(n.kind==='warn'?'易错辨析':n.kind==='safe'?'安全边界':'知识分支')+'</span><h2>'+n.title+'</h2><p>'+n.body+'</p><div class="source">'+n.source+'</div>'});</script></body></html>
