</style></head><body><main class="wrap"><header class="hero"><small>ICE冰冰·高分学姐团｜全书关系图</small><h1>基础护理学知识点关系图</h1><p>把分散在不同章节的同一件事连起来：从中心概念查看用途、适用情境、关键数值与安全边界。</p></header><nav class="course-nav"><a href="fundamentals.html" class="on">基础护理</a><a href="introduction.html" class="">护理导论</a><a href="medical.html" class="">内科护理</a><a href="surgical.html" class="">外科护理</a></nav><div class="tabs" id="quick"></div><div class="map-select"><input id="searchMap" placeholder="搜中心概念、章节或参数"><select id="mapPick" aria-label="选择知识图谱"></select></div><section class="layout"><div class="panel"><h2 id="mapTitle"></h2><p class="sub">点选分支查看数值、用途、条件、安全边界和教材依据。</p><svg class="map" id="graph" viewBox="0 0 720 468" role="img" aria-label="基础护理学中心概念关系图"></svg><div class="pager"><button id="prev">‹ 上一组</button><span id="pageText"></span><button id="next">下一组 ›</button></div><div class="legend"><span><i class="dot"></i>中心概念</span><span><i class="dot2"></i>关键参数 / 关联考点</span><span><i class="dot3"></i>安全边界</span><span><i class="dot4"></i>跨章节联系</span></div></div><aside class="panel detail" id="detail"></aside></section><p class="footer">数值节点保留页面整理中的原值、条件和教材页码；不凭空补数。跨章节联系按共同主题词推荐，复习时可打开来源章节核对。</p></main><script>
const MAPS=[{"id":"ethanol","label":"乙醇 / 酒精擦浴","title":"以“乙醇 / 酒精”为中心｜跨章节用途与辨析","center":"乙醇 / 酒精","chapter":"跨章节主题图","href":"fundamentals/ch10-heat-cold.html","items":[{"type":"number","label":"百部灭虱","tag":"30%百部含酸乙醇浸剂","detail":"百部灭虱：30%百部含酸乙醇浸剂。适用条件与安全边界：按操作要求包裹并彻底清洁","ref":"教材第164—165页","chapter":"基础护理学第6章｜患者的清洁卫生","href":"fundamentals/ch06-hygiene.html","kind":"normal"},{"type":"number","label":"乙醇擦浴","tag":"25%～35%，约200～300 ml","detail":"乙醇擦浴：25%～35%，约200～300 ml。适用条件与安全边界：禁擦胸前区、腹部、后颈和足底等","ref":"教材第248页","chapter":"基础护理学第10章｜冷、热疗法","href":"fundamentals/ch10-heat-cold.html","kind":"normal"},{"type":"number","label":"痰细胞学固定","tag":"10%甲醛或95%乙醇","detail":"痰细胞学固定：10%甲醛或95%乙醇。适用条件与安全边界：留取后立即固定","ref":"教材第411页","chapter":"基础护理学第15章｜标本采集","href":"fundamentals/ch15-specimen-collection.html","kind":"normal"},{"type":"safety","label":"精密器械消毒灭菌？","tag":"95%乙醇为干扰项","detail":"考题辨析线索：95%乙醇不是精密医疗器械消毒灭菌的正确选择；先辨器械类别，再按教材核对处理方法。","ref":"基础护理学第3章｜教材第42—43页","chapter":"基础护理学第3章｜预防与控制医院感染","href":"fundamentals/ch03-infection-control.html","kind":"safe"},{"type":"safety","label":"烫伤后涂90%乙醇？","tag":"错误处理选项","detail":"热水袋烫伤情境中，局部涂90%乙醇是错误处理选项；先停用热源，并按教材处理局部损伤。","ref":"基础护理学第10章｜教材第250页","chapter":"基础护理学第10章｜冷、热疗法","href":"fundamentals/ch10-heat-cold.html","kind":"safe"}]},{"id":"temperature","label":"冷、热疗温度与用途","title":"以“冷、热疗温度”为中心｜方法、参数与安全边界","center":"温度 × 治疗目的","chapter":"基础护理学第10章｜冷、热疗法","href":"fundamentals/ch10-heat-cold.html","items":[{"type":"number","label":"冷热疗持续时间","tag":"一般20～30 min，间隔约1 h","detail":"冷热疗持续时间：一般20～30 min，间隔约1 h。适用条件与安全边界：防止继发效应和组织损伤","ref":"教材第242页","chapter":"基础护理学第10章｜冷、热疗法","href":"fundamentals/ch10-heat-cold.html","kind":"normal"},{"type":"number","label":"冰袋装量","tag":"约1/2～2/3满","detail":"冰袋装量：约1/2～2/3满。适用条件与安全边界：排气并检查漏水","ref":"教材第245页","chapter":"基础护理学第10章｜冷、热疗法","href":"fundamentals/ch10-heat-cold.html","kind":"normal"},{"type":"number","label":"冰袋降温停用线","tag":"体温降至39℃以下","detail":"冰袋降温停用线：体温降至39℃以下。适用条件与安全边界：停用后30 min复测","ref":"教材第245页","chapter":"基础护理学第10章｜冷、热疗法","href":"fundamentals/ch10-heat-cold.html","kind":"safe"},{"type":"number","label":"冷湿敷","tag":"18～20℃，每3～5 min更换，共15～20 min","detail":"冷湿敷：18～20℃，每3～5 min更换，共15～20 min。适用条件与安全边界：保持敷布低温","ref":"教材第246页","chapter":"基础护理学第10章｜冷、热疗法","href":"fundamentals/ch10-heat-cold.html","kind":"normal"},{"type":"number","label":"温水擦浴","tag":"32～34℃","detail":"温水擦浴：32～34℃。适用条件与安全边界：高热物理降温","ref":"教材第248页","chapter":"基础护理学第10章｜冷、热疗法","href":"fundamentals/ch10-heat-cold.html","kind":"normal"},{"type":"number","label":"热水袋","tag":"一般60～70℃；老年、婴幼儿、昏迷等约50℃","detail":"热水袋：一般60～70℃；老年、婴幼儿、昏迷等约50℃。适用条件与安全边界：装1/2～2/3满并加布套","ref":"教材第250页","chapter":"基础护理学第10章｜冷、热疗法","href":"fundamentals/ch10-heat-cold.html","kind":"normal"},{"type":"number","label":"热湿敷","tag":"50～60℃，每3～5 min更换","detail":"热湿敷：50～60℃，每3～5 min更换。适用条件与安全边界：总时间依耐受控制","ref":"教材第252页","chapter":"基础护理学第10章｜冷、热疗法","href":"fundamentals/ch10-heat-cold.html","kind":"normal"},{"type":"number","label":"红外线灯","tag":"距患处30～50 cm，照射20～30 min","detail":"红外线灯：距患处30～50 cm，照射20～30 min。适用条件与安全边界：以温热舒适、皮肤粉红为宜","ref":"教材第253页","chapter":"基础护理学第10章｜冷、热疗法","href":"fundamentals/ch10-heat-cold.html","kind":"normal"},{"type":"number","label":"低温烫伤","tag":"可发生于43～60℃持续接触","detail":"低温烫伤：可发生于43～60℃持续接触。适用条件与安全边界：感觉障碍和昏迷患者风险高","ref":"教材第256页","chapter":"基础护理学第10章｜冷、热疗法","href":"fundamentals/ch10-heat-cold.html","kind":"safe"},{"type":"number","label":"临终热水袋","tag":"水温＜50℃","detail":"临终热水袋：水温＜50℃。适用条件与安全边界：防止低温与烫伤","ref":"教材第475页","chapter":"基础护理学第18章｜临终护理","href":"fundamentals/ch18-end-of-life.html","kind":"normal"}]},{"id":"fundamentals/ch01-introduction.html","label":"绪论","title":"以“绪论”为中心｜用途、数值与跨章联系","center":"绪论","chapter":"基础护理学第1章｜绪论","href":"fundamentals/ch01-introduction.html","items":[{"type":"concept","label":"课程定位","tag":"使用情境 / 考法","detail":"基础护理把基本理论、知识和技能用于患者的基本需要与安全。 考法线索：常把课程任务放进新护士的工作情境中判断。","ref":"教材第1—2页","chapter":"基础护理学第1章｜绪论","href":"fundamentals/ch01-introduction.html","kind":"normal","relation":""},{"type":"concept","label":"学习对象","tag":"使用情境 / 考法","detail":"学习不能只记操作步骤，还要理解对象、条件、风险和评价标准。 考法线索：题干改变患者条件时，要同步改变护理选择。","ref":"教材第2—3页","chapter":"基础护理学第1章｜绪论","href":"fundamentals/ch01-introduction.html","kind":"safe","relation":""},{"type":"concept","label":"护理程序","tag":"使用情境 / 考法","detail":"评估贯穿全过程，随后识别问题、计划、实施并评价。 考法线索：方案题先问资料是否充分，再排优先级。","ref":"教材第3—4页","chapter":"基础护理学第1章｜绪论","href":"fundamentals/ch01-introduction.html","kind":"normal","relation":""},{"type":"concept","label":"整体护理","tag":"使用情境 / 考法","detail":"同一技术要同时照顾生理安全、心理感受、文化与家庭支持。 考法线索：病例常用隐私、焦虑和参与决策检验整体观。","ref":"教材第3—4页","chapter":"基础护理学第1章｜绪论","href":"fundamentals/ch01-introduction.html","kind":"normal","relation":""},{"type":"concept","label":"专业素质","tag":"使用情境 / 考法","detail":"慎独、沟通、协作、观察与规范操作共同保证护理质量。 考法线索：无人监督仍按制度执行是慎独的典型线索。","ref":"教材第4—5页","chapter":"基础护理学第1章｜绪论","href":"fundamentals/ch01-introduction.html","kind":"normal","relation":""},{"type":"cross","label":"地面防滑系数","tag":"跨章节数值 · 环境","detail":"地面防滑系数：＜0.50不安全；0.50～0.79安全；≥0.80很安全。适用条件与安全边界：医院区域按风险选择等级","ref":"教材第17页","chapter":"基础护理学第2章｜环境","href":"fundamentals/ch02-environment.html","kind":"cross"},{"type":"cross","label":"跌倒高龄线索","tag":"跨章节数值 · 患者的安全与护士的职业防护","detail":"跌倒高龄线索：年龄≥80岁。适用条件与安全边界：与既往跌倒、药物和活动能力共同评估","ref":"教材第131页","chapter":"基础护理学第5章｜患者的安全与护士的职业防护","href":"fundamentals/ch05-safety-occupational-protection.html","kind":"cross"},{"type":"cross","label":"环境与健康","tag":"跨章节 · 环境","detail":"自然、社会和治疗性环境共同影响患者的安全、舒适和恢复。 考法线索：题干常要求指出环境因素怎样改变健康结局。","ref":"教材第7—12页","chapter":"基础护理学第2章｜环境","href":"fundamentals/ch02-environment.html","kind":"cross","relation":"安全"},{"type":"cross","label":"医院环境特点","tag":"跨章节 · 环境","detail":"服务对象复杂、专业分工协作，并以安全、舒适和治疗为目标。 考法线索：不能只答安静整洁，要写出专业性与安全性。","ref":"教材第13—15页","chapter":"基础护理学第2章｜环境","href":"fundamentals/ch02-environment.html","kind":"cross","relation":"安全"},{"type":"cross","label":"噪声控制","tag":"跨章节 · 环境","detail":"减少声源、降低传播并调整人员行为，避免突然和持续刺激。 考法线索：问护理措施时要覆盖声源、设备、操作与沟通。","ref":"教材第18—20页","chapter":"基础护理学第2章｜环境","hre ef":"教材第33页","chapter":"基础护理学第3章｜预防与控制医院感染","href":"fundamentals/ch03-infection-control.html","kind":"normal"},{"type":"number","label":"紫外线空气消毒","tag":"30 W灯距地面约2 m，照射≥30 min；≥1.5 W/m³","detail":"紫外线空气消毒：30 W灯距地面约2 m，照射≥30 min；≥1.5 W/m³。适用条件与安全边界：照射5～7 min后开始计时","ref":"教材第33页","chapter":"基础护理学第3章｜预防与控制医院感染","href":"fundamentals/ch03-infection-control.html","kind":"normal"},{"type":"number","label":"紫外线表面消毒","tag":"距物品25～60 cm，照射20～30 min","detail":"紫外线表面消毒：距物品25～60 cm，照射20～30 min。适用条件与安全边界：物品摊开或悬挂扩大照射面","ref":"教材第33页","chapter":"基础护理学第3章｜预防与控制医院感染","href":"fundamentals/ch03-infection-control.html","kind":"normal"},{"type":"number","label":"含氯消毒剂","tag":"400～700 mg/L作用30 min","detail":"含氯消毒剂：400～700 mg/L作用30 min。适用条件与安全边界：常用环境物表消毒范围，现配现用","ref":"教材第42—43页","chapter":"基础护理学第3章｜预防与控制医院感染","href":"fundamentals/ch03-infection-control.html","kind":"normal"},{"type":"number","label":"手卫生揉搓","tag":"≥15 s","detail":"手卫生揉搓：≥15 s。适用条件与安全边界：洗手或卫生手消毒","ref":"教材第48—49页","chapter":"基础护理学第3章｜预防与控制医院感染","href":"fundamentals/ch03-infection-control.html","kind":"normal"},{"type":"number","label":"卫生手消毒效果","tag":"≤10 CFU/cm²","detail":"卫生手消毒效果：≤10 CFU/cm²。适用条件与安全边界：卫生手消毒监测","ref":"教材第46页","chapter":"基础护理学第3章｜预防与控制医院感染","href":"fundamentals/ch03-infection-control.html","kind":"safe"},{"type":"number","label":"外科手消毒效果","tag":"≤5 CFU/cm²","detail":"外科手消毒效果：≤5 CFU/cm²。适用条件与安全边界：外科手消毒监测","ref":"教材第46页","chapter":"基础护理学第3章｜预防与控制医院感染","href":"fundamentals/ch03-infection-control.html","kind":"safe"},{"type":"number","label":"无菌钳和无菌盘","tag":"有效4 h","detail":"无菌钳和无菌盘：有效4 h。适用条件与安全边界：分别注明启用或铺盘时间","ref":"教材第53、57页","chapter":"基础护理学第3章｜预防与控制医院感染","href":"fundamentals/ch03-infection-control.html","kind":"normal"},{"type":"number","label":"开启无菌容器/回包","tag":"有效24 h","detail":"开启无菌容器/回包：有效24 h。适用条件与安全边界：注明开启时间","ref":"教材第54、56页","chapter":"基础护理学第3章｜预防与控制医院感染","href":"fundamentals/ch03-infection-control.html","kind":"normal"},{"type":"number","label":"灭菌包限重","tag":"器械包≤7 kg；敷料包≤5 kg","detail":"灭菌包限重：器械包≤7 kg；敷料包≤5 kg。适用条件与安全边界：保证蒸汽穿透","ref":"教材第32页","chapter":"基础护理学第3章｜预防与控制医院感染","href":"fundamentals/ch03-infection-control.html","kind":"normal"},{"type":"number","label":"高压灭菌冷却","tag":"一般＞30 min","detail":"高压灭菌冷却：一般＞30 min。适用条件与安全边界：干燥冷却后再卸载","ref":"教材第32页","chapter":"基础护理学第3章｜预防与控制医院感染","href":"fundamentals/ch03-infection-control.html","kind":"normal"},{"type":"number","label":"煮沸增强剂","tag":"1%～2%碳酸氢钠使沸点约105℃","detail":"煮沸增强剂：1%～2%碳酸氢钠使沸点约105℃。适用条件与安全边界：兼有防锈作用","ref":"教材第33页","chapter":"基础护理学第3章｜预防与控制医院感染","href":"fundamentals/ch03-infection-control.html","kind":"normal"},{"type":"number","label":"紫外线灯强度","tag":"新灯≥90 μW/cm²；使用中≥70 μW/cm²","detail":"紫外线灯强度：新灯≥90 μW/cm²；使用中≥70 μW/cm²。适用条件与安全边界：1 m处监测","ref":"教材第33页","chapter":"基础护理学第3章｜预防与控制医院感染","href":"fundamentals/ch03-infection-control.html","kind":"safe"},{"type":"number","label":"紫外线灯寿命","tag":"累计约1000 h后复测或更换","detail":"紫外线灯寿命：累计约1000 h后复测或更换。适用条件与安全边界：记录使用时间","ref":"教材第33页","chapter":"基础护理学第3章｜预防与控制医院感染","href":"fundamentals/ch03-infection-control.html","kind":"normal"},{"type":"number","label":"含氯溶液效期","tag":"一般≤24 h","detail":"含氯溶液效期：一般≤24 h。适用条件与安全边界：密闭、避光保存","ref":"教材第43页","chapter":"基础护理学第3章｜预防与控制医院感染","href":"fundamentals/ch03-infection-control.html","kind":"normal"},{"type":"number","label":"负压隔离病室","tag":"病室约−30 Pa、缓冲间约−15 Pa；换气≥6次/h","detail":"负压隔离病室：病室约−30 Pa、缓冲间约−15 Pa；换气≥6次/h。适用条件与安全边界：气流由清洁区流向污染区","ref":"教材第61—62页","chapter":"基础护理学第3章｜预防与控制医院感染","href":"fundamentals/ch03-infection-control.html","kind":"normal"},{"type":"number","label":"同室隔离床距","tag":"≥1.1 m","detail":"同室隔离床距：≥1.1 m。适用条件与安全边界：同种病原体患者集中安置","ref":"教材第62页","chapter":"基础护理学第3章｜预防与控制医院感染","href":"fundamentals/ch03-infection-control.html","kind":"normal"},{"type":"number","label":"无菌储存环境","tag":"温度＜24℃、湿度＜70%","detail":"无菌储存环境：温度＜24℃、湿度＜70%。适用条件与安全边界：离地≥20 cm、距顶＞50 cm、距墙＞5 cm","ref":"教材第52页","chapter":"基础护理学第3章｜预防与控制医院感染","href":"fundamentals/ch03-infection-control.html","kind":"normal"},{"type":"concept","label":"医院感染","tag":"使用情境 / 考法","detail":"结合入院前状态、潜伏期、诊疗活动和感染出现时间综合判断。 考法线索：48小时只是常用线索，不能替代完整诊断标准。","ref":"教材第24—29页","chapter":"基础护理学第3章｜预防与控制医院感染","href":"fundamentals/ch03-infection-control.html","kind":"safe","relation":""},{"type":"concept","label":"清洁消毒灭菌","tag":"使用情境 / 考法","detail":"先看目标层级和物品用途，再选择方法、参数与监测。 考法线索：高风险物品需要灭菌，方法正确还要过程合格。","ref":"教材第30—44页","chapter":"基础护理学第3章｜预防与控制医院感染","href":"fundamentals/ch03-infection-control.html","kind":"safe","relation":""},{"type":"concept","label":"手卫生","tag":"使用情境 / 考法","detail":"依据时机、可见污染和操作风险选择洗手或手消毒，手套不能替代。 考法线索：常考五时刻、方法选择和效果监测。","ref":"教材第45—51页","chapter":"基础护理学第3章｜预防与控制医院感染","href":"fundamentals/ch03-infection-control.html","kind":"safe","relation":""},{"type":"concept","label":"无菌技术","tag":"使用情境 / 考法","detail":"检查包装、日期和状态，划清无菌区，防止跨越、回流和接触污染。 考法线索：同一数字必须对应具体对象与起算时间。","ref":"教材第51—60页","chapter":"基础护理学第3章｜预防与控制医院感染","href":"fundamentals/ch03-infection-control.html","kind":"normal","relation":""},{"type":"concept","label":"隔离技术","tag":"使用情境 / 考法","detail":"标准预防用于所有患者，再按接触、飞沫或空气传播增加措施。 考法线索：先判断保护谁和传播途径，再选安置与防护。","ref":"教材第60—74页","chapter":"基础护理学第3章｜预防与控制医院感染","href":"fundamentals/ch03-infection-control.html","kind":"normal","relation":""},{"type":"concept","label":"高危险物品处理","tag":"使用情境 / 考法","detail":"进入无菌组织或血管系统的物品必须灭菌；接触完整黏膜者需高水平消毒。 考法线索：先按物品用途分危险等级，再选消毒灭菌方法。","ref":"教材第30—31页","chapter":"基础护理学第3章｜预防与控制医院感染","href":"fundamentals/ch03-infection-control.html","kind":"safe","relation":""},{"type":"concept","label":"标准预防与附加隔离","tag":"使用情境 / 考法","detail":"标准预防用于所有患者，明确传播途径后再叠加接触、飞沫或空气隔离。 考法线索：不是二选一；手套也不能替代手卫生。","ref":"教材第45—74页","chapter":"基础护理学第3章｜预防与控制医院感染","href":"fundamentals/ch03-infection-control.html","kind":"safe","relation":""},{"type":"concept","label":"无菌边界","tag":"使用情境 / 考法","detail":"跨越无菌区、手臂低于腰部、无菌物品受潮或接触非无菌面均视为污染。 考法线索：情境题要说出哪一步破坏了无菌边界。","ref":"教材第51—60页","chapter":"基础护理学第3章｜预防与控制医院感染","href":"fundamentals/ch03-infection-control.html","kind":"normal","relation":""},{"type":"cross","label":"甲硝唑漱口液","tag":"跨章节数值 · 患者的清洁卫生","detail":"甲硝唑漱口液：0.08%。适用条件与安全边界：厌氧菌感染","ref":"教材第137页","chapter":"基础护理学第6章｜患者的清洁卫生","href":"fundamentals/ch06-hygiene.html","kind":"cross"},{"type":"cross","label":"过氧化氢漱口液","tag":"跨章节数值 · 患者的清洁卫生","detail":"过氧化氢漱口液：1%～3%。适用条件与安全边界：口腔感染、坏死组织和口臭","ref":"教材第137页","chapter":"基础护理学第6章｜患者的清洁卫生","href":"fundamentals/ch06-hygiene.html","kind":"cross"},{"type":"cross","label":"锐器伤流程","tag":"跨章节 · 患者的安全与护士的职业防护","detail":"立即冲洗和适当挤出血液，消毒、报告、评估暴露源与暴露级别，尽快启动预防并随访。 考法线索：常考先后顺序，不能先等化验结果再处理伤口。","ref":"教材第124—129页","chapter":"基础护理学第5章｜患者的安全与护士的职业防护","href":"fundamentals/ch05-safety-occupational-protection.html","kind":"cross","relation":"消毒"},{"type":"cross","label":"口腔护理","tag":"跨章节 · 患者的清洁卫生","detail":"评估口腔状态和意识，按分泌物、感染或出血风险选择方法与溶液。 考法线索：昏迷患者禁忌漱口，棉球不可过湿。","ref":"教材第134—139页","chapter":"基础护理学第6章｜患者的清洁卫生","href":"fundamentals/ch06-hygiene.html","kind":"cross","relation":"感染"},{"type":"cross","label":"头发护理","tag":"跨章节 · 患者的清洁卫生","detail":"关注清洁、梳理、头虱处理及卧床患者安全。 考法线索：灭虱题要区分药物处理、包裹时间和物品消毒。","ref":"教材第139—143页","chapter":"基础护理学第6章｜患者的清洁卫生","href":"fundamentals/ch06-hygiene.html","kind":"cross","relation":"消毒"}]},{"id":"fundamentals/ch04-admission-discharge.html","label":"患者入院和出院的护理","title":"以“患者入院和出院的护理”为中心｜用途、数值与跨章联系","center":"患者入院和出院的护理","chapter":"基础护理学第4章｜患者入院和出院的护理","href":"fundamentals/ch04-admission-discharge.html","items":[{"type":"number","label":"休克卧位","tag":"头胸抬高10°～20°，下肢抬高20°～30°","detail":"休克卧位：头胸抬高10°～20°，下肢抬高20°～30°。适用条件与安全边界：兼顾呼吸和回心血量","ref":"教材第91页","chapter":"基础护理学第4章｜患者入院和出院的护理","href":"fundamentals/ch04-admission-discharge.html","kind":"normal"},{"type":"number","label":"半坐卧位","tag":"床头30°～50°","detail":"半坐卧位：床头30°～50°。适用条件与安全边界：心肺疾患、面颈胸腹盆腔术后等","ref":"教材第90—91页","chapter":"基础护理学第4章｜患者入院和出院的护理","href":"fundamentals/ch04-admission-discharge.html","kind":"normal"},{"type":"number","label":"端坐位","tag":"床头70°～80°","detail":"端坐位：床头70°～80°。适用条件与安全边界：严重呼吸困难、急性肺水肿","ref":"教材第91页","chapter":"基础护理学第4章｜患者入院和出院的护理","href":"fundamentals/ch04-admission-discharge.html","kind":"normal"},{"type":"number","label":"头低足高位","tag":"床尾抬高15～30 cm","detail":"头低足高位：床尾抬高15～30 cm。适用条件与安全边界：按治疗目的选择并注意禁忌","ref":"教材第92页","chapter":"基础护理学第4章｜患者入院和出院的护理","href":"fundamentals/ch04-admission-discharge.html","kind":"safe"},{"type":"number","label":"头高足低位","tag":"床头抬高15°～30°","detail":"头高足低位：床头抬高15°～30°。适用条件与安全边界：颅脑术后等降低颅内压情境","ref":"教材第93页","chapter":"基础护理学第4章｜患者入院和出院的护理","href":"fundamentals/ch04-admission-discharge.html","kind":"normal"},{"type":"number","label":"膝胸卧位","tag":"每次≤15 min","detail":"膝胸卧位：每次≤15 min。适用条件与安全边界：检查、治疗或矫正胎位","ref":"教材第93页","chapter":"基础护理学第4章｜患者入院和出院的护理","href":"fundamentals/ch04-admission-discharge.html","kind":"normal"},{"type":"number","label":"麻醉床保护垫位置","tag":"上缘距床头45～50 cm","detail":"麻醉床保护垫位置：上缘距床头45～50 cm。适用条件与安全边界：腹部手术返回时保护床单位","ref":"教材第84页","chapter":"基础护理学第4章｜患者入院和出院的护理","href":"fundamentals/ch04-admission-discharge.html","kind":"normal"},{"type":"number","label":"搬运脊柱损伤者","tag":"通常4人搬运","detail":"搬运脊柱损伤者：通常4人搬运。适用条件与安全边界：保持头颈躯干轴线稳定","ref":"教材第100—101页","chapter":"基础护理学第4章｜患者入院和出院的护理","href":"fundamentals/ch04-admission-discharge.html","kind":"normal"},{"type":"concept","label":"急危重患者先处理什么","tag":"关联考点","detail":"先抢救和安置，身份及必要资料同步核对；手续可在病情允许后补办。","ref":"教材第78—80页","chapter":"基础护理学第4章｜患者入院和出院的护理","href":"fundamentals/ch04-admission-discharge.html","kind":"normal","relation":""},{"type":"concept","label":"床单位怎么选","tag":"关联考点","detail":"根据患者是否暂离、是否新入院，以及麻醉和手术方式选择床型。","ref":"教材第80—87页","chapter":"基础护理学第4章｜患者入院和出院的护理","href":"fundamentals/ch04-admission-discharge.html","kind":"normal","relation":""},{"type":"concept","label":"护理级别不是固定标签","tag":"关联考点","detail":"护理级别由病情和自理能力共同决定，并随病情变化重新评估。","ref":"教材第87—89页","chapter":"基础护理学第4章｜患者入院和出院的护理","href":"fundamentals/ch04-admission-discharge.html","kind":"normal","relation":""},{"type":"concept","label":"卧位从目的和病情反推","tag":"关联考点","detail":"先看意识、呼吸、循环和治疗目的，再核对禁忌、管路与安全条件。","ref":"教材第89—94页","chapter":"基础护理学第4章｜患者入院和出院的护理","href":"fundamentals/ch04-admission-discharge.html","kind":"safe","relation":""},{"type":"concept","label":"脊柱搬运先守住轴线","tag":"关联考点","detail":"多人协调、统一口令，保持头颈躯干轴线，避免扭转和屈曲。","ref":"教材第98—101页","chapter":"基础护理学第4章｜患者入院和出院的护理","href":"fundamentals/ch04-admission-discharge.html","kind":"safe","relation":""},{"type":"concept","label":"出院指导要能执行","tag":"关联考点","detail":"评估准备度，完成用药、复诊和资料处理，并确认患者能够复述。","ref":"教材第102—108页","chapter":"基础护理学第4章｜患者入院和出院的护理","href":"fundamentals/ch04-admission-discharge.html","kind":"normal","relation":""},{"type":"cross","label":"特殊病室温度","tag":"跨章节数值 · 环境","detail":"特殊病室温度：22～24℃。适用条件与安全边界：新生儿、老年人、产房及手术室等","ref":"教材第15—16页","chapter":"基础护理学第2章｜环境","href":"fundamentals/ch02-environment.html","kind":"cross"},{"type":"cross","label":"地面防滑系数","tag":"跨章节数值 · 环境","detail":"地面防滑系数：＜0.50不安全；0.50～0.79安全；≥0.80很安全。适用条件与安全边界：医院区域按风险选择等级","ref":"教材第17页","chapter":"基础护理学第2章｜环境","href":"fundamentals/ch02-environment.html","kind":"cross"},{"type":"cross","label":"课程定位","tag":"跨章节 · 绪论","detail":"基础护理把基本理论、知识和技能用于患者的基本需要与安全。 考法线索：常把课程任务放进新护士的工作情境中判断。","ref":"教材第1—2页","chapter":"基础护理学第1章｜绪论","href":"fundamentals/ch01-introduction.html","kind":"cross","relation":"安全"},{"type":"cross","label":"护理程序","tag":"跨章节 · 绪论","detail":"评估贯穿全过程，随后识别问题、计划、实施并评价。 考法线索：方案题先问资料是否充分，再排优先级。","ref":"教材第3—4页","chapter":"基础护理学第1章｜绪论","href":"fundamentals/ch01-introduction.html","kind":"cross","relation":"评估"},{"type":"cross","label":"整体护理","tag":"跨章节 · 绪论","detail":"同一技术要同时照顾生理安全、心理感受、文化与家庭支持。 考法线索：病例常用隐私、焦虑和参与决策检验整体观。","ref":"教材第3—4页","chapter":"基础护理学第1章｜绪论","href":"fundamentals/ch01-introduction.html","kind":"cross","relation":"安全"}]},{"id":"fundamentals/ch05-safety-occupational-protection.html","label":"患者的安全与护士的职业防护","title":"以“患者的安全与护士的职业防护”为中心｜用途、数值与跨章联系","center":"患者的安全与护士的职业防护","chapter":"基础护理学第5章｜患者的安全与护士的职业防护","href":"fundamentals/ch05-safety-occupational-protection.html","items":[{"type":"number","label":"约束带松紧","tag":"可伸入1～2横指","detail":"约束带松紧：可伸入1～2横指。适用条件与安全边界：固定后检查皮肤和末梢循环","ref":"教材第119页","chapter":"基础护理学第5章｜患者的安全与护士的职业防护","href":"fundamentals/ch05-safety-occupational-protection.html","kind":"normal"},{"type":"number","label":"约束观察","tag":"每15～30 min","detail":"约束观察：每15～30 min。适用条件与安全边界：观察颜色、温度、感觉和循环","ref":"教材第119—120页","chapter":"基础护理学第5章｜患者的安全与护士的职业防护","href":"fundamentals/ch05-safety-occupational-protection.html","kind":"normal"},{"type":"number","label":"约束松解","tag":"一般每2 h","detail":"约束松解：一般每2 h。适用条件与安全边界：松解时活动肢体并进行皮肤护理","ref":"教材第120页","chapter":"基础护理学第5章｜患者的安全与护士的职业防护","href":"fundamentals/ch05-safety-occupational-protection.html","kind":"normal"},{"type":"number","label":"乙肝暴露后免疫球蛋白","tag":"尽量在24 h内","detail":"乙肝暴露后免疫球蛋白：尽量在24 h内。适用条件与安全边界：结合免疫状态决定疫苗","ref":"教材第125页","chapter":"基础护理学第5章｜患者的安全与护士的职业防护","href":"fundamentals/ch05-safety-occupational-protection.html","kind":"normal"},{"type":"number","label":"乙肝疫苗程序","tag":"0、1、6个月","detail":"乙肝疫苗程序：0、1、6个月。适用条件与安全边界：职业暴露后按免疫结果执行","ref":"教材第125页","chapter":"基础护理学第5章｜患者的安全与护士的职业防护","href":"fundamentals/ch05-safety-occupational-protection.html","kind":"normal"},{"type":"number","label":"HIV暴露后用药","tag":"尽量1～2 h内开始，疗程28 d","detail":"HIV暴露后用药：尽量1～2 h内开始，疗程28 d。适用条件与安全边界：越早越好，不因等待检测而延误","ref":"教材第126—127页","chapter":"基础护理学第5章｜患者的安全与护士的职业防护","href":"fundamentals/ch05-safety-occupational-protection.html","kind":"normal"},{"type":"number","label":"HIV暴露随访","tag":"24 h、4周、8周、12周、6个月、12个月","detail":"HIV暴露随访：24 h、4周、8周、12周、6个月、12个月。适用条件与安全边界：按机构流程完成检测与咨询","ref":"教材第127页","chapter":"基础护理学第5章｜患者的安全与护士的职业防护","href":"fundamentals/ch05-safety-occupational-protection.html","kind":"normal"},{"type":"number","label":"跌倒高龄线索","tag":"年龄≥80岁","detail":"跌倒高龄线索：年龄≥80岁。适用条件与安全边界：与既往跌倒、药物和活动能力共同评估","ref":"教材第131页","chapter":"基础护理学第5章｜患者的安全与护士的职业防护","href":"fundamentals/ch05-safety-occupational-protection.html","kind":"normal"},{"type":"number","label":"近期跌倒史","tag":"近6个月≥2次","detail":"近期跌倒史：近6个月≥2次。适用条件与安全边界：提示高危","ref":"教材第131页","chapter":"基础护理学第5章｜患者的安全与护士的职业防护","href":"fundamentals/ch05-safety-occupational-protection.html","kind":"normal"},{"type":"number","label":"镇静药影响","tag t","label":"约束使用边界","tag":"使用情境 / 考法","detail":"约束仅在必要且替代措施无效时使用，需解释、记录、持续观察并尽早解除。 考法线索：为管理方便或惩罚患者均不成立。","ref":"教材第118—121页","chapter":"基础护理学第5章｜患者的安全与护士的职业防护","href":"fundamentals/ch05-safety-occupational-protection.html","kind":"normal","relation":""},{"type":"concept","label":"跌倒预防","tag":"使用情境 / 考法","detail":"改善环境、评估体位性低血压和药物、协助如厕与活动、把呼叫器放在可及处。 考法线索：高危不等于绝对卧床，保护性活动可避免失用。","ref":"教材第113—118页","chapter":"基础护理学第5章｜患者的安全与护士的职业防护","href":"fundamentals/ch05-safety-occupational-protection.html","kind":"safe","relation":""},{"type":"concept","label":"锐器伤流程","tag":"使用情境 / 考法","detail":"立即冲洗和适当挤出血液，消毒、报告、评估暴露源与暴露级别，尽快启动预防并随访。 考法线索：常考先后顺序，不能先等化验结果再处理伤口。","ref":"教材第124—129页","chapter":"基础护理学第5章｜患者的安全与护士的职业防护","href":"fundamentals/ch05-safety-occupational-protection.html","kind":"safe","relation":""},{"type":"cross","label":"地面防滑系数","tag":"跨章节数值 · 环境","detail":"地面防滑系数：＜0.50不安全；0.50～0.79安全；≥0.80很安全。适用条件与安全边界：医院区域按风险选择等级","ref":"教材第17页","chapter":"基础护理学第2章｜环境","href":"fundamentals/ch02-environment.html","kind":"cross"},{"type":"cross","label":"煮沸消毒","tag":"跨章节数值 · 预防与控制医院感染","detail":"煮沸消毒：100℃，一般5～10 min；灭菌需≥15 min。适用条件与安全边界：海拔每升高300 m延长2 min","ref":"教材第33页","chapter":"基础护理学第3章｜预防与控制医院感染","href":"fundamentals/ch03-infection-control.html","kind":"cross"},{"type":"cross","label":"课程定位","tag":"跨章节 · 绪论","detail":"基础护理把基本理论、知识和技能用于患者的基本需要与安全。 考法线索：常把课程任务放进新护士的工作情境中判断。","ref":"教材第1—2页","chapter":"基础护理学第1章｜绪论","href":"fundamentals/ch01-introduction.html","kind":"cross","relation":"安全"},{"type":"cross","label":"护理程序","tag":"跨章节 · 绪论","detail":"评估贯穿全过程，随后识别问题、计划、实施并评价。 考法线索：方案题先问资料是否充分，再排优先级。","ref":"教材第3—4页","chapter":"基础护理学第1章｜绪论","href":"fundamentals/ch01-introduction.html","kind":"cross","relation":"评估"},{"type":"cross","label":"整体护理","tag":"跨章节 · 绪论","detail":"同一技术要同时照顾生理安全、心理感受、文化与家庭支持。 考法线索：病例常用隐私、焦虑和参与决策检验整体观。","ref":"教材第3—4页","chapter":"基础护理学第1章｜绪论","href":"fundamentals/ch01-introduction.html","kind":"cross","relation":"安全"}]},{"id":"fundamentals/ch06-hygiene.html","label":" 用条件与安全边界：防疲劳和消化不适","ref":"教材第145—147页","chapter":"基础护理学第6章｜患者的清洁卫生","href":"fundamentals/ch06-hygiene.html","kind":"normal"},{"type":"number","label":"压力性损伤翻身","tag":"一般每2 h，必要时每30 min","detail":"压力性损伤翻身：一般每2 h，必要时每30 min。适用条件与安全边界：根据皮肤与受压风险个体化","ref":"教材第156页","chapter":"基础护理学第6章｜患者的清洁卫生","href":"fundamentals/ch06-hygiene.html","kind":"safe"},{"type":"number","label":"硼酸漱口液","tag":"2%～3%","detail":"硼酸漱口液：2%～3%。适用条件与安全边界：抑菌清洁","ref":"教材第137页","chapter":"基础护理学第6章｜患者的清洁卫生","href":"fundamentals/ch06-hygiene.html","kind":"normal"},{"type":"number","label":"病室沐浴温度","tag":"通常≥22℃，体弱者约24℃","detail":"病室沐浴温度：通常≥22℃，体弱者约24℃。适用条件与安全边界：注意保暖和隐私","ref":"教材第145—147页","chapter":"基础护理学第6章｜患者的清洁卫生","href":"fundamentals/ch06-hygiene.html","kind":"safe"},{"type":"number","label":"会阴冲洗水温","tag":"≤40℃","detail":"会阴冲洗水温：≤40℃。适用条件与安全边界：避免烫伤黏膜","ref":"教材第161页","chapter":"基础护理学第6章｜患者的清洁卫生","href":"fundamentals/ch06-hygiene.html","kind":"safe"},{"type":"number","label":"百部灭虱","tag":"30%百部含酸乙醇浸剂","detail":"百部灭虱：30%百部含酸乙醇浸剂。适用条件与安全边界：按操作要求包裹并彻底清洁","ref":"教材第164—165页","chapter":"基础护理学第6章｜患者的清洁卫生","href":"fundamentals/ch06-hygiene.html","kind":"normal"},{"type":"concept","label":"口腔护理","tag":"使用情境 / 考法","detail":"评估口腔状态和意识，按分泌物、感染或出血风险选择方法与溶液。 考法线索：昏迷患者禁忌漱口，棉球不可过湿。","ref":"教材第134—139页","chapter":"基础护理学第6章｜患者的清洁卫生","href":"fundamentals/ch06-hygiene.html","kind":"safe","relation":""},{"type":"concept","label":"头发护理","tag":"使用情境 / 考法","detail":"关注清洁、梳理、头虱处理及卧床患者安全。 考法线索：灭虱题要区分药物处理、包裹时间和物品消毒。","ref":"教材第139—143页","chapter":"基础护理学第6章｜患者的清洁卫生","href":"fundamentals/ch06-hygiene.html","kind":"normal","relation":""},{"type":"concept","label":"皮肤清洁","tag":"使用情境 / 考法","detail":"依据活动能力和病情选择淋浴、盆浴或床上擦浴，保护管路和隐私。 考法线索：饭后、病情不稳或特殊治疗时需调整。","ref":"教材第143—151页","chapter":"基础护理学第6章｜患者的清洁卫生","href":"fundamentals/ch06-hygiene.html","kind":"normal","relation":""},{"type":"concept","label":"压力性损伤","tag":"使用情境 / 考法","detail":"压力、剪切力、摩擦、潮湿和营养共同影响发生，重点是减压与皮肤管理。 考法线索：分期题看组织层次和创面特征，不能只看颜色。","ref":"教材第151—159页","chapter":"基础护理学第6章｜患者的清洁卫生","href":"fundamentals/ch06-hygiene.html","kind":"safe","relation":""},{"type":"concept","label":"会阴与晨晚间护理","tag":"使用情境 / 考法","detail":"按污染程度由清洁向污染方向操作，结合排泄、导管和舒适需要。 考法线索：题干常用留置导尿和失禁检验顺序。","ref":"教材第159—166页","chapter":"基础护理学第6章｜患者的清洁卫生","href":"fundamentals/ch06-hygiene.html","kind":"normal","relation":""},{"type":"concept","label":"漱口液选择","tag":"使用情境 / 考法","detail":"依据病原体、口腔pH和黏膜情况选择漱口液，浓度和适用对象必须一起记。 考法线索：真菌用碱性碳酸氢钠，铜绿假单胞菌用乙酸，厌氧菌用甲硝唑。","ref":"教材第137页","chapter":"基础护理学第6章｜患者的清洁卫生","href":"fundamentals/ch06-hygiene.html","kind":"normal","relation":""},{"type":"concept","label":"压力性损伤分期","tag":"使用情境 / 考法","detail":"从指压不褪色红斑到皮肤全层缺损、深部组织暴露，分期取决于可见组织层次。 考法线索：水疱与浅表破损多见于2期，焦痂覆盖时可能无法分期。","ref":"教材第151—158页","chapter":"基础护理学第6章｜患者的清洁卫生","href":"fundamentals/ch06-hygiene.html","kind":"normal","relation":""},{"type":"concept","label":"沐浴禁忌","tag":"使用情境 / 考法","detail":"病情不稳定、急性出血、严重呼吸困难或医嘱限制活动时不宜盆浴或淋浴。 考法线索：先评估能否耐受，再决定清洁方式。","ref":"教材第145—147页","chapter":"基础护理学第6章｜患者的清洁卫生","href":"fundamentals/ch06-hygiene.html","kind":"normal","relation":""},{"type":"cross","label":"地面防滑系数","tag":"跨章节数值 · 环境","detail":"地面防滑系数：＜0.50不安全；0.50～0.79安全；≥0.80很安全。适用条件与安全边界：医院区域按风险选择等级","ref":"教材第17页","chapter":"基础护理学第2章｜环境","href":"fundamentals/ch02-environment.html","kind":"cross"},{"type":"cross","label":"医院感染时间线索","tag":"跨章节数值 · 预防与控制医院感染","detail":"医院感染时间线索：入院≥48小时。适用条件与安全边界：无明确潜伏期时仍须结合完整诊断条件","ref":"教材第25页","chapter":"基础护理学第3章｜预防与控制医院感染","href":"fundamentals/ch03-infection-control.html","kind":"cross"},{"type":"cross","label":"课程定位","tag":"跨章节 · 绪论","detail":"基础护理把基本理论、知识和技能用于患者的基本需要与安全。 考法线索：常把课程任务放进新护士的工作情境中判断。","ref":"教材第1—2页","chapter":"基础护理学第1章｜绪论","href":"fundamentals/ch01-introduction.html","kind":"cross","relation":"安全"},{"type":"cross","label":"护理程序","tag":"跨章节 · 绪论","detail":"评估贯穿全过程，随后识别问题、计划、实施并评价。 考法线索：方案题先问资料是否充分，再排优先级。","ref":"教材第3—4页","chapter":"基础护理学第1章｜绪论","href":"fundamentals/ch01-introduction.html","kind":"cross","relation":"评估"},{"type":"cross","label":"整体护理","tag":"跨章节 · 绪论","detail":"同一技术要同时照顾生理安全、心理感受、文化与家庭支持。 考法线索：病例常用隐私、焦虑和参与决策检验整体观。","ref":"教材第3—4页","chapter":"基础护理学第1章｜绪论","href":"fundamentals/ch01-introduction.html","kind":"cross","relation":"安全"}]},{"id":"fundamentals/ch07-rest-activity.html","label":"休息与活动","title":"以“休息与活动”为中心｜用途、数值与跨章联系","center":"休息与活动","chapter":"基础护理学第7章｜休息与活动","href":"fundamentals/ch07-rest-activity.html","items":[{"type":"number","label":"成人睡眠","tag":"约7～8 h/d","detail":"成人睡眠：约7～8 h/d。适用条件与安全边界：结合个体习惯与睡眠质量判断","ref":"教材第172页","chapter":"基础护理学第7章｜休息与活动","href":"fundamentals/ch07-rest-activity.html","kind":"normal"},{"type":"number","label":"睡眠周期","tag":"60～120 min，平均约90 min","detail":"睡眠周期：60～120 min，平均约90 min。适用条件与安全边界：每夜约4～6个周期","ref":"教材第170页","chapter":"基础护理学第7章｜休息与活动","href":"fundamentals/ch07-rest-activity.html","kind":"normal"},{"type":"number","label":"REM持续时间","tag":"约20～30 min","detail":"REM持续时间：约20～30 min。适用条件与安全边界：后半夜比例增加","ref":"教材第170页","chapter":"基础护理学第7章｜休息与活动","href":"fundamentals/ch07-rest-activity.html","kind":"normal"},{"type":"number","label":"夜间护理间隔","tag":"尽量避免＜90 min反复打断","detail":"夜间护理间隔：尽量避免＜90 min反复打断。适用条件与安全边界：集中治疗护理保护睡眠周期","ref":"教材第176页","chapter":"基础护理学第7章｜休息与活动","href":"fundamentals/ch07-rest-activity.html","kind":"normal"},{"type":"number","label":"关节活动","tag":"每个关节5～10次","detail":"关节活动：每个关节5～10次。适用条件与安全边界：动作缓慢，观察疼痛和耐受","ref":"教材第184页","chapter":"基础护理学第7章｜休息与活动","href":"fundamentals/ch07-rest-activity.html","kind":"normal"},{"type":"number","label":"肌力分级","tag":"0～5级","detail":"肌力分级：0～5级。适用条件与安全边界：记录具体级别并观察动态变化","ref":"教材第181页","chapter":"基础护理学第7章｜休息与活动","href":"fundamentals/ch07-rest-activity.html","kind":"normal"},{"type":"number","label":"活动能力分级","tag":"0～4级","detail":"活动能力分级：0～4级。适用条件与安全边界：评估是否需要协助或完全依赖","ref":"教材第182页","chapter":"基础护理学第7章｜休息与活动","href":"fundamentals/ch07-rest-activity.html","kind":"normal"},{"type":"number","label":"SRSS量表","tag":"10项，每项1～5分，总分10～50","detail":"SRSS量表：10项，每项1～5分，总分10～50。适用条件与安全边界：分数越高提示睡眠问题越明显","ref":"教材第186页","chapter":"基础护理学第7章｜休息与活动","href":"fundamentals/ch07-rest-activity.html","kind":"normal"},{"type":"concept","label":"休息与睡眠","tag":"使用情境 / 考法","detail":"休息减少身心消耗，睡眠按周期维持生理和心理恢复。 考法线索：题干常用入睡困难、易醒和早醒区分睡眠问题。","ref":"教材第168—175页","chapter":"基础护理学第7章｜休息与活动","href":"fundamentals/ch07-rest-activity.html","kind":"normal","relation":""},{"type":"concept","label":"睡眠周期","tag":"使用情境 / 考法","detail":"NREM与REM交替出现，各期生理表现和觉醒难度不同。 考法线索：深睡期、做梦期和生理变化是常考线索。","ref":"教材第170—174页","chapter":"基础护理学第7章｜休息与活动","href":"fundamentals/ch07-rest-activity.html","kind":"normal","relation":""},{"type":"concept","label":"睡眠护理","tag":"使用情境 / 考法","detail":"从环境、习惯、疼痛、焦虑、用药和白天活动共同干预。 考法线索：不要把安眠药作为首选且唯一措施。","ref":"教材第174—178页","chapter":"基础护理学第7章｜休息与活动","href":"fundamentals/ch07-rest-activity.html","kind":"safe","relation":""},{"type":"concept","label":"活动受限影响","tag":"使用情境 / 考法","detail":"长期不活动会累及皮肤、呼吸、循环、消化、泌尿和运动系统。 考法线索：问并发症时要跨系统作答。","ref":"教材第179—182页","chapter":"基础护理学第7章｜休息与活动","href":"fundamentals/ch07-rest-activity.html","kind":"safe","relation":""},{"type":"concept","label":"协助活动","tag":"使用情境 / 考法","detail":"评估病情和肌力，按主动、被动及抗阻活动逐步增加强度。 考法线索：活动后出现胸闷、气促或生命体征异常应停止并复评。","ref":"教材第182—187页","chapter":"基础护理学第7章｜休息与活动","href":"fundamentals/ch07-rest-activity.html","kind":"normal","relation":""},{"type":"concept","label":"NREM与REM","tag":"使用情境 / 考法","detail":"NREM侧重体力恢复，REM与记忆、情绪和梦境相关；夜间周期交替且后半夜REM增多。 考法线索：题目常用做梦、快速眼动和肌张力下降定位REM。","ref":"教材第169—171页","chapter":"基础护理学第7章｜休息与活动","href":"fundamentals/ch07-rest-activity.html","kind":"normal","relation":""},{"type":"concept","label":"肌力与活动能力","tag":"使用情境 / 考法","detail":"肌力评价单一肌群收缩能力，活动能力分级评价完成日常活动所需帮助程度。 考法线索：不能把两个分级表混用。","ref":"教材第181—182页","chapter":"基础护理学第7章｜休息与活动","href":"fundamentals/ch07-rest-activity.html","kind":"safe","relation":""},{"type":"cross","label":"休克卧位","tag":"跨章节数值 · 患者入院和出院的护理","detail":"休克卧位：头胸抬高10°～20°，下肢抬高20°～30°。适用条件与安全边界：兼顾呼吸和回心血量","ref":"教材第91页","chapter":"基础护理学第4章｜患者入院和出院的护理","href":"fundamentals/ch04-admission-discharge.html","kind":"cross"},{"type":"cross","label":"端坐位","tag":"跨章节数值 · 患者入院和出院的护理","detail":"端坐位：床头70°～80°。适用条件与安全边界：严重呼吸困难、急性肺水肿","ref":"教材第91页","chapter":"基础护理学第4章｜患者入院和出院的护理","href":"fundamentals/ch04-admission-discharge.html","kind":"cross"},{"type":"cross","label":"护理程序","tag":"跨章节 · 绪论","detail":"评估贯穿全过程，随后识别问题、计划、实施并评价。 考法线索：方案题先问资料是否充分，再排优先级。","ref":"教材第3—4页","chapter":"基础护理学第1章｜绪论","href":"fundamentals/ch01-introduction.html","kind":"cross","relation":"评估"},{"type":"cross","label":"护理级别不是固定标签","tag":"跨章节 · 患者入院和出院的护理","detail":"护理级别由病情和自理能力共同决定，并随病情变化重新评估。","ref":"教材第87—89页","chapter":"基础护理学第4章｜患者入院和出院的护理","href":"fundamentals/ch04-admission-discharge.html","kind":"cross","relation":"评估"},{"type":"cross","label":"卧位从目的和病情反推","tag":"跨章节 · 患者入院和出院的护理","detail":"先看意识、呼吸、循环和治疗目的，再核对禁忌、管路与安全条件。","ref":"教材第89—94页","chapter":"基础护理学第4章｜患者入院和出院的护理","href":"fundamentals/ch04-admission-discharge.html","kind":"cross","relation":"呼吸"}]},{"id":"fundamentals/ch08-documentation.html","label":"医疗与护理文件","title":"以“医疗与护理文件”为中心｜用途、数值与跨章联系","center":"医疗与护理文件","chapter":"基础护理学第8章｜医疗与护理文件","href":"fundamentals/ch08-documentation.html","items":[{"type":"number","label":"临时备用医嘱SOS","tag":"有效12 h","detail":"临时备用医嘱SOS：有效12 h。适用条件与安全边界：未执行即失效","ref":"教材第194页","chapter":"基础护理学第8章｜医疗与护理文件","href":"fundamentals/ch08-documentation.html","kind":"normal"},{"type":"number","label":"长期备用医嘱PRN","tag":"有效时间＞24 h","detail":"长期备用医嘱PRN：有效时间＞24 h。适用条件与安全边界：按需要执行并记录","ref":"教材第194页","chapter":"基础护理学第8章｜医疗与护理文件","href":"fundamentals/ch08-documentation.html","kind":"normal"},{"type":"number","label":"术后日数","tag":"手术次日为术后第1日，连续记录至第14日","detail":"术后日数：手术次日为术后第1日，连续记录至第14日。适用条件与安全边界：体温单专用记录","ref":"教材第192页","chapter":"基础护理学第8章｜医疗与护理文件","href":"fundamentals/ch08-documentation.html","kind":"normal"},{"type":"number","label":"体温单高温线","tag":"40～42℃","detail":"体温单高温线：40～42℃。适用条件与安全边界：填写入院、转科、手术、分娩、死亡等事件","ref":"教材第192—193页","chapter":"基础护理学第8章｜医疗与护理文件","href":"fundamentals/ch08-documentation.html","kind":"normal"},{"type":"number","label":"体温格值","tag":"每小格0.2℃","detail":"体温格值：每小格0.2℃。适用条件与安全边界：按测量部位符号绘制","ref":"教材第193页","chapter":"基础护理学第8章｜医疗与护理文件","href":"fundamentals/ch08-documentation.html","kind":"normal"},{"type":"number","label":"低体温记录","tag":"体温＜35℃写“不升”","detail":"低体温记录：体温＜35℃写“不升”。适用条件与安全边界：用蓝笔在相应时间纵格内记录","ref":"教材第193页","chapter":"基础护理学第8章｜医疗与护理文件","href":"fundamentals/ch08-documentation.html","kind":"normal"},{"type":"concept","label":"记录原则","tag":"使用情境 / 考法","detail":"及时、准确、完整、简要、清晰并使用规范术语，避免主观评价。 考法线索：错字处理和时间签名常以操作判断题出现。","ref":"教材第189—191页","chapter":"基础护理学第8章｜医疗与护理文件","href":"fundamentals/ch08-documentation.html","kind":"safe","relation":""},{"type":"concept","label":"体温单","tag":"使用情境 / 考法","detail":"集中呈现体温、脉搏、呼吸、血压、出入量等动态趋势。 考法线索：图表题先读时间轴，再辨符号和重测标记。","ref":"教材第191—193页","chapter":"基础护理学第8章｜医疗与护理文件","href":"fundamentals/ch08-documentation.html","kind":"normal","relation":""},{"type":"concept","label":"医嘱处理","tag":"使用情境 / 考法","detail":"先急后缓，临时医嘱及时执行，长期医嘱按规定转抄、核对与签名。 考法线索：口头医嘱仅用于抢救并需复述核对、事后补录。","ref":"教材第193—196页","chapter":"基础护理学第8章｜医疗与护理文件","href":"fundamentals/ch08-documentation.html","kind":"normal","relation":""},{"type":"concept","label":"特别护理记录","tag":"使用情境 / 考法","detail":"危重和病情变化患者按时间记录生命体征、出入量、措施及反应。 考法线索：记录不仅写做了什么，还要写患者反应。","ref":"教材第196—197页","chapter":"基础护理学第8章｜医疗与护理文件","href":"fundamentals/ch08-documentation.html","kind":"normal","relation":""},{"type":"concept","label":"交班报告","tag":"使用情境 / 考法","detail":"围绕新入、危重、手术、特殊检查和待完成事项突出变化与风险。 考法线索：交班不是复制整份病历，而是保证连续照护。","ref":"教材第197—204页","chapter":"基础护理学第8章｜医疗与护理文件","href":"fundamentals/ch08-documentation.html","kind":"safe","relation":""},{"type":"concept","label":"医嘱种类","tag":"使用情境 / 考法","detail":"长期医嘱持续有效，临时医嘱通常24小时内执行一次，备用医嘱按条件执行。 考法线索：先看有效时间和是否需重复执行。","ref":"教材第194页","chapter":"基础护理学第8章｜医疗与护理文件","href":"fundamentals/ch08-documentation.html","kind":"normal","relation":""},{"type":"concept","label":"口头医嘱","tag":"使用情境 / 考法","detail":"仅抢救等紧急情况下使用；护士复述，双方确认，执行后保留安瓿并及时补记。 考法线索：关键是复述核对和追溯，不是机械拒绝。","ref":"教材第195页","chapter":"基础护理学第8章｜医疗与护理文件","href":"fundamentals/ch08-documentation.html","kind":"normal","relation":""},{"type":"concept","label":"体温单符号","tag":"使用情境 / 考法","detail":"口温、腋温、肛温和脉搏使用不同符号；脉搏短绌需同时记录心率和脉率。 考法线索：先辨测量项目再连线，不能混符号。","ref":"教材第192—193页","chapter":"基础护理学第8章｜医疗与护理文件","href":"fundamentals/ch08-documentation.html","kind":"safe","relation":""},{"type":"cross","label":"特殊病室温度","tag":"跨章节数值 · 环境","detail":"特殊病室温度：22～24℃。适用条件与安全边界：新生儿、老年人、产房及手术室等","ref":"教材第15—16页","chapter":"基础护理学第2章｜环境","href":"fundamentals/ch02-environment.html","kind":"cross"},{"type":"cross","label":"休克卧位","tag":"跨章节数值 · 患者入院和出院的护理","detail":"休克卧位：头胸抬高10°～20°，下肢抬高20°～30°。适用条件与安全边界：兼顾呼吸和回心血量","ref":"教材第91页","chapter":"基础护理学第4章｜患者入院和出院的护理","href":"fundamentals/ch04-admission-discharge.html","kind":"cross"},{"type":"cross","label":"床单位怎么选","tag":"跨章节 · 患者入院和出院的护理","detail":"根据患者是否暂离、是否新入院，以及麻醉和手术方式选择床型。","ref":"教材第80—87页","chapter":"基础护理学第4章｜患者入院和出院的护理","href":"fundamentals/ch04-admission-discharge.html","kind":"cross","relation":"手术"},{"type":"cross","label":"卧位从目的和病情反推","tag":"跨章节 · 患者入院和出院的护理","detail":"先看意识、呼吸、循环和治疗目的，再核对禁忌、管路与安全条件。","ref":"教材第89—94页","chapter":"基础护理学第4章｜患者入院和出院的护理","href":"fundamentals/ch04-admission-discharge.html","kind":"cross","relation":"呼吸"},{"type":"cross","label":"跌倒与坠床","tag":"跨章节 · 患者的安全与护士的职业防护","detail":"改善环境、合理用药、呼叫可及、陪护与个体化活动指导共同预防。 考法线索：病例题常考夜间、如厕和体位性低血压。","ref":"教材第113—118页","chapter":"基础护理学第5章｜患者的安全与护士的职业防护","href":"fundamentals/ch05-safety-occupational-protection.html","kind":"cross","relation":"血压"}]},{"id":"fundamentals/ch09-vital-signs.html","label":"生命体征的评估与护理","title":"以“生命体征的评估与护理”为中心｜用途、数值与跨章联系","center":"生命体征的评估与护理","chapter":"基础护理学第9章｜生命体征的评估与护理","href":"fundamentals/ch09-vital-signs.html","items":[{"type":"number","label":"正常口温","tag":"36.3～37.2℃","detail":"正常口温：36.3～37.2℃。适用条件与安全边界：口腔舌下测量","ref":"教材第207页","chapter":"基础护理学第9章｜生命体征的评估与护理","href":"fundamentals/ch09-vital-signs.html","kind":"normal"},{"type":"number","label":"正常腋温","tag":"36.0～37.0℃","detail":"正常腋温：36.0～37.0℃。适用条件与安全边界：腋窝紧贴皮肤","ref":"教材第207页","chapter":"基础护理学第9章｜生命体征的评估与护理","href":"fundamentals/ch09-vital-signs.html","kind":"normal"},{"type":"number","label":"正常肛温","tag":"36.5～37.7℃","detail":"正常肛温：36.5～37.7℃。适用条件与安全边界：直肠测量","ref":"教材第207页","chapter":"基础护理学第9章｜生命体征的评估与护理","href":"fundamentals/ch09-vital-signs.html","kind":"normal"},{"type":"number","label":"发热分度","tag":"37.3～38.0低热；38.1～39.0中热；39.1～41.0高热；＞41超高热","detail":"发热分度：37.3～38.0低热；38.1～39.0中热；39.1～41.0高热；＞41超高热。适用条件与安全边界：以口温为例","ref":"教材第208页","chapter":"基础护理学第9章｜生命体征的评估与护理","href":"fundamentals/ch09-vital-signs.html","kind":"normal"},{"type":"number","label":"测温时间","tag":"口温、肛温3 min；腋温10 min","detail":"测温时间：口温、肛温3 min；腋温10 min。适用条件与安全边界：测量方法正确时使用","ref":"教材第212—213页","chapter":"基础护理学第9章｜生命体征的评估与护理","href":"fundamentals/ch09-vital-signs.html","kind":"normal"},{"type":"number","label":"肛表插入","tag":"成人3～4 cm；婴儿1.25 cm；幼儿2.5 cm","detail":"肛表插入：成人3～4 cm；婴儿1.25 cm；幼儿2.5 cm。适用条件与安全边界：避免损伤","ref":"教材第213页","chapter":"基础护理学第9章｜生命体征的评估与护理","href":"fundamentals/ch09-vital-signs.html","kind":"safe"},{"type":"number","label":"运动进食后复测","tag":"休息30 min","detail":"运动进食后复测：休息30 min。适用条件与安全边界：排除短暂影响","ref":"教材第212页","chapter":"基础护理学第9章｜生命体征的评估与护理","href":"fundamentals/ch09-vital-signs.html","kind":"normal"},{"type":"number","label":"冷疗后复测","tag":"30 min","detail":"冷疗后复测：30 min。适用条件与安全边界：观察体温变化","ref":"教材第209页","chapter":"基础护理学第9章｜生命体征的评估与护理","href":"fundamentals/ch09-vital-signs.html","kind":"normal"},{"type":"number","label":"成人脉搏","tag":"60～100次/min","detail":"成人脉搏：60～100次/min。适用条件与安全边界：静息状态","ref":"教材第216页","chapter":"基础护理学第9章｜生命体征的评估与护理","href":"fundamentals/ch09-vital-signs.html","kind":"normal"},{"type":"number","label":"成人呼吸","tag":"16～20次/min","detail":"成人呼吸：16～20次/min。适用条件与安全边界：静息状态","ref":"教材第226页","chapter":"基础护理学第9章｜生命体征的评估与护理","href":"fundamentals/ch09-vital-signs.html","kind":"normal"},{"type":"number","label":"呼吸与脉搏","tag":"约1:4","detail":"呼吸与脉搏：约1:4。适用条件与安全边界：成人正常参考","ref":"教材第226页","chapter":"基础护理学第9章｜生命体征的评估与护理","href":"fundamentals/ch09-vital-signs.html","kind":"normal"},{"type":"number","label":"成人血压","tag":"收缩压90～139、舒张压60～89 mmHg","detail":"成人血压：收缩压90～139、舒张压60～89 mmHg。适用条件与安全边界：结合重复测量和危险因素判断","ref":"教材第220页","chapter":"基础护理学第9章｜生命体征的评估与护理","href":"fundamentals/ch09-vital-signs.html","kind":"safe"},{"type":"number","label":"正常脉压","tag":"30～40 mmHg","detail":"正常脉压：30～40 mmHg。适用条件与安全边界：收缩压减舒张压","ref":"教材第220页","chapter":"基础护理学第9章｜生命体征的评估与护理","href":"fundamentals/ch09-vital-signs.html","kind":"normal"},{"type":"number","label":"袖带下缘","tag":"距肘窝2～3 cm","detail":"袖带下缘：距肘窝2～3 cm。适用条件与安全边界：松紧可容一指","ref":"教材第224页","chapter":"基础护理学第9章｜生命体征的评估与护理","href":"fundamentals/ch09-vital-signs.html","kind":"normal"},{"type":"number","label":"氧浓度估算","tag":"FiO₂≈21＋4×氧流量(L/min)","detail":"氧浓度估算：FiO₂≈21＋4×氧流量(L/min)。适用条件与安全边界：鼻导管低流量吸氧估算","ref":"教材第232页","chapter":"基础护理学第9章｜生命体征的评估与护理","href":"fundamentals/ch09-vital-signs.html","kind":"normal"},{"type":"number","label":"氧气筒余压","tag":"至少保留0.5 MPa","detail":"氧气筒余压：至少保留0.5 MPa。适用条件与安全边界：防灰尘进入与再次充装爆炸风险","ref":"教材第234页","chapter":"基础护理学第9章｜生命体征的评估与护理","href":"fundamentals/ch09-vital-signs.html","kind":"safe"},{"type":"number","label":"成人标准袖带","tag":"气囊长22～26 cm、宽约12 cm","detail":"成人标准袖带：气囊长22～26 cm、宽约12 cm。适用条件与安全边界：常用于臂围25～35 cm","ref":"教材第222、225页","chapter":"基础护理学第9章｜生命体征的评估与护理","href":"fundamentals/ch09-vital-signs.html","kind":"normal"},{"type":"number","label":"大号袖带","tag":"臂围＞32 cm考虑","detail":"大号袖带：臂围＞32 cm考虑。适用条件与安全边界：过窄袖带可使读数偏高","ref":"教材第225页","chapter":"基础护理学第9章｜生命体征的评估与护理","href":"fundamentals/ch09-vital-signs.html","kind":"normal"},{"type":"number","label":"鼻导管流量","tag":"1～5 L/min","detail":"鼻导管流量：1～5 L/min。适用条件与安全边界：常规低流量给氧","ref":"教材第235页","chapter":"基础护理学第9章｜生命体征的评估与护理","href":"fundamentals/ch09-vital-signs.html","kind":"normal"},{"type":"number","label":"文丘里面罩","tag":"约2～15 L/min","detail":"文丘里面罩：约2～15 L/min。适用条件与安全边界：按喷嘴准确给定氧浓度","ref":"教材第235页","chapter":"基础护理学第9章｜生命体征的评估与护理","href":"fundamentals/ch09-vital-signs.html","kind":"normal"},{"type":"number","label":"高流量鼻导管","tag":"约8～80 L/min，FiO₂ 21%～100%","detail":"高流量鼻导管：约8～80 L/min，FiO₂ 21%～100%。适用条件与安全边界：需加温加湿","ref":"教材第236页","chapter":"基础护理学第9章｜生命体征的评估与护理","href":"fundamentals/ch09-vital-signs.html","kind":"normal"},{"type":"number","label":"氧中毒风险","tag":"吸入氧浓度＞60%且持续＞24 h","detail":"氧中毒风险：吸入氧浓度＞60%且持续＞24 h。适用条件与安全边界：尽量用最低有效浓度","ref":"教材第236页","chapter":"基础护理学第9章｜生命体征的评估与护理","href":"fundamentals/ch09-vital-signs.html","kind":"normal"},{"type":"number","label":"Ⅱ型呼衰氧疗","tag":"常用1～2 L/min持续低流量","detail":"Ⅱ型呼衰氧疗：常用1～2 L/min持续低流量。适用条件与安全边界：同时观察意识、呼吸和血气","ref":"教材第236页","chapter":"基础护理学第9章｜生命体征的评估与护理","href":"fundamentals/ch09-vital-signs.html","kind":"normal"},{"type":"concept","label":"体温","tag":"使用情境 / 考法","detail":"选择合适部位，排除活动、进食和局部因素，结合热型与伴随症状判断。 考法线索：测量部位、时间和禁忌经常组合命题。","ref":"教材第206—215页","chapter":"基础护理学第9章｜生命体征的评估与护理","href":"fundamentals/ch09-vital-signs.html","kind":"safe","relation":""},{"type":"concept","label":"脉搏","tag":"使用情境 / 考法","detail":"观察频率、节律、强弱和动脉壁状态，必要时与心率比较。 考法线索：脉搏短绌需两名护士同时测心率和脉率。","ref":"教材第215—219页","chapter":"基础护理学第9章｜生命体征的评估与护理","href":"fundamentals/ch09-vital-signs.html","kind":"normal","relation":""},{"type":"concept","label":"血压","tag":"使用情境 / 考法","detail":"袖带尺寸、肢体位置、放气速度和患者状态都会影响读数。 考法线索：误差题要求指出读数偏高还是偏低。","ref":"教材第219—226页","chapter":"基础护理学第9章｜生命体征的评估与护理","href":"fundamentals/ch09-vital-signs.html","kind":"normal","relation":""},{"type":"concept","label":"呼吸","tag":"使用情境 / 考法","detail":"患者不知情时连续观察频率、节律、深浅、声音和困难程度。 考法线索：异常呼吸要同时联系病因和护理。","ref":"教材第226—230页","chapter":"基础护理学第9章｜生命体征的评估与护理","href":"fundamentals/ch09-vital-signs.html","kind":"normal","relation":""},{"type":"concept","label":"氧疗","tag":"使用情境 / 考法","detail":"先判断低氧和病因，选择装置、流量与湿化，持续评价效果和不良反应。 考法线索：慢性Ⅱ型呼衰常考低流量、低浓度持续给氧。","ref":"教材第230—239页","chapter":"基础护理学第9章｜生命体征的评估与护理","href":"fundamentals/ch09-vital-signs.html","kind":"normal","relation":""},{"type":"concept","label":"测温禁忌","tag":"使用情境 / 考法","detail":"婴幼儿、昏迷、口腔疾患等不宜口温；腹泻、直肠术后等不宜肛温；腋下创伤或手术侧需避开。 考法线索：测量部位由患者条件决定，不是只选最方便。","ref":"教材第211—213页","chapter":"基础护理学第9章｜生命体征的评估与护理","href":"fundamentals/ch09-vital-signs.html","kind":"normal","relation":""},{"type":"concept","label":"脉搏短绌","tag":"使用情境 / 考法","detail":"心率大于脉率时由两人同时测量1分钟，记录心率/脉率。 考法线索：常见于心房颤动，不能分别在不同时间测。","ref":"教材第217页","chapter":"基础护理学第9章｜生命体征的评估与护理","href":"fundamentals/ch09-vital-signs.html","kind":"safe","relation":""},{"type":"concept","label":"血压误差方向","tag":"使用情境 / 考法","detail":"袖带过窄、缠得过松或手臂低于心脏可使读数偏高；相反条件可偏低。 考法线索：先看袖带、手臂、视线和放气速度再判断误差方向。","ref":"教材第223—225页","chapter":"基础护理学第9章｜生命体征的评估与护理","href":"fundamentals/ch09-vital-signs.html","kind":"normal","relation":""},{"type":"concept","label":"给氧安全","tag":"使用情境 / 考法","detail":"氧疗是用药，需核对装置、流量和目标，防火防油防震，观察疗效和二氧化碳潴留。 考法线索：Ⅱ型呼衰不能因低氧擅自调成高流量。","ref":"教材第231—237页","chapter":"基础护理学第9章｜生命体征的评估与护理","href":"fundamentals/ch09-vital-signs.html","kind":"safe","relation":""},{"type":"cross","label":"特殊病室温度","tag":"跨章节数值 · 环境","detail":"特殊病室温度：22～24℃。适用条件与安全边界：新生儿、老年人、产房及手术室等","ref":"教材第15—16页","chapter":"基础护理学第2章｜环境","href":"fundamentals/ch02-environment.html","kind":"cross"},{"type":"cross","label":"地面防滑系数","tag":"跨章节数值 · 环境","detail":"地面防滑系数：＜0.50不安全；0.50～0.79安全；≥0.80很安全。适用条件与安全边界：医院区域按风险选择等级","ref":"教材第17页","chapter":"基础护理学第2章｜环境","href":"fundamentals/ch02-environment.html","kind":"cross"},{"type":"cross","label":"课程定位","tag":"跨章节 · 绪论","detail":"基础护理把基本理论、知识和技能用于患者的基本需要与安全。 考法线索：常把课程任务放进新护士的工作情境中判断。","ref":"教材第1—2页","chapter":"基础护理学第1章｜绪论","href":"fundamentals/ch01-introduction.html","kind":"cross","relation":"安全"},{"type":"cross","label":"护理程序","tag":"跨章节 · 绪论","detail":"评估贯穿全过程，随后识别问题、计划、实施并评价。 考法线索：方案题先问资料是否充分，再排优先级。","ref":"教材第3—4页","chapter":"基础护理学第1章｜绪论","href":"fundamentals/ch01-introduction.html","kind":"cross","relation":"评估"},{"type":"cross","label":"整体护理","tag":"跨章节 · 绪论","detail":"同一技术要同时照顾生理安全、心理感受、文化与家庭支持。 考法线索：病例常用隐私、焦虑和参与决策检验整体观。","ref":"教材第3—4页","chapter":"基础护理学第1章｜绪论","href":"fundamentals/ch01-introduction.html","kind":"cross","relation":"安全"}]},{"id":"fundamentals/ch10-heat-cold.html","label":"冷、热疗法","title":"以“冷、热疗法”为中心｜用途、数值与跨章联系","center":"冷、热疗法","chapter":"基础护理学第10章｜冷、热疗法","href":"fundamentals/ch10-heat-cold.html","items":[{"type":"number","label":"冷热疗持续时间","tag":"一般20～30 min，间隔约1 h","detail":"冷热疗持续时间：一般20～30 min，间隔约1 h。适用条件与安全边界：防止继发效应和组织损伤","ref":"教材第242页","chapter":"基础护理学第10章｜冷、热疗法","href":"fundamentals/ch10-heat-cold.html","kind":"normal"},{"type":"number","label":"冰袋装量","tag":"约1/2～2/3满","detail":"冰袋装量：约1/2～2/3满。适用条件与安全边界：排气并检查漏水","ref":"教材第245页","chapter":"基础护理学第10章｜冷、热疗法","href":"fundamentals/ch10-heat-cold.html","kind":"normal"},{"type":"number","label":"冰袋降温停用线","tag":"体温降至39℃以下","detail":"冰袋降温停用线：体温降至39℃以下。适用条件与安全边界：停用后30 min复测","ref":"教材第245页","chapter":"基础护理学第10章｜冷、热疗法","href":"fundamentals/ch10-heat-cold.html","kind":"safe"},{"type":"number","label":"冷湿敷","tag":"18～20℃，每3～5 min更换，共15～20 min","detail":"冷湿敷：18～20℃，每3～5 min更换，共15～20 min。适用条件与安全边界：保持敷布低温","ref":"教材第246页","chapter":"基础护理学第10章｜冷、热疗法","href":"fundamentals/ch10-heat-cold.html","kind":"normal"},{"type":"number","label":"温水擦浴","tag":"32～34℃","detail":"温水擦浴：32～34℃。适用条件与安全边界：高热物理降温","ref":"教材第248页","chapter":"基础护理学第10章｜冷、热疗法","href":"fundamentals/ch10-heat-cold.html","kind":"normal"},{"type":"number","label":"乙醇擦浴","tag":"25%～35%，约200～300 ml","detail":"乙醇擦浴：25%～35%，约200～300 ml。适用条件与安全边界：禁擦胸前区、腹部、后颈和足底等","ref":"教材第248页","chapter":"基础护理学第10章｜冷、热疗法","href":"fundamentals/ch10-heat-cold.html","kind":"normal"},{"type":"number","label":"热水袋","tag":"一般60～70℃；老年、婴幼儿、昏迷等约50℃","detail":"热水袋：一般60～70℃；老年、婴幼儿、昏迷等约50℃。适用条件与安全边界：装1/2～2/3满并加布套","ref":"教材第250页","chapter":"基础护理学第10章｜冷、热疗法","href":"fundamentals/ch10-heat-cold.html","kind":"normal"},{"type":"number","label":"热湿敷","tag":"50～60℃，每3～5 min更换","detail":"热湿敷：50～60℃，每3～5 min更换。适用条件与安全边界：总时间依耐受控制","ref":"教材第252页","chapter":"基础护理学第10章｜冷、热疗法","href":"fundamentals/ch10-heat-cold.html","kind":"normal"},{"type":"number","label":"红外线灯","tag":"距患处30～50 cm，照射20～30 min","detail":"红外线灯：距患处30～50 cm，照射20～30 min。适用条件与安全边界：以温热舒适、皮肤粉红为宜","ref":"教材第253页","chapter":"基础护理学第10章｜冷、热疗法","href":"fundamentals/ch10-heat-cold.html","kind":"normal"},{"type":"number","label":"低温烫伤","tag":"可发生于43～60℃持续接触","detail":"低温烫伤：可发生于43～60℃持续接触。适用条件与安全边界：感觉障碍和昏迷患者风险高","ref":"教材第256页","chapter":"基础护理学第10章｜冷、热疗法","href":"fundamentals/ch10-heat-cold.html","kind":"safe"},{"type":"concept","label":"冷疗效应","tag":"使用情境 / 考法","detail":"使局部血管收缩、减轻充血出血和疼痛，并降低组织代谢。 考法线索：早期软组织损伤常考先冷后热。","ref":"教材第241—243页","chapter":"基础护理学第10章｜冷、热疗法","href":"fundamentals/ch10-heat-cold.html","kind":"normal","relation":""},{"type":"concept","label":"热疗效应","tag":"使用情境 / 考法","detail":"扩张血管、促进循环、减轻慢性炎症和肌肉痉挛。 考法线索：急腹症未确诊、出血或软组织损伤早期禁热。","ref":"教材第243—249页","chapter":"基础护理学第10章｜冷、热疗法","href":"fundamentals/ch10-heat-cold.html","kind":"normal","relation":""},{"type":"concept","label":"冷疗禁忌","tag":"使用情境 / 考法","detail":"血液循环障碍、组织损伤、对冷过敏及枕后耳廓阴囊心前区腹部足底等慎禁。 考法线索：题干常给部位让选是否可用冰袋。","ref":"教材第243—249页","chapter":"基础护理学第10章｜冷、热疗法","href":"fundamentals/ch10-heat-cold.html","kind":"normal","relation":""},{"type":"concept","label":"热疗禁忌","tag":"使用情境 / 考法","detail":"未明确诊断的急腹症、面部危险三角区感染、出血和知觉障碍者需避免或慎用。 考法线索：禁忌题要说明热会加重什么风险。","ref":"教材第249—254页","chapter":"基础护理学第10章｜冷、热疗法","href":"fundamentals/ch10-heat-cold.html","kind":"safe","relation":""},{"type":"concept","label":"安全观察","tag":"使用情境 / 考法","detail":"隔布保护，定时查看皮肤、循环和感觉，出现异常立即停止。 考法线索：意识或感觉障碍患者需更密切观察。","ref":"教材第243—255页","chapter":"基础护理学第10章｜冷、热疗法","href":"fundamentals/ch10-heat-cold.html","kind":"normal","relation":""},{"type":"concept","label":"冷热疗共同边界","tag":"使用情境 / 考法","detail":"使用前评估皮肤感觉、循环、意识和治疗部位；过程中观察颜色、疼痛和全身反应。 考法线索：昏迷、感觉障碍和末梢循环差者最易发生损伤。","ref":"教材第241—244页","chapter":"基础护理学第10章｜冷、热疗法","href":"fundamentals/ch10-heat-cold.html","kind":"normal","relation":""},{"type":"cross","label":"地面防滑系数","tag":"跨章节数值 · 环境","detail":"地面防滑系数：＜0.50不安全；0.50～0.79安全；≥0.80很安全。适用条件与安全边界：医院区域按风险选择等级","ref":"教材第17页","chapter":"基础护理学第2章｜环境","href":"fundamentals/ch02-environment.html","kind":"cross"},{"type":"c tml","kind":"normal"},{"type":"number","label":"限制脂肪与胆固醇","tag":"低脂＜50 g/d；肝胆胰疾病＜40 g/d；胆固醇＜300 mg/d","detail":"限制脂肪与胆固醇：低脂＜50 g/d；肝胆胰疾病＜40 g/d；胆固醇＜300 mg/d。适用条件与安全边界：按疾病类型限制动物脂肪和高胆固醇食物","ref":"教材第265页","chapter":"基础护理学第11章｜饮食与营养","href":"fundamentals/ch11-nutrition.html","kind":"normal"},{"type":"number","label":"低盐与低钠","tag":"低盐食盐＜2 g/d；无盐饮食钠＜0.7 g/d；低钠饮食钠＜0.5 g/d","detail":"低盐与低钠：低盐食盐＜2 g/d；无盐饮食钠＜0.7 g/d；低钠饮食钠＜0.5 g/d。适用条件与安全边界：水肿、高血压及心肾疾病按医嘱选择","ref":"教材第265页","chapter":"基础护理学第11章｜饮食与营养","href":"fundamentals/ch11-nutrition.html","kind":"normal"},{"type":"number","label":"葡萄糖耐量试验饮食","tag":"试验前糖类＞300 g/d共3 d；禁食10～12 h；葡萄糖75 g溶于300 ml水","detail":"葡萄糖耐量试验饮食：试验前糖类＞300 g/d共3 d；禁食10～12 h；葡萄糖75 g溶于300 ml水。适用条件与安全边界：服糖后0.5、1、2、3 h采血","ref":"教材第266页","chapter":"基础护理学第11章｜饮食与营养","href":"fundamentals/ch11-nutrition.html","kind":"normal"},{"type":"number","label":"鼻饲管插入","tag":"成人约45～55 cm；到咽喉部约10～15 cm","detail":"鼻饲管插入：成人约45～55 cm；到咽喉部约10～15 cm。适用条件与安全边界：按鼻尖—耳垂—剑突长度标记；清醒者到咽部后配合吞咽","ref":"教材第270—272页","chapter":"基础护理学第11章｜饮食与营养","href":"fundamentals/ch11-nutrition.html","kind":"normal"},{"type":"number","label":"分次鼻饲","tag":"38～40℃；每日4～6次；每次250～400 ml；速度≤30 ml/min","detail":"分次鼻饲：38～40℃；每日4～6次；每次250～400 ml；速度≤30 ml/min。适用条件与安全边界：每次前确认管位、检查通畅，结束后冲管","ref":"教材第271—272页","chapter":"基础护理学第11章｜饮食与营养","href":"fundamentals/ch11-nutrition.html","kind":"normal"},{"type":"number","label":"鼻饲后体位","tag":"维持原卧位20～30 min","detail":"鼻饲后体位：维持原卧位20～30 min。适用条件与安全边界：预防呕吐和误吸","ref":"教材第271页","chapter":"基础护理学第11章｜饮食与营养","href":"fundamentals/ch11-nutrition.html","kind":"normal"},{"type":"number","label":"鼻饲管更换与口腔护理","tag":"长期鼻饲每日口腔护理2次；普通胃管每周、硅胶胃管每月更换","detail":"鼻饲管更换与口腔护理：长期鼻饲每日口腔护理2次；普通胃管每周、硅胶胃管每月更换。适用条件与安全边界：晚间拔管，次晨从另一侧鼻孔插入","ref":"教材第272页","chapter":"基础护理学第11章｜饮食与营养","href":"fundamentals/ch11-nutrition.html","kind":"normal"},{"type":"number","label":"肠内营养输注","tag":"冲管每2～4 h；间歇输注3 h后休息2 h；连续输注12～24 h","detail":"肠内营养输注：冲管每2～4 h；间歇输注3 h后休息2 h；连续输注12～24 h。适用条件与安全边界：冲洗液约37℃，防堵管并给患者休息","ref":"教材第2
