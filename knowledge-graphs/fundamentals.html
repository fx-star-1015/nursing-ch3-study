const N=[{"book":"基础护理学","title":"课程定位","summary":"基础护理把基本理论、知识和技能用于患者的基本需要与安全。","exam":"常把课程任务放进新护士的工作情境中判断。","page":"教材第1—2页","chapter":"基础护理学第1章｜绪论","href":"fundamentals/ch01-introduction.html"},{"book":"基础护理学","title":"学习对象","summary":"学习不能只记操作步骤，还要理解对象、条件、风险和评价标准。","exam":"题干改变患者条件时，要同步改变护理选择。","page":"教材第2—3页","chapter":"基础护理学第1章｜绪论","href":"fundamentals/ch01-introduction.html"},{"book":"基础护理学","title":"护理程序","summary":"评估贯穿全过程，随后识别问题、计划、实施并评价。","exam":"方案题先问资料是否充分，再排优先级。","page":"教材第3—4页","chapter":"基础护理学第1章｜绪论","href":"fundamentals/ch01-introduction.html"},{"book":"基础护理学","title":"整体护理","summary":"同一技术要同时照顾生理安全、心理感受、文化与家庭支持。","exam":"病例常用隐私、焦虑和参与决策检验整体观。","page":"教材第3—4页","chapter":"基础护理学第1章｜绪论","href":"fundamentals/ch01-introduction.html"},{"book":"基础护理学","title":"专业素质","summary":"慎独、沟通、协作、观察与规范操作共同保证护理质量。","exam":"无人监督仍按制度执行是慎独的典型线索。","page":"教材第4—5页","chapter":"基础护理学第1章｜绪论","href":"fundamentals/ch01-introduction.html"},{"book":"基础护理学","title":"环境与健康","summary":"自然、社会和治疗性环境共同影响患者的安全、舒适和恢复。","exam":"题干常要求指出环境因素怎样改变健康结局。","page":"教材第7—12页","chapter":"基础护理学第2章｜环境","href":"fundamentals/ch02-environment.html"},{"book":"基础护理学","title":"医院环境特点","summary":"服务对象复杂、专业分工协作，并以安全、舒适和治疗为目标。","exam":"不能只答安静整洁，要写出专业性与安全性。","page":"教材第13—15页","chapter":"基础护理学第2章｜环境","href":"fundamentals/ch02-environment.html"},{"book":"基础护理学","title":"温湿度与通风","summary":"依据患者年龄、病情和治疗需要调节温度、湿度、光线与空气。","exam":"数字题必须把数值和适用对象绑定。","page":"教材第15—18页","chapter":"基础护理学第2章｜环境","href":"fundamentals/ch02-environment.html"},{"book":"基础护理学","title":"噪声控制","summary":"减少声源、降低传播并调整人员行为，避免突然和持续刺激。","exam":"问护理措施时要覆盖声源、设备、操作与沟通。","page":"教材第18—20页","chapter":"基础护理学第2章｜环境","href":"fundamentals/ch02-environment.html"},{"book":"基础护理学","title":"治疗性关系","summary":"尊重隐私、提供信息、鼓励参与，使患者在陌生环境中获得控制感。","exam":"情境题常把物理环境与心理适应一起考。","page":"教材第20—22页","chapter":"基础护理学第2章｜环境","href":"fundamentals/ch02-environment.html"},{"book":"基础护理学","title":"地面安全分级","summary":"防滑等级必须与区域潮湿和行走风险匹配，不能只看外观是否干净。","exam":"题干给卫生间、治疗室或走廊时，先判断湿滑风险再选材料和管理措施。","page":"教材第17页","chapter":"基础护理学第2章｜环境","href":"fundamentals/ch02-environment.html"},{"book":"基础护理学","title":"患者环境适应","summary":"入院后的陌生、失控和信息不足会加重焦虑，护士应介绍环境、说明规则并尊重隐私。","exam":"环境题不只考温湿度，也会用患者不安考查治疗性环境。","page":"教材第20—22页","chapter":"基础护理学第2章｜环境","href":"fundamentals/ch02-environment.html"},{"book":"基础护理学","title":"医院感染","summary":"结合入院前状态、潜伏期、诊疗活动和感染出现时间综合判断。","exam":"48小时只是常用线索，不能替代完整诊断标准。","page":"教材第24—29页","chapter":"基础护理学第3章｜预防与控制医院感染","href":"fundamentals/ch03-infection-control.html"},{"book":"基础护理学","title":"清洁消毒灭菌","summary":"先看目标层级和物品用途，再选择方法、参数与监测。","exam":"高风险物品需要灭菌，方法正确还要过程合格。","page":"教材第30—44页","chapter":"基础护理学第3章｜预防与控制医院感染","href":"fundamentals/ch03-infection-control.html"},{"book":"基础护理学","title":"手卫生","summary":"依据时机、可见污染和操作风险选择洗手或手消毒，手套不能替代。","exam":"常考五时刻、方法选择和效果监测。","page":"教材第45—51页","chapter":"基础护理学第3章｜预防与控制医院感染","href":"fundamentals/ch03-infection-control.html"},{"book":"基础护理学","title":"无菌技术","summary":"检查包装、日期和状态，划清无菌区，防止跨越、回流和接触污染。","exam":"同一数字必须对应具体对象与起算时间。","page":"教材第51—60页","chapter":"基础护理学第3章｜预防与控制医院感染","href":"fundamentals/ch03-infection-control.html"},{"book":"基础护理学","title":"隔离技术","summary":"标准预防用于所有患者，再按接触、飞沫或空气传播增加措施。","exam":"先判断保护谁和传播途径，再选安置与防护。","page":"教材第60—74页","chapter":"基础护理学第3章｜预防与控制医院感染","href":"fundamentals/ch03-infection-control.html"},{"book":"基础护理学","title":"高危险物品处理","summary":"进入无菌组织或血管系统的物品必须灭菌；接触完整黏膜者需高水平消毒。","exam":"先按物品用途分危险等级，再选消毒灭菌方法。","page":"教材第30—31页","chapter":"基础护理学第3章｜预防与控制医院感染","href":"fundamentals/ch03-infection-control.html"},{"book":"基础护理学","title":"标准预防与附加隔离","summary":"标准预防用于所有患者，明确传播途径后再叠加接触、飞沫或空气隔离。","exam":"不是二选一；手套也不能替代手卫生。","page":"教材第45—74页","chapter":"基础护理学第3章｜预防与控制医院感染","href":"fundamentals/ch03-infection-control.html"},{"book":"基础护理学","title":"无菌边界","summary":"跨越无菌区、手臂低于腰部、无菌物品受潮或接触非无菌面均视为污染。","exam":"情境题要说出哪一步破坏了无菌边界。","page":"教材第51—60页","chapter":"基础护理学第3章｜预防与控制医院感染","href":"fundamentals/ch03-infection-control.html"},{"book":"基础护理学","title":"急危重患者先处理什么","summary":"先抢救和安置，身份及必要资料同步核对；手续可在病情允许后补办。","exam":"","page":"教材第78—80页","chapter":"基础护理学第4章｜患者入院和出院的护理","href":"fundamentals/ch04-admission-discharge.html"},{"book":"基础护理学","title":"床单位怎么选","summary":"根据患者是否暂离、是否新入院，以及麻醉和手术方式选择床型。","exam":"","page":"教材第80—87页","chapter":"基础护理学第4章｜患者入院和出院的护理","href":"fundamentals/ch04-admission-discharge.html"},{"book":"基础护理学","title":"护理级别不是固定标签","summary":"护理级别由病情和自理能力共同决定，并随病情变化重新评估。","exam":"","page":"教材第87—89页","chapter":"基础护理学第4章｜患者入院和出院的护理","href":"fundamentals/ch04-admission-discharge.html"},{"book":"基础护理学","title":"卧位从目的和病情反推","summary":"先看意识、呼吸、循环和治疗目的，再核对禁忌、管路与安全条件。","exam":"","page":"教材第89—94页","chapter":"基础护理学第4章｜患者入院和出院的护理","href":"fundamentals/ch04-admission-discharge.html"},{"book":"基础护理学","title":"脊柱搬运先守住轴线","summary":"多人协调、统一口令，保持头颈躯干轴线，避免扭转和屈曲。","exam":"","page":"教材第98—101页","chapter":"基础护理学第4章｜患者入院和出院的护理","href":"fundamentals/ch04-admission-discharge.html"},{"book":"基础护理学","title":"出院指导要能执行","summary":"评估准备度，完成用药、复诊和资料处理，并确认患者能够复述。","exam":"","page":"教材第102—108页","chapter":"基础护理学第4章｜患者入院和出院的护理","href":"fundamentals/ch04-admission-discharge.html"},{"book":"基础护理学","title":"患者安全评估","summary":"结合年龄、意识、活动能力、药物、环境和既往事件判断风险。","exam":"跌倒高危不是禁止活动，而是增加保护。","page":"教材第110—113页","chapter":"基础护理学第5章｜患者的安全与护士的职业防护","href":"fundamentals/ch05-safety-occupational-protection.html"},{"book":"基础护理学","title":"跌倒与坠床","summary":"改善环境、合理用药、呼叫可及、陪护与个体化活动指导共同预防。","exam":"病例题常考夜间、如厕和体位性低血压。","page":"教材第113—118页","chapter":"基础护理学第5章｜患者的安全与护士的职业防护","href":"fundamentals/ch05-safety-occupational-protection.html"},{"book":"基础护理学","title":"约束保护","summary":"只有在必要且替代措施无效时使用，需告知、记录、观察循环与定时放松。","exam":"不能把约束当惩罚或省事工具。","page":"教材第118—121页","chapter":"基础护理学第5章｜患者的安全与护士的职业防护","href":"fundamentals/ch05-safety-occupational-protection.html"},{"book":"基础护理学","title":"锐器伤处理","summary":"立即局部处理、报告、评估暴露源与暴露级别，按流程随访。","exam":"先处理伤口，再报告评估，顺序常考。","page":"教材第124—129页","chapter":"基础护理学第5章｜患者的安全与护士的职业防护","href":"fundamentals/ch05-safety-occupational-protection.html"},{"book":"基础护理学","title":"职业防护","summary":"通过标准预防、工程控制、安全器具、个人防护和工作制度降低暴露。","exam":"针帽回套和徒手分离针头是高风险操作。","page":"教材第121—130页","chapter":"基础护理学第5章｜患者的安全与护士的职业防护","href":"fundamentals/ch05-safety-occupational-protection.html"},{"book":"基础护理学","title":"约束使用边界","summary":"约束仅在必要且替代措施无效时使用，需解释、记录、持续观察并尽早解除。","exam":"为管理方便或惩罚患者均不成立。","page":"教材第118—121页","chapter":"基础护理学第5章｜患者的安全与护士的职业防护","href":"fundamentals/ch05-safety-occupational-protection.html"},{"book":"基础护理学","title":"跌倒预防","summary":"改善环境、评估体位性低血压和药物、协助如厕与活动、把呼叫器放在可及处。","exam":"高危不等于绝对卧床，保护性活动可避免失用。","page":"教材第113—118页","chapter":"基础护理学第5章｜患者的安全与护士的职业防护","href":"fundamentals/ch05-safety-occupational-protection.html"},{"book":"基础护理学","title":"锐器伤流程","summary":"立即冲洗和适当挤出血液，消毒、报告、评估暴露源与暴露级别，尽快启动预防并随访。","exam":"常考先后顺序，不能先等化验结果再处理伤口。","page":"教材第124—129页","chapter":"基础护理学第5章｜患者的安全与护士的职业防护","href":"fundamentals/ch05-safety-occupational-protection.html"},{"book":"基础护理学","title":"口腔护理","summary":"评估口腔状态和意识，按分泌物、感染或出血风险选择方法与溶液。","exam":"昏迷患者禁忌漱口，棉球不可过湿。","page":"教材第134—139页","chapter":"基础护理学第6章｜患者的清洁卫生","href":"fundamentals/ch06-hygiene.html"},{"book":"基础护理学","title":"头发护理","summary":"关注清洁、梳理、头虱处理及卧床患者安全。","exam":"灭虱题要区分药物处理、包裹时间和物品消毒。","page":"教材第139—143页","chapter":"基础护理学第6章｜患者的清洁卫生","href":"fundamentals/ch06-hygiene.html"},{"book":"基础护理学","title":"皮肤清洁","summary":"依据活动能力和病情选择淋浴、盆浴或床上擦浴，保护管路和隐私。","exam":"饭后、病情不稳或特殊治疗时需调整。","page":"教材第143—151页","chapter":"基础护理学第6章｜患者的清洁卫生","href":"fundamentals/ch06-hygiene.html"},{"book":"基础护理学","title":"压力性损伤","summary":"压力、剪切力、摩擦、潮湿和营养共同影响发生，重点是减压与皮肤管理。","exam":"分期题看组织层次和创面特征，不能只看颜色。","page":"教材第151—159页","chapter":"基础护理学第6章｜患者的清洁卫生","href":"fundamentals/ch06-hygiene.html"},{"book":"基础护理学","title":"会阴与晨晚间护理","summary":"按污染程度由清洁向污染方向操作，结合排泄、导管和舒适需要。","exam":"题干常用留置导尿和失禁检验顺序。","page":"教材第159—166页","chapter":"基础护理学第6章｜患者的清洁卫生","href":"fundamentals/ch06-hygiene.html"},{"book":"基础护理学","title":"漱口液选择","summary":"依据病原体、口腔pH和黏膜情况选择漱口液，浓度和适用对象必须一起记。","exam":"真菌用碱性碳酸氢钠，铜绿假单胞菌用乙酸，厌氧菌用甲硝唑。","page":"教材第137页","chapter":"基础护理学第6章｜患者的清洁卫生","href":"fundamentals/ch06-hygiene.html"},{"book":"基础护理学","title":"压力性损伤分期","summary":"从指压不褪色红斑到皮肤全层缺损、深部组织暴露，分期取决于可见组织层次。","exam":"水疱与浅表破损多见于2期，焦痂覆盖时可能无法分期。","page":"教材第151—158页","chapter":"基础护理学第6章｜患者的清洁卫生","href":"fundamentals/ch06-hygiene.html"},{"book":"基础护理学","title":"沐浴禁忌","summary":"病情不稳定、急性出血、严重呼吸困难或医嘱限制活动时不宜盆浴或淋浴。","exam":"先评估能否耐受，再决定清洁方式。","page":"教材第145—147页","chapter":"基础护理学第6章｜患者的清洁卫生","href":"fundamentals/ch06-hygiene.html"},{"book":"基础护理学","title":"休息与睡眠","summary":"休息减少身心消耗，睡眠按周期维持生理和心理恢复。","exam":"题干常用入睡困难、易醒和早醒区分睡眠问题。","page":"教材第168—175页","chapter":"基础护理学第7章｜休息与活动","href":"fundamentals/ch07-rest-activity.html"},{"book":"基础护理学","title":"睡眠周期","summary":"NREM与REM交替出现，各期生理表现和觉醒难度不同。","exam":"深睡期、做梦期和生理变化是常考线索。","page":"教材第170—174页","chapter":"基础护理学第7章｜休息与活动","href":"fundamentals/ch07-rest-activity.html"},{"book":"基础护理学","title":"睡眠护理","summary":"从环境、习惯、疼痛、焦虑、用药和白天活动共同干预。","exam":"不要把安眠药作为首选且唯一措施。","page":"教材第174—178页","chapter":"基础护理学第7章｜休息与活动","href":"fundamentals/ch07-rest-activity.html"},{"book":"基础护理学","title":"活动受限影响","summary":"长期不活动会累及皮肤、呼吸、循环、消化、泌尿和运动系统。","exam":"问并发症时要跨系统作答。","page":"教材第179—182页","chapter":"基础护理学第7章｜休息与活动","href":"fundamentals/ch07-rest-activity.html"},{"book":"基础护理学","title":"协助活动","summary":"评估病情和肌力，按主动、被动及抗阻活动逐步增加强度。","exam":"活动后出现胸闷、气促或生命体征异常应停止并复评。","page":"教材第182—187页","chapter":"基础护理学第7章｜休息与活动","href":"fundamentals/ch07-rest-activity.html"},{"book":"基础护理学","title":"NREM与REM","summary":"NREM侧重体力恢复，REM与记忆、情绪和梦境相关；夜间周期交替且后半夜REM增多。","exam":"题目常用做梦、快速眼动和肌张力下降定位REM。","page":"教材第169—171页","chapter":"基础护理学第7章｜休息与活动","href":"fundamentals/ch07-rest-activity.html"},{"book":"基础护理学","title":"肌力与活动能力","summary":"肌力评价单一肌群收缩能力，活动能力分级评价完成日常活动所需帮助程度。","exam":"不能把两个分级表混用。","page":"教材第181—182页","chapter":"基础护理学第7章｜休息与活动","href":"fundamentals/ch07-rest-activity.html"},{"book":"基础护理学","title":"记录原则","summary":"及时、准确、完整、简要、清晰并使用规范术语，避免主观评价。","exam":"错字处理和时间签名常以操作判断题出现。","page":"教材第189—191页","chapter":"基础护理学第8章｜医疗与护理文件","href":"fundamentals/ch08-documentation.html"},{"book":"基础护理学","title":"体温单","summary":"集中呈现体温、脉搏、呼吸、血压、出入量等动态趋势。","exam":"图表题先读时间轴，再辨符号和重测标记。","page":"教材第191—193页","chapter":"基础护理学第8章｜医疗与护理文件","href":"fundamentals/ch08-documentation.html"},{"book":"基础护理学","title":"医嘱处理","summary":"先急后缓，临时医嘱及时执行，长期医嘱按规定转抄、核对与签名。","exam":"口头医嘱仅用于抢救并需复述核对、事后补录。","page":"教材第193—196页","chapter":"基础护理学第8章｜医疗与护理文件","href":"fundamentals/ch08-documentation.html"},{"book":"基础护理学","title":"特别护理记录","summary":"危重和病情变化患者按时间记录生命体征、出入量、措施及反应。","exam":"记录不仅写做了什么，还要写患者反应。","page":"教材第196—197页","chapter":"基础护理学第8章｜医疗与护理文件","href":"fundamentals/ch08-documentation.html"},{"book":"基础护理学","title":"交班报告","summary":"围绕新入、危重、手术、特殊检查和待完成事项突出变化与风险。","exam":"交班不是复制整份病历，而是保证连续照护。","page":"教材第197—204页","chapter":"基础护理学第8章｜医疗与护理文件","href":"fundamentals/ch08-documentation.html"},{"book":"基础护理学","title":"医嘱种类","summary":"长期医嘱持续有效，临时医嘱通常24小时内执行一次，备用医嘱按条件执行。","exam":"先看有效时间和是否需重复执行。","page":"教材第194页","chapter":"基础护理学第8章｜医疗与护理文件","href":"fundamentals/ch08-documentation.html"},{"book":"基础护理学","title":"口头医嘱","summary":"仅抢救等紧急情况下使用；护士复述，双方确认，执行后保留安瓿并及时补记。","exam":"关键是复述核对和追溯，不是机械拒绝。","page":"教材第195页","chapter":"基础护理学第8章｜医疗与护理文件","href":"fundamentals/ch08-documentation.html"},{"book":"基础护理学","title":"体温单符号","summary":"口温、腋温、肛温和脉搏使用不同符号；脉搏短绌需同时记录心率和脉率。","exam":"先辨测量项目再连线，不能混符号。","page":"教材第192—193页","chapter":"基础护理学第8章｜医疗与护理文件","href":"fundamentals/ch08-documentation.html"},{"book":"基础护理学","title":"体温","summary":"选择合适部位，排除活动、进食和局部因素，结合热型与伴随症状判断。","exam":"测量部位、时间和禁忌经常组合命题。","page":"教材第206—215页","chapter":"基础护理学第9章｜生命体征的评估与护理","href":"fundamentals/ch09-vital-signs.html"},{"book":"基础护理学","title":"脉搏","summary":"观察频率、节律、强弱和动脉壁状态，必要时与心率比较。","exam":"脉搏短绌需两名护士同时测心率和脉率。","page":"教材第215—219页","chapter":"基础护理学第9章｜生命体征的评估与护理","href":"fundamentals/ch09-vital-signs.html"},{"book":"基础护理学","title":"血压","summary":"袖带尺寸、肢体位置、放气速度和患者状态都会影响读数。","exam":"误差题要求指出读数偏高还是偏低。","page":"教材第219—226页","chapter":"基础护理学第9章｜生命体征的评估与护理","href":"fundamentals/ch09-vital-signs.html"},{"book":"基础护理学","title":"呼吸","summary":"患者不知情时连续观察频率、节律、深浅、声音和困难程度。","exam":"异常呼吸要同时联系病因和护理。","page":"教材第226—230页","chapter":"基础护理学第9章｜生命体征的评估与护理","href":"fundamentals/ch09-vital-signs.html"},{"book":"基础护理学","title":"氧疗","summary":"先判断低氧和病因，选择装置、流量与湿化，持续评价效果和不良反应。","exam":"慢性Ⅱ型呼衰常考低流量、低浓度持续给氧。","page":"教材第230—239页","chapter":"基础护理学第9章｜生命体征的评估与护理","href":"fundamentals/ch09-vital-signs.html"},{"book":"基础护理学","title":"测温禁忌","summary":"婴幼儿、昏迷、口腔疾患等不宜口温；腹泻、直肠术后等不宜肛温；腋下创伤或手术侧需避开。","exam":"测量部位由患者条件决定，不是只选最方便。","page":"教材第211—213页","chapter":"基础护理学第9章｜生命体征的评估与护理","href":"fundamentals/ch09-vital-signs.html"},{"book":"基础护理学","title":"脉搏短绌","summary":"心率大于脉率时由两人同时测量1分钟，记录心率/脉率。","exam":"常见于心房颤动，不能分别在不同时间测。","page":"教材第217页","chapter":"基础护理学第9章｜生命体征的评估与护理","href":"fundamentals/ch09-vital-signs.html"},{"book":"基础护理学","title":"血压误差方向","summary":"袖带过窄、缠得过松或手臂低于心脏可使读数偏高；相反条件可偏低。","exam":"先看袖带、手臂、视线和放气速度再判断误差方向。","page":"教材第223—225页","chapter":"基础护理学第9章｜生命体征的评估与护理","href":"fundamentals/ch09-vital-signs.html"},{"book":"基础护理学","title":"给氧安全","summary":"氧疗是用药，需核对装置、流量和目标，防火防油防震，观察疗效和二氧化碳潴留。","exam":"Ⅱ型呼衰不能因低氧擅自调成高流量。","page":"教材第231—237页","chapter":"基础护理学第9章｜生命体征的评估与护理","href":"fundamentals/ch09-vital-signs.html"},{"book":"基础护理学","title":"冷疗效应","summary":"使局部血管收缩、减轻充血出血和疼痛，并降低组织代谢。","exam":"早期软组织损伤常考先冷后热。","page":"教材第241—243页","chapter":"基础护理学第10章｜冷、热疗法","href":"fundamentals/ch10-heat-cold.html"},{"book":"基础护理学","title":"热疗效应","summary":"扩张血管、促进循环、减轻慢性炎症和肌肉痉挛。","exam":"急腹症未确诊、出血或软组织损伤早期禁热。","page":"教材第243—249页","chapter":"基础护理学第10章｜冷、热疗法","href":"fundamentals/ch10-heat-cold.html"},{"book":"基础护理学","title":"冷疗禁忌","summary":"血液循环障碍、组织损伤、对冷过敏及枕后耳廓阴囊心前区腹部足底等慎禁。","exam":"题干常给部位让选是否可用冰袋。","page":"教材第243—249页","chapter":"基础护理学第10章｜冷、热疗法","href":"fundamentals/ch10-heat-cold.html"},{"book":"基础护理学","title":"热疗禁忌","summary":"未明确诊断的急腹症、面部危险三角区感染、出血和知觉障碍者需避免或慎用。","exam":"禁忌题要说明热会加重什么风险。","page":"教材第249—254页","chapter":"基础护理学第10章｜冷、热疗法","href":"fundamentals/ch10-heat-cold.html"},{"book":"基础护理学","title":"安全观察","summary":"隔布保护，定时查看皮肤、循环和感觉，出现异常立即停止。","exam":"意识或感觉障碍患者需更密切观察。","page":"教材第243—255页","chapter":"基础护理学第10章｜冷、热疗法","href":"fundamentals/ch10-heat-cold.html"},{"book":"基础护理学","title":"冷热疗共同边界","summary":"使用前评估皮肤感觉、循环、意识和治疗部位；过程中观察颜色、疼痛和全身反应。","exam":"昏迷、感觉障碍和末梢循环差者最易发生损伤。","page":"教材第241—244页","chapter":"基础护理学第10章｜冷、热疗法","href":"fundamentals/ch10-heat-cold.html"},{"book":"基础护理学","title":"营养评估","summary":"结合体重变化、摄入、疾病消耗、实验室资料和功能状态判断。","exam":"单次体重不能替代连续趋势和摄入评估。","page":"教材第258—263页","chapter":"基础护理学第11章｜饮食与营养","href":"fundamentals/ch11-nutrition.html"},{"book":"基础护理学","title":"基本饮食","summary":"普通、软质、半流质和流质饮食按咀嚼吞咽及消化能力选择。","exam":"病例题常用术后阶段和消化功能选饮食。","page":"教材第263—265页","chapter":"基础护理学第11章｜饮食与营养","href":"fundamentals/ch11-nutrition.html"},{"book":"基础护理学","title":"治疗饮食","summary":"按疾病需要调整能量、蛋白质、脂肪、盐、纤维或其他成分。","exam":"选择饮食时必须与病情目标配对。","page":"教材第264—266页","chapter":"基础护理学第11章｜饮食与营养","href":"fundamentals/ch11-nutrition.html"},{"book":"基础护理学","title":"一般饮食护理","summary":"营造进食环境，协助体位和餐前准备，记录摄入并观察反应。","exam":"进食困难先评估原因和吞咽安全。","page":"教材第266—269页","chapter":"基础护理学第11章｜饮食与营养","href":"fundamentals/ch11-nutrition.html"},{"book":"基础护理学","title":"鼻饲","summary":"确认管位、采用合适体位和温度，少量分次，保持通畅并防误吸。","exam":"昏迷患者插管和每次喂食前管位确认常考。","page":"教材第269—275页","chapter":"基础护理学第11章｜饮食与营养","href":"fundamentals/ch11-nutrition.html"},{"book":"基础护理学","title":"治疗饮食选择","summary":"治疗饮食不是只背名称，要根据疾病限制或增加能量、蛋白质、脂肪、钠和钾。","exam":"题干给肾衰、肝病、高血压或高代谢时先找需要限制与需要补充的营养素。","page":"教材第264—266页","chapter":"基础护理学第11章｜饮食与营养","href":"fundamentals/ch11-nutrition.html"},{"book":"基础护理学","title":"鼻饲前核对","summary":"每次灌食前确认胃管位置并评估胃残余；灌注中出现呛咳、呼吸困难应立即停止。","exam":"预防误吸比完成喂养量更优先。","page":"教材第270—273页","chapter":"基础护理学第11章｜饮食与营养","href":"fundamentals/ch11-nutrition.html"},{"book":"基础护理学","title":"排尿评估","summary":"结合次数、量、颜色、气味、症状和出入量识别尿潴留、少尿等异常。","exam":"不能只看单次尿量，要联系时间与病情。","page":"教材第279—284页","chapter":"基础护理学第12章｜排泄","href":"fundamentals/ch12-elimination.html"},{"book":"基础护理学","title":"导尿","summary":"严格无菌、正确辨认尿道、轻柔插入、保护隐私并预防逆行感染。","exam":"误入阴道必须更换无菌导尿管再插。","page":"教材第284—291页","chapter":"基础护理学第12章｜排泄","href":"fundamentals/ch12-elimination.html"},{"book":"基础护理学","title":"留置导尿","summary":"保持密闭通畅、尿袋低于膀胱、避免受压扭曲并做好会阴护理。","exam":"不常规随意分离接口或夹闭。","page":"教材第286—291页","chapter":"基础护理学第12章｜排泄","href":"fundamentals/ch12-elimination.html"},{"book":"基础护理学","title":"排便评估","summary":"关注次数、性状、颜色、气味、疼痛及排便习惯，先处理可逆原因。","exam":"便秘护理应含饮食、活动、排便训练。","page":"教材第292—297页","chapter":"基础护理学第12章｜排泄","href":"fundamentals/ch12-elimination.html"},{"book":"基础护理学","title":"灌肠","summary":"依据目的选择溶液、量、温度、体位和插入深度，并观察腹痛、出血和反应。","exam":"肝昏迷、充血性心衰等特殊患者要辨溶液禁忌。","page":"教材第297—305页","chapter":"基础护理学第12章｜排泄","href":"fundamentals/ch12-elimination.html"},{"book":"基础护理学","title":"尿失禁辨析","summary":"真性、充溢性、压力性、急迫性和功能性尿失禁的病因与表现不同。","exam":"看膀胱是否过度充盈、是否有强烈尿意及诱发动作。","page":"教材第282—285页","chapter":"基础护理学第12章｜排泄","href":"fundamentals/ch12-elimination.html"},{"book":"基础护理学","title":"导尿感染预防","summary":"无菌置管、保持密闭、尿袋低于膀胱、避免反流和不必要断开，尽早拔管。","exam":"常规冲洗和频繁更换并不能替代密闭与尽早拔管。","page":"教材第287—291页","chapter":"基础护理学第12章｜排泄","href":"fundamentals/ch12-elimination.html"},{"book":"基础护理学","title":"灌肠禁忌","summary":"急腹症、消化道出血、妊娠、严重心血管病等需慎用或禁用大量不保留灌肠。","exam":"先看禁忌再计算温度、深度和高度。","page":"教材第299—301页","chapter":"基础护理学第12章｜排泄","href":"fundamentals/ch12-elimination.html"},{"book":"基础护理学","title":"安全给药","summary":"执行查对制度，确认患者、药物、剂量、途径、时间和记录，并解释用药。","exam":"任何异常医嘱都应先核实，不能盲目执行。","page":"教材第307—312页","chapter":"基础护理学第13章｜给药","href":"fundamentals/ch13-medication.html"},{"book":"基础护理学","title":"口服给药","summary":"依据药物剂型、作用和患者吞咽能力安排，特殊剂型不得随意掰碎。","exam":"健胃药、助消化药、催眠药等给药时间常考。","page":"教材第313—315页","chapter":"基础护理学第13章｜给药","href":"fundamentals/ch13-medication.html"},{"book":"基础护理学","title":"注射给药","summary":"选择合适部位和针具，严格无菌，避免神经血管并观察局部反应。","exam":"皮内、皮下、肌内和静脉注射的角度、深度与用途要配对。","page":"教材第315—331页","chapter":"基础护理学第13章｜给药","href":"fundamentals/ch13-medication.html"},{"book":"基础护理学","title":"雾化吸入","summary":"依据治疗目的选药，正确连接装置并指导深慢吸气、屏气和呼气。","exam":"氧气雾化要同时考流量和禁火防油。","page":"教材第331—338页","chapter":"基础护理学第13章｜给药","href":"fundamentals/ch13-medication.html"},{"book":"基础护理学","title":"药物过敏试验","summary":"用药前核对过敏史与试验条件，按时判断；阳性或过敏反应立即处理。","exam":"青霉素过敏性休克首选肾上腺素。","page":"教材第338—345页","chapter":"基础护理学第13章｜给药","href":"fundamentals/ch13-medication.html"},{"book":"基础护理学","title":"三查八对","summary":"给药前、中、后查对；核对床号、姓名、药名、浓度、剂量、方法、时间和药品有效期等。","exam":"开放式询问身份，不能只问‘你是不是某某’。","page":"教材第310—313页","chapter":"基础护理学第13章｜给药","href":"fundamentals/ch13-medication.html"},{"book":"基础护理学","title":"给药时间缩写","summary":"ac、pc、hs、prn、sos等必须和给药条件、频次一起识别。","exam":"不要只凭字母形状猜时间。","page":"教材第314—315页","chapter":"基础护理学第13章｜给药","href":"fundamentals/ch13-medication.html"},{"book":"基础护理学","title":"过敏性休克抢救","summary":"立即停药、平卧保暖、就地抢救，首选肾上腺素，同时维持气道和循环。","exam":"顺序题先停致敏药并给肾上腺素，不能先等待医生到场。","page":"教材第342—343页","chapter":"基础护理学第13章｜给药","href":"fundamentals/ch13-medication.html"},{"book":"基础护理学","title":"静脉输液","summary":"依据脱水、电解质、营养和治疗目标选择液体，规范排气、穿刺和固定。","exam":"题干常考滴速计算与巡视。","page":"教材第356—365页","chapter":"基础护理学第14章｜静脉输液与输血","href":"fundamentals/ch14-infusion-transfusion.html"},{"book":"基础护理学","title":"输液反应","summary":"发热、循环负荷过重、静脉炎和空气栓塞需从线索中快速辨认。","exam":"先停或调输液并按类型采取体位、氧疗和报告。","page":"教材第365—371页","chapter":"基础护理学第14章｜静脉输液与输血","href":"fundamentals/ch14-infusion-transfusion.html"},{"book":"基础护理学","title":"输血前","summary":"核对血型、交叉配血、血袋与患者，评估病情并建立合适通路。","exam":"输血前后及两袋血之间用0.9%氯化钠。","page":"教材第372—376页","chapter":"基础护理学第14章｜静脉输液与输血","href":"fundamentals/ch14-infusion-transfusion.html"},{"book":"基础护理学","title":"输血过程","summary":"开始慢速，严密观察，确认无反应后按病情调整；血制品不得随意加药。","exam":"最初15分钟是反应观察重点。","page":"教材第376—381页","chapter":"基础护理学第14章｜静脉输液与输血","href":"fundamentals/ch14-infusion-transfusion.html"},{"book":"基础护理学","title":"输血反应","summary":"过敏、发热、溶血、循环负荷过重和细菌污染反应需按出现时间与表现判断。","exam":"疑似溶血立即停止输血，保留余血并送检。","page":"教材第381—388页","chapter":"基础护理学第14章｜静脉输液与输血","href":"fundamentals/ch14-infusion-transfusion.html"},{"book":"基础护理学","title":"输液反应鉴别","summary":"发热反应以寒战高热为主；循环负荷过重见突发呼吸困难、粉红泡沫痰；静脉炎沿静脉红肿疼痛；空气栓塞可突发胸闷濒死感。","exam":"先凭最有区分度的线索定位，再采取相应体位和处理。","page":"教材第367—372页","chapter":"基础护理学第14章｜静脉输液与输血","href":"fundamentals/ch14-infusion-transfusion.html"},{"book":"基础护理学","title":"血制品选择","summary":"全血、红细胞、血小板、血浆和冷沉淀适应证不同。","exam":"贫血并非一律输全血，要看缺少哪种成分。","page":"教材第374—379页","chapter":"基础护理学第14章｜静脉输液与输血","href":"fundamentals/ch14-infusion-transfusion.html"},{"book":"基础护理学","title":"输血反应处置","summary":"怀疑反应立即停止输血，换生理盐水维持静脉通路，核对并报告，保留血袋送检。","exam":"不能仅减慢滴速后继续观察。","page":"教材第380—384页","chapter":"基础护理学第14章｜静脉输液与输血","href":"fundamentals/ch14-infusion-transfusion.html"},{"book":"基础护理学","title":"标本原则","summary":"正确、及时、足量、具有代表性，并在用药或饮食影响前后按要求采集。","exam":"不能从输液同侧直接采血或擅自改变采集时间。","page":"教材第394—396页","chapter":"基础护理学第15章｜标本采集","href":"fundamentals/ch15-specimen-collection.html"},{"book":"基础护理学","title":"血液标本","summary":"不同检验选择相应试管和抗凝剂，严格核对并避免溶血。","exam":"多管采血顺序和血培养无菌要求常考。","page":"教材第396—403页","chapter":"基础护理学第15章｜标本采集","href":"fundamentals/ch15-specimen-collection.html"},{"book":"基础护理学","title":"尿标本","summary":"常规、中段、定时、培养等目的不同，容器和留取方法随之改变。","exam":"尿培养强调清洁外阴和无菌中段尿。","page":"教材第404—407页","chapter":"基础护理学第15章｜标本采集","href":"fundamentals/ch15-specimen-collection.html"},{"book":"基础护理学","title":"粪便标本","summary":"从异常部分取材，隐血试验需控制饮食和药物干扰。","exam":"标本不能混入尿液、消毒剂或其他污染物。","page":"教材第407—409页","chapter":"基础护理学第15章｜标本采集","href":"fundamentals/ch15-specimen-collection.html"},{"book":"基础护理学","title":"痰与咽拭子","summary":"深呼吸咳出下呼吸道痰，咽拭子避免触及口腔非目标部位并及时送检。","exam":"培养标本一般在抗菌药使用前留取。","page":"教材第409—413页","chapter":"基础护理学第15章｜标本采集","href":"fundamentals/ch15-specimen-collection.html"},{"book":"基础护理学","title":"采血管颜色与用途","summary":"白/红/深黄多用于血清；绿系肝素血浆；紫色EDTA全血；浅蓝枸橼酸钠1:9用于凝血；黑色1:4用于血沉；浅灰抑制糖酵解用于血糖。","exam":"颜色题要同时说添加剂、标本类型、检验用途和是否混匀。","page":"教材第396—397页","chapter":"基础护理学第15章｜标本采集","href":"fundamentals/ch15-specimen-collection.html"},{"book":"基础护理学","title":"静脉采血顺序","summary":"血培养→枸橼酸钠→血清管→肝素管→EDTA管→糖酵解抑制管。","exam":"先防微生物和添加剂污染，再保证凝血检测比例。","page":"教材第400—401页","chapter":"基础护理学第15章｜标本采集","href":"fundamentals/ch15-specimen-collection.html"},{"book":"基础护理学","title":"尿液防腐剂","summary":"不同检测项目选择不同防腐剂；定时尿先混匀、计总量，再按要求留送检部分。","exam":"不能把甲苯、甲醛和浓盐酸互换使用。","page":"教材第405—407页","chapter":"基础护理学第15章｜标本采集","href":"fundamentals/ch15-specimen-collection.html"},{"book":"基础护理学","title":"疼痛概念","summary":"疼痛是与实际或潜在组织损伤相关的主观体验，患者报告是重要依据。","exam":"不能仅凭表情或生命体征否定疼痛。","page":"教材第415—419页","chapter":"基础护理学第16章｜疼痛患者的护理","href":"fundamentals/ch16-pain-care.html"},{"book":"基础护理学","title":"疼痛评估","summary":"评估部位、性质、强度、时间、诱因、缓解因素、功能影响和既往处理。","exam":"选择量表要匹配年龄、认知和沟通能力。","page":"教材第420—425页","chapter":"基础护理学第16章｜疼痛患者的护理","href":"fundamentals/ch16-pain-care.html"},{"book":"基础护理学","title":"药物镇痛","summary":"按疼痛程度和机制选药，规律给药并预防恶心、便秘、呼吸抑制等不良反应。","exam":"癌痛常考按时给药而非痛时才给。","page":"教材第425—431页","chapter":"基础护理学第16章｜疼痛患者的护理","href":"fundamentals/ch16-pain-care.html"},{"book":"基础护理学","title":"非药物干预","summary":"放松、分散注意、音乐、冷/热、体位和心理支持可作为综合方案。","exam":"不能以非药物方法替代必要镇痛。","page":"教材第431—439页","chapter":"基础护理学第16章｜疼痛患者的护理","href":"fundamentals/ch16-pain-care.html"},{"book":"基础护理学","title":"效果评价","summary":"既看评分下降，也看睡眠、活动、咳嗽和康复目标是否改善。","exam":"干预后必须在合适时间复评并记录。","page":"教材第429—441页","chapter":"基础护理学第16章｜疼痛患者的护理","href":"fundamentals/ch16-pain-care.html"},{"book":"基础护理学","title":"疼痛评估原则","summary":"患者自我报告是清醒患者疼痛评估的首要依据，同时评估部位、性质、时间、诱因、功能影响和伴随症状。","exam":"不能因生命体征正常或患者安静就否定疼痛。","page":"教材第421—427页","chapter":"基础护理学第16章｜疼痛患者的护理","href":"fundamentals/ch16-pain-care.html"},{"book":"基础护理学","title":"量表选择","summary":"NRS适合能理解数字者；面部表情量表适合儿童或沟通受限者；行为量表用于不能自述者。","exam":"量表必须匹配认知、语言和意识状态。","page":"教材第424—426页","chapter":"基础护理学第16章｜疼痛患者的护理","href":"fundamentals/ch16-pain-care.html"},{"book":"基础护理学","title":"三阶梯镇痛","summary":"按疼痛程度阶梯用药，按时、个体化、口服优先并注意具体细节。","exam":"爆发痛需解救药，持续痛不能只等疼痛严重再给药。","page":"教材第434—440页","chapter":"基础护理学第16章｜疼痛患者的护理","href":"fundamentals/ch16-pain-care.html"},{"book":"基础护理学","title":"病情观察","summary":"从一般状态、意识、生命体征、瞳孔、出入量、治疗反应和心理变化综合判断。","exam":"危险变化先报告并处理，不能等记录完再行动。","page":"教材第443—447页","chapter":"基础护理学第17章｜病情观察及危重患者的管理","href":"fundamentals/ch17-critical-care.html"},{"book":"基础护理学","title":"危重患者管理","summary":"保持气道、氧合、循环和体温，做好基础护理、管路管理与并发症预防。","exam":"优先级题先抓生命威胁。","page":"教材第447—451页","chapter":"基础护理学第17章｜病情观察及危重患者的管理","href":"fundamentals/ch17-critical-care.html"},{"book":"基础护理学","title":"心肺复苏","summary":"识别无反应和无正常呼吸，呼救取AED并开始高质量胸外按压。","exam":"按压频率、深度、回弹与中断时间常考。","page":"教材第452—458页","chapter":"基础护理学第17章｜病情观察及危重患者的管理","href":"fundamentals/ch17-critical-care.html"},{"book":"基础护理学","title":"洗胃","summary":"先评估适应证和禁忌，保护气道，选择合适溶液并观察出入液和生命体征。","exam":"强腐蚀剂中毒和某些病情禁忌洗胃。","page":"教材第458—461页","chapter":"基础护理学第17章｜病情观察及危重患者的管理","href":"fundamentals/ch17-critical-care.html"},{"book":"基础护理学","title":"人工呼吸器","summary":"监测通气、氧合、同步性、报警、湿化和管路安全，预防相关并发症。","exam":"报警先看患者，再查机器和管路。","page":"教材第461—464页","chapter":"基础护理学第17章｜病情观察及危重患者的管理","href":"fundamentals/ch17-critical-care.html"},{"book":"基础护理学","title":"GCS使用边界","summary":"睁眼、语言和运动三项相加；插管、失语、镇静等会影响评分解释。","exam":"不能只报总分，要写出分项并结合干扰因素。","page":"教材第445—447页","chapter":"基础护理学第17章｜病情观察及危重患者的管理","href":"fundamentals/ch17-critical-care.html"},{"book":"基础护理学","title":"心肺复苏主线","summary":"确认环境安全、判断反应和呼吸、呼救取AED、开始高质量按压，尽早除颤。","exam":"不要为反复测脉搏或长时间通气而延误按压。","page":"教材第452—458页","chapter":"基础护理学第17章｜病情观察及危重患者的管理","href":"fundamentals/ch17-critical-care.html"},{"book":"基础护理学","title":"洗胃禁忌与毒物","summary":"强腐蚀剂、惊厥未控制、上消化道出血或穿孔等禁忌洗胃；不同毒物的洗胃液和解毒剂不同。","exam":"先判能不能洗，再选液体和气道保护。","page":"教材第459—462页","chapter":"基础护理学第17章｜病情观察及危重患者的管理","href":"fundamentals/ch17-critical-care.html"},{"book":"基础护理学","title":"临终关怀","summary":"目标是减轻痛苦、维护尊严和提高剩余生命质量，同时支持家属。","exam":"不是放弃治疗，而是目标转向舒适与价值。","page":"教材第466—471页","chapter":"基础护理学第18章｜临终护理","href":"fundamentals/ch18-end-of-life.html"},{"book":"基础护理学","title":"死亡与濒死","summary":"依据不可逆生命功能停止和规范判断理解死亡过程。","exam":"不能用单一表现随意宣布死亡。","page":"教材第471—474页","chapter":"基础护理学第18章｜临终护理","href":"fundamentals/ch18-end-of-life.html"},{"book":"基础护理学","title":"生理护理","summary":"持续评估疼痛、呼吸困难、分泌物、口腔皮肤、营养排泄和睡眠。","exam":"措施以舒适、安全和患者愿望为中心。","page":"教材第474—476页","chapter":"基础护理学第18章｜临终护理","href":"fundamentals/ch18-end-of-life.html"},{"book":"基础护理学","title":"心理社会护理","summary":"倾听、允许表达、提供真实适量信息，尊重文化宗教与家庭角色。","exam":"不同反应可反复出现，不能机械套五阶段。","page":"教材第476—479页","chapter":"基础护理学第18章｜临终护理","href":"fundamentals/ch18-end-of-life.html"},{"book":"基础护理学","title":"死亡后护理","summary":"尊重遗体与家属，按规定确认、清洁、标识、处理物品和记录。","exam":"有导管或特殊检查要求时按规定保留或处理。","page":"教材第479—482页","chapter":"基础护理学第18章｜临终护理","href":"fundamentals/ch18-end-of-life.html"},{"book":"基础护理学","title":"脑死亡判断","summary":"需按规范综合判定不可逆昏迷、脑干反射消失和自主呼吸停止，并排除低温、药物等可逆因素。","exam":"深昏迷或使用呼吸机不能单独等于脑死亡。","page":"教材第471—474页","chapter":"基础护理学第18章｜临终护理","href":"fundamentals/ch18-end-of-life.html"}], TERMS=["乙醇","酒精","温度","热疗","冷疗","氧疗","氧气","吸氧","呼吸","通气","哮喘","肺炎","肺心病","心衰","心力衰竭","心脏","循环","血压","心率","脉搏","休克","输液","静脉","注射","药物","用药","输血","血糖","胰岛素","血钾","血钠","电解质","酸碱","水肿","肾功能","尿量","导尿","排尿","感染","消毒","灭菌","无菌","隔离","手卫生","疼痛","体位","卧位","跌倒","压疮","营养","饮食","吞咽","手术","麻醉","术前","术后","切口","引流","出血","创伤","骨折","颅压","意识","评估","护理程序","沟通","伦理","隐私","知情同意","分级护理","护理诊断","护理目标","健康教育","生命体征","体温","发热","咳嗽","痰","氧饱和度","SpO₂","钠","钾","血气","胸痛","心电图","心律失常","抗凝","肿瘤","肝硬化","腹水","胰腺炎","消化道出血","便秘","腹泻","皮肤","口腔","清洁","安全"], CHAPTERS=["基础护理学第1章｜绪论","基础护理学第2章｜环境","基础护理学第3章｜预防与控制医院感染","基础护理学第4章｜患者入院和出院的护理","基础护理学第5章｜患者的安全与护士的职业防护","基础护理学第6章｜患者的清洁卫生","基础护理学第7章｜休息与活动","基础护理学第8章｜医疗与护理文件","基础护理学第9章｜生命体征的评估与护理","基础护理学第10章｜冷、热疗法","基础护理学第11章｜饮食与营养","基础护理学第12章｜排泄","基础护理学第13章｜给药","基础护理学第14章｜静脉输液与输血","基础护理学第15章｜标本采集","基础护理学第16章｜疼痛患者的护理","基础护理学第17章｜病情观察及危重患者的管理","基础护理学第18章｜临终护理"];
let selected=-1;const esc=s=>String(s??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#39;");
function text(n){return [n.title,n.summary,n.exam,n.page,n.chapter].join(" ")}
function hits(n){const s=text(n).toLowerCase();return TERMS.filter(t=>s.includes(t.toLowerCase()))}
function render(){const q=document.getElementById("q").value.trim().toLowerCase(), ch=document.getElementById("chapter").value, box=document.getElementById("nodes"), ids=[];box.innerHTML="";
N.forEach((n,i)=>{if((!ch||n.chapter===ch)&&(!q||text(n).toLowerCase().includes(q)))ids.push(i)});
document.getElementById("count").textContent=ids.length+" / "+N.length+" 个知识点";
for(const i of ids){const n=N[i],b=document.createElement("button");b.className="node"+(i===selected?" active":"");b.innerHTML="<b>"+esc(n.title)+"</b><small>"+esc(n.summary)+"</small><span class='src'>"+esc(n.chapter)+" · "+esc(n.page)+"</span>";b.onclick=()=>show(i);box.appendChild(b)}
if(selected<0&&ids.length)show(ids[0]);if(selected>=0&&!ids.includes(selected)&&ids.length)show(ids[0]);}
function show(i){selected=i;const n=N[i], terms=hits(n), nums=[...text(n).matchAll(/\b\d+(?:\.\d+)?\s*(?:%|℃|°C|mmHg|次\/分|次\/min|ml|mL|L\/min|L|g\/d|kg|mg|μg|mmol\/L|小时|分钟|h|天|周|cm|mm|kPa)\b/gi)].map(m=>m[0].trim());
const candidates=N.map((x,j)=>({x,j,common:terms.filter(t=>text(x).toLowerCase().includes(t.toLowerCase()))})).filter(v=>v.j!==i&&v.common.length).sort((a,b)=>(a.x.chapter===n.chapter)-(b.x.chapter===n.chapter)||b.common.length-a.common.length).slice(0,7);
const related=candidates.length?candidates.map(v=>"<button data-j='"+v.j+"'>"+esc(v.x.title)+" <span class='muted'>· "+esc(v.common.slice(0,2).join(" / "))+"</span></button>").join(""):"<span class='muted'>暂未匹配到跨章节主题词，可用搜索继续找关联内容。</span>";
document.getElementById("detail").innerHTML="<span class='pill'>"+esc(n.book)+" · "+esc(n.chapter)+"</span><h2>"+esc(n.title)+"</h2><p class='summary'>"+esc(n.summary)+"</p>"+(n.exam?"<div class='exam'><b>考法线索：</b>"+esc(n.exam)+"</div>":"")+
"<div class='meta'><div><b>关键参数 / 条件</b><span>"+(nums.length?esc([...new Set(nums)].join("、")):"见归纳中的对象、条件与单位")+"</span></div><div><b>使用情境与安全边界</b><span>"+esc(n.exam||n.summary)+"</span></div></div><p class='source'>教材依据： "+esc(n.page)+"</p><b>跨章节关联</b><div class='related' style='margin-top:7px'>"+related+"</div><div class='tags' style='margin-top:9px'>"+terms.slice(0,8).map(t=>"<span class='tag'>"+esc(t)+"</span>").join("")+"</div><a class='chapter-link' href='../"+esc(n.href)+"'>回原章节继续学习与刷题 →</a>";
document.querySelectorAll(".related button[data-j]").forEach(b=>b.onclick=()=>{show(Number(b.dataset.j));document.getElementById("q").value="";document.getElementById("chapter").value="";render()});
renderListOnly();}
function renderListOnly(){document.querySelectorAll(".node").forEach(b=>b.classList.remove("active"));const cards=[...document.querySelectorAll(".node")];const n=N[selected];const active=cards.find(b=>b.querySelector("b")?.textContent===n?.title);if(active)active.classList.add("active");}
document.getElementById("q").oninput=render;document.getElementById("chapter").onchange=render;render();
</script></body></html>
