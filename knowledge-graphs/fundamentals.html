","href":"fundamentals/ch11-nutrition.html","kind":"normal"},{"type":"number","label":"尿浓缩功能试验饮食","tag":"试验1 d；全天水分500～600 ml；蛋白质1 g/(kg·d)","detail":"尿浓缩功能试验饮食：试验1 d；全天水分500～600 ml；蛋白质1 g/(kg·d)。适用条件与安全边界：避免过甜、过咸及含水量高的食物","ref":"教材第265页","chapter":"基础护理学第11章｜饮食与营养","href":"fundamentals/ch11-nutrition.html","kind":"safe"},{"type":"number","label":"胆囊B超试验饮食","tag":"检查前3 d避产气食物；前1 d晚无脂肪、低蛋白、高糖；脂肪餐含脂肪约25～50 g","detail":"胆囊B超试验饮食：检查前3 d避产气食物；前1 d晚无脂肪、低蛋白、高糖；脂肪餐含脂肪约25～50 g。适用条件与安全边界：首次B超后进脂肪餐，30～45 min后复查","ref":"教材第266页","chapter":"基础护理学第11章｜饮食与营养","href":"fundamentals/ch11-nutrition.html","kind":"normal"},{"type":"number","label":"蛋白质推荐摄入量","tag":"男性65 g/d；女性55 g/d","detail":"蛋白质推荐摄入量：男性65 g/d；女性55 g/d。适用条件与安全边界：18～49岁成年人参考摄入量","ref":"教材第276页","chapter":"基础护理学第11章｜饮食与营养","href":"fundamentals/ch11-nutrition.html","kind":"normal"},{"type":"number","label":"脂肪与糖类供能比","tag":"脂肪占总能量20%～30%；糖类占50%～65%","detail":"脂肪与糖类供能比：脂肪占总能量20%～30%；糖类占50%～65%。适用条件与安全边界：18～49岁成年人参考摄入量","ref":"教材第276页","chapter":"基础护理学第11章｜饮食与营养","href":"fundamentals/ch11-nutrition.html","kind":"normal"},{"type":"number","label":"常量与微量元素","tag":"钙800 mg；磷720 mg；镁330 mg；铁男12 mg、女20 mg；锌男12.5 mg、女7.5 mg；碘120 μg","detail":"常量与微量元素：钙800 mg；磷720 mg；镁330 mg；铁男12 mg、女20 mg；锌男12.5 mg、女7.5 mg；碘120 μg。适用条件与安全边界：18～49岁成年人每日推荐摄入量","ref":"教材第276页","chapter":"基础护理学第11章｜饮食与营养","href":"fundamentals/ch11-nutrition.html","kind":"normal"},{"type":"number","label":"脂溶性维生素","tag":"维生素A男800 μgRAE、女700 μgRAE；维生素D 10 μg；维生素E 14 mg α-TE；维生素K 80 μg","detail":"脂溶性维生素：维生素A男800 μgRAE、女700 μgRAE；维生素D 10 μg；维生素E 14 mg α-TE；维生素K 80 μg。适用条件与安全边界：18～49岁成年人每日推荐摄入量","ref":"教材第276—277页","chapter":"基础护理学第11章｜饮食与营养","href":"fundamentals/ch11-nutrition.html","kind":"normal"},{"type":"number","label":"水溶性维生素","tag":"维生素B₁男1.4 mg、女1.2 mg；B₂男1.4 mg、女1.2 mg；B₆ 1.4 mg；B₁₂ 2.4 μg；叶酸400 μgDFE；维生素C 100 mg","detail":"水溶性维生素：维生素B₁男1.4 mg、女1.2 mg；B₂男1.4 mg、女1.2 mg；B₆ 1.4 mg；B₁₂ 2.4 μg；叶酸400 μgDFE；维生素C 100 mg。适用条件与安全边界：18～49岁成年人每日推荐摄入量","ref":"教材第277页","chapter":"基础护理学第11章｜饮食与营养","href":"fundamentals/ch11-nutrition.html","kind":"normal"},{"type":"number","label":"水推荐摄入量","tag":"1500～1700 ml/d","detail":"水推荐摄入量：1500～1700 ml/d。适用条件与安全边界：包括饮用水、食物中水及体内代谢水","ref":"教材第277页","chapter":"基础护理学第11章｜饮食与营养","href":"fundamentals/ch11-nutrition.html","kind":"normal"},{"type":"number","label":"营养液保存与管路更换","tag":"配制液4℃以下保存且24 h内用完；输注管及袋每12～24 h更换；肠内营养容器每24 h清洗消毒","detail":"营养液保存与管路更换：配制液4℃以下保存且24 h内用完；输注管及袋每12～24 h更换；肠内营养容器每24 h清洗消毒。适用条件与安全边界：减少污染与感染风险","ref":"教材第274—275页","chapter":"基础护理学第11章｜饮食与营养","href":"fundamentals/ch11-nutrition.html","kind":"safe"},{"type":"concept","label":"营养评估","tag":"使用情境 / 考法","detail":"结合体重变化、摄入、疾病消耗、实验室资料和功能状态判断。 考法线索：单次体重不能替代连续趋势和摄入评估。","ref":"教材第258—263页","chapter":"基础护理学第11章｜饮食与营养","href":"fundamentals/ch11-nutrition.html","kind":"safe","relation":""},{"type":"concept","label":"基本饮食","tag":"使用情境 / 考法","detail":"普通、软质、半流质和流质饮食按咀嚼吞咽及消化能力选择。 考法线索：病例题常用术后阶段和消化功能选饮食。","ref":"教材第263—265页","chapter":"基础护理学第11章｜饮食与营养","href":"fundamentals/ch11-nutrition.html","kind":"normal","relation":""},{"type":"concept","label":"治疗饮食","tag":"使用情境 / 考法","detail":"按疾病需要调整能量、蛋白质、脂肪、盐、纤维或其他成分。 考法线索：选择饮食时必须与病情目标配对。","ref":"教材第264—266页","chapter":"基础护理学第11章｜饮食与营养","href":"fundamentals/ch11-nutrition.html","kind":"normal","relation":""},{"type":"concept","label":"一般饮食护理","tag":"使用情境 / 考法","detail":"营造进食环境，协助体位和餐前准备，记录摄入并观察反应。 考法线索：进食困难先评估原因和吞咽安全。","ref":"教材第266—269页","chapter":"基础护理学第11章｜饮食与营养","href":"fundamentals/ch11-nutrition.html","kind":"normal","relation":""},{"type":"concept","label":"鼻饲","tag":"使用情境 / 考法","detail":"确认管位、采用合适体位和温度，少量分次，保持通畅并防误吸。 考法线索：昏迷患者插管和每次喂食前管位确认常考。","ref":"教材第269—275页","chapter":"基础护理学第11章｜饮食与营养","href":"fundamentals/ch11-nutrition.html","kind":"normal","relation":""},{"type":"concept","label":"治疗饮食选择","tag":"使用情境 / 考法","detail":"治疗饮食不是只背名称，要根据疾病限制或增加能量、蛋白质、脂肪、钠和钾。 考法线索：题干给肾衰、肝病、高血压或高代谢时先找需要限制与需要补充的营养素。","ref":"教材第264—266页","chapter":"基础护理学第11章｜饮食与营养","href":"fundamentals/ch11-nutrition.html","kind":"normal","relation":""},{"type":"concept","label":"鼻饲前核对","tag":"使用情境 / 考法","detail":"每次灌食前确认胃管位置并评估胃残余；灌注中出现呛咳、呼吸困难应立即停止。 考法线索：预防误吸比完成喂养量更优先。","ref":"教材第270—273页","chapter":"基础护理学第11章｜饮食与营养","href":"fundamentals/ch11-nutrition.html","kind":"normal","relation":""},{"type":"cross","label":"普通病室温度","tag":"跨章节数值 · 环境","detail":"普通病室温度：18～22℃。适用条件与安全边界：一般成人病室","ref":"教材第15—16页","chapter":"基础护理学第2章｜环境","href":"fundamentals/ch02-environment.html","kind":"cross"},{"type":"cross","label":"特殊病室温度","tag":"跨章节数值 · 环境","detail":"特殊病室温度：22～24℃。适用条件与安全边界：新生儿、老年人、产房及手术室等","ref":"教材第15—16页","chapter":"基础护理学第2章｜环境","href":"fundamentals/ch02-environment.html","kind":"cross"},{"type":"cross","label":"课程定位","tag":"跨章节 · 绪论","detail":"基础护理把基本理论、知识和技能用于患者的基本需要与安全。 考法线索：常把课程任务放进新护士的工作情境中判断。","ref":"教材第1—2页","chapter":"基础护理学第1章｜绪论","href":"fundamentals/ch01-introduction.html","kind":"cross","relation":"安全"},{"type":"cross","label":"护理程序","tag":"跨章节 · 绪论","detail":"评估贯穿全过程，随后识别问题、计划、实施并评价。 考法线索：方案题先问资料是否充分，再排优先级。","ref":"教材第3—4页","chapter":"基础护理学第1章｜绪论","href":"fundamentals/ch01-introduction.html","kind":"cross","relation":"评估"},{"type":"cross","label":"整体护理","tag":"跨章节 · 绪论","detail":"同一技术要同时照顾生理安全、心理感受、文化与家庭支持。 考法线索：病例常用隐私、焦虑和参与决策检验整体观。","ref":"教材第3—4页","chapter":"基础护理学第1章｜绪论","href":"fundamentals/ch01-introduction.html","kind":"cross","relation":"安全"}]},{"id":"fundamentals/ch12-elimination.html","label":"排泄","title":"以“排泄”为中心｜用途、数值与跨章联系","center":"排泄","chapter":"基础护理学第12章｜排泄","href":"fundamentals/ch12-elimination.html","items":[{"type":"number","label":"成人排尿","tag":"日间4～6次、夜间0～2次；每次200～400 ml","detail":"成人排尿：日间4～6次、夜间0～2次；每次200～400 ml。适用条件与安全边界：24 h约1000～2000 ml，平均1500 ml","ref":"教材第280页","chapter":"基础护理学第12章｜排泄","href":"fundamentals/ch12-elimination.html","kind":"normal"},{"type":"number","label":"多尿","tag":"＞2500 ml/24 h","detail":"多尿：＞2500 ml/24 h。适用条件与安全边界：结合饮水、用药和疾病判断","ref":"教材第281页","chapter":"基础护理学第12章｜排泄","href":"fundamentals/ch12-elimination.html","kind":"normal"},{"type":"number","label":"少尿","tag":"＜400 ml/24 h或＜17 ml/h","detail":"少尿：＜400 ml/24 h或＜17 ml/h。适用条件与安全边界：提示灌注或肾功能问题","ref":"教材第281页","chapter":"基础护理学第12章｜排泄","href":"fundamentals/ch12-elimination.html","kind":"normal"},{"type":"number","label":"无尿","tag":"＜100 ml/24 h或12 h无尿","detail":"无尿：＜100 ml/24 h或12 h无尿。适用条件与安全边界：需立即评估梗阻和肾功能","ref":"教材第281页","chapter":"基础护理学第12章｜排泄","href":"fundamentals/ch12-elimination.html","kind":"normal"},{"type":"number","label":"导尿见尿后","tag":"继续插入5～7 cm","detail":"导尿见尿后：继续插入5～7 cm。适用条件与安全边界：留置导尿后再充盈气囊","ref":"教材第289页","chapter":"基础护理学第12章｜排泄","href":"fundamentals/ch12-elimination.html","kind":"normal"},{"type":"number","label":"导尿气囊","tag":"注入10～15 ml液体","detail":"导尿气囊：注入10～15 ml液体。适用条件与安全边界：按导管标识执行","ref":"教材第289页","chapter":"基础护理学第12章｜排泄","href":"fundamentals/ch12-elimination.html","kind":"normal"},{"type":"number","label":"留置导尿护理","tag":"会阴/尿道口1～2次/d；集尿袋每周1～2次更换","detail":"留置导尿护理：会阴/尿道口1～2次/d；集尿袋每周1～2次更换。适用条件与安全边界：保持密闭和低位引流","ref":"教材第290页","chapter":"基础护理学第12章｜排泄","href":"fundamentals/ch12-elimination.html","kind":"normal"},{"type":"number","label":"留置导尿更换","tag":"导尿管约1～4周","detail":"留置导尿更换：导尿管约1～4周。适用条件与安全边界：结合材质、尿液pH和堵塞风险","ref":"教材第290页","chapter":"基础护理学第12章｜排泄","href":"fundamentals/ch12-elimination.html","kind":"safe"},{"type":"number","label":"预防结石饮水","tag":"无禁忌时＞2000 ml/d","detail":"预防结石饮水：无禁忌时＞2000 ml/d。适用条件与安全边界：形成冲洗作用","ref":"教材第290页","chapter":"基础护理学第12章｜排泄","href":"fundamentals/ch12-elimination.html","kind":"normal"},{"type":"number","label":"膀胱冲洗","tag":"液温38～40℃；每次200～300 ml；60～80滴/min；液面高约60 cm","detail":"膀胱冲洗：液温38～40℃；每次200～300 ml；60～80滴/min；液面高约60 cm。适用条件与安全边界：观察引流颜色与通畅","ref":"教材第291页","chapter":"基础护理学第12章｜排泄","href":"fundamentals/ch12-elimination.html","kind":"normal"},{"type":"number","label":"成人排便","tag":"1～3次/d至1次/2～3 d均可","detail":"成人排便：1～3次/d至1次/2～3 d均可。适用条件与安全边界：以个人规律和性状为准","ref":"教材第293页","chapter":"基础护理学第12章｜排泄","href":"fundamentals/ch12-elimination.html","kind":"normal"},{"type":"number","label":"便秘","tag":"每周排便＜3次","detail":"便秘：每周排便＜3次。适用条件与安全边界：伴排便困难或粪便干硬","ref":"教材第293页","chapter":"基础护理学第12章｜排泄","href":"fundamentals/ch12-elimination.html","kind":"normal"},{"type":"number","label":"膳食纤维和饮水","tag":"纤维25～35 g/d；饮水1500～2000 ml/d","detail":"膳食纤维和饮水：纤维25～35 g/d；饮水1500～2000 ml/d。适用条件与安全边界：无禁忌时预防便秘","ref":"教材第297页","chapter":"基础护理学第12章｜排泄","href":"fundamentals/ch12-elimination.html","kind":"safe"},{"type":"number","label":"大量不保留灌肠","tag":"成人500～1000 ml，儿童200～500 ml；液温39～41℃","detail":"大量不保留灌肠：成人500～1000 ml，儿童200～500 ml；液温39～41℃。适用条件与安全边界：高热降温用28～32℃，中暑约4℃","ref":"教材第300页","chapter":"基础护理学第12章｜排泄","href":"fundamentals/ch12-elimination.html","kind":"normal"},{"type":"number","label":"灌肠筒高度","tag":"液面距肛门40～60 cm","detail":"灌肠筒高度：液面距肛门40～60 cm。适用条件与安全边界：控制压力和速度","ref":"教材第300页","chapter":"基础护理学第12章｜排泄","href":"fundamentals/ch12-elimination.html","kind":"normal"},{"type":"number","label":"肛管插入","tag":"成人7～10 cm","detail":"肛管插入：成人7～10 cm。适用条件与安全边界：大量不保留灌肠","ref":"教材第300页","chapter":"基础护理学第12章｜排泄","href":"fundamentals/ch12-elimination.html","kind":"normal"},{"type":"number","label":"导尿管更换与尿pH","tag":"pH＞6.8约2周；pH＜6.7约4周；混浊约3周","detail":"导尿管更换与尿pH：pH＞6.8约2周；pH＜6.7约4周；混浊约3周。适用条件与安全边界：按堵塞风险个体化","ref":"教材第290页","chapter":"基础护理学第12章｜排泄","href":"fundamentals/ch12-elimination.html","kind":"safe"},{"type":"number","label":"肠道准备","tag":"总量3000～4000 ml；首次600～1000 ml，其后每10～15 min 250 ml，最多4 L","detail":"肠道准备：总量3000～4000 ml；首次600～1000 ml，其后每10～15 min 250 ml，最多4 L。适用条件与安全边界：观察排出液与耐受","ref":"教材第298页","chapter":"基础护理学第12章｜排泄","href":"fundamentals/ch12-elimination.html","kind":"normal"},{"type":"number","label":"伤寒灌肠","tag":"液面≤30 cm、总量≤500 ml","detail":"伤寒灌肠：液面≤30 cm、总量≤500 ml。适用条件与安全边界：防肠穿孔","ref":"教材第300页","chapter":"基础护理学第12章｜排泄","href":"fundamentals/ch12-elimination.html","kind":"normal"},{"type":"number","label":"保留灌肠深度","tag":"成人15～20 cm；幼儿5～7.5 cm；婴儿2.5～4 cm","detail":"保留灌肠深度：成人15～20 cm；幼儿5～7.5 cm；婴儿2.5～4 cm。适用条件与安全边界：慢性菌痢常取左侧卧位","ref":"教材第302页","chapter":"基础护理学第12章｜排泄","href":"fundamentals/ch12-elimination.html","kind":"normal"},{"type":"number","label":"肛管排气","tag":"插入15～18 cm，每次≤20 min","detail":"肛管排气：插入15～18 cm，每次≤20 min。适用条件与安全边界：间隔2～3 h后再用","ref":"教材第305页","chapter":"基础护理学第12章｜排泄","href":"fundamentals/ch12-elimination.html","kind":"normal"},{"type":"concept","label":"排尿评估","tag":"使用情境 / 考法","detail":"结合次数、量、颜色、气味、症状和出入量识别尿潴留、少尿等异常。 考法线索：不能只看单次尿量，要联系时间与病情。","ref":"教材第279—284页","chapter":"基础护理学第12章｜排泄","href":"fundamentals/ch12-elimination.html","kind":"safe","relation":""},{"type":"concept","label":"导尿","tag":"使用情境 / 考法","detail":"严格无菌、正确辨认尿道、轻柔插入、保护隐私并预防逆行感染。 考法线索：误入阴道必须更换无菌导尿管再插。","ref":"教材第284—291页","chapter":"基础护理学第12章｜排泄","href":"fundamentals/ch12-elimination.html","kind":"normal","relation":""},{"type":"concept","label":"留置导尿","tag":"使用情境 / 考法","detail":"保持密闭通畅、尿袋低于膀胱、避免受压扭曲并做好会阴护理。 考法线索：不常规随意分离接口或夹闭。","ref":"教材第286—291页","chapter":"基础护理学第12章｜排泄","href":"fundamentals/ch12-elimination.html","kind":"safe","relation":""},{"type":"concept","label":"排便评估","tag":"使用情境 / 考法","detail":"关注次数、性状、颜色、气味、疼痛及排便习惯，先处理可逆原因。 考法线索：便秘护理应含饮食、活动、排便训练。","ref":"教材第292—297页","chapter":"基础护理学第12章｜排泄","href":"fundamentals/ch12-elimination.html","kind":"normal","relation":""},{"type":"concept","label":"灌肠","tag":"使用情境 / 考法","detail":"依据目的选择溶液、量、温度、体位和插入深度，并观察腹痛、出血和反应。 考法线索：肝昏迷、充血性心衰等特殊患者要辨溶液禁忌。","ref":"教材第297—305页","chapter":"基础护理学第12章｜排泄","href":"fundamentals/ch12-elimination.html","kind":"safe","relation":""},{"type":"concept","label":"尿失禁辨析","tag":"使用情境 / 考法","detail":"真性、充溢性、压力性、急迫性和功能性尿失禁的病因与表现不同。 考法线索：看膀胱是否过度充盈、是否有强烈尿意及诱发动作。","ref":"教材第282—285页","chapter":"基础护理学第12章｜排泄","href":"fundamentals/ch12-elimination.html","kind":"normal","relation":""},{"type":"concept","label":"导尿感染预防","tag":"使用情境 / 考法","detail":"无菌置管、保持密闭、尿袋低于膀胱、避免反流和不必要断开，尽早拔管。 考法线索：常规冲洗和频繁更换并不能替代密闭与尽早拔管。","ref":"教材第287—291页","chapter":"基础护理学第12章｜排泄","href":"fundamentals/ch12-elimination.html","kind":"safe","relation":""},{"type":"concept","label":"灌肠禁忌","tag":"使用情境 / 考法","detail":"急腹症、消化道出血、妊娠、严重心血管病等需慎用或禁用大量不保留灌肠。 考法线索：先看禁忌再计算温度、深度和高度。","ref":"教材第299—301页","chapter":"基础护理学第12章｜排泄","href":"fundamentals/ch12-elimination.html","kind":"safe","relation":""},{"type":"cross","label":"普通病室温度","tag":"跨章节数值 · 环境","detail":"普通病室温度：18～22℃。适用条件与安全边界：一般成人病室","ref":"教材第15—16页","chapter":"基础护理学第2章｜环境","href":"fundamentals/ch02-environment.html","kind":"cross"},{"type":"cross","label":"特殊病室温度","tag":"跨章节数值 · 环境","detail":"特殊病室温度：22～24℃。适用条件与安全边界：新生儿、老年人、产房及手术室等","ref":"教材第15—16页","chapter":"基础护理学第2章｜环境","href":"fundamentals/ch02-environment.html","kind":"cross"},{"type":"cross","label":"护理程序","tag":"跨章节 · 绪论","detail":"评估贯穿全过程，随后识别问题、计划、实施并评价。 考法线索：方案题先问资料是否充分，再排优先级。","ref":"教材第3—4页","chapter":"基础护理学第1章｜绪论","href":"fundamentals/ch01-introduction.html","kind":"cross","relation":"评估"},{"type":"cross","label":"温湿度与通风","tag":"跨章节 · 环境","detail":"依据患者年龄、病情和治疗需要调节温度、湿度、光线与空气。 考法线索：数字题必须把数值和适用对象绑定。","ref":"教材第15—18页","chapter":"基础护理学第2章｜环境","href":"fundamentals/ch02-environment.html","kind":"cross","relation":"温度"},{"type":"cross","label":"医院感染","tag":"跨章节 · 预防与控制医院感染","detail":"结合入院前状态、潜伏期、诊疗活动和感染出现时间综合判断。 考法线索：48小时只是常用线索，不能替代完整诊断标准。","ref":"教材第24—29页","chapter":"基础护理学第3章｜预防与控制医院感染","href":"fundamentals/ch03-infection-control.html","kind":"cross","relation":"感染"}]},{"id":"fundamentals/ch13-medication.html","label":"给药","title":"以“给药”为中心｜用途、数值与跨章联系","center":"给药","chapter":"基础护理学第13章｜给药","href":"fundamentals/ch13-medication.html","items":[{"type":"number","label":"皮内注射","tag":"5°进针，常注0.1 ml","detail":"皮内注射：5°进针，常注0.1 ml。适用条件与安全边界：皮试和局部试验","ref":"教材第321页","chapter":"基础护理学第13章｜给药","href":"fundamentals/ch13-medication.html","kind":"normal"},{"type":"number","label":"卡介苗皮内注射","tag":"10°～15°","detail":"卡介苗皮内注射：10°～15°。适用条件与安全边界：上臂三角肌下缘","ref":"教材第321页","chapter":"基础护理学第13章｜给药","href":"fundamentals/ch13-medication.html","kind":"normal"},{"type":"number","label":"皮下注射","tag":"30°～40°，刺入针梗1/2～2/3","detail":"皮下注射：30°～40°，刺入针梗1/2～2/3。适用条件与安全边界：短针可90°进针","ref":"教材第323页","chapter":"基础护理学第13章｜给药","href":"fundamentals/ch13-medication.html","kind":"normal"},{"type":"number","label":"肌内注射","tag":"90°，刺入针梗1/2～2/3","detail":"肌内注射：90°，刺入针梗1/2～2/3。适用条件与安全边界：避开血管神经","ref":"教材第326页","chapter":"基础护理学第13章｜给药","href":"fundamentals/ch13-medication.html","kind":"normal"},{"type":"number","label":"静脉注射","tag":"15°～30°","detail":"静脉注射：15°～30°。适用条件与安全边界：见回血后固定","ref":"教材第330页","chapter":"基础护理学第13章｜给药","href":"fundamentals/ch13-medication.html","kind":"normal"},{"type":"number","label":"皮试观察","tag":"20 min","detail":"皮试观察：20 min。适用条件与安全边界：期间不得离开","ref":"教材第340页","chapter":"基础护理学第13章｜给药","href":"fundamentals/ch13-medication.html","kind":"safe"},{"type":"number","label":"青霉素皮试液","tag":"0.1 ml含50 U","detail":"青霉素皮试液：0.1 ml含50 U。适用条件与安全边界：现配现用","ref":"教材第340页","chapter":"基础护理学第13章｜给药","href":"fundamentals/ch13-medication.html","kind":"normal"},{"type":"number","label":"首次用药观察","tag":"注射后观察30 min","detail":"首次用药观察：注射后观察30 min。适用条件与安全边界：重点警惕过敏反应","ref":"教材第340页","chapter":"基础护理学第13章｜给药","href":"fundamentals/ch13-medication.html","kind":"safe"},{"type":"number","label":"氧气雾化流量","tag":"6～8 L/min","detail":"氧气雾化流量：6～8 L/min。适用条件与安全边界：利用高速氧流形成雾滴","ref":"教材第334页","chapter":"基础护理学第13章｜给药","href":"fundamentals/ch13-medication.html","kind":"normal"},{"type":"number","label":"超声雾化水槽","tag":"水温≤50℃","detail":"超声雾化水槽：水温≤50℃。适用条件与安全边界：防止机器损坏和烫伤","ref":"教材第333页","chapter":"基础护理学第13章｜给药","href":"fundamentals/ch13-medication.html","kind":"normal"},{"type":"number","label":"过敏性休克肾上腺素","tag":"0.1% 0.5～1 ml","detail":"过敏性休克肾上腺素：0.1% 0.5～1 ml。适用条件与安全边界：立即皮下或肌内注射并按病情重复","ref":"教材第343页","chapter":"基础护理学第13章｜给药","href":"fundamentals/ch13-medication.html","kind":"normal"},{"type":"number","label":"结核菌素试验","tag":"48～72 h观察","detail":"结核菌素试验：48～72 h观察。适用条件与安全边界：测量硬结横径","ref":"教材第344页","chapter":"基础护理学第13章｜给药","href":"fundamentals/ch13-medication.html","kind":"normal"},{"type":"number","label":"胰岛素笔针4～5 mm","tag":"通常90°进针","detail":"胰岛素笔针4～5 mm：通常90°进针。适用条件与安全边界：多数成人无需捏皮","ref":"教材第328页","chapter":"基础护理学第13章｜给药","href":"fundamentals/ch13-medication.html","kind":"normal"},{"type":"number","label":"较长胰岛素针","tag":"≥8 mm时常捏皮45°进针","detail":"较长胰岛素针：≥8 mm时常捏皮45°进针。适用条件与安全边界：减少肌内注射风险","ref":"教材第328页","chapter":"基础护理学第13章｜给药","href":"fundamentals/ch13-medication.html","kind":"safe"},{"type":"concept","label":"安全给药","tag":"使用情境 / 考法","detail":"执行查对制度，确认患者、药物、剂量、途径、时间和记录，并解释用药。 考法线索：任何异常医嘱都应先核实，不能盲目执行。","ref":"教材第307—312页","chapter":"基础护理学第13章｜给药","href":"fundamentals/ch13-medication.html","kind":"safe","relation":""},{"type":"concept","label":"口服给药","tag":"使用情境 / 考法","detail":"依据药物剂型、作用和患者吞咽能力安排，特殊剂型不得随意掰碎。 考法线索：健胃药、助消化药、催眠药等给药时间常考。","ref":"教材第313—315页","chapter":"基础护理学第13章｜给药","href":"fundamentals/ch13-medication.html","kind":"safe","relation":""},{"type":"concept","label":"注射给药","tag":"使用情境 / 考法","detail":"选择合适部位和针具，严格无菌，避免神经血管并观察局部反应。 考法线索：皮内、皮下、肌内和静脉注射的角度、深度与用途要配对。","ref":"教材第315—331页","chapter":"基础护理学第13章｜给药","href":"fundamentals/ch13-medication.html","kind":"safe","relation":""},{"type":"concept","label":"雾化吸入","tag":"使用情境 / 考法","detail":"依据治疗目的选药，正确连接装置并指导深慢吸气、屏气和呼气。 考法线索：氧气雾化要同时考流量和禁火防油。","ref":"教材第331—338页","chapter":"基础护理学第13章｜给药","href":"fundamentals/ch13-medication.html","kind":"normal","relation":""},{"type":"concept","label":"药物过敏试验","tag":"使用情境 / 考法","detail":"用药前核对过敏史与试验条件，按时判断；阳性或过敏反应立即处理。 考法线索：青霉素过敏性休克首选肾上腺素。","ref":"教材第338—345页","chapter":"基础护理学第13章｜给药","href":"fundamentals/ch13-medication.html","kind":"normal","relation":""},{"type":"concept","label":"三查八对","tag":"使用情境 / 考法","detail":"给药前、中、后查对；核对床号、姓名、药名、浓度、剂量、方法、时间和药品有效期等。 考法线索：开放式询问身份，不能只问‘你是不是某某’。","ref":"教材第310—313页","chapter":"基础护理学第13章｜给药","href":"fundamentals/ch13-medication.html","kind":"safe","relation":""},{"type":"concept","label":"给药时间缩写","tag":"使用情境 / 考法","detail":"ac、pc、hs、prn、sos等必须和给药条件、频次一起识别。 考法线索：不要只凭字母形状猜时间。","ref":"教材第314—315页","chapter":"基础护理学第13章｜给药","href":"fundamentals/ch13-medication.html","kind":"safe","relation":""},{"type":"concept","label":"过敏性休克抢救","tag":"使用情境 / 考法","detail":"立即停药、平卧保暖、就地抢救，首选肾上腺素，同时维持气道和循环。 考法线索：顺序题先停致敏药并给肾上腺素，不能先等待医生到场。","ref":"教材第342—343页","chapter":"基础护理学第13章｜给药","href":"fundamentals/ch13-medication.html","kind":"safe","relation":""},{"type":"cross","label":"地面防滑系数","tag":"跨章节数值 · 环境","detail":"地面防滑系数：＜0.50不安全；0.50～0.79安全；≥0.80很安全。适用条件与安全边界：医院区域按风险选择等级","ref":"教材第17页","chapter":"基础护理学第2章｜环境","href":"fundamentals/ch02-environment.html","kind":"cross"},{"type":"cross","label":"无菌钳和无菌盘","tag":"跨章节数值 · 预防与控制医院感染","detail":"无菌钳和无菌盘：有效4 h。适用条件与安全边界：分别注明启用或铺盘时间","ref":"教材第53、57页","chapter":"基础护理学第3章｜预防与控制医院感染","href":"fundamentals/ch03-infection-control.html","kind":"cross"},{"type":"cross","label":"课程定位","tag":"跨章节 · 绪论","detail":"基础护理把基本理论、知识和技能用于患者的基本需要与安全。 考法线索：常把课程任务放进新护士的工作情境中判断。","ref":"教材第1—2页","chapter":"基础护理学第1章｜绪论","href":"fundamentals/ch01-introduction.html","kind":"cross","relation":"安全"},{"type":"cross","label":"整体护理","tag":"跨章节 · 绪论","detail":"同一技术要同时照顾生理安全、心理感受、文化与家庭支持。 考法线索：病例常用隐私、焦虑和参与决策检验整体观。","ref":"教材第3—4页","chapter":"基础护理学第1章｜绪论","href":"fundamentals/ch01-introduction.html","kind":"cross","relation":"安全"},{"type":"cross","label":"环境与健康","tag":"跨章节 · 环境","detail":"自然、社会和治疗性环境共同影响患者的安全、舒适和恢复。 考法线索：题干常要求指出环境因素怎样改变健康结局。","ref":"教材第7—12页","chapter":"基础护理学第2章｜环境","href":"fundamentals/ch02-environment.html","kind":"cross","relation":"安全"}]},{"id":"fundamentals/ch14-infusion-transfusion.html","label":"静脉输液与输血","title":"以“静脉输液与输血”为中心｜用途、数值与跨章联系","center":"静脉输液与输血","chapter":"基础护理学第14章｜静脉输液与输血","href":"fundamentals/ch14-infusion-transfusion.html","items":[{"type":"number","label":"滴系数","tag":"10、15或20滴/ml","detail":"滴系数：10、15或20滴/ml。适用条件与安全边界：先核对输液器标识再计算","ref":"教材第366页","chapter":"基础护理学第14章｜静脉输液与输血","href":"fundamentals/ch14-infusion-transfusion.html","kind":"normal"},{"type":"number","label":"成人输液速度","tag":"40～60滴/min","detail":"成人输液速度：40～60滴/min。适用条件与安全边界：按年龄、病情、药物调整","ref":"教材第361页","chapter":"基础护理学第14章｜静脉输液与输血","href":"fundamentals/ch14-infusion-transfusion.html","kind":"normal"},{"type":"number","label":"儿童输液速度","tag":"20～40滴/min","detail":"儿童输液速度：20～40滴/min。适用条件与安全边界：需更严格控制","ref":"教材第361页","chapter":"基础护理学第14章｜静脉输液与输血","href":"fundamentals/ch14-infusion-transfusion.html","kind":"normal"},{"type":"number","label":"补钾见尿","tag":"尿量＞40 ml/h或＞500 ml/d","detail":"补钾见尿：尿量＞40 ml/h或＞500 ml/d。适用条件与安全边界：排尿不足先不补钾","ref":"教材第359页","chapter":"基础护理学第14章｜静脉输液与输血","href":"fundamentals/ch14-infusion-transfusion.html","kind":"normal"},{"type":"number","label":"成人补钾总量","tag":"约60～80 mmol/d，氯化钾约4.5～6 g","detail":"成人补钾总量：约60～80 mmol/d，氯化钾约4.5～6 g。适用条件与安全边界：按血钾和肾功能调整","ref":"教材第359页","chapter":"基础护理学第14章｜静脉输液与输血","href":"fundamentals/ch14-infusion-transfusion.html","kind":"normal"},{"type":"number","label":"输液器更换","tag":"至少每24 h","detail":"输液器更换：至少每24 h。适用条件与安全边界：污染或疑似污染立即更换","ref":"教材第362页","chapter":"基础护理学第14章｜静脉输液与输血","href":"fundamentals/ch14-infusion-transfusion.html","kind":"normal"},{"type":"number","label":"急性肺水肿轮扎","tag":"每5～10 min轮换一个肢体","detail":"急性肺水肿轮扎：每5～10 min轮换一个肢体。适用条件与安全边界：一次只扎三个肢体","ref":"教材第369页","chapter":"基础护理学第14章｜静脉输液与输血","href":"fundamentals/ch14-infusion-transfusion.html","kind":"normal"},{"type":"number","label":"急性肺水肿放血","tag":"约200～300 ml","detail":"急性肺水肿放血：约200～300 ml。适用条件与安全边界：特殊情况下遵医嘱","ref":"教材第369页","chapter":"基础护理学第14章｜静脉输液与输血","href":"fundamentals/ch14-infusion-transfusion.html","kind":"normal"},{"type":"number","label":"输血初始观察","tag":"开始15 min内慢速并床旁观察","detail":"输血初始观察：开始15 min内慢速并床旁观察。适用条件与安全边界：无反应再按医嘱调速","ref":"教材第377—378页","chapter":"基础护理学第14章｜静脉输液与输血","href":"fundamentals/ch14-infusion-transfusion.html","kind":"normal"},{"type":"number","label":"血液取回与完成","tag":"取回后30 min内开始，单袋通常4 h内输完","detail":"血液取回与完成：取回后30 min内开始，单袋通常4 h内输完。适用条件与安全边界：不得随意加热或放置","ref":"教材第377—378页","chapter":"基础护理学第14章｜静脉输液与输血","href":"fundamentals/ch14-infusion-transfusion.html","kind":"safe"},{"type":"number","label":"血袋保留","tag":"输血后保存24 h","detail":"血袋保留：输血后保存24 h。适用条件与安全边界：便于反应追查","ref":"教材第378页","chapter":"基础护理学第14章｜静脉输液与输血","href":"fundamentals/ch14-infusion-transfusion.html","kind":"normal"},{"type":"number","label":"直接输血抗凝","tag":"3.8%枸橼酸钠5 ml/50 ml血","detail":"直接输血抗凝：3.8%枸橼酸钠5 ml/50 ml血。适用条件与安全边界：按采血量准确配比","ref":"教材第378页","chapter":"基础护理学第14章｜静脉输液与输血","href":"fundamentals/ch14-infusion-transfusion.html","kind":"normal"},{"type":"number","label":"溶血反应出现量","tag":"输入约10～15 ml即可发生","detail":"溶血反应出现量：输入约10～15 ml即可发生。适用条件与安全边界：一旦怀疑立即停止输血","ref":"教材第383页","chapter":"基础护理学第14章｜静脉输液与输血","href":"fundamentals/ch14-infusion-transfusion.html","kind":"normal"},{"type":"number","label":"交叉配血采血","tag":"常取血约2 ml","detail":"交叉配血采血：常取血约2 ml。适用条件与安全边界：严格身份核对","ref":"教材第376页","chapter":"基础护理学第14章｜静脉输液与输血","href":"fundamentals/ch14-infusion-transfusion.html","kind":"normal"},{"type":"number","label":"输血前后冲管","tag":"用0.9%氯化钠","detail":"输血前后冲管：用0.9%氯化钠。适用条件与安全边界：血液中不得加入其他药物","ref":"教材第378页","chapter":"基础护理学第14章｜静脉输液与输血","href":"fundamentals/ch14-infusion-transfusion.html","kind":"safe"},{"type":"concept","label":"静脉输液","tag":"使用情境 / 考法","detail":"依据脱水、电解质、营养和治疗目标选择液体，规范排气、穿刺和固定。 考法线索：题干常考滴速计算与巡视。","ref":"教材第356—365页","chapter":"基础护理学第14章｜静脉输液与输血","href":"fundamentals/ch14-infusion-transfusion.html","kind":"normal","relation":""},{"type":"concept","label":"输液反应","tag":"使用情境 / 考法","detail":"发热、循环负荷过重、静脉炎和空气栓塞需从线索中快速辨认。 考法线索：先停或调输液并按类型采取体位、氧疗和报告。","ref":"教材第365—371页","chapter":"基础护理学第14章｜静脉输液与输血","href":"fundamentals/ch14-infusion-transfusion.html","kind":"normal","relation":""},{"type":"concept","label":"输血前","tag":"使用情境 / 考法","detail":"核对血型、交叉配血、血袋与患者，评估病情并建立合适通路。 考法线索：输血前后及两袋血之间用0.9%氯化钠。","ref":"教材第372—376页","chapter":"基础护理学第14章｜静脉输液与输血","href":"fundamentals/ch14-infusion-transfusion.html","kind":"normal","relation":""},{"type":"concept","label":"输血过程","tag":"使用情境 / 考法","detail":"开始慢速，严密观察，确认无反应后按病情调整；血制品不得随意加药。 考法线索：最初15分钟是反应观察重点。","ref":"教材第376—381页","chapter":"基础护理学第14章｜静脉输液与输血","href":"fundamentals/ch14-infusion-transfusion.html","kind":"safe","relation":""},{"type":"concept","label":"输血反应","tag":"使用情境 / 考法","detail":"过敏、发热、溶血、循环负荷过重和细菌污染反应需按出现时间与表现判断。 考法线索：疑似溶血立即停止输血，保留余血并送检。","ref":"教材第381—388页","chapter":"基础护理学第14章｜静脉输液与输血","href":"fundamentals/ch14-infusion-transfusion.html","kind":"normal","relation":""},{"type":"concept","label":"输液反应鉴别","tag":"使用情境 / 考法","detail":"发热反应以寒战高热为主；循环负荷过重见突发呼吸困难、粉红泡沫痰；静脉炎沿静脉红肿疼痛；空气栓塞可突发胸闷濒死感。 考法线索：先凭最有区分度的线索定位，再采取相应体位和处理。","ref":"教材第367—372页","chapter":"基础护理学第14章｜静脉输液与输血","href":"fundamentals/ch14-infusion-transfusion.html","kind":"normal","relation":""},{"type":"concept","label":"血制品选择","tag":"使用情境 / 考法","detail":"全血、红细胞、血小板、血浆和冷沉淀适应证不同。 考法线索：贫血并非一律输全血，要看缺少哪种成分。","ref":"教材第374—379页","chapter":"基础护理学第14章｜静脉输液与输血","href":"fundamentals/ch14-infusion-transfusion.html","kind":"normal","relation":""},{"type":"concept","label":"输血反应处置","tag":"使用情境 / 考法","detail":"怀疑反应立即停止输血，换生理盐水维持静脉通路，核对并报告，保留血袋送检。 考法线索：不能仅减慢滴速后继续观察。","ref":"教材第380—384页","chapter":"基础护理学第14章｜静脉输液与输血","href":"fundamentals/ch14-infusion-transfusion.html","kind":"safe","relation":""},{"type":"cross","label":"煮沸增强剂","tag":"跨章节数值 · 预防与控制医院感染","detail":"煮沸增强剂：1%～2%碳酸氢钠使沸点约105℃。适用条件与安全边界：兼有防锈作用","ref":"教材第33页","chapter":"基础护理学第3章｜预防与控制医院感染","href":"fundamentals/ch03-infection-control.html","kind":"cross"},{"type":"cross","label":"休克卧位","tag":"跨章节数值 · 患者入院和出院的护理","detail":"休克卧位：头胸抬高10°～20°，下肢抬高20°～30°。适用条件与安全边界：兼顾呼吸和回心血量","ref":"教材第91页","chapter":"基础护理学第4章｜患者入院和出院的护理","href":"fundamentals/ch04-admission-discharge.html","kind":"cross"},{"type":"cross","label":"护理程序","tag":"跨章节 · 绪论","detail":"评估贯穿全过程，随后识别问题、计划、实施并评价。 考法线索：方案题先问资料是否充分，再排优先级。","ref":"教材第3—4页","chapter":"基础护理学第1章｜绪论","href":"fundamentals/ch01-introduction.html","kind":"cross","relation":"评估"},{"type":"cross","label":"护理级别不是固定标签","tag":"跨章节 · 患者入院和出院的护理","detail":"护理级别由病情和自理能力共同决定，并随病情变化重新评估。","ref":"教材第87—89页","chapter":"基础护理学第4章｜患者入院和出院的护理","href":"fundamentals/ch04-admission-discharge.html","kind":"cross","relation":"评估"},{"type":"cross","label":"卧位从目的和病情反推","tag":"跨章节 · 患者入院和出院的护理","detail":"先看意识、呼吸、循环和治疗目的，再核对禁忌、管路与安全条件。","ref":"教材第89—94页","chapter":"基础护理学第4章｜患者入院和出院的护理","href":"fundamentals/ch04-admission-discharge.html","kind":"cross","relation":"呼吸"}]},{"id":"fundamentals/ch15-specimen-collection.html","label":"标本采集","title":"以“标本采集”为中心｜用途、数值与跨章联系","center":"标本采集","chapter":"基础护理学第15章｜标本采集","href":"fundamentals/ch15-specimen-collection.html","items":[{"type":"number","label":"止血带时间","tag":"一般≤40 s","detail":"止血带时间：一般≤40 s。适用条件与安全边界：避免血液浓缩和检验偏差","ref":"教材第400页","chapter":"基础护理学第15章｜标本采集","href":"fundamentals/ch15-specimen-collection.html","kind":"safe"},{"type":"number","label":"血培养送检","tag":"采后≤2 h送达，室温保存","detail":"血培养送检：采后≤2 h送达，室温保存。适用条件与安全边界：不得冷藏或冷冻","ref":"教材第399—400页","chapter":"基础护理学第15章｜标本采集","href":"fundamentals/ch15-specimen-collection.html","kind":"safe"},{"type":"number","label":"成人血培养","tag":"每瓶8～10 ml","detail":"成人血培养：每瓶8～10 ml。适用条件与安全边界：需氧和厌氧成套采集","ref":"教材第399页","chapter":"基础护理学第15章｜标本采集","href":"fundamentals/ch15-specimen-collection.html","kind":"normal"},{"type":"number","label":"婴儿/幼儿血培养","tag":"婴儿1～3 ml；幼儿3～5 ml","detail":"婴儿/幼儿血培养：婴儿1～3 ml；幼儿3～5 ml。适用条件与安全边界：按体重和瓶型调整","ref":"教材第399页","chapter":"基础护理学第15章｜标本采集","href":"fundamentals/ch15-specimen-collection.html","kind":"normal"},{"type":"number","label":"动脉血气送检","tag":"采后15 min内分析或冰浴送检","detail":"动脉血气送检：采后15 min内分析或冰浴送检。适用条件与安全边界：采后按压3～5 min，凝血异常延长","ref":"教材第403页","chapter":"基础护理学第15章｜标本采集","href":"fundamentals/ch15-specimen-collection.html","kind":"normal"},{"type":"number","label":"24小时尿标本","tag":"晨7时弃首次尿，至次晨7时收最后一次","detail":"24小时尿标本：晨7时弃首次尿，至次晨7时收最后一次。适用条件与安全边界：混匀后取20～50 ml送检","ref":"教材第406页","chapter":"基础护理学第15章｜标本采集","href":"fundamentals/ch15-specimen-collection.html","kind":"normal"},{"type":"number","label":"尿培养","tag":"留取5～10 ml清洁中段尿","detail":"尿培养：留取5～10 ml清洁中段尿。适用条件与安全边界：无菌容器并尽快送检","ref":"教材第406—407页","chapter":"基础护理学第15章｜标本采集","href":"fundamentals/ch15-specimen-collection.html","kind":"normal"},{"type":"number","label":"粪便常规","tag":"约5 g或挑取异常部分","detail":"粪便常规：约5 g或挑取异常部分。适用条件与安全边界：清洁干燥容器","ref":"教材第408页","chapter":"基础护理学第15章｜标本采集","href":"fundamentals/ch15-specimen-collection.html","kind":"normal"},{"type":"number","label":"粪便培养","tag":"2～5 g或2～5 ml稀便","detail":"粪便培养：2～5 g或2～5 ml稀便。适用条件与安全边界：无菌带盖容器立即送检","ref":"教材第408页","chapter":"基础护理学第15章｜标本采集","href":"fundamentals/ch15-specimen-collection.html","kind":"normal"},{"type":"number","label":"隐血试验饮食","tag":"试验前3 d避免肉、肝、血制品和铁剂；连续3 d取材","detail":"隐血试验饮食：试验前3 d避免肉、肝、血制品和铁剂；连续3 d取材。适用条件与安全边界：从不同部位取材","ref":"教材第409页","chapter":"基础护理学第15章｜标本采集","href":"fundamentals/ch15-specimen-collection.html","kind":"normal"},{"type":"number","label":"痰培养","tag":"晨起深部痰，通常≥1 ml","detail":"痰培养：晨起深部痰，通常≥1 ml。适用条件与安全边界：无菌容器","ref":"教材第411页","chapter":"基础护理学第15章｜标本采集","href":"fundamentals/ch15-specimen-collection.html","kind":"normal"},{"type":"number","label":"痰细胞学固定","tag":"10%甲醛或95%乙醇","detail":"痰细胞学固定：10%甲醛或95%乙醇。适用条件与安全边界：留取后立即固定","ref":"教材第411页","chapter":"基础护理学第15章｜标本采集","href":"fundamentals/ch15-specimen-collection.html","kind":"normal"},{"type":"number","label":"鼻咽拭子停留","tag":"15～30 s","detail":"鼻咽拭子停留：15～30 s。适用条件与安全边界：充分吸附分泌物","ref":"教材第413页","chapter":"基础护理学第15章｜标本采集","href":"fundamentals/ch15-specimen-collection.html","kind":"normal"},{"type":"number","label":"定时尿保存","tag":"2～8℃；超过2 h不能检测时冷藏或加防腐剂","detail":"定时尿保存：2～8℃；超过2 h不能检测时冷藏或加防腐剂。适用条件与安全边界：按检验项目选择防腐剂","ref":"教材第407页","chapter":"基础护理学第15章｜标本采集","href":"fundamentals/ch15-specimen-collection.html","kind":"normal"},{"type":"number","label":"诱导痰","tag":"雾化吸入3%氯化钠3～5 ml","detail":"诱导痰：雾化吸入3%氯化钠3～5 ml。适用条件与安全边界：观察支气管痉挛","ref":"教材第411页","chapter":"基础护理学第15章｜标本采集","href":"fundamentals/ch15-specimen-collection.html","kind":"normal"},{"type":"number","label":"培养痰量","tag":"细菌＞1 ml；真菌2～5 ml；分枝杆菌5～10 ml；寄生虫3～5 ml","detail":"培养痰量：细菌＞1 ml；真菌2～5 ml；分枝杆菌5～10 ml；寄生虫3～5 ml。适用条件与安全边界：按检验项目留取","ref":"教材第411页","chapter":"基础护理学第15章｜标本采集","href":"fundamentals/ch15-specimen-collection.html","kind":"normal"},{"type":"concept","label":"标本原则","tag":"使用情境 / 考法","detail":"正确、及时、足量、具有代表性，并在用药或饮食影响前后按要求采集。 考法线索：不能从输液同侧直接采血或擅自改变采集时间。","ref":"教材第394—396页","chapter":"基础护理学第15章｜标本采集","href":"fundamentals/ch15-specimen-collection.html","kind":"safe","relation":""},{"type":"concept","label":"血液标本","tag":"使用情境 / 考法","detail":"不同检验选择相应试管和抗凝剂，严格核对并避免溶血。 考法线索：多管采血顺序和血培养无菌要求常考。","ref":"教材第396—403页","chapter":"基础护理学第15章｜标本采集","href":"fundamentals/ch15-specimen-collection.html","kind":"safe","relation":""},{"type":"concept","label":"尿标本","tag":"使用情境 / 考法","detail":"常规、中段、定时、培养等目的不同，容器和留取方法随之改变。 考法线索：尿培养强调清洁外阴和无菌中段尿。","ref":"教材第404—407页","chapter":"基础护理学第15章｜标本采集","href":"fundamentals/ch15-specimen-collection.html","kind":"normal","relation":""},{"type":"concept","label":"粪便标本","tag":"使用情境 / 考法","detail":"从异常部分取材，隐血试验需控制饮食和药物干扰。 考法线索：标本不能混入尿液、消毒剂或其他污染物。","ref":"教材第407—409页","chapter":"基础护理学第15章｜标本采集","href":"fundamentals/ch15-specimen-collection.html","kind":"safe","relation":""},{"type":"concept","label":"痰与咽拭子","tag":"使用情境 / 考法","detail":"深呼吸咳出下呼吸道痰，咽拭子避免触及口腔非目标部位并及时送检。 考法线索：培养标本一般在抗菌药使用前留取。","ref":"教材第409—413页","chapter":"基础护理学第15章｜标本采集","href":"fundamentals/ch15-specimen-collection.html","kind":"safe","relation":""},{"type":"concept","label":"采血管颜色与用途","tag":"使用情境 / 考法","detail":"白/红/深黄多用于血清；绿系肝素血浆；紫色EDTA全血；浅蓝枸橼酸钠1:9用于凝血；黑色1:4用于血沉；浅灰抑制糖酵解用于血糖。 考法线索：颜色题要同时说添加剂、标本类型、检验用途和是否混匀。","ref":"教材第396—397页","chapter":"基础护理学第15章｜标本采集","href":"fundamentals/ch15-specimen-collection.html","kind":"normal","relation":""},{"type":"concept","label":"静脉采血顺序","tag":"使用情境 / 考法","detail":"血培养→枸橼酸钠→血清管→肝素管→EDTA管→糖酵解抑制管。 考法线索：先防微生物和添加剂污染，再保证凝血检测比例。","ref":"教材第400—401页","chapter":"基础护理学第15章｜标本采集","href":"fundamentals/ch15-specimen-collection.html","kind":"normal","relation":""},{"type":"concept","label":"尿液防腐剂","tag":"使用情境 / 考法","detail":"不同检测项目选择不同防腐剂；定时尿先混匀、计总量，再按要求留送检部分。 考法线索：不能把甲苯、甲醛和浓盐酸互换使用。","ref":"教材第405—407页","chapter":"基础护理学第15章｜标本采集","href":"fundamentals/ch15-specimen-collection.html","kind":"safe","relation":""},{"type":"cross","label":"煮沸消毒","tag":"跨章节数值 · 预防与控制医院感染","detail":"煮沸消毒：100℃，一般5～10 min；灭菌需≥15 min。适用条件与安全边界：海拔每升高300 m延长2 min","ref":"教材第33页","chapter":"基础护理学第3章｜预防与控制医院感染","href":"fundamentals/ch03-infection-control.html","kind":"cross"},{"type":"cross","label":"紫外线空气消毒","tag":"跨章节数值 · 预防与控制医院感染","detail":"紫外线空气消毒：30 W灯距地面约2 m，照射≥30 min；≥1.5 W/m³。适用条件与安全边界：照射5～7 min后开始计时","ref":"教材第33页","chapter":"基础护理学第3章｜预防与控制医院感染","href":"fundamentals/ch03-infection-control.html","kind":"cross"},{"type":"cross","label":"清洁消毒灭菌","tag":"跨章节 · 预防与控制医院感染","detail":"先看目标层级和物品用途，再选择方法、参数与监测。 考法线索：高风险物品需要灭菌，方法正确还要过程合格。","ref":"教材第30—44页","chapter":"基础护理学第3章｜预防与控制医院感染","href":"fundamentals/ch03-infection-control.html","kind":"cross","relation":"消毒"},{"type":"cross","label":"手卫生","tag":"跨章节 · 预防与控制医院感染","detail":"依据时机、可见污染和操作风险选择洗手或手消毒，手套不能替代。 考法线索：常考五时刻、方法选择和效果监测。","ref":"教材第45—51页","chapter":"基础护理学第3章｜预防与控制医院感染","href":"fundamentals/ch03-infection-control.html","kind":"cross","relation":"消毒"},{"type":"cross","label":"无菌技术","tag":"跨章节 · 预防与控制医院感染","detail":"检查包装、日期和状态，划清无菌区，防止跨越、回流和接触污染。 考法线索：同一数字必须对应具体对象与起算时间。","ref":"教材第51—60页","chapter":"基础护理学第3章｜预防与控制医院感染","href":"fundamentals/ch03-infection-control.html","kind":"cross","relation":"无菌"}]},{"id":"fundamentals/ch16-pain-care.html","label":"疼痛患者的护理","title":"以“疼痛患者的护理”为中心｜用途、数值与跨章联系","center":"疼痛患者的护理","chapter":"基础护理学第16章｜疼痛患者的护理","href":"fundamentals/ch16-pain-care.html","items":[{"type":"number","label":"NRS疼痛评分","tag":"0～10分","detail":"NRS疼痛评分：0～10分。适用条件与安全边界：0无痛，分值越高疼痛越重","ref":"教材第425页","chapter":"基础护理学第16章｜疼痛患者的护理","href":"fundamentals/ch16-pain-care.html","kind":"normal"},{"type":"number","label":"疼痛程度","tag":"1～3轻度；4～6中度；7～10重度","detail":"疼痛程度：1～3轻度；4～6中度；7～10重度。适用条件与安全边界：结合功能影响判断","ref":"教材第425页","chapter":"基础护理学第16章｜疼痛患者的护理","href":"fundamentals/ch16-pain-care.html","kind":"normal"},{"type":"number","label":"疼痛控制目标","tag":"静息痛通常≤3分并稳定约3 d","detail":"疼痛控制目标：静息痛通常≤3分并稳定约3 d。适用条件与安全边界：结合个体治疗目标","ref":"教材第440页","chapter":"基础护理学第16章｜疼痛患者的护理","href":"fundamentals/ch16-pain-care.html","kind":"normal"},{"type":"number","label":"24小时突破痛","tag":"＜3次","detail":"24小时突破痛：＜3次。适用条件与安全边界：同时评估解救药使用","ref":"教材第440页","chapter":"基础护理学第16章｜疼痛患者的护理","href":"fundamentals/ch16-pain-care.html","kind":"normal"},{"type":"number","label":"护理处置边界","tag":"评分≤5可先执行护理措施；＞5及时报告评估","detail":"护理处置边界：评分≤5可先执行护理措施；＞5及时报告评估。适用条件与安全边界：严重疼痛需有效镇痛","ref":"教材第426、440页","chapter":"基础护理学第16章｜疼痛患者的护理","href":"fundamentals/ch16-pain-care.html","kind":"normal"},{"type":"number","label":"癌痛三项量化目标","tag":"疼痛强度＜3；突破痛＜3次/24 h；解救药＜3次/24 h","detail":"癌痛三项量化目标：疼痛强度＜3；突破痛＜3次/24 h；解救药＜3次/24 h。适用条件与安全边界：用于评价控制效果","ref":"教材第440页","chapter":"基础护理学第16章｜疼痛患者的护理","href":"fundamentals/ch16-pain-care.html","kind":"normal"},{"type":"number","label":"疼痛管理标准","tag":"常用‘321’或‘331’目标","detail":"疼痛管理标准：常用‘321’或‘331’目标。适用条件与安全边界：结合教材具体指标理解，不孤立背数字","ref":"教材第440页","chapter":"基础护理学第16章｜疼痛患者的护理","href":"fundamentals/ch16-pain-care.html","kind":"normal"},{"type":"number","label":"PCA观察周期","tag":"按1 h或4 h统计用药与按压","detail":"PCA观察周期：按1 h或4 h统计用药与按压。适用条件与安全边界：结合泵设置和镇静呼吸评估","ref":"教材第438—440页","chapter":"基础护理学第16章｜疼痛患者的护理","href":"fundamentals/ch16-pain-care.html","kind":"normal"},{"type":"concept","label":"疼痛概念","tag":"使用情境 / 考法","detail":"疼痛是与实际或潜在组织损伤相关的主观体验，患者报告是重要依据。 考法线索：不能仅凭表情或生命体征否定疼痛。","ref":"教材第415—419页","chapter":"基础护理学第16章｜疼痛患者的护理","href":"fundamentals/ch16-pain-care.html","kind":"safe","relation":""},{"type":"concept","label":"疼痛评估","tag":"使用情境 / 考法","detail":"评估部位、性质、强度、时间、诱因、缓解因素、功能影响和既往处理。 考法线索：选择量表要匹配年龄、认知和沟通能力。","ref":"教材第420—425页","chapter":"基础护理学第16章｜疼痛患者的护理","href":"fundamentals/ch16-pain-care.html","kind":"normal","relation":""},{"type":"concept","label":"药物镇痛","tag":"使用情境 / 考法","detail":"按疼痛程度和机制选药，规律给药并预防恶心、便秘、呼吸抑制等不良反应。 考法线索：癌痛常考按时给药而非痛时才给。","ref":"教材第425—431页","chapter":"基础护理学第16章｜疼痛患者的护理","href":"fundamentals/ch16-pain-care.html","kind":"normal","relation":""},{"type":"concept","label":"非药物干预","tag":"使用情境 / 考法","detail":"放松、分散注意、音乐、冷/热、体位和心理支持可作为综合方案。 考法线索：不能以非药物方法替代必要镇痛。","ref":"教材第431—439页","chapter":"基础护理学第16章｜疼痛患者的护理","href":"fundamentals/ch16-pain-care.html","kind":"safe","relation":""},{"type":"concept","label":"效果评价","tag":"使用情境 / 考法","detail":"既看评分下降，也看睡眠、活动、咳嗽和康复目标是否改善。 考法线索：干预后必须在合适时间复评并记录。","ref":"教材第429—441页","chapter":"基础护理学第16章｜疼痛患者的护理","href":"fundamentals/ch16-pain-care.html","kind":"normal","relation":""},{"type":"concept","label":"疼痛评估原则","tag":"使用情境 / 考法","detail":"患者自我报告是清醒患者疼痛评估的首要依据，同时评估部位、性质、时间、诱因、功能影响和伴随症状。 考法线索：不能因生命体征正常或患者安静就否定疼痛。","ref":"教材第421—427页","chapter":"基础护理学第16章｜疼痛患者的护理","href":"fundamentals/ch16-pain-care.html","kind":"safe","relation":""},{"type":"concept","label":"量表选择","tag":"使用情境 / 考法","detail":"NRS适合能理解数字者；面部表情量表适合儿童或沟通受限者；行为量表用于不能自述者。 考法线索：量表必须匹配认知、语言和意识状态。","ref":"教材第424—426页","chapter":"基础护理学第16章｜疼痛患者的护理","href":"fundamentals/ch16-pain-care.html","kind":"safe","relation":""},{"type":"concept","label":"三阶梯镇痛","tag":"使用情境 / 考法","detail":"按疼痛程度阶梯用药，按时、个体化、口服优先并注意具体细节。 考法线索：爆发痛需解救药，持续痛不能只等疼痛严重再给药。","ref":"教材第434—440页","chapter":"基础护理学第16章｜疼痛患者的护理","href":"fundamentals/ch16-pain-care.html","kind":"safe","relation":""},{"type":"cross","label":"休克卧位","tag":"跨章节数值 · 患者入院和出院的护理","detail":"休克卧位：头胸抬高10°～20°，下肢抬高20°～30°。适用条件与安全边界：兼顾呼吸和回心血量","ref":"教材第91页","chapter":"基础护理学第4章｜患者入院和出院的护理","href":"fundamentals/ch04-admission-discharge.html","kind":"cross"},{"type":"cross","label":"端坐位","tag":"跨章节数值 · 患者入院和出院的护理","detail":"端坐位：床头70°～80°。适用条件与安全边界：严重呼吸困难、急性肺水肿","ref":"教材第91页","chapter":"基础护理学第4章｜患者入院和出院的护理","href":"fundamentals/ch04-admission-discharge.html","kind":"cross"},{"type":"cross","label":"护理程序","tag":"跨章节 · 绪论","detail":"评估贯穿全过程，随后识别问题、计划、实施并评价。 考法线索：方案题先问资料是否充分，再排优先级。","ref":"教材第3—4页","chapter":"基础护理学第1章｜绪论","href":"fundamentals/ch01-introduction.html","kind":"cross","relation":"评估"},{"type":"cross","label":"专业素质","tag":"跨章节 · 绪论","detail":"慎独、沟通、协作、观察与规范操作共同保证护理质量。 考法线索：无人监督仍按制度执行是慎独的典型线索。","ref":"教材第4—5页","chapter":"基础护理学第1章｜绪论","href":"fundamentals/ch01-introduction.html","kind":"cross","relation":"沟通"},{"type":"cross","label":"噪声控制","tag":"跨章节 · 环境","detail":"减少声源、降低传播并调整人员行为，避免突然和持续刺激。 考法线索：问护理措施时要覆盖声源、设备、操作与沟通。","ref":"教材第18—20页","chapter":"基础护理学第2章｜环境","href":"fundamentals/ch02-environment.html","kind":"cross","relation":"沟通"}]},{"id":"fundamentals/ch17-critical-care.html","label":"病情观察及危重患者的管理","title":"以“病情观察及危重患者的管理”为中心｜用途、数值与跨章联系","center":"病情观察及危重患者的管理","chapter":"基础护理学第17章｜病情观察及危重患者的管理","href":"fundamentals/ch17-critical-care.html","items":[{"type":"number","label":"GCS总分","tag":"3～15分","detail":"GCS总分：3～15分。适用条件与安全边界：分数越低意识障碍越重","ref":"教材第446页","chapter":"基础护理学第17章｜病情观察及危重患者的管理","href":"fundamentals/ch17-critical-care.html","kind":"normal"},{"type":"number","label":"GCS分度","tag":"13～14轻度；9～12中度；3～8重度","detail":"GCS分度：13～14轻度；9～12中度；3～8重度。适用条件与安全边界：＜8分常提示昏迷并关注气道","ref":"教材第446页","chapter":"基础护理学第17章｜病情观察及危重患者的管理","href":"fundamentals/ch17-critical-care.html","kind":"normal"},{"type":"number","label":"脉搏判断","tag":"5～10 s","detail":"脉搏判断：5～10 s。适用条件与安全边界：成人心搏骤停评估","ref":"教材第454页","chapter":"基础护理学第17章｜病情观察及危重患者的管理","href":"fundamentals/ch17-critical-care.html","kind":"normal"},{"type":"number","label":"胸外按压频率","tag":"100～120次/min","detail":"胸外按压频率：100～120次/min。适用条件与安全边界：减少中断","ref":"教材第455页","chapter":"基础护理学第17章｜病情观察及危重患者的管理","href":"fundamentals/ch17-critical-care.html","kind":"normal"},{"type":"number","label":"成人按压深度","tag":"5～6 cm","detail":"成人按压深度：5～6 cm。适用条件与安全边界：充分回弹","ref":"教材第455页","chapter":"基础护理学第17章｜病情观察及危重患者的管理","href":"fundamentals/ch17-critical-care.html","kind":"normal"},{"type":"number","label":"儿童/婴儿按压深度","tag":"儿童约5 cm、婴儿约4 cm，均约胸廓前后径1/3","detail":"儿童/婴儿按压深度：儿童约5 cm、婴儿约4 cm，均约胸廓前后径1/3。适用条件与安全边界：避免过深或过浅","ref":"教材第458页","chapter":"基础护理学第17章｜病情观察及危重患者的管理","href":"fundamentals/ch17-critical-care.html","kind":"safe"},{"type":"number","label":"按压通气比","tag":"30:2","detail":"按压通气比：30:2。适用条件与安全边界：单人成人基础生命支持","ref":"教材第455页","chapter":"基础护理学第17章｜病情观察及危重患者的管理","href":"fundamentals/ch17-critical-care.html","kind":"normal"},{"type":"number","label":"有脉搏人工呼吸","tag":"每6 s 1次，约10次/min；每2 min复查脉搏","detail":"有脉搏人工呼吸：每6 s 1次，约10次/min；每2 min复查脉搏。适用条件与安全边界：成人呼吸停止但有脉搏","ref":"教材第458页","chapter":"基础护理学第17章｜病情观察及危重患者的管理","href":"fundamentals/ch17-critical-care.html","kind":"normal"},{"type":"number","label":"有效按压血压","tag":"收缩压可达≥60 mmHg","detail":"有效按压血压：收缩压可达≥60 mmHg。适用条件与安全边界：结合颈动脉搏动等判断","ref":"教材第455页","chapter":"基础护理学第17章｜病情观察及危重患者的管理","href":"fundamentals/ch17-critical-care.html","kind":"normal"},{"type":"number","label":"洗胃时机","tag":"中毒后4～6 h内效果较好","detail":"洗胃时机：中毒后4～6 h内效果较好。适用条件与安全边界：仍需结合毒物性质和禁忌","ref":"教材第459页","chapter":"基础护理学第17章｜病情观察及危重患者的管理","href":"fundamentals/ch17-critical-care.html","kind":"safe"},{"type":"number","label":"洗胃液","tag":"25～38℃，总量约10～20 L，每次300～500 ml","detail":"洗胃液：25～38℃，总量约10～20 L，每次300～500 ml。适用条件与安全边界：出入量基本相等","ref":"教材第459—460页","chapter":"基础护理学第17章｜病情观察及危重患者的管理","href":"fundamentals/ch17-critical-care.html","kind":"normal"},{"type":"number","label":"简易呼吸器","tag":"成人每次约500 ml，约10次/min","detail":"简易呼吸器：成人每次约500 ml，约10次/min。适用条件与安全边界：以胸廓起伏为准","ref":"教材第461页","chapter":"基础护理学第17章｜病情观察及危重患者的管理","href":"fundamentals/ch17-critical-care.html","kind":"normal"},{"type":"number","label":"危重尿量","tag":"＜30 ml/h需警惕灌注不足","detail":"危重尿量：＜30 ml/h需警惕灌注不足。适用条件与安全边界：连续监测趋势","ref":"教材第446页","chapter":"基础护理学第17章｜病情观察及危重患者的管理","href":"fundamentals/ch17-critical-care.html","kind":"safe"},{"type":"number","label":"洗胃后活性炭","tag":"常按1 g/kg","detail":"洗胃后活性炭：常按1 g/kg。适用条件与安全边界：按毒物和医嘱使用","ref":"教材第460页","chapter":"基础护理学第17章｜病情观察及危重患者的管理","href":"fundamentals/ch17-critical-care.html","kind":"normal"},{"type":"number","label":"高级气道通气","tag":"持续按压时约每6 s通气1次","detail":"高级气道通气：持续按压时约每6 s通气1次。适用条件与安全边界：避免过度通气","ref":"教材第458页","chapter":"基础护理学第17章｜病情观察及危重患者的管理","href":"fundamentals/ch17-critical-care.html","kind":"safe"},{"type":"concept","label":"病情观察","tag":"使用情境 / 考法","detail":"从一般状态、意识、生命体征、瞳孔、出入量、治疗反应和心理变化综合判断。 考法线索：危险变化先报告并处理，不能等记录完再行动。","ref":"教材第443—447页","chapter":"基础护理学第17章｜病情观察及危重患者的管理","href":"fundamentals/ch17-critical-care.html","kind":"safe","relation":""},{"type":"conc ，4～6 h遍及全身，12～16 h达高峰，24 h后逐渐缓解","detail":"尸僵：1～3 h开始，4～6 h遍及全身，12～16 h达高峰，24 h后逐渐缓解。适用条件与安全边界：用于死亡后变化识别","ref":"教材第473页","chapter":"基础护理学第18章｜临终护理","href":"fundamentals/ch18-end-of-life.html","kind":"normal"},{"type":"number","label":"尸体腐败","tag":"约24 h先见于右下腹","detail":"尸体腐败：约24 h先见于右下腹。适用条件与安全边界：受环境温度等影响","ref":"教材第473页","chapter":"基础护理学第18章｜临终护理","href":"fundamentals/ch18-end-of-life.html","kind":"normal"},{"type":"number","label":"临终热水袋","tag":"水温＜50℃","detail":"临终热水袋：水温＜50℃。适用条件与安全边界：防止低温与烫伤","ref":"教材第475页","chapter":"基础护理学第18章｜临终护理","href":"fundamentals/ch18-end-of-life.html","kind":"normal"},{"type":"number","label":"脑死亡排除低温","tag":"体温＜32.2℃不能贸然判定","detail":"脑死亡排除低温：体温＜32.2℃不能贸然判定。适用条件与安全边界：同时排除巴比妥类等中枢抑制药","ref":"教材第472页","chapter":"基础护理学第18章｜临终护理","href":"fundamentals/ch18-end-of-life.html","kind":"normal"},{"type":"concept","label":"临终关怀","tag":"使用情境 / 考法","detail":"目标是减轻痛苦、维护尊严和提高剩余生命质量，同时支持家属。 考法线索：不是放弃治疗，而是目标转向舒适与价值。","ref":"教材第466—471页","chapter":"基础护理学第18章｜临终护理","href":"fundamentals/ch18-end-of-life.html","kind":"normal","relation":""},{"type":"concept","label":"死亡与濒死","tag":"使用情境 / 考法","detail":"依据不可逆生命功能停止和规范判断理解死亡过程。 考法线索：不能用单一表现随意宣布死亡。","ref":"教材第471—474页","chapter":"基础护理学第18章｜临终护理","href":"fundamentals/ch18-end-of-life.html","kind":"safe","relation":""},{"type":"concept","label":"生理护理","tag":"使用情境 / 考法","detail":"持续评估疼痛、呼吸困难、分泌物、口腔皮肤、营养排泄和睡眠。 考法线索：措施以舒适、安全和患者愿望为中心。","ref":"教材第474—476页","chapter":"基础护理学第18章｜临终护理","href":"fundamentals/ch18-end-of-life.html","kind":"normal","relation":""},{"type":"concept","label":"心理社会护理","tag":"使用情境 / 考法","detail":"倾听、允许表达、提供真实适量信息，尊重文化宗教与家庭角色。 考法线索：不同反应可反复出现，不能机械套五阶段。","ref":"教材第476—479页","chapter":"基础护理学第18章｜临终护理","href":"fundamentals/ch18-end-of-life.html","kind":"safe","relation":""},{"type":"concept","label":"死亡后护理","tag":"使用情境 / 考法","detail":"尊重遗体与家属，按规定确认、清洁、标识、处理物品和记录。 考法线索：有导管或特殊检查要求时按规定保留或处理。","ref":"教材第479—482页","chapter":"基础护理学第18章｜临终护理","href":"fundamentals/ch18-end-of-life.html","kind":"normal","rela function lines(s,x,y,n=13,cl=""){return wrap(s,n).map((z,i)=>'<tspan x="'+x+'" dy="'+(i?15:0)+'" class="'+cl+'">'+esc(z)+'</tspan>').join("")}
function choose(i){mi=i;offset=0;selected="";$("#mapPick").value=String(i);render()}
function options(q=""){const s=q.toLowerCase(),f=MAPS.map((m,i)=>({m,i})).filter(({m})=>!s||[m.label,m.title,m.chapter,...m.items.map(x=>x.label+" "+x.tag)].join(" ").toLowerCase().includes(s));$("#mapPick").innerHTML=f.map(({m,i})=>'<option value="'+i+'">'+esc(m.label)+(m.items.some(x=>x.type==="number")?" · 含数值":"")+'</option>').join("");if(f.some(x=>x.i===mi))$("#mapPick").value=String(mi);else if(f.length)choose(f[0].i)}
function render(){const m=MAPS[mi],list=m.items||[],shown=list.slice(offset,offset+6),cx=360,cy=235,slots=[[360,56],[555,142],[555,328],[360,412],[165,328],[165,142]];$("#mapTitle").textContent=m.title;document.querySelectorAll("#quick button").forEach(b=>b.classList.toggle("active",Number(b.dataset.i)===mi));let edges=shown.map((n,j)=>{const [x,y]=slots[j];return '<line class="edge '+(selected===n.label?'active':'')+'" x1="'+cx+'" y1="'+cy+'" x2="'+x+'" y2="'+y+'"/>'}).join("");const centerLines=wrap(m.center,12).slice(0,2);const center='<g class="node center" data-center="1"><rect x="'+(cx-96)+'" y="'+(cy-34)+'" width="192" height="68" rx="15"/><text x="'+cx+'" y="'+(cy-centerLines.length*6)+'" text-anchor="middle">'+centerLines.map((z,i)=>'<tspan x="'+cx+'" dy="'+(i?15:0)+'">'+esc(z)+'</tspan>').join("")+'<tspan class="tag" x="'+cx+'" dy="20">中心概念</tspan></text></g>';const nodes=shown.map((n,j)=>{const [x,y]=slots[j],cls="node "+(n.kind==="safe"?"safe":n.kind==="cross"?"cross":"")+(selected===n.label?" active":"");const ll=wrap(n.label,13),ty=y-11-(ll.length>1?7:0),tagLines=wrap(n.tag,22);return '<g class="'+cls+'" data-item="'+(offset+j)+'"><rect x="'+(x-92)+'" y="'+(y-39)+'" width="184" height="78" rx="14"/><text x="'+x+'" y="'+ty+'" text-anchor="middle">'+ll.map((z,i)=>'<tspan x="'+x+'" dy="'+(i?15:0)+'">'+esc(z)+'</tspan>').join("")+'</text><text class="tag" x="'+x+'" y="'+(y+18+(ll.length>1?2:0))+'" text-anchor="middle">'+tagLines.map((z,i)=>'<tspan x="'+x+'" dy="'+(i?12:0)+'">'+esc(z)+'</tspan>').join("")+'</text></g>'}).join("");svg.innerHTML=edges+center+nodes;svg.querySelectorAll("[data-item]").forEach(g=>g.onclick=()=>{selected=String(list[Number(g.dataset.item)].label);detailFor(list[Number(g.dataset.item)]);renderHighlight()});svg.querySelector("[data-center]").onclick=()=>{selected="__center";detailCenter(m)};$("#pageText").textContent=list.length?String(offset+1)+"–"+String(Math.min(offset+6,list.length))+" / "+String(list.length)+" 个关联点":"本图暂时没有整理出的分支点";$("#prev").disabled=offset===0;$("#next").disabled=offset+6>=list.length;if(!selected&&shown.length){selected=shown[0].label;detailFor(shown[0])}else if(selected==="__center")detailCenter(m);else{const n=list.find(x=>x.label===selected);if(n)detailFor(n)}renderHighlight()}
function renderHighlight(){svg.querySelectorAll("[data-item]").forEach(g=>{const n=MAPS[mi].items[Number(g.dataset.item)];g.classList.toggle("active",n.label===selected)})}
function detailFor(n){const type=n.type==="number"?"关键参数与条件":n.kind==="safe"?"安全边界":n.type==="cross"?"跨章节关联":"关联知识点";$("#detail").innerHTML='<span class="pill">'+esc(type)+'</span><h3>'+esc(n.label)+'</h3>'+(n.type==="number"?'<div class="value">'+esc(n.tag)+'</div>':'')+'<p>'+esc(n.detail)+'</p><div class="ref">'+esc(n.ref||n.chapter)+'</div><p class="small">所属章节：'+esc(n.chapter)+'</p><a href="../'+esc(n.href||MAPS[mi].href)+'">打开来源章节 →</a><p class="small">关系路径：中心概念 → 关键参数 → 使用情境 → 安全边界 → 跨章节关联</p>'}
function detailCenter(m){$("#detail").innerHTML='<span class="pill">中心概念</span><h3>'+esc(m.center)+'</h3><p>图中把该概念对应的用途、参数、题干情境和风险边界连接起来。点选外圈分支查看具体内容与教材页码。</p><div class="ref">'+esc(m.chapter)+'</div><p class="small">本图关联点：'+m.items.length+' 个；其中有明确数值的节点：'+m.items.filter(n=>n.type==="number").length+' 条。</p><a href="../'+esc(m.href)+'">打开来源章节 →</a>'}
$("#mapPick").onchange=()=>choose(Number($("#mapPick").value));$("#searchMap").oninput=()=>options($("#searchMap").value);$("#prev").onclick=()=>{offset=Math.max(0,offset-6);selected="";render()};$("#next").onclick=()=>{if(offset+6<MAPS[mi].items.length){offset+=6;selected="";render()}};
$("#quick").innerHTML=["ethanol","temperature"].map(id=>{const i=MAPS.findIndex(m=>m.id===id);return i<0?"":'<button data-i="'+i+'">'+esc(MAPS[i].label)+'</button>'}).join("");$("#quick button").forEach(b=>b.onclick=()=>choose(Number(b.dataset.i)));options();const first=MAPS.findIndex(m=>m.id==="ethanol");choose(first>=0?first:0);
</script></body></html>
