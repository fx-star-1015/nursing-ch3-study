</style></head><body><main class="wrap"><header class="hero"><small>ICE冰冰·高分学姐团｜跨章节主题图谱</small><h1>内科护理学知识点关系图</h1><p>从一个疾病机制或临床问题出发，连起跨系统表现、关键数值、判断和误选风险。</p></header><nav class="course-nav"><a href="fundamentals.html" class="">基础护理</a><a href="introduction.html" class="">护理导论</a><a href="medical.html" class="on">内科护理</a><a href="surgical.html" class="">外科护理</a></nav><div class="tabs" id="tabs"></div><section class="layout"><div class="panel"><h2 id="mapTitle"></h2><p class="sub">选一个中心考点，沿分支查看关键参数、使用情境、易混点和教材来源。</p><svg class="map" id="graph" viewBox="0 0 720 468" role="img" aria-label="内科护理学跨章节知识关系图"></svg><div class="pager"><button id="prev">‹ 上一组</button><span id="pageText"></span><button id="next">下一组 ›</button></div><div class="legend"><span><i class="dot"></i>中心概念</span><span><i class="dot2"></i>用途 / 数值 / 跨章关联</span><span><i class="dot3"></i>易错与安全边界</span></div></div><aside class="panel detail" id="detail"></aside></section><p class="footer">中心主题由跨章节考点组织。每个分支保留来源章节与页码；易错节点说明常见混淆，关键数值连同适用条件一起呈现。</p></main><script>
const MAPS=[{"id":"heartfailure","label":"心衰：肺淤血、体循环淤血与低灌注","center":"心力衰竭 × 容量与灌注","logic":"左心淤血牵出肺循环和呼吸问题；右心淤血牵出体循环水肿；心排出量不足又影响器官灌注。把症状、体重、出入量、氧合和治疗反应串成动态判断。","items":[{"type":"number","label":"氧疗适用条件","tag":"SpO₂＜90%","detail":"氧疗适用条件：SpO₂＜90%。适用条件：慢性心衰伴低氧血症时考虑氧疗；不是所有心衰患者常规吸氧。","ref":"教材 P144","chapter":"心力衰竭｜ice冰冰·高分学姐团","href":"medical/cardiovascular/heart-failure.html","kind":"normal"},{"type":"number","label":"体重变化警示","tag":"3天内增加＞2 kg","detail":"体重变化警示：3天内增加＞2 kg。适用条件：相同时间、衣着和体重计测量；提示可能水钠潴留，结合症状及时评估。","ref":"教材 P146","chapter":"心力衰竭｜ice冰冰·高分学姐团","href":"medical/cardiovascular/heart-failure.html","kind":"normal"},{"type":"number","label":"液体入量","tag":"1.5—2.0 L/d","detail":"液体入量：1.5—2.0 L/d。适用条件：教材慢性心衰体液管理范围；按充血、灌注、肾功能和个体医嘱调整。","ref":"教材 P145","chapter":"心力衰竭｜ice冰冰·高分学姐团","href":"medical/cardiovascular/heart-failure.html","kind":"normal"},{"type":"number","label":"钠摄入量","tag":"2—3 g/d","detail":"钠摄入量：2—3 g/d。适用条件：对象是“钠”，不能直接当成同等克数的食盐。","ref":"教材 P145","chapter":"心力衰竭｜ice冰冰·高分学姐团","href":"medical/cardiovascular/heart-failure.html","kind":"safe"},{"type":"number","label":"一般液体负平衡","tag":"约500 mL/d","detail":"一般液体负平衡：约500 mL/d。适用条件：教材慢性心衰充血管理的一般值；同时防止低血容量，不能套用于低灌注状态。","ref":"教材 P145","chapter":"心力衰竭｜ice冰冰·高分学姐团","href":"medical/cardiovascular/heart-failure.html","kind":"safe"},{"type":"concept","label":"慢性心力衰竭","tag":"跨系统表现","detail":"心排出量下降和容量负荷增加导致呼吸困难、水肿与乏力，护理重在容量、症状、用药和自我监测。","ref":"循环症状、慢性心力衰竭与心肌疾病｜ice冰冰·高分学姐团","chapter":"循环症状、慢性心力衰竭与心肌疾病｜ice冰冰·高分学姐团","href":"medical/cardiovascular/study-01.html","kind":"normal"},{"type":"concept","label":"急性心力衰竭","tag":"跨系统表现","detail":"突发严重呼吸困难、端坐呼吸和肺水肿表现需立即减轻心肺负荷并改善氧合。","ref":"急性心力衰竭、心律失常与心脏骤停｜ice冰冰·高分学姐团","chapter":"急性心力衰竭、心律失常与心脏骤停｜ice冰冰·高分学姐团","href":"medical/cardiovascular/study-02.html","kind":"normal"},{"type":"concept","label":"慢性肺源性心脏病","tag":"跨系统表现","detail":"长期肺部疾病导致肺动脉高压和右心负荷增加，护理要同时看缺氧、二氧化碳潴留与右心衰表现。","ref":"慢阻肺与慢性肺源性心脏病｜ice冰冰·高分学姐团","chapter":"慢阻肺与慢性肺源性心脏病｜ice冰冰·高分学姐团","href":"medical/respiratory/study-03.html","kind":"normal"},{"type":"concept","label":"呼吸衰竭与ARDS","tag":"跨系统表现","detail":"气体交换严重受损时需依据血气和临床表现分型，治疗围绕纠正缺氧、处理病因和器官支持。","ref":"肺循环、睡眠呼吸障碍与呼吸衰竭｜ice冰冰·高分学姐团","chapter":"肺循环、睡眠呼吸障碍与呼吸衰竭｜ice冰冰·高分学姐团","href":"medical/respiratory/study-04.html","kind":"normal"},{"type":"concept","label":"排痰与氧合一起看","tag":"跨系统表现","detail":"痰液、体温、呼吸频率、意识及氧合帮助评价疗效；老年患者可以没有明显高热。","ref":"呼吸系统症状与感染性疾病｜ice冰冰·高分学姐团","chapter":"呼吸系统症状与感染性疾病｜ice冰冰·高分学姐团","href":"medical/respiratory/study-01.html","kind":"normal"},{"type":"confusion","label":"氧疗不是心衰常规套餐","tag":"SpO₂＜90%且伴低氧时考虑","detail":"低氧条件与疾病诊断要区分；液体和钠的数值是教材管理范围，需结合灌注、肾功能、淤血表现和个体医嘱。","ref":"教材P144—146","chapter":"内科｜循环系统：慢性心力衰竭","href":"medical/cardiovascular/heart-failure.html","kind":"safe"}]},{"id":"oxygen","label":"从呼吸衰竭到心衰：氧合与给氧","center":"低氧 × 氧疗判断","logic":"先辨低氧来自通气障碍还是气体交换障碍，再结合血气、氧饱和度、呼吸功耗和意识判断；给氧后继续观察反应，不能只看一个数值。","items":[{"type":"number","label":"氧疗适用条件","tag":"SpO₂＜90%","detail":"氧疗适用条件：SpO₂＜90%。适用条件：慢性心衰伴低氧血症时考虑氧疗；不是所有心衰患者常规吸氧。","ref":"教材 P144","chapter":"心力衰竭｜ice冰冰·高分学姐团","href":"medical/cardiovascular/heart-failure.html","kind":"normal"},{"type":"concept","label":"咯血先防窒息","tag":"不同系统的氧合线索","detail":"观察出血量、速度、咳出能力、意识与呼吸。大量出血且不能咳出时，气道威胁优先于常规排痰训练。","ref":"呼吸系统症状与感染性疾病｜ice冰冰·高分学姐团","chapter":"呼吸系统症状与感染性疾病｜ice冰冰·高分学姐团","href":"medical/respiratory/study-01.html","kind":"safe"},{"type":"concept","label":"排痰与氧合一起看","tag":"不同系统的氧合线索","detail":"痰液、体温、呼吸频率、意识及氧合帮助评价疗效；老年患者可以没有明显高热。","ref":"呼吸系统症状与感染性疾病｜ice冰冰·高分学姐团","chapter":"呼吸系统症状与感染性疾病｜ice冰冰·高分学姐团","href":"medical/respiratory/study-01.html","kind":"normal"},{"type":"concept","label":"呼吸衰竭与ARDS","tag":"不同系统的氧合线索","detail":"气体交换严重受损时需依据血气和临床表现分型，治疗围绕纠正缺氧、处理病因和器官支持。","ref":"肺循环、睡眠呼吸障碍与呼吸衰竭｜ice冰冰·高分学姐团","chapter":"肺循环、睡眠呼吸障碍与呼吸衰竭｜ice冰冰·高分学姐团","href":"medical/respiratory/study-04.html","kind":"normal"},{"type":"concept","label":"慢性心力衰竭","tag":"不同系统的氧合线索","detail":"心排出量下降和容量负荷增加导致呼吸困难、水肿与乏力，护理重在容量、症状、用药和自我监测。","ref":"循环症状、慢性心力衰竭与心肌疾病｜ice冰冰·高分学姐团","chapter":"循环症状、慢性心力衰竭与心肌疾病｜ice冰冰·高分学姐团","href":"medical/cardiovascular/study-01.html","kind":"normal"},{"type":"concept","label":"急性心力衰竭","tag":"不同系统的氧合线索","detail":"突发严重呼吸困难、端坐呼吸和肺水肿表现需立即减轻心肺负荷并改善氧合。","ref":"急性心力衰竭、心律失常与心脏骤停｜ice冰冰·高分学姐团","chapter":"急性心力衰竭、心律失常与心脏骤停｜ice冰冰·高分学姐团","href":"medical/cardiovascular/study-02.html","kind":"normal"},{"type":"concept","label":"睡眠呼吸暂停","tag":"不同系统的氧合线索","detail":"夜间打鼾与呼吸暂停可导致白天嗜睡和心血管风险，管理重在危险因素与持续气道正压通气依从性。","ref":"肺循环、睡眠呼吸障碍与呼吸衰竭｜ice冰冰·高分学姐团","chapter":"肺循环、睡眠呼吸障碍与呼吸衰竭｜ice冰冰·高分学姐团","href":"medical/respiratory/study-04.html","kind":"safe"},{"type":"confusion","label":"有呼吸病 ≠ 固定流量吸氧","tag":"对象、低氧证据与目标要齐全","detail":"氧疗要结合病因、血气/SpO₂和患者状态；慢性呼衰还要按治疗目标观察，不能把其他疾病的流量照搬。","ref":"教材P144；各病种对应章节","chapter":"内科｜呼吸系统、循环系统","href":"medical/respiratory/study-04.html","kind":"safe"}]},{"id":"volume","label":"体重、水肿、尿量与液体管理","center":"水钠潴留 × 容量变化","logic":"水钠潴留会推动体重和水肿变化；肾脏排泄、心排出量和治疗共同影响容量。比较同条件体重与出入量，再结合肺淤血、外周水肿、血压和肾功能判断方向。","items":[{"type":"number","label":"体重变化警示","tag":"3天内增加＞2 kg","detail":"体重变化警示：3天内增加＞2 kg。适用条件：相同时间、衣着和体重计测量；提示可能水钠潴留，结合症状及时评估。","ref":"教材 P146","chapter":"心力衰竭｜ice冰冰·高分学姐团","href":"medical/cardiovascular/heart-failure.html","kind":"normal"},{"type":"number","label":"液体入量","tag":"1.5—2.0 L/d","detail":"液体入量：1.5—2.0 L/d。适用条件：教材慢性心衰体液管理范围；按充血、灌注、肾功能和个体医嘱调整。","ref":"教材 P145","chapter":"心力衰竭｜ice冰冰·高分学姐团","href":"medical/cardiovascular/heart-failure.html","kind":"normal"},{"type":"number","label":"钠摄入量","tag":"2—3 g/d","detail":"钠摄入量：2—3 g/d。适用条件：对象是“钠”，不能直接当成同等克数的食盐。","ref":"教材 P145","chapter":"心力衰竭｜ice冰冰·高分学姐团","href":"medical/cardiovascular/heart-failure.html","kind":"safe"},{"type":"number","label":"一般液体负平衡","tag":"约500 mL/d","detail":"一般液体负平衡：约500 mL/d。适用条件：教材慢性心衰充血管理的一般值；同时防止低血容量，不能套用于低灌注状态。","ref":"教材 P145","chapter":"心力衰竭｜ice冰冰·高分学姐团","href":"medical/cardiovascular/heart-failure.html","kind":"safe"},{"type":"concept","label":"慢性心力衰竭","tag":"跨系统容量表现","detail":"心排出量下降和容量负荷增加导致呼吸困难、水肿与乏力，护理重在容量、症状、用药和自我监测。","ref":"循环症状、慢性心力衰竭与心肌疾病｜ice冰冰·高分学姐团","chapter":"循环症状、慢性心力衰竭与心肌疾病｜ice冰冰·高分学姐团","href":"medical/cardiovascular/study-01.html","kind":"normal"},{"type":"concept","label":"急性心力衰竭","tag":"跨系统容量表现","detail":"突发严重呼吸困难、端坐呼吸和肺水肿表现需立即减轻心肺负荷并改善氧合。","ref":"急性心力衰竭、心律失常与心脏骤停｜ice冰冰·高分学姐团","chapter":"急性心力衰竭、心律失常与心脏骤停｜ice冰冰·高分学姐团","href":"medical/cardiovascular/study-02.html","kind":"normal"},{"type":"confusion","label":"钠克数 ≠ 食盐克数","tag":"测量条件和适用状态不能丢","detail":"体重需在相近时间、衣着和体重计下比较；教材写的是钠摄入量，不可直接当作等量食盐；低灌注时不能机械套用负平衡值。","ref":"教材P145—146","chapter":"内科｜慢性心力衰竭；肾脏病章节","href":"medical/cardiovascular/heart-failure.html","kind":"safe"}]},{"id":"bleeding","label":"出血：先看部位，再看威胁器官","center":"出血 × 气道、循环与占位","logic":"同样是出血，风险路径不同：咯血先看气道；消化道出血看循环容量；颅内出血看占位、颅压和神经变化；凝血障碍则可能同时有血栓与出血。","items":[{"type":"number","label":"脑水肿高峰","tag":"出血后约48小时达高峰","detail":"脑水肿高峰：出血后约48小时达高峰。适用条件：颅内压进一步升高并诱发脑疝；连续评估意识、瞳孔、生命体征、呕吐和肢体变化","ref":"教材P631—633","chapter":"神经系统｜脑出血｜内科护理学第7版","href":"medical/neurology/section-04.html","kind":"normal"},{"type":"number","label":"外科治疗参考界值","tag":"壳核出血≥30 ml；丘脑出血≥15 ml；小脑出血≥10 ml或直径＞3 cm","detail":"外科治疗参考界值：壳核出血≥30 ml；丘脑出血≥15 ml；小脑出血≥10 ml或直径＞3 cm。适用条件：继续扩大的血肿可加重占位效应、脑积水和脑疝；动态观察神经体征，配合复查影像并做好脑室引流或血肿清除准备","ref":"教材P632","chapter":"神经系统｜脑出血｜内科护理学第7版","href":"medical/neurology/section-04.html","kind":"normal"},{"type":"number","label":"脑血管痉挛","tag":"出血后3～5天开始，5～14天为高峰","detail":"脑血管痉挛：出血后3～5天开始，5～14天为高峰。适用条件：新发偏瘫、失语或意识恶化，可能遗留永久神经损害；连续神经评估；出现新局灶体征立即报告并结合影像/血流检查复评","ref":"教材P636—637","chapter":"神经系统｜蛛网膜下腔出血｜内科护理学第7版","href":"medical/neurology/section-05.html","kind":"normal"},{"type":"number","label":"再出血高风险期","tag":"最初24小时风险最大，病后10～14天仍需高度警惕","detail":"再出血高风险期：最初24小时风险最大，病后10～14天仍需高度警惕。适用条件：再次破裂可迅速导致颅压升高、昏迷和死亡；立即停止活动、保持安静，监测神经与生命体征并配合复查和病因治疗","ref":"教材P635—637","chapter":"神经系统｜蛛网膜下腔出血｜内科护理学第7版","href":"medical/neurology/section-05.html","kind":"normal"},{"type":"number","label":"数字减影血管造影（DSA）","tag":"教材建议首次出血后3天内或3周后检查，尽量避开高风险期","detail":"数字减影血管造影（DSA）：教材建议首次出血后3天内或3周后检查，尽量避开高风险期。适用条件：穿刺出血、造影剂过敏/肾损伤及血管事件；术前核对凝血和肾功能；术后观察穿刺点、远端血运和神经变化","ref":"教材P636、638","chapter":"神经系统｜蛛网膜下腔出血｜内科护理学第7版","href":"medical/neurology/section-05.html","kind":"normal"},{"type":"concept","label":"咯血先防窒息","tag":"出血部位与首要威胁","detail":"观察出血量、速度、咳出能力、意识与呼吸。大量出血且不能咳出时，气道威胁优先于常规排痰训练。","ref":"呼吸系统症状与感染性疾病｜ice冰冰·高分学姐团","chapter":"呼吸系统症状与感染性疾病｜ice冰冰·高分学姐团","href":"medical/respiratory/study-01.html","kind":"safe"},{"type":"concept","label":"上消化道出血","tag":"出血部位与首要威胁","detail":"呕血、黑便与循环变化共同反映严重度，处理围绕复苏、止血、病因和再出血监测。","ref":"急性胰腺炎、上消化道出血与内镜护理｜ice冰冰·高分学姐团","chapter":"急性胰腺炎、上消化道出血与内镜护理｜ice冰冰·高分学姐团","href":"medical/digestive/study-04.html","kind":"normal"},{"type":"concept","label":"出血类型有区别","tag":"出血部位与首要威胁","detail":"血小板问题常见皮肤黏膜出血；凝血因子缺乏可有深部组织和关节出血，应结合检查。","ref":"再生障碍性、溶血性贫血与出血性疾病｜ice冰冰·高分学姐团","chapter":"再生障碍性、溶血性贫血与出血性疾病｜ice冰冰·高分学姐团","href":"medical/hematology/study-02.html","kind":"normal"},{"type":"concept","label":"弥散性血管内凝血","tag":"出血部位与首要威胁","detail":"凝血系统广泛激活后出现微血栓与消耗性出血，是原发重症的继发表现。","ref":"DIC、淋巴瘤、骨髓瘤与造血干细胞移植｜ice冰冰·高分学姐团","chapter":"DIC、淋巴瘤、骨髓瘤与造血干细胞移植｜ice冰冰·高分学姐团","href":"medical/hematology/study-04.html","kind":"normal"},{"type":"concept","label":"脑出血","tag":"出血部位与首要威胁","detail":"出血造成占位和颅压风险，常见突然神经缺损、头痛、呕吐及意识改变。","ref":"脑出血｜ice冰冰·高分学姐团","chapter":"脑出血｜ice冰冰·高分学姐团","href":"medical/neurology/study-02.html","kind":"safe"},{"type":"concept","label":"脑出血与蛛网膜下腔出血","tag":"出血部位与首要威胁","detail":"脑实质内出血，常有局灶症状及颅压表现；突发剧烈头痛和脑膜刺激征等线索","ref":"脑出血｜ice冰冰·高分学姐团","chapter":"脑出血｜ice冰冰·高分学姐团","href":"medical/neurology/study-02.html","kind":"normal"},{"type":"confusion","label":"不能只按出血量排优先级","tag":"气道 / 循环 / 颅压三条路径","detail":"咯血患者可能先因窒息危险；上消化道出血要看循环变化；脑出血关注意识、瞳孔和局灶体征。先判威胁，再比较数字。","ref":"教材P631—638；出血相关章节","chapter":"内科｜呼吸、消化、血液、神经系统","href":"medical/hematology/study-04.html","kind":"safe"}]},{"id":"infection","label":"感染：同一病原风险，不同系统表现","center":"感染 × 宿主状态","logic":"从病原和感染部位出发，再看宿主免疫状态、器官受累及全身反应；治疗后仍需监测感染扩展和器官功能，尤其是免疫抑制或化疗患者。","items":[{"type":"concept","label":"急性呼吸道感染","tag":"系统表现/宿主差异","detail":"多数上呼吸道感染重在对症支持；高热、气促或持续加重提示需重新评估。","ref":"呼吸系统症状与感染性疾病｜ice冰冰·高分学姐团","chapter":"呼吸系统症状与感染性疾病｜ice冰冰·高分学姐团","href":"medical/respiratory/study-01.html","kind":"normal"},{"type":"concept","label":"感染性心内膜炎","tag":"系统表现/宿主差异","detail":"持续发热、杂音变化及栓塞或免疫表现结合血培养提示诊断，规范抗感染与观察并发症是重点。","ref":"心脏瓣膜、感染性心内膜与心包疾病｜ice冰冰·高分学姐团","chapter":"心脏瓣膜、感染性心内膜与心包疾病｜ice冰冰·高分学姐团","href":"medical/cardiovascular/study-03.html","kind":"normal"},{"type":"concept","label":"发热赘生物与栓塞","tag":"系统表现/宿主差异","detail":"按流程采血培养并配合长期抗菌治疗，持续观察心衰及新发神经、肢体或脏器缺血表现。","ref":"心脏瓣膜、感染性心内膜与心包疾病｜ice冰冰·高分学姐团","chapter":"心脏瓣膜、感染性心内膜与心包疾病｜ice冰冰·高分学姐团","href":"medical/cardiovascular/study-03.html","kind":"normal"},{"type":"concept","label":"尿路感染","tag":"系统表现/宿主差异","detail":"膀胱刺激征、发热和腰痛可提示感染部位，规范留取尿标本和完成疗程很重要。","ref":"急慢性肾炎、肾病综合征与尿路感染｜ice冰冰·高分学姐团","chapter":"急慢性肾炎、肾病综合征与尿路感染｜ice冰冰·高分学姐团","href":"medical/urinary/study-02.html","kind":"normal"},{"type":"concept","label":"感染与血栓都是肾病综合征风险","tag":"系统表现/宿主差异","detail":"大量蛋白丢失及治疗影响免疫和凝血平衡，观察感染、肢体肿痛、突发胸痛气促和肾功能变化。","ref":"急慢性肾炎、肾病综合征与尿路感染｜ice冰冰·高分学姐团","chapter":"急慢性肾炎、肾病综合征与尿路感染｜ice冰冰·高分学姐团","href":"medical/urinary/study-02.html","kind":"normal"},{"type":"concept","label":"化疗后发热不能等","tag":"系统表现/宿主差异","detail":"骨髓抑制期感染可迅速恶化，发热需及时评估，规范采样与治疗不能拖延。","ref":"白血病｜ice冰冰·高分学姐团","chapter":"白血病｜ice冰冰·高分学姐团","href":"medical/hematology/study-03.html","kind":"safe"},{"type":"concept","label":"抗甲状腺药后的咽痛发热","tag":"系统表现/宿主差异","detail":"抗甲状腺药可能引起粒细胞减少；发热咽痛是重要报告信号，不能仅归于甲亢本身。","ref":"甲状腺功能亢进与减退｜ice冰冰·高分学姐团","chapter":"甲状腺功能亢进与减退｜ice冰冰·高分学姐团","href":"medical/endocrine-metabolic/study-01.html","kind":"safe"},{"type":"concept","label":"狼疮活动与感染","tag":"系统表现/宿主差异","detail":"原病的免疫炎症及器官变化；可在免疫抑制治疗中出现或加重","ref":"风湿症状评估与系统性红斑狼疮｜ice冰冰·高分学姐团","chapter":"风湿症状评估与系统性红斑狼疮｜ice冰冰·高分学姐团","href":"medical/rheumatology/study-01.html","kind":"normal"},{"type":"confusion","label":"发热不等于普通感染","tag":"免疫抑制患者可表现不典型","detail":"化疗后发热、抗甲状腺药后咽痛发热等题干要联系药物与粒细胞风险；不能只按体温高低判断严重度。","ref":"各系统对应教材章节","chapter":"内科｜呼吸、循环、血液、内分泌、风湿","href":"medical/hematology/study-03.html","kind":"safe"}]},{"id":"glucose","label":"糖尿病：低血糖、酮症与高渗状态","center":"血糖 × 胰岛素与进食","logic":"将血糖变化放回进食、药物、活动、感染和脱水背景；先识别意识和循环等急症，再区分低血糖与高血糖危象，落实监测与治疗配合。","items":[{"type":"number","label":"二甲双胍","tag":"2型糖尿病常用基础药","detail":"二甲双胍：2型糖尿病常用基础药。适用条件：胃肠反应、维生素B12缺乏；严重肾功能不全时乳酸酸中毒风险；结合肾功能使用；造影及急性缺氧等情境按医嘱暂停；观察胃肠反应","ref":"教材P508—529","chapter":"内分泌与代谢｜糖尿病｜内科护理学第7版","href":"medical/endocrine-metabolic/section-07.html","kind":"safe"},{"type":"number","label":"胰岛素","tag":"1型糖尿病、严重高血糖及特定应激情境","detail":"胰岛素：1型糖尿病、严重高血糖及特定应激情境。适用条件：低血糖、体重增加、低钾、注射部位脂肪增生；核对种类剂量与进餐；轮换注射部位；监测血糖和低血糖表现","ref":"教材P508","chapter":"内分泌与代谢｜糖尿病｜内科护理学第7版","href":"medical/endocrine-metabolic/section-07.html","kind":"normal"},{"type":"concept","label":"糖尿病","tag":"药物—进食—监测","detail":"长期高血糖带来急性代谢危象与慢性血管神经并发症，管理依赖监测、用药、饮食、运动和教育。","ref":"糖尿病｜ice冰冰·高分学姐团","chapter":"糖尿病｜ice冰冰·高分学姐团","href":"medical/endocrine-metabolic/study-03.html","kind":"normal"},{"type":"concept","label":"低血糖与酮症酸中毒或高渗状态","tag":"药物—进食—监测","detail":"常与用药、进餐和活动不匹配有关；高血糖与脱水、酸碱或渗透异常等","ref":"糖尿病｜ice冰冰·高分学姐团","chapter":"糖尿病｜ice冰冰·高分学姐团","href":"medical/endocrine-metabolic/study-03.html","kind":"normal"},{"type":"concept","label":"监测连接进餐用药活动","tag":"药物—进食—监测","detail":"血糖变化要联系用药、进餐、活动和感染；区分低血糖、酮症酸中毒及高渗状态的临床线索。","ref":"糖尿病｜ice冰冰·高分学姐团","chapter":"糖尿病｜ice冰冰·高分学姐团","href":"medical/endocrine-metabolic/study-03.html","kind":"normal"},{"type":"concept","label":"内分泌评估与腺垂体功能减退","tag":"药物—进食—监测","detail":"体形、生殖、营养、血压、排泄、疲乏和骨骼变化帮助判断激素过多还是不足；腺垂体多轴功能减退常先出现性腺功能减退，并可伴低血压和低血糖。","ref":"腺垂体与肾上腺疾病｜ice冰冰·高分学姐团","chapter":"腺垂体与肾上腺疾病｜ice冰冰·高分学姐团","href":"medical/endocrine-metabolic/study-02.html","kind":"normal"},{"type":"confusion","label":"低血糖与高血糖危象别混","tag":"先看进食、用药、意识和脱水","detail":"出汗、颤抖、意识改变与多尿、脱水、深大呼吸属于不同危险路径；不要只凭“糖尿病史”选措施。","ref":"教材对应糖尿病章节","chapter":"内科｜内分泌与代谢系统","href":"medical/endocrine-metabolic/study-03.html","kind":"safe"}]}];let mi=0,offset=0,selected=-1;const $=s=>document.querySelector(s),svg=$("#graph");
