const N=[{"book":"内科护理学","title":"内科护理总论","summary":"以内科疾病患者为对象，用护理程序把疾病证据、患者反应、治疗安全和连续照护连成完整判断链。","exam":"","page":"内科护理总论｜ice冰冰·高分学姐团","chapter":"内科护理总论｜ice冰冰·高分学姐团","href":"medical/introduction/study-01.html"},{"book":"内科护理学","title":"护理程序要循环","summary":"评估资料后识别护理问题，与患者共同确定可观察的目标，再实施和评价。评价不达标要回到原因和计划，不能只勾选“已宣教”。","exam":"","page":"内科护理总论｜ice冰冰·高分学姐团","chapter":"内科护理总论｜ice冰冰·高分学姐团","href":"medical/introduction/study-01.html"},{"book":"内科护理学","title":"三种病，一张可执行清单","summary":"复述与演示能发现真实理解和执行障碍。教育还须回应费用、生活安排及家庭支持。","exam":"","page":"内科护理总论｜ice冰冰·高分学姐团","chapter":"内科护理总论｜ice冰冰·高分学姐团","href":"medical/introduction/study-01.html"},{"book":"内科护理学","title":"疾病诊断与护理诊断","summary":"描述疾病本身及病理过程；描述患者对健康问题的反应","exam":"","page":"内科护理总论｜ice冰冰·高分学姐团","chapter":"内科护理总论｜ice冰冰·高分学姐团","href":"medical/introduction/study-01.html"},{"book":"内科护理学","title":"把判断带回患者的生活","summary":"内科护理的价值常常不在一次操作，而在于陪一个人把疾病重新放回生活中，使治疗真正可持续。","exam":"","page":"内科护理总论｜ice冰冰·高分学姐团","chapter":"内科护理总论｜ice冰冰·高分学姐团","href":"medical/introduction/study-01.html"},{"book":"内科护理学","title":"成人健康与连续照护","summary":"疾病管理同时关注功能、生活方式、心理社会处境和可获得的支持；以共同目标连接住院、门诊和家庭随访。","exam":"","page":"内科护理总论｜ice冰冰·高分学姐团","chapter":"内科护理总论｜ice冰冰·高分学姐团","href":"medical/introduction/study-01.html"},{"book":"内科护理学","title":"常见症状评估","summary":"咳嗽、痰液、呼吸困难和咯血要结合起病方式、诱因、量、颜色及伴随表现判断。","exam":"","page":"呼吸系统症状与感染性疾病｜ice冰冰·高分学姐团","chapter":"呼吸系统症状与感染性疾病｜ice冰冰·高分学姐团","href":"medical/respiratory/study-01.html"},{"book":"内科护理学","title":"咯血先防窒息","summary":"观察出血量、速度、咳出能力、意识与呼吸。大量出血且不能咳出时，气道威胁优先于常规排痰训练。","exam":"","page":"呼吸系统症状与感染性疾病｜ice冰冰·高分学姐团","chapter":"呼吸系统症状与感染性疾病｜ice冰冰·高分学姐团","href":"medical/respiratory/study-01.html"},{"book":"内科护理学","title":"急性呼吸道感染","summary":"多数上呼吸道感染重在对症支持；高热、气促或持续加重提示需重新评估。","exam":"","page":"呼吸系统症状与感染性疾病｜ice冰冰·高分学姐团","chapter":"呼吸系统症状与感染性疾病｜ice冰冰·高分学姐团","href":"medical/respiratory/study-01.html"},{"book":"内科护理学","title":"不是每次咳嗽都用抗菌药","summary":"根据感染部位、全身情况及病原线索判断，观察发热、气促和症状持续变化。","exam":"","page":"呼吸系统症状与感染性疾病｜ice冰冰·高分学姐团","chapter":"呼吸系统症状与感染性疾病｜ice冰冰·高分学姐团","href":"medical/respiratory/study-01.html"},{"book":"内科护理学","title":"肺部感染","summary":"病原体、宿主状况和影像表现共同影响判断，护理关注氧合、排痰、体温与抗感染反应。","exam":"","page":"呼吸系统症状与感染性疾病｜ice冰冰·高分学姐团","chapter":"呼吸系统症状与感染性疾病｜ice冰冰·高分学姐团","href":"medical/respiratory/study-01.html"},{"book":"内科护理学","title":"排痰与氧合一起看","summary":"痰液、体温、呼吸频率、意识及氧合帮助评价疗效；老年患者可以没有明显高热。","exam":"","page":"呼吸系统症状与感染性疾病｜ice冰冰·高分学姐团","chapter":"呼吸系统症状与感染性疾病｜ice冰冰·高分学姐团","href":"medical/respiratory/study-01.html"},{"book":"内科护理学","title":"肺炎病原线索的用途","summary":"肺炎链球菌肺炎可有急性高热、胸痛和铁锈色痰；葡萄球菌肺炎可出现肺组织坏死与脓肿。","exam":"","page":"呼吸系统症状与感染性疾病｜ice冰冰·高分学姐团","chapter":"呼吸系统症状与感染性疾病｜ice冰冰·高分学姐团","href":"medical/respiratory/study-01.html"},{"book":"内科护理学","title":"肺脓肿：引流与全身状态","summary":"脓性痰、发热等结合影像判断，配合抗感染并按条件促进脓液引流，监测氧合及营养消耗。","exam":"","page":"呼吸系统症状与感染性疾病｜ice冰冰·高分学姐团","chapter":"呼吸系统症状与感染性疾病｜ice冰冰·高分学姐团","href":"medical/respiratory/study-01.html"},{"book":"内科护理学","title":"支气管扩张","summary":"反复咳大量脓痰、咯血及固定部位感染是重要线索，核心是引流、抗感染与防窒息。","exam":"","page":"支气管扩张、肺结核与支气管哮喘｜ice冰冰·高分学姐团","chapter":"支气管扩张、肺结核与支气管哮喘｜ice冰冰·高分学姐团","href":"medical/respiratory/study-02.html"},{"book":"内科护理学","title":"引流有适用条件","summary":"稳定期痰多时可按病变部位和耐受选择排痰方式；大咯血时改以防窒息和气道管理为先。","exam":"","page":"支气管扩张、肺结核与支气管哮喘｜ice冰冰·高分学姐团","chapter":"支气管扩张、肺结核与支气管哮喘｜ice冰冰·高分学姐团","href":"medical/respiratory/study-02.html"},{"book":"内科护理学","title":"肺结核","summary":"慢性呼吸症状、午后低热、盗汗等结合病原学和影像判断，护理兼顾规范治疗与传播控制。","exam":"","page":"支气管扩张、肺结核与支气管哮喘｜ice冰冰·高分学姐团","chapter":"支气管扩张、肺结核与支气管哮喘｜ice冰冰·高分学姐团","href":"medical/respiratory/study-02.html"},{"book":"内科护理学","title":"疗程与传播控制不能丢","summary":"规律、联合、适量、全程等治疗原则要落实到实际服药，观察药物毒性和痰菌变化，并落实呼吸道传播防护。","exam":"","page":"支气管扩张、肺结核与支气管哮喘｜ice冰冰·高分学姐团","chapter":"支气管扩张、肺结核与支气管哮喘｜ice冰冰·高分学姐团","href":"medical/respiratory/study-02.html"},{"book":"内科护理学","title":"支气管哮喘","summary":"可变性气流受限与气道高反应性相关，急性发作先评估严重度并快速改善通气。","exam":"","page":"支气管扩张、肺结核与支气管哮喘｜ice冰冰·高分学姐团","chapter":"支气管扩张、肺结核与支气管哮喘｜ice冰冰·高分学姐团","href":"medical/respiratory/study-02.html"},{"book":"内科护理学","title":"喘鸣变轻也可能恶化","summary":"严重发作时观察能否说话、意识、辅助呼吸肌和呼吸音；沉默肺提示极重气流受限。","exam":"","page":"支气管扩张、肺结核与支气管哮喘｜ice冰冰·高分学姐团","chapter":"支气管扩张、肺结核与支气管哮喘｜ice冰冰·高分学姐团","href":"medical/respiratory/study-02.html"},{"book":"内科护理学","title":"抗结核药要配对观察","summary":"异烟肼关注肝损害和周围神经病变，利福平关注肝损害及体液变色，乙胺丁醇关注视力和辨色异常，链霉素关注听力及肾功能。","exam":"","page":"支气管扩张、肺结核与支气管哮喘｜ice冰冰·高分学姐团","chapter":"支气管扩张、肺结核与支气管哮喘｜ice冰冰·高分学姐团","href":"medical/respiratory/study-02.html"},{"book":"内科护理学","title":"结核检查回答不同问题","summary":"痰病原学帮助判断病原和排菌，影像定位病变；PPD提示感染相关免疫反应。","exam":"","page":"支气管扩张、肺结核与支气管哮喘｜ice冰冰·高分学姐团","chapter":"支气管扩张、肺结核与支气管哮喘｜ice冰冰·高分学姐团","href":"medical/respiratory/study-02.html"},{"book":"内科护理学","title":"慢阻肺","summary":"持续气流受限常与吸烟等暴露相关，稳定期重在戒烟、吸入治疗、康复和急性加重预防。","exam":"","page":"慢阻肺与慢性肺源性心脏病｜ice冰冰·高分学姐团","chapter":"慢阻肺与慢性肺源性心脏病｜ice冰冰·高分学姐团","href":"medical/respiratory/study-03.html"},{"book":"内科护理学","title":"肺功能界限要带条件","summary":"COPD诊断强调吸入支气管舒张药后仍有气流受限；用力呼气指标与预计值比例又用于不同的分级。","exam":"","page":"慢阻肺与慢性肺源性心脏病｜ice冰冰·高分学姐团","chapter":"慢阻肺与慢性肺源性心脏病｜ice冰冰·高分学姐团","href":"medical/respiratory/study-03.html"},{"book":"内科护理学","title":"慢性肺源性心脏病","summary":"长期肺部疾病导致肺动脉高压和右心负荷增加，护理要同时看缺氧、二氧化碳潴留与右心衰表现。","exam":"","page":"慢阻肺与慢性肺源性心脏病｜ice冰冰·高分学姐团","chapter":"慢阻肺与慢性肺源性心脏病｜ice冰冰·高分学姐团","href":"medical/respiratory/study-03.html"},{"book":"内科护理学","title":"回到肺部病因","summary":"失代偿常与感染和呼吸衰竭相互推动，处理须兼顾气道、氧合、二氧化碳和右心负荷。","exam":"","page":"慢阻肺与慢性肺源性心脏病｜ice冰冰·高分学姐团","chapter":"慢阻肺与慢性肺源性心脏病｜ice冰冰·高分学姐团","href":"medical/respiratory/study-03.html"},{"book":"内科护理学","title":"嗜睡不是睡得更好了","summary":"低氧、高碳酸血症与意识改变要合并判断，及时报告和评估通气；不能只看血氧或用镇静掩盖恶化。","exam":"","page":"慢阻肺与慢性肺源性心脏病｜ice冰冰·高分学姐团","chapter":"慢阻肺与慢性肺源性心脏病｜ice冰冰·高分学姐团","href":"medical/respiratory/study-03.html"},{"book":"内科护理学","title":"FEV₁/FVC与FEV₁占预计值","summary":"呼气量之比，舒张后低于界限支持持续气流受限；用于评价气流受限严重程度的指标之一","exam":"","page":"慢阻肺与慢性肺源性心脏病｜ice冰冰·高分学姐团","chapter":"慢阻肺与慢性肺源性心脏病｜ice冰冰·高分学姐团","href":"medical/respiratory/study-03.html"},{"book":"内科护理学","title":"把判断带回患者的生活","summary":"呼吸护理不仅是让血氧数字上升，也是让患者敢于说话、进食、活动，并重新相信自己还能生活。","exam":"","page":"慢阻肺与慢性肺源性心脏病｜ice冰冰·高分学姐团","chapter":"慢阻肺与慢性肺源性心脏病｜ice冰冰·高分学姐团","href":"medical/respiratory/study-03.html"},{"book":"内科护理学","title":"缩唇呼吸与腹式呼吸","summary":"缩唇呼气通过延长呼气帮助减轻呼气时小气道陷闭，腹式呼吸训练与呼吸节律和耐受共同安排。","exam":"","page":"慢阻肺与慢性肺源性心脏病｜ice冰冰·高分学姐团","chapter":"慢阻肺与慢性肺源性心脏病｜ice冰冰·高分学姐团","href":"medical/respiratory/study-03.html"},{"book":"内科护理学","title":"肺血栓栓塞","summary":"突发呼吸困难、胸痛、低氧及血栓风险因素构成关键线索，需快速评估和预防恶化。","exam":"","page":"肺循环、睡眠呼吸障碍与呼吸衰竭｜ice冰冰·高分学姐团","chapter":"肺循环、睡眠呼吸障碍与呼吸衰竭｜ice冰冰·高分学姐团","href":"medical/respiratory/study-04.html"},{"book":"内科护理学","title":"风险因素加急性变化","summary":"长期制动、术后、深静脉血栓等风险叠加突发气促胸痛时要迅速评估；不要按摩可疑血栓患肢。","exam":"","page":"肺循环、睡眠呼吸障碍与呼吸衰竭｜ice冰冰·高分学姐团","chapter":"肺循环、睡眠呼吸障碍与呼吸衰竭｜ice冰冰·高分学姐团","href":"medical/respiratory/study-04.html"},{"book":"内科护理学","title":"睡眠呼吸暂停","summary":"夜间打鼾与呼吸暂停可导致白天嗜睡和心血管风险，管理重在危险因素与持续气道正压通气依从性。","exam":"","page":"肺循环、睡眠呼吸障碍与呼吸衰竭｜ice冰冰·高分学姐团","chapter":"肺循环、睡眠呼吸障碍与呼吸衰竭｜ice冰冰·高分学姐团","href":"medical/respiratory/study-04.html"},{"book":"内科护理学","title":"夜间问题影响白天","summary":"打鼾、目击呼吸暂停、白天嗜睡等结合睡眠监测判断，教育关注体重、危险行为和正压通气依从性。","exam":"","page":"肺循环、睡眠呼吸障碍与呼吸衰竭｜ice冰冰·高分学姐团","chapter":"肺循环、睡眠呼吸障碍与呼吸衰竭｜ice冰冰·高分学姐团","href":"medical/respiratory/study-04.html"},{"book":"内科护理学","title":"呼吸衰竭与ARDS","summary":"气体交换严重受损时需依据血气和临床表现分型，治疗围绕纠正缺氧、处理病因和器官支持。","exam":"","page":"肺循环、睡眠呼吸障碍与呼吸衰竭｜ice冰冰·高分学姐团","chapter":"肺循环、睡眠呼吸障碍与呼吸衰竭｜ice冰冰·高分学姐团","href":"medical/respiratory/study-04.html"},{"book":"内科护理学","title":"血气分型与条件","summary":"呼吸空气、海平面、静息时的动脉血气是教材诊断界限的条件；吸氧中的结果需结合氧浓度解释。","exam":"","page":"呼吸空气、海平面、静息时的动脉血气是教材诊断界限的条件；吸氧中的结果需结合氧浓度解释。","chapter":"肺循环、睡眠呼吸障碍与呼吸衰竭｜ice冰冰·高分学姐团","href":"medical/respiratory/study-04.html"},{"book":"内科护理学","title":"机械通气","summary":"关注人机同步、气道压力、氧合、分泌物、镇静与呼吸机相关并发症预防。","exam":"","page":"肺循环、睡眠呼吸障碍与呼吸衰竭｜ice冰冰·高分学姐团","chapter":"肺循环、睡眠呼吸障碍与呼吸衰竭｜ice冰冰·高分学姐团","href":"medical/respiratory/study-04.html"},{"book":"内科护理学","title":"报警先评估患者","summary":"看意识、呼吸、胸廓起伏及氧合，再查导管、分泌物、管路和机器；必要时立即呼叫协助并保障通气。","exam":"","page":"肺循环、睡眠呼吸障碍与呼吸衰竭｜ice冰冰·高分学姐团","chapter":"肺循环、睡眠呼吸障碍与呼吸衰竭｜ice冰冰·高分学姐团","href":"medical/respiratory/study-04.html"},{"book":"内科护理学","title":"原发性支气管肺癌","summary":"持续或改变性质的咳嗽、痰血、胸痛及全身表现需警惕，护理贯穿检查、治疗、副作用和支持。","exam":"","page":"肺癌、胸膜疾病与呼吸系统诊疗｜ice冰冰·高分学姐团","chapter":"肺癌、胸膜疾病与呼吸系统诊疗｜ice冰冰·高分学姐团","href":"medical/respiratory/study-05.html"},{"book":"内科护理学","title":"持续改变比孤立症状重要","summary":"咳嗽性质改变、持续血痰和体重下降等需结合检查；治疗护理同时关注疼痛、呼吸及不良反应。","exam":"","page":"肺癌、胸膜疾病与呼吸系统诊疗｜ice冰冰·高分学姐团","chapter":"肺癌、胸膜疾病与呼吸系统诊疗｜ice冰冰·高分学姐团","href":"medical/respiratory/study-05.html"},{"book":"内科护理学","title":"胸膜疾病","summary":"胸腔积液影响肺扩张，气胸可出现突发胸痛和呼吸困难；张力性气胸属于紧急情况。","exam":"","page":"肺癌、胸膜疾病与呼吸系统诊疗｜ice冰冰·高分学姐团","chapter":"肺癌、胸膜疾病与呼吸系统诊疗｜ice冰冰·高分学姐团","href":"medical/respiratory/study-05.html"},{"book":"内科护理学","title":"先看患者，再看引流瓶","summary":"突发气促时先评估呼吸循环，再排查引流管扭曲堵塞、连接和装置位置。","exam":"","page":"肺癌、胸膜疾病与呼吸系统诊疗｜ice冰冰·高分学姐团","chapter":"肺癌、胸膜疾病与呼吸系统诊疗｜ice冰冰·高分学姐团","href":"medical/respiratory/study-05.html"},{"book":"内科护理学","title":"支气管镜与胸穿","summary":"操作前核对禁忌和知情准备，操作后重点观察出血、气胸、呼吸状态及局麻恢复。","exam":"","page":"肺癌、胸膜疾病与呼吸系统诊疗｜ice冰冰·高分学姐团","chapter":"肺癌、胸膜疾病与呼吸系统诊疗｜ice冰冰·高分学姐团","href":"medical/respiratory/study-05.html"},{"book":"内科护理学","title":"按检查前中后组织","summary":"术前核对准备和禁忌，操作中监测耐受，术后关注出血、气胸和吞咽恢复。","exam":"","page":"肺癌、胸膜疾病与呼吸系统诊疗｜ice冰冰·高分学姐团","chapter":"肺癌、胸膜疾病与呼吸系统诊疗｜ice冰冰·高分学姐团","href":"medical/respiratory/study-05.html"},{"book":"内科护理学","title":"循环症状线索","summary":"心源性呼吸困难、水肿、胸痛、心悸和晕厥要结合活动关系、体位、持续时间与血流动力学判断。","exam":"","page":"循环症状、慢性心力衰竭与心肌疾病｜ice冰冰·高分学姐团","chapter":"循环症状、慢性心力衰竭与心肌疾病｜ice冰冰·高分学姐团","href":"medical/cardiovascular/study-01.html"},{"book":"内科护理学","title":"胸痛要连时间与状态","summary":"记录部位、性质、持续时间、诱因和伴随的呼吸及循环变化，突发晕厥须关注有效灌注。","exam":"","page":"循环症状、慢性心力衰竭与心肌疾病｜ice冰冰·高分学姐团","chapter":"循环症状、慢性心力衰竭与心肌疾病｜ice冰冰·高分学姐团","href":"medical/cardiovascular/study-01.html"},{"book":"内科护理学","title":"慢性心力衰竭","summary":"心排出量下降和容量负荷增加导致呼吸困难、水肿与乏力，护理重在容量、症状、用药和自我监测。","exam":"","page":"循环症状、慢性心力衰竭与心肌疾病｜ice冰冰·高分学姐团","chapter":"循环症状、慢性心力衰竭与心肌疾病｜ice冰冰·高分学姐团","href":"medical/cardiovascular/study-01.html"},{"book":"内科护理学","title":"淤血和低灌注并存","summary":"肺循环淤血表现与体循环水肿要分别定位，低心排可同时造成乏力、少尿及灌注下降。","exam":"","page":"循环症状、慢性心力衰竭与心肌疾病｜ice冰冰·高分学姐团","chapter":"循环症状、慢性心力衰竭与心肌疾病｜ice冰冰·高分学姐团","href":"medical/cardiovascular/study-01.html"},{"book":"内科护理学","title":"心肌疾病","summary":"扩张、肥厚等结构异常造成不同的泵血或流出道问题，护理要识别心衰、心律失常和猝死风险。","exam":"","page":"循环症状、慢性心力衰竭与心肌疾病｜ice冰冰·高分学姐团","chapter":"循环症状、慢性心力衰竭与心肌疾病｜ice冰冰·高分学姐团","href":"medical/cardiovascular/study-01.html"},{"book":"内科护理学","title":"心肌病与心肌炎不要混","summary":"扩张型以心腔扩大和收缩受损等表现为线索；感染后心悸心律异常须考虑心肌炎。","exam":"","page":"循环症状、慢性心力衰竭与心肌疾病｜ice冰冰·高分学姐团","chapter":"循环症状、慢性心力衰竭与心肌疾病｜ice冰冰·高分学姐团","href":"medical/cardiovascular/study-01.html"},{"book":"内科护理学","title":"急性心力衰竭","summary":"突发严重呼吸困难、端坐呼吸和肺水肿表现需立即减轻心肺负荷并改善氧合。","exam":"","page":"急性心力衰竭、心律失常与心脏骤停｜ice冰冰·高分学姐团","chapter":"急性心力衰竭、心律失常与心脏骤停｜ice冰冰·高分学姐团","href":"medical/cardiovascular/study-02.html"},{"book":"内科护理学","title":"体位不能脱离血压","summary":"粉红色泡沫痰、急性喘憋提示急性肺水肿；出现低血压、湿冷和意识改变要重新评估循环。","exam":"","page":"急性心力衰竭、心律失常与心脏骤停｜ice冰冰·高分学姐团","chapter":"急性心力衰竭、心律失常与心脏骤停｜ice冰冰·高分学姐团","href":"medical/cardiovascular/study-02.html"},{"book":"内科护理学","title":"心律失常与器械介入治疗","summary":"判断心律失常既看心电图类型，也看血流动力学是否稳定；电复律、起搏器和射频消融还要连同适应证、术前准备、术后心律、穿刺处及设备安全一起掌握。","exam":"","page":"急性心力衰竭、心律失常与心脏骤停｜ice冰冰·高分学姐团","chapter":"急性心力衰竭、心律失常与心脏骤停｜ice冰冰·高分学姐团","href":"medical/cardiovascular/study-02.html"},{"book":"内科护理学","title":"节律与血流动力学双判断","summary":"识别节律后立即看有效脉搏、血压、意识及胸痛。器械治疗后还须看穿刺部位、节律及设备安全。","exam":"","page":"急性心力衰竭、心律失常与心脏骤停｜ice冰冰·高分学姐团","chapter":"急性心力衰竭、心律失常与心脏骤停｜ice冰冰·高分学姐团","href":"medical/cardiovascular/study-02.html"},{"book":"内科护理学","title":"心脏骤停","summary":"无反应、无正常呼吸和无循环征象时立即启动高质量复苏与除颤流程。","exam":"","page":"急性心力衰竭、心律失常与心脏骤停｜ice冰冰·高分学姐团","chapter":"急性心力衰竭、心律失常与心脏骤停｜ice冰冰·高分学姐团","href":"medical/cardiovascular/study-02.html"},{"book":"内科护理学","title":"识别后立即启动救治","summary":"无反应、无正常呼吸及无有效脉搏时迅速呼救，实施高质量复苏并尽快使用AED。","exam":"","page":"急性心力衰竭、心律失常与心脏骤停｜ice冰冰·高分学姐团","chapter":"急性心力衰竭、心律失常与心脏骤停｜ice冰冰·高分学姐团","href":"medical/cardiovascular/study-02.html"},{"book":"内科护理学","title":"房颤、早搏与快速心律","summary":"房颤常无规律P波且心室律绝对不齐；早搏是提前出现的激动，需按形态与来源判断。","exam":"","page":"急性心力衰竭、心律失常与心脏骤停｜ice冰冰·高分学姐团","chapter":"急性心力衰竭、心律失常与心脏骤停｜ice冰冰·高分学姐团","href":"medical/cardiovascular/study-02.html"},{"book":"内科护理学","title":"房室传导阻滞按传导关系分","summary":"一度传导延长但无心室漏搏；二度有部分冲动未下传；三度心房与心室活动相互独立。","exam":"","page":"急性心力衰竭、心律失常与心脏骤停｜ice冰冰·高分学姐团","chapter":"急性心力衰竭、心律失常与心脏骤停｜ice冰冰·高分学姐团","href":"medical/cardiovascular/study-02.html"},{"book":"内科护理学","title":"器械与导管治疗后的护理","summary":"起搏、消融和导管检查后观察心律、穿刺处出血和远端循环，结合设备或术式落实活动与随访。","exam":"","page":"急性心力衰竭、心律失常与心脏骤停｜ice冰冰·高分学姐团","chapter":"急性心力衰竭、心律失常与心脏骤停｜ice冰冰·高分学姐团","href":"medical/cardiovascular/study-02.html"},{"book":"内科护理学","title":"心脏瓣膜病","summary":"瓣口狭窄或关闭不全造成压力或容量负荷，症状与杂音、房颤和心衰风险相互关联。","exam":"","page":"心脏瓣膜、感染性心内膜与心包疾病｜ice冰冰·高分学姐团","chapter":"心脏瓣膜、感染性心内膜与心包疾病｜ice冰冰·高分学姐团","href":"medical/cardiovascular/study-03.html"},{"book":"内科护理学","title":"收缩期还是舒张期","summary":"先按瓣口和心动周期理解杂音，再联系压力或容量负荷、房颤、栓塞和心衰风险。","exam":"","page":"心脏瓣膜、感染性心内膜与心包疾病｜ice冰冰·高分学姐团","chapter":"心脏瓣膜、感染性心内膜与心包疾病｜ice冰冰·高分学姐团","href":"medical/cardiovascular/study-03.html"},{"book":"内科护理学","title":"感染性心内膜炎","summary":"持续发热、杂音变化及栓塞或免疫表现结合血培养提示诊断，规范抗感染与观察并发症是重点。","exam":"","page":"心脏瓣膜、感染性心内膜与心包疾病｜ice冰冰·高分学姐团","chapter":"心脏瓣膜、感染性心内膜与心包疾病｜ice冰冰·高分学姐团","href":"medical/cardiovascular/study-03.html"},{"book":"内科护理学","title":"发热赘生物与栓塞","summary":"按流程采血培养并配合长期抗菌治疗，持续观察心衰及新发神经、肢体或脏器缺血表现。","exam":"","page":"心脏瓣膜、感染性心内膜与心包疾病｜ice冰冰·高分学姐团","chapter":"心脏瓣膜、感染性心内膜与心包疾病｜ice冰冰·高分学姐团","href":"medical/cardiovascular/study-03.html"},{"book":"内科护理学","title":"心包疾病","summary":"心包积液快速增加可导致压塞，低血压、静脉压升高和心音改变等提示循环受限。","exam":"","page":"心脏瓣膜、感染性心内膜与心包疾病｜ice冰冰·高分学姐团","chapter":"心脏瓣膜、感染性心内膜与心包疾病｜ice冰冰·高分学姐团","href":"medical/cardiovascular/study-03.html"},{"book":"内科护理学","title":"积液与压塞程度不同","summary":"心包积液的量、积聚速度和循环影响共同决定危险；呼吸困难、血压下降及静脉淤血须警惕压塞。","exam":"","page":"心脏瓣膜、感染性心内膜与心包疾病｜ice冰冰·高分学姐团","chapter":"心脏瓣膜、感染性心内膜与心包疾病｜ice冰冰·高分学姐团","href":"medical/cardiovascular/study-03.html"},{"book":"内科护理学","title":"主动脉瓣的收缩和舒张","summary":"狭窄时射血受阻，常联系劳力性呼吸困难、心绞痛和晕厥；关闭不全则有舒张期返流和容量负荷。","exam":"","page":"心脏瓣膜、感染性心内膜与心包疾病｜ice冰冰·高分学姐团","chapter":"心脏瓣膜、感染性心内膜与心包疾病｜ice冰冰·高分学姐团","href":"medical/cardiovascular/study-03.html"},{"book":"内科护理学","title":"心包压塞不同于普通积液","summary":"积液迅速增加可限制心脏充盈，呼吸困难、血压下降及颈静脉淤血等需要迅速复评。","exam":"","page":"心脏瓣膜、感染性心内膜与心包疾病｜ice冰冰·高分学姐团","chapter":"心脏瓣膜、感染性心内膜与心包疾病｜ice冰冰·高分学姐团","href":"medical/cardiovascular/study-03.html"},{"book":"内科护理学","title":"冠心病、急性冠脉综合征与冠脉介入","summary":"心肌缺血的性质、诱因、持续时间及标志物变化帮助区分稳定心绞痛与急性事件；介入治疗后仍要监测再缺血、穿刺处出血、远端循环及造影剂相关肾损伤。","exam":"","page":"冠心病与原发性高血压｜ice冰冰·高分学姐团","chapter":"冠心病与原发性高血压｜ice冰冰·高分学姐团","href":"medical/cardiovascular/study-04.html"},{"book":"内科护理学","title":"从持续胸痛进入救治路径","summary":"持续或加重的胸痛结合心电及心肌损伤标志物判断；介入后监测再缺血、出血及穿刺处循环。","exam":"","page":"冠心病与原发性高血压｜ice冰冰·高分学姐团","chapter":"冠心病与原发性高血压｜ice冰冰·高分学姐团","href":"medical/cardiovascular/study-04.html"},{"book":"内科护理学","title":"原发性高血压","summary":"长期血压升高可无明显症状，却持续损害靶器官；管理依赖生活方式、药物与长期随访。","exam":"","page":"冠心病与原发性高血压｜ice冰冰·高分学姐团","chapter":"冠心病与原发性高血压｜ice冰冰·高分学姐团","href":"medical/cardiovascular/study-04.html"},{"book":"内科护理学","title":"测量与靶器官一起判断","summary":"规范测量并关注血压趋势、服药依从及心脑肾损害；急剧升高伴器官受累时需紧急评估。","exam":"","page":"冠心病与原发性高血压｜ice冰冰·高分学姐团","chapter":"冠心病与原发性高血压｜ice冰冰·高分学姐团","href":"medical/cardiovascular/study-04.html"},{"book":"内科护理学","title":"胸痛之外还要看血压","summary":"持续胸痛与冷汗及心电改变提示急性冠脉综合征，应迅速识别、监护和启动救治。","exam":"","page":"冠心病与原发性高血压｜ice冰冰·高分学姐团","chapter":"冠心病与原发性高血压｜ice冰冰·高分学姐团","href":"medical/cardiovascular/study-04.html"},{"book":"内科护理学","title":"稳定型心绞痛与急性冠脉综合征","summary":"诱因和发作模式相对固定；新发、加重或持续性缺血等需要迅速评估","exam":"","page":"冠心病与原发性高血压｜ice冰冰·高分学姐团","chapter":"冠心病与原发性高血压｜ice冰冰·高分学姐团","href":"medical/cardiovascular/study-04.html"},{"book":"内科护理学","title":"把判断带回患者的生活","summary":"循环护理既要守住分秒必争的生命线，也要把长期治疗变成患者能够理解和 溃疡与胃癌｜ice冰冰·高分学姐团","href":"medical/digestive/study-01.html"},{"book":"内科护理学","title":"消化症状评估","summary":"恶心、呕吐、腹痛、腹泻、黄疸及呕血黑便需结合部位、性质、时间和伴随表现定位。","exam":"","page":"消化症状与炎症性肠病｜ice冰冰·高分学姐团","chapter":"消化症状与炎症性肠病｜ice冰冰·高分学姐团","href":"medical/digestive/study-02.html"},{"book":"内科护理学","title":"先分失血与一般不适","summary":"呕血黑便要结合血压心率尿量评估灌注，腹痛则核对部位、性质和腹膜刺激征。","exam":"","page":"消化症状与炎症性肠病｜ice冰冰·高分学姐团","chapter":"消化症状与炎症性肠病｜ice冰冰·高分学姐团","href":"medical/digestive/study-02.html"},{"book":"内科护理学","title":"肠结核与结核性腹膜炎","summary":"慢性腹痛、腹泻或腹水结合结核证据判断，治疗强调规范、足疗程与营养支持。","exam":"","page":"消化症状与炎症性肠病｜ice冰冰·高分学姐团","chapter":"消化症状与炎症性肠病｜ice冰冰·高分学姐团","href":"medical/digestive/study-02.html"},{"book":"内科护理学","title":"肠道和腹膜分别看","summary":"腹痛、排便改变、腹部包块或腹水，结合结核背景及检查，关注梗阻、穿孔和营养。","exam":"","page":"消化症状与炎症性肠病｜ice冰冰·高分学姐团","chapter":"消化症状与炎症性肠病｜ice冰冰·高分学姐团","href":"medical/digestive/study-02.html"},{"book":"内科护理学","title":"炎症性肠病","summary":"溃疡性结肠炎与克罗恩病在病变范围、深度和并发症上不同，活动期关注腹泻、出血和营养。","exam":"","page":"消化症状与炎症性肠病｜ice冰冰·高分学姐团","chapter":"消化症状与炎症性肠病｜ice冰冰·高分学姐团","href":"medical/digestive/study-02.html"},{"book":"内科护理学","title":"分布和深度影响并发症","summary":"溃疡性结肠炎常连续累及结直肠黏膜；克罗恩病可节段、透壁受累，须联系瘘管和狭窄风险。","exam":"","page":"消化症状与炎症性肠病｜ice冰冰·高分学姐团","chapter":"消化症状与炎症性肠病｜ice冰冰·高分学姐团","href":"medical/digestive/study-02.html"},{"book":"内科护理学","title":"肠结核与结核性腹膜炎","summary":"前者以肠道病变及腹痛、排便改变等为线索，后者可出现腹水、腹部体征及全身结核表现。","exam":"","page":"消化症状与炎症性肠病｜ice冰冰·高分学姐团","chapter":"消化症状与炎症性肠病｜ice冰冰·高分学姐团","href":"medical/digestive/study-02.html"},{"book":"内科护理学","title":"溃疡性结肠炎和克罗恩病","summary":"连续的结直肠黏膜炎症与节段性、透壁性病变，分别影响临床表现和并发症观察。","exam":"","page":"消化症状与炎症性肠病｜ice冰冰·高分学姐团","chapter":"消化症状与炎症性肠病｜ice冰冰·高分学姐团","href":"medical/digestive/study-02.html"},{"book":"内科护理学","title":"脂肪性肝病与肝硬化","summary":"代谢、饮酒等因素可造成脂肪变和炎症；进展至肝硬化后，门静脉高压和肝功能减退又带来腹水、出血、感染与脑病风险。","exam":"","page":"脂肪性肝病、肝硬化、肝癌与肝性脑病｜ice冰冰·高分学姐团","chapter":"脂肪性肝病、肝硬化、肝癌与肝性脑病｜ice冰冰·高分学姐团","href":"medical/digestive/study-03.html"},{"book":"内科护理学","title":"从代谢或酒精走向肝损害","summary":"脂肪性肝病重在相关危 急进性与慢性肾炎","summary":"急进性肾炎肾功能恶化快，慢性肾炎则长期进展；两者监测节奏和风险不同。","exam":"","page":"急慢性肾炎、肾病综合征与尿路感染｜ice冰冰·高分学姐团","chapter":"急慢性肾炎、肾病综合征与尿路感染｜ice冰冰·高分学姐团","href":"medical/urinary/study-02.html"},{"book":"内科护理学","title":"进展速度改变紧迫性","summary":"短期肾功能快速下降需迅速评估；慢性病程重在肾功能、蛋白尿、血压及长期风险管理。","exam":"","page":"急慢性肾炎、肾病综合征与尿路感染｜ice冰冰·高分学姐团","chapter":"急慢性肾炎、肾病综合征与尿路感染｜ice冰冰·高分学姐团","href":"medical/urinary/study-02.html"},{"book":"内科护理学","title":"肾病综合征","summary":"大量蛋白尿、低蛋白血症、水肿和高脂血症构成典型组合，并伴感染与血栓风险。","exam":"","page":"急慢性肾炎、肾病综合征与尿路感染｜ice冰冰·高分学姐团","chapter":"急慢性肾炎、肾病综合征与尿路感染｜ice冰冰·高分学姐团","href":"medical/urinary/study-02.html"},{"book":"内科护理学","title":"蛋白丢失牵动多种风险","summary":"大量蛋白尿与低白蛋白血症是关键，水肿之外还须监测感染、血栓和治疗不良反应。","exam":"","page":"急慢性肾炎、肾病综合征与尿路感染｜ice冰冰·高分学姐团","chapter":"急慢性肾炎、肾病综合征与尿路感染｜ice冰冰·高分学姐团","href":"medical/urinary/study-02.html"},{"book":"内科护理学","title":"尿路感染","summary":"膀胱刺激征、发热和腰痛可提示感染部位，规范留取尿标本和完成疗程很重要。","exam":"","page":"急慢性肾炎、肾病综合征与尿路感染｜ice冰冰·高分学姐团","chapter":"急慢性肾炎、肾病综合征与尿路感染｜ice冰冰·高分学姐团","href":"medical/urinary/study-02.html"},{"book":"内科护理学","title":"下尿路与上尿路线索","summary":"尿频尿急尿痛提示尿路刺激，寒战高热、腰痛及全身不适需警惕上尿路感染和严重感染。","exam":"","page":"急慢性肾炎、肾病综合征与尿路感染｜ice冰冰·高分学姐团","chapter":"急慢性肾炎、肾病综合征与尿路感染｜ice冰冰·高分学姐团","href":"medical/urinary/study-02.html"},{"book":"内科护理学","title":"感染与血栓都是肾病综合征风险","summary":"大量蛋白丢失及治疗影响免疫和凝血平衡，观察感染、肢体肿痛、突发胸痛气促和肾功能变化。","exam":"","page":"急慢性肾炎、肾病综合征与尿路感染｜ice冰冰·高分学姐团","chapter":"急慢性肾炎、肾病综合征与尿路感染｜ice冰冰·高分学姐团","href":"medical/urinary/study-02.html"},{"book":"内科护理学","title":"急性肾损伤","summary":"短期肾功能下降可能经历少尿和恢复阶段，核心是寻找病因、维持内环境并避免进一步损伤。","exam":"","page":"急慢性肾衰竭与透析治疗｜ice冰冰·高分学姐团","chapter":"急慢性肾衰竭与透析治疗｜ice冰冰·高分学姐团","href":"medical/urinary/study-03.html"},{"book":"内科护理学","title":"急性变化不是只看尿量","summary":"结合肌酐变化、尿量、容量及病因评估，密切防范高钾、酸中毒和肺水肿。","exam":"","page":"急慢性肾衰竭与透析治疗｜ice冰冰·高分学姐团","chapter":"急慢性肾衰竭与透析治疗｜ice冰冰·高分学姐团","href":"medical/urinary/study-03.html"},{"book":"内科护理学","title":"慢性肾衰竭","summary":"长期肾单位丢失导致水电解质、酸碱、贫血和骨代谢等多系统问题。","exam":"","page":"急慢性肾衰竭与透析治疗｜ice冰冰·高分学姐团","chapter":"急慢性肾衰竭与透析治疗｜ice冰冰·高分学姐团","href":"medical/urinary/study-03.html"},{"book":"内科护理学","title":"多系统并发症要串联","summary":"除氮质血症外，还要看容量、高钾、酸碱、贫血和矿物质骨代谢异常，配合长期管理。","exam":"","page":"急慢性肾衰竭与透析治疗｜ice冰冰·高分学姐团","chapter":"急慢性肾衰竭与透析治疗｜ice冰冰·高分学姐团","href":"medical/urinary/study-03.html"},{"book":"内科护理学","title":"血液透析","summary":"透析前后评估体重、容量、血压和通路，过程中防低血压、失衡及出血等问题。","exam":"","page":"急慢性肾衰竭与透析治疗｜ice冰冰·高分学姐团","chapter":"急慢性肾衰竭与透析治疗｜ice冰冰·高分学姐团","href":"medical/urinary/study-03.html"},{"book":"内科护理学","title":"通路是生命线","summary":"保护内瘘或导管，观察震颤、杂音及感染和出血；透析过程中监测血压、症状和液体变化。","exam":"","page":"急慢性肾衰竭与透析治疗｜ice冰冰·高分学姐团","chapter":"急慢性肾衰竭与透析治疗｜ice冰冰·高分学姐团","href":"medical/urinary/study-03.html"},{"book":"内科护理学","title":"腹膜透析","summary":"腹膜作为交换膜，护理重点是无菌操作、出入液观察和腹膜炎早期识别。","exam":"","page":"急慢性肾衰竭与透析治疗｜ice冰冰·高分学姐团","chapter":"急慢性肾衰竭与透析治疗｜ice冰冰·高分学姐团","href":"medical/urinary/study-03.html"},{"book":"内科护理学","title":"流出液是观察窗口","summary":"记录进出液量、超滤、腹痛、体温和流出液清晰度，操作强调无菌与连接安全。","exam":"","page":"急慢性肾衰竭与透析治疗｜ice冰冰·高分学姐团","chapter":"急慢性肾衰竭与透析治疗｜ice冰冰·高分学姐团","href":"medical/urinary/study-03.html"},{"book":"内科护理学","title":"急性肾损伤不是“没尿才算”","summary":"肌酐变化与尿量标准共同参与识别，肾前性、肾性及肾后性原因的处理方向不同。","exam":"","page":"急慢性肾衰竭与透析治疗｜ice冰冰·高分学姐团","chapter":"急慢性肾衰竭与透析治疗｜ice冰冰·高分学姐团","href":"medical/urinary/study-03.html"},{"book":"内科护理学","title":"贫血与出血评估","summary":"出血部位、程度与贫血症状需结合血常规、凝血、红细胞形态、网织红细胞和生命体征判断。","exam":"","page":"贫血评估、缺铁性与巨幼细胞贫血｜ice冰冰·高分学姐团","chapter":"贫血评估、缺铁性与巨幼细胞贫血｜ice冰冰·高分学姐团","href":"medical/hematology/study-01.html"},{"book":"内科护理学","title":"血红蛋白与临床耐受一起看","summary":"病因、进展速度及心肺代偿影响症状，贫血严重度分层应结合单位和对象。","exam":"","page":"贫血评估、缺铁性与巨幼细胞贫血｜ice冰冰·高分学姐团","chapter":"贫血评估、缺铁性与巨幼细胞贫血｜ice冰冰·高分学姐团","href":"medical/hematology/study-01.html"},{"book":"内科护理学","title":"缺铁性与巨幼细胞贫血","summary":"缺铁重在寻找慢性失血和补铁依从性；巨幼细胞贫血需区分叶酸或维生素B12相关问题。","exam":"","page":"贫血评估、缺铁性与巨幼细胞贫血｜ice冰冰·高分学姐团","chapter":"贫血评估、缺铁性与巨幼细胞贫血｜ice冰冰·高分学姐团","href":"medical/hematology/study-01.html"},{"book":"内科护理学","title":"先辨缺什么","summary":"慢性失血是成人缺铁常见原因，补铁须同时处理失血；大细胞性贫血要考虑叶酸和维生素B₁₂。","exam":"","page":"贫血评估、缺铁性与巨幼细胞贫血｜ice冰冰·高分学姐团","chapter":"贫血评估、缺铁性与巨幼细胞贫血｜ice冰冰·高分学姐团","href":"medical/hematology/study-01.html"},{"book":"内科护理学","title":"补铁后黑便要不要停药","summary":"铁剂可以导致黑便，但不能只凭颜色排除出血。还应结合症状、循环状态及检查判断。","exam":"","page":"贫血评估、缺铁性与巨幼细胞贫血｜ice冰冰·高分学姐团","chapter":"贫血评估、缺铁性与巨幼细胞贫血｜ice冰冰·高分学姐团","href":"medical/hematology/study-01.html"},{"book":"内科护理学","title":"缺铁性贫血与巨幼细胞贫血","summary":"铁不足影响血红蛋白合成；叶酸或维生素B₁₂等不足影响DNA合成","exam":"","page":"贫血评估、缺铁性与巨幼细胞贫血｜ice冰冰·高分学姐团","chapter":"贫血评估、缺铁性与巨幼细胞贫血｜ice冰冰·高分学姐团","href":"medical/hematology/study-01.html"},{"book":"内科护理学","title":"把判断带回患者的生活","summary":"血液病护理常发生在脆弱和漫长等待之中；专业监测守住安全，人文关怀帮助患者保留希望与身份。","exam":"","page":"贫血评估、缺铁性与巨幼细胞贫血｜ice冰冰·高分学姐团","chapter":"贫血评估、缺铁性与巨幼细胞贫血｜ice冰冰·高分学姐团","href":"medical/hematology/study-01.html"},{"book":"内科护理学","title":"补铁既补储备也找失血源","summary":"成人缺铁常与慢性失血有关，口服铁剂的耐受、服用方法及疗效要持续评价。","exam":"","page":"贫血评估、缺铁性与巨幼细胞贫血｜ice冰冰·高分学姐团","chapter":"贫血评估、缺铁性与巨幼细胞贫血｜ice冰冰·高分学姐团","href":"medical/hematology/study-01.html"},{"book":"内科护理学","title":"再生障碍性贫血","summary":"骨髓造血功能衰竭导致全血细胞减少，护理核心是感染、出血与贫血风险。","exam":"","page":"再生障碍性、溶血性贫血与出血性疾病｜ice冰冰·高分学姐团","chapter":"再生障碍性、溶血性贫血与出血性疾病｜ice冰冰·高分学姐团","href":"medical/hematology/study-02.html"},{"book":"内科护理学","title":"不只红细胞受损","summary":"骨髓造血衰竭可导致全血细胞减少，同时观察贫血、感染和出血风险。","exam":"","page":"再生障碍性、溶血性贫血与出血性疾病｜ice冰冰·高分学姐团","chapter":"再生障碍性、溶血性贫血与出血性疾病｜ice冰冰·高分学姐团","href":"medical/hematology/study-02.html"},{"book":"内科护理学","title":"溶血性贫血","summary":"红细胞破坏增加可出现贫血、黄疸和相关实验室变化，护理关注诱因和急性加重。","exam":"","page":"再生障碍性、溶血性贫血与出血性疾病｜ice冰冰·高分学姐团","chapter":"再生障碍性、溶血性贫血与出血性疾病｜ice冰冰·高分学姐团","href":"medical/hematology/study-02.html"},{"book":"内科护理学","title":"破坏增加也会贫血","summary":"黄疸、贫血、脾大及溶血相关检验需联动，急性发作关注循环、尿色和肾功能。","exam":"","page":"再生障碍性、溶血性贫血与出血性疾病｜ice冰冰·高分学姐团","chapter":"再生障碍性、溶血性贫血与出血性疾病｜ice冰冰·高分学姐团","href":"medical/hematology/study-02.html"},{"book":"内科护理学","title":"血小板减少与血友病","summary":"血小板问题多见黏膜皮肤出血，凝血因子缺陷更易发生深部出血。","exam":"","page":"再生障碍性、溶血性贫血与出血性疾病｜ice冰冰·高分学姐团","chapter":"再生障碍性、溶血性贫血与出血性疾病｜ice冰冰·高分学姐团","href":"medical/hematology/study-02.html"},{"book":"内科护理学","title":"出血类型有区别","summary":"血小板问题常见皮肤黏膜出血；凝血因子缺乏可有深部组织和关节出血，应结合检查。","exam":"","page":"再生障碍性、溶血性贫血与出血性疾病｜ice冰冰·高分学姐团","chapter":"再生障碍性、溶血性贫血与出血性疾病｜ice冰冰·高分学姐团","href":"medical/hematology/study-02.html"},{"book":"内科护理学","title":"过敏性紫癜：皮肤之外","summary":"可同时出现关节、腹部和肾脏表现，观察腹痛、消化道出血和尿异常。","exam":"","page":"再生障碍性、溶血性贫血与出血性疾病｜ice冰冰·高分学姐团","chapter":"再生障碍性、溶血性贫血与出血性疾病｜ice冰冰·高分学姐团","href":"medical/hematology/study-02.html"},{"book":"内科护理学","title":"白血病","summary":"异常白血病细胞增殖抑制正常造血，造成感染、出血、贫血和浸润表现。","exam":"","page":"白血病｜ice冰冰·高分学姐团","chapter":"白血病｜ice冰冰·高分学姐团","href":"medical/hematology/study-03.html"},{"book":"内科护理学","title":"原病和治疗风险同时看","summary":"造血受抑可带来贫血、感染和出血，化疗后需额外观察骨髓抑制及肿瘤溶解等风险。","exam":"","page":"白血病｜ice冰冰·高分学姐团","chapter":"白血病｜ice冰冰·高分学姐团","href":"medical/hematology/study-03.html"},{"book":"内科护理学","title":"化疗后发热不能等","summary":"骨髓抑制期感染可迅速恶化，发热需及时评估，规范采样与治疗不能拖延。","exam":"","page":"白血病｜ice冰冰·高分学姐团","chapter":"白血病｜ice冰冰·高分学姐团","href":"medical/hematology/study-03.html"},{"book":"内科护理学","title":"原病相关风险与治疗相关风险","summary":"骨髓正常造血受抑、浸润等；骨髓抑制、感染及代谢并发症等","exam":"","page":"白血病｜ice冰冰·高分学姐团","chapter":"白血病｜ice冰冰·高分学姐团","href":"medical/hematology/study-03.html"},{"book":"内科护理学","title":"把判断带回患者的生活","summary":"血液病护理常发生在脆弱和漫长等待之中；专业监测守住安全，人文关怀帮助患者保留希望与身份。","exam":"","page":"白血病｜ice冰冰·高分学姐团","chapter":"白血病｜ice冰冰·高分学姐团","href":"medical/hematology/study-03.html"},{"book":"内科护理学","title":"急性与慢性白血病的分支","summary":"急性白血病须联系骨髓原始细胞及免疫分型等检查；慢性白血病也需按髓系或淋巴细胞等分型处理。","exam":"","page":"白血病｜ice冰冰·高分学姐团","chapter":"白血病｜ice冰冰·高分学姐团","href":"medical/hematology/study-03.html"},{"book":"内科护理学","title":"感染、出血与浸润的表现","summary":"贫血可引起乏力和活动耐量下降，血小板减少与凝血异常增加出血风险，浸润可涉及淋巴结、肝脾及其他部位。","exam":"","page":"白血病｜ice冰冰·高分学姐团","chapter":"白血病｜ice冰冰·高分学姐团","href":"medical/hematology/study-03.html"},{"book":"内科护理学","title":"弥散性血管内凝血","summary":"凝血系统广泛激活后出现微血栓与消耗性出血，是原发重症的继发表现。","exam":"","page":"DIC、淋巴瘤、骨髓瘤与造血干细胞移植｜ice冰冰·高分学姐团","chapter":"DIC、淋巴瘤、骨髓瘤与造血干细胞移植｜ice冰冰·高分学姐团","href":"medical/hematology/study-04.html"},{"book":"内科护理学","title":"血栓与出血同框","summary":"广泛凝血激活可形成微血栓并消耗凝血成分，需连续看出血、器官功能及凝血指标。","exam":"","page":"DIC、淋巴瘤、骨髓瘤与造血干细胞移植｜ice冰冰·高分学姐团","chapter":"DIC、淋巴瘤、骨髓瘤与造血干细胞移植｜ice冰冰·高分学姐团","href":"medical/hematology/study-04.html"},{"book":"内科护理学","title":"淋巴瘤与多发性骨髓瘤","summary":"无痛性淋巴结肿大和B症状提示淋巴瘤；骨痛、贫血、肾损害与高钙血症组合提示浆细胞疾病，均需病理或骨髓证据分型。","exam":"","page":"DIC、淋巴瘤、骨髓瘤与造血干细胞移植｜ice冰冰·高分学姐团","chapter":"DIC、淋巴瘤、骨髓瘤与造血干细胞移植｜ice冰冰·高分学姐团","href":"medical/hematology/study-04.html"},{"book":"内科护理学","title":"不同异常分支","summary":"无痛性淋巴结肿大及全身症状提示淋巴瘤线索；骨痛、贫血、肾损害等需考虑骨髓瘤。","exam":"","page":"DIC、淋巴瘤、骨髓瘤与造血干细胞移植｜ice冰冰·高分学姐团","chapter":"DIC、淋巴瘤、骨髓瘤与造血干细胞移植｜ice冰冰·高分学姐团","href":"medical/hematology/study-04.html"},{"book":"内科护理学","title":"造血干细胞移植与骨髓穿刺","summary":"骨髓穿刺用于细胞形态与骨髓反应评估；移植预处理后感染、出血和移植物抗宿主病风险高，需要保护性隔离和长期随访。","exam":"","page":"DIC、淋巴瘤、骨髓瘤与造血干细胞移植｜ice冰冰·高分学姐团","chapter":"DIC、淋巴瘤、骨髓瘤与造血干细胞移植｜ice冰冰·高分学姐团","href":"medical/hematology/study-04.html"},{"book":"内科护理学","title":"阶段决定护理重点","summary":"骨穿前后关注配合、出血及局部保护；移植过程需按预处理、骨髓抑制与重建阶段监测。","exam":"","page":"DIC、淋巴瘤、骨髓瘤与造血干细胞移植｜ice冰冰·高分学姐团","chapter":"DIC、淋巴瘤、骨髓瘤与造血干细胞移植｜ice冰冰·高分学姐团","href":"medical/hematology/study-04.html"},{"book":"内科护理学","title":"造血干细胞移植后的分层观察","summary":"不同阶段监测感染、出血、器官毒性和移植物抗宿主病，皮肤、消化道及肝脏变化均需结合病程。","exam":"","page":"DIC、淋巴瘤、骨髓瘤与造血干细胞移植｜ice冰冰·高分学姐团","chapter":"DIC、淋巴瘤、骨髓瘤与造血干细胞移植｜ice冰冰·高分学姐团","href":"medical/hematology/study-04.html"},{"book":"内科护理学","title":"甲状腺功能亢进","summary":"高代谢、交感兴奋及甲状腺相关表现构成主线，危象表现为高热、心动过速和意识改变等。","exam":"","page":"甲状腺功能亢进与减退｜ice冰冰·高分学姐团","chapter":"甲状腺功能亢进与减退｜ice冰冰·高分学姐团","href":"medical/endocrine-metabolic/study-01.html"},{"book":"内科护理学","title":"高代谢与用药风险","summary":"心率、体温、体重和神经精神表现帮助判断病情；用药后咽痛发热须警惕粒细胞减少。","exam":"","page":"甲状腺功能亢进与减退｜ice冰冰·高分学姐团","chapter":"甲状腺功能亢进与减退｜ice冰冰·高分学姐团","href":"medical/endocrine-metabolic/study-01.html"},{"book":"内科护理学","title":"甲状腺功能减退","summary":"低代谢表现可隐匿，黏液性水肿昏迷是严重情况，护理关注保暖、呼吸和用药。","exam":"","page":"甲状腺功能亢进与减退｜ice冰冰·高分学姐团","chapter":"甲状腺功能亢进与减退｜ice冰冰·高分学姐团","href":"medical/endocrine-metabolic/study-01.html"},{"book":"内科护理学","title":"低代谢也会危重","summary":"乏力、怕冷、反应迟缓等需结合甲功，病情重时注意低温、低通气和意识变化。","exam":"","page":"甲状腺功能亢进与减退｜ice冰冰·高分学姐团","chapter":"甲状腺功能亢进与减退｜ice冰冰·高分学姐团","href":"medical/endocrine-metabolic/study-01.html"},{"book":"内科护理学","title":"抗甲状腺药后的咽痛发热","summary":"抗甲状腺药可能引起粒细胞减少；发热咽痛是重要报告信号，不能仅归于甲亢本身。","exam":"","page":"甲状腺功能亢进与减退｜ice冰冰·高分学姐团","chapter":"甲状腺功能亢进与减退｜ice冰冰·高分学姐团","href":"medical/endocrine-metabolic/study-01.html"},{"book":"内科护理学","title":"甲亢与甲减","summary":"高代谢和交感兴奋相关表现；低代谢、反应减慢等表现","exam":"","page":"甲状腺功能亢进与减退｜ice冰冰·高分学姐团","chapter":"甲状腺功能亢进与减退｜ice冰冰·高分学姐团","href":"medical/endocrine-metabolic/study-01.html"},{"book":"内科护理学","title":"把判断带回患者的生活","summary":"代谢病护理不是监督患者‘听不听话’，而是帮助患者理解身体、面对波动并建立可以长期坚持的选择。","exam":"","page":"甲状腺功能亢进与减退｜ice冰冰·高分学姐团","chapter":"甲状腺功能亢进与减退｜ice冰冰·高分学姐团","href":"medical/endocrine-metabolic/study-01.html"},{"book":"内科护理学","title":"突眼与眼表保护","summary":"甲亢相关眼病可影响闭眼和角膜保护，评估眼部不适、视力与暴露情况并配合护理。","exam":"","page":"甲状腺功能亢进与减退｜ice冰冰·高分学姐团","chapter":"甲状腺功能亢进与减退｜ice冰冰·高分学姐团","href":"medical/endocrine-metabolic/study-01.html"},{"book":"内科护理学","title":"内分泌评估与腺垂体功能减退","summary":"体形、生殖、营养、血压、排泄、疲乏和骨骼变化帮助判断激素过多还是不足；腺垂体多轴功能减退常先出现性腺功能减退，并可伴低血压和低血糖。","exam":"","page":"腺垂体与肾上腺疾病｜ice冰冰·高分学姐团","chapter":"腺垂体与肾上腺疾病｜ice冰冰·高分学姐团","href":"medical/endocrine-metabolic/study-02.html"},{"book":"内科护理学","title":"激素轴连同靶腺看","summary":"综合体型、血压、代谢、月经或性功能等表现，检查解释需考虑激素轴的相互反馈。","exam":"","page":"腺垂体与肾上腺疾病｜ice冰冰·高分学姐团","chapter":"腺垂体与肾上腺疾病｜ice冰冰·高分学姐团","href":"medical/endocrine-metabolic/study-02.html"},{"book":"内科护理学","title":"库欣综合征","summary":"皮质醇过多造成向心性肥胖、皮肤改变、高血压、糖代谢和感染风险。","exam":"","page":"腺垂体与肾上腺疾病｜ice冰冰·高分学姐团","chapter":"腺垂体与肾上腺疾病｜ice冰冰·高分学姐团","href":"medical/endocrine-metabolic/study-02.html"},{"book":"内科护理学","title":"高皮质醇的全身作用","summary":"向心性肥胖、皮肤紫纹、高血压及糖代谢异常需串联，同时警惕感染、骨质疏松和低钾等。","exam":"","page":"腺垂体与肾上腺疾病｜ice冰冰·高分学姐团","chapter":"腺垂体与肾上腺疾病｜ice冰冰·高分学姐团","href":"medical/endocrine-metabolic/study-02.html"},{"book":"内科护理学","title":"肾上腺皮质功能减退","summary":"皮质激素不足可致乏力、低血压和电解质异常，应激时可能发生危象。","exam":"","page":"腺垂体与肾上腺疾病｜ice冰冰·高分学姐团","chapter":"腺垂体与肾上腺疾病｜ice冰冰·高分学姐团","href":"medical/endocrine-metabolic/study-02.html"},{"book":"内科护理学","title":"替代和应激要连续","summary":"疲乏、低血压及内环境改变结合激素检查判断，感染、手术及骤停治疗可诱发危象。","exam":"","page":"腺垂体与肾上腺疾病｜ice冰冰·高分学姐团","chapter":"腺垂体与肾上腺疾病｜ice冰冰·高分学姐团","href":"medical/endocrine-metabolic/study-02.html"},{"book":"内科护理学","title":"嗜铬细胞瘤","summary":"儿茶酚胺阵发释放可出现突发高血压、心悸、头痛和出汗。","exam":"","page":"腺垂体与肾上腺疾病｜ice冰冰·高分学姐团","chapter":"腺垂体与肾上腺疾病｜ice冰冰·高分学姐团","href":"medical/endocrine-metabolic/study-02.html"},{"book":"内科护理学","title":"阵发性血压变化","summary":"头痛、多汗、心悸与阵发或持续高血压组合有提示价值，操作和情绪刺激可诱发恶化。","exam":"","page":"腺垂体与肾上腺疾病｜ice冰冰·高分学姐团","chapter":"腺垂体与肾上腺疾病｜ice冰冰·高分学姐团","href":"medical/endocrine-metabolic/study-02.html"},{"book":"内科护理学","title":"糖尿病","summary":"长期高血糖带来急性代谢危象与慢性血管神经并发症，管理依赖监测、用药、饮食、运动和教育。","exam":"","page":"糖尿病｜ice冰冰·高分学姐团","chapter":"糖尿病｜ice冰冰·高分学姐团","href":"medical/endocrine-metabolic/study-03.html"},{"book":"内科护理学","title":"监测连接进餐用药活动","summary":"血糖变化要联系用药、进餐、活动和感染；区分低血糖、酮症酸中毒及高渗状态的临床线索。","exam":"","page":"糖尿病｜ice冰冰·高分学姐团","chapter":"糖尿病｜ice冰冰·高分学姐团","href":"medical/endocrine-metabolic/study-03.html"},{"book":"内科护理学","title":"出汗手抖后突然嗜睡","summary":"用药、延迟进餐与交感兴奋症状构成低血糖线索，应尽快核实并处理。","exam":"","page":"糖尿病｜ice冰冰·高分学姐团","chapter":"糖尿病｜ice冰冰·高分学姐团","href":"medical/endocrine-metabolic/study-03.html"},{"book":"内科护理学","title":"低血糖与酮症酸中毒或高渗状态","summary":"常与用药、进餐和活动不匹配有关；高血糖与脱水、酸碱或渗透异常等","exam":"","page":"糖尿病｜ice冰冰·高分学姐团","chapter":"糖尿病｜ice冰冰·高分学姐团","href":"medical/endocrine-metabolic/study-03.html"},{"book":"内科护理学","title":"把判断带回患者的生活","summary":"代谢病护理不是监督患者‘听不听话’，而是帮助患者理解身体、面对波动并建立可以长期坚持的选择。","exam":"","page":"糖尿病｜ice冰冰·高分学姐团","chapter":"糖尿病｜ice冰冰·高分学姐团","href":"medical/endocrine-metabolic/study-03.html"},{"book":"内科护理学","title":"DKA与HHS关注的证据不同","summary":"DKA联系酮体和代谢性酸中毒，HHS联系高渗与明显脱水；都须动态监测循环、意识、电解质和肾功能。","exam":"","page":"糖尿病｜ice冰冰·高分学姐团","chapter":"糖尿病｜ice冰冰·高分学姐团","href":"medical/endocrine-metabolic/study-03.html"},{"book":"内科护理学","title":"糖尿病足从每天检查开始","summary":"观察皮肤、感觉、足部血供和损伤，落实合适鞋袜、日常检查及伤口及时处理。","exam":"","page":"糖尿病｜ice冰冰·高分学姐团","chapter":"糖尿病｜ice冰冰·高分学姐团","href":"medical/endocrine-metabolic/study-03.html"},{"book":"内科护理学","title":"肥胖症与血脂异常","summary":"肥胖与血脂异常共同增加动脉粥样硬化、糖尿病和心血管风险，管理需结合饮食、运动、行为目标与必要药物。","exam":"","page":"肥胖、血脂、尿酸与骨代谢异常｜ice冰冰·高分学姐团","chapter":"肥胖、血脂、尿酸与骨代谢异常｜ice冰冰·高分学姐团","href":"medical/endocrine-metabolic/study-04.html"},{"book":"内科护理学","title":"长期风险大于一次数字","summary":"以体重、腰围、饮食活动及心血管风险进行综合管理，用药监测疗效和不良反应。","exam":"","page":"肥胖、血脂、尿酸与骨代谢异常｜ice冰冰·高分学姐团","chapter":"肥胖、血脂、尿酸与骨代谢异常｜ice冰冰·高分学姐团","href":"medical/endocrine-metabolic/study-04.html"},{"book":"内科护理学","title":"高尿酸血症与痛风","summary":"尿酸沉积引起急性关节炎及长期器官风险，急性期和长期降尿酸管理目标不同。","exam":"","page":"肥胖、血脂、尿酸与骨代谢异常｜ice冰冰·高分学姐团","chapter":"肥胖、血脂、尿酸与骨代谢异常｜ice冰冰·高分学姐团","href":"medical/endocrine-metabolic/study-04.html"},{"book":"内科护理学","title":"急性抗炎与长期降尿酸","summary":"急性红肿热痛先处理炎症和关节保护；长期管理联系尿酸、肾功能、饮食及药物。","exam":"","page":"肥胖、血脂、尿酸与骨代谢异常｜ice冰冰·高分学姐团","chapter":"肥胖、血脂、尿酸与骨代谢异常｜ice冰冰·高分学姐团","href":"medical/endocrine-metabolic/study-04.html"},{"book":"内科护理学","title":"骨质疏松症","summary":"骨量和骨质量下降使脆性骨折风险增加，预防结合营养、负重活动、跌倒管理与药物。","exam":"","page":"肥胖、血脂、尿酸与骨代谢异常｜ice冰冰·高分学姐团","chapter":"肥胖、血脂、尿酸与骨代谢异常｜ice冰冰·高分学姐团","href":"medical/endocrine-metabolic/study-04.html"},{"book":"内科护理学","title":"防骨折与骨量管理","summary":"结合骨密度、骨折史及风险因素，落实营养、适当负重训练与防跌倒。","exam":"","page":"肥胖、血脂、尿酸与骨代谢异常｜ice冰冰·高分学姐团","chapter":"肥胖、血脂、尿酸与骨代谢异常｜ice冰冰·高分学姐团","href":"medical/endocrine-metabolic/study-04.html"},{"book":"内科护理学","title":"骨折预防不只是一项补充剂","summary":"骨密度和骨折风险要连同年龄、既往骨折、药物及跌倒风险判断，合理运动与环境安全同样重要。","exam":"","page":"肥胖、血脂、尿酸与骨代谢异常｜ice冰冰·高分学姐团","chapter":"肥胖、血脂、尿酸与骨代谢异常｜ice冰冰·高分学姐团","href":"medical/endocrine-metabolic/study-04.html"},{"book":"内科护理学","title":"风湿症状评估","summary":"关节疼痛肿胀、晨僵、活动受限和皮肤损害要看分布、持续时间、对称性与系统受累。","exam":"","page":"风湿症状评估与系统性红斑狼疮｜ice冰冰·高分学姐团","chapter":"风湿症状评估与系统性红斑狼疮｜ice冰冰·高分学姐团","href":"medical/rheumatology/study-01.html"},{"book":"内科护理学","title":"活动度与功能分开评估","summary":"关节疼痛肿胀、晨僵、肌力和皮肤改变要连同器官受累及治疗史观察。","exam":"","page":"风湿症状评估与系统性红斑狼疮｜ice冰冰·高分学姐团","chapter":"风湿症状评估与系统性红斑狼疮｜ice冰冰·高分学姐团","href":"medical/rheumatology/study-01.html"},{"book":"内科护理学","title":"系统性红斑狼疮","summary":"从蝶形红斑、光敏和多系统受累进入诊断，结合自身抗体与补体判断；治疗同时管理感染、药物不良反应、妊娠计划和长期防晒复诊。","exam":"","page":"风湿症状评估与系统性红斑狼疮｜ice冰冰·高分学姐团","chapter":"风湿症状评估与系统性红斑狼疮｜ice冰冰·高分学姐团","href":"medical/rheumatology/study-01.html"},{"book":"内科护理学","title":"多器官与免疫治疗","summary":"皮肤、关节、肾脏、血液及神经表现可并存，护理兼顾防晒、感染观察和器官监测。","exam":"","page":"风湿症状评估与系统性红斑狼疮｜ice冰冰·高分学姐团","chapter":"风湿症状评估与系统性红斑狼疮｜ice冰冰·高分学姐团","href":"medical/rheumatology/study-01.html"},{"book":"内科护理学","title":"晒太阳后的新症状","summary":"SLE可累及多器官。皮肤改变之外，尿异常、水肿和肾功能需纳入评估。","exam":"","page":"风湿症状评估与系统性红斑狼疮｜ice冰冰·高分学姐团","chapter":"风湿症状评估与系统性红斑狼疮｜ice冰冰·高分学姐团","href":"medical/rheumatology/study-01.html"},{"book":"内科护理学","title":"狼疮活动与感染","summary":"原病的免疫炎症及器官变化；可在免疫抑制治疗中出现或加重","exam":"","page":"风湿症状评估与系统性红斑狼疮｜ice冰冰·高分学姐团","chapter":"风湿症状评估与系统性红斑狼疮｜ice冰冰·高分学姐团","href":"medical/rheumatology/study-01.html"},{"book":"内科护理学","title":"把判断带回患者的生活","summary":"风湿病的痛苦常被外人低估；护理要看见疼痛、疲乏、形象和角色变化，帮助患者保存功能与尊严。","exam":"","page":"风湿症状评估与系统性红斑狼疮｜ice冰冰·高分学姐团","chapter":"风湿症状评估与系统性红斑狼疮｜ice冰冰·高分学姐团","href":"medical/rheumatology/study-01.html"},{"book":"内科护理学","title":"强直性脊柱炎","summary":"炎性腰背痛和中轴关节受累可导致活动受限；治疗、伸展、姿势与呼吸训练应在同一条长期管理线上。","exam":"","page":"强直性脊柱炎、类风湿关节炎与炎症性肌病｜ice冰冰·高分学姐团","chapter":"强直性脊柱炎、类风湿关节炎与炎症性肌病｜ice冰冰·高分学姐团","href":"medical/rheumatology/study-02.html"},{"book":"内科护理学","title":"炎性腰背痛与姿势","summary":"慢性腰背痛、晨僵及活动受限需结合骶髂关节等检查，注意姿势与适当功能训练。","exam":"","page":"强直性脊柱炎、类风湿关节炎与炎症性肌病｜ice冰冰·高分学姐团","chapter":"强直性脊柱炎、类风湿关节炎与炎症性肌病｜ice冰冰·高分学姐团","href":"medical/rheumatology/study-02.html"},{"book":"内科护理学","title":"类风湿关节炎","summary":"对称性小关节炎、晨僵和慢性侵蚀可造成畸形；药物控制炎症、急性期关节保护和稳定期功能训练应合并掌握。","exam":"","page":"强直性脊柱炎、类风湿关节炎与炎症性肌病｜ice冰冰·高分学姐团","chapter":"强直性脊柱炎、类风湿关节炎与炎症性肌病｜ice冰冰·高分学姐团","href":"medical/rheumatology/study-02.html"},{"book":"内科护理学","title":"保护关节仍要维护功能","summary":"对称性小关节炎、晨僵和功能障碍是线索，急性炎症期保护，稳定后规律适度活动。","exam":"","page":"强直性脊柱炎、类风湿关节炎与炎症性肌病｜ice冰冰·高分学姐团","chapter":"强直性脊柱炎、类风湿关节炎与炎症性肌病｜ice冰冰·高分学姐团","href":"medical/rheumatology/study-02.html"},{"book":"内科护理学","title":"特发性炎症性肌病","summary":"近端肌无力、皮肤表现和吞咽或呼吸肌受累构成重点风险。","exam":"","page":"强直性脊柱炎、类风湿关节炎与炎症性肌病｜ice冰冰·高分学姐团","chapter":"强直性脊柱炎、类风湿关节炎与炎症性肌病｜ice冰冰·高分学姐团","href":"medical/rheumatology/study-02.html"},{"book":"内科护理学","title":"肌无力不只是关节痛","summary":"对称性近端肌无力、肌酶及皮肤表现帮助判断，吞咽和呼吸肌受累须及时识别。","exam":"","page":"强直性脊柱炎、类风湿关节炎与炎症性肌病｜ice冰冰·高分学姐团","chapter":"强直性脊柱炎、类风湿关节炎与炎症性肌病｜ice冰冰·高分学姐团","href":"medical/rheumatology/study-02.html"},{"book":"内科护理学","title":"改善病情药物与止痛药","summary":"止痛和炎症症状缓解不等于疾病进展已受控，免疫及改善病情治疗须按方案监测血象、肝肾功能和感染。","exam":"","page":"强直性脊柱炎、类风湿关节炎与炎症性肌病｜ice冰冰·高分学姐团","chapter":"强直性脊柱炎、类风湿关节炎与炎症性肌病｜ice冰冰·高分学姐团","href":"medical/rheumatology/study-02.html"},{"book":"内科护理学","title":"神经症状定位","summary":"头痛、眩晕、意识、认知、言语、感觉和运动异常需结合起病时间、侧别与神经通路定位。","exam":"","page":"神经症状定位、TIA与脑梗死｜ice冰冰·高分学姐团","chapter":"神经症状定位、TIA与脑梗死｜ice冰冰·高分学姐团","href":"medical/neurology/study-01.html"},{"book":"内科护理学","title":"意识语言运动分别记录","summary":"先分意识水平，再看语言、脑神经、感觉、肌力及协调；连续变化有助定位和预警。","exam":"","page":"神经症状定位、TIA与脑梗死｜ice冰冰·高分学姐团","chapter":"神经症状定位、TIA与脑梗死｜ice冰冰·高分学姐团","href":"medical/neurology/study-01.html"},{"book":"内科护理学","title":"短暂性脑缺血发作","summary":"局灶性神经功能缺损短暂出现并恢复，是卒中高风险预警，需要尽快评估。","exam":"","page":"神经症状定位、TIA与脑梗死｜ice冰冰·高分学姐团","chapter":"神经症状定位、TIA与脑梗死｜ice冰冰·高分学姐团","href":"medical/neurology/study-01.html"},{"book":"内科护理学","title":"短暂不等于安全","summary":"局灶性症状短暂缓解仍需及时评估血管风险，记录发作表现和时间并落实二级预防。","exam":"","page":"神经症状定位、TIA与脑梗死｜ice冰冰·高分学姐团","chapter":"神经症状定位、TIA与脑梗死｜ice冰冰·高分学姐团","href":"medical/neurology/study-01.html"},{"book":"内科护理学","title":"脑梗死","summary":"突发局灶性缺损与缺血相关，发病时间、影像和禁忌决定再灌注路径。","exam":"","page":"神经症状定位、TIA与脑梗死｜ice冰冰·高分学姐团","chapter":"神经症状定位
