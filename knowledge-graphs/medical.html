</style></head><body><main class="wrap"><header class="hero"><small>ICE冰冰·高分学姐团｜全书关系图</small><h1>内科护理学知识点关系图</h1><p>从疾病概念出发，查看病理机制、临床数值、判断情境与护理边界。</p></header><nav class="course-nav"><a href="fundamentals.html" class="">基础护理</a><a href="introduction.html" class="">护理导论</a><a href="medical.html" class="on">内科护理</a><a href="surgical.html" class="">外科护理</a></nav><div class="tabs" id="quick"></div><div class="map-select"><input id="searchMap" placeholder="搜中心概念、章节或参数"><select id="mapPick" aria-label="选择知识图谱"></select></div><section class="layout"><div class="panel"><h2 id="mapTitle"></h2><p class="sub">点选分支查看数值、用途、条件、安全边界和教材依据。</p><svg class="map" id="graph" viewBox="0 0 720 468" role="img" aria-label="内科护理学中心概念关系图"></svg><div class="pager"><button id="prev">‹ 上一组</button><span id="pageText"></span><button id="next">下一组 ›</button></div><div class="legend"><span><i class="dot"></i>中心概念</span><span><i class="dot2"></i>关键参数 / 关联考点</span><span><i class="dot3"></i>安全边界</span><span><i class="dot4"></i>跨章节联系</span></div></div><aside class="panel detail" id="detail"></aside></section><p class="footer">数值节点保留页面整理中的原值、条件和教材页码；不凭空补数。跨章节联系按共同主题词推荐，复习时可打开来源章节核对。</p></main><script>
const MAPS=[{"id":"medical/introduction/study-01.html","label":"内科护理总论","title":"以“内科护理总论”为中心｜用途、数值与跨章联系","center":"内科护理总论","chapter":"内科护理总论｜ice冰冰·高分学姐团","href":"medical/introduction/study-01.html","items":[{"type":"concept","label":"内科护理总论","tag":"关联考点","detail":"以内科疾病患者为对象，用护理程序把疾病证据、患者反应、治疗安全和连续照护连成完整判断链。","ref":"内科护理总论｜ice冰冰·高分学姐团","chapter":"内科护理总论｜ice冰冰·高分学姐团","href":"medical/introduction/study-01.html","kind":"normal","relation":""},{"type":"concept","label":"护理程序要循环","tag":"关联考点","detail":"评估资料后识别护理问题，与患者共同确定可观察的目标，再实施和评价。评价不达标要回到原因和计划，不能只勾选“已宣教”。","ref":"内科护理总论｜ice冰冰·高分学姐团","chapter":"内科护理总论｜ice冰冰·高分学姐团","href":"medical/introduction/study-01.html","kind":"safe","relation":""},{"type":"concept","label":"三种病，一张可执行清单","tag":"关联考点","detail":"复述与演示能发现真实理解和执行障碍。教育还须回应费用、生活安排及家庭支持。","ref":"内科护理总论｜ice冰冰·高分学姐团","chapter":"内科护理总论｜ice冰冰·高分学姐团","href":"medical/introduction/study-01.html","kind":"normal","relation":""},{"type":"concept","label":"疾病诊断与护理诊断","tag":"关联考点","detail":"描述疾病本身及病理过程；描述患者对健康问题的反应","ref":"内科护理总论｜ice冰冰·高分学姐团","chapter":"内科护理总论｜ice冰冰·高分学姐团","href":"medical/introduction/study-01.html","kind":"normal","relation":""},{"type":"concept","label":"把判断带回患者的生活","tag":"关联考点","detail":"内科护理的价值常常不在一次操作，而在于陪一个人把疾病重新放回生活中，使治疗真正可持续。","ref":"内科护理总论｜ice冰冰·高分学姐团","chapter":"内科护理总论｜ice冰冰·高分学姐团","href":"medical/introduction/study-01.html","kind":"normal","relation":""},{"type":"concept","label":"成人健康与连续照护","tag":"关联考点","detail":"疾病管理同时关注功能、生活方式、心理社会处境和可获得的支持；以共同目标连接住院、门诊和家庭随访。","ref":"内科护理总论｜ice冰冰·高分学姐团","chapter":"内科护理总论｜ice冰冰·高分学姐团","href":"medical/introduction/study-01.html","kind":"normal","relation":""},{"type":"cross","label":"体重变化警示","tag":"跨章节数值 · 心力衰竭","detail":"体重变化警示：3天内增加＞2 kg。适用条件与安全边界：相同时间、衣着和体重计测量；提示可能水钠潴留，结合症状及时评估。","ref":"教材 P146","chapter":"心力衰竭｜ice冰冰·高分学姐团","href":"medical/cardiovascular/heart-failure.html","kind":"cross"},{"type":"cross","label":"脑水肿高峰","tag":"跨章节数值 · 神经系统 · 脑出血","detail":"脑水肿高峰：出血后约48小时达高峰。适用条件与安全边界：颅内压进一步升高并诱发脑疝；连续评估意识、瞳孔、生命体征、呕吐和肢体变化","ref":"教材P631—633","chapter":"神经系统｜脑出血｜内科护理学第7版","href":"medical/neurology/section-04.html","kind":"cross"},{"type":"cross","label":"常见症状评估","tag":"跨章节 · 呼吸系统症状与感染性疾病","detail":"咳嗽、痰液、呼吸困难和咯血要结合起病方式、诱因、量、颜色及伴随表现判断。","ref":"呼吸系统症状与感染性疾病｜ice冰冰·高分学姐团","chapter":"呼吸系统症状与感染性疾病｜ice冰冰·高分学姐团","href":"medical/respiratory/study-01.html","kind":"cross","relation":"评估"},{"type":"cross","label":"急性呼吸道感染","tag":"跨章节 · 呼吸系统症状与感染性疾病","detail":"多数上呼吸道感染重在对症支持；高热、气促或持续加重提示需重新评估。","ref":"呼吸系统症状与感染性疾病｜ice冰冰·高分学姐团","chapter":"呼吸系统症状与感染性疾病｜ice冰冰·高分学姐团","href":"medical/respiratory/study-01.html","kind":"cross","relation":"评估"},{"type":"cross","label":"支气管哮喘","tag":"跨章节 · 支气管扩张、肺结核与支气管哮喘","detail":"可变性气流受限与气道高反应性相关，急性发作先评估严重度并快速改善通气。","ref":"支气管扩张、肺结核与支气管哮喘｜ice冰冰·高分学姐团","chapter":"支气管扩张、肺结核与支气管哮喘｜ice冰冰·高分学姐团","href":"medical/respiratory/study-02.html","kind":"cross","relation":"评估"}]},{"id":"medical/respiratory/study-01.html","label":"呼吸系统症状与感染性疾病","title":"以“呼吸系统症状与感染性疾病”为中心｜用途、数值与跨章联系","center":"呼吸系统症状与感染性疾病","chapter":"呼吸系统症状与感染性疾病｜ice冰冰·高分学姐团","href":"medical/respiratory/study-01.html","items":[{"type":"concept","label":"常见症状评估","tag":"关联考点","detail":"咳嗽、痰液、呼吸困难和咯血要结合起病方式、诱因、量、颜色及伴随表现判断。","ref":"呼吸系统症状与感染性疾病｜ice冰冰·高分学姐团","chapter":"呼吸系统症状与感染性疾病｜ice冰冰·高分学姐团","href":"medical/respiratory/study-01.html","kind":"normal","relation":""},{"type":"concept","label":"咯血先防窒息","tag":"关联考点","detail":"观察出血量、速度、咳出能力、意识与呼吸。大量出血且不能咳出时，气道威胁优先于常规排痰训练。","ref":"呼吸系统症状与感染性疾病｜ice冰冰·高分学姐团","chapter":"呼吸系统症状与感染性疾病｜ice冰冰·高分学姐团","href":"medical/respiratory/study-01.html","kind":"safe","relation":""},{"type":"concept","label":"急性呼吸道感染","tag":"关联考点","detail":"多数上呼吸道感染重在对症支持；高热、气促或持续加重提示需重新评估。","ref":"呼吸系统症状与感染性疾病｜ice冰冰·高分学姐团","chapter":"呼吸系统症状与感染性疾病｜ice冰冰·高分学姐团","href":"medical/respiratory/study-01.html","kind":"normal","relation":""},{"type":"concept","label":"不是每次咳嗽都用抗菌药","tag":"关联考点","detail":"根据感染部位、全身情况及病原线索判断，观察发热、气促和症状持续变化。","ref":"呼吸系统症状与感染性疾病｜ice冰冰·高分学姐团","chapter":"呼吸系统症状与感染性疾病｜ice冰冰·高分学姐团","href": r/study-01.html","items":[{"type":"concept","label":"循环症状线索","tag":"关联考点","detail":"心源性呼吸困难、水肿、胸痛、心悸和晕厥要结合活动关系、体位、持续时间与血流动力学判断。","ref":"循环症状、慢性心力衰竭与心肌疾病｜ice冰冰·高分学姐团","chapter":"循环症状、慢性心力衰竭与心肌疾病｜ice冰冰·高分学姐团","href":"medical/cardiovascular/study-01.html","kind":"normal","relation":""},{"type":"concept","label":"胸痛要连时间与状态","tag":"关联考点","detail":"记录部位、性质、持续时间、诱因和伴随的呼吸及循环变化，突发晕厥须关注有效灌注。","ref":"循环症状、慢性心力衰竭与心肌疾病｜ice冰冰·高分学姐团","chapter":"循环症状、慢性心力衰竭与心肌疾病｜ice冰冰·高分学姐团","href":"medical/cardiovascular/study-01.html","kind":"normal","relation":""},{"type":"concept","label":"慢性心力衰竭","tag":"关联考点","detail":"心排出量下降和容量负荷增加导致呼吸困难、水肿与乏力，护理重在容量、症状、用药和自我监测。","ref":"循环症状、慢性心力衰竭与心肌疾病｜ice冰冰·高分学姐团","chapter":"循环症状、慢性心力衰竭与心肌疾病｜ice冰冰·高分学姐团","href":"medical/cardiovascular/study-01.html","kind":"safe","relation":""},{"type":"concept","label":"淤血和低灌注并存","tag":"关联考点","detail":"肺循环淤血表现与体循环水肿要分别定位，低心排可同时造成乏力、少尿及灌注下降。","ref":"循环症状、慢性心力衰竭与心肌疾病｜ice冰冰·高分学姐团","chapter":"循环症状、慢性心力衰竭与心肌疾病｜ice冰冰·高分学姐团","href":"medical/cardiovascular/study-01.html","kind":"normal","relation":""},{"type":"concept","label":"心肌疾病","tag":"关联考点","detail":"扩张、肥厚等结构异常造成不同的泵血或流出道问题，护理要识别心衰、心律失常和猝死风险。","ref":"循环症状、慢性心力衰竭与心肌疾病｜ice冰冰·高分学姐团","chapter":"循环症状、慢性心力衰竭与心肌疾病｜ice冰冰·高分学姐团","href":"medical/cardiovascular/study-01.html","kind":"safe","relation":""},{"type":"concept","label":"心肌病与心肌炎不要混","tag":"关联考点","detail":"扩张型以心腔扩大和收缩受损等表现为线索；感染后心悸心律异常须考虑心肌炎。","ref":"循环症状、慢性心力衰竭与心肌疾病｜ice冰冰·高分学姐团","chapter":"循环症状、慢性心力衰竭与心肌疾病｜ice冰冰·高分学姐团","href":"medical/cardiovascular/study-01.html","kind":"normal","relation":""},{"type":"cross","label":"氧疗适用条件","tag":"跨章节数值 · 心力衰竭","detail":"氧疗适用条件：SpO₂＜90%。适用条件与安全边界：慢性心衰伴低氧血症时考虑氧疗；不是所有心衰患者常规吸氧。","ref":"教材 P144","chapter":"心力衰竭｜ice冰冰·高分学姐团","href":"medical/cardiovascular/heart-failure.html","kind":"cross"},{"type":"cross","label":"液体入量","tag":"跨章节数值 · 心力衰竭","detail":"液体入量：1.5—2.0 L/d。适用条件与安全边界：教材慢性心衰体液管理范围；按充血、灌注、肾功能和个体医嘱调整。","ref":"教材 P145","chapter":"心力衰竭｜ice冰冰·高分学姐团","href":"medical/cardiovascular/heart-failure.html","kind":"cross"},{"type":"cross","label":"常见症状评估","tag":"跨章节 · 呼吸系统症状与感染性疾病","detail":"咳嗽、痰液、呼吸困难和咯血要结合起病方式、诱因、量、颜色及伴随表现判断。","ref":"呼吸系统症状与感染性疾病｜ice冰冰·高分学姐团","chapter":"呼吸系统症状与感染性疾病｜ice冰冰·高分学姐团","href":"medical/respiratory/study-01.html","kind":"cross","relation":"呼吸"},{"type":"cross","label":"咯血先防窒息","tag":"跨章节 · 呼吸系统症状与感染性疾病","detail":"观察出血量、速度、咳出能力、意识与呼吸。大量出血且不能咳出时，气道威胁优先于常规排痰训练。","ref":"呼吸系统症状与感染性疾病｜ice冰冰·高分学姐团","chapter":"呼吸系统症状与感染性疾病｜ice冰冰·高分学姐团","href":"medical/respiratory/study-01.html","kind":"cross","relation":"呼吸"},{"type":"cross","label":"急性呼吸道感染","tag":"跨章节 · 呼吸系统症状与感染性疾病","detail":"多数上呼吸道感染重在对症支持；高热、气促或持续加重提示需重新评估。","ref":"呼吸系统症状与感染性疾病｜ice冰冰·高分学姐团","chapter":"呼吸系统症状与感染性疾病｜ice冰冰·高分学姐团","href":"medical/respiratory/study-01.html","kind":"cross","relation":"感染 / 呼吸"}]},{"id":"medical/cardiovascular/study-02.html","label":"急性心力衰竭、心律失常与心脏骤停","title":"以“急性心力衰竭、心律失常与心脏骤停”为中心｜用途、数值与跨章联系","center":"急性心力衰竭、心律失常与心脏骤停","chapter":"急性心力衰竭、心律失常与心脏骤停｜ice冰冰·高分学姐团","href":"medical/cardiovascular/study-02.html","items":[{"type":"concept","label":"急性心力衰竭","tag":"关联考点","detail":"突发严重呼吸困难、端坐呼吸和肺水肿表现需立即减轻心肺负荷并改善氧合。","ref":"急性心力衰竭、心律失常与心脏骤停｜ice冰冰·高分学姐团","chapter":"急性心力衰竭、心律失常与心脏骤停｜ice冰冰·高分学姐团","href":"medical/cardiovascular/study-02.html","kind":"normal","relation":""},{"type":"concept","label":"体位不能脱离血压","tag":"关联考点","detail":"粉红色泡沫痰、急性喘憋提示急性肺水肿；出现低血压、湿冷和意识改变要重新评估循环。","ref":"急性心力衰竭、心律失常与心脏骤停｜ice冰冰·高分学姐团","chapter":"急性心力衰竭、心律失常与心脏骤停｜ice冰冰·高分学姐团","href":"medical/cardiovascular/study-02.html","kind":"normal","relation":""},{"type":"concept","label":"心律失常与器械介入治疗","tag":"关联考点","detail":"判断心律失常既看心电图类型，也看血流动力学是否稳定；电复律、起搏器和射频消融还要连同适应证、术前准备、术后心律、穿刺处及设备安全一起掌握。","ref":"急性心力衰竭、心律失常与心脏骤停｜ice冰冰·高分学姐团","chapter":"急性心力衰竭、心律失常与心脏骤停｜ice冰冰·高分学姐团","href":"medical/cardiovascular/study-02.html","kind":"normal","relation":""},{"type":"concept","label":"节律与血流动力学双判断","tag":"关联考点","detail":"识别节律后立即看有效脉搏、血压、意识及胸痛。器械治疗后还须看穿刺部位、节律及设备安全。","ref":"急性心力衰竭、心律失常与心脏骤停｜ice冰冰·高分学姐团","chapter":"急性心力衰竭、心律失常与心脏骤停｜ice冰冰·高分学姐团","href":"medical/cardiovascular/study-02.html","kind":"normal","relation":""},{"type":"concept","label":"心脏骤停","tag":"关联考点","detail":"无反应、无正常呼吸和无循环征象时立即启动高质量复苏与除颤流程。","ref":"急性心力衰竭、心律失常与心脏骤停｜ice冰冰·高分学姐团","chapter":"急性心力衰竭、心律失常与心脏骤停｜ice冰冰·高分学姐团","href":"medical/cardiovascular/study-02.html","kind":"normal","relation":""},{"type":"concept","label":"识别后立即启动救治","tag":"关联考点","detail":"无反应、无正常呼吸及无有效脉搏时迅速呼救，实施高质量复苏并尽快使用AED。","ref":"急性心力衰竭、心律失常与心脏骤停｜ice冰冰·高分学姐团","chapter":"急性心力衰竭、心律失常与心脏骤停｜ice冰冰·高分学姐团","href":"medical/cardiovascular/study-02.html","kind":"normal","relation":""},{"type":"concept","label":"房颤、早搏与快速心律","tag":"关联考点","detail":"房颤常无规律P波且心室律绝对不齐；早搏是提前出现的激动，需按形态与来源判断。","ref":"急性心力衰竭、心律失常与心脏骤停｜ice冰冰·高分学姐团","chapter":"急性心力衰竭、心律失常与心脏骤停｜ice冰冰·高分学姐团","href":"medical/cardiovascular/study-02.html","kind":"normal","relation":""},{"type":"concept","label":"房室传导阻滞按传导关系分","tag":"关联考点","detail":"一度传导延长但无心室漏搏；二度有部分冲动未下传；三度心房与心室活动相互独立。","ref":"急性心力衰竭、心律失常与心脏骤停｜ice冰冰·高分学姐团","chapter":"急性心力衰竭、心律失常与心脏骤停｜ice冰冰·高分学姐团","href":"medical/cardiovascular/study-02.html","kind":"normal","relation":""},{"type":"concept","label":"器械与导管治疗后的护理","tag":"关联考点","detail":"起搏、消融和导管检查后观察心律、穿刺处出血和远端循环，结合设备或术式落实活动与随访。","ref":"急性心力衰竭、心律失常与心脏骤停｜ice冰冰·高分学姐团","chapter":"急性心力衰竭、心律失常与心脏骤停｜ice冰冰·高分学姐团","href":"medical/cardiovascular/study-02.html","kind":"normal","relation":""},{"type":"cross","label":"体重变化警示","tag":"跨章节数值 · 心力衰竭","detail":"体重变化警示：3天内增加＞2 kg。适用条件与安全边界：相同时间、衣着和体重计测量；提示可能水钠潴留，结合症状及时评估。","ref":"教材 P146","chapter":"心力衰竭｜ice冰冰·高分学姐团","href":"medical/cardiovascular/heart-failure.html","kind":"cross"},{"type":"cross","label":"β受体拮抗药用药观察","tag":"跨章节数值 · 心力衰竭","detail":"β受体拮抗药用药观察：心率＜60次/min时及时报告。适用条件与安全边界：同时观察血压、体重及心衰变化；不据单一网页数值自行统一停药或加药。","ref":"教材 P144","chapter":"心力衰竭｜ice冰冰·高分学姐团","href":"medical/cardiovascular/heart-failure.html","kind":"cross"},{"type":"cross","label":"内科护理总论","tag":"跨章节 · 内科护理总论","detail":"以内科疾病患者为对象，用护理程序把疾病证据、患者反应、治疗安全和连续照护连成完整判断链。","ref":"内科护理总论｜ice冰冰·高分学姐团","chapter":"内科护理总论｜ice冰冰·高分学姐团","href":"medical/introduction/study-01.html","kind":"cross","relation":"安全"},{"type":"cross","label":"护理程序要循环","tag":"跨章节 · 内科护理总论","detail":"评估资料后识别护理问题，与患者共同确定可观察的目标，再实施和评价。评价不达标要回到原因和计划，不能只勾选“已宣教”。","ref":"内科护理总论｜ice冰冰·高分学姐团","chapter":"内科护理总论｜ice冰冰·高分学姐团","href":"medical/introduction/study-01.html","kind":"cross","relation":"评估"},{"type":"cross","label":"常见症状评估","tag":"跨章节 · 呼吸系统症状与感染性疾病","detail":"咳嗽、痰液、呼吸困难和咯血要结合起病方式、诱因、量、颜色及伴随表现判断。","ref":"呼吸系统症状与感染性疾病｜ice冰冰·高分学姐团","chapter":"呼吸系统症状与感染性疾病｜ice冰冰·高分学姐团","href":"medical/respiratory/study-01.html","kind":"cross","relation":"呼吸 / 评估"}]},{"id":"medical/cardiovascular/study-03.html","label":"心脏瓣膜、感染性心内膜与心包疾病","title":"以“心脏瓣膜、感染性心内膜与心包疾病”为中心｜用途、数值与跨章联系","center":"心脏瓣膜、感染性心内膜与心包疾病","chapter":"心脏瓣膜、感染性心内膜与心包疾病｜ice冰冰·高分学姐团","href":"medical/cardiovascular/study-03.html","items":[{"type":"concept","label":"心脏瓣膜病","tag":"关联考点","detail":"瓣口狭窄或关闭不全造成压力或容量负荷，症状与杂音、房颤和心衰风险相互关联。","ref":"心脏瓣膜、感染性心内膜与心包疾病｜ice冰冰·高分学姐团","chapter":"心脏瓣膜、感染性心内膜与心包疾病｜ice冰冰·高分学姐团","href":"medical/cardiovascular/study-03.html","kind":"safe","relation":""},{"type":"concept","label":"收缩期还是舒张期","tag":"关联考点","detail":"先按瓣口和心动周期理解杂音，再联系压力或容量负荷、房颤、栓塞和心衰风险。","ref":"心脏瓣膜、感染性心内膜与心包疾病｜ice冰冰·高分学姐团","chapter":"心脏瓣膜、感染性心内膜与心包疾病｜ice冰冰·高分学姐团","href":"medical/cardiovascular/study-03.html","kind":"safe","relation":""},{"type":"concept","label":"感染性心内膜炎","tag":"关联考点","detail":"持续发热、杂音变化及栓塞或免疫表现结合血培养提示诊断，规范抗感染与观察并发症是重点。","ref":"心脏瓣膜、感染性心内膜与心包疾病｜ice冰冰·高分学姐团","chapter":"心脏瓣膜、感染性心内膜与心包疾病｜ice冰冰·高分学姐团","href":"medical/cardiovascular/study-03.html","kind":"safe","relation":""},{"type":"concept","label":"发热赘生物与栓塞","tag":"关联考点","detail":"按流程采血培养并配合长期抗菌治疗，持续观察心衰及新发神经、肢体或脏器缺血表现。","ref":"心脏瓣膜、感染性心内膜与心包疾病｜ice冰冰·高分学姐团","chapter":"心脏瓣膜、感染性心内膜与心包疾病｜ice冰冰·高分学姐团","href":"medical/cardiovascular/study-03.html","kind":"normal","relation":""},{"type":"concept","label":"心包疾病","tag":"关联考点","detail":"心包积液快速增加可导致压塞，低血压、静脉压升高和心音改变等提示循环受限。","ref":"心脏瓣膜、感染性心内膜与心包疾病｜ice冰冰·高分学姐团","chapter":"心脏瓣膜、感染性心内膜与心包疾病｜ice冰冰·高分学姐团","href":"medical/cardiovascular/study-03.html","kind":"normal","relation":""},{"type":"concept","label":"积液与压塞程度不同","tag":"关联考点","detail":"心包积液的量、积聚速度和循环影响共同决定危险；呼吸困难、血压下降及静脉淤血须警惕压塞。","ref":"心脏瓣膜、感染性心内膜与心包疾病｜ice冰冰·高分学姐团","chapter":"心脏瓣膜、感染性心内膜与心包疾病｜ice冰冰·高分学姐团","href":"medical/cardiovascular/study-03.html","kind":"safe","relation":""},{"type":"concept","label":"主动脉瓣的收缩和舒张","tag":"关联考点","detail":"狭窄时射血受阻，常联系劳力性呼吸困难、心绞痛和晕厥；关闭不全则有舒张期返流和容量负荷。","ref":"心脏瓣膜、感染性心内膜与心包疾病｜ice冰冰·高分学姐团","chapter":"心脏瓣膜、感染性心内膜与心包疾病｜ice冰冰·高分学姐团","href":"medical/cardiovascular/study-03.html","kind":"normal","relation":""},{"type":"concept","label":"心包压塞不同于普通积液","tag":"关联考点","detail":"积液迅速增加可限制心脏充盈，呼吸困难、血压下降及颈静脉淤血等需要迅速复评。","ref":"心脏瓣膜、感染性心内膜与心包疾病｜ice冰冰·高分学姐团","chapter":"心脏瓣膜、感染性心内膜与心包疾病｜ice冰冰·高分学姐团","href":"medical/cardiovascular/study-03.html","kind":"normal","relation":""},{"type":"cross","label":"氧疗适用条件","tag":"跨章节数值 · 心力衰竭","detail":"氧疗适用条件：SpO₂＜90%。适用条件与安全边界：慢性心衰伴低氧血症时考虑氧疗；不是所有心衰患者常规吸氧。","ref":"教材 P144","chapter":"心力衰竭｜ice冰冰·高分学姐团","href":"medical/cardiovascular/heart-failure.html","kind":"cross"},{"type":"cross","label":"液体入量","tag":"跨章节数值 · 心力衰竭","detail":"液体入量：1.5—2.0 L/d。适用条件与安全边界：教材慢性心衰体液管理范围；按充血、灌注、肾功能和个体医嘱调整。","ref":"教材 P145","chapter":"心力衰竭｜ice冰冰·高分学姐团","href":"medical/cardiovascular/heart-failure.html","kind":"cross"},{"type":"cross","label":"常见症状评估","tag":"跨章节 · 呼吸系统症状与感染性疾病","detail":"咳嗽、痰液、呼吸困难和咯血要结合起病方式、诱因、量、颜色及伴随表现判断。","ref":"呼吸系统症状与感染性疾病｜ice冰冰·高分学姐团","chapter":"呼吸系统症状与感染性疾病｜ice冰冰·高分学姐团","href":"medical/respiratory/study-01.html","kind":"cross","relation":"呼吸"},{"type":"cross","label":"咯血先防窒息","tag":"跨章节 · 呼吸系统症状与感染性疾病","detail":"观察出血量、速度、咳出能力、意识与呼吸。大量出血且不能咳出时，气道威胁优先于常规排痰训练。","ref":"呼吸系统症状与感染性疾病｜ice冰冰·高分学姐团","chapter":"呼吸系统症状与感染性疾病｜ice冰冰·高分学姐团","href":"medical/respiratory/study-01.html","kind":"cross","relation":"呼吸"},{"type":"cross","label":"急性呼吸道感染","tag":"跨章节 · 呼吸系统症状与感染性疾病","detail":"多数上呼吸道感染重在对症支持；高热、气促或持续加重提示需重新评估。","ref":"呼吸系统症状与感染性疾病｜ice冰冰·高分学姐团","chapter":"呼吸系统症状与感染性疾病｜ice冰冰·高分学姐团","href":"medical/respiratory/study-01.html","kind":"cross","relation":"感染 / 呼吸"}]},{"id":"medical/cardiovascular/study-04.html","label":"冠心病与原发性高血压","title":"以“冠心病与原发性高血压”为中心｜用途、数值与跨章联系","center":"冠心病与原发性高血压","chapter":"冠心病与原发性高血压｜ice冰冰·高分学姐团","href":"medical/cardiovascular/study-04.html","items":[{"type":"concept","label":"冠心病、急性冠脉综合征与冠脉介入","tag":"关联考点","detail":"心肌缺血的性质、诱因、持续时间及标志物变化帮助区分稳定心绞痛与急性事件；介入治疗后仍要监测再缺血、穿刺处出血、远端循环及造影剂相关肾损伤。","ref":"冠心病与原发性高血压｜ice冰冰·高分学姐团","chapter":"冠心病与原发性高血压｜ice冰冰·高分学姐团","href":"medical/cardiovascular/study-04.html","kind":"safe","relation":""},{"type":"concept","label":"从持续胸痛进入救治路径","tag":"关联考点","detail":"持续或加重的胸痛结合心电及心肌损伤标志物判断；介入后监测再缺血、出血及穿刺处循环。","ref":"冠心病与原发性高血压｜ice冰冰·高分学姐团","chapter":"冠心病与原发性高血压｜ice冰冰·高分学姐团","href":"medical/cardiovascular/study-04.html","kind":"safe","relation":""},{"type":"concept","label":"原发性高血压","tag":"关联考点","detail":"长期血压升高可无明显症状，却持续损害靶器官；管理依赖生活方式、药物与长期随访。","ref":"冠心病与原发性高血压｜ice冰冰·高分学姐团","chapter":"冠心病与原发性高血压｜ice冰冰·高分学姐团","href":"medical/cardiovascular/study-04.html","kind":"normal","relation":""},{"type":"concept","label":"测量与靶器官一起判断","tag":"关联考点","detail":"规范测量并关注血压趋势、服药依从及心脑肾损害；急剧升高伴器官受累时需紧急评估。","ref":"冠心病与原发性高血压｜ice冰冰·高分学姐团","chapter":"冠心病与原发性高血压｜ice冰冰·高分学姐团","href":"medical/cardiovascular/study-04.html","kind":"normal","relation":""},{"type":"concept","label":"胸痛之外还要看血压","tag":"关联考点","detail":"持续胸痛与冷汗及心电改变提示急性冠脉综合征，应迅速识别、监护和启动救治。","ref":"冠心病与原发性高血压｜ice冰冰·高分学姐团","chapter":"冠心病与原发性高血压｜ice冰冰·高分学姐团","href":"medical/cardiovascular/study-04.html","kind":"normal","relation":""},{"type":"concept","label":"稳定型心绞痛与急性冠脉综合征","tag":"关联考点","detail":"诱因和发作模式相对固定；新发、加重或持续性缺血等需要迅速评估","ref":"冠心病与原发性高血压｜ice冰冰·高分学姐团","chapter":"冠心病与原发性高血压｜ice冰冰·高分学姐团","href":"medical/cardiovascular/study-04.html","kind":"normal","relation":""},{"type":"concept","label":"把判断带回患者的生活","tag":"关联考点","detail":"循环护理既要守住分秒必争的生命线，也要把长期治疗变成患者能够理解和坚持的生活方案。","ref":"冠心病与原发性高血压｜ice冰冰·高分学姐团","cha 胃食管反流、胃炎、消化性溃疡与胃癌｜ice冰冰·高分学姐团","href":"medical/digestive/study-01.html","kind":"safe","relation":""},{"type":"concept","label":"生活动作影响反流","tag":"关联考点","detail":"教育围绕进食量、睡前进食、体位和诱因，与规范用药共同改善症状。","ref":"胃食管反流、胃炎、消化性溃疡与胃癌｜ice冰冰·高分学姐团","chapter":"胃食管反流、胃炎、消化性溃疡与胃癌｜ice冰冰·高分学姐团","href":"medical/digestive/study-01.html","kind":"normal","relation":""},{"type":"concept","label":"胃炎","tag":"关联考点","detail":"急性胃黏膜损伤关注出血诱因，慢性胃炎需结合病因、营养和癌前变化管理。","ref":"胃食管反流、胃炎、消化性溃疡与胃癌｜ice冰冰·高分学姐团","chapter":"胃食管反流、胃炎、消化性溃疡与胃癌｜ice冰冰·高分学姐团","href":"medical/digestive/study-01.html","kind":"normal","relation":""},{"type":"concept","label":"先找损伤因素","tag":"关联考点","detail":"药物、酒精、感染等背景影响判断，关注上腹不适、出血和贫血线索，配合病因处理。","ref":"胃食管反流、胃炎、消化性溃疡与胃癌｜ice冰冰·高分学姐团","chapter":"胃食管反流、胃炎、消化性溃疡与胃癌｜ice冰冰·高分学姐团","href":"medical/digestive/study-01.html","kind":"normal","relation":""},{"type":"concept","label":"消化性溃疡","tag":"关联考点","detail":"疼痛节律、幽门螺杆菌和药物因素是主线，出血、穿孔和梗阻是关键并发症。","ref":"胃食管反流、胃炎、消化性溃疡与胃癌｜ice冰冰·高分学姐团","chapter":"胃食管反流、胃炎、消化性溃疡与胃癌｜ice冰冰·高分学姐团","href":"medical/digestive/study-01.html","kind":"safe","relation":""},{"type":"concept","label":"并发症会打破疼痛规律","tag":"关联考点","detail":"胃和十二指肠溃疡可有不同进食相关疼痛，突发剧痛、呕血黑便或持续呕吐需考虑并发症。","ref":"胃食管反流、胃炎、消化性溃疡与胃癌｜ice冰冰·高分学姐团","chapter":"胃食管反流、胃炎、消化性溃疡与胃癌｜ice冰冰·高分学姐团","href":"medical/digestive/study-01.html","kind":"safe","relation":""},{"type":"concept","label":"胃癌","tag":"关联考点","detail":"早期表现可不典型，进行性消瘦、贫血或上腹不适需结合内镜病理判断。","ref":"胃食管反流、胃炎、消化性溃疡与胃癌｜ice冰冰·高分学姐团","chapter":"胃食管反流、胃炎、消化性溃疡与胃癌｜ice冰冰·高分学姐团","href":"medical/digestive/study-01.html","kind":"normal","relation":""},{"type":"concept","label":"早期可不典型","tag":"关联考点","detail":"食欲下降、体重减少、持续上腹不适与贫血要结合内镜和病理；关注营养及治疗后功能。","ref":"胃食管反流、胃炎、消化性溃疡与胃癌｜ice冰冰·高分学姐团","chapter":"胃食管反流、胃炎、消化性溃疡与胃癌｜ice冰冰·高分学姐团","href":"medical/digestive/study-01.html","kind":"normal","relation":""},{"type":"cross","label":"β受体拮抗药用药观察","tag":"跨章节数值 · 心力衰竭","detail":"β受体拮抗药用药观察：心率＜60次/min时及时报告。适用条件与安全边界：同时观察血压、体重及心衰变化；不据单一网页数值自行统一停药或加药。","ref":"教材 P144","chapter":"心力衰竭｜ice冰冰·高分学姐团","href":"medical/cardiovascular/heart-failure.html","kind":"cross"},{"type":"cross","label":"脑水肿高峰","tag":"跨章节数值 · 神经系统 · 脑出血","detail":"脑水肿高峰：出血后约48小时达高峰。适用条件与安全边界：颅内压进一步升高并诱发脑疝；连续评估意识、瞳孔、生命体征、呕吐和肢体变化","ref":"教材P631—633","chapter":"神经系统｜脑出血｜内科护理学第7版","href":"medical/neurology/section-04.html","kind":"cross"},{"type":"cross","label":"咯血先防窒息","tag":"跨章节 · 呼吸系统症状与感染性疾病","detail":"观察出血量、速度、咳出能力、意识与呼吸。大量出血且不能咳出时，气道威胁优先于常规排痰训练。","ref":"呼吸系统症状与感染性疾病｜ice冰冰·高分学姐团","chapter":"呼吸系统症状与感染性疾病｜ice冰冰·高分学姐团","href":"medical/respiratory/study-01.html","kind":"cross","relation":"出血"},{"type":"cross","label":"急性呼吸道感染","tag":"跨章节 · 呼吸系统症状与感染性疾病","detail":"多数上呼吸道感染重在对症支持；高热、气促或持续加重提示需重新评估。","ref":"呼吸系统症状与感染性疾病｜ice冰冰·高分学姐团","chapter":"呼吸系统症状与感染性疾病｜ice冰冰·高分学姐团","href":"medical/respiratory/study-01.html","kind":"cross","relation":"感染"},{"type":"cross","label":"不是每次咳嗽都用抗菌药","tag":"跨章节 · 呼吸系统症状与感染性疾病","detail":"根据感染部位、全身情况及病原线索判断，观察发热、气促和症状持续变化。","ref":"呼吸系统症状与感染性疾病｜ice冰冰·高分学姐团","chapter":"呼吸系统症状与感染性疾病｜ice冰冰·高分学姐团","href":"medical/respiratory/study-01.html","kind":"cross","relation":"感染"}]},{"id":"medical/digestive/study-02.html","label":"消化症状与炎症性肠病","title":"以“消化症状与炎症性肠病”为中心｜用途、数值与跨章联系","center":"消化症状与炎症性肠病","chapter":"消化症状与炎症性肠病｜ice冰冰·高分学姐团","href":"medical/digestive/study-02.html","items":[{"type":"concept","label":"消化症状评估","tag":"关联考点","detail":"恶心、呕吐、腹痛、腹泻、黄疸及呕血黑便需结合部位、性质、时间和伴随表现定位。","ref":"消化症状与炎症性肠病｜ice冰冰·高分学姐团","chapter":"消化症状与炎症性肠病｜ice冰冰·高分学姐团","href":"medical/digestive/study-02.html","kind":"normal","relation":""},{"type":"concept","label":"先分失血与一般不适","tag":"关联考点","detail":"呕血黑便要结合血压心率尿量评估灌注，腹痛则核对部位、性质和腹膜刺激征。","ref":"消化症状与炎症性肠病｜ice冰冰·高分学姐团","chapter":"消化症状与炎症性肠病｜ice冰冰·高分学姐团","href":"medical/digestive/study-02.html","kind":"normal","relation":""},{"type":"concept","label":"肠结核与结核性腹膜炎","tag":"关联考点","detail":"慢性腹痛、腹泻或腹水结合结核证据判断，治疗强调规范、足疗程与营养支持。","ref":"消化症状与炎症性肠病｜ice冰冰·高分学姐团","chapter":"消化症状与炎症性肠病｜ice冰冰·高分学姐团","href":"medical/digestive/study-02.html","kind":"normal","relatio 跨章节 · 呼吸系统症状与感染性疾病","detail":"观察出血量、速度、咳出能力、意识与呼吸。大量出血且不能咳出时，气道威胁优先于常规排痰训练。","ref":"呼吸系统症状与感染性疾病｜ice冰冰·高分学姐团","chapter":"呼吸系统症状与感染性疾病｜ice冰冰·高分学姐团","href":"medical/respiratory/study-01.html","kind":"cross","relation":"出血"}]},{"id":"medical/digestive/study-03.html","label":"脂肪性肝病、肝硬化、肝癌与肝性脑病","title":"以“脂肪性肝病、肝硬化、肝癌与肝性脑病”为中心｜用途、数值与跨章联系","center":"脂肪性肝病、肝硬化、肝癌与肝性脑病","chapter":"脂肪性肝病、肝硬化、肝癌与肝性脑病｜ice冰冰·高分学姐团","href":"medical/digestive/study-03.html","items":[{"type":"concept","label":"脂肪性肝病与肝硬化","tag":"关联考点","detail":"代谢、饮酒等因素可造成脂肪变和炎症；进展至肝硬化后，门静脉高压和肝功能减退又带来腹水、出血、感染与脑病风险。","ref":"脂肪性肝病、肝硬化、肝癌与肝性脑病｜ice冰冰·高分学姐团","chapter":"脂肪性肝病、肝硬化、肝癌与肝性脑病｜ice冰冰·高分学姐团","href":"medical/digestive/study-03.html","kind":"safe","relation":""},{"type":"concept","label":"从代谢或酒精走向肝损害","tag":"关联考点","detail":"脂肪性肝病重在相关危险因素管理；肝硬化须同时看肝功能减退和门静脉高压。","ref":"脂肪性肝病、肝硬化、肝癌与肝性脑病｜ice冰冰·高分学姐团","chapter":"脂肪性肝病、肝硬化、肝癌与肝性脑病｜ice冰冰·高分学姐团","href":"medical/digestive/study-03.html","kind":"safe","relation":""},{"type":"concept","label":"原发性肝癌","tag":"关联考点","detail":"高危人群监测、影像与标志物帮助早期发现，护理兼顾疼痛、营养和治疗反应。","ref":"脂肪性肝病、肝硬化、肝癌与肝性脑病｜ice冰冰·高分学姐团","chapter":"脂肪性肝病、肝硬化、肝癌与肝性脑病｜ice冰冰·高分学姐团","href":"medical/digestive/study-03.html","kind":"safe","relation":""},{"type":"concept","label":"高危背景与新变化","tag":"关联考点","detail":"慢性肝病患者出现肝区疼痛、肿块、消瘦等应结合影像和标志物，治疗后关注出血、肝功能和疼痛。","ref":"脂肪性肝病、肝硬化、肝癌与肝性脑病｜ice冰冰·高分学姐团","chapter":"脂肪性肝病、肝硬化、肝癌与肝性脑病｜ice冰冰·高分学姐团","href":"medical/digestive/study-03.html","kind":"normal","relation":""},{"type":"concept","label":"肝性脑病","tag":"关联考点","detail":"肝功能障碍和门体分流使神经毒性物质累积，意识与行为改变可由多种诱因触发。","ref":"脂肪性肝病、肝硬化、肝癌与肝性脑病｜ice冰冰·高分学姐团","chapter":"脂肪性肝病、肝硬化、肝癌与肝性脑病｜ice冰冰·高分学姐团","href":"medical/digestive/study-03.html","kind":"normal","relation":""},{"type":"concept","label":"意识变化之前已有线索","tag":"关联考点","detail":"睡眠倒置、性格行为改变可先出现，寻找便秘、出血、感染及水电解质等诱因。","ref":"脂肪性肝病、肝硬化、肝癌与肝性脑病｜ice冰冰·高分学姐团","chapter":"脂肪性肝病、肝硬化、肝癌与肝性脑病｜ice冰冰·高分学姐团","href":"medical/digestive/study-03.html","kind":"normal","relation":""},{"type":"concept","label": ,"relation":""},{"type":"concept","label":"腹痛之外看器官","tag":"关联考点","detail":"持续腹痛结合胰酶及影像；观察循环、氧合、尿量、血糖和电解质等，以发现重症变化。","ref":"急性胰腺炎、上消化道出血与内镜护理｜ice冰冰·高分学姐团","chapter":"急性胰腺炎、上消化道出血与内镜护理｜ice冰冰·高分学姐团","href":"medical/digestive/study-04.html","kind":"normal","relation":""},{"type":"concept","label":"上消化道出血","tag":"关联考点","detail":"呕血、黑便与循环变化共同反映严重度，处理围绕复苏、止血、病因和再出血监测。","ref":"急性胰腺炎、上消化道出血与内镜护理｜ice冰冰·高分学姐团","chapter":"急性胰腺炎、上消化道出血与内镜护理｜ice冰冰·高分学姐团","href":"medical/digestive/study-04.html","kind":"safe","relation":""},{"type":"concept","label":"循环趋势比便色更可靠","tag":"关联考点","detail":"持续监测意识、心率、血压及尿量，结合血红蛋白等趋势评价失血和治疗反应。","ref":"急性胰腺炎、上消化道出血与内镜护理｜ice冰冰·高分学姐团","chapter":"急性胰腺炎、上消化道出血与内镜护理｜ice冰冰·高分学姐团","href":"medical/digestive/study-04.html","kind":"safe","relation":""},{"type":"concept","label":"腹穿与内镜护理","tag":"关联考点","detail":"操作前评估凝血、禁食和知情准备，操作后观察出血、穿孔、感染及镇静恢复。","ref":"急性胰腺炎、上消化道出血与内镜护理｜ice冰冰·高分学姐团","chapter":"急性胰腺炎、上消化道出血与内镜护理｜ice冰冰·高分学姐团","href":"medical/digestive/study-04.html","kind":"normal","relation":""},{"type":"concept","label":"准备和术后观察成对记","tag":"关联考点","detail":"核对禁食、用药及检查条件，检查后按操作特点看意识、吞咽、腹痛、出血及循环。","ref":"急性胰腺炎、上消化道出血与内镜护理｜ice冰冰·高分学姐团","chapter":"急性胰腺炎、上消化道出血与内镜护理｜ice冰冰·高分学姐团","href":"medical/digestive/study-04.html","kind":"normal","relation":""},{"type":"concept","label":"胰酶数值与疾病严重度","tag":"关联考点","detail":"胰酶有随起病时间变化的规律；判断严重程度还需要循环、氧合、尿量和器官功能。","ref":"急性胰腺炎、上消化道出血与内镜护理｜ice冰冰·高分学姐团","chapter":"急性胰腺炎、上消化道出血与内镜护理｜ice冰冰·高分学姐团","href":"medical/digestive/study-04.html","kind":"normal","relation":""},{"type":"cross","label":"体重变化警示","tag":"跨章节数值 · 心力衰竭","detail":"体重变化警示：3天内增加＞2 kg。适用条件与安全边界：相同时间、衣着和体重计测量；提示可能水钠潴留，结合症状及时评估。","ref":"教材 P146","chapter":"心力衰竭｜ice冰冰·高分学姐团","href":"medical/cardiovascular/heart-failure.html","kind":"cross"},{"type":"cross","label":"β受体拮抗药用药观察","tag":"跨章节数值 · 心力衰竭","detail":"β受体拮抗药用药观察：心率＜60次/min时及时报告。适用条件与安全边界：同时观察血压、体重及心衰变化；不据单一网页数值自行统一停药或加药。","ref":"教材 P144","chapter":"心力衰竭｜ice冰冰·高分学姐团","href":"medical/cardiovascular/heart-failure.html","kind":" 压是典型线索，护理关注容量和并发症。","ref":"泌尿症状与肾小球疾病｜ice冰冰·高分学姐团","chapter":"泌尿症状与肾小球疾病｜ice冰冰·高分学姐团","href":"medical/urinary/study-01.html","kind":"safe","relation":""},{"type":"concept","label":"感染后时序有价值","tag":"关联考点","detail":"感染后出现血尿、水肿和高血压，关注少尿及容量负荷，预防急性心衰和高血压脑病等。","ref":"泌尿症状与肾小球疾病｜ice冰冰·高分学姐团","chapter":"泌尿症状与肾小球疾病｜ice冰冰·高分学姐团","href":"medical/urinary/study-01.html","kind":"normal","relation":""},{"type":"cross","label":"氧疗适用条件","tag":"跨章节数值 · 心力衰竭","detail":"氧疗适用条件：SpO₂＜90%。适用条件与安全边界：慢性心衰伴低氧血症时考虑氧疗；不是所有心衰患者常规吸氧。","ref":"教材 P144","chapter":"心力衰竭｜ice冰冰·高分学姐团","href":"medical/cardiovascular/heart-failure.html","kind":"cross"},{"type":"cross","label":"液体入量","tag":"跨章节数值 · 心力衰竭","detail":"液体入量：1.5—2.0 L/d。适用条件与安全边界：教材慢性心衰体液管理范围；按充血、灌注、肾功能和个体医嘱调整。","ref":"教材 P145","chapter":"心力衰竭｜ice冰冰·高分学姐团","href":"medical/cardiovascular/heart-failure.html","kind":"cross"},{"type":"cross","label":"急性呼吸道感染","tag":"跨章节 · 呼吸系统症状与感染性疾病","detail":"多数上呼吸道感染重在对症支持；高热、气促或持续加重提示需重新评估。","ref":"呼吸系统症状与感染性疾病｜ice冰冰·高分学姐团","chapter":"呼吸系统症状与感染性疾病｜ice冰冰·高分学姐团","href":"medical/respiratory/study-01.html","kind":"cross","relation":"感染"},{"type":"cross","label":"不是每次咳嗽都用抗菌药","tag":"跨章节 · 呼吸系统症状与感染性疾病","detail":"根据感染部位、全身情况及病原线索判断，观察发热、气促和症状持续变化。","ref":"呼吸系统症状与感染性疾病｜ice冰冰·高分学姐团","chapter":"呼吸系统症状与感染性疾病｜ice冰冰·高分学姐团","href":"medical/respiratory/study-01.html","kind":"cross","relation":"感染"},{"type":"cross","label":"肺部感染","tag":"跨章节 · 呼吸系统症状与感染性疾病","detail":"病原体、宿主状况和影像表现共同影响判断，护理关注氧合、排痰、体温与抗感染反应。","ref":"呼吸系统症状与感染性疾病｜ice冰冰·高分学姐团","chapter":"呼吸系统症状与感染性疾病｜ice冰冰·高分学姐团","href":"medical/respiratory/study-01.html","kind":"cross","relation":"感染"}]},{"id":"medical/urinary/study-02.html","label":"急慢性肾炎、肾病综合征与尿路感染","title":"以“急慢性肾炎、肾病综合征与尿路感染”为中心｜用途、数值与跨章联系","center":"急慢性肾炎、肾病综合征与尿路感染","chapter":"急慢性肾炎、肾病综合征与尿路感染｜ice冰冰·高分学姐团","href":"medical/urinary/study-02.html","items":[{"type":"concept","label":"急进性与慢性肾炎","tag":"关联考点","detail":"急进性肾炎肾功能恶化快，慢性肾炎则长期进展；两者监测节奏和风险不同。","ref":"急慢性肾炎、肾病综合征与尿路感染｜ice冰冰·高分学姐团","chapter":"急慢性肾炎、肾病综合 ”。","ref":"内科护理总论｜ice冰冰·高分学姐团","chapter":"内科护理总论｜ice冰冰·高分学姐团","href":"medical/introduction/study-01.html","kind":"cross","relation":"评估"},{"type":"cross","label":"常见症状评估","tag":"跨章节 · 呼吸系统症状与感染性疾病","detail":"咳嗽、痰液、呼吸困难和咯血要结合起病方式、诱因、量、颜色及伴随表现判断。","ref":"呼吸系统症状与感染性疾病｜ice冰冰·高分学姐团","chapter":"呼吸系统症状与感染性疾病｜ice冰冰·高分学姐团","href":"medical/respiratory/study-01.html","kind":"cross","relation":"评估"}]},{"id":"medical/hematology/study-01.html","label":"贫血评估、缺铁性与巨幼细胞贫血","title":"以“贫血评估、缺铁性与巨幼细胞贫血”为中心｜用途、数值与跨章联系","center":"贫血评估、缺铁性与巨幼细胞贫血","chapter":"贫血评估、缺铁性与巨幼细胞贫血｜ice冰冰·高分学姐团","href":"medical/hematology/study-01.html","items":[{"type":"concept","label":"贫血与出血评估","tag":"关联考点","detail":"出血部位、程度与贫血症状需结合血常规、凝血、红细胞形态、网织红细胞和生命体征判断。","ref":"贫血评估、缺铁性与巨幼细胞贫血｜ice冰冰·高分学姐团","chapter":"贫血评估、缺铁性与巨幼细胞贫血｜ice冰冰·高分学姐团","href":"medical/hematology/study-01.html","kind":"normal","relation":""},{"type":"concept","label":"血红蛋白与临床耐受一起看","tag":"关联考点","detail":"病因、进展速度及心肺代偿影响症状，贫血严重度分层应结合单位和对象。","ref":"贫血评估、缺铁性与巨幼细胞贫血｜ice冰冰·高分学姐团","chapter":"贫血评估、缺铁性与巨幼细胞贫血｜ice冰冰·高分学姐团","href":"medical/hematology/study-01.html","kind":"normal","relation":""},{"type":"concept","label":"缺铁性与巨幼细胞贫血","tag":"关联考点","detail":"缺铁重在寻找慢性失血和补铁依从性；巨幼细胞贫血需区分叶酸或维生素B12相关问题。","ref":"贫血评估、缺铁性与巨幼细胞贫血｜ice冰冰·高分学姐团","chapter":"贫血评估、缺铁性与巨幼细胞贫血｜ice冰冰·高分学姐团","href":"medical/hematology/study-01.html","kind":"normal","relation":""},{"type":"concept","label":"先辨缺什么","tag":"关联考点","detail":"慢性失血是成人缺铁常见原因，补铁须同时处理失血；大细胞性贫血要考虑叶酸和维生素B₁₂。","ref":"贫血评估、缺铁性与巨幼细胞贫血｜ice冰冰·高分学姐团","chapter":"贫血评估、缺铁性与巨幼细胞贫血｜ice冰冰·高分学姐团","href":"medical/hematology/study-01.html","kind":"normal","relation":""},{"type":"concept","label":"补铁后黑便要不要停药","tag":"关联考点","detail":"铁剂可以导致黑便，但不能只凭颜色排除出血。还应结合症状、循环状态及检查判断。","ref":"贫血评估、缺铁性与巨幼细胞贫血｜ice冰冰·高分学姐团","chapter":"贫血评估、缺铁性与巨幼细胞贫血｜ice冰冰·高分学姐团","href":"medical/hematology/study-01.html","kind":"safe","relation":""},{"type":"concept","label":"缺铁性贫血与巨幼细胞贫血","tag":"关联考点","detail":"铁不足影响血红蛋白合成；叶酸或维生素B₁₂等不足影响DNA合成","ref":"贫血评估、缺铁性与巨幼细胞贫血｜ice冰冰·高 elation":""},{"type":"concept","label":"长期风险大于一次数字","tag":"关联考点","detail":"以体重、腰围、饮食活动及心血管风险进行综合管理，用药监测疗效和不良反应。","ref":"肥胖、血脂、尿酸与骨代谢异常｜ice冰冰·高分学姐团","chapter":"肥胖、血脂、尿酸与骨代谢异常｜ice冰冰·高分学姐团","href":"medical/endocrine-metabolic/study-04.html","kind":"safe","relation":""},{"type":"concept","label":"高尿酸血症与痛风","tag":"关联考点","detail":"尿酸沉积引起急性关节炎及长期器官风险，急性期和长期降尿酸管理目标不同。","ref":"肥胖、血脂、尿酸与骨代谢异常｜ice冰冰·高分学姐团","chapter":"肥胖、血脂、尿酸与骨代谢异常｜ice冰冰·高分学姐团","href":"medical/endocrine-metabolic/study-04.html","kind":"safe","relation":""},{"type":"concept","label":"急性抗炎与长期降尿酸","tag":"关联考点","detail":"急性红肿热痛先处理炎症和关节保护；长期管理联系尿酸、肾功能、饮食及药物。","ref":"肥胖、血脂、尿酸与骨代谢异常｜ice冰冰·高分学姐团","chapter":"肥胖、血脂、尿酸与骨代谢异常｜ice冰冰·高分学姐团","href":"medical/endocrine-metabolic/study-04.html","kind":"normal","relation":""},{"type":"concept","label":"骨质疏松症","tag":"关联考点","detail":"骨量和骨质量下降使脆性骨折风险增加，预防结合营养、负重活动、跌倒管理与药物。","ref":"肥胖、血脂、尿酸与骨代谢异常｜ice冰冰·高分学姐团","chapter":"肥胖、血脂、尿酸与骨代谢异常｜ice冰冰·高分学姐团","href":"medical/endocrine-metabolic/study-04.html","kind":"safe","relation":""},{"type":"concept","label":"防骨折与骨量管理","tag":"关联考点","detail":"结合骨密度、骨折史及风险因素，落实营养、适当负重训练与防跌倒。","ref":"肥胖、血脂、尿酸与骨代谢异常｜ice冰冰·高分学姐团","chapter":"肥胖、血脂、尿酸与骨代谢异常｜ice冰冰·高分学姐团","href":"medical/endocrine-metabolic/study-04.html","kind":"safe","relation":""},{"type":"concept","label":"骨折预防不只是一项补充剂","tag":"关联考点","detail":"骨密度和骨折风险要连同年龄、既往骨折、药物及跌倒风险判断，合理运动与环境安全同样重要。","ref":"肥胖、血脂、尿酸与骨代谢异常｜ice冰冰·高分学姐团","chapter":"肥胖、血脂、尿酸与骨代谢异常｜ice冰冰·高分学姐团","href":"medical/endocrine-metabolic/study-04.html","kind":"safe","relation":""},{"type":"cross","label":"β受体拮抗药用药观察","tag":"跨章节数值 · 心力衰竭","detail":"β受体拮抗药用药观察：心率＜60次/min时及时报告。适用条件与安全边界：同时观察血压、体重及心衰变化；不据单一网页数值自行统一停药或加药。","ref":"教材 P144","chapter":"心力衰竭｜ice冰冰·高分学姐团","href":"medical/cardiovascular/heart-failure.html","kind":"cross"},{"type":"cross","label":"收缩压150～220 mmHg","tag":"跨章节数值 · 神经系统 · 脑出血","detail":"收缩压150～220 mmHg：无急性降压禁忌时，降至约140 mmHg通常安全。适用条件与安全边界：降压过快、过低可造成脑低灌注；连续或高频监测血压与神经体征，避免明显波动","ref":"教材P632","chapter":"神经系统｜脑出血｜内科护理学第7版", 分学姐团","href":"medical/rheumatology/study-01.html","kind":"safe","relation":""},{"type":"concept","label":"晒太阳后的新症状","tag":"关联考点","detail":"SLE可累及多器官。皮肤改变之外，尿异常、水肿和肾功能需纳入评估。","ref":"风湿症状评估与系统性红斑狼疮｜ice冰冰·高分学姐团","chapter":"风湿症状评估与系统性红斑狼疮｜ice冰冰·高分学姐团","href":"medical/rheumatology/study-01.html","kind":"normal","relation":""},{"type":"concept","label":"狼疮活动与感染","tag":"关联考点","detail":"原病的免疫炎症及器官变化；可在免疫抑制治疗中出现或加重","ref":"风湿症状评估与系统性红斑狼疮｜ice冰冰·高分学姐团","chapter":"风湿症状评估与系统性红斑狼疮｜ice冰冰·高分学姐团","href":"medical/rheumatology/study-01.html","kind":"normal","relation":""},{"type":"concept","label":"把判断带回患者的生活","tag":"关联考点","detail":"风湿病的痛苦常被外人低估；护理要看见疼痛、疲乏、形象和角色变化，帮助患者保存功能与尊严。","ref":"风湿症状评估与系统性红斑狼疮｜ice冰冰·高分学姐团","chapter":"风湿症状评估与系统性红斑狼疮｜ice冰冰·高分学姐团","href":"medical/rheumatology/study-01.html","kind":"normal","relation":""},{"type":"cross","label":"体重变化警示","tag":"跨章节数值 · 心力衰竭","detail":"体重变化警示：3天内增加＞2 kg。适用条件与安全边界：相同时间、衣着和体重计测量；提示可能水钠潴留，结合症状及时评估。","ref":"教材 P146","chapter":"心力衰竭｜ice冰冰·高分学姐团","href":"medical/cardiovascular/heart-failure.html","kind":"cross"},{"type":"cross","label":"脑水肿高峰","tag":"跨章节数值 · 神经系统 · 脑出血","detail":"脑水肿高峰：出血后约48小时达高峰。适用条件与安全边界：颅内压进一步升高并诱发脑疝；连续评估意识、瞳孔、生命体征、呕吐和肢体变化","ref":"教材P631—633","chapter":"神经系统｜脑出血｜内科护理学第7版","href":"medical/neurology/section-04.html","kind":"cross"},{"type":"cross","label":"护理程序要循环","tag":"跨章节 · 内科护理总论","detail":"评估资料后识别护理问题，与患者共同确定可观察的目标，再实施和评价。评价不达标要回到原因和计划，不能只勾选“已宣教”。","ref":"内科护理总论｜ice冰冰·高分学姐团","chapter":"内科护理总论｜ice冰冰·高分学姐团","href":"medical/introduction/study-01.html","kind":"cross","relation":"评估"},{"type":"cross","label":"常见症状评估","tag":"跨章节 · 呼吸系统症状与感染性疾病","detail":"咳嗽、痰液、呼吸困难和咯血要结合起病方式、诱因、量、颜色及伴随表现判断。","ref":"呼吸系统症状与感染性疾病｜ice冰冰·高分学姐团","chapter":"呼吸系统症状与感染性疾病｜ice冰冰·高分学姐团","href":"medical/respiratory/study-01.html","kind":"cross","relation":"评估"},{"type":"cross","label":"急性呼吸道感染","tag":"跨章节 · 呼吸系统症状与感染性疾病","detail":"多数上呼吸道感染重在对症支持；高热、气促或持续加重提示需重新评估。","ref":"呼吸系统症状与感染性疾病｜ice冰冰·高分学姐团","chapter":"呼吸系统症状与感染性疾病｜ice冰冰·高分学姐团","href":"medica ":"神经症状定位、TIA与脑梗死｜ice冰冰·高分学姐团","href":"medical/neurology/study-01.html","kind":"safe","relation":""},{"type":"concept","label":"脑梗死","tag":"关联考点","detail":"突发局灶性缺损与缺血相关，发病时间、影像和禁忌决定再灌注路径。","ref":"神经症状定位、TIA与脑梗死｜ice冰冰·高分学姐团","chapter":"神经症状定位、TIA与脑梗死｜ice冰冰·高分学姐团","href":"medical/neurology/study-01.html","kind":"safe","relation":""},{"type":"concept","label":"时间影像与安全照护","tag":"关联考点","detail":"记录起病或最后正常时间，急诊影像分型并评估再灌注条件；落实吞咽、肢体及并发症管理。","ref":"神经症状定位、TIA与脑梗死｜ice冰冰·高分学姐团","chapter":"神经症状定位、TIA与脑梗死｜ice冰冰·高分学姐团","href":"medical/neurology/study-01.html","kind":"safe","relation":""},{"type":"concept","label":"认知障碍与语言障碍分别看","tag":"关联考点","detail":"记忆、注意和执行功能异常可影响学习、用药及生活安全；失语则重点评估语言表达与理解。","ref":"神经症状定位、TIA与脑梗死｜ice冰冰·高分学姐团","chapter":"神经症状定位、TIA与脑梗死｜ice冰冰·高分学姐团","href":"medical/neurology/study-01.html","kind":"safe","relation":""},{"type":"concept","label":"运动障碍的分布帮助定位","tag":"关联考点","detail":"单瘫、偏瘫、交叉瘫、截瘫及四肢瘫需要结合脑神经、感觉平面和反射解释。","ref":"神经症状定位、TIA与脑梗死｜ice冰冰·高分学姐团","chapter":"神经症状定位、TIA与脑梗死｜ice冰冰·高分学姐团","href":"medical/neurology/study-01.html","kind":"normal","relation":""},{"type":"cross","label":"体重变化警示","tag":"跨章节数值 · 心力衰竭","detail":"体重变化警示：3天内增加＞2 kg。适用条件与安全边界：相同时间、衣着和体重计测量；提示可能水钠潴留，结合症状及时评估。","ref":"教材 P146","chapter":"心力衰竭｜ice冰冰·高分学姐团","href":"medical/cardiovascular/heart-failure.html","kind":"cross"},{"type":"cross","label":"β受体拮抗药用药观察","tag":"跨章节数值 · 心力衰竭","detail":"β受体拮抗药用药观察：心率＜60次/min时及时报告。适用条件与安全边界：同时观察血压、体重及心衰变化；不据单一网页数值自行统一停药或加药。","ref":"教材 P144","chapter":"心力衰竭｜ice冰冰·高分学姐团","href":"medical/cardiovascular/heart-failure.html","kind":"cross"},{"type":"cross","label":"内科护理总论","tag":"跨章节 · 内科护理总论","detail":"以内科疾病患者为对象，用护理程序把疾病证据、患者反应、治疗安全和连续照护连成完整判断链。","ref":"内科护理总论｜ice冰冰·高分学姐团","chapter":"内科护理总论｜ice冰冰·高分学姐团","href":"medical/introduction/study-01.html","kind":"cross","relation":"安全"},{"type":"cross","label":"护理程序要循环","tag":"跨章节 · 内科护理总论","detail":"评估资料后识别护理问题，与患者共同确定可观察的目标，再实施和评价。评价不达标要回到原因和计划，不能只勾选“已宣教”。","ref":"内科护理总论｜ice冰冰·高分学姐团","chapter":"内科护理总论｜ice冰冰·高分学姐团","href" 材 P144","chapter":"心力衰竭｜ice冰冰·高分学姐团","href":"medical/cardiovascular/heart-failure.html","kind":"cross"},{"type":"cross","label":"护理程序要循环","tag":"跨章节 · 内科护理总论","detail":"评估资料后识别护理问题，与患者共同确定可观察的目标，再实施和评价。评价不达标要回到原因和计划，不能只勾选“已宣教”。","ref":"内科护理总论｜ice冰冰·高分学姐团","chapter":"内科护理总论｜ice冰冰·高分学姐团","href":"medical/introduction/study-01.html","kind":"cross","relation":"评估"},{"type":"cross","label":"常见症状评估","tag":"跨章节 · 呼吸系统症状与感染性疾病","detail":"咳嗽、痰液、呼吸困难和咯血要结合起病方式、诱因、量、颜色及伴随表现判断。","ref":"呼吸系统症状与感染性疾病｜ice冰冰·高分学姐团","chapter":"呼吸系统症状与感染性疾病｜ice冰冰·高分学姐团","href":"medical/respiratory/study-01.html","kind":"cross","relation":"呼吸 / 评估"},{"type":"cross","label":"咯血先防窒息","tag":"跨章节 · 呼吸系统症状与感染性疾病","detail":"观察出血量、速度、咳出能力、意识与呼吸。大量出血且不能咳出时，气道威胁优先于常规排痰训练。","ref":"呼吸系统症状与感染性疾病｜ice冰冰·高分学姐团","chapter":"呼吸系统症状与感染性疾病｜ice冰冰·高分学姐团","href":"medical/respiratory/study-01.html","kind":"cross","relation":"呼吸 / 出血"}]},{"id":"medical/neurology/study-03.html","label":"蛛网膜下腔出血","title":"以“蛛网膜下腔出血”为中心｜用途、数值与跨章联系","center":"蛛网膜下腔出血","chapter":"蛛网膜下腔出血｜ice冰冰·高分学姐团","href":"medical/neurology/study-03.html","items":[{"type":"concept","label":"蛛网膜下腔出血","tag":"关联考点","detail":"突发剧烈头痛是典型警报，可伴脑膜刺激征和意识改变。","ref":"蛛网膜下腔出血｜ice冰冰·高分学姐团","chapter":"蛛网膜下腔出血｜ice冰冰·高分学姐团","href":"medical/neurology/study-03.html","kind":"normal","relation":""},{"type":"concept","label":"头痛及并发症时间轴","tag":"关联考点","detail":"突发爆裂样头痛、呕吐和脑膜刺激征是线索，继续观察再出血、脑血管痉挛及脑积水。","ref":"蛛网膜下腔出血｜ice冰冰·高分学姐团","chapter":"蛛网膜下腔出血｜ice冰冰·高分学姐团","href":"medical/neurology/study-03.html","kind":"normal","relation":""},{"type":"concept","label":"爆裂样头痛再次出现","tag":"关联考点","detail":"好转后再次剧烈头痛与意识恶化，应首先排查再出血，不能按普通头痛处理。","ref":"蛛网膜下腔出血｜ice冰冰·高分学姐团","chapter":"蛛网膜下腔出血｜ice冰冰·高分学姐团","href":"medical/neurology/study-03.html","kind":"safe","relation":""},{"type":"concept","label":"再出血与迟发性脑缺血","tag":"关联考点","detail":"好转后再次突发剧烈头痛或意识恶化；数日后新发局灶缺损等，需考虑血管痉挛","ref":"蛛网膜下腔出血｜ice冰冰·高分学姐团","chapter":"蛛网膜下腔出血｜ice冰冰·高分学姐团","href":"medical/neurology/study-03.html","kind":"normal","relation":""},{"type":"concept","label":"把判断带回患者的生活","tag":"关联考点","detail":"神经系统疾病可能夺走语言、动作和独立性；护理要在预防危险的同时，帮助患者重新表达、参与并被当作完整的人。","ref":"蛛网膜下腔出血｜ice冰冰·高分学姐团","chapter":"蛛网膜下腔出血｜ice冰冰·高分学姐团","href":"medical/neurology/study-03.html","kind":"safe","relation":""},{"type":"cross","label":"脑水肿高峰","tag":"跨章节数值 · 神经系统 · 脑出血","detail":"脑水肿高峰：出血后约48小时达高峰。适用条件与安全边界：颅内压进一步升高并诱发脑疝；连续评估意识、瞳孔、生命体征、呕吐和肢体变化","ref":"教材P631—633","chapter":"神经系统｜脑出血｜内科护理学第7版","href":"medical/neurology/section-04.html","kind":"cross"},{"type":"cross","label":"外科治疗参考界值","tag":"跨章节数值 · 神经系统 · 脑出血","detail":"外科治疗参考界值：壳核出血≥30 ml；丘脑出血≥15 ml；小脑出血≥10 ml或直径＞3 cm。适用条件与安全边界：继续扩大的血肿可加重占位效应、脑积水和脑疝；动态观察神经体征，配合复查影像并做好脑室引流或血肿清除准备","ref":"教材P632","chapter":"神经系统｜脑出血｜内科护理学第7版","href":"medical/neurology/section-04.html","kind":"cross"},{"type":"cross","label":"咯血先防窒息","tag":"跨章节 · 呼吸系统症状与感染性疾病","detail":"观察出血量、速度、咳出能力、意识与呼吸。大量出血且不能咳出时，气道威胁优先于常规排痰训练。","ref":"呼吸系统症状与感染性疾病｜ice冰冰·高分学姐团","chapter":"呼吸系统症状与感染性疾病｜ice冰冰·高分学姐团","href":"medical/respiratory/study-01.html","kind":"cross","relation":"出血"},{"type":"cross","label":"支气管镜与胸穿","tag":"跨章节 · 肺癌、胸膜疾病与呼吸系统诊疗","detail":"操作前核对禁忌和知情准备，操作后重点观察出血、气胸、呼吸状态及局麻恢复。","ref":"肺癌、胸膜疾病与呼吸系统诊疗｜ice冰冰·高分学姐团","chapter":"肺癌、胸膜疾病与呼吸系统诊疗｜ice冰冰·高分学姐团","href":"medical/respiratory/study-05.html","kind":"cross","relation":"出血"},{"type":"cross","label":"按检查前中后组织","tag":"跨章节 · 肺癌、胸膜疾病与呼吸系统诊疗","detail":"术前核对准备和禁忌，操作中监测耐受，术后关注出血、气胸和吞咽恢复。","ref":"肺癌、胸膜疾病与呼吸系统诊疗｜ice冰冰·高分学姐团","chapter":"肺癌、胸膜疾病与呼吸系统诊疗｜ice冰冰·高分学姐团","href":"medical/respiratory/study-05.html","kind":"cross","relation":"出血"}]},{"id":"medical/neurology/study-04.html","label":"多发性硬化、帕金森病与癫痫","title":"以“多发性硬化、帕金森病与癫痫”为中心｜用途、数值与跨章联系","center":"多发性硬化、帕金森病与癫痫","chapter":"多发性硬化、帕金森病与癫痫｜ice冰冰·高分学姐团","href":"medical/neurology/study-04.html","items":[{"type":"concept","label":"多发性硬化","tag":"关联考点","detail":"中枢神经系统脱髓鞘病变可呈时间和空间多发，症状复发缓解。","ref":"多发性硬化、帕金森病与癫痫｜ice冰冰·高分学姐团","chapter":"多发性硬化、帕金森病与癫痫｜ice冰冰·高分学姐团","href":"medical/neurology/study-04.html","kind":"normal","relation":""},{"type":"concept","label":"中枢症状的时空多发","tag":"关联考点","detail":"视力、感觉、运动及协调等可在不同时间和部位受累，关注疲劳、功能及复发治疗。","ref":"多发性硬化、帕金森病与癫痫｜ice冰冰·高分学姐团","chapter":"多发性硬化、帕金森病与癫痫｜ice冰冰·高分学姐团","href":"medical/neurology/study-04.html","kind":"normal","relation":""},{"type":"concept","label":"帕金森病","tag":"关联考点","detail":"运动迟缓、静止性震颤、肌强直和姿势障碍影响活动，同时可伴多种非运动症状。","ref":"多发性硬化、帕金森病与癫痫｜ice冰冰·高分学姐团","chapter":"多发性硬化、帕金森病与癫痫｜ice冰冰·高分学姐团","href":"medical/neurology/study-04.html","kind":"normal","relation":""},{"type":"concept","label":"运动症状连接生活功能","tag":"关联考点","detail":"静止性震颤、运动迟缓、肌强直及姿势步态障碍影响活动，关注跌倒、吞咽和用药波动。","ref":"多发性硬化、帕金森病与癫痫｜ice冰冰·高分学姐团","chapter":"多发性硬化、帕金森病与癫痫｜ice冰冰·高分学姐团","href":"medical/neurology/study-04.html","kind":"normal","relation":""},{"type":"concept","label":"癫痫","tag":"关联考点","detail":"发作表现取决于异常放电部位，发作时保护安全、记录特征，持续发作需紧急处理。","ref":"多发性硬化、帕金森病与癫痫｜ice冰冰·高分学姐团","chapter":"多发性硬化、帕金森病与癫痫｜ice冰冰·高分学姐团","href":"medical/neurology/study-04.html","kind":"normal","relation":""},{"type":"concept","label":"发作期保护而非强制","tag":"关联考点","detail":"保护头部、移开危险物、观察呼吸与记录发作，不强塞物品或用力压住肢体。","ref":"多发性硬化、帕金森病与癫痫｜ice冰冰·高分学姐团","chapter":"多发性硬化、帕金森病与癫痫｜ice冰冰·高分学姐团","href":"medical/neurology/study-04.html","kind":"safe","relation":""},{"type":"cross","label":"β受体拮抗药用药观察","tag":"跨章节数值 · 心力衰竭","detail":"β受体拮抗药用药观察：心率＜60次/min时及时报告。适用条件与安全边界：同时观察血压、体重及心衰变化；不据单一网页数值自行统一停药或加药。","ref":"教材 P144","chapter":"心力衰竭｜ice冰冰·高分学姐团","href":"medical/cardiovascular/heart-failure.html","kind":"cross"},{"type":"cross","label":"收缩压150～220 mmHg","tag":"跨章节数值 · 神经系统 · 脑出血","detail":"收缩压150～220 mmHg：无急性降压禁忌时，降至约140 mmHg通常安全。适用条件与安全边界：降压过快、过低可造成脑低灌注；连续或高频监测血压与神经体征，避免明显波动","ref":"教材P632","chapter":"神经系统｜脑出血｜内科护理学第7版","href":"medical/neurology/section-04.html","kind":"cross"},{"type":"cross","label":"内科护理总论","tag":"跨章节 · 内科护理总论","detail":"以内科疾病患者为对象，用护理程序把疾病证据、患者反应、治疗安全和连续照护连成完整判断链。","ref":"内科护理总论｜ice冰冰·高分学姐团","chapter":"内科护理总论｜ice冰冰·高分学姐团","href":"medical/introduction/study-01.html","kind":"cross","relation":"安全"},{"type":"cross","label":"常见症状评估","tag":"跨章节 · 呼吸系统症状与感染性疾病","detail":"咳嗽、痰液、呼吸困难和咯血要结合起病方式、诱因、量、颜色及伴随表现判断。","ref":"呼吸系统症状与感染性疾病｜ice冰冰·高分学姐团","chapter":"呼吸系统症状与感染性疾病｜ice冰冰·高分学姐团","href":"medical/respiratory/study-01.html","kind":"cross","relation":"呼吸"},{"type":"cross","label":"咯血先防窒息","tag":"跨章节 · 呼吸系统症状与感染性疾病","detail":"观察出血量、速度、咳出能力、意识与呼吸。大量出血且不能咳出时，气道威胁优先于常规排痰训练。","ref":"呼吸系统症状与感染性疾病｜ice冰冰·高分学姐团","chapter":"呼吸系统症状与感染性疾病｜ice冰冰·高分学姐团","href":"medical/respiratory/study-01.html","kind":"cross","relation":"呼吸"}]},{"id":"medical/neurology/study-05.html","label":"偏头痛、脊髓与周围神经疾病","title":"以“偏头痛、脊髓与周围神经疾病”为中心｜用途、数值与跨章联系","center":"偏头痛、脊髓与周围神经疾病","chapter":"偏头痛、脊髓与周围神经疾病｜ice冰冰·高分学姐团","href":"medical/neurology/study-05.html","items":[{"type":"concept","label":"偏头痛","tag":"关联考点","detail":"反复发作性头痛可伴恶心及声光敏感，诱因管理与规范用药同样重要。","ref":"偏头痛、脊髓与周围神经疾病｜ice冰冰·高分学姐团","chapter":"偏头痛、脊髓与周围神经疾病｜ice冰冰·高分学姐团","href":"medical/neurology/study-05.html","kind":"normal","relation":""},{"type":"concept","label":"原有规律改变要警惕","tag":"关联考点","detail":"记录头痛特点、诱因和伴随表现，配合急性及预防性治疗并减少诱因。","ref":"偏头痛、脊髓与周围神经疾病｜ice冰冰·高分学姐团","chapter":"偏头痛、脊髓与周围神经疾病｜ice冰冰·高分学姐团","href":"medical/neurology/study-05.html","kind":"normal","relation":""},{"type":"concept","label":"急性脊髓炎","tag":"关联考点","detail":"脊髓横贯损害可出现运动、感觉和自主神经功能障碍。","ref":"偏头痛、脊髓与周围神经疾病｜ice冰冰·高分学姐团","chapter":"偏头痛、脊髓与周围神经疾病｜ice冰冰·高分学姐团","href":"medical/neurology/study-05.html","kind":"normal","relation":""},{"type":"concept","label":"损伤平面与自主功能","tag":"关联考点","detail":"双下肢或四肢无力结合感觉平面、尿便障碍帮助定位，预防皮肤、呼吸和泌尿并发症。","ref":"偏头痛、脊髓与周围神经疾病｜ice冰冰·高分学姐团","chapter":"偏头痛、脊髓与周围神经疾病｜ice冰冰·高分学姐团","href":"medical/neurology/study-05.html","kind":"safe","relation":""},{"type":"concept","label":"周围神经疾病","tag":"关联考点","detail":"面神经麻痹、吉兰-巴雷等表现不同，后者上升性无力时需严密观察呼吸功能。","ref":"偏头痛、脊髓与周围神经疾病｜ice冰冰·高分学姐团","chapter":"偏头痛、脊髓与周围神经疾病｜ice冰冰·高分学姐团","href":"medical/neurology/study-05.html","kind":"normal","relation":""},{"type":"concept","label":"局部脑神经与上升性无力","tag":"关联考点","detail":"三叉神经痛、面神经麻痹和吉兰-巴雷综合征的分布不同；快速进展无力需监测呼吸肌。","ref":"偏头痛、脊髓与周围神经疾病｜ice冰冰·高分学姐团","chapter":"偏头痛、脊髓与周围神经疾病｜ice冰冰·高分学姐团","href":"medical/neurology/study-05.html","kind":"safe","relation":""},{"type":"concept","label":"重症肌无力","tag":"关联考点","detail":"波动性骨骼肌无力常活动后加重、休息后减轻，危象时吞咽和呼吸受威胁。","ref":"偏头痛、脊髓与周围神经疾病｜ice冰冰·高分学姐团","chapter":"偏头痛、脊髓与周围神经疾病｜ice冰冰·高分学姐团","href":"medical/neurology/study-05.html","kind":"normal","relation":""},{"type":"concept","label":"疲劳性与危象","tag":"关联考点","detail":"晨轻暮重、活动后加重是线索，吞咽、咳嗽和呼吸肌受累须及时评估危象及药物史。","ref":"偏头痛、脊髓与周围神经疾病｜ice冰冰·高分学姐团","chapter":"偏头痛、脊髓与周围神经疾病｜ice冰冰·高分学姐团","href":"medical/neurology/study-05.html","kind":"normal","relation":""},{"type":"concept","label":"腰穿与脑血管介入","tag":"关联考点","detail":"操作前评估禁忌，操作后观察神经状态、穿刺部位、远端循环和相关并发症。","ref":"偏头痛、脊髓与周围神经疾病｜ice冰冰·高分学姐团","chapter":"偏头痛、脊髓与周围神经疾病｜ice冰冰·高分学姐团","href":"medical/neurology/study-05.html","kind":"safe","relation":""},{"type":"concept","label":"术前禁忌与术后风险","tag":"关联考点","detail":"腰穿关注颅内压及出血风险，介入前后关注神经功能、造影反应、穿刺处及远端循环。","ref":"偏头痛、脊髓与周围神经疾病｜ice冰冰·高分学姐团","chapter":"偏头痛、脊髓与周围神经疾病｜ice冰冰·高分学姐团","href":"medical/neurology/study-05.html","kind":"safe","relation":""},{"type":"concept","label":"周围神经疾病不是同一类无力","tag":"关联考点","detail":"三叉神经痛关注阵发性面痛诱因，面神经麻痹关注闭眼及角膜保护，吉兰-巴雷综合征关注进展性无力与呼吸。","ref":"偏头痛、脊髓与周围神经疾病｜ice冰冰·高分学姐团","chapter":"偏头痛、脊髓与周围神经疾病｜ice冰冰·高分学姐团","href":"medical/neurology/study-05.html","kind":"normal","relation":""},{"type":"concept","label":"周期性瘫痪联系电解质","tag":"关联考点","detail":"低钾性周期性瘫痪可在饱餐或剧烈活动后休息等背景发生，评估肌力、血钾及心电变化。","ref":"偏头痛、脊髓与周围神经疾病｜ice冰冰·高分学姐团","chapter":"偏头痛、脊髓与周围神经疾病｜ice冰冰·高分学姐团","href":"medical/neurology/study-05.html","kind":"normal","relation":""},{"type":"cross","label":"体重变化警示","tag":"跨章节数值 · 心力衰竭","detail":"体重变化警示：3天内增加＞2 kg。适用条件与安全边界：相同时间、衣着和体重计测量；提示可能水钠潴留，结合症状及时评估。","ref":"教材 P146","chapter":"心力衰竭｜ice冰冰·高分学姐团","href":"medical/cardiovascular/heart-failure.html","kind":"cross"},{"type":"cross","label":"β受体拮抗药用药观察","tag":"跨章节数值 · 心力衰竭","detail":"β受体拮抗药用药观察：心率＜60次/min时及时报告。适用条件与安全边界：同时观察血压、体重及心衰变化；不据单一网页数值自行统一停药或加药。","ref":"教材 P144","chapter":"心力衰竭｜ice冰冰·高分学姐团","href":"medical/cardiovascular/heart-failure.html","kind":"cross"},{"type":"cross","label":"护理程序要循环","tag":"跨章节 · 内科护理总论","detail":"评估资料后识别护理问题，与患者共同确定可观察的目标，再实施和评价。评价不达标要回到原因和计划，不能只勾选“已宣教”。","ref":"内科护理总论｜ice冰冰·高分学姐团","chapter":"内科护理总论｜ice冰冰·高分学姐团","href":"medical/introduction/study-01.html","kind":"cross","relation":"评估"},{"type":"cross","label":"常见症状评估","tag":"跨章节 · 呼吸系统症状与感染性疾病","detail":"咳嗽、痰液、呼吸困难和咯血要结合起病方式、诱因、量、颜色及伴随表现判断。","ref":"呼吸系统症状与感染性疾病｜ice冰冰·高分学姐团","chapter":"呼吸系统症状与感染性疾病｜ice冰冰·高分学姐团","href":"medical/respiratory/study-01.html","kind":"cross","relation":"呼吸 / 咳嗽"},{"type":"cross","label":"咯血先防窒息","tag":"跨章节 · 呼吸系统症状与感染性疾病","detail":"观察出血量、速度、咳出能力、意识与呼吸。大量出血且不能咳出时，气道威胁优先于常规排痰训练。","ref":"呼吸系统症状与感染性疾病｜ice冰冰·高分学姐团","chapter":"呼吸系统症状与感染性疾病｜ice冰冰·高分学姐团","href":"medical/respiratory/study-01.html","kind":"cross","relation":"呼吸 / 出血"}]},{"id":"medical/cardiovascular/heart-failure.html","label":"心力衰竭","title":"以“心力衰竭”为中心｜用途、数值与跨章联系","center":"心力衰竭","chapter":"心力衰竭｜ice冰冰·高分学姐团","href":"medical/cardiovascular/heart-failure.html","items":[{"type":"number","label":"氧疗适用条件","tag":"SpO₂＜90%","detail":"氧疗适用条件：SpO₂＜90%。适用条件与安全边界：慢性心衰伴低氧血症时考虑氧疗；不是所有心衰患者常规吸氧。","ref":"教材 P144","chapter":"心力衰竭｜ice冰冰·高分学姐团","href":"medical/cardiovascular/heart-failure.html","kind":"normal"},{"type":"number","label":"体重变化警示","tag":"3天内增加＞2 kg","detail":"体重变化警示：3天内增加＞2 kg。适用条件与安全边界：相同时间、衣着和体重计测量；提示可能水钠潴留，结合症状及时评估。","ref":"教材 P146","chapter":"心力衰竭｜ice冰冰·高分学姐团","href":"medical/cardiovascular/heart-failure.html","kind":"normal"},{"type":"number","label":"液体入量","tag":"1.5—2.0 L/d","detail":"液体入量：1.5—2.0 L/d。适用条件与安全边界：教材慢性心衰体液管理范围；按充血、灌注、肾功能和个体医嘱调整。","ref":"教材 P145","chapter":"心力衰竭｜ice冰冰·高分学姐团","href":"medical/cardiovascular/heart-failure.html","kind":"normal"},{"type":"number","label":"钠摄入量","tag":"2—3 g/d","detail":"钠摄入量：2—3 g/d。适用条件与安全边界：对象是“钠”，不能直接当成同等克数的食盐。","ref":"教材 P145","chapter":"心力衰竭｜ice冰冰·高分学姐团","href":"medical/cardiovascular/heart-failure.html","kind":"safe"},{"type":"number","label":"一般液体负平衡","tag":"约500 mL/d","detail":"一般液体负平衡：约500 mL/d。适用条件与安全边界：教材慢性心衰充血管理的一般值；同时防止低血容量，不能套用于低灌注状态。","ref":"教材 P145","chapter":"心力衰竭｜ice冰冰·高分学姐团","href":"medical/cardiovascular/heart-failure.html","kind":"safe"},{"type":"number","label":"β受体拮抗药用药观察","tag":"心率＜60次/min时及时报告","detail":"β受体拮抗药用药观察：心率＜60次/min时及时报告。适用条件与安全边界：同时观察血压、体重及心衰变化；不据单一网页数值自行统一停药或加药。","ref":"教材 P144","chapter":"心力衰竭｜ice冰冰·高分学姐团","href":"medical/cardiovascular/heart-failure.html","kind":"normal"},{"type":"number","label":"6分钟步行距离","tag":"＜150 m；150—450 m；＞450 m","detail":"6分钟步行距离：＜150 m；150—450 m；＞450 m。适用条件与安全边界：教材分别用于重、中、轻度心衰的运动耐量评价；不是NYHA分级，也不用于急性恶化时强行测试。","ref":"教材 P141","chapter":"心力衰竭｜ice冰冰·高分学姐团","href":"medical/cardiovascular/heart-failure.html","kind":"normal"},{"type":"number","label":"左室射血分数 LVEF","tag":"≤40%提示收缩功能障碍","detail":"左室射血分数 LVEF：≤40%提示收缩功能障碍。适用条件与安全边界：教材本段正常值为＞50%；射血分数正常仍可能存在舒张功能不全，不能因此排除心衰。","ref":"教材 P141","chapter":"心力衰竭｜ice冰冰·高分学姐团","href":"medical/cardiovascular/heart-failure.html","kind":"safe"},{"type":"cross","label":"慢性心力衰竭","tag":"跨章节 · 循环症状、慢性心力衰竭与心肌疾病","detail":"心排出量下降和容量负荷增加导致呼吸困难、水肿与乏力，护理重在容量、症状、用药和自我监测。","ref":"循环症状、慢性心力衰竭与心肌疾病｜ice冰冰·高分学姐团","chapter":"循环症状、慢性心力衰竭与心肌疾病｜ice冰冰·高分学姐团","href":"medical/cardiovascular/study-01.html","kind":"cross","relation":"心力衰竭"},{"type":"cross","label":"急性心力衰竭","tag":"跨章节 · 急性心力衰竭、心律失常与心脏骤停","detail":"突发严重呼吸困难、端坐呼吸和肺水肿表现需立即减轻心肺负荷并改善氧合。","ref":"急性心力衰竭、心律失常与心脏骤停｜ice冰冰·高分学姐团","chapter":"急性心力衰竭、心律失常与心脏骤停｜ice冰冰·高分学姐团","href":"medical/cardiovascular/study-02.html","kind":"cross","relation":"心力衰竭"}]},{"id":"medical/endocrine-metabolic/section-07.html","label":"内分泌与代谢 · 糖尿病","title":"以“内分泌与代谢 · 糖尿病”为中心｜用途、数值与跨章联系","center":"内分泌与代谢 · 糖尿病","chapter":"内分泌与代谢｜糖尿病｜内科护理学第7版","href":"medical/endocrine-metabolic/section-07.html","items":[{"type":"number","label":"二甲双胍","tag":"2型糖尿病常用基础药","detail":"二甲双胍：2型糖尿病常用基础药。适用条件与安全边界：胃肠反应、维生素B12缺乏；严重肾功能不全时乳酸酸中毒风险；结合肾功能使用；造影及急性缺氧等情境按医嘱暂停；观察胃肠反应","ref":"教材P508—529","chapter":"内分泌与代谢｜糖尿病｜内科护理学第7版","href":"medical/endocrine-metabolic/section-07.html","kind":"safe"},{"type":"number","label":"胰岛素","tag":"1型糖尿病、严重高血糖及特定应激情境","detail":"胰岛素：1型糖尿病、严重高血糖及特定应激情境。适用条件与安全边界：低血糖、体重增加、低钾、注射部位脂肪增生；核对种类剂量与进餐；轮换注射部位；监测血糖和低血糖表现","ref":"教材P508","chapter":"内分泌与代谢｜糖尿病｜内科护理学第7版","href":"medical/endocrine-metabolic/section-07.html","kind":"safe"}]},{"id":"medical/hematology/section-02.html","label":"血液系统 · 缺铁性与巨幼细胞贫血","title":"以“血液系统 · 缺铁性与巨幼细胞贫血”为中心｜用途、数值与跨章联系","center":"血液系统 · 缺铁性与巨幼细胞贫血","chapter":"血液系统｜缺铁性与巨幼细胞贫血｜内科护理学第7版","href":"medical/hematology/section-02.html","items":[{"type":"number","label":"维生素B12","tag":"维生素B12缺乏性巨幼细胞贫血","detail":"维生素B12：维生素B12缺乏性巨幼细胞贫血。适用条件与安全边界：过敏反应少见；纠正后可出现低钾；有神经症状者尽早治疗；恶性贫血常需长期替代；监测血钾和血象","ref":"教材P401","chapter":"血液系统｜缺铁性与巨幼细胞贫血｜内科护理学第7版","href":"medical/hematology/section-02.html","kind":"safe"}]},{"id":"medical/neurology/section-04.html","label":"神经系统 · 脑出血","title":"以“神经系统 · 脑出血”为中心｜用途、数值与跨章联系","center":"神经系统 · 脑出血","chapter":"神经系统｜脑出血｜内科护理学第7版","href":"medical/neurology/section-04.html","items":[{"type":"number","label":"脑水肿高峰","tag":"出血后约48小时达高峰","detail":"脑水肿高峰：出血后约48小时达高峰。适用条件与安全边界：颅内压进一步升高并诱发脑疝；连续评估意识、瞳孔、生命体征、呕吐和肢体变化","ref":"教材P631—633","chapter":"神经系统｜脑出血｜内科护理学第7版","href":"medical/neurology/section-04.html","kind":"normal"},{"type":"number","label":"外科治疗参考界值","tag":"壳核出血≥30 ml；丘脑出血≥15 ml；小脑出血≥10 ml或直径＞3 cm","detail":"外科治疗参考界值：壳核出血≥30 ml；丘脑出血≥15 ml；小脑出血≥10 ml或直径＞3 cm。适用条件与安全边界：继续扩大的血肿可加重占位效应、脑积水和脑疝；动态观察神经体征，配合复查影像并做好脑室引流或血肿清除准备","ref":"教材P632","chapter":"神经系统｜脑出血｜内科护理学第7版","href":"medical/neurology/section-04.html","kind":"normal"},{"type":"number","label":"收缩压150～220 mmHg","tag":"无急性降压禁忌时，降至约140 mmHg通常安全","detail":"收缩压150～220 mmHg：无急性降压禁忌时，降至约140 mmHg通常安全。适用条件与安全边界：降压过快、过低可造成脑低灌注；连续或高频监测血压与神经体征，避免明显波动","ref":"教材P632","chapter":"神经系统｜脑出血｜内科护理学第7版","href":"medical/neurology/section-04.html","kind":"safe"},{"type":"number","label":"急性期卧床","tag":"一般卧床休息2～4周，病情稳定后循序康复","detail":"急性期卧床：一般卧床休息2～4周，病情稳定后循序康复。适用条件与安全边界：长期不动可致压力性损伤、坠积性肺炎和静脉血栓；保持头颈中立、肢体功能位，实施皮肤、气道、排便和血栓预防护理","ref":"教材P632—634","chapter":"神经系统｜脑出血｜内科护理学第7版","href":"medical/neurology/section-04.html","kind":"normal"},{"type":"cross","label":"数字减影血管造影（DSA）","tag":"跨章节数值 · 神经系统 · 蛛网膜下腔出血","detail":"数字减影血管造影（DSA）：教材建议首次出血后3天内或3周后检查，尽量避开高风险期。适用条件与安全边界：穿刺出血、造影剂过敏/肾损伤及血管事件；术前核对凝血和肾功能；术后观察穿刺点、远端血运和神经变化","ref":"教材P636、638","chapter":"神经系统｜蛛网膜下腔出血｜内科护理学第7版","href":"medical/neurology/section-05.html","kind":"cross"},{"type":"cross","label":"脑血管痉挛","tag":"跨章节数值 · 神经系统 · 蛛网膜下腔出血","detail":"脑血管痉挛：出血后3～5天开始，5～14天为高峰。适用条件与安全边界：新发偏瘫、失语或意识恶化，可能遗留永久神经损害；连续神经评估；出现新局灶体征立即报告并结合影像/血流检查复评","ref":"教材P636—637","chapter":"神经系统｜蛛网膜下腔出血｜内科护理学第7版","href":"medical/neurology/section-05.html","kind":"cross"},{"type":"cross","label":"咯血先防窒息","tag":"跨章节 · 呼吸系统症状与感染性疾病","detail":"观察出血量、速度、咳出能力、意识与呼吸。大量出血且不能咳出时，气道威胁优先于常规排痰训练。","ref":"呼吸系统症状与感染性疾病｜ice冰冰·高分学姐团","chapter":"呼吸系统症状与感染性疾病｜ice冰冰·高分学姐团","href":"medical/respiratory/study-01.html","kind":"cross","relation":"出血"},{"type":"cross","label":"支气管镜与胸穿","tag":"跨章节 · 肺癌、胸膜疾病与呼吸系统诊疗","detail":"操作前核对禁忌和知情准备，操作后重点观察出血、气胸、呼吸状态及局麻恢复。","ref":"肺癌、胸膜疾病与呼吸系统诊疗｜ice冰冰·高分学姐团","chapter":"肺癌、胸膜疾病与呼吸系统诊疗｜ice冰冰·高分学姐团","href":"medical/respiratory/study-05.html","kind":"cross","relation":"出血"},{"type":"cross","label":"按检查前中后组织","tag":"跨章节 · 肺癌、胸膜疾病与呼吸系统诊疗","detail":"术前核对准备和禁忌，操作中监测耐受，术后关注出血、气胸和吞咽恢复。","ref":"肺癌、胸膜疾病与呼吸系统诊疗｜ice冰冰·高分学姐团","chapter":"肺癌、胸膜疾病与呼吸系统诊疗｜ice冰冰·高分学姐团","href":"medical/respiratory/study-05.html","kind":"cross","relation":"出血"}]},{"id":"medical/neurology/section-05.html","label":"神经系统 · 蛛网膜下腔出血","title":"以“神经系统 · 蛛网膜下腔出血”为中心｜用途、数值与跨章联系","center":"神经系统 · 蛛网膜下腔出血","chapter":"神经系统｜蛛网膜下腔出血｜内科护理学第7版","href":"medical/neurology/section-05.html","items":[{"type":"number","label":"尼莫地平","tag":"40～60 mg，每日4～6次，连用21天","detail":"尼莫地平：40～60 mg，每日4～6次，连用21天。适用条件与安全边界：低血压、心率改变、头痛、潮红和胃肠不适；按时给药并监测血压、心率和新发局灶体征，避免低血压降低脑灌注","ref":"教材P637","chapter":"神经系统｜蛛网膜下腔出血｜内科护理学第7版","href":"medical/neurology/section-05.html","kind":"safe"},{"type":"number","label":"腰椎穿刺","tag":"无禁忌时，均匀一致血性脑脊液且压力＞200 mmH₂O支持诊断","detail":"腰椎穿刺：无禁忌时，均匀一致血性脑脊液且压力＞200 mmH₂O支持诊断。适用条件与安全边界：颅内压明显升高或占位时可能诱发脑疝；先排除禁忌；术后观察意识、瞳孔、头痛和穿刺点","ref":"教材P636","chapter":"神经系统｜蛛网膜下腔出血｜内科护理学第7版","href":"medical/neurology/section-05.html","kind":"safe"},{"type":"number","label":"数字减影血管造影（DSA）","tag":"教材建议首次出血后3天内或3周后检查，尽量避开高风险期","detail":"数字减影血管造影（DSA）：教材建议首次出血后3天内或3周后检查，尽量避开高风险期。适用条件与安全边界：穿刺出血、造影剂过敏/肾损伤及血管事件；术前核对凝血和肾功能；术后观察穿刺点、远端血运和神经变化","ref":"教材P636、638","chapter":"神经系统｜蛛网膜下腔出血｜内科护理学第7版","href":"medical/neurology/section-05.html","kind":"normal"},{"type":"number","label":"脑血管痉挛","tag":"出血后3～5天开始，5～14天为高峰","detail":"脑血管痉挛：出血后3～5天开始，5～14天为高峰。适用条件与安全边界：新发偏瘫、失语或意识恶化，可能遗留永久神经损害；连续神经评估；出现新局灶体征立即报告并结合影像/血流检查复评","ref":"教材P636—637","chapter":"神经系统｜蛛网膜下腔出血｜内科护理学第7版","href":"medical/neurology/section-05.html","kind":"normal"},{"type":"number","label":"绝对卧床与床头角度","tag":"绝对卧床4～6周，床头抬高15°～20°","detail":"绝对卧床与床头角度：绝对卧床4～6周，床头抬高15°～20°。适用条件与安全边界：用力排便、剧烈咳嗽、情绪激动或过早活动可诱发再出血；集中操作、限制刺激，保持大便通畅但避免大量灌肠，协助所有生活活动","ref":"教材P636—637","chapter":"神经系统｜蛛网膜下腔出血｜内科护理学第7版","href":"medical/neurology/section-05.html","kind":"safe"},{"type":"number","label":"再出血高风险期","tag":"最初24小时风险最大，病后10～14天仍需高度警惕","detail":"再出血高风险期：最初24小时风险最大，病后10～14天仍需高度警惕。适用条件与安全边界：再次破裂可迅速导致颅压升高、昏迷和死亡；立即停止活动、保持安静，监测神经与生命体征并配合复查和病因治疗","ref":"教材P635—637","chapter":"神经系统｜蛛网膜下腔出血｜内科护理学第7版","href":"medical/neurology/section-05.html","kind":"safe"},{"type":"cross","label":"脑水肿高峰","tag":"跨章节数值 · 神经系统 · 脑出血","detail":"脑水肿高峰：出血后约48小时达高峰。适用条件与安全边界：颅内压进一步升高并诱发脑疝；连续评估意识、瞳孔、生命体征、呕吐和肢体变化","ref":"教材P631—633","chapter":"神经系统｜脑出血｜内科护理学第7版","href":"medical/neurology/section-04.html","kind":"cross"},{"type":"cross","label":"外科治疗参考界值","tag":"跨章节数值 · 神经系统 · 脑出血","detail":"外科治疗参考界值：壳核出血≥30 ml；丘脑出血≥15 ml；小脑出血≥10 ml或直径＞3 cm。适用条件与安全边界：继续扩大的血肿可加重占位效应、脑积水和脑疝；动态观察神经体征，配合复查影像并做好脑室引流或血肿清除准备","ref":"教材P632","chapter":"神经系统｜脑出血｜内科护理学第7版","href":"medical/neurology/section-04.html","kind":"cross"},{"type":"cross","label":"咯血先防窒息","tag":"跨章节 · 呼吸 的分支点";$("#prev").disabled=offset===0;$("#next").disabled=offset+6>=list.length;if(!selected&&shown.length){selected=shown[0].label;detailFor(shown[0])}else if(selected==="__center")detailCenter(m);else{const n=list.find(x=>x.label===selected);if(n)detailFor(n)}renderHighlight()}
function renderHighlight(){svg.querySelectorAll("[data-item]").forEach(g=>{const n=MAPS[mi].items[Number(g.dataset.item)];g.classList.toggle("active",n.label===selected)})}
function detailFor(n){const type=n.type==="number"?"关键参数与条件":n.kind==="safe"?"安全边界":n.type==="cross"?"跨章节关联":"关联知识点";$("#detail").innerHTML='<span class="pill">'+esc(type)+'</span><h3>'+esc(n.label)+'</h3>'+(n.type==="number"?'<div class="value">'+esc(n.tag)+'</div>':'')+'<p>'+esc(n.detail)+'</p><div class="ref">'+esc(n.ref||n.chapter)+'</div><p class="small">所属章节：'+esc(n.chapter)+'</p><a href="../'+esc(n.href||MAPS[mi].href)+'">打开来源章节 →</a><p class="small">关系路径：中心概念 → 关键参数 → 使用情境 → 安全边界 → 跨章节关联</p>'}
function detailCenter(m){$("#detail").innerHTML='<span class="pill">中心概念</span><h3>'+esc(m.center)+'</h3><p>图中把该概念对应的用途、参数、题干情境和风险边界连接起来。点选外圈分支查看具体内容与教材页码。</p><div class="ref">'+esc(m.chapter)+'</div><p class="small">本图关联点：'+m.items.length+' 个；其中有明确数值的节点：'+m.items.filter(n=>n.type==="number").length+' 条。</p><a href="../'+esc(m.href)+'">打开来源章节 →</a>'}
