<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>内科护理学｜跨章节知识图谱</title><style>
:root{--ink:#30283b;--muted:#786e83;--purple:#7150ae;--line:#e2d6f1;--bg:#f7f3fb;--safe:#e9f6f2;--warn:#fff4dc}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 "Microsoft YaHei",sans-serif}.wrap{max-width:1120px;margin:auto;padding:20px}.hero{color:#fff;padding:25px 28px;border-radius:24px;background:linear-gradient(120deg,#553b8c,#8866bd)}.hero small{letter-spacing:.1em}.hero h1{margin:5px 0;font-size:clamp(26px,4vw,38px)}.hero p{margin:0;opacity:.93}.crumb{display:block;margin-top:10px;color:#f4edff}.layout{display:grid;grid-template-columns:1.3fr .8fr;gap:15px;margin-top:16px}.panel{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 10px 28px #4931660c}.panel h2{font-size:19px;margin:0}.muted{color:var(--muted);font-size:13px;margin:4px 0 12px}.map{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:stretch}.center{grid-column:1/-1;text-align:center;color:#fff;background:var(--purple);padding:12px;border-radius:15px;font-weight:800}.center small{display:block;color:#eee5ff;font-weight:400}.node{border:1px solid var(--line);border-radius:15px;padding:12px;background:#fff;cursor:pointer;text-align:left;color:var(--ink);font:inherit;min-height:92px}.node:hover,.node:focus{border-color:#8d6bc4;background:#f8f4fc;outline:2px solid #eee5fa}.node.safe{background:var(--safe);border-color:#c5e7dc}.node.warn{background:var(--warn);border-color:#ead9aa}.node b{display:block;font-size:15px}.node small{display:block;color:var(--muted);margin-top:3px}.badge{font-size:11px;color:#67439c;font-weight:800}.detail{position:sticky;top:14px}.pill{display:inline-block;padding:3px 9px;background:#f0e9fb;color:#67439c;border-radius:99px;font-size:12px;font-weight:800}.source{background:#f6f2fa;border-radius:11px;padding:11px;font-size:13px;color:#6f647c}.foot{font-size:12px;color:#83788e;margin-top:14px}@media(max-width:760px){.wrap{padding:11px}.hero{padding:21px}.layout{grid-template-columns:1fr}.detail{position:static}.map{gap:8px}.node{padding:10px;font-size:14px}}
</style></head><body><main class="wrap"><header class="hero"><small>ICE冰冰·高分学姐团｜跨章节主题卡</small><h1>内科护理学知识图谱</h1><p>用心功能变化连接症状体征、评估线索与护理观察，避免把单项指标孤立记忆。</p><a class="crumb" href="../">← 返回护理考研学习中心</a></header><div class="layout"><section class="panel"><h2>以“慢性心力衰竭”为中心</h2><p class="muted">点击节点，查看它在不同章节中的位置、正误辨析和记忆线索。</p><div class="map"><div class="center">心力衰竭<small>中心概念 · 跨章串联</small></div><button class="node " data-i="0"><b>左心衰：肺循环淤血</b><small>呼吸困难、咳嗽等线索</small><span class="badge">知识分支</span></button><button class="node " data-i="1"><b>右心衰：体循环淤血</b><small>水肿、颈静脉等线索</small><span class="badge">知识分支</span></button><button class="node " data-i="2"><b>NYHA心功能分级</b><small>按活动受限程度</small><span class="badge">知识分支</span></button><button class="node " data-i="3"><b>评估线索不等于单独确诊</b><small>症状、体征、检查共同看</small><span class="badge">知识分支</span></button><button class="node warn" data-i="4"><b>易混：左心衰 ≠ 右心衰</b><small>肺循环 vs 体循环淤血</small><span class="badge">⚠ 易错辨析</span></button><button class="node " data-i="5"><b>护理观察</b><small>呼吸、循环、液体状态</small><span class="badge">知识分支</span></button></div><p class="foot">图卡原则：正确用途与错误说法分开标识；教材版本或题源未确认时明确提示复核。</p></section><aside class="panel detail" id="detail"><span class="pill">知识分支</span><h2>左心衰：肺循环淤血</h2><p>左心泵血受限时，肺循环淤血相关表现是重要理解主线。结合活动耐量、呼吸表现和体征综合判断。</p><div class="source">内科心血管系统｜具体章节页码以教材版本核对</div></aside></div></main><script>const nodes=[{"title":"左心衰：肺循环淤血","short":"呼吸困难、咳嗽等线索","body":"左心泵血受限时，肺循环淤血相关表现是重要理解主线。结合活动耐量、呼吸表现和体征综合判断。","source":"内科心血管系统｜具体章节页码以教材版本核对"},{"title":"右心衰：体循环淤血","short":"水肿、颈静脉等线索","body":"右心功能受损与体循环静脉淤血相关。与左心衰分开辨认，同时记住两者可并存或前后相继。","source":"内科心血管系统｜具体章节页码以教材版本核对"},{"title":"NYHA心功能分级","short":"按活动受限程度","body":"分级核心是日常活动引发症状的程度，用于表达功能状态；不可与疾病病程分期或射血分数分类混为一谈。","source":"内科心血管系统｜需按教材分级表逐项校核"},{"title":"评估线索不等于单独确诊","short":"症状、体征、检查共同看","body":"心衰判断需结合病史、症状、体征和辅助检查。某一项指标不能脱离临床情境被当作全部结论。","source":"内科心血管系统｜检查与评估章节；待补教材页码"},{"title":"易混：左心衰 ≠ 右心衰","short":"肺循环 vs 体循环淤血","body":"记忆抓手：左侧优先联想肺循环淤血，右侧优先联想体循环淤血；实际患者可能兼有两侧表现。","source":"内科心血管系统｜关联考点卡","kind":"warn"},{"title":"护理观察","short":"呼吸、循环、液体状态","body":"持续观察症状变化、活动耐量、呼吸与循环表现及液体状态，并按教材护理计划评估反应。","source":"内科心血管系统｜护理评估与措施"}];document.querySelectorAll('.node').forEach(b=>b.onclick=()=>{const n=nodes[+b.dataset.i];document.querySelector('#detail').innerHTML='<span class="pill">'+(n.kind==='warn'?'易错辨析':n.kind==='safe'?'安全边界':'知识分支')+'</span><h2>'+n.title+'</h2><p>'+n.body+'</p><div class="source">'+n.source+'</div>'});</script></body></html>
