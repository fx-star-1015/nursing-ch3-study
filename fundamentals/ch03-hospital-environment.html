<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="refresh" content="0;url=ch03-infection-control.html"><link rel="canonical" href="ch03-infection-control.html"><title>正在进入基础护理学第3章</title><style>body{display:grid;place-items:center;min-height:100vh;margin:0;font:16px/1.7 "Microsoft YaHei",sans-serif;background:#f8f5ff;color:#4f367b}a{color:#7048b7;font-weight:800}
.student-notes{margin:16px 0;padding:22px;border:1px solid var(--line,#ded2f1);border-radius:22px;background:#fff;box-shadow:var(--shadow,0 14px 36px rgba(74,45,120,.09))}.student-notes-head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;padding-bottom:12px;border-bottom:1px solid var(--line,#ded2f1)}.student-notes-head h2{margin:0;font-size:clamp(22px,3vw,29px)}.student-notes-head p{margin:3px 0 0;color:var(--muted,#756d84)}.student-notes-badge{white-space:nowrap;border-radius:99px;padding:5px 10px;font-size:12px;font-weight:900;background:var(--lav,#f0e8ff);color:var(--p,#7048b7)}.student-note-editor{display:grid;grid-template-columns:220px 1fr auto;gap:9px;margin-top:16px}.student-note-editor input,.student-note-editor textarea{width:100%;border:1px solid var(--line,#ded2f1);border-radius:11px;padding:10px 12px;font:inherit;background:#fdfcff}.student-note-editor textarea{min-height:52px;resize:vertical}.student-note-list{display:grid;gap:10px;margin-top:13px}.student-note-card{padding:14px;border:1px solid var(--line,#ded2f1);border-radius:14px;background:var(--lav2,#faf7ff)}.student-note-card h3{margin:0 0 6px}.student-note-card p{white-space:pre-wrap;margin:0 0 10px}.student-note-actions{display:flex;gap:7px}.student-note-empty{color:var(--muted,#756d84);padding:12px 0}.student-note-tools{display:flex;justify-content:flex-end;margin-top:12px}.student-notes button{font:inherit;border:1px solid var(--line,#ded2f1);background:#fff;color:var(--p,#7048b7);font-weight:800;border-radius:10px;padding:8px 12px;cursor:pointer}@media(max-width:850px){.student-note-editor{grid-template-columns:1fr}.student-notes-head{display:block}.student-notes-badge{display:inline-block;margin-top:8px}}
</style></head><body><p>正在进入新版第3章……<a href="ch03-infection-control.html">立即打开</a></p>
<script data-student-notes>
(()=>{const key='student-notes:'+location.pathname;let notes=[];try{notes=JSON.parse(localStorage.getItem(key)||'[]');if(!Array.isArray(notes))notes=[]}catch(e){}const title=document.getElementById('studentNoteTitle'),body=document.getElementById('studentNoteBody'),list=document.getElementById('studentNoteList');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>localStorage.setItem(key,JSON.stringify(notes));function render(){list.innerHTML=notes.length?notes.map((n,i)=>`<article class="student-note-card"><h3>${esc(n.title||'补充笔记')}</h3><p>${esc(n.body)}</p><div class="student-note-actions"><button data-student-edit="${i}">编辑</button><button data-student-delete="${i}">删除</button></div></article>`).join(''):'<p class="student-note-empty">还没有笔记。可记录课堂补充、个人错题或仍易混的细节。</p>';list.querySelectorAll('[data-student-edit]').forEach(b=>b.onclick=()=>{const i=+b.dataset.studentEdit,n=notes[i];title.value=n.title;body.value=n.body;notes.splice(i,1);save();render();title.focus()});list.querySelectorAll('[data-student-delete]').forEach(b=>b.onclick=()=>{notes.splice(+b.dataset.studentDelete,1);save();render()})}document.getElementById('studentAddNote').onclick=()=>{const value=body.value.trim();if(!value){body.focus();return}notes.push({title:title.value.trim()||'补充笔记',body:value});title.value='';body.value='';save();render()};document.getElementById('studentExportNotes').onclick=()=>{const content=[document.title,'',...notes.flatMap((n,i)=>[`${i+1}. ${n.title}`,n.body,''])].join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type:'text/plain;charset=utf-8'}));a.download=(document.title||'学习笔记')+'.txt';a.click();URL.revokeObjectURL(a.href)};render()})();
</script>
</body></html
<section id="studentNotes" class="student-notes"><div class="student-notes-head"><div><h2>我的补充笔记</h2><p>记录老师强调、个人错题和仍易混的数值；笔记保存在当前设备。</p></div><span class="student-notes-badge">我的笔记</span></div><div class="student-note-editor"><input id="studentNoteTitle" maxlength="40" placeholder="标题，如：老师强调的考点"><textarea id="studentNoteBody" placeholder="写下具体结论、适用条件、单位或错因……"></textarea><button id="studentAddNote">新增笔记</button></div><div id="studentNoteList" class="student-note-list"></div><div class="student-note-tools"><button id="studentExportNotes">导出本页笔记</button></div></section>
>
