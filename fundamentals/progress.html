<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>我的学习素养｜基础护理学</title>
<style>
:root{--ink:#2e2739;--muted:#756c81;--purple:#7149b8;--purple2:#9a7acb;--lav:#f1e9fa;--lav2:#faf7fd;--line:#e2d6ed;--green:#2e8064;--green-bg:#e8f5ee;--red:#c55151;--red-bg:#fff0ef;--paper:#fffdfa;--shadow:0 18px 50px rgba(77,48,111,.10)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:linear-gradient(180deg,#f8f3fb 0,#fffdf9 43%,#f8f4fb 100%);color:var(--ink);font:17px/1.68 "Microsoft YaHei","PingFang SC",system-ui,sans-serif}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(rgba(113,73,184,.028) 1px,transparent 1px),linear-gradient(90deg,rgba(113,73,184,.028) 1px,transparent 1px);background-size:28px 28px}
.wrap{position:relative;width:min(1120px,calc(100% - 32px));margin:0 auto;padding:30px 0 80px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px}.back{color:var(--purple);font-weight:850;text-decoration:none}.date{color:var(--muted);font-size:.9rem}
.hero{position:relative;overflow:hidden;padding:34px;border:1px solid var(--line);border-radius:30px;background:linear-gradient(128deg,#fffdfa 0%,#f2e7fb 58%,#eadff5 100%);box-shadow:var(--shadow)}.hero:after{content:"";position:absolute;width:240px;height:240px;right:-55px;top:-90px;border-radius:50%;background:rgba(255,255,255,.54)}.eyebrow{color:var(--purple);font-size:.78rem;font-weight:900;letter-spacing:.14em}.hero h1{position:relative;z-index:1;margin:8px 0 7px;font-family:"STKaiti","KaiTi",serif;font-size:clamp(2rem,5vw,3.7rem);line-height:1.12}.hero p{position:relative;z-index:1;margin:0;max-width:650px;color:var(--muted)}
.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:18px 0}.stat{padding:20px;border:1px solid var(--line);border-radius:20px;background:rgba(255,255,255,.9);box-shadow:0 8px 24px rgba(77,48,111,.06)}.stat span{display:block;color:var(--muted);font-size:.86rem;font-weight:750}.stat b{display:block;margin-top:8px;font-size:1.85rem;line-height:1.15;font-variant-numeric:tabular-nums}.stat small{color:var(--muted)}.stat.score.good b{color:var(--green)}.stat.score.low b{color:var(--red)}
.section{margin-top:18px;padding:26px;border:1px solid var(--line);border-radius:24px;background:rgba(255,255,255,.92);box-shadow:var(--shadow)}.section-head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:18px}.section h2{margin:0;font-family:"STKaiti","KaiTi",serif;font-size:1.75rem}.section-head p{margin:0;color:var(--muted);font-size:.9rem}
.weekdays,.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:9px}.weekdays span{text-align:center;color:var(--muted);font-size:.78rem}.day{position:relative;min-height:78px;padding:10px;border:1px solid #ece3f3;border-radius:15px;background:#fbf9fc}.day.out{opacity:.42}.day.today{box-shadow:0 0 0 2px var(--purple) inset}.day time{font-size:.8rem;font-weight:800}.day b{display:block;margin-top:10px;font-size:.86rem}.day small{color:var(--muted)}.heat-1{background:#f3ecfa}.heat-2{background:#e5d6f3}.heat-3{background:#cdb3e7}.heat-4{background:#a884cf;color:#fff}.heat-4 small{color:#fff}.legend{display:flex;justify-content:flex-end;align-items:center;gap:6px;margin-top:12px;color:var(--muted);font-size:.76rem}.legend i{width:17px;height:17px;border-radius:5px;border:1px solid #e3d8ed}.legend i:nth-of-type(1){background:#fbf9fc}.legend i:nth-of-type(2){background:#e5d6f3}.legend i:nth-of-type(3){background:#cdb3e7}.legend i:nth-of-type(4){background:#a884cf}
.mood-wall{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px}.note{min-height:132px;padding:18px 16px;border-radius:5px 5px 18px 5px;box-shadow:0 9px 18px rgba(70,46,88,.09);transform:rotate(var(--r));background:var(--note);border:1px solid rgba(74,48,92,.08)}.note:nth-child(4n+1){--r:-1deg;--note:#fff1b9}.note:nth-child(4n+2){--r:1.2deg;--note:#eadcf7}.note:nth-child(4n+3){--r:-.6deg;--note:#dcefe8}.note:nth-child(4n){--r:.8deg;--note:#ffe4df}.note .mood-glyph{width:38px;height:38px;display:block}.note .mood-glyph .mood-art{width:38px;height:38px}.note b{display:block;margin-top:5px}.note time{color:#736a7c;font-size:.8rem}.empty{grid-column:1/-1;padding:25px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:16px;background:var(--lav2)}
.accuracy-list{display:grid;gap:10px}.accuracy-row{display:grid;grid-template-columns:88px 1fr 70px;align-items:center;gap:12px}.accuracy-row time{color:var(--muted);font-size:.88rem}.track{height:14px;overflow:hidden;border-radius:999px;background:#eee8f1}.fill{height:100%;border-radius:inherit}.accuracy-row.good .fill{background:linear-gradient(90deg,#69b493,var(--green))}.accuracy-row.low .fill{background:linear-gradient(90deg,#e88980,var(--red))}.accuracy-row b{text-align:right}.accuracy-row.good b{color:var(--green)}.accuracy-row.low b{color:var(--red)}
.tip{margin-top:16px;padding:14px 16px;border-left:4px solid var(--purple2);border-radius:0 12px 12px 0;background:var(--lav2);color:var(--muted)}
@media(max-width:850px){.summary{grid-template-columns:repeat(2,minmax(0,1fr))}.mood-wall{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){body{font-size:16px}.wrap{width:min(100% - 20px,1120px);padding-top:16px}.hero,.section{padding:19px;border-radius:20px}.summary{gap:9px}.stat{padding:15px}.stat b{font-size:1.45rem}.section-head{display:block}.section-head p{margin-top:5px}.weekdays,.calendar{gap:4px}.day{min-height:57px;padding:6px;border-radius:10px}.day b{margin-top:6px;font-size:.7rem}.day small{display:none}.mood-wall{grid-template-columns:1fr 1fr}.accuracy-row{grid-template-columns:68px 1fr 53px;gap:8px}}
</style>
<link rel="stylesheet" href="learning.css?v=9490f7d38b22"><style>.sticky-words{white-space:pre-wrap;overflow-wrap:anywhere;font-size:16px;line-height:1.8;margin:12px 0 18px;color:#44394f}.sticky-label{display:inline-block;font-size:13px;letter-spacing:.06em;color:#775586;font-weight:700}.joy-note{background:#fff1c5!important}.mood-wall .note{min-height:190px}</style></head>
<body data-learning-dashboard>
<main class="wrap">
<div class="topbar"><a class="back" href="index.html">← 回到全书学习中心</a><span id="todayLabel" class="date"></span></div>
<header class="hero"><span class="eyebrow">LEARNING JOURNAL</span><h1>我的学习素养</h1><p>把每天一点点的学习，慢慢连成一条看得见的路。</p></header>
<section class="summary" aria-label="累计学习数据">
<article class="stat"><span>累计完成</span><b id="totalDone">0 项</b><small id="totalAttempts">0 次互动判断</small></article>
<article class="stat"><span>累计复习用时</span><b id="totalTime">0 分钟</b><small>只统计学习页活跃时间</small></article>
<article class="stat score" id="scoreCard"><span>累计正确率</span><b id="totalAccuracy">—</b><small id="scoreHint">完成互动题后显示</small></article>
<article class="stat"><span>学习天数</span><b id="studyDays">0 天</b><small>有用时或答题记录的日期</small></article>
</section>
<section class="section"><div class="section-head"><h2>本月学习日历</h2><p id="monthLabel"></p></div><div class="weekdays"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div><div id="calendar" class="calendar"></div><div class="legend">少 <i></i><i></i><i></i><i></i> 多</div></section>
<section class="section"><div class="section-head"><h2>心情便利贴墙</h2><p>心情没有好坏，它只是今天的天气。</p></div><div id="moodWall" class="mood-wall"></div></section>
<section class="section"><div class="section-head"><h2>最近正确率</h2><p>60%及以上显示绿色，低于60%显示红色。</p></div><div id="accuracyList" class="accuracy-list"></div><div class="tip">红色不是失败提示，只是在提醒：这一类题值得回到教材和互动页再练一次。</div></section>
</main>

<script src="learning-core.js?v=9275352156f8"></script><script src="learning-data.js?v=b9953288c334"></script><script src="learning-ui.js?v=410a34ed8ccd"></script></body></html>
